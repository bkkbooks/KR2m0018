body:
  text: 校讐畧六武英殿校刋二十二史考證舊唐書至元史共一百三十六條舊唐書則天紀長安三年七月殺右金吾衛大將軍唐休璟按新書七月庚戌休璟自涼州都督召為夏官尚書同平章事考之本傳無被殺之事亦未嘗為金吾大將軍顯有訛闕元宗紀先天二年七月李令問殿中監實封三百户按李靖傳令問遷殿中少監封宋國公實封五百户此有脱誤開元二十一年九月封皇子溢為濟王按此已見十三年三月此屬重出開元二十七年十二月是歲葢嘉運大破突厥施之衆擒其王送於京師按七月已書此係重出天寶十三載春正月安慶緒獻俘于行在按綱目十三載正月安禄山入朝禄山本傳十三載正月謁於華清宮則獻俘者乃禄山非慶緒也上元二年九月制自今已後朕號惟稱皇帝其年號但稱元年去上元之號其以今按其以今三字下闕以十一月建子為嵗首詔及十二月建丑并明年寳應元年建寅月事大厯四年秋七月以澧州刺史崔瓘為潭州刺史湖南團練觀察使案本文下自湖南鳳翔移鎮盩厔至以京西兵馬使李忠臣為鳳翔尹代皇甫温移鎮陜州共三十三行皆大厯五年事誤入於此今校改大厯八年李棲筠彈吏部侍郎徐闕按本文下應接丁卯幽州節度使朱泚加檢校户部尚書至戊子詔京官五品以上各言封事共二十三行向俱誤入九年而朱泚加檢校户部尚書一行又復錯亂於中今校改大厯十四年閏月以夀州刺史杜亞為江西觀察使按大厯十二年亞已為江西觀察使本傳徳宗立入朝此應是代亞者考張鎰傳徳宗即位由夀州刺史遷江西則此當是張鎰也二年十一月詔恒州刺史襲髙麗朝鮮郡王李惟岳按此削惟岳官爵詔也惟岳封隴西郡王此髙麗朝鮮四字應誤憲宗本紀元和二年後脱三年正月至三月事元和十二年九月以御史中丞為京尹脱人名穆宗本紀十一月以李翺為華州刺史按是年六月翺已貶朗州考李宗閔傳當為宗閔父䎖敬宗本紀開成三年十月以髙霞寓為夏綏銀宥節度使按髙霞寓以寶厯二年四月卒此誤懿宗本紀咸通十年正月蔣伸罷知政事案伸二年九月罷政此係錯簡哀帝本紀二年十月削奪荆南留後趙匡凝官爵案前八月已書此係重出禮儀志厯考前規宗祀明堂必配五郊預入明堂自縁從祀按唐文粹及英華必配下脱去上帝而伏羲五代本配凡九字自五精之神五星所奉矣按下應接以是其是人主之象云云原本以字譌矣下誤接其又以五方五帝五官從祀云云共誤二千三百餘字今校改中宗紹運舊邦維新按文粹二語下有睿宗繼明天下歸仁二句上文自髙祖太宗而下厯叙功徳不應獨遺睿宗明係闕畧祭法稱王立七廟一壇之廟而七按文苑英華一壇下脱二墠王制云天子七廟三昭三穆與太祖凡十六字厯志沒日法一千七百云云按此文舊本錯列于前文土王日之下今改正檢律候術氣日按術字應在氣日下舊本于二十四氣之律候日晷錯綜混雜又如求盈虚等術及推月行與黄道差數大衍步五星術行數參差不齊又多脱漏今據新書校改輿服志稱引周禮輿服志按輿服志起于後漢周禮無之誤也經籍志經録五百七十五部六千二百四十一卷按今止五百七十一部六千二百二卷史録八百四十四部一萬七千九百四十六卷今按止七百七十三部一萬五千七百五十一卷子録七百五十三部一萬五千三百三十七卷今按止七百四十九部一萬四千八百三十一卷集録八百九十部一萬二千二十八卷今按止八百七十九部一萬一千八百七十五卷其中分類子目亦多不符撰人姓名每與新書互異如毛詩駮王伯興撰新書作王基喪服要難趙成仇祈問答新書作袁祈至以韓詩翼要為卜商撰則尤譌謬之甚者也后妃傳虢男裴徵尚代宗女延安公主按肅宗女郜國公主下嫁裴徵此誤作代宗而延安又穆宗女也一語中凡有三誤睿真皇后沈氏后父易直易直子介福介福子士衡按易直子乃易直父介福子乃介福父新書中甚明王雄誕傳髙祖聞伏威據有吳楚遣使諭之雄誕率衆討之遣使諭之下有闕文應脱去伏威遣公祐數語長平王叔良傳武徳元年師鎮涇州以禦薛舉按綱目是禦仁杲非禦舉也時舉已先卒矣蕭瑀傳瑀薨髙祖為之舉哀按瑀薨在貞觀二十一年髙祖安得為之舉哀房元齡傳祖雄字子繹褐州主簿按隋書房彦謙傳父熊釋褐州簿不載其字新書宰相表世系字子彪据此子字下闕彪字而繹乃釋字之誤也劉世讓傳髙祖無可任者按髙祖下有脱文陸象先傳象先四代孫太和四年釋褐㕘軍文學四代孫不詳其名係闕文蘇瓌傳父朂貞觀中台州刺史按瓌從父兄幹父名朂瓌父不應亦名朂新書本傳不書宰相世系表名亶宜以新書表為是宗楚客傳武三思引楚客為兵部尚書同中書門下三品按新書楚客拜同中書門下三品已在誅三思後本紀亦同婁師徳傳萬嵗登封元年轉左肅政御史大夫按萬嵗登封即萬嵗通天也在證聖後下文復書證聖元年明倒置矣新書無萬嵗登封元年句此應是衍文韋湊傳使三綱叙十等減若者善善明惡惡著也按十等二字下有闕文阿史那社尒傳蘇尼失者啟民可汗之母弟社尒叔祖也其父始畢可汗按始畢啟民子蘇尼失兄子也云其父誤李光弼傳懐州平以功進爵臨淮郡王按封王在寶應元年此臨淮郡公非王也嚴武傳上皇誥以劍兩川合為一道按方鎮表是代宗廣徳二年非上皇誥也楊綰傳進士加文明經加闕按新書選舉者進士加雜文明經填帖今補楊朝晟傳按一百四十四卷復立楊朝晟傳顯係重複惟傳中年月小有不同班宏傳故叅得罪宏頗有力焉按上下俱有闕文李晟傳愿聞變登子城懸縋而下水由窻而出按張孝忠傳當是由水竇而出譌誤顯然裴延齡傳請於右藏庫分置季庫月庫給納諸司錢物按新書帛以素出以色入者為月庫月庫訛月給今改正竇參傳縣人曹芬凶暴醉毆其女弟族人救之不得遂投井死參捕理衆官請俟免喪參曰以喪延罪是殺父不坐也按新書作父救不止恚赴井死是族人乃其父之譌今改正程日華傳李寶臣吞削藩隣有恒冀深趙易定滄徳等八州按寶臣傳時有恒定易趙深冀六州之地後乂得滄州以七州自給又按陽惠元傳與寶臣傳同俱無徳州則八州為七州之譌德字衍文也陽惠元傳李正巳有淄青濟海登萊沂宻徳曹濮徐兖鄆十五州之地按淄青至兖鄆僅十四州考通鑑李正巳先有淄青齊海登萊沂密徳棣十州及李靈曜之亂又得曹濮徐兖鄆五州據此則德字下當脱一棣字濟字當是齊字之誤今改正李吉甫傳裴垍為僕射判度支按垍未嘗為僕射判度支新書作裴均蘄王緝傳咸通八年封按新書緝以是年薨非始封也陳王成美傳第十九男儼宣城郡王按新書宗室表儼為元宗子陳王珪之子與此不合李蔚傳拜太常卿尋以本官同平章事加中書侍郎與盧擕鄭畋同輔政按此數語當作下文乾符四年上索元禮傳枷研楔總按通鑑作楔轂其首而加楔也總字譌今改正祝欽明傳后無祭天之事按上下文不接疑是錯簡王澣傳澣新書作翰按與齊澣傳連屬明是傳冩之譌當從新書西突厥傳木杆與沙鉢畧可汗有隙按新書乃是木杆之子大邏便也此誤迴紇傳吐蕃徵求無厭按新書作迴紇下文言北庭之人既苦迴紇乃舉城降則吐藩二字誤也今改正天竺國傳仍求有及名其軍按新書作丐名其軍有及二字衍黄巢傳鄜延拓拔思恭之師屯武功按新書鄜延李孝昌夏州拔思恭是鄜延下脱李孝昌夏州五字唐書髙祖紀武徳六年四月封子元璹為蜀王按髙祖諸王傳漢王元軌是年封蜀王璹當是軌字之譌則天紀長安元年十一月武三思罷按三思乆視元年正月已書罷此複出禮樂志内命婦采桑位于壇下按此下通典有當御位東北南向西上外命婦采桑位於壇下數句此脱載藝文志李喜漢書辨惑三十卷按舊書作李善善本傳亦載取著辨惑三十卷此志作喜誤後載李善辨惑一十卷係重出卷數亦誤宰相表神功元年八月三思檢校聖厯元年八月復書神功元年八月欽望為文昌右相聖厯二年復書聖厯元年二月欽望罷乆視元年二月復書開元二年正月懷慎檢校黄門監三年正月復書皆重出而先書悞也宰相世系表按世系表大端紕戾官爵諡號或書或否或丞尉而不遺或卿貳而反缺或書其兄弟之官或備書其褒贈之職更或其生平所履厯及曽未嘗居是官者龎襍淆亂不可究詰以表序昭穆此非所重故不詳載王璵傳乾元三年拜蒲同絳等州節度使俄以中書侍郎為刑部尚書七月出為蒲同絳等州節度使非自蒲州入相也傳中顯誤又云璵曽孫搏别傳考搏實附傳未嘗専立傳李回傳徙撫州長史卒按舊書回貶撫州再入朝為兵部尚書後出成都尹劍南西川節度卒據此非卒于長史也李逢吉傳父顔按舊書作祖顔父歸期宰相表與舊書同此傳誤田頵傳侯王守方以奉天子譬百川不朝于海雖狂奔澶漫終為涸土按天子下有闕文張琇傳同官人同蹄智夀按同蹄二字不可解當從舊書作周智夀阿史那泥孰傳始歸國妻以宗女賜名忠按泥孰與忠本二人忠别有傳附社爾新書思摩傳阿史那忠為左賢王泥孰為右賢王是明以忠與泥孰為二人矣李忠臣傳以忠臣為汝蔡六州節度使按方鎮表淮南西道節度使于上元二年増領陳鄭等九州徙治安州號淮西十六州無所謂六州也六字上當脱十字舊書作十一州則以六為一也五代史劉鋹傳十二月平韶州按上文已書平韶州又平桂州此復云平韶州當必有誤周行逄傳夫人嚴氏按宋通鑑作鄧氏吳越世家自鏐世常重斂其民以事奢侈至雞魚卵穀必家至而日取按吳越備史載鏐節儉衣衾用油布常膳惟甆漆器又錢易家話稱鏐公宴不貳羮胾衣必三澣然後易通鑑考異謂鏐起于貧賤知民疾苦必不至窮極侈靡也與此所載異宋史天文志主御羣靈軌萬神圖据隋志軌作執此誤一曰鐵鑕晉志作鈇鑕此誤鐵朔而明見東方曰仄胐匿則政緩漢志作仄匿此文誤倒胐字於匿上見于輿見按下見字乃鬼字之訛丁巳星出左史東史當作更字形相似而訛五行志諫譏大夫程松譏乃議字之訛律厯志後魏延光三年按延光乃後漢安帝年號漢誤作魏然則魏曹王製律據魏志曹王乃柴玉之誤地理志淮安五河注沱漴監本訛作馳崇今改正信州弋陽注康定復置監本置訛廢今改禮志東偏門曰迎禧据通考迎禧上脱曰承和西偏門六字以銅為文鹿或羣邪象据通考羣為辟字之誤惟演引本朝孝明懿徳祔太祖故事按懿徳乃太宗后應據通考作孝章樂志飲福禧安據通考禧乃禮字之誤輿服志金塗銀鐵胎杆鞫四按本志有銀裹鐵鋦與通考同此鞫字係鋦之訛金塗銅手把葉叚拓义二金塗銅义頭施泥行馬二兩义字監本訛又今據通考改正康定元年監本作三年按康定止有元年今改選舉志元宗初以省試春淺天尚寒據通考元應作光充養士費監本充訛兑今改正職官志國朝以秩髙罕除監本秩訛秋今改自紹興二十年蔡熺始據通鑑蔡乃秦字之訛二十年應作十八年惟太常大理不併詔太常少卿一員監本不併詔訛不能紹今据本志及通考改直超韓本等正官按通考韓乃轉字之訛食貨志管當一員按職官無管當之名應据通考作管勾江南之南安按南安宋屬江西訛作江南蒲孟闕等按闕係閔字之訛古渭邊砦監本渭訛謂今改正兵志騎射注陜華陳涇鄜按陳𨽻京西應依建隆注作秦衙隊注陜按陜字當依建隆之制作峽防秋以八月十五日止防春以正月十五日止按通考兩止字俱作上此誤藝文志契丹官儀及碧雲霞附按梅堯臣作碧雲騢霞字誤劉子三卷注劉書撰按通志乃劉勰撰此書字誤薛叚成式集七卷按薛字衍魯元機詩集一卷按魯乃魚字之訛宰輔表大中祥符九年王曽張知白並除叅知政事据通鑑九年下脱九月二字併脱載陳彭年免拜天禧元年按南本載二月陳彭年卒此脱吕夷簡判陜州按陜乃澶字之誤元豐三年據通鑑此表第四格脱載九月薛向罷元豐五年據通鑑脱載吕公著罷寶祐四年十二月庚申按此下闕載蔡抗罷事世系表令赫下子綸按監本脱子綸二字今照南本増符彦卿傳建隆四年按建隆止有三年此云四年誤王延徳傳再遷供奉官㑹髙昌國遣使朝貢遣延徳使焉按此卷中有兩王延徳宋史新編亦兩人類叙今考宋㑹要使髙昌為供奉于延徳則此王字或于之訛也王隨傳遷禮部侍郎監本遷訛選今改吕夷簡傳子公弼抜軸法監本軸作轉今從閣本及南本改王珪傳恕又誘教髙遵裕子士京上奏南北本俱作道裕今從宋通鑑及東都事畧改范仲淹傳子純禮張來除起居舍人按東都事畧來作耒南北本俱誤韓維傳今體制終畢體字應從東都事畧作禮趙抃傳在䖍與成都南北本䖍俱作處今從東都事畧改䖍錢惟演傳易孫景諶且委以戎瀘蠻事監本委訛以從南本改正張方平傳何名輕舉監本名譌多今改胡宿傳從字宗愈殿内卒南北本俱譌殿為修今據東都事畧改遼史地理志宛平縣本晉幽都縣按清類天文分野之書唐建中初立燕都縣石晉割地賂遼遼改幽都縣統和中改宛平此誤作本晉幽都縣且統和二十三年訛作開泰元年義宗傳以莊宗后夏氏妻之按五代㑹要莊宗昭容夏氏封虢國夫人據此則后字有悞蕭思温傳周主北侵與其將傅元卿李崇進等分道並進據通鑑崇進乃重進之訛耶律資忠傳四年再使髙麗按聖宗本紀資忠再使為開泰三年此傳訛三年為四年王鼎傳清寧五年擢進士第據道宗本紀為清寧八年此誤蕭翰傳委事于李從敏經趍行在據資治通鑑從敏為從益之訛西夏紀定難軍節度使李繼捧來附按繼捧未嘗附契丹盖繼遷之誤金史熙宗本紀天眷三年宋將岳飛張俊韓世忠率衆渡江據續通鑑本末補此遺楊沂中而誤舉韓世忠天文志左右有珥上有背氣兩重舊本訛背為皆今改正厯志覆減之餘為内分舊本訛作為内外今從南本改正合差日順加退減順字下監本衍一在字今刪順在盈厯以差日差度加之監本脱順在二字今増又後文旁注其順退所在盈縮順訛為顯今改依倣劉曜時孔挺晁崇之法按宋志沈括議本作孔定此誤作挺五行志邢洛深冀按洛當作洺地與邢冀相連洛洺字形相似而誤耳宗端修傳章宗避睿宗諱改宗氏為姬氏按中州集傳乃衛紹王避世宗父諱改宗為姬與此互異元史太祖本紀嵗癸丑按上文壬戌下文甲子丑應是亥英宗本紀十月甲午太白經天以上文甲子推之應作丙午甲午誤也地理志丑三年復置按丑字南北本俱同今據大寧縣志改作廿蘇布台傳按一百廿一卷已載蘇布台傳雖與此傳詳畧不同而實則一人係重出竒都爾傳按從子呼喇珠已附傳於此而一百三十三卷又有呼喇珠傳事實皆同後傳重出哈噶斯傳按阿都齊事實已附載此傳而一百三十五卷又復立傳後係重出皇朝通志卷一百十
