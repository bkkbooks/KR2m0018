body:
  text: 欽定四庫全書皇朝通志卷一百五校讐略一臣等謹案鄭樵校讐略著論六十九條其總序云册府之藏不患無書校讐之司未聞其法欲三館無素餐之人四庫無蠧魚之簡千章萬卷日見流傳故作校讐略其所著論大約以搜求闕逸編次類例為重事而考核參訂之法不與述焉蓋鄭氏生未際煥文成化之時目不窺金匱石室肆其搜訂僅據一家所見思以綜貫古今故用力勤而研考未及所云校讐特藝文略之凡例云耳我朝文治光華經籍大備列聖御纂欽定之書皆稟睿裁一時操觚載筆之士研精覃思從事稽考皇上聖學髙深幾餘念典歲時無間凡發為文章大而義理小而名物放彌卷密巨細兼賅時而辨析字句指抉音義洞見古今覺劉向揚雄劉攽曾鞏以校中祕書為能盡職業者於廣大精微之藴毫無所見始知聖人之理足而識卓也乾隆初年特命武英殿重刻十三經二十二史御製經序有云訓詁繁則蹖駮互見卷帙重則亥豕易訛爰敕詞臣重加校正其於經文誤字以及傳注箋疏之末協者參互以求其是各為考證附於卷後史序亦云辨訛别異是正為多卷末考證一視諸經之例當時搜求辨晰咸仰集成布在琅函指歸有定乾隆三十七年命輯四庫全書備書契以來未有之大觀徵薄海之遺籍録大典之散編每一書撮舉大端標列簡首名曰提要逐篇奏御仰承親定告成之日彚為總目二百卷其中考辨繁賾徵引明確實為萬古學海津逮要塗臣等纂輯校讐略恭編御製文考定經籍者為一卷武英殿重刋經史考證為五卷欽定四庫全書提要考證為二卷不臚著作之富惟取校讐之精以别於諸史經籍藝文之志以符鄭氏之例使樵得親逢盛際亦將以一得之愚為一職之效其慶幸當何如矣御製文考定經籍五篇御製讀周易枯楊生稊辨詁易大過之九二曰枯楊生稊王弼注云楊之秀也孔頴達謂枯稿之揚更生少壯之稊取象顯而易見陸德明經典釋文從之考夏小正云正月桞稊稊也者發孚也戴德自釋其文確然可信足與弼注相發明且微獨王孔之説為然也唐以前諸儒講易者莫不然即鄭康成書作荑而解為木更生虞翻詁作稚而解為楊葉未舒辭雖小異義實不相逺也惟朱子本義以稊為梯且訓為根謂榮於下者其説本之程傳而程子則舉劉琨勸進表發繁華於枯荑為證夫琨信筆為文無與易理然亦未明言根義而荑之訓又為草琨所謂枯荑安知非在彼而不在此其不足據審矣程朱之意不過以卦體二爻初隂在下遂以為下生根稊而於五爻老隂在上則以為上生華秀夫以二之比初為老夫得女妻五之比六為老婦得士夫可也若拘上下爻之象以根稊華秀分上下而言則不可朱子不又云乎榮於下則生於上既曰生於上非秀而何矧植物之性其生莫不由根而幹而枝而芽蘖若舍稊秀而專言梯且訓為根則所云生於上者曷所指乎考之朱震河上易傳曰二變而與初二成艮巽木在土下根也枯楊有根則其稚秀出稊稚出楊之秀也震未嘗不兼言根而引而至於稊則較程朱之説為賅舉矣間嘗綜爻象之辭而覆按之生梯必當以弼注為正蓋陽雖過而濟以隂故能成生發之功譬枯楊之生稊始孚秀而具生生不已之象猶老夫得女妻之過以相與也故無不利也五爻生華直當作華絮解陸佃埤雅云桞華一名絮是其義矣蓋楊而至於華絮其生意已過自此以往將就衰落故不可久也亦猶老婦得士夫之可醜也則以象辭釋爻辭其義自合即以卦體證爻象亦無弗合又何必泥程朱之曲解為梯乎但梯之為字雖今時所行大戴禮亦從木然詁解無異義或出刋寫之訛而張參五經文字則列稊於禾部唐國子學石經本漢鴻都之遺最為近古而木旁之梯則説文廣韻並訓木階與發榮義無涉亦不可以不正臣等謹案羣言淆亂衷諸聖生稊之説自鄭康成王弼虞翻孔頴達陸德明各執一解即程朱大儒亦不能無偏駁也恭讀御製於卦位上下不泥舊説而一以物性斷之隂陽生生之妙理不解自喻取朱震之兼詞證張參之小學而梯與稊之音義益明經訓昭於星日彼白虎觀諸儒講同異稱制臨決者蓋未之見及也御製麋角解説壬午為鹿角記既辨明鹿與麋皆解角於夏不於冬然月令既有其言而未究其故常耿耿焉昨過冬至陡憶南苑有所謂麈者俗名長尾鹿可為蠅拂即麈尾或解角於冬亦未可知遣人視之則正值其候有已落地者有尚在􅑠角或雙或落其一者持其已解者以歸乃爽然自失曰天下之理不易窮而物不易格有如是乎使不悉麈之解角於冬將謂月令遂誤而不知吾之誤更有甚於月令者矣然則月令遂不誤乎曰月令之誤誤在以麈為麋而不在冬之有解角之獸也蓋鹿之與麋北人能辨之而南人則有所弗能麋之與麈亦如是而已耳且説文訓麈有麋屬之言而名苑則又曰鹿大者曰麈羣鹿隨之視尾所轉而往夫鹿也麋也麈也逈然不同亦不相共羣而處實今人所知者而古人乃不悉其孰為鹿孰為麋孰為麈則月令不云夏至麋角解冬至鹿角解為幸矣而又何怪乎其誤麈為麋也耶既釋此疑因為説以識之月令古書不必易靈臺時憲則命正訛以示信四海焉臣等謹案麋與鹿皆解角於夏麈解角於冬乃物性之本然亦天地之自然也皇上以至誠之德盡物性以參天地得善讀之間驗親見之徵格物致知曲成不遺之道在是矣至諭改靈臺時憲而於月令辨其誤而仍存其文更足見尊經好古之睿懷云御製讀禮記文王世子篇文王世子記周公抗世子法於伯禽引仲尼曰聞之為人臣者殺其身有益於君則為之况于其身以善其君乎周公優為之鄭康成訓于讀為迂迂猶廣也大也後之説經者多傅會之孔疏則以為周公之益君於身優饒於德廣大而黃敏求陳祥道方慤則或以為周公委曲其身以正其君或以為迂身非直躬或以周公抗世子法為致曲是皆不衷於理夫周公攝政時成王已為君不可撻故撻伯禽以警成王其理甚正而其道甚直初非有迂曲遷就之私孔頴達疏申引廣大之釋委曲煩言以致經義反晦偶因檢永樂大典得陳懋賞集説云况于正其身以善其君乎此大人正已而物正之事語較直截夫于詮為於義固當矣而身字解尚未能親切因考古篆身作子作二字相似疑或當時傳寫之訛若作於其子以善其君則與周公所行適合而於理於文皆無弗合康成蓋未思及子字之誤為身字遂強附訓釋後儒益從而為之詞使孔子之言周公之事皆不得其正夫強解以誤後學不可乃因強解而誣孔子並以誣周公則尤不可是不容以不辨但經文沿誦日久無改正之理姑記余所見以俟後之考古者臣等謹案唐開元易尚書古文從今文而改洪範無陂為無頗是以後人之韻改古人之文也宋儒謂論語學易章五十當作卒辨者以篆文卒字與五十字逈不相侔是以後人之字改古人之文也我皇上考二戴之傳述揭六書之淵微於身子二字篆文相近致誤之處特為指明誠為探萬古文字之源而理正詞安鄭孔以下諸儒之傅會遷就支離轇轕俱無所事矣御製三韓訂謬嘗讀後漢書三韓傳稱辰韓人兒生欲令頭扁皆押之以石訝其説之悖於理而肆為詭誕以惑世也夫以石押頭壯夫且不能堪而以肆之初墮地之小兒實非人情所宜有間考三韓建國本末諸史率多抵牾以方位準之蓋在今奉天東北吉林一帶壤接朝鮮與我國朝始基之地相近國朝舊日兒生數日即置卧具令兒仰寢其中久而腦骨自平頭形似扁斯乃習而自然無足為異辰韓或亦類是耳范蔚宗不得其故從而曲為之解甚矣其妄也且如漢人生兒常令側卧久而左右角平頭形似狹蒙古人生兒以韋𢃄束之木版植立於地長則股形微箕此亦皆習而自然無足為異藉如蔚宗所言豈漢人蒙古亦皆以石押之令其頭狹而股箕乎若夫三韓命名史第列馬韓辰韓辨韓亦曰辨辰而不詳所以稱韓之義陳夀魏志直云韓地韓王魚豢魏略且以為朝鮮王準冒姓韓氏其為傅會尤甚蓋國語及蒙古語皆謂君長為汗韓與汗音相混史載三韓各數十國意當時必有三汗分統之史家既不知汗之為君而庸鄙者至訛韓為族姓何異扣槃捫籥以喻日哉且中外語言不通不能強為詮解者勢也今夫天昭昭在上人皆仰之然漢語謂之天國語謂之阿卜喀蒙古語謂之騰格里西畨語謂之那木喀回語謂之阿思滿以彼語此各不相曉而人之所以敬與天之所以感則無弗同若必一一以漢字牽附臆度之能乎不能夫韓與汗音似義殊謬而失之誣猶可也至於以石押頭之謬實悖於理斯不可也然則余之三韓訂謬之作烏容已乎哉臣等謹案史家之失穿鑿為甚蓋由見理不明而設詞多誕也三韓之名出於當時之自稱而不習其語者遂以為韓地韓王甚且以為韓姓固罔知汗之當作何字且汗之當解何義也字義不明無惑乎它説之悉悖於理矣有御製訂謬之作而三汗之字之義乃昭然足以破千古之訛矣此其弊至遼金元三史而益棼人地官名俱無正音皇上特敕改正三史國語解頒之學官以正托克托宋濓之舛其詳具見本書云御製道命録識語昨命詞臣校勘永樂大典得李心傳道命録一册集當時論伊川程子之事以道屬之而以命惜之所見不衷於理曽題詩帙首並序而正其失兹內廷翰林覆校天祿琳琅舊藏有元板道命録十卷重以永樂大典本校之則前六卷相同者過半其刋本有而寫本無者計二十八條第七卷以下則寫本皆不録疑其為未全之書及細檢之又有寫本所録而刋本無者凡八條似大典别有所據考李心傳原序專以伊川為言而刋本則兼及朱子並附濓洛關閩事復考程榮秀序云李秀巖道命録五卷梓在江州燬於兵榮秀嘗得而讀之疑為初稿欲刪定而未成兹因原本略加釐次十卷如左云云今大典寫本止載伊川事與心傳序合或寫本乃鈔江州初梓之本而龜山書院所鐫十卷兼及朱子諸人乃榮秀增定之本耳因識原詩後以俟考其元板書前篇已有甲子題語兹不復録臣等謹案永樂大典在當時以為搜采極博矣而所載道命録尚為不完之本證以天祿琳琅之元刻益信我朝祕府儲藏之富前古無倫也皇上題詩附識於兩本多寡完缺之故校勘必審辨析必詳典學精勤有占畢下士所未能萬一者蓋皇上於四庫全書呈進時每親加乙覽聖心所會發為天章凡數百餘首美富奧博莫測津涯咸在御製詩集中兹以本書之例不具載云皇朝通志卷一百五
