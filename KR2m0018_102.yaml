body:
  text: 藝文畧天文類第七天文算術厯數臣等謹按鄭志天文類原分三門今依類編次其算法諸書専為天文而作者入天文門亦有與厯數併合為帙者入厯數門至算術一門則専收算書云天文曉菴新法六卷王錫闡撰天經或問前集一卷游藝撰天步真原一卷薛鳳祚撰天學㑹通一卷薛鳯祚撰中西經星同異考一卷梅文鼏撰全史日至源流三十三卷許伯正撰以上見文淵閣著録天經或問後集無卷數游藝撰璇璣遺述七卷掲暄撰秦氏七政全書無巻數秦文淵撰天文大成管窺輯要八十卷黄鼎撰以上見四庫全書存目厯數厯算全書六十卷梅文鼎撰大統書志十七卷梅文鼎撰勿菴厯算書記一卷梅文鼎撰算學八卷續一卷江永撰以上見文淵閣著録厯算叢書六十二卷梅榖成撰以上見四庫全書存目算術幾何論約七卷杜知耕撰數學鑰六卷杜知耕撰數度衍二十四卷方中通撰勾股引䝉五卷陳訏撰勾股矩測解原二卷黄百家撰少廣補遺一卷陳世仁撰莊氏算學八卷莊亨陽撰九章録要十二卷屠文漪撰以上見文淵閣著録勾股述二巻陳訏撰𨼆山鄙事四卷李子金撰圍徑真㫖無卷數顧長發撰以上見四庫全書存目天文類凡二十六部五行類第八隂陽葬書宅書占卜術雜技臣等謹按鄭志五行類三十門今從欽定續通志之例於原目不必盡備凡分為隂陽占卜等門編次如左隂陽御定星厯考原六卷康熙五十二年奉敕撰欽定協紀辨方書三十六卷乾隆四年奉敕撰以上見文淵閣著録禽遁七元成局書十四卷汪漢謀撰陳子性藏書十二卷陳應選撰以上見四庫全書存目占卜卜法詳考四卷胡煦撰以上見文淵閣著録易冒十卷程良玉撰以上見四庫全書存目宅書𦵏書定穴立向開門放水墳宅便覽要訣四卷梅自實撰山法全書十九卷葉泰撰以上見四庫全書存目五行類凡九部藝術類第九書畫篆刻附臣等謹按鄭志藝術類十七門如射奕投壺之類今少専書無可採録惟篆刻印譜則應増入以附於書畫之後焉書畫篆刻附石渠寶笈四十四卷乾隆九年奉敇撰秘殿珠林二十四巻乾隆九年奉敇撰庚子銷夏記八卷孫承澤撰繪事備考八卷王毓賢撰江村銷夏録三卷髙士竒撰式古堂書畫彚考六十巻卞永譽撰南宋院畫録八卷厲鶚撰傳神秘要一巻蔣驥撰以上見文淵閣著録無聲詩史七卷姜紹書撰烟雲過眼録二十卷周在浚撰畫法紀年一卷郭礎撰石村畫訣一卷孔衍栻撰厯代畫家姓氏韻編七卷顧仲清撰畫徵録三卷續録二卷張庚撰月湖讀畫録一卷王樑撰艷雪齋書品二卷畫苑二卷筆墨紙硯譜一卷不著撰人名氏以上見四庫全書存目右書畫印典八卷朱象賢撰以上見文淵閣著録印存初集二卷印存元覽二卷胡正言撰以上見四庫全書存目右篆刻附藝術類凡二十一部醫方類第十醫書方書臣等謹按鄭志醫方類分上下二帙其門目亦甚繁今酌併為醫書方書二門如鄭志原目之脈經傷寒及本草等類即從附見焉醫書御纂醫宗金鑑九十卷乾隆十四年奉敕撰金匱要畧論註二十四卷徐彬註尚論篇八卷喻昌撰醫門法律六卷附寓意草一卷喻昌撰傷寒舌鑑一卷張登撰傷寒兼證析義一卷張倬撰續名醫類案六十卷魏之琇撰蘭臺軌範八卷徐大椿撰醫學源流論二卷徐大椿撰以上見文淵閣著録證治大還四十卷陳治撰馬師津梁八卷馬元儀撰張氏醫通十六巻張璐撰傷寒纘論二卷緒論二卷張璐撰本經逢原四卷張璐撰診宗三昧一卷張璐撰石室秘籙六卷陳士鐸撰李氏醫鑑十巻續補二卷李文來撰醫學彚纂指南八卷端木縉撰濟隂綱目十四卷武之望撰保生碎事一卷汪淇撰釋骨一卷沈彤撰醫學求真録總論五巻黄宫繡撰傷寒分經十卷吳儀洛撰難經經釋二卷徐大椿撰醫貫砭二卷徐大椿撰臨證指南醫案十卷葉桂撰得心録一卷李文淵撰傷寒論條辨續註十二卷鄭重光撰醫津筏一卷江之蘭撰素問懸解十三卷黄元御撰靈樞懸解九卷黄元御撰難經懸解二卷黄元御撰傷寒懸解十五卷黄元御撰傷寒説意十一卷黄元御撰金匱懸解二十二卷黄元御撰四聖心源十巻黄元御撰四聖懸樞四卷黄元御撰素靈㣲藴四卷黄元御撰以上見四庫全書存目方書綘雪園古方選註三卷附得宜本草一卷王子接撰神農本草經百種録一卷徐大椿撰傷寒類方一卷徐大椿撰以上見文淵閣著録成方切用十四卷吳儀洛撰長沙藥解四卷黄元御撰玉楸藥解四卷黄元御撰以上見四庫全書存目醫方類凡四十四部類書類第十一御定淵鑑類函四百五十卷康熙四十九年奉敕撰御定駢字類編二百四十卷康熙五十八年奉敇撰御定分類字錦六十四卷康熙六十一年奉敕撰御定子史精華一百六十卷康熙末年奉成雍正五年告敕撰至世宗憲皇帝御製序文頒行御定佩文韻府一百六卷康熙五十年奉敕撰御定韻府拾遺一百十二卷康熙五十五年奉敕撰編珠補遺二卷續編珠二卷髙士竒輯格致鏡原一百卷陳元龍撰讀書紀數畧五十四卷宫夢仁撰花木鳥獸集類三卷吳寳芝撰以上見文淵閣著録典制紀畧無巻數孫承澤撰經世篇十二卷舊本題顧炎武撰今考為偽托之書考古類編十二卷柴紹炳撰廣羣輔録六卷徐汾撰氏族箋釋八卷熊峻運撰歴朝人物氏族㑹編十卷舊本題禾川南里松山穎侯氏撰今考為尹敏編二酉彚刪二十四卷王訓撰古今疏十五卷朱虚撰三才藻異三十三卷屠粹忠撰三才彚編四卷龔在升撰千家姓文一卷崔冕撰教養全書四十一卷應撝謙撰李氏類纂五十卷李繩逺撰韻粹一百七巻舊本題朱彛尊撰古事苑十二卷鄧志謨撰行年録無卷數魏方奉撰石樓臆編五卷周綸撰五經類編二十八卷周世樟撰同人傳四卷陳祥裔撰古事比五十三卷方中徳撰政典彚編八卷王芝藻撰典引輯要十八卷丁昌遂撰廣事類賦四十卷華希閔撰根黄集十卷楊文源撰三體摭韻十二卷朱昆田撰文獻通考節貫十巻周宗濓撰考古畧八卷王文清撰考古原始六巻王文清撰春秋經傳類聨無巻數王繩曾撰杜韓集韻三卷汪文柏編古今記林二十九卷汪士漢撰古學捷録十巻陳應麐撰讀古紀源九卷何懋永撰經濟宏詞十二卷汪學信編唐句分韻初集四卷二集四卷續集二巻四集五巻馮瀚撰是菴日記十四卷楊擁撰類書纂要三十三巻周魯撰駢語類鑑四卷周池撰以上見四庫全書存目類書類凡四十九部皇朝通志卷一百二
