body:
  text: 欽定四庫全書皇朝通志卷九十一食貨略十一鹽法臣等謹按鹽法之行由來已舊烈聖相承蕩滌繁苛俾民樂利立法之良固前朝所不及惠政之加亦亘古所朱聞如加斤改引蠲逋提綱緝梟禁漏減價平直皆為裕商益民計也至竈户場丁則減額課借息銀老幼孤獨則弛厲禁準販負而一切設官分職莫不盡美盡善此豈漢唐以來除富商為吏使利歸於上者所可及耶至於鄭志所載鹽鐵使管鹽及鐵與茶類為一編蓋以三者之賦當時専設一官總司征𣙜故從類紀而我朝鐵冶之産久無征𣙜茶唯甘肅陜西尚有茶課他省並無専司與歷代沿革互異自不得仍因其舊兹纂通志謹將鹽法列為一編而於茶鐵則附見征𣙜雜稅編兹無贅焉順治元年詹事府通事舍人王國佐疏定長蘆鹽法十四事一復額引以疏壅滯一改引部以速引利一便引價以壯京圉一革防銷以省商費一除濫贖以伸商寃一除變價以止姦欺一清焚匿以杜虛冒一止改引以一引鹽一疏關禁以通引楫一杜擾害以清私販一核場竈以清窩囤一復兩坨以備譏察一免徭助以濟孤商一設賞例以鼓富商從之二年諭各運司鹽法明末遞年加增有新餉練餉及雜項加派等銀著盡行蠲免仍免本年額課三分之一四月又免陜西鹽課三分之二河東巡鹽御史劉今尹以河東向例先納銀後領引商力不敷請循按引納課之例從之又準劉今尹請山西太原府遼沁州亦照河東例改票行引又準劉今尹請原食淮鹽之汝寧歸兩淮巡鹽御史管理原食西和漳縣鹽之臨洮鞏昌歸甘肅巡按管理是年諭河南江南等處鹽課照前朝會計録原額征解四年免江南崇明縣鹽課定山西鹽法道歸鹽運司兼管七年定廣西驛鹽事務歸布政司兼管八年定徴解額課不許分外勒索十二年禁河東長蘆等處派民納課積弊十七年嚴回空糧船夾帶私鹽之禁四川巡按張所志請新鑿鹽井照開荒例三年起課其貧民藉鹽易食自四十斤以上者始納課從之十八年復免崇明縣鹽課康熙元年以淮北引滯改撥寧國府六千五百引和州含山三千五百引每年奏銷以為定額三年免廣東逋欠課銀七萬一千一百餘兩是年以江西吉安府向食粵鹽距粵場千餘里兼有灘磧之險改食淮鹽四年詔免鹽課歷年逋欠時因蠲免直省舊欠錢糧推廣及之以東省旱免額征竈課銀一萬四千八百餘兩定湖南衡永寶三府改食淮鹽又定郴州等十一州縣食鹽免其銷引辦課七年定廣西布政司兼理鹽務改廣東巡海道為廣肇道兼管鹽法九年巡鹽御史席特納疏言兩淮鹽務之苦有六有輸納之苦有過橋之苦有過所之苦有開江之苦有關津之苦有口岸之苦又有分掣三大弊一為加匜之弊二為坐斤之弊三為做斤改斤之弊經部議嚴禁勒石立於橋所及經過關津岸口永行禁止又停止兩淮預征之例十二年仍令御史巡視兩淮兩浙長蘆河東鹽務謹按順治二年巡視各處鹽政差監察御史各一員嵗一更代十年裁巡按遂議並停巡鹽御史以鹽務事交運司管理十三年添設江南安徽驛鹽道其管理通省驛道改為江蘇驛鹽道添設四川督糧道湖北驛傳道俱兼理鹽務十四年改陜西固原道為平慶道管理驛鹽十七年刋刻竈户由單令地丁錢糧照民户地丁例十八年免福建逋課二十年停止盛京銷引聽民人自行煎煮販賣二十一年除廣東各渡口鹽埠額外加增銀六萬五千餘兩二十五年定江西南贑二府仍食粵鹽南贑二食粵食粵鹽康熙十七年改行淮鹽至是仍如舊例二十七年廣東巡撫朱宏請清釐粵省鹽政諸弊從之一禁止課外私派一定商人公平者許永逺承充其作姦犯科者即行飭革另募一各州縣銷引有官引難銷有官引不敷者應酌量增減一土豪謀充卡商踞地為害嚴加禁止一緊要津口應擇佐二廉幹之員駐守盤查一鹽有生熟民間嗜好不一應隨商掣運隨民買食一省城距佛山僅三十里省城掣定之鹽行至佛山應免其復掣一鹽價以水陸運費之多寡定其低昻其攙和沙土諸弊一併嚴禁二十八年豁免河東本年額征鹽池地租及長蘆新增引課又豁免雲南黑井鹽課二十九年定直𨽻宣化府屬聽民自煎食鹽照舊額完課三十二年改廣東驛鹽道為運司裁提舉司改設運同駐劄潮州其廣惠二屬之歸德淡水等場設立分司催徴巡緝三十八年詔減兩淮額課二十萬兩又減浙江鹽課加征銀三萬一千三百兩四十三年江南總督阿山言淮鹽陋規有鹽政差滿餽送有鹽政書差規例有巡鹽到任規費有過所稱掣鹽斤有到任預借息銀請悉行勒石嚴禁以裕商民從之四十八年廣東巡撫范時崇請均派行銷鹽引並改就近食鹽以利商民從之五十三年加增川省鹽引從巡撫年羮堯請也五十七年派京口將軍標下兵一百五十名千總一員駐劄三江營緝防私販五十八年裁山東膠萊分司令濱樂分司兼管裁湖北驛鹽道以糧道兼理五十九年定兩廣鹽務交總督經理雍正元年上以鹽法弊竇叢生其正項虧欠非由官吏需索太甚即由商人用度奢靡之故諭各省鹽政將陋例積習盡情禁革是年議準湖廣鹽價賤時每包以一錢一分九釐為率貴時每包不得過一錢二分四釐二年議準廣西鹽法改為官運官銷是年裁革福建鹽院衙門各官及各埠商人其應征課餉均攤各場交州縣官照數收納又議準廣東鹽法委官監收將場商停設惟留埠商使完課運鹽其無人充商之地著地方官領鹽運銷如引多壅滯聽其通融銷售是年增給粵省竈丁鹽價又議準兩廣舊裁運同一員仍於潮州復設又準福建汀州引課即令該知府管理又定各處行鹽以本年成本輕重逺近腳費酌量時價隨時銷售三年開荆州巴東縣鹽場照淮行引分銷楚北州縣是年裁波羅沖可克地方鹽務通判並駐防官兵五年雲南總督鄂爾泰疏定滇省黑白鹽井減價增薪之例六年定河南汝寧府引鹽停止知府彚銷令各州縣招募水商辦課該州縣按季督催各銷各引又準兩淮鹽場設立竈長保甲稽查私弊又嚴鹽場竈户私置盤鐅之禁按深者為盤淺者為鐅皆燒鹽具又定淮北曬掃餘鹽令商人收買配運酌加引課七年清理山東鹽務添設膠萊運判一員八年除山東青登萊三府鹽商聽該屬民人領票銷賣其課銀攤入地糧征收九年飭兩江總督兼總鹽務十年定廣東子鹽配引之例按餘鹽謂之子鹽正鹽倘有遲缺即以子鹽配引行銷又準加給廣東竈丁鹽價每包一錢二分從總督鄂彌逹請也十一年定淮南三江營設巡道一員督緝又於儀徴之青山頭立専營設守備一員分駐巡緝十二年添淮南儀所監掣官改福建鹽政衙門為鹽法道専管鹽政是年定粵省收買場竈餘鹽以清私販十三年九月皇上登極諭兩淮場竈應征折價錢糧自雍正十二年以前逋欠悉豫蠲免乾隆元年改浙江巡撫為總督管理浙江鹽政舊係布政使兼管裁滇省課務餘銀按舊例正課外有增添盈餘銀以備地方公用定浙鹽增斤改引之法杭嘉湖三所引鹽每引增五十斤松江所改行票引每引增鹽四百斤停止浙江領發餘引定廣西鹽價仍照雍正年部定之數每斤減價二釐二年免兩廣鹽課餘平銀兩按舊例粵商完餉每一千兩餘平頭銀外征收飯食銀十五兩餘平銀二十五兩是年悉令豁免四年定貴州省古州等處鹽埠銷引徴課額古州係新闢苗疆向無引課兹定古州為總埠丙妹永從三角􅋭等處為子埠由古州總埠分撥銷售其商人歸古州同知管轄停止浙省儲餘鹽之例免雲南各鹽井歸公之項及黑井鍋課銀兩定淮鹽貴賤增減之價七年諭閩省有司於應徴鹽課加派長價並巧立單錢各項名色著該督撫通行禁革定福建招商行引之法按雍正五年即招水商行銷是年始行請引準兩廣總督慶復疏言粵省鹽漏太多請將沿海數處分撥改種稻田以重本計又準慶復疏言粵省各埠額引有易銷者難銷者請按地勻撥通融銷售八年議準兩淮乙卯綱未完引額提入癸亥綱閏月內帶銷九年改撥川鹽增引行銷滇省接濟民食其應徴課銀仍照川省舊例計算收納十年準兩淮添鑄煎鹽盤角二十七副十一年豁免海贑二州縣鹽場帶征銀兩十二年定淮鹽運楚裝載船斤例並於湖北漢口建常平倉厫蓄貯遞年未銷鹽引以備接濟十三年加給兩淮引額鹽斤又定運銷江西鹽價價賤時每引以五兩五錢七分九釐為率貴時不得過五兩九錢八分五釐又定江西鹽價照楚省例每引加餘息銀二三錢十六年諭近年淮商急公輸課頗為踴躍著於引額外每引增給十斤又豁竈丁因災帶征折價銀兩又諭兩淮鹽政於公項內動銀數萬兩準煎丁逐年赴官借領春借冬還不必加息又各省鹽引原聽自相交易無官為限制之例惟淮鹽行運江楚曾因撫臣題請將各商運楚成本分定價貴價賤自定價後商人總以貴價銷售經部臣議駁請將貴價盈餘追繳上諭恤商裕民本屬一事若任其屢擡時價則於民食有害勒定賤價商人又以成本有虧紛紛籲請今計各商比年行請價直於成本自可無虧將來即遇年嵗不齊不過如今之所稱歉年而止嗣後淮商即於應貴之年不得將現在所銷價直外復議再增至於豐稔可以酌量平減該督撫會同鹽政隨時籌畫部臣亦不必執定例駁詰至部議已賣貴價復令追繳若云給還食鹽之户於勢固有所不能否則以所餘歸之官帑於政體尤有不可著免其追繳河東鹽政西寧疏請河東續添餘引二十四萬道酌減四萬道其餘二十萬作為定數並請將陜西咸寧等處升斗改照部式舊用升斗較部頒之數加重故請改正俱從之十七年諭蘆商積困之餘若按斤加課未免拮據著將所加鹽斤減半納課永為定額其積欠加斤課銀十四萬餘兩一併豁免按前因長蘆各商積欠甚多令每引加鹽五十斤分派行銷以裕商力續經部覆每年應增課銀八萬九千餘兩至是以該商舊欠甫清若按斤加課未免纍商故輕減一半十八年免天津餘引課銀二十一年以河東池鹽歉收準借長蘆餘鹽配運接濟尋又增復餘引四萬道又定粵東海康等縣場埠統歸官辦二十二年聖駕南巡加惠淮商每引加增十斤不在原定成本之內以二年為限山西巡撫塔永寧等以河東池鹽歉收請運蒙古鹽接濟從之二十四年以河東池鹽歉收準配銷花馬池鹽斤接濟定廣西南寧等府土民鹽井仍歸官辦二十五年兩淮鹽政髙恆奏甘泉江都等州縣食引壅積請撥綱地融銷部議兩淮行鹽口岸通融改撥例有明禁且江甘二縣逼近場竈尤為私鹽充斥之所若派撥綱地非特私鹽易滋透漏而綱地悉為食引所占殊於鹽法有礙應不準行得旨髙寶等十四州縣照鹽政所請其江都甘泉二縣著照部議二十六年諭兩淮鹽務經費浩繁商力不無拮據著廷臣會同該督撫鹽臣詳悉具奏尋議一擬派餘引宜均攤衆商以普利澤一外支銀兩除公務應用不得濫行開銷一辦理常貢宜酌定用數以備查核一鹽政養廉宜裁減五千歸之公項一匣商費用宜嚴加查察以免通綱派纍一綱食引鹽宜照例行銷不得濫為通融一私鹽透漏宜嚴加查緝以疏引目從之又諭長蘆鹽課未完銀四十二萬兩分作五年帶征二十九年加增長蘆鹽價及滇省黑白二井薪本又兩淮鹽政髙恆疏言本年甲申一綱不敷民食請預提乙酉綱引四十萬道分給領運從之三十年準兩淮豫提丙戌綱引給商接濟又準河東額外存鹽照兩淮例配用餘引又酌增山東行鹽餘票雍正元年增餘票五萬道乾隆元年復增一千五百道五年六年增一萬五千道至是又增一萬五千道三十一年準鹽政髙恆請預提丁亥綱引二十五萬道給商接濟三十二年上恭奉皇太后安輿巡幸天津諭將長蘆通綱鹽課改於十一月底奏銷又以兩浙商人籲懇攜衆赴津抒誠祝嘏忱悃可嘉加恩將每引額定鹽斤外加鹽五斤免其輸納課項以一年為滿是年以淮南北各場歉收諭將己丑綱奏銷展至八月題報三十六年上臨幸天津諭長蘆鹽價準每斤暫增銷一文以降旨之日為始定限一年仍照舊值行銷其本年引課分作三年帶徴以舒商力是年上蒞山東諭將乾隆三十五年正課分作八年帶征並準照長蘆之例每斤暫加銷一文定限半年以資充裕三十八年諭長蘆商衆資業素微前兩次巡蒞天津閲視鹺務深悉其情是以節次加恩增價帶徴今翠華臨幸各商無不踴躍歡呼但念伊等第一次銀兩業已完交而第二限帶徴之銀與本年正課同時並納仍不免少形竭蹶著再加恩將三十七年正餘課項自三十八年奏銷後起分限六年帶徴三十九年準長蘆鹽政西寧疏請將乾隆三十六年第三限銀兩並三十七年六限銀兩統俟本年奏銷後分限十年帶征是年山西巡撫巴延三鹽政常齡疏言河東大池産鹽歉薄不敷配運請於河東開濬六小池並撥運蘆鹽接濟從之又準四川總督文綬請令開淘犍為縣鹽井照例徴收課銀又鹽政李質頴以黃河水漫淮鹽被浸請將淮北甲午綱未運引鹽應完正課銀自乙未綱起分限五年帶徴從之四十年又準兩淮將乙未綱限至來年八月造報並準淮北上年被水各商仍將丙申以後四綱帶徴銀分作八年完納又諭河東鹽價未平其小鹽池六處甫經開採接濟所得贏餘未能補足前兩年歉收之數商力不無拮據著加恩照該撫巴延三等所請將從前暫增二釐鹽價再行展限三年俾轉運益資充裕四十一年上奉皇太后安輿巡幸山左諭將山東商人本年應徴乾隆四十年四十一年引票正項銀及未完借項銀自本年奏銷後起限分作八年帶徴四十三年定山西巡撫兼管河東鹽務四十五年上巡江浙途經直𨽻山東諭將長蘆商人應徴乾隆四十四年鹽課內十分之一分作五年帶徴其山東商人並將乾隆四十五年應徴票引鹽課銀自本年奏銷後起限分作六年帶征四十七年豁免淮南商人應繳提引餘利銀二百萬兩先是淮商應繳提引餘利銀分作二十一限完繳時該商已完繳十三限其餘八限尚應交銀三百八十六萬六千餘兩兹豁免二百萬兩其下欠一百八十六萬六千餘兩仍照原限完交上以河東池鹽招商輪换書吏多有掯勒情弊諭山西巡撫農起嚴密查訪力為革除其如何公平輪换不致偏枯之處並令悉心籌畫妥議尋議商人五年輪换最易滋弊請行停止現於各商中擇其殷實者定為長商併將引地分作上中下三等配搭均勻分􅍐掣認免致偏枯又以河東池鹽全係陸運需費浩繁商力時形竭蹶請每斤量加價值二釐連乾隆二十六年請加之價作為定額四十九年又將淮商未繳餘利銀一百八十六萬六千餘兩全行豁免又免淮省竈户所有乾隆四十五六等年帶徴未完銀七千九百餘兩又山東應徴引課銀三十六萬餘兩長蘆應徴引課銀四十九萬餘兩準作八年帶徴兩廣總督舒常疏言粵東舊設總商派捐津貼銀兩散商轆轤轉運積欠甚多請照乾隆二十三年清查積欠例分限帶徴並將總商裁革以杜勒派之漸從之皇朝通志卷九十一
