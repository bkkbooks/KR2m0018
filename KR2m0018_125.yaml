body:
  text: 欽定四庫全書皇朝通志卷一百二十五昆蟲草木畧一臣等謹按鄭樵通志殿以昆蟲草木畧分為八類専採名物志爾雅補註本草疏積數年之勤而始成書然而蒐羅未廣攷證未確往往絓漏舛訛名目牽混臣等奉命續纂通志廣徵博引㕘稽衆説缺者補之舛訛牽混者釐辨之然亦僅就五朝所隸方域版圖書冊記載可攷者彚集増訂若夫天地絪緼化醇草木之變蕃羽毛鱗介昆蟲之亭毓知必有應昌期景運而日新不已者我朝深仁厚澤百數十年來帝徳之廣運皇猷之允塞固已阜百昌而昭大美矣我皇上乗乾御宇聲教四訖隸版章奉正朔者環大瀛數萬里海涵山負動植飛潛莫不含濡聖澤乗時茂育凡奇葩異卉珍禽靈獸錦鱗文介載諸圖史或古無而今有或名同而實異咸仰列聖格致精詳寵題篇什伏讀我皇上御製文集詩集天章炳焕釐正品類雖在微物亦必使辨形析理昭信來兹焉至於臣下扈從奉使身履目擊登諸鉛槧皆可旁收而兼採之猗歟盛哉因地考宜足徴為衆庶福應郅治綏來之實蹟非僅如木禾火䑕前古圖經以耳食傳疑侈陳荒怪者所可比倫萬一也謹詳稽典冊創見之物用仿鄭例分載於篇以資博覽云草類萬年花草本小朶如盞一莖百朶色粉紅而有紅絲雖久乾枯顔色不變仰䝉聖祖御賜嘉名見佩文齋廣羣芳譜藍雀花花如雀有身有翼有尾有黄心如兩目曽經聖祖御製題詠見佩文齋廣羣芳譜金蓮花佩文齋廣羣芳譜曰出山西五臺山塞外尤多花色金黄七瓣兩層若蓮而小六月盛開至秋花乾而不落仰䝉聖祖賜名賦詠並荷天藻親題晚香玉種出西域今京師多種之花如白玉簮入晚更香聖祖賜以今名並荷天藻題詠人葠三椏五葉間成人形産遼陽深山中為醫經上品蓋神臯鍾毓厥草効靈實王氣悠長之徴吉林寧古塔等地所産其品已為稍遜至所稱上黨參直同凡卉矣疊荷奎章題詠知時草産西洋名僧息底斡譯漢音為知時也貢使攜種以至歴夏秋而榮以手撫之則眠踰刻而起花葉皆然其起眠之候在午前為時五分午後為時十分實為遐方異卉仰經睿題箭草有刺著人衣難去仰經睿題黙克爾草實名生漠北野鼠每取藏穴中以為食喀爾喀窮乏之人多有掘得之以充饑然必留少許穴中不欲盡絶其糧恭繹御製讀蘇武傳注闢漢書張宴注謂蘇武取䑕並草實而食之之謬使千古訛傳一旦發䝉振瞶即師古是蘇林之説以為取草實而食之亦所載未詳盖其時為方隅所限局於耳目故也徳哷蘇草塞外叢生䓤翠挺拔經霜則變而為白見佩文齋廣羣芳譜蝎子草産塞外髙四五尺叢生亂草間其葉有毒䝉古謂哈拉垓見佩文齋廣羣芳譜金絲桃塞外徧地叢生六七月花開五瓣如桃而長色鵞黄心微緑一苞出五花開則五花齊放如黄金然見佩文齋廣羣芳譜黄花一朶四瓣合抱如金盞其色鵞黄出汗特穆爾嶺以北經霜顔色愈鮮明見佩文齋廣羣芳譜馬蹄蘭産塞外葉劒樣如蘭堅韌不可斷花翠色可愛秋則結苞成子見佩文齋廣羣芳譜地椹花青紫色花瓣如葵一花八九瓣徑二寸許瓣落盡則花心結子見佩文齋廣羣芳譜翠蛾眉花翠色隨日側映鮮妍有致見佩文齋廣羣芳譜鹿葱色類萱鹿喜食之故名佩文齋廣羣芳譜謂嵇含以宜男花為鹿葱則古人以鹿葱為萱花實一類而二種紅姑娘叢生塞外山谷間結子成苞四瓣如鈴中含丹實狀如火齊亦呼豆瓤兒見佩文齋廣羣芳譜髙麗牡丹藤花而牡丹葉與洛種異見日下舊聞考扁擔草似黍葉稍窄有穗有粒多生田中見佩文齋廣羣芳譜及盛京通志嬌草似香蒲可以飼馬見佩文齋廣羣芳譜及盛京通志馬房節節相生無葉可以飼馬見佩文齋廣羣芳譜及盛京通志星星草葉如韭有穗星星故名見佩文齋廣羣芳譜及盛京通志黄背草層層有節細葉乾之可代茅結屋見佩文齋廣羣芳譜及盛京通志鳳尾草葉莖如鳳尾多生山隂近水處見佩文齋廣羣芳譜及盛京通志矬草可治木器見盛京通志羊草生山原間可飼牛羊西北邊謂之羊鬍草長尺許莖末圓勁如松針黝色油潤飼馬肥澤見盛京通志狼尾草又有馬尾草俱以形相似而名見盛京通志塔子頭窪地叢生其根裹土壅如小塔見盛京通志草芙蓉葉細如皂莢花開同菊瓣見盛京通志日奇花類蝴蝶花而小一莖十數花辰收申放數必奇故名黒龍江出見盛京通志髙麗菊産朝鮮枝葉類萬年菊單瓣色赤黄相間見盛京通志雀兒花黒龍江諸境有之色翡翠似鴛鴦菊而單蒂跗横枝上如鳥之翔見盛京通志老鸛嘴蔓生枝間結角形如鸛嘴入藥治風見盛京通志烟草本名淡巴菰亦稱為烟酒隴旁隙地多種之葉肥大至徑尺食之禦寒見盛京通志猫兒眼草葉紋如猫兒眼故名見盛京通志明開夜合産塞外山中結實纍纍色映紅狀如秋海棠中含紅珠晨放暮斂故名見熱河志烏拉草生塞外細輭而暖可以絮鞋見熱河志烏蘭齊齊克草本髙三五尺葉形尖細有微毛花五瓣有深紅淺紅兩種出準噶爾部見西域圖志察罕齊齊克草名出準噶爾部花五瓣色白葉小而圓本髙尺餘見西域圖志庫克齊齊克草本色緑花狀如梅準噶爾部所生見西域圖志哈喇庫克齊齊克草本色深碧似翠翹準噶爾部所生見西域圖志哈特草本髙三四尺葉小圓而頭岐花五瓣小如豆色白結小實如枸杞子産準噶爾部見西域圖志羊刺草上生刺蜜味甚甘美準噶爾部多有之見西域圖志葉斯穆克草名産回部沿地蔓為藤花紅白子細而扁圓見西域圖志克頗斯草實如繭中有絲如細纑回部人取織為布見西域圖志火草産武定府麥岔蠻地見皇朝職貢圖名䕶蘭葉短而厚與桂葉同大僅如指三四月開花一箭八九朶攅開香清越勝蘭出南海名䕶嶽巖石間見臣徐葆光中山傳信錄捧蘭産琉球國狀如珊瑚樹緑色無葉花從椏間出似蘭較小見臣徐葆光中山傳信録野牡丹種出南海太平山上名什花葉如牡丹無異二三月花開作叢纍纍如鈴鐸素瓣紫暈檀心如碗大極芳烈見臣徐葆光中山傳信録山蘇花一名猿莚花無花無榦出土長不及尺葉如蕉而小堅厚有紋出琉球國見臣徐葆光中山傳信録雷山花産琉球國土名吉茄葉如鐵梗海棠花如牽牛花差小鴉翠色四五月開至十一月結子如豆見臣徐葆光中山傳信録蔬類天花出五臺山生於古樹嫩則色青為菌可食老則色絳為芝可作屏疊經睿詠龍葵葉似酸漿子大如珠或赤或黒世以此當苦菜乃大誤也伏讀御製月令七十二候苦菜秀詩釐辨品彚洵足正千古訛傳番薯有紅白二種性宜沙土蔓生蔽野人以為糧本出琉球國閩地今亦有之我皇上時切民依特命中州等地給種教藝俾佐粒食自此廣布蕃滋仰見子惠黎元之至意苦益菜産盤山澗中似野菊有浮毛三月間採以為食見盤山志日下舊聞考豆苗菜産盤山叢生似豆苗山家採食之作羔極鮮美見盤山志及日下舊聞考蘑菇亦作􅀢菰菌之屬中土絶重之呼曰口蘑生於榆者為榆蘑生於榛者為榛蘑見盛京通志夸蘭蘑菇生齊齊哈爾城東草地内七月入市夸蘭者氊廬椸木之周遭也木氣入土生蘑故名見盛京通志龍芽菜有二種樹龍牙葉似椿而大採其初生者可食地龍芽葉亦相似見佩文齋廣羣芳譜及盛京通志杏葉菜葉似杏可食見佩文齋廣羣芳譜及盛京通志歪脖菜葉圓而大其梗至頂稍彎故名見佩文齋廣羣芳譜及盛京通志灰藋俗名灰條菜見盛京通志攪瓜形類倭瓜而小内生筋絲醬醃蜜餞皆宜食時以筯攪取出之似縷切者見盛京通志步連菜生野中類苦菜葉微大葉如筋見盛京通志山兒菜似菠薐而髙大葉圓鮮可茹見盛京通志河白菜生近水田可采食見盛京通志海藴葉似亂絲又有海藻色黒如髮見盛京通志海帶似海藻而粗俗呼海白菜見盛京通志俄羅斯松一名老鎗菜抽薹如萵苣髙二尺許葉出層層其末層葉葉相抱如毬畧似安菘見盛京通志地螺菜名形如小螺鹽漬可食見熱河志松吉納葱名出準噶爾部根大而穗青髙二尺見西域圖志達爾吉爾小蒜也準噶爾部所産根甚小苗可三四寸見西域圖志薩喇納野蒜名出準噶爾部髙尺餘色青獨莖頂結小花其根有黄白二種味淡可作羮見西域圖志稻粱類早御稻米色微紅較長味甘香六月早熟見聖祖御製㡬暇格物編臣等謹按豐澤園中有水田數區布玉田穀種至九月始刈穫登場我聖祖仁皇帝軫念民依㡬餘省稼一日循行阡陌時方六月下旬穀穗方穎忽見一科髙出衆稻之上實已堅好因收藏其種命待來嵗驗其成熟早否至期果先熟從此生生不已嵗取千百以其生自苑田故賜名御稻並頒給其種於江浙督撫令民間種之今廣被炎方一嵗兩熟實為天降嘉種謹誌於此沙蓬米枝葉叢生米似胡麻而小凡沙地皆生之鄂爾多斯所産尤多恭繹聖祖御製幾暇格物編向來食之者少我聖祖仁皇帝厪念稼穡親辨嘉種性可宜人自此播植流傳利賴羣生謹誌於此烏拉白粟米莖榦葉穂較他種倍大熟亦先時初生於烏拉樹孔中土人以其種來獻遂流布日廣見聖祖御製幾暇格物編黒龍江麥種最佳色潔白性復宜人相傳其種自俄羅斯來見聖祖御製幾暇格物編石窩稻色白粒觕味極香美以為飯雖盛暑經數宿不餲産直𨽻房山縣見日下舊聞考西番穀苗髙如蜀黍穂如蒲奉天等處産見盛京通志髙麗糓大紅色如雞冠髙丈許實如栟櫚子亦奉天等處所産見盛京通志穬麥産黒龍江呼鈴鐺麥見盛京通志秔稗味甘滑如秔亦黒龍江産土人以為秔所化見盛京通志圖圖爾噶準噶爾部所産稻名米不甚黏見西域圖志香米産鳳山縣放䌇等社熟番地見皇朝職貢圖木類瑞樹産長白山自頂至根合十餘丈大數百圍上分十有二大枝莖葉各異具松檜白楊遮勒穆期紫樺白樺密克特白榆八種並生靈芝其上萬木環衛如星拱北實非大椿八千嵗為春秋所可比倫恭繹御製歌詠徴祥紀實用昭神臯鍾秀開我國家萬年有道之基夜亮木生塞外山中枯木根入土千嵗煜有光晶置之暗室可以燭物仰經聖祖御題並荷天章賦詠香片梅種初出㑹稽伏讀御題王冕畫梅詩以名花新品䝉入奎章藻詠實可補羣芳之所未備查克其樹無皮當枝葉青翠時著火即燃燒時有燄而無烟與炭相似瀚海一帶多有之見聖祖御製幾暇格物編扎卜扎雅木出西藏草根結成者製以為椀可解諸毒仰荷御題烏哷音噶克察克徹黙多獨樹名出哈薩克西北其上五枝廣可蔽二百騎仰經御題達蘭海拉遜産塞上其皮可製為筆筒戍邊者迴或以此獻仰荷御題具見綏柔絶域之至意六稜木枝葉皆六稜見盛京通志鸞枝花木本枝葉俱似桃葉有刻缺三月附枝開花或著樹身瓣多而圓深紅色見佩文齋廣羣芳譜黄蒿松松枝葉如蒿生寧古塔石甸之上他處所無見盛京通志伊竒松生吉林北伊竒甸子質瘦勁少枝葉因所生地而名見盛京通志香樹莖直叢生花黄出長白山可取以作香生近石崖者有節名竹節香見盛京通志花柜栁質堅緻蠟蟲食之一名蠟條見盛京通志老鸛眼一名䑕李木堅緻有花紋子赤黒如鴉眼見盛京通志東瓜木似柜栁皮色青質堅中為硯材見盛京通志欂欏樹其葉似槲可以飼蠺今朝陽縣土黙特山中有之見熱河志曬樹塞外樹名其花黄産山中見熱河志六道木生塞外幹有紋六道細如線而界畫甚匀見熱河志呼遜樹名産準噶爾部形如樺其方苞可為木椀其油可以燃燈見西域圖志察爾察樹名形似山茶其葉可以代茶荈準噶爾部所産見西域圖志呀喇菩葉亦對節生白花似梅十一二月實又號君子樹生琉球國見臣徐葆光中山傳信錄古巴梯斯琉球國産樹髙二三丈葉大如柿花五椏八九月實如青果而少扁味香甘閩中亦有之名戊土見臣徐葆光中山傳信録右納樹髙三四丈葉似白桐夏季開花黄瓣檀心琉球國産見臣徐葆光中山傳信録梯姑樹髙七八丈大者合數圍葉抽作品字形四月開花朱紅色長尺二三寸如紫木筆吐燄髙麗種出海外太平山見臣徐葆光中山傳信録悉達慈姑産琉球國樹髙丈許葉類桃子如葡萄穗纍纍深藍色名慈姑奶不可食見臣徐葆光中山傳信録皇朝通志卷一百二十五
