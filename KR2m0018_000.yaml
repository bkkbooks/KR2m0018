  text: 欽定四庫全書皇朝通志總目
  hash: sha256:d8a207e4d45e145598b9e1d6351474a3b847d8f848af24e511ab79e2873eeba7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_000-1a, image: WYG0644/WYG0644-0001a.png}
body:
  text: 氏族畧凡十卷卷一至卷十六書畧凡三卷卷十一至巻十三七音畧凡四卷卷十四至巻十七天文畧凡六巻卷十八至卷二十三地理畧凡八卷卷二十四至卷三十一都邑畧凡四巻卷三十二至巻三十五禮畧凡十二卷卷三十六至卷四十七諡法畧凡八卷卷四十八至卷五十五器服畧凡六巻巻五十六至巻六十一樂畧凡二巻巻六十二至卷六十三職官畧凡八巻卷六十四至巻七十一選舉畧凡三卷卷七十二至卷七十四刑法畧凡六巻卷七十五至卷八十食貨畧凡十六卷卷八十一至巻九十六藝文畧凡八卷卷九十七至巻一百四校讐畧凡八巻卷一百五至卷一百十二圖譜畧凡二卷卷一百十三至巻一百十四金石畧凡七巻卷一百十五至巻一百二十一災祥畧凡三巻巻一百二十二至巻一百二十四昆蟲草木畧凡二巻巻一百二十五至巻一百二十六臣等謹按皇朝通志一百二十六巻乾隆三十二年奉勅撰二十畧之目亦與鄭樵原本同而紀傳年譜則從省葢實録國史尊藏金匱與考求前代刪述舊文義例固不侔也至二十畧中有原本繁而今汰者三都邑畧中樵兼載四裔所居非但約畧傳聞地多無據且外邦與帝京並列義亦未安今惟恭錄興京盛京京師城闕之制以統於尊諡畧中樵分三等二百十品多所臆定今惟恭錄尊諡賜諡以昭其慎金石畧中樵所採頗雜今惟恭錄列聖寶墨皇上奎章兼及御定三希堂帖淳化軒帖蘭亭八柱帖並諸臣奉勅上石諸墨刻有原本疎而今補者二天文畧中樵惟載步天歌今則敬遵聖祖仁皇帝御製儀象考成靈臺儀象志皇上御製儀象考成後編㑹通中西之法以究象緯之運行地理畧中樵以四瀆統諸水而州縣郡道以水為别今則於其不入四瀆者大河以北如盛京京畿諸水大江以南如浙閩甌粤諸水以及滇南漠北諸水自入南北海者並一一補載而河有重源今經聖製考訂恭録以示來兹有原本冗𤨏而今刪併者三藝文畧中樵所列既多舛訛校讐畧中樵所舉亦未精確圖譜畧中樵分記有記無二類而記無多至二十門如繫桐試馬鬭羊對雉諸圖尢猥雜無取今並以欽定四庫全書總目為斷以折其衷有原本之所未聞者三六書畧中以國書十二字頭清篆三十二體括形聲之變化究波磔之源流併以欽定西域同文志臚列䝉古西畨托忒囘部諸字絲牽珠貫音義畢該非樵之穿鑿偏旁所知也七音畧中以國書合聲之法為翻切之總鑰而兩合三合之中有上下連書有左右並書有重聲大書有輕聲細書以欽定同文韻統為華梵之通津以天竺五十字母配合成一千二百十二音又以西畨三十字母别配合成四百三十四音而各釋以漢音漢音不具則取以合聲非樵株守等韻所知也昆蟲草木畧中樵分八類五朝續通志已為補漏訂訛至于中國所無而産于遐方前代所無而出於今日如金蓮花夜亮木之類見于欽定廣羣芳譜普盤櫻額堪達罕秦達罕之類見于聖祖仁皇帝幾暇格物編北天竺烏沙爾齊火鷄箬漠􅱛知時草之類見于御製詩集如竒石蜜食鷟鸑爾之類見于欽定西域圖志尤非樵之抱殘守匱所知矣葢創始之作考校易疎論定之餘體裁益密皆縁遭遇昌期仰承聖訓得以蒐羅宏富辨證精詳以成一代巨觀則樵之瞠乎莫逮亦良有由也皇朝通志總目欽定四庫全書皇朝通志凡例一鄭樵通志倣歴代史例有本紀有列傳又有年譜其自序以唐書五代史皆本朝大臣所修㣲臣所不敢議故紀傳與年譜並訖隋而止續通志於唐五代及宋遼金元各増輯紀傳至明代事蹟具見明史即從鄭氏不載唐五代紀傳之例不加添纂若我國家列聖相承文徳武功臚具實錄者藏諸金匱石室至於臣工事實自有國史列傳及宗室王公功績表傳諸書為之叙述兹編亦仍鄭氏之例不復載入一通志二十畧其氏族六書七音諡法校讐圖譜金石昆蟲草木諸畧皆鄭氏自出新意非前史所有不専繫於一時一代其餘各門與杜氏馬氏二書互有詳畧如通志禮樂職官選舉刑法之目通典通考皆有之通志之食貨則通典有之而通考析為田賦錢幣户口征𣙜市糴國用諸門者也通志之都邑地理即通典之州郡邊防通考之輿地四裔也通志之天文即通考之象緯藝文即通考之經籍災祥即通考之物異也通志之器服則又與通典之嘉禮通考之王禮互見者也大抵通典主乎簡要通考主於周詳通志則取材舊史自加斷制故其自序謂雖本前人之典亦非諸史之文今倣鄭氏之體行文叙事與通典通考兩書實互相發明一通志氏族畧分三十二類頗稱賅洽其遼金元氏族之見於前史者已纂入續通志若本朝八旗氏族通譜於各族得姓所始表之以地系之以名釐然具備今並依類臚次一通志六書畧於源流正變臚列綦詳遼金元各有國書已畧述於續通志我朝國書十二字頭整齊該括變化不窮若夫大文彌耀清篆三十二體尤足握形聲之總究文字之源至於聖化逺布重譯來同凡諸部諸國之各有文字者靡不達自象胥藏於秘閣皇上御定西域同文志於䝉古西畨托忒囘部之字悉皆以次綴書音義畢貫實為前史所未有謹詳載以表大同之化一通志七音畧以三十六字母為主備列内轉外轉諸圖我朝國書合聲切音之法有三合四合之妙皆出於人聲之自然而無所勉强聖祖仁皇帝欽定音韻闡㣲一書實抉翻切之秘奥皇上御定同文韻統以梵音合國書切韻復以國書切韻叶華音字母於是字無遁音書皆備韻近復將遼金元明諸史之傳訛者攷正改譯親加詳定至於畨部輿圖釋家梵典一經繙譯並得凖聲洵足正千秋之謬誤而表天地之元音今並詳列於篇一通志天文畧祇載隋丹元子步天歌而未及推算之法我聖祖仁皇帝奉若天道洞悉精㣲改造六儀輯靈臺儀象志用法簡當所司奉以測驗御製儀象考成其理則揆天察紀其法則明時正度即數可以窮理即理可以定法合中西為一揆皇上復加増輯御製儀象考成後編並按六儀新法參渾儀舊式製為璣衡撫辰儀兼考天官家諸星紀之缺者補之紊者正之勒為儀象考成於是步天定時之道益為精密敬謹登載以補前書之漏畧一通志地理畧先載四瀆而以諸水入於江河淮濟者分條具列自序謂地理以水為主郡縣州道皆由水以别惟是宇内之水不入四瀆者尚多如大河以北則有盛京京畿諸水大江以南則有浙江閩江粤江皆自入於海他若雲南西藏諸水多入于南海如雲南之瀾滄江潞江西藏之雅魯藏布江岡噶江漠北諸水多入于北海如額爾齊斯河色楞格河至於河有重源所謂合流入蒲昌海潛行出於積石者今並列在輿圖紀以宸翰鉅製鴻篇親為考定徴信萬古皆前志所未經収載今悉依鄭氏之例臚列於前其細流支派之不闗於地理者無庸濫入一通志都邑畧凡帝王侯國之都分代具列我朝肇基東土自肇祖原皇帝及興祖直皇帝景祖翼皇帝顯祖宣皇帝皆都興京太祖高皇帝太宗文皇帝都於盛京世祖章皇帝定鼎京師今宜將城郭之制敬謹臚載而宫室苑囿即附見焉至鄭氏附紀四夷之都自以為能逺探遐搜然考其所載如琉球居海島之中大秦居大海之西亦祇約畧言之未能確指其建國之地且以外國所都與京邑並列未免部分失當今擬從刪一通志諡畧凡二百有十品分為三等此乃鄭氏意為増損非時王現行之制若本朝錫諡之典悉出上裁自諸王以及内外大臣之例得請諡者高下予奪各如其分飾終之禮至為隆重此外有以文臣品學而追諡者如湯斌陸隴其韓菼王士正以監司殉難而得諡者如葉暎榴陳啟泰陳丹赤皆非常典我世祖章皇帝定鼎之初即下所司定勝國甲申諸臣之諡皇上表彰忠烈復特頒諭㫖凡明季死事諸臣各加褒奬賜以令諡尤為從古未有之曠典今並据實叙載一通志校讐圖譜二畧與藝文畧相為表裏以編書必先明類例故有校讐畧以圖為經而書為緯有書不可無圖故有圖譜畧我朝文治光昭圖書明備皇上右文典學特詔裒輯永樂大典所載並蒐訪天下遺籍勒成四庫全書每書各繫以提要編以目録於是譌者以正闕者以全校讐之法至為精審而圖譜之流傳者益復粲然大備敬謹詳列以彰觀文化成之盛一通志金石畧分載泉幣鼎彛之款識而於諸家碑刻復按時代列之亦云博矣我列聖天縱多能寶墨流傳照耀海内皇上㡬餘㳺藝奎翰日新故御帖刋於内府穹碑勒在遐陬煌乎莫與並矣至古來金石之留遺者若三希堂淳化軒諸石刻裒集最為美富敬謹彚列用示來兹一通志昆蟲草木畧分為八類已稱該備顧品彚之繁搜羅難盡有内地所無而産於外域者有前代未顯而稱於後世者我聖祖仁皇帝御製㡬暇格物編所載如普盤櫻額堪達罕秦達罕之類殊名别種攷證精詳皇上順時亭育具有化工凡塞外之産為邊内所罕見者如北天竺烏沙爾齊火雞箬漢􅱛之類睿題留詠共識嘉名至于新疆式廓以來異果珍禽列於圖志如竒石蜜食鷟鸑爾之類皆爾雅埤雅諸書所未及登載謹廣為蒐輯非惟供多識之資實以徴茂育之化皇朝通志凡例
