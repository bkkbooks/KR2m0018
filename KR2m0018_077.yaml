  text: 欽定四庫全書皇朝通志卷七十七
  hash: sha256:d17c05560fc048258278465fbae3104d9a5781ba12ebe169ae5d18a06d2195ec
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_077-1a, image: WYG0645/WYG0645-0149c.png}
body:
  text: 刑法略三刑制聽斷凡聽斷刑獄立審結章程以専責守五城提督衙門審理案件除笞杖等輕罪自行完結若情節介在疑似及關繫罪名出入者俱送刑部審擬不得率行自結其直省徒罪案件如有關繫人命者均照軍流人犯解按察使審轉督撫専案咨部核覆仍令年終彚題其尋常徒罪各督撫批結後即詳敘供招按季報部查核凡刑部現審事件如竊盜三犯贓數不多改遣家奴喫酒行凶發遣及賭博擬流販私擬徒軍民相姦擬以枷責等項尋常罪犯於審結之日即行發落仍於彚題疏內聲明遇有特交案件即審明無罪可科亦應覆奏如罪至斬絞仍會同三法司核擬特題其他案件除杖罪竟行發落外犯該發遣軍流徒役及軍流徒折枷鞭等罪倘非尋常經見之事若犯罪文自監生以上武自驍騎校以上或本身雖白丁繫見任大臣子弟犯該斷決者仍照彚題之例詳敘招供文移不拘件數時日隨結隨題俟奉旨之日發落其有酌輕酌重案件即非生監驍騎校及大臣子弟亦視此仍於酌量改擬之處黏貼黃簽進呈御覽各省每年題結斬絞重案刑部於次年開印後分類摘敘簡明事由奏聞又定鞫獄之法凡鞫獄須依所告本狀推問若於本狀外别求他事托拾被告人罪者以故入人罪論同僚不署文案者不坐又鞫獄止將狀內有名人犯審擬如光棍案內夥黨人多仍行嚴拏究審無干牽連者即行釋放凡諸衙門鞫問刑名等項必據犯者招草以定其罪若吏典人等為人改寫及代寫招草增減情節致官司斷罪有出入者以故出入人罪論若犯人果不識字許令在官不干礙人依其親具招情代寫各有司讞獄時令招房書吏照供録寫當堂讀與兩造共聽果與所供無異方令該犯盡供該有司親自定稿不得假手胥吏致滋出入情弊獄囚徒流死罪鞫獄官司各喚本囚及其家屬到官具告所斷罪名仍責取囚服辨文狀以服其心若不服者聽其自行辨理更為詳審違者徒流罪笞四十死罪杖六十其囚家屬逺在三百里之外不及喚告者止取本囚服辨文狀不在具告家屬罪名之限如承審改造口供故行出入者革職故入死罪已決者抵以死罪其草率定案證據無憑枉入人罪者亦革職凡初次供招不許擅自刪改按察使亦不得借簡招之名故為刪節倘有意義不明序次不順與情罪並無干礙者即就近核正申轉將改本備案不得發換銷毁凡官司斷罪皆須具引律例違者笞三十若律有數事共一條止引所犯本罪者聽其特旨斷罪臨時處治不為定律者不得援引為比若輒引比致罪有出入者以故失論承問各官審明定案須援引一定律例若先引一條復云不便照此例更引重例及加情罪可惡字樣坐人罪者以故入人罪論除正律正例而外凡屬成案未經通行著為定例者毋得混率牽引致罪有出入又立斷決之凖凡盜公取竊取皆為盜器物錢帛之類須移徙已離盜所方謂之盜珠玉寶貨之類據入手隱藏縱在盜所未將行亦是其木石重器非人力所勝雖移本處未馱載間猶未成盜不得以盜論馬牛駝贏之類須出闌圈鷹犬之類須専制在已乃為盜其未成盜而有顯迹證見者依已行而未得財科斷凡勘問謀殺人犯果有詭計陰謀者方以造意論斬助毆傷重者方以加功論絞謀而已行人贓見獲者方與強盜同辟毋得據一言為造謀指助勢為加功坐虛贓為得財一概擬死若鬬毆及故殺人獨毆曰毆有從為同謀共毆臨時有意欲殺非人所知曰故其共毆人傷皆致命當時身死以後下手重者當其重罪若當時未死而過後身死當究明何傷致死以傷重者坐罪若原謀共毆亦有致命重傷以原謀為首至亂毆不知先後輕重者有原謀則坐原謀為首無原謀則坐初鬬者為首以堪殺人之事為戲如比較拳棒之類因而殺傷人者為戲殺戲傷因鬬毆而誤殺傷旁人者為誤殺誤傷各以鬬毆殺傷論若耳目所不及思慮所不到初無害人之意而偶致殺傷人者為過失殺傷依律收贖其鬬毆傷而未死者驗傷官親往不得舁傷者就驗驗明立限責令犯人保辜以手足他物傷人者限二十日刃及湯火傷者三十日打傷肢體及破骨墜胎者五十日正限二十三十日者餘限十日正限五十日者餘限二十日正限內因傷身死者擬抵餘限內因本傷死者擬死罪奏請其原毆傷輕又非致命之處正限內因風身死者將毆打之人擬流如當致命處而傷輕或傷重而非致命處因風身死必在十日外方準聲請改流其致命重處及雖非致命傷至骨斷骨損即身死在十日之外仍擬絞抵若因患病身死與本傷無涉者雖在正限內各依本毆傷法惟僧人逞凶斃命有致命重傷者雖在限外十日之內不得輕擬寬減又定治寃獄之法凡內外問刑衙門辨明寃枉須開具所枉事迹實封奏聞委官追問得實被誣之人依律改正罪坐原告原問官吏以故失入罪論若罪囚事本無寃朦混辨明者杖一百徒三年所誣罪重者以故出入人罪論所辨之罪人知情與同罪如原犯重止從重論不知者不坐法司凡遇一應稱寃調問及各衙門奏送人犯如有寃枉及情罪有可矜疑者即與辨理具奏發落毋拘成案若明知寃枉不與辨理者以故入人罪論遇有重囚稱寃原問官輒難辨理者許該衙門移文三法司堂上官辨理果有寃枉及情可矜疑者奏請上裁凡獄囚決問明白追勘完備軍流徒罪各從府州縣決配至死罪者在內法司定議在外聽督撫審録無寃依律議擬法司覆勘定議奏聞回報其公同審録之際若犯人自行翻異原招或家人代訴親寃審録官即便再與推鞫事果違枉同原問原審官吏通問改正若囚犯明稱寃抑審録官不為申理改正者以入人罪故失論又嚴刑訊之條凡強竊盜人命及情罪重大案件正犯及干連有罪人犯或證據已明再三詳究不吐實情或先已成招後復翻異者方凖夾訊其别項小事概不許濫用夾棍若將案內不應夾訊之人濫用夾棍及雖應夾之人因夾致死並恣意疊夾致死者將問刑官題參治罪若有别項情節從重論內而法司外而督撫按察使正印官許酌用夾棍其餘大小衙門概不許擅用其應入八議之人及老幼廢疾者並不合用刑拷訊皆據衆證定罪凡用刑衙門一切刑具不照題定式樣造用致有一二三號不等者用刑官照酷刑例治罪上司各官不即題參照徇庇例治罪又定承審限期以免拖纍凡在京衙門承審事件限一個月審結被證在外者以到齊日為始內外移咨行查者以文到日為始催文至三無覆者題參刑部行文八旗內務府五城順天府提人限文到三日內即行拘送或人犯有他故不到即具情由報明違者將該管官參處倘犯人已至而胥役勒索不行放入經司務廳察出照例嚴加治罪如徇隱不究察出或被首告併罪司務刑部見審事件應會三法司者限一個月杖責等罪限十日發遣軍流等罪限二十日完結案內有應行提質及患病之犯以提到及病愈之日為始仍將應行扣限及三法司會審日期並於科道衙門注銷內聲明倘該司員任意因循或三法司不即會審以致逾限書役得以乘機舞弊嚴加治罪其承審司員及會審遲延之堂司官並分别議處凡欽部等事件直省督撫俱以文到日為始限四個月具題總督轄兩省者隔省事件限六個月具題陜西總督所屬之甘肅兩廣總督所屬之瓊州亦照隔省例福建之臺灣府限十個月其湖廣衡州等府所屬有苗民之二十六州縣距省寫逺者凡命盜案件俱於定限外各展限兩個月新任及署印官原限內難於完結凖分别展限原限四個月者展兩月原限六個月者展三月遇公事出境一切事件凖題請展限若監臨科場按日扣限隔省提人凖到日扣限凡參審之案督撫於其題後即提人犯要證赴省其無關緊要之證佐及被害人等止令州縣録供保候俟奉旨到日率同在省司道審理限期視舊限減半總督則限四個月具題如果案情繁重實有不能依限完結者先期據實奏明請旨展限若盜犯已獲祗須關取隔省人證等口供定案無犯可審者均照欽部事件例州縣分限兩個月府司督撫共限兩個月完結不得照承審盜案全限例扣展其鄰境關提人犯照各省關查口供之例展限兩個月又定羈保之法以清囹圄凡刑部發城取保犯證原繫五城送部之案仍交原城司坊官取保其餘各衙門移送之案則發該城司坊官其由外州縣提到人證令其自舉親識交城就近發保仍將保人姓名報部查核其並無親識者酌量交城看守又定檢驗之法以雪沈寃遇告訟人命有自縊自戕及病死而妄稱身死不明意在圖賴詐財者究問明確不得一概發檢以啓弊竇其果繫鬬殺故殺謀殺者在京委刑部司官及五城兵馬司京縣知縣在外委州縣正印官務須於未檢驗之先即詳鞫尸親證佐凶犯人等令其實招以何物傷何致命之處立為一案隨親詣尸所督令仵作如法報檢定執要害致命去處細驗其圓長斜正青赤分寸果否係某物所傷公同一干人衆質對明白各情輸服然後成招或死久發變青赤色亦須詳辨不得聽憑仵作混報擬抵其仵作受財增減傷痕扶同尸狀以成寃獄審實贓至滿數者依律從重科罪額設仵作大縣三名中縣二名小縣一名仍於額外再募一二人跟隨學習每名發洗寃録一部選委明白刑書一人與仵作逐細講解洗寃録凡四卷除總論二篇尸格尸圖外共二十六條並續增檢骨圖格二篇又定審斷出入之法以警官邪凡官司故出入人罪全出全入者以全罪論若於罪不致全入但增輕作重於罪不致全出但減重作輕以所增減論至死者坐以死罪若斷罪失於入者各減三等失於出者各減五等並以吏典為首若囚未決放及放而還獲若囚自死故出入失出入各聽減一等凡官吏懷挾私讐故禁平人者杖八十因而致死者絞監候提牢及司獄官典獄卒知而不舉者與同罪至死減一等不知者不坐若因該問公事干連平人在官誤禁致死者杖八十如所干連事方訊鞫有文案應繫者雖致死勿論若官吏懷挾私讐故勘平人雖無傷杖八十折傷以上依凡鬬傷論因而致死者斬監候同僚官及獄卒知情共勘者與同罪至死減一等不知情而共勘及雖共勘而但依法拷訊者雖致死不坐若因公事干連平人在官事須鞫問及正犯罪人贓仗證佐明白而干連之人為之相助匿非不服招承明立文案依法拷訊邂逅致死者勿論天命元年諭凡事一人獨斷必致生亂國人有事當訴于公所五日一聽斷之有私訴於諸臣之家者必當執送其私行聽斷者治罪二年諭生殺之際不可不慎聽斷之官必詳審始末而後定擬倘事有未協勿挾忿爭競庶能得情五年諭凡有下情不得上達者書訴牒懸諸木朕據其辭之顛末以便審鞫其令竪二木于門外天聰五年定凡訐告諸貝勒者向例凖其離主嗣後定之以條款一除八分外訐告私行採獵及告私行隱匿出征所獲者一私殺人命者繫原告及被害人近支兄弟一姦淫屬下婦人者繫原告及本夫近支兄弟一所屬從征效力戰士訐告隱匿不報乃以私人濫薦者一本旗人欲行互訐而貝勒控制不許申訴有告發者皆凖離主仍罰貝勒銀有差此外凡以細事訐訴者不凖離主但視事之輕重審斷至諸貝勒審事枉斷人死罪者罰銀六百兩枉斷人杖罪牘罪及私遣人出境交易怠忽職業擅取民間財物馬匹將本旗女子不行報出短價私買者皆罰銀二百兩又奉諭司刑諸臣審理民事于兩造未陳當先拘見證同衆面鞫庶有實據若不速問見證致兩造知覺潛相囑託支飾規避則審斷安得公平自今以後不先取見證口供致事有寃抑者即按事之大小治以罪六年諭凡訐告諸貝勒者斷離本主與否悉照前議其餘彼此訐告者務皆從實如告二事以上重者審實輕者審虛免其坐誣仍凖離主如告數款輕重相等審實一款亦免坐誣如所告多實及虛實相等者原告凖其離主所告多虛者不凖訐告兩事以上而輕者實重者虛與告一事而情輕訴重者除實欵應坐被告外其誣告之欵反坐原告若子告父妻告夫同胞兄弟相告者果繫反叛逃亡等罪許其訐告其餘有訐告者誣告照常擬外原告罪亦如之不凖離主順治十年諭帝王化民以德齊民以禮因姦人為惡害及善良所以不得已而用刑然必情罪允孚斯加者無悔而受者無怨故法者天下之平朕亦不得任喜怒為輕重也凡官司犯事朕即有意見不肯遽自裁斷必下部議者意以士師之任責在明允而膺斯任者又皆親信大臣必能仰體朕心審察得情不致寃濫今該部私心揣度以為事經上發若從輕擬恐以情面生疑庇護為咎不如重擬以作自全之計甚至所犯事情不就事論事而反引已結舊案文致重法如此舛謬大不合理朕于政事最重刑獄奏讞本章必再三覆閲每有改正但恐日有萬幾或一時不及致詳竟批依議死者不可復生誤者不可復改此悔彼怨咎將誰歸以後問刑衙門議事大臣問擬人罪務要詳審真情引用本律一切鉤索羅織悉宜痛革如情罪重大憲典具存又不得藉口故出以致漏網務平心守法使人不寃以幾刑措之治康熙二十年諭帝王以德化民以刑弼教所關最重近覽法司章奏議決重犯甚多愚民無知或由教化未孚或為飢寒所迫以致身罹法網深可憫惻凡問刑各官審理重案有律例未諸定擬失當草率完結者有膠執成見改竄供招深文羅織者有偏私索賄受囑徇情顛倒是非者有一於此民枉何由得伸兹特嚴加申飭務期持廉秉公痛改積習加意祥刑以副朕尚德好生之至意二十二年諭刑部問刑衙門期于審鞫精詳讞獄平允而後民情悅服寃抑畢伸近見爾部審理大小事件每多草率因循瞻徇舛錯如聽訟之時兩造是非自應分别定案因意有偏私往往不問曲直勒令和息或逼撤原狀含糊完結以致姦頑幸免良善含寃至於審員膠執已見聽斷不公或更改口詞圗遂私意或恐嚇犯證不令直供或妄肆株連稽延月日或怠玩疏忽苟且告竣此等弊端難以枚舉嗣後堂司各官俱著洗心滌慮一切刑名事務令情法允協無枉無縱以副委任之意二十五年諭刑曹民命攸關國典所繫必以中正之心行平恕之道使法蔽其辜毋縱毋枉必得真情始免寃抑若惟以深文為能事煆鍊為盡職及獄辭既具奏牘已成即反覆推詳欲求其更生之路亦甚難矣朕于爾諸臣章疏有情可矜疑罪未允協者皆駮令覆審嗣後其各體朕懷殫心竭慮矢慎矢明以副祥刑之意三十九年諭州縣取原供時雖不得情亦必飾辭具詳上司覆核然後達部即有寃抑刑部何由周知凡承問官初審未得實情及上司批駮後果能審出不妨改正若明知已誤又復隱諱則寃抑莫伸矣各宜虛衷詳鞫務得實情雍正元年諭朕惟直省大小獄訟民命所關國家各設按察司以専察之一切州縣申詳至爾司成獄督撫題達由爾司定案任豈不重歟國家定律所以弼教非以厲民故嚴立爰書防其或罹于法及于斷獄又條分縷析思以曲全其生今或情例相違牽合文法以納民於網或有兩例並見輒上下其手以自遂其私安得無寃獄哉夫折獄憑口供而平反憑案卷今法吏不求得情惟求完結州縣案卷之申詳于爾司者多煆鍊口供附于律例冀免爾司之駮詰爾司之詳督撫督撫之揭部院又加文致焉口供案卷如是寃抑何從平反咎在聽斷之初心原非欲必得其情也今宜釐剔宿弊歸于明允毋得因循故事自墮姦欺至納賄出入人罪於法尤重爾司其正已率下使法無枉撓庶幾刑措之風二年諭朕覽命案奏牘如故殺謀殺尚少而以鬬毆傷人者甚多或因口角相爭或因微物起釁揮拳操戈一時殞命及至抵罪雖悔何及此皆愚民不知法律所致殊可憫惻古有月吉讀法之典聖祖仁皇帝上諭有講法律以警愚頑一條蓋欲使民知法不可犯律無可寬畏懼猛省遷善而逺過也爾部可摘取毆殺人命數條疏解詳明令各省地方官刊布曉諭俾知鬬毆律尚如此則故殺謀殺罪更可知互相講論時存警惕以化其好勇鬬狠之習庶命案可以漸少矣六年諭律例之設乃詳察情理揆度至當而後定者也審擬罪案之時應引某條則引之斷無輕重任意或介兩可之理常見奏章內往往有先引一條復云不便照此治罪更引重罪以治之此乃臣下營私之陋習或欲以嚴刻之名歸之于上或冀法外之恩巧于開脫均非明允之道以後外省本章有兩引條例者駮回將情由參奏若當引輕律而故坐重罪亦難逃朕之洞鑒內外執法臣工各宜凛遵乾隆元年諭朕聞姦宄不鋤不可以安善良風俗不正不可以興教化閭閻之大惡有四一曰盜賊三代聖主不待教而誅者也二曰賭博干犯公令貽害父兄以視周官之罷民未麗于法而繫諸嘉石收之圜土者罪有甚矣三曰打架即周官所謂亂民孟子所謂賊民也四曰娼妓則自周以前人類中未嘗有此此四惡者劫人之財戕人之命傷人之肢體破人之家敗人之德為善良人之害者莫大于此是以我皇考愛民之深憂民之切嚴申科禁積嵗月之久然後道路少響馬老瓜賊而商旅已寧賭博及造賭具者漸次改業而家室以安聚黨打架者斂迹而城市鄉鎮鮮聞鬬囂娼妓逺藏不敢淹留客店此皇考十有三年政教精神所貫注而海內臣民顯見其功效實享其樂利者也朕嗣位以來增廣赦條惠保良民使得從容休息而無識諸臣誤謂朕一切寬容不事稽察民間訛言諸禁已開風聞直省四惡皆微露其端倪是守土之官敢悖世宗憲皇帝之明旨墮十有三年之成功而戕賊善良傷敗風俗也自後州縣官有政令廢弛使四惡復行于境內者該督撫即行嚴參督撫司道郡守有不能董率州縣殫心捕治者必以溺職治罪與通苞苴受賄賂者等決不輕貸五年諭朕聞直𨽻山東江南河南等省頗有行客單少不能禦侮被匪類邀截于路強取銀錢行李而走者又假作進香之人乞丐之類以肆其搶奪者在本人失物無多未必盡行報官而地方希圖省事或隱諱不發或緝捕不力以致宵小無所懲警此風不可漸長著該省督撫等嚴行申飭不時稽察倘有仍蹈故轍者必加以參處毋得寬縱又諭朕聞各省聨界之處多有積窩巨匪久慣豢盜殃民隔省往拏必須赴地方官挂號添差稽遲時日又或地方官不能上緊協拏以致要犯風聞逺遁盜案久懸不結向蒙世宗憲皇帝深悉其弊特降諭旨凡地方失事探實贓盜之處無論隔縣隔省一面差役執持印票即行密拏一面移文關會聖諭煌煌實為息盜安民之良法及近年各省督撫奉行不力以致被盜之省辦理掣肘嗣後凡有鄰省聨界地方積窩逃盜訪實之後或徑行差捕或知會密拏庶盜案易結盜源易清而鄰境彼此均受其益如有司等仍以為具文岐視怠忽經朕訪聞必于該督撫是問二十七年諭刑名案件情偽微曖變幻百出若事事曲為逆億雖日定一例豈能遍給乎惟在司刑憲者臨事詳察案情參酌令典期于平允徒鰓鰓然各逞己見議改議增適以變舊章而滋紛擾于讞獄之道有何禆益著傳諭中外問刑衙門知之皇朝通志卷七十七
