body:
  text: 食貨略十三市易臣等謹按我朝市易之政近自直省都會逺及外藩重洋靡不各有定制永昭法守逮自西陲底定歸附益廣度地開㕓因中設市其通商惠工柔逺能邇之規實足為百代之良法豈若漢唐以來補偏救弊經理一時者之所為粵稽鄭志所載平準均輸乃漢武時權宜之術自後漢章帝時僕射朱暉已議其失且鄭志所載亦止武帝章帝二事其非經常之制可知我國家藏富於民盈寧樂利家給人足其立綱陳紀皆準理酌宜以便民為重逈非置平準於京師籠天下之貨物者可比謹於篇目改書市易而以市舶互市附焉順治二年上諭江寧蘇杭各處織造市賣紬縀務寬長精密毋短窄鬆薄致民間徒費錢財無禆實用並禁止各莊頭採買芻糧勒價強買之弊六年敕令東來賣參人役止許在京均平易市不得遣往别省滋事按元年令該商於南京揚州濟寧臨清四處開市後以擾纍地方官民商賈故有是命又嚴禁王府商人旗下莊頭人役等霸占集埸出外貿易及短價掯買之弊康熙初民間有指稱王貝勒輔政大臣名色據關津肆行者上飭地方官緝拏續定包衣下人王貝勒貝子公大臣家人霸占關津生理及王大臣以下各官以銀借貸居民指名貿易及據關口市場者罪例時尚孔逆藩所屬多有霸占廣東私市者十九年令該管官清釐其有霸占私稅者罪之二十四年以光祿寺估計物價頭緒繁多令凡應買各物俱照時價估計定為條欵嗣又以核減太多恐纍商户諭大學士等再行斟酌隨時估計四十三年革除直省私設牙行敕户部造鐵斛升斗頒行天下先是湖廣道御史郝浴言官吏採買軍需往往層扣户侵名為市易實係里攤請行嚴禁至五十九年吏科給事中紀遴宜又言河工所需物料任河廳採買差役不無借端擾纍嗣後凡置辦工料請飭河廳協同地方官平價購買並從之雍正六年諭向來採辦軍需有司往往虛耗國帑派纍民間節經降旨嚴行禁飭令照時價購辦又恐承辦官預留為將來核減之地稍借民力以助公事是以特令核定折中價值倘時直可減即為節省或定價不敷據實奏明此後再有剋扣短發侵蝕之弊一經題參即核明剋扣之數先動軍需銀兩另委賢員如數找給百姓仍將該員治罪勒限追完九年以總督鄂爾泰言敕各省文武官所有賞給兵營生息銀兩毋得占百姓行業或重利放債與商賈小民爭利時京師錢價昻貴上言者謂商賈販運出京及囤積居竒所致乃於八旗五城設官局兊換以平市價又淮安板閘地方向有豪民開立寫船保載牙行勒索行旅十三年敕該督撫嚴行禁止布政使不得濫給牙帖其他處關口有似此者亦一體禁緝又禁河工運裝工料封阻客船及採辦諸物短價纍民之弊乾隆元年禁商人增長物價巧取兵丁營運銀兩二年復申飭居竒勒價之禁是年嚴牙行侵吞商客資本之禁令地方官於牙行領帖時取具保鄰甘結不得濫行給發四年以直省牙行嵗增詔令各督撫嚴加核實於是定牙行之例凡鋪户拖欠商本追繳本牙行帖勒令鋪户清完其不足之項牙行賠補如牙行侵蝕者並責互保牙行攤賠舊例仍充經紀取同牙行互保一人出具殷實良民互結至於以後客之貨挪補前客之欠移弱客之貨代償強客之欠準互保先行舉首免其治罪容隱者責令分賠其牙行內同事人侵吞客本均律以牙行侵吞之例尋又奉旨外省衙門書役多有更名揑姓兼充牙行交部定例治罪地方官失察徇縱亦均論罪五年定各省開報物料價值之例又增寧夏採買糧食價值七年於京城立錢牙以平錢價按此條互見錢幣門又令將平糶錢文照市價酌減易銀互見錢幣門又定額解京局銅鉛及嵗貢物料皆隨時增直鹽務額引亦隨時撥濟按地行銷互市市舶之制順治二年命哈克薩哈駐張家口們都布賚駐古北口凡外藩貿易者該駐防官照常貿易毋得阻抑又定西陲招商市茶以易番馬酌量價直例先是佛浪機商人於明季寓居壕境澳門與粵商互市後因闌入省會遂飭禁止四年以廣督佟養申請仍準畨舶互市十一年準暹羅貢使所攜貨物願至京師貿易者聽其自運其願在廣東貿易者督撫委官監視十三年準荷蘭國及吐魯畨貢使在館交易十八年又準達賴喇嘛及根都台吉於北勝州互市康熙初年定外國人非進方物之時不準來境貿易旋又禁沿海兵民販米糧出海市利八年廣東都司劉世虎等遇風飄泊廣南國境國王遣其臣趙文炳送歸並帶貨物船隻來粵部議趙文炳等雖係廣南印文遣來實係中國之人或留或遣請旨定奪其帶來之物現奉海禁不便貿易應入户部得旨廣南國王送劉世虎等回粵殊為可嘉著給以照驗遣歸廣南船貨不必入官仍給來使嗣於二十二年令厄魯特噶爾丹博碩克圖來使酌量數人進關其餘聽在張家口歸化城等處交易事畢隨即遣回時阿達哈哈畨瑪拉等以茶布往征羅剎軍前市易上諭茶布不必攜往可於户庫支銀四千兩量買諸物馳驛抵該地換取牛羊糧米以備軍需二十三年奉旨開海禁許江南浙江福建廣東沿海民人用五百石以上船隻出洋貿易地方官登記人數船號給發印票防汛官驗放又準暹羅國貢船在虎跳門貿易具報之後即放入河下不必入店封鎖候部文批回二十四年免外國貢船抽稅時王大臣等言今海內一統寰宇寧謐無論滿漢人民一體令出洋貿易以彰富庶之治得旨允行又令朝鮮國照常貿易二十五年定厄魯特部落如噶爾丹等四大台吉準令來京互市其餘小台吉俱於張家口互市著為例二十八年暫開寧夏等處互市先是領侍衛大臣索額圖等與俄羅斯來使議定分界事宜至是遣官立碑於界凡一切行旅有來往文票者許其貿易不禁自是遣使通貢互市不絶三十五年令洋海商船往天津海口運米至奉天販賣給以雇值其裝載貨物但收正稅概免雜費時進征噶爾丹特諭隨軍貿易之人固不可少若縱其貿易又至紊亂應於某營相近即令某營之夸蘭達派出章京於一里外駐劄準其貿易倘貿易人不遵法禁即行正法隨帶之人亦治罪軍士或私售米糧及強買搶奪定加重罪又理藩院言官兵經行蒙古地方應令蒙古人沿途販賣駝馬牛羊等物得旨理藩院可另設一營其販賣駝馬牛羊人等即在理藩院營內貿易每軍營派官一員専司其事如有指稱貿易行竊者不分首從以軍法論三十六年準鄂爾多斯於定邊花馬池平羅城貿易時朝鮮國比嵗薦飢公私困窮八路流殍相續於道國王李焞籲請中江開市貿穀上允其請並令户部侍郎貝和諾往奉天督理朝鮮糶米事務尋定令殷實之户取具地方官印結前赴奉天領米挽運照時價交盛京户部其朝鮮國進貢來使有貿榖帶回者聽候朝鮮國嵗稔時停止明年復遣吏部侍郎陶岱將所運米三萬石以一萬石賞賚朝鮮以二萬石平糶時有鹽商呈請願往令將鹽務銀買倉米二萬石運往平糶欽差户部侍郎監視臣等謹按國家懷柔逺人無所不至朝鮮世稱外藩恭順日久至是因急告糴即命部臣截漕運米以蘇海邦民氣朝鮮臣庶得飫太倉玊粒莫不忭舞欣悅實從來未有之曠典也三十二年以日本洋銅饒裕令安徽江蘇浙江江西等省各商攜帶綢縀絲斤糖藥往彼處市銅分解各省每嵗額市四百四十三萬餘斤三十九年準哈密人於甘肅貿易又準湖廣鎮筸苗民於每月三日聽其互市限時集散四十一年遣官偕喇嘛監督打箭爐貿易四十六年令出洋漁船照商船改造雙桅裝載貨物兼行貿易四十七年都察院僉都御史勞之辦言江浙米價騰貴皆由姦商販運外洋之故請申飭海禁不許商船往來户部議以開設海關商民兩益不便禁止祗令該督撫提鎮於江南崇明劉河浙江乍浦定海各口加兵盤緝私販米糧於是著部院保舉賢能司員前往巡察五十一年兵部職方司郎中圖理琛使土爾扈特國假道俄羅斯悉其山川風俗為異域録以獻初通市諸物有噶噶林印記者準市餘則否五十三年以江蘇巡撫張伯行言編刻商船漁船巡哨船字號並船户人等各給腰牌以便巡哨官兵稽查五十五年給甘肅地方出口印票聽其貿易又定福建商船往臺灣澎湖貿易者臺灣厦港兩汛撥哨船護送時以南洋有吕宋噶喇吧兩處係紅毛西洋泊船之所其地多匿藏盜賊官兵出哨船止一二隻一遇盜船四五隻勢不能敵又內地民人希圖獲利往往私載米糧販易或并將去船售賣甚至有留在彼處者上以該地常留漢人即海賊之藪又往年由閩運米至粵所雇民船三四百隻每隻三四十人通計數千人聚集海上而臺灣民人時與吕宋人往來皆當加意防範因召廣州將軍浙閩總督兩廣總督入京詔大學士九卿等會同詳議嗣於五十六年議定內地商船照舊來往東洋不許出南洋貿易其外國夾板船仍聽其貿易凡洋船初造時報明海關監督地方官親驗印烙取船户甘結并將船隻丈尺客商姓名貨物及收泊何處填給船單沿海官照單嚴查按月册報督撫存案每日食米人各一升餘米一升以防風阻如有越額載米者治罪其私賣船隻偷越禁地或留在外國者殺無赦五十七年定來往臺灣各船取具保結赴厦門盤驗其保結商船責之保家商船水手責之船户貨主漁船責之澳甲同䑸各船限定人數凡單身遊民無照者不許偷渡犯者官兵船户民人及該管官一體論罪時碣石總兵官陳昻言夷商種類甚多姦宄莫測應令督撫關差諸臣設法防備部議夷商懾服有素應聽其照常貿易沿海文武官辨但於夷船泊岸時不時防衛無致失所從之又以兩廣總督楊琳言禁止澳門夷商夾帶中國之人并內地商人偷往别國貿易時以止禁商船往南洋而夷船往南洋及內地商人往安南不在禁例永著為令五十八年議定蒙古及西藏茶禁六十一年諭暹羅國分運米石至閩粵等處販賣其餘各邊番部落及苗疆土司祗令在就近邊界交易不得多攜人衆深入內地至硝磺廢鐵軍器火炮等物概不準夾帶出邊其進關抽稅多從輕減云雍正二年諭暹羅國不憚險逺進獻稻種果樹等物應加奬賚其運來米石所至地方官悉照粵省時價發賣不得任意低昻其回空壓載貨物概免徴稅嗣後陸續開閩浙洋禁及邊番互市之禁先是青海諸部落每年於二八月在河州松畨兩處與內地民人交易兩次後擇定納喇薩喇地方為集場改定四季交易而各部落多居住黃河之東切近河州松畨等處所有納喇薩喇兩處交易之所不足供黃河東西兩翼蒙古易賣三年將軍嶽鍾琪言河州土關附近之雙城堡松畨黃勝關之西河口俱有城堡房屋地方寬濶水草肥甘應仍令在此互市可為永久再住牧黃河西諸部落相近西寧請移貿易之地於西寧口外當噶爾寺至蒙古貿易全藉牲畜每在六月以後請每年不定限期聽其不時貿易從之五年福建督臣請復開閩省洋禁以惠商民並令出洋之船酌量帶米以佐內地耕耘之不足上如所議並令該督撫立定條規嚴加防範其從前逗遛外洋之人不準回籍五年令大臣䇿凌等與俄羅斯使臣定議邊界立石碑並定議俄羅斯往恰克圖互市人數不得過二百仍令理藩院司官一員稽查六年準暹羅國商人運載米石貨物在厦門發賣止納貨物稅米榖免稅永為例又定洋船出入海口限期及酌帶米石貨物之數七年準浙江洋船照閩海例與南洋一體貿易並準粵東商人每嵗冬春間以茶葉瓷器色紙諸物往柔佛諸國互市許暹羅貢使購買駝馬並動用內庫銀給以價值又賞給京弓銅線以該貢使請採故也定湖南民人往苗土貿易者給與印照塘汛驗照放行其苗人至內地貿易於苗疆分界之地設立市場該州縣派委佐二官監視每月以三日為期不許越界出入先是吕宋等國口岸多聚漢人將南洋貿易禁止是年復令通市如故十三年議定東省豆船經海運到江設立兩聨印票出入查驗如無印票照販米出洋例究治時吕宋國以麥收歉薄請以榖銀海參來厦門交糴上諭該督撫提督轉飭有司照榖麥時價均平糶糴不許內地人抑勒欺詐其自開海以來各項禁物仍不許出境并申明沿邊軍民藉端需索勒掯之弊乾隆元年暹羅國請採買銅斤部議以銅斤禁止出洋定例已久恐後來姦民藉此為由越境滋弊議不準採上命賞給八百斤後不為例又準山西口外民人攜帶日用鐵器其鳥鎗腰刀及鐵條鐵塊可造軍器者仍行禁止二年命朝鮮國仍循舊例在中江地方與兵丁交易八年酌定外洋貨船帶米萬石以上者免貨稅十分之五五千石以上者免十分之三其米照市價公平發糶若地方不能銷售官為收買以補常平社義等倉或散給濵海標營兵糧之用自是商船往暹羅者亦多攜米歸來官照時價就厦口糶賣分散漳泉二郡其商民有自備資本運米至二千石以上者按數分别生監民人賞給職銜十一年葫蘆國酋長蚌築願以其地茂隆山銀厰抽課報解作貢解課三千七百九兩零赴雲南投誠且稱境內銀厰自中華人吳尚賢開採以來礦砂大旺厰地民人各守天朝法度路不拾遺等語王大臣等議令雲南督臣曉諭却之仍令將吳尚賢等違例出境查明具奏從之尋葫蘆國夷目仍籲請天恩俯順夷情收受厰課雲督張允隨請減半收納以所收之半給賞該酋長以慰逺人歸順之意從之先是漢人往噶喇吧貿易留者甚衆生長其地者曰土生仔司漢人貿易者曰甲必丹時福建龍溪縣民陳怡老久居其國賄通夷目謀充甲必丹於十四年潛回厦門為地方官訪獲上聞仍令照例速遣二十四年西陲底定自闢展庫車阿克蘇烏什和闐葉爾羌喀什噶爾等處均設市集內地運往者綢縀褐氊色布茶封易回部驢馬牛羊翠羽花翎毛革金銀銅貨及麥蕎芻茭以實邊境軍儲或遣官監運或聽軍民販載其物價悉照內地價直交易是年禁外洋夷船販運絲斤明年江蘇巡撫陳宏謀言各關差招商採洋銅向係置辦綢縀絲斤并糖藥等貨今絲斤已禁若將綢縀一概禁止所帶粗貨不敷易銅請將綢縀紵絹等準其買辦尋議將該商額辦銅本所有應需酌搭綢縀及裝載船隻酌定捲數斤兩責成乍浦上海二處官照例稱驗輸稅使商人不得重復影射二十七年命開奉天海禁並定給票互查之例二十八年禁􅟖咭唎商船不準於浙江貿易自是皆收泊廣東又陸續準􅟖咭唎咖喇吧荷蘭等國夷商及琉球國配買絲絹以易外洋銅斤二十九年準兩廣浙閩各商攜帶土絲及二蠶湖絲往柔佛諸國貿易此後外藩貿易悉照常例至於西域藩部來新疆貿易者各有常例如哈薩克諸部於伊犁貿易布嚕特諸部於喀什噶爾貿易痕都斯坦諸部於葉爾羌貿易齊齊玊斯諤爾根齊諸部常至伊犂等處貿易又定外藩商人在回部貿易者三十分抽一皮幣二十分抽一回部商人往外藩貿易者二十分抽一皮幣十分抽一其牲畜貨物不及抽分之數視所值低昻以普爾折算四十二年兩金川畨酋平定亦令於該地設市定制以通貨賄四十九年諭留京辦事王大臣議覆福康安舒常等籌酌粵東洋行事冝內稱該督撫及監督等土貢內購買洋貨鐘表等物務令洋行各商公同定價又洋行貨內珍珠寶石等項抽稅易於偷漏應令總督監督等悉心籌酌以期永久無弊等語國家撫馭外洋不貴異物每嵗畨民與內地洋行交易貨物俾霑利益原所以體恤商夷至洋貨內鐘表等項不過備驗時刻向來粵海關原有官買之例而廣東督撫監督等往往於土貢內亦有呈進者今內務府造辦處皆所優為更無事外洋購覔嗣後督撫等於鐘表一項永不準再行呈進至珍珠寶石等項原無需用之處向來粵海關抽稅亦屬無多况此等物件本難定價易至居竒且便於攜帶藏匿難保無偷漏分肥否則過於吹求若設法嚴禁逐項搜查實屬不成事體現在京師及各處關隘商稅則例內本無此項稅課不如聽商人等自行交易免其收稅凡粵海關珍珠寶石概不準征收稅課著為令皇朝通志卷九十三
