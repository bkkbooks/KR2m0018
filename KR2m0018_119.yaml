body:
  text: 欽定四庫全書皇朝通志卷一百十九金石略五石四直𨽻御製金太祖世宗陵碑康熙二年國書正書御製孝陵聖德神功碑康熙六年國書正書御製巡視子牙河詩康熙四十年七言律一首行書御臨唐太宗勸農詔賜李光地康熙四十一年行書刻文安縣蘇橋祠側御製駐蹕王家口詩康熙四十一年五言律一首行書御製密雲縣詩康熙四十一年七言絶一首行書御書導流濟運四字康熙四十九年正書御製􅡹髻山玉皇閣碑文康熙五十四年正書御製景陵聖德神功碑雍正五年國書正書御書小九疊三字乾隆十年行書桃花寺行宫御書滌襟泉三字乾隆十年行書桃花寺行宫御書點筆石三字乾隆十年行書桃花寺行宫御書繡雲壁三字乾隆十年行書桃花寺行宫御製小九疊詩乾隆十年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製滌襟泉詩乾隆十年五言律一首十二年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製點筆石詩乾隆十年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製繡雲壁詩乾隆十年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製湧晴雪詩乾隆十年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製吟清籟詩乾隆十年五言古一首二十八年三十一年三十五年七言絶各一首俱行書御製翠雲山房詩乾隆十年五言古一首行書隆福寺行宫御製湯山行宫詩乾隆十年五言古一首行書御製香華菴碑文乾隆十五年梁詩正奉敇正書御製閲永定河隄因示方觀承詩乾隆十五年五言古一首行書御製乘舟觀永定河下口之作乾隆十八年五言古一首行書御製沿隄行三十里觀永定河新移下口處並示直𨽻總督方觀承永定河道白鍾山詩乾隆十八年七言絶四首行書御製薊城路戲題二首乾隆二十五年五言古二首行書御製郊勞出征將軍兆惠富德及諸將士禮成紀事詩乾隆二十五年七言律二首行書御製涿州重修石橋記乾隆二十五年國書正書御製涿州佑濟龍神祠碑文乾隆二十六年國書正書御製永濟橋詩乾隆二十六年七言律一首行書御製過中亭河紀事詩乾隆三十二年五言古一首三十八年七言絶二首俱行書御製蘇橋雜詠詩乾隆三十二年三十八年七言絶各四首俱行書御製閲文安隄工詩乾隆三十二年三十五年三十八年五言古各一首俱行書御製恭依皇祖閲子牙河韻詩乾隆三十二年三十五年三十八年七言律各一首俱行書御製格淀隄至臺頭西南而止命接築至千里長堤因成是什紀事詩乾隆三十二年七言律一首行書御製閲筐兒港減水壩詩乾隆三十二年三十五年三十八年五言律各一首俱行書御製題蘇橋詩乾隆三十五年七言絶二首行書御製補築格淀隄成輕輿往閲因疊舊韻成什乾隆三十五年七言律一首行書御製白河神祠瞻禮詩乾隆三十七年五言排律一首行書御製割麥行乾隆三十七年七言古一首行書御製閲永定河詩乾隆三十八年五言古一首行書御書永佑安瀾四字行書御製閲永定河記乾隆三十八年國書正書御製瞻謁永定河神祠詩以志事乾隆三十八年五言排律一首行書御製金門閘詩乾隆三十八年五言古一首行書御製隄栁詩乾隆三十八年五言古一首行書御製王家務詩乾隆三十八年七言絶一首行書御製往閲永定河下口輿中作乾隆三十八年七言絶一首行書御製閲永定河下口詩以示裘曰修周元理何煟乾隆三十八年七言律一首行書御製重修碧霞元君廟碑記乾隆三十九年正書御製馬駒橋碧霞元君廟落成瞻禮詩乾隆三十九年五言古一首行書御製重修馬駒橋碑記乾隆三十九年正書御製臨故大學士傅恆墓賜奠詩乾隆三十九年七言律一首行書御製永定河惠濟祠瞻禮詩乾隆四十一年七言律一首行書御製於郊臺迎勞將軍阿桂凱旋將士等成凱歌十首乾隆四十一年七言絶行書御製謁明陵詩乾隆五十年五言排律一首行書以上順天府御製督撫針康熙四十二年行書臣等謹按御製督撫針係通賜各直省督撫之書其時李光地摹刻保定鄂海摹刻陜西金世榮摹刻福建浙江喻成龍摹刻安徽齊世武摹刻甘肅徐潮摹刻河南御製考試歎詩康熙四十二年五言律一首行書臣等謹按御製考試歎詩各省多敬刻學署貢院書院諸處御臨趙孟俯詩帖康熙四十三年行書御製賜孫嘉淦詩乾隆四年七言絶一首行書御製蓮池書院詩乾隆十一年五言古一首行書御書緑樾徑三字乾隆十二年行書御書翠風埭三字乾隆十二年行書御書楓香坂三字乾隆十二年行書御製緑樾徑詩乾隆十二年二十八年三十一年四十五年七言絶各一首俱行書御製翠風埭詩乾隆十二年二十八年三十一年四十五年七言絶各一首俱行書御製楓香坂詩乾隆十二年二十八年三十一年四十五年七言絶各一首俱行書御製重幸蓮花池詩乾隆十五年七言律一首行書御製題旌忠祠詩乾隆十五年七言律一首行書御製示鄂彌達及各屬詩乾隆二十一年五言排律一首行書御製石徑詩乾隆二十一年五言絶一首二十二年二十七年三十年三十一年三十二年三十五年三十八年四十一年四十五年四十九年七言絶各一首俱行書御製屏山詩乾隆二十一年五言絶各一首二十二年二十七年三十年三十一年三十二年三十五年三十八年四十一年四十五年四十九年七言絶各一首俱行書御書石徑二字行書御書屏山二字行書臣等謹案石徑屏山二詩乃紫泉十景之二御製春午坡詩乾隆二十六年四十六年七言絶各一首俱行書御製篇留洞詩乾隆二十六年四十六年七言絶各一首俱行書御製