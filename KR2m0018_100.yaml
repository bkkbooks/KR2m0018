  text: 藝文略四史類第五下傳記食貨地理目録譜系傳記聖賢雜録名人别録列傳科第列女名號臣等謹案鄭志傳記一門分目十三最為繁雜今從欽定續通志之例各加刪併凡分聖賢名人列傳列女雜録别録科第名號為八云闕里廣志二十卷宋際宋慶長同撰三遷志十二卷孟衍泰王特選仲藴錦同撰孟子生卒年月考一卷閻若璩撰至聖編年世紀二十四卷李灼黃晟同編洙泗源流無卷數不著撰人名氏以上見四庫全書存目右聖賢臣等謹案欽定四庫全書所録傳記類聖賢之屬惟宋胡仔孔傳二書而已凡國朝人撰述諸書惟存目有之今以著録無書謹從其闕後並倣此寧海將軍固山貝子功績録一卷不著撰人名氏記貝子富喇塔討逆藩耿精忠由台州進兵之事以上見文淵閣著録羅江東外紀三卷閔元衢撰賀監紀略四卷聞性善暨其弟性道同編姑山事録八卷吳肅公杜名齊同撰寧海將軍固山貝子保浙平閩實迹一卷不著撰人名氏記貝子富喇塔討逆藩耿精忠事保台實迹録一卷不著撰人名氏記台州兵巡道揚應魁政績楊公政績記一卷黃家遴撰記明嘉興知府楊繼宗遺事忠武志八卷張鵬翮撰周忠介公遺事一卷彭定求撰王文成集傳本二卷毛竒齡撰梅里志四卷吳存禮撰考訂朱子世家一卷江永撰胡忠烈遺事四卷史珥編朱子文公傳道經世言行録八卷舒敬亭撰曹江孝女廟志十卷沈志禮撰以上見四庫全書存目右名人欽定勝朝殉節諸臣録十二卷乾隆四十一年奉敕撰明儒學案六十二卷黃宗羲撰中州人物考八卷孫竒逢撰東林列傳二十四卷陳鼎撰儒林宗派十六卷萬斯同撰明儒言行録十卷續録二卷沈佳撰史傳三編五十六卷朱軾撰閩中理學淵源考九十二卷李清馥撰以上見文淵閣著録崇禎五十宰相傳一卷曹溶撰五十輔臣編年録殘本一卷不著撰人名氏歷代循良録一卷孫蕙撰古人幾部六卷陳允衡撰歷代黨鑑五卷徐賔撰孔庭神在録八卷胡時忠撰畿輔人物志二十卷孫承澤撰四朝人物略六卷孫承澤撰益智録二十卷孫承澤撰檇李往哲續編一卷項玊筍撰金華徵獻略二十卷王宗炳撰聖學知統録二卷魏裔介撰聖學知統翼録二卷魏裔介撰希賢録五卷朱顯祖撰續表忠記八卷趙吉士撰洛學編四卷湯斌撰天中景行集無卷數邵燈撰中州道學編二卷補編一卷耿介撰古歡録八卷王士正撰大成通志十八卷楊慶撰續髙士傳五卷髙兆撰理學備考三十四卷范鄗鼎撰勝朝彤史拾遺記六卷毛竒齡撰留溪外傳十八卷陳鼎撰明儒林録十九卷張恆撰雒閩源流録十九卷張夏撰錫山宦賢考略三卷張夏胡永褆同撰吳越順存集三卷外集一卷吳允嘉撰道南正學編三卷錢肅潤撰又尚集二卷何屬乾撰聖宗集要八卷費緯䘩撰卓行録四卷黃容撰荆門耆舊紀略三卷胡作柄撰學統五十六卷熊賜履撰道統録二卷附録一卷張伯行撰道南源委六卷張伯行撰伊洛淵源續録二十卷張伯行撰嘉禾徴獻録四十六卷盛楓撰人瑞録一卷孔尚任撰北學編四卷魏一鰲撰修史試筆二卷藍鼎元撰道學淵源録一卷王植撰黌祀紀迹十卷康偉然撰關學編五卷王心敬增補明馮從吾原本蜀碧四卷彭遵泗撰閩學志略十七卷李清馥撰循良前傳約編四卷張先嶽撰吉州人文紀略二十六卷郭景昌編孝史十卷錢尚衡撰以上見四庫全書存目右列傳列女紀略一卷胡作柄撰節婦傳十五卷楊錫紱撰以上見四庫全書存目右列女閩越巡視紀略六卷杜臻撰松亭行紀二卷髙士竒撰扈從西巡日録一卷髙士竒撰以上見文淵閣著録南征紀略二卷孫廷銓撰李贅一卷胡文學撰蜀道驛程記二卷王士正撰南來志一卷王士正撰北歸志一卷王士正撰秦蜀驛程後記二卷王士正撰粵遊日記一卷王鉞撰使琉球記一卷張學禮撰治禾紀略五卷盧崇興撰粵西偶記一卷陸作蕃撰海岱日記一卷張榕端撰何御史孝子祠主復位録一卷毛竒齡撰滇行日記二卷李澄中撰塞程别紀一卷余宷撰塞北小鈔一卷髙士竒撰明道書院紀迹四卷章秉法撰滇遊記一卷附記一卷畢曰澪撰滇行紀程一卷續鈔一卷東還紀程一卷續鈔一卷許纘曾撰南征紀程一卷黃叔璥撰鹿洲公案二卷藍鼎元撰念貽賸紀一卷周宣智撰東遊紀略二卷張鼎乾撰以上見四庫全書存目右雜録劉豫事迹一卷曹溶撰以上見四庫全書存目右别録制科雜録一卷毛竒齡撰彚征録一卷不著撰人名氏以上見四庫全書存目右科第别號録九卷葛萬里撰以上見文淵閣著録宫閨小名録四卷後録一卷尤侗撰同姓名録八卷王廷燦撰以上見四庫全書存目右名號傳記類凡一百十部地理地理總志山都城宫苑記郡邑防地理雜紀川瀆名洞府遊邉外紀大清一統志五百卷乾隆二十九年奉敇撰以上見文淵閣著録天下郡國利病書一百二十卷顧炎武撰增訂廣輿記二十四卷蔡方炳撰閲史津逮無卷數朱約淳撰案是書以閲史須諳地理乃考正舛訛各繪以圖故名閲史津逮歷代輿地徴信編殘本六卷錢邦寅撰山河兩戒考十四卷徐文靖撰古今約説無卷數邵元龍編乃節鈔古今輿地故實詩文以上見四庫全書存目右地理總志欽定日下舊聞考一百二十卷乾隆三十九年奉敇撰欽定滿洲源流考二十卷乾隆四十二年奉敇撰欽定盛京通志一百卷乾隆四十三年奉敇撰欽定熱河志一百二十卷乾隆四十六年奉敕撰右都城宫苑歷代帝王宅京記二十卷顧炎武撰金鼇退食筆記二卷髙士竒撰右都城宫苑古迹附以上見文淵閣著録畿輔通志一百二十卷李衛等監修江南通志二百卷趙宏恩等監修江西通志一百六十二卷謝旻等監修浙江通志二百八十卷嵇曾筠等監修福建通志七十八卷郝玉麟等監修湖廣通志一百