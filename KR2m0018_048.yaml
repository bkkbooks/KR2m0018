body:
  text: 欽定四庫全書皇朝通志卷四十八諡略一臣等謹按諡法始于成周歷代因之各有增損鄭樵作諡略列為二百有十品前後繫以諸論考核綦詳臣等恭讀御製詠諡法詩案語嘉許鄭樵成周初無惡諡之論聖訓煌煌昭如日月洵千古諡法之折衷也伏考前代議諡多委太常博士諸臣定之往往失當未有如本朝諡典之悉稟上裁斟酌盡善者洪惟列祖列宗聖德神功列后徽音令德昭融顯懿卓躒前古書之史册允矣熙鴻號于萬年至若諸王貝勒及內外大臣之例得請者禮臣先以應否豫諡奏俟得旨後閣臣擬以四字恭候欽定迥非前代議諡議駮聚訟糾紛者比又有以文臣品學而追諡者有以監司守令盡節而獲諡者又如改正前史之失追諡勝國之君皆為特典我世祖章皇帝定鼎之初即下所司定明季甲申諸臣之諡皇上表彰忠烈復特頒諭旨于故明殉節諸臣分析褒奬賜以令諡尤為從古未有之曠典臣等敬謹纂輯諡略八卷用備考稽昭掌故焉列聖尊諡肇祖原皇帝興祖直皇帝景祖翼皇帝顯祖宣皇帝俱順治五年十一月追尊恭上崇德元年四月丙戌太宗文皇帝率諸貝勒大臣詣太廟追尊始祖為澤王高祖為慶王曾祖為昌王祖為福王順治五年十一月戊辰以奉四祖入廟世祖章皇帝親詣太廟追尊為肇祖原皇帝興祖直皇帝景祖翼皇帝顯祖宣皇帝恭上册寶太祖承天廣運聖德神功肇紀立極仁孝睿武端毅欽安𢎞文定業高皇帝乾隆元年三月恭加上崇德元年四月丙戌太宗文皇帝率諸貝勒大臣詣太廟恭上覆育列國英明皇帝尊諡曰承天廣運聖德神功肇紀立極仁孝武皇帝廟號太祖康熙元年四月丙辰恭加上尊諡曰太祖承天廣運聖德神功肇紀立極仁孝睿武𢎞文定業高皇帝雍正元年八月己酉恭加上端毅二字乾隆元年三月乙巳恭加上欽安二字康熙六十一年十二月世宗憲皇帝諭禮部曰朕仰荷祖宗眷佑纘承大統恭上皇考聖祖仁皇帝尊諡敬念太祖高皇帝太宗文皇帝世祖章皇帝三聖相承功高德盛載考典章加上尊諡因念孝莊太皇太后翼運啓期育成兩帝朕在沖齡備膺慈愛孝康皇太后誕育先皇懿徽流慶孝惠皇太后德隆福厚篤愛朕躬朕意亦宜並加尊諡但追尊固出至情而推崇必遵定禮爾等可稽考載籍酌古凖今會同確議具奏俾朕得稍展思慕之誠又念仁孝皇后作配皇考孝敬寬仁坤儀懋著孝昭皇后恪恭溫順樹範宫闈孝懿皇后徽音淑德慈撫朕躬恩勤備至均應恭上尊諡以昭示萬年爾等一併會同詳察典例擬奏遵旨議上太祖高皇帝尊諡於睿武字下加端毅二字雍正元年八月己酉恭上册寶雍正十三年九月乙巳皇上諭禮部曰尊祖孝親誼應並重報本追逺禮有加隆兹者恭上皇考大行皇帝尊諡緬維詒燕之謨宜備追崇之典太祖高皇帝太宗文皇帝肇造洪基創垂大業世祖章皇帝統一方夏撫有萬邦駿烈鴻猷敷揚莫罄皇祖聖祖仁皇帝深仁厚澤淪浹寰區久道化成功齊覆載朕自沖齡仰蒙慈愛宫庭撫育厚眷獨鍾仰思至德之難名恆念洪恩之莫報夫宗廟之徽稱有制而報本之忱悃無窮應詳查典禮酌古準今恭議加上太祖太宗世祖聖祖尊諡以展孝思此朕追慕之至情崇先之特典後世子孫不得奉為成式又敬念列祖尊諡既已加崇列后尊諡並應恭議加上爾部詳酌典禮一併敬謹具奏遵旨議上太祖高皇帝尊諡於端毅字下加欽安二字乾隆元年三月乙巳恭上册寶太宗應天興國𢎞德彰武寬溫仁聖睿孝敬敏昭定隆道顯功文皇帝乾隆元年三月恭加上順治元年十月辛酉恭上寬溫仁聖皇帝尊諡曰應天興國𢎞德彰武寬溫仁聖睿孝文皇帝廟號太宗康熙元年四月丙辰恭加上隆道顯功四字雍正元年八月己酉恭加上敬敏二字乾隆元年三月乙巳恭加上昭定二字世祖體天隆運定統建極英睿欽文顯武大德𢎞功至仁純孝章皇帝乾隆元年三月恭加上順治十八年正月己未聖祖仁皇帝諭禮部曰朕惟自古聖賢之君必有顯號徽稱用昭功德之隆垂于萬世此國家不易之巨典也仰惟我皇考大行皇帝纘紹鴻緒統一寰區十有八年敬天尊祖勤政愛民奉侍慈闈克諧孝道敦睦宗族攸敘彝倫典學日新修身思永制禮作樂振武崇文敇法明刑立綱陳紀盛德之事不一而足朕方與天下臣民均切怙戴不幸龍馭上賔顧豫沖人嗣膺大統仰承佑啓之恩敢後顯揚之禮謹考彝章宜升尊諡戊寅親王等上大行皇帝尊諡議曰謹按自古有天下者祖有功而宗有德故凡勳高大定功垂奕葉者類皆稱祖以尊之其廟祀百世弗祧此世所由稱也又按諡法法度大明敬慎高明曰章洪惟大行皇帝神武止戈崇文勸學恩澤覃敷于庶物孝治立極于人倫德固懋昭功尤隆著是以化行教洽逺至邇安生民以來莫斯為盛臣等謹咨羣議載考彝章大行皇帝尊諡宜天錫之曰體天隆運英睿欽文大德𢎞功至仁純孝章皇帝廟號世祖得旨是著該衙門擬撰册文進覽三月癸酉恭奉册寶上尊諡雍正元年八月己酉恭加上定統建極四字乾隆元年三月乙巳恭加上顯武二字聖祖合天𢎞運文武睿哲恭儉寬裕孝敬誠信中和功德大成仁皇帝乾隆元年三月恭加上康熙六十一年十一月辛丑世宗憲皇帝諭王大臣等曰朕惟自古聖賢之君必有顯號徽稱以昭功德之盛垂于萬世此國家不易之巨典也仰惟我皇考大行皇帝臨御六十一年早承大統寅畏小心旦明凛昭格之忱郊祀親升中之典監于成憲率由舊章孝奉兩宫尊養兼至展敬陵廟備物盡誠總攬萬幾阜成兆姓蠲賦動盈千萬賑恤曾不稽時水旱先籌雨暘必達寬刑肆赦德洽好生盛暑則釋囹圄嚴寒則賑饘粥兵糧豫給優賞屢頒淮甸屢巡動數百萬之帑金運睿謀而兩河底績魯郊特幸行數千年之殊禮屈帝尊而九拜崇師覽奏牘而利弊周知覲臣僚而賢愚立辨保全勳舊庇廕宗支廣育人才敦厚風俗布昭聖武申討不庭元裔背叛而旋踵就殱三蘖逆命而刻期獻馘俄羅斯占喀爾喀之疆圉諭以威德即奉約章喀爾喀逼厄魯特之殘暴納其困窮胥登袵席噶爾丹肆毒鄰境三臨絶漠掃靖烽煙䇿妄阿喇布坦摧滅與國出師命將恢復藏地臺灣置郡紅苗革心南朔東西無思不服至于天縱生知日新好學講筵時御手定六經廣博士于五賢配先儒于十哲文嫓二典書邁百家貫徹天文總括地理旁羅數術考正元聲研索羣編鑒裁纂輯凡此難名之美善洵亘古帝王首出之一人雖復纍牘連章不能紀述萬一朕方與天下臣民均切怙戴不意龍馭上賔顧豫沖人嗣膺大統仰承佑啓之恩敢後顯揚之禮敬考彝章宜升尊諡爾部詳察典禮具奏乙巳總理事務王大臣等奏大行皇帝尊諡廟號乃追崇大典臣等管窺蠡測未能仰盡髙深恭祈睿思親定以昭垂萬世世宗憲皇帝召進總理事務親王大臣大學士尚書等面諭曰恭上皇考大行皇帝尊諡廟號諸王大臣等請朕親定朕思子臣尊崇君父之心何有止極然必須至允至當方孚千秋定論若少有溢美之詞不獨失天下之至公且開後人之僭越是因臣子之愚忠愚孝反將君父盛德大業之實行涉于贊頌之虛文朕心殊不安也我皇考大行皇帝纘繼大統舊典本應稱宗但經云祖有功而宗有德我皇考鴻猷駿烈冠古轢今拓宇開疆極于無外且六十餘年手定太平德洋恩溥萬國來王論繼統則為守成論勳業則實為開創朕意宜崇祖號方副豐功但追崇大典攸關理宜僉謀共協一人之心即千萬人之公心一時之論即千萬世之公論爾諸王大臣等可會同九卿詹事科道文六品以上武四品以上詳考舊章從公確議毋得依違毋得附和務期紀實以垂萬年若少有幾微未協知而不言則大非臣子忠愛之道王等文武諸臣議奏大行皇帝功德巍煥高出三代以上之聖主賢君雖集古今之徽名美號猶不足表揚萬一大行皇帝聖學淵深言成謨典尊師崇道手定六經禮正樂成誕敷文教此堯之文思也聲靈所震無思不服開拓宇宙混同車書不庭旋服逆命即收止戈包革天下宴安此湯之神武也明四目達四聰無逺不周無微不燭知來藏往觀化窮神此舜之濬哲也一日萬幾孜孜無倦深宫燕處不敢康寧盛暑必衣冠嚴冬必聽政此堯之允恭也玉食不盈數器御衣常至十年物用無金璧之裝宫殿無繁華之飾此禹之克儉也蠲賦免徭緩刑恤獄澤厚宗支賞優士伍秉中和之性具含容之量小過多原寸長不棄六十餘年民物各遂其生者皆大行皇帝寬裕之恩也定省兩宫時日無間奉養備至禮數兼隆此大行皇帝承歡之大孝也恢三朝之功烈𢎞一統之規模區夏咸寧聲教四洽此大行皇帝繼述之大孝也寅畏小心恪勤克慎躬親郊祀嚴肅致齋此大行皇帝之敬天也憲章典訓對越在天廟祭致虔如臨左右此大行皇帝之敬祖也健行無息成已成物精意由中修詞立本出教施令達乎民心此大行皇帝之誠也虛已待物不逆詐偽履常思順不爽片言此大行皇帝之信也具仁義禮智信之全備溫良恭儉讓之美自堯舜以來未有如大行皇帝德之盛者八表宅心九有向化西北部落輻輳藁街東南諸畨頓顙闕下兩河底績成萬年永濟之勳海外咸朝開萬里難通之域自堯舜以來未有如大行皇帝功之大者天地化育有未周者大行皇帝實贊之祖宗經綸有未竟者大行皇帝實𢎞之孔子集千聖之大成大行皇帝集百王之大成也臣等謹按傳云為人君止於仁禮運曰仁者義之本順之體也得之者尊説文云在天為元在人為仁故易曰元者善之長仁者德之首大行皇帝體元立政茂育羣生以義制事綏安兆姓臣等竊謂史稱帝堯其仁如天惟大行皇帝實與並之又按禮經云有虞氏禘黃帝而郊嚳祖顓頊而宗堯而尚書舜典云舜格于文祖釋者謂文祖堯廟也又歸格于藝祖釋者謂藝祖堯之祖也合之祖顓頊之文則有虞氏蓋有三祖矣宋臣陳祥道云凡配天者皆得稱祖故國語展禽又有有虞氏祖高陽而郊堯之説堯所以稱文祖也顓頊至堯皆黃帝子孫而不嫌于皆稱祖又周禮大宗伯祫禘追享朝享解云古者朝廟合羣祖而祭焉故祫謂之朝享以合羣祖為不足又禘其祖之所自出故禘謂之追享夫祖之所自出始祖也而其下曰羣祖知自始祖以下皆稱祖矣自唐虞夏商無追王先代之文而武王周公追王太王王季以臣子而王其君祖孔子稱為達孝故記曰武王上治祖禰尊尊也又諡議曰帝王功業隆盛引古者祖有功之義得稱祖此皆經書所載稽考可據者也竊謂惟聖字可以贊揚大行皇帝之峻德惟祖號可以顯彰大行皇帝之隆功上諭謂大行皇帝論繼統則為守成論勳業實為開創朕意宜崇祖號方副豐功此非皇上及諸臣數百人之心實天下億兆之公心亦非今日在廷諸臣之論實千萬世之公論也臣等公擬敬上尊諡曰合天𢎞運文武睿哲恭儉寬裕孝敬誠信功德大成仁皇帝廟號曰聖祖天下萬世稱曰聖祖仁皇帝奉旨諸王大臣官員深悉我皇考一生神聖實行同心合詞恭上尊稱甚愜朕懷朕之哀思庶可稍釋諭畢世宗憲皇帝親刺指血圈本內聖祖二字敬恭高捧授大學士等齎出宣示羣臣雍正元年二月乙巳恭奉册寶上尊諡乾隆元年三月乙巳恭加上中和二字世宗敬天昌運建中表正文武英明寬仁信毅大孝至誠憲皇帝雍正十三年十一月恭上雍正十三年九月己亥皇上登極庚子諭禮部曰自古聖帝明君功德大成必有顯號徽稱所以昭垂萬世典至巨也我皇考大行皇帝乘乾建極撫御萬邦錫福諴民德化翔洽虔恭寅畏昭事蒼穹郊祀祈年必親必敬欽承祖烈光大前猷至孝肫誠千古未有當皇祖上賔時盡制盡哀喪儀隆備親送梓宫屢謁陵寢嵗時瞻拜御容舉念常伸孺慕繼顯謨之盛推錫類之仁宸衷祗敬則朝乾夕惕歷久彌勤親政憂勞則盛暑祁寒未嘗稍間整綱飭紀明目達聰施措咸宜德威並用篤宗室則立學以隆教育惠八旗則錫帑以備吉凶厚臣工而加俸養亷眷忠良而建祠賜祭勵亷能以察吏宏薦拔以羅才廣藉田以重農桑定品式以崇節儉重道則經筵嵗舉愛士則科目頻加隆先師五代之王封新闕里千秋之廟貌修明典禮懷柔百神厚植綱常旌揚節孝蠲逋減賦不惜億萬之帑金開墾築堤永享萬年之樂利備賑則廣行積貯養兵則優贍身家律例則釐定科條讞決則特詳咨酌廣開言路詳示硃批洞矚羣情慮周六合大閲以詰戎兵訓練以修武備睿謨獨運而小醜立奏蕩平聖武布昭而荒徼永圖綏靖開天明道聖學高深覺世牖民宸章炳煥闡聖賢之精藴宣心性之圓機函蓋古今彪爍宇宙天心協應有感必通德盛化神諸瑞畢至古帝王之良法善政至皇祖而集其大成我祖宗之駿烈鴻猷逮皇考而益彰善述眇豫沖子寅奉丕基仰惟功德之隆宜備尊崇之典敬循禮制恭上尊諡廟號爾部詳察典禮具奏是日禮部奏謹查康熙六十一年恭上聖祖仁皇帝尊諡廟號奉大行皇帝諭旨以追崇大典攸關理宜僉謀共協令諸王大臣等會同九卿詹事科道文官六品以上武官四品以上詳考舊章從公確議今大行皇帝尊諡廟號禮制崇重臣等謹遵舊典仍請會同諸王大臣齊集廷臣詳慎公議昭垂萬世奉諭旨是敬謹確議具奏是月乙巳王等文武諸臣議奏自古帝王撫馭寰區功德隆盛有博厚高明之實則必有隆爍顯懿之名是故于堯曰欽明文思于舜曰濬哲文明所以著盛德之形容而垂萬年之軌則也欽惟大行皇帝丕冒八埏曲成萬物有與天同體之德有敬天行健之功祇奉郊壇必親薦享端居宫禁亦凛明威暘雨偶愆齋心而默禱嘉祥屢告讓美而弗居昭事存乎旦明感通捷於影響當天庥之滋至綿景運於方隆撫列聖式廓之版章益漸之以聲教取四海咸熙之臣庶更霈之以恩膏安愈求安聖不自聖惟精惟一建中于民克儉克勤表正自上執權衡以御物偏黨之習潛消定模範以示人仁讓之風溥洽官常于是而肅士品于是而端民俗于是而淳物情于是而暢嘉禾芝草醴泉慶雲之瑞充塞于寰中荷蘭日本暹羅蘇祿之琛輻輳乎闕下凡此運會之彌昌彌熾皆由聖德之可法可傳至乃學貫天人辭成典誥敷治平之大道闡性命之微言嵗舉經筵首詣太學新闕里千秋之廟貌隆先師五代之王封廣勵膠庠修明典禮定宗學之制開國書之科博訪鴻儒遍立書院大行皇帝之誕敷文教有如此者帷仁必勇不怒而威選將悉有用之材練兵于無事之日天戈所指青海獻俘帝命甫申西陲納款化蠻荒為郡縣靖蕃落于邊隅大行皇帝之布昭聖武有如此者志邁百王心通庶務事無難易鋭若發機人有忠邪洞如觀火謀略出羣工之上照臨周六合之遙大行皇帝之英姿天挺明睿夙成有如此者坦懷應物博愛為心不以一眚棄才不使一夫失所惇敘九族容保萬方厚百官而倍與廩糈惠八旗而時加恤賚閭井必預謀其樂利兵丁各優贍其身家減賦蠲逋不惜帑金之億萬詳刑讞獄允釐令典之三千盛暑而曲貸囚徒小祲而遍賙貧户大行皇帝之寬則得衆仁以長人有如此者道循物而無違德有常而不息本實心以宣為政令春溫秋肅儼如四序之罔愆由定力而發為憂勤旰食宵衣不以片時而少斁大行皇帝之信必由中毅以持久有如此者經曰聖人之德無以加于孝我大行皇帝昔在藩封晨昏盡禮及傳丕緒哀敬竭情親送梓宫屢謁陵寢三載始還吉服四時恆拜御容體聖祖之心以為心法聖祖之政以為政耕藉著為定例爰奉太廟之粢盛賢良建有專祠尤眷先朝之耆舊德教加于百姓孺慕極于終身大烈光前貽謀昌後孔子稱虞舜曰大孝惟大行皇帝足以當之若夫誠者天之道也成已成物之全德也我大行皇帝以此享帝享親以此盡心盡性以此用人行政以此覺世牖民諸臣敬奉之硃批萬國共聞之諭旨固已言之諄復莫不凛為典章暨夫龍馭上賔特頒遺詔敬聆至誠之訓仰思無間之功聖學高深渾然一理神明沖穆儼在重霄子思曰惟天下至誠為能經綸天下之大經立天下之大本知天地之化育惟大行皇帝足以當之夫中以宅心正以體政文以敷化武以定功英以決疑明以燭理寬以居之仁以行之信以成之毅以守之而皆本之于大孝運之以至誠此洵聖德之全與天同體可為萬世法者也臣等按虞書曰率作興事慎乃憲書傳曰憲法也説命曰惟天聰明惟聖時憲又曰監于先王成憲周禮疏曰懸法以示人曰憲中庸亦云憲章文武蓋惟憲天立教之聖人然後能慎法度興政事俾萬世奉為成憲守而不忘若虞舜商湯周之文王武王皆是也竊謂大行皇帝尊諡于憲為宜又按禮記祖有功宗有德是故有虞氏祖顓頊而宗堯夏后氏祖顓頊而宗禹商人祖契而宗湯周人祖文王而宗武王周公作無逸則稱商有三宗周文武之廟並稱世室公羊傳曰世世不毁也中庸曰君子動而世為天下道行而世為天下法言而世為天下則竊惟大行皇帝廟號宜稱世宗與太祖太宗世祖聖祖並為百世不祧之廟臣等公擬敬上尊諡曰敬天昌運建中表正文武英明寬仁信毅大孝至誠憲皇帝廟號曰世宗天下萬世稱曰世宗憲皇帝足以顯揚大德表著巍功與日月而齊光偕山河而並永矣謹奏奉諭旨諸王大臣公同議上皇考大行皇帝尊諡曰憲皇帝廟號世宗於我皇考至德鴻猷實相符合禮稱祖有功宗有德廟號之稱祖稱宗均屬尊崇之極而象功昭德惟期允當方協至公昔我皇祖聖祖仁皇帝久道化成身兼創守平定逆藩掃清朔漠神功駿烈自古莫與比隆廟號定應稱祖皇考大行皇帝善繼善述敬天勤民十三年來宵旰憂勞咸熙庶績貽萬年之景福固百代之丕基廟號世宗正合古宗有德之義上配列祖百世不祧此乃天下萬世之定論非在廷諸臣尊崇君父敷揚稱頌之私情尤非朕一人哀感隆恩表彰盛德之私願所能強置一詞也在我皇考神謨垂于宇宙厚澤洽于臣民即罄竭揄揚難盡萬一今據所奏敬擬上尊諡廟號詳慎公當足以昭示萬年朕心深為慰愜所有應行典禮該部敬謹查議具奏十一月丁未恭奉册寶上尊諡皇朝通志卷四十八
