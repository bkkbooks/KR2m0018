body:
  text: 欽定四庫全書皇朝通志卷三十七禮畧吉禮二北郊臣等謹按鄭志方丘一門云神州后土附其所謂神州者謂王者所卜居吉土五千里之内地名也葢漢以後諸儒附㑹之說非三代之制后土則自漢武帝立后土祠於汾隂睢上後世因之屢舉屢廢實不足為典要我朝列聖以來敬事方澤與圜丘之典並重寅恭對越酧厚載而荅洪庥視前代規制超越萬萬謹載輯禮典著於篇中而鄭志之所謂神州后土者則謹從刪去云順治元年定制每嵗夏至大祀地於北郊方澤以五嶽五鎮四海四瀆為四從壇配享八年尊封肇祖原皇帝興祖直皇帝陵山為啟運山景祖翼皇帝顯祖宣皇帝陵山為積慶山十六年以停積慶二陵奉移啟運山山從祀太祖高皇帝陵山為天柱山太宗文皇帝陵山為隆業山附四從壇配享凡祀方澤以夏至日卯時後定以日出前七刻與圜丘祈榖均為大祀十四年三月大祀地于方澤奉太祖高皇帝太宗文皇帝配享嗣是以告謝親祀者一以告祭親祀者一合祀南郊者一惟是年為正祀北郊之禮康熙元年五月夏至大祀地于方澤聖祖仁皇帝親詣行禮二年尊封世祖章皇帝陵山為昌瑞山從祀三陵山之次六年十一月大祀地于方澤奉世祖章皇帝配享雍正二年五月夏至世宗憲皇帝大祀地于方澤奉聖祖仁皇帝配享乾隆元年五月夏至大祀地于方澤皇上親詣行禮尊封世宗憲皇帝陵山為永寧山從祀四陵山之次二年五月夏至大祀地于方澤奉世宗憲皇帝配享八年五月夏至大祀先期致齋于齋宫定制兩郊皆有齋宫是嵗修葺北郊齋宫齋宿如禮九年五月夏至大祀以祈雨不乗輦不設鹵簿自後凡值祈雨遵以為制十四年五月夏至大祀詣齋宫齋宿詔易皇祗室緑瓦為黄瓦并修北郊壇宇四十四年冬至大祀南郊奉諭㫖朕明嵗即屆七旬因稍省煩勞専心祼薦定於正位躬詣晉獻香帛爵俎以申䖍敬至配位列祖列宗惟上香仍前親奉其獻爵進俎則命諸皇子恭代四十五年五月夏至恭舉北郊大典親承恭代一如前南郊之禮凡北郊大祀皇上躬詣行禮儀節並詳大清通禮社稷順治元年定制社稷壇之禮每嵗以春秋仲月上戊祭太社太稷之神同壇同壝社主用石稷主用木祭則恭設神牌太社位右太稷位左均北向以后土勾龍氏配東位西向后稷氏配西位東向壇在午門之右凡祀社稷壇為大祀八年二月祭太社太稷世祖章皇帝親詣行禮其秋八月值太宗文皇帝忌辰陪祀各官行禮畢仍易素服九年秋復值忌辰禮部以改期請弗允康熈十六年二月聖祖仁皇帝親祭社稷遇雨照常行禮定制祭日如遇風雨皇帝於拜殿内門檻南行禮從祀王公在殿外中甬路兩旁各官在王公後行禮是日雨賛引官以請聖祖命照常行禮遇雨在拜殿行禮之例盖未經行云雍正元年二月祭太社太稷先是康熈六十一年十一月世宗憲皇帝豋極遣官告祭社稷至是親詣行禮二年閏四月以平定青海告祭社稷行獻俘禮十年三月詔直省郡縣修社稷壇敬謹行禮乾隆元年二月戊辰祭太社太稷皇上親詣行禮二年閏九月奉諭㫖大清律載各府州縣社稷山川風雲雷雨諸神所在有司以時致祭所以肅祀典而迓休和禮至重也省㑹之地督撫司道駐劄同城向不與祭専屬府縣官行禮督撫司道等官均有封疆守土之任自當䖍奉明禋為民祈報凡春秋致祭督撫應率領闔屬文武大小官員敬謹行禮提鎮道員駐劄之地一體率屬陪祭其如何分别班次派員監禮及修整壇壝祭器之處該部詳議具奏奏上通飭行之八年七月頒發各省壇廟祝文二十年六月以平定準噶爾獻俘社稷壇十月再行獻俘禮俱遣親王將事二十一年五月增社稷壇望瘞樂章二十四年五月禱雨於社稷壇皇上御製祝文歩行詣壇薦玉行禮先期奉諭朕此次親詣社稷壇祈求雨澤禮部所開儀注内無薦玉之禮詢其原委則係相沿舊規並無憲義可考夫玉以芘䕃嘉榖使無水旱之災載在傳記且於答隂之義更為相稱著飭所司敬謹用玉將事二十五年正月以平定回部獻俘社稷壇如二十年之禮四十一年四月以平定金川獻俘社稷壇如二十五年之禮自乾隆元年以來每嵗春祀皆躬詣行禮唯值皇上巡行之嵗遣官恭代秋祀恭值皇上舉木蘭行圍之典皆遣官恭代堂子大内祭神臣等謹按太祖高皇帝建國之初有謁拜堂子之禮凡每嵗元旦及月朔國有大事則為祈為報恭詣行禮大出入必告出征凱旋則列纛而拜典至重也順治間建堂子於玉河橋東祭法明備詳載典禮而内廷䖍祀朝夕無間我皇上詔以盛禮載諸典策煌煌聖謨明示義法仰見聖朝敬事天神夙夜寅恭之鉅制稽諸經訓萬古合契謹考典制之所自備載於篇天聰九年八月太宗文皇帝以征察哈爾奏凱師還親謁堂子行拜天之禮崇徳元年五月以大軍征明親率王貝勒等謁堂子行禮拜纛出師十二月以親征朝鮮謁堂子行禮次年班師以成功告七年三月以克錦州謁堂子行禮順治元年四月世祖章皇帝命王貝勒帥師平定中原謁堂子行禮九月建堂子于京師長安左門外玉河橋東定上香致祭謁告之禮先是崇徳元年定制每年元旦皇帝率親王以下副都統以上及藩王等詣堂子上香行三跪九拜禮又定每年春秋立杆致祭於堂子親王郡王貝勒每家各祭三杆貝子鎮國公輔國公每家各祭二杆鎮國輔國奉國將軍每家各祭一杆無爵宗室不得祭又定每月朔親王以下貝子以上每府委官一人前期齋戒是日詣堂子供獻順治二年以元旦親詣行禮與否令禮部預期題請又定每年春秋立杆致祭聖駕親詣行禮如儀康熙十二年定制凡祭堂子令漢官勿隨往惟王公滿大臣一品文武官隨往行禮十三年正月以遣大將軍王帥師出征聖祖仁皇帝親詣堂子行禮次於纛前行禮自後凡大征伐及命將出師皆親詣堂子行禮互見軍禮門乾隆十四年五月定出征凱旋告祭堂子之禮議政王大臣等奉諭㫖堂子之祭乃我朝先代循用通禮所祭之神即天神也列祖膺圖御宇既稽古郊禋而燔柴典重舉必以時堂子則舊俗相承遇大事及春秋季月上旬必祭天祈報嵗首最先展禮定鼎以來恪遵罔怠且不易其名重舊制也考諸經訓祭天有郊有類有祈榖祈年禮本不一兵戎國之大事故命遣大將必先有事於堂子正類祭遺意而列纛行禮則禡也我祖宗於行營中或别有征討不及歸告堂子則望祭而列纛行事其誠敬如此朕思出師告遣則凱旋即當告至乃天地宗社俱已祝册致䖍且受成太學而堂子則弗之及祠官疎畧如神貺何祀典攸闗彛章宜備著議政王大臣詳議具奏朕親為裁定王大臣等遵㫖議上大兵凱旋皇帝告祭堂子之禮請載入㑹典從之自後命將出征及凱旋皆致祭堂子如儀十九年奉諭王公等建立神杆應按爵秩設立整齊以肅觀瞻嗣後著每翼作為六行每行六分以未分封皇子等列於前其次則親王貝勒貝子公等分為六層設立神杆皇子内已受封爵者其神杆視所封爵立於應立之處所有石座不必移動神杆各按爵秩更換每年修整一次著禮部㑹内務府總管察看繪圖進呈著為例大内祭神之禮順治元年定奉晨祀神位於祭神殿西位東向日昧爽行禮奉夕祀神位於西北南向申刻行禮皇帝恭祭壇廟齋戒日忌辰清明禁屠日不祭餘日皆祭每嵗四孟月均用馬牛金幣祗薦於神贊祀致辭如儀山川順治元年定崇祀嶽鎮海瀆及直省有司春秋致祭之禮凡山川之祀監於前典以五嶽五鎮四海四瀆配享方澤壇立地祇壇以五嶽五鎮四陵山今為山五陵四海四瀆之祇為正位以京畿名山大川天下名山大川之祇為從位凡嶽鎮海瀆所在地方有司嵗以春秋仲月諏日致祭祭東嶽泰山於山東泰安州今升為府祭西嶽華山於陜西華隂縣祭中嶽嵩山於河南登封縣祭南嶽衡山於湖廣衡山縣祭北嶽恒山於直𨽻曲陽縣移祭見後祭東鎮沂山於山東青州府祭西鎮呉山於陜西隴州祭中鎮霍山於山西霍州祭南鎮㑹稽山於浙江㑹稽縣祭北鎮毉巫閭山於遼東廣寧衞今改為縣祭東海於山東萊州府望祭西海於山西蒲州今升為府祭南海於廣東廣州府望祭北海於河南濟源縣移祭見後祭河瀆於蒲州祭江瀆於四川成都府祭淮瀆於河南唐縣祭濟瀆於濟源縣三年封黄河龍神為顯佑通濟金龍四大王之神封運河龍神為延庥顯應分水龍王之神令河臣致祭八年正月世祖章皇帝親政遣官致祭嶽鎮海瀆定制恭遇慶賀大典頒布恩詔則遣官致祭以各衙門四品以上堂官將事諏吉將行先期陳祝文香帛於中和殿皇帝親閱遣之十七年三月改祀北嶽恒山於山西渾源州康熙六年七月聖祖仁皇帝親政遣官致祭嶽鎮海瀆十六年九月加封長白山之神照五嶽例春秋致祭遇有慶典亦一例於烏喇地方望祭十八年五月以湖南討賊屢㨗咸言湖神助順加封洞庭湖之神遣官致祭二十一年二月以平定雲南遣官致祭嶽鎮海瀆長白山三月聖祖東巡盛京望秩長白山二十三年聖祖東巡十月躬祀泰山之神遣官祭黄河之神十一月遣官致祭嶽鎮海瀆長白山自是以後凡恭遇東巡南巡所過名山大川均照例致祭二十五年移北海祀典於混同江望祭臺臣奏言祀典所載致祭北海尚沿宋明舊制於河南濟源縣係在京之南於義未合况北嶽已改祀渾源州則北海應請改祀於混同江庶方位允協下部議行之二十七年十月以孝莊文皇后升祔太廟遣官致祭嶽鎮海瀆長白山三十二年二月遣皇長子祭西嶽華山三十五年建海神廟於大沽海口加封致祭時由天津海道運米盛京以備賑濟海神效靈往來迅駛立廟祀之三月親征噶爾丹致祭所過山川之神三十六年七月以平定朔漠遣官告祭嶽鎮海瀆長白山三十七年七月以永定河新河告竣建永定河神廟於盧溝橋春秋致祭九月聖祖東巡遣大學士致祭松花江之神三十九年六月以河臣疏請建海神廟於江南安東縣四十年正月加黄河龍神封號昭靈效順四字四十二年三月聖祖仁皇帝五十萬夀遣官致祭嶽鎮海瀆長白山十一月聖祖西巡遣官致祭西嶽華山四十三年二月封淮神為長源佑順大淮之神五十二年三月聖祖仁皇帝六十萬夀遣官致祭山川與四十二年同五十七年十二月以孝惠章皇后升祔太廟遣官致祭嶽鎮海瀆長白山六十年三月以御極六十年大慶遣官致祭山川六十一年建江海潮神廟於浙江之尖山春秋致祭是年十一月世宗憲皇帝登極遣官致祭嶽鎮海瀆長白山雍正元年二月以恭上聖祖仁皇帝尊諡遣官致祭十二月以册立皇后遣官致祭二年八月加江海大神封號江瀆曰涵和河瀆曰潤毓淮瀆曰通佑濟瀆曰永恵東海曰顯仁南海曰昭明西海曰正恒北海曰崇禮均遣官齎送祭文香帛令地方大員致祭四年冬督撫諸臣次第奏報黄河澄清地連四省時逾二旬諸王大臣請陞殿受賀世宗不許特遣官分詣清河武陟二處新建神廟致祭黄河之神十二月遣官致祭河源之神於河州口外七年建江神廟於湖北武昌春秋致祭八月建海神廟於浙江海寧縣加封為寧民顯佑浙海之神以英衞公伍貟誠應武肅王錢鏐配享其他諸神祀於配殿八年四月建河源神廟於甘肅河州加封為開津廣濟佑國庇民昭應河源之神十二月封直𨽻滹沱河神為長源永濟滹沱河神九年建永定河神惠濟廟于石景山十年閏五月建望祭長白山享殿于温徳亨山今名望祭山七月以髙堰山旴石工告成建洪澤湖神廟於髙家堰春秋致祭十三年九月皇上登極遣官告祭嶽鎮海瀆長白山十一月以恭上世宗憲皇帝尊諡遣官致祭乾隆元年八月奉特諭致祭河神海神永定河神二年四月以恭奉世宗憲皇帝配享南郊遣官致祭嶽鎮海瀆長白山三年立海神廟於江南寳山縣祀典視浙江海寧八年八月皇上東巡盛京遣官致祭北鎮廟長白山十三年二月皇上東巡躬祀泰山之神增用中和韶樂遣官致祭嶽鎮海瀆長白山十四年四月以平定金川恭上皇太后徽號遣官致祭山川如二年之禮十五年十月皇上巡幸中州詣嵩嶽廟拈香越日致祭如岱廟之禮十六年皇上南巡遣官致祭所過名山大川之神凡巡狩所至禮祀所過山川是年於山東祭東嶽泰山之神至江南祀宿遷縣龍神廟清河縣河瀆之神淮瀆之神江都縣江瀆之神皆遣官致祭親祭清河龍神廟至浙遣官祭海神廟南鎮㑹稽山凡往返渡河渡江致祭之處皆親詣拈香行禮又詣清口風神廟恵濟祠拈香至泰安詣岱廟拈香自後二十年二十七年三十年四十五年四十九年皇上六舉南巡之典所過山川之神或親詣致祭或遣官致祭並如十六年之禮是年六月加封永定河神為安流廣恵之神遣官致祭十二月以皇太后六旬萬夀恭上徽號遣官致祭山川十九年八月皇上東巡盛京望祭長白山渡松花江祭江神九月祭北鎮廟皆親詣行禮自後四十三年四十八年皇上四巡盛京所過山川致祭或親詣或遣官禮節並同二十年六月以平定伊犁恭上皇太后徽號遣官致祭山川是嵗以遣大兵西征致祭所過山川之神凡四曰阿勒坦山曰珠爾庫柱山曰博克達山曰阿拉克山皆以詔㫖讀文致祭二十二年皇上南巡三月建海神廟於杭州之觀潮樓敕封為平潮利渉浙海之神四月建河神廟於徐州銅山縣加封為顯佑通濟昭靈效順廣利安民金龍四大王之神二十四年以蕩平回部遣官致祭嶽鎮海瀆長白山二十五年釐定西域新疆山川諸神每嵗春秋秩於祀典二十六年十二月以皇太后七旬萬夀恭上徽號致祭嶽鎮海瀆長白山三十五年八月皇上六旬萬夀遣官致祭山川如禮三十六年十二月以皇太后八旬萬夀恭上徽號遣官致祭山川如二十六年之禮四十一年四月以金川蕩平恭上皇太后徽號遣官致祭山川如二十四年之禮四十三年八月皇上東巡敕建北海神廟並敕建渾河神廟遼河神廟四十五年八月皇上七旬萬夀遣官致祭山川如三十五年之禮四十八年五月命侍衞阿彌達往青海祭河源之神八月皇上東巡入闗詣北海神廟膽禮五十年正月皇上御極五十年大慶遣官致祭嶽鎮海瀆長白山凡直省所在山川有敕賜封號設立専祠者守土官咸以時致祭如禮耤田順治十年三月詔舉行先農祀典十一年二月世祖章皇帝行耕耤禮親祭先農壇壇在正陽門外西南定制嵗以仲春亥日皇帝親饗先農之神祭畢乃躬耕耤田及秋玉粒告成所司以聞擇吉収貯神倉以供天地宗廟社稷之粢盛康熈十一年二月聖祖仁皇帝行耕耤禮祭先農壇禮儀與順治十一年同前期遣官祗告奉先殿雍正二年二月世宗憲皇帝行耕耤禮祭先農壇禮儀與康熈十一年同三推畢復加一推頒發新製三十六禾詞使工歌左右隨行禮畢王以下行慶賀禮停止筵宴自是每嵗親耕如儀是年耤田内産瑞榖一莖四穂者三本一莖三穂者三本一莖兩穂者十二本順天府尹張令璜奏進羣臣請宣付史館從之四年所産尤多有至一莖九穗者豐澤園所植稻亦然羣臣表賀宣付史館葢瑞應頻徴不勝紀云四年八月命各直省督撫及府州縣衞官俱行耕耤禮祭先農壇自雍正五年為始毎嵗仲春亥日各率所屬行禮如儀所収米粟敬謹収貯以供祭祀之粢盛七年以耕耤於太嵗殿上香乾隆三年三月皇上行耕耤禮親祭先農壇前期三日幸豐澤園演耕至日躬詣耤田行三推禮畢復加一推禮畢上御齋宫王以下行慶賀禮五年三月以閏嵗春寒遣官致祭先農壇八年二月詔遣官致祭先農壇用中和韶樂舊制惟親祭用中和韶樂遣官則同小祀之例是年特諭用樂永著為例十九年三月重修先農壇外壖隙地多植松栢榆槐交太常寺飭壇戸敬謹守䕶二十三年二月詔除耕耤設棚懸綵之例三十七年二月將行耕耤臣工以聖夀六旬以上請遣官恭代不許奉諭是嵗耕耤但依典制三推弗行加一之禮五十年三月皇上躬行耕耤禮十月奉諭朕臨御以來兢兢以敬天勤民為念郊壇大祀無不躬親即耤田親耕亦從未嘗稍憚煩勞本年夀已七十有五猶親舉三推之典至本年甫經親行耕耤明嵗應否躬涖自應候朕酌行嗣後我子孫繼承奕禩惟當不􅈈益勤凡遇親耕典禮若年在六十以内禮部自應照例具題年年躬行耕耤之禮若年逾六十令禮部先期以親莅或遣官之處具本題請庶鉅典不尚虚文而展禮益昭誠恪著為令凡耕耤祭先農壇遇遣官恭代之嵗順天府府尹率屬耕耤如禮先蠶乾隆元年建先蠶祠於都城北郊以季春吉已遣太常寺堂官以太牢致祭七年建先蠶壇於西苑定皇后親蠶祀先蠶之禮是年七月大學士等奏言古者天子親耕南郊以共粢盛后親蠶北郊以共祭服我皇上親耕耤田以示重農至意乾隆元年議建先蠶祠宇所以經理農桑之道至為周備今又命議親蠶典禮伏思躬桑親蠶厯代遵行但北郊蠶壇向在安定門外前明嘉靖時以后妃出入道逺親莅未便且其地水源不通無浴蠶所遺址乆經罷廢伏讀聖祖仁皇帝御製耕織圖序云於豐澤園之北治田數畦環以溪水隴畔樹桑旁立蠶舍是育蠶之事聖祖仁皇帝親加講求今逢重熙累洽禮明樂備之時親蠶大典自應遵㫖舉行請建先蠶壇於西苑至親蠶典禮所應行齋祀躬桑授蠶治繭等儀注及選擇蠶母蠶婦受桑布繅一切禮文事宜應交禮部詳議請㫖從之尋議建先蠶壇在西苑東北壇東南為先蠶神殿前為桑園浴蠶河在宫墻之東禮部議上儀注皇后親蠶之年豫日設立先蠶西陵氏神位於蠶壇之上前二日皇后於正殿致齋至日以一太牢親祀行三獻禮翼日皇后詣桑壇行躬桑禮蠶事畢蠶母率蠶婦擇繭之圓潔者貯筐恭獻以告蠶事之登擇吉皇后復詣蠶壇親臨織室行繅三盆手禮遂布于蠶婦之吉者使繅而朱緑𤣥黄之以供郊廟黼黻之用從之九年三月皇后親饗先蠶壇翼日行躬桑之禮十一年二月定致祭先蠶遣妃恭代之禮十四年二月奉諭㫖先蠶祭期禮部奏請照例遣妃恭代此於禮意未協夫妃所恭代者代皇后也有皇后則妃可承命行事皇貴妃未經正位中宫則親蠶之禮尚不當舉行何得遣妃恭代應照皇帝不親行耕耤順天府尹致祭先農之例於内務府總管或禮部太常寺堂官奉宸苑卿内酌派一人致祭足以明等威而昭儀制於是禮部遵行並載入㑹典惟皇后册立乃復舉親饗先蠶及躬桑之禮皇朝通志巻三十七
