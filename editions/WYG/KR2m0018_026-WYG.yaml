body:
  text: 地理畧三疆域三湖廣湖北省初為湖廣省康熙三年分設為湖北湖南二省所屬府十武昌府省會領州一縣九江夏附郭興國州武昌嘉魚蒲圻咸寧崇陽通城大冶通山漢陽府領州一縣四漢陽附郭沔陽州初屬安陸府乾隆二十七年屬府漢川孝感初屬徳安府雍正七年屬府黄陂初屬黄州府雍正七年屬府安陸府舊名承天府順治二年改今名領州一縣五鍾祥附郭荆門州京山潛江天門初為景陵縣雍正四年改今名當陽襄陽府領州一縣六襄陽附郭均州宜城南漳棗陽榖城光化鄖陽府領縣六鄖附郭房竹山竹谿保康鄖西徳安府領州一縣四安陸附郭隨州雲夢應城應山黄州府領州一縣七黄岡附郭蘄州黄安蘄水羅田麻城廣濟黄梅荆州府領縣八江陵附郭公安石首監利松滋枝江宜都逺安宜昌府初為彞陵州屬荆州府雍正十三年設府領州二縣五東湖附郭雍正十三年設歸州初屬荆州府雍正六年升直𨽻州領長陽恩施二縣十三年屬府鶴峯州雍正十三年以容美土司改設長陽初屬荆州府雍正六年屬歸州十三年屬府興山巴東二縣初屬荆州府雍正十三年屬府長樂雍正十三年設施南府雍正十三年設領縣六恩施附郭初為土司雍正六年設縣屬歸州十三年於縣置府為附郭縣宣恩來鳯咸豐利川四縣並雍正十三年以土司改設建始初屬四川夔州府乾隆元年改屬湖廣湖南省初為湖廣省康熙三年分為湖北湖南二省所屬府九直𨽻州四長沙府省會領州一縣十一長沙善化附郭二縣茶陵州湘潭湘隂寧鄉瀏陽醴陵益陽湘鄉攸安化岳州府領縣四巴陵附郭臨湘華容平江寳慶府領州一縣四邵陽附郭武岡州新化城步新寧衡州府領縣七衡陽附郭清泉附郭乾隆二十一年設衡山耒陽常寧安仁酃常徳府領縣四武陵附郭桃源龍陽沅江辰州府領縣四沅陵附郭瀘溪辰谿溆浦沅州府初為州屬辰州府雍正八年升直𨽻州領黔陽麻陽二縣乾隆二年升府領縣三芷江附郭乾隆二年設黔陽麻陽二縣初屬辰州府雍正八年屬州乾隆二年屬府永州府領州一縣七零陵附郭道州祁陽東安寧逺永明江華新田永順府雍正七年以土司改設領縣四永順附郭龍山保靖桑植四縣皆雍正七年設靖州領縣三㑹同通道綏寧郴州領縣五永興宜章興寧桂陽桂東澧州初屬岳州府雍正七年升直𨽻州領縣五石門安鄉慈利三縣初屬岳州府雍正七年屬州永定雍正十三年設安福雍正七年設桂陽州初屬衡州府雍正十年升直𨽻州領縣三臨武藍山嘉禾三縣初屬衡州府雍正十年屬州陜西省初合甘肅為一省康熙二年以右布政使司分駐鞏昌五年定為陜西甘肅二省所屬府七直𨽻州五西安府省會領州一縣十五長安咸寧附郭二縣耀州雍正二年升直𨽻州十三年仍屬府咸陽興平臨潼高陵鄠藍田涇陽三原盩厔渭南富平醴泉同官雍正二年屬耀州十三年仍屬府同州府初為州屬西安府雍正三年升直𨽻州十三年升府領州一縣八㕔一大荔附郭雍正十三年設華州初為直𨽻州雍正十三年改屬府朝邑郃陽澄城韓城四縣初屬西安府雍正三年屬州十三年屬府白水初屬西安府雍正二年屬耀州十三年屬府華隂初屬華州雍正十三年屬府蒲城初屬西安府雍正十三年屬府潼闗㕔雍正四年設潼闗縣屬華州十三年屬府乾隆十二年改為㕔仍屬府鳯翔府領州一縣七鳯翔附郭隴州岐山寳雞扶風郿麟遊汧陽漢中府領州一縣八㕔一南鄭附郭寧羌州褒城城固洋西鄉鳯沔畧陽留覇㕔乾隆十五年設延安府領縣十膚施附郭安寨甘泉保安安定宜川延長延川定邊靖邊二縣雍正八年設屬榆林府乾隆元年改屬府興安府初為直𨽻州乾隆四十八年升府領縣六安康附郭乾隆四十八年以初屬州之漢隂縣改設平利洵陽白河紫陽石泉五縣初屬州乾隆四十八年屬府榆林府雍正八年以衛改設領州一縣四榆林附郭雍正八年設葭州初屬延安府雍正三年升直𨽻州乾隆元年屬府神木府谷二縣初屬延安府雍正三年屬葭州乾隆元年屬府懷逺雍正八年設商州初屬西安府雍正三年升直𨽻州領縣四鎮安雒南山陽商南四縣初屬西安府雍正三年屬州乾州初屬西安府雍正三年升直𨽻州領縣二武功永夀二縣初屬西安府雍正三年屬州邠州初屬西安府雍正三年升直𨽻州領縣三三水淳化長武三縣初屬西安府雍正三年屬州鄜州初屬延安府雍正三年升直𨽻州領縣三洛川中部宜君三縣初屬延安府雍正三年屬州綏徳州初屬延安府雍正三年升直𨽻州領縣三清澗米脂二縣初屬延安府雍正三年屬州吳堡初屬延安府雍正三年屬葭州乾隆元年改屬州甘肅省初為陜西省康熙二年以右布政使司分駐鞏昌五年移駐蘭州定為陜西甘肅二省所屬府九直𨽻州六蘭州府省會初為蘭州屬臨洮府乾隆三年裁臨洮府升州為府領州二縣四臯蘭附郭乾隆三年設狄道州初為縣屬臨洮府乾隆三年升州屬府河州初屬臨洮府乾隆三年屬府金渭源二縣初屬臨洮府乾隆三年屬府靖逺雍正八年設屬鞏昌府乾隆三年屬府平凉府領州二縣三平凉附郭固原州静寧州華亭隆徳鞏昌府領州一縣八㕔一隴西附郭岷州雍正八年設安定會寧通渭漳寧逺伏羌西和洮州㕔乾隆十三年設慶陽府領州一縣四安化附郭寧州合水環正寧寧夏府雍正二年以寧夏衛改設領州一縣四寧夏附郭靈州寧朔平羅中衛一州四縣並雍正二年由衛改設西寧府雍正二年以西寧衛改設領縣三西寧附郭碾伯二縣並雍正二年設大通乾隆二十四年設涼州府雍正二年以涼州衛改設領縣五武威附郭鎮番永昌古浪平番五縣皆雍正二年設甘州府雍正二年以甘州衛改設領縣二張掖附郭山丹二縣並雍正二年設鎮西府乾隆三十八年於巴勒庫勒設領縣二宜禾附郭竒台二縣並乾隆三十八年設涇州初屬平涼府雍正三年升直𨽻州領縣三崇信靈臺鎮原三縣初屬平涼府雍正三年屬州階州初屬鞏昌府雍正七年升直𨽻州領縣二文成二縣初屬鞏昌府雍正七年屬州秦州初屬鞏昌府雍正七年升直𨽻州領縣五秦安清水禮徽初為州屬鞏昌府雍正七年改州為縣屬州兩當初屬鞏昌府雍正七年屬州肅州雍正七年設領縣一高臺雍正二年設屬甘州府七年屬州安西州乾隆二十四年以安西鎮設府三十八年改直𨽻州領縣二燉煌玉門二縣並乾隆二十四年設屬府三十八年屬州又有淵泉縣三十八年裁迪化州乾隆三十八年於烏魯木齊設領縣三昌吉阜康綏來三縣並乾隆三十八年於新疆設四川省所屬府十有一直𨽻州九㕔六成都府省會領州三縣十三成都附郭華陽附郭康熙九年裁雍正五年復置簡州崇慶州漢州雙流康熙元年裁雍正六年復置温江新繁金堂新都郫灌彭康熙七年裁雍正六年復置新津崇寧康熙七年裁雍正七年復置什邡寧逺府雍正五年以建昌衛改設領州一縣三㕔一西昌附郭雍正五年設會理州康熙九年設屬會川衛雍正六年省㑹川衛以州屬府冕寧鹽源二縣並雍正五年設越雋㕔初為衛雍正六年改㕔保寧府領州二縣七閬中附郭巴州劒州蒼溪南部廣元昭化通江南江順慶府領州二縣八南充附郭蓬州廣安州西充營山儀隴渠大竹鄰水岳池康熙七年裁六十年復置叙州府領縣十一㕔二宜賔附郭慶符富順南溪長寧高筠連珙興文隆昌屏山初屬馬湖府治雍正五年裁馬湖府以縣屬府馬邊㕔初為營乾隆二十九年改㕔雷波㕔初為土司雍正六年改置衛乾隆二十六年改㕔重慶府領州二縣十一巴附郭合州涪州江津長夀永川榮昌綦江南川銅梁康熙元年裁六十年復置大足康熙元年裁雍正六年復置定逺康熙八年裁雍正六年復置璧山康熙元年裁雍正六年復置夔州府領縣六奉節附郭巫山雲陽萬開大寧康熙六年裁雍正九年復置龍安府領縣四平武附郭江油石泉彰明初屬成都府順治十六年裁雍正六年復置九年改屬府潼川府初為直𨽻州雍正十二年升府領縣八三臺附郭雍正十二年設射洪鹽亭中江遂寧蓬溪樂至六縣初屬州雍正十二年屬府安岳初屬州康熙元年裁雍正七年復置仍屬州十二年改屬府嘉定府初為直𨽻州雍正十二年升府領縣七樂山附郭雍正十二年設洪雅夾江犍為榮四縣初屬州雍正十二年屬府威逺康熙六年裁雍正六年復設屬州十二年屬府峩眉初屬州雍正十二年屬府雅州府初為直𨽻州雍正七年升府領州一縣五雅安附郭雍正七年設天全州雍正七年設名山榮經蘆山三縣本屬州雍正七年屬府清溪雍正八年設眉州領縣三丹稜彭山康熙元年裁併眉州雍正七年重設青神康熙六年裁併眉州雍正七年重設卭州領縣二大邑蒲江瀘州領縣三納溪合江江安資州初為縣屬成都府雍正五年升直𨽻州領縣四仁夀資陽井研内江四縣初屬成都府雍正五年屬州綿州初屬成都府雍正五年升直𨽻州領縣四徳陽安綿竹三縣初屬成都府雍正五年屬州梓潼初屬保寧府雍正五年屬州茂州初屬成都府雍正五年升直𨽻州領縣二汶川保二縣初屬成都府雍正五年屬州酉陽州乾隆元年設領縣三秀山乾隆元年設黔山彭水二縣初屬重慶府乾隆元年屬州忠州初屬重慶府雍正十二年升直𨽻州領縣三酆都墊江二縣初屬重慶府雍正十二年屬州梁山初屬夔州府雍正十二年屬州達州初屬夔州府雍正五年升直𨽻州領縣三東鄉太平二縣初屬夔州府雍正五年屬州新寧初屬夔州府康熙七年裁雍正七年復置仍屬府十二年改屬州叙永㕔雍正七年設領縣一永寧康熙二十六年設𨽻貴州威寧府雍正七年改屬㕔松潘㕔雍正九年由松潘衛改設雜谷㕔乾隆十七年由土司改設石砫㕔乾隆二十七年由土司改設阿爾古㕔乾隆四十一年以金川地設美諾㕔乾隆四十一年以小金川地設皇朝通志卷二十六
