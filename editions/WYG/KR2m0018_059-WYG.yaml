body:
  text: 欽定四庫全書皇朝通志卷五十九器服畧四冠服臣等謹案周禮内司服掌王后及外内命婦之服其别有褘衣揄翟鞠衣展衣縁衣素沙追師掌王后之首服其别有副編次追衡笄歴代以來損益不同葢禮時為大毋取沿襲也國朝定制皇太后皇后冠服有朝服吉服二等金約領約朝珠綵帨皆有制度皇貴妃以下及公主諸王福晉夫人命婦各以品秩為差今據皇朝禮器圖式依次纂輯悉載于篇而宫庭之地帷帟之間所以辨等威而彰物采者燦然具備矣皇太后皇后朝冠冬以薫貂夏以青絨為之上綴朱緯頂三層貫東珠各一皆承以金鳯飾東珠各三珍珠各十七上銜大東珠一朱緯上週綴金鳯七飾東珠各九貓睛石各一珍珠各二十一後金翟一飾貓睛石一小珍珠十六翟尾垂珠五行二就共珍珠三百有二毎行大珍珠一中間金銜青金石結一飾東珠珍珠各六末綴珊瑚冠後䕶領垂明黄縧二末綴寶石青縀為帶皇太后皇后吉服冠皇貴妃貴妃同薰貂為之上綴朱緯頂用東珠皇太后皇后金約鏤金雲十三飾東珠各一間以青金石紅片金裏後繫金銜綠松石結貫珠下垂五行三就共珍珠三百二十四毎行大珍珠一中間金銜青金石結二毎具飾東珠珍珠各八末綴珊瑚皇太后皇后耳飾左右各三毎具金龍銜一等東珠各二皇太后皇后朝褂皇皇貴妃同太子妃色用石青緞紗單袷惟其時片金緣領後垂明黄縧其飾珠寶惟宜繡文或前後立龍各二下通襞積四層相問上為正龍各四下為福壽文或前後正龍各一要帷行龍四中有襞積下幅行龍八或前後立龍各二中無襞積下幅八寶平水皇太后皇后朝袍妃皇貴同色用明黄縀紗單袷惟其時披領及袖俱石青片金縁冬加海龍或紫貂縁肩上下襲朝褂處亦加縁領後俱垂明黄縧其飾珠寶惟宜繡文或金龍九問以五色雲中無襞積下幅八寶平水或前後正龍各一兩肩行龍各一要帷行龍四巾有襞積下帷行龍八或中無襞積裾後間繡行龍下幅八寳平水披領俱行龍二袖端俱正龍各一袖相接處俱行龍各二皇太后皇后龍褂色用石青棉袷紗裘惟其時繡文五爪金龍八團兩肩前後正龍各一襟行龍四或加繡下幅八寶立水袖端行龍各二皇太后皇后龍袍色用明黄領袖俱石青棉袷紗裘惟其時繡文或金龍九間以五色雲福壽文或五爪金龍八團兩肩前後正龍各一襟行龍四下幅俱八寶立水或繡金龍八團而下幅無八寶立水領前後俱正龍各一左右及交襟處俱行龍各一袖俱如朝袍裾左右開皇太后皇后領約鏤金為之飾東珠十一間以珊瑚兩端垂明黄縧二中各貫珊瑚末綴綠松石各二皇太后皇后朝珠朝服御朝珠三東珠一珊瑚二吉服朝珠一隨所御佛頭記念背雲大小墜雜飾各從其宜縧皆明黄色皇太后皇后綵帨皇皇貴妃同太子妃綠色繡文為五穀豐登佩箴管縏􅐆之屬縧皆明黄色皇太后皇后朝帬皇貴妃太貴妃並妃嬪皇子妃同上用織金壽字紅縀下用石青行龍粧縀皆正幅有襞積夏以紗為之俱片金縁冬加海龍縁皇貴妃朝冠子皇太妃同冬以薰貂夏以青絨為之上綴朱緯制貴妃以下皆同後不具詳頂三層貫東珠各一皆承以金鳯飾東珠各三珍珠各十七上銜大珍珠一朱緯上週綴金鳯七飾東珠各九珍珠各二十一後金翟一飾貓睛石一珍珠十六翟尾垂珠三行二就共珍珠一百九十二中間金銜青金石結一飾東珠珍珠各四末綴珊瑚冠後䕶領垂明黄縧二末綴寶石青縀為帶皇貴妃金約太貴妃同皇子妃鏤金雲十二飾東珠各一間以珊瑚紅片金裏後繫金御綠松石結貫珠下垂三行三就共珍珠二百有四中間金銜青金石結二毎具飾東珠珍珠各六末綴珊瑚皇貴妃耳飾太貴妃同皇子妃左右各三毎具金龍銜二等東珠各二皇貴妃龍褂皇貴妃妃妃太子同色用石青棉袷紗裘惟其時繡文五爪金龍八團兩肩前後正龍各一襟行龍四袖端行龍各二下幅八寶立水皇貴妃龍袍色用明黄領袖俱石青棉袷紗裘惟其時繡文金龍九間以五色雲福壽文下幅八寶立水領前後正龍各一左右及交襟處行龍各一袖端正龍各一袖相接處行龍各二裾左右開皇貴妃領約子皇太妃同鏤金為之飾東珠七間以珊瑚兩端垂明黄縧二中各貫珊瑚末綴珊瑚各二皇貴妃朝珠子皇太妃同朝服用朝珠三蜜珀一珊瑚二吉服隨所用餘如皇后朝珠之制貴妃朝冠䕶領垂金黄縧二餘如冠皇貴妃朝之制貴妃朝褂嬪妃同領後垂金黄縧餘如褂之皇后朝制貴妃朝袍同妃色用金黄領後垂金黄縧餘如袍之皇后朝制貴妃龍袍同妃色用金黄餘如袍皇貴妃龍之制貴妃領約嬪妃同縧用金黄色餘如約皇貴妃領之制貴妃朝珠同妃縧皆金黄色餘如珠皇貴妃朝之制貴妃綵帨綠色繡文為五穀豐登結佩惟宜縧皆金黄色妃朝冠頂二層貫東珠各一皆承以金鳯飾東珠各九珍珠各十七上銜貓睛石朱緯上週綴金鳯五飾東珠各七珍珠各二十一後金翟一飾貓睛石一珍珠十六翟尾垂珠三行二就共珍珠一百八十八中間金銜青金石結一飾東珠珍珠各四末綴珊瑚冠後䕶領垂金黄縧二末綴寶石青縀為帶妃吉服冠太嬪妃皇子同薰貂為之上綴朱緯頂用碧䃁㺨妃金約鏤金雲十一飾東珠各一間以青金石後繫金銜緑松石結貫珠下垂三行三就共珍珠一百九十七餘如約皇貴妃金之制妃耳飾左右各三毎具金龍銜三等東珠各二妃綵帨緑色繡文為雲芝瑞草結佩惟宜縧皆金黄色嬪朝冠頂二層貫東珠各一皆承以金翟上銜􅷨子朱緯上週綴金翟五飾東珠各五珍珠各十九後金翟一飾珍珠十六翟尾垂珠三行二就共珍珠一百七十二中間金銜青金石結飾東珠珍珠各三餘如冠妃朝之制嬪金約鏤金雲八後繫金銜緑松石結貫珠下垂三行三就共珍珠一百七十七中間金銜青金石結二毎具飾東珠珍珠各四餘如之妃金約制嬪耳飾左右各三毎具金龍銜四等東珠各二嬪朝袍用香色餘如之貴妃朝袍制嬪龍褂色用石青棉袷紗裘惟其時繡文兩肩前後正龍各一襟夔龍四嬪龍袍用香色餘如之貴妃龍袍制嬪朝珠朝服用朝珠三珊瑚一蜜珀二吉服隨所用餘如貴妃朝珠之制嬪綵帨緑色不繡花文結佩惟宜縧皆金黄色皇太子妃朝袍色用杏黄餘如袍之皇后朝制皇太子妃龍袍色用杏黄餘如袍皇貴妃龍之制皇子福晉朝冠親王福晉固倫公主同頂鏤金三層飾東珠十上銜紅寳石朱緯上週綴金孔雀五飾東珠各七小珍珠三十九後金孔雀一垂珠三行二就中間金銜青金石結一飾東珠各三末綴珊瑚冠後䕶領垂金黄縧二末亦綴珊瑚青縀為帶皇子福晉吉服冠下至輔國公夫人鄉君並同薰貂為之上綴朱緯頂用紅寶石皇子福晉金約親王福晉固倫公主同鏤金雲九飾東珠各一間以青金石紅片金裏後繫金銜青金石結貫珠下垂三行三就中間金銜青金石結二毎具飾東珠珍珠各四末綴珊瑚皇子福晉耳飾下至輔國公夫人鄉君並同左右各三毎具金雲銜珠各二皇子福晉朝褂下至郡王福晉縣主並同色用石青片金縁繡文前行龍四後行龍三領後垂金黄縧雜飾惟宜皇子福晉朝袍下至郡王福晉縣主並同用香色披領及袖俱石青片金緣冬加海龍縁肩上下襲朝褂處亦加緣領後垂金黄縧雜飾惟宜繡文前後正龍各一兩肩行龍各一襟行龍四披領行龍二袖端正龍各一袖相接處行龍各二裾後開皇子福晉吉服褂色用石青繡五爪正龍四團前後兩肩各一皇子福晉蟒袍下至郡王福晉縣主並同用香色通繡九龍皇子福晉領約下至郡王福晉縣主並同鏤金為之飾東珠七間以珊瑚兩端垂金黄縧二中各貫珊瑚末綴珊瑚各二皇子福晉朝珠下至郡王福晉縣主並同朝服用朝珠三珊瑚一蜜珀二吉服用一縧皆金黄色皇子福晉綵帨下至郡王福晉縣主並同月白色不繡花文結佩惟宜縧皆金黄色皇子福晉朝帬下至輔國公夫人鄉君皆同上用紅縀下石青行龍粧縀皆正幅有襞積夏以紗為之俱片金縁冬加海龍縁親王福晉吉服褂世子福晉固倫公主和碩公主郡主並同色用石青繡五爪金龍四團前後正龍兩肩行龍世子福晉朝冠和碩公主同頂鏤金二層飾東珠九上銜紅寶石朱緯上週縀金孔雀五飾東珠各六後金孔雀一垂珠三行二就中間金銜青金石結一飾東珠各三末綴珊瑚冠後䕶領垂金黄縧二末亦綴珊瑚青縀為帶世子福晉金約和碩公主同鏤金雲八餘如約皇子福晉金之制郡王福晉朝冠郡主同頂鏤金二層飾東珠八上銜紅寶石朱緯上週綴金孔雀五飾東珠各五後金孔雀一垂珠三行二就中間金銜青金石結一末綴珊瑚冠後䕶領垂金黄縧二末亦綴珊瑚青縀為帶郡王福晉金約郡主同鏤金雲八飾東珠各一間以青金石紅片金裏後繫金銜青金石結貫珠下垂三行三就中間金銜青金石結二末綴珊瑚郡王福晉吉服褂縣主同色用石青繡五爪行龍四團前後兩肩各一貝勒夫人朝冠縣主同頂鏤金二層飾東珠七朱緯上週綴金孔雀五飾東珠各三冠後䕶領垂石青縧二末亦綴珊瑚餘如郡王福晉朝冠之制貝勒夫人金約縣主同鏤金雲七餘如郡王福晉金約之制貝勒夫人朝褂下至輔國公夫人鄉君並同繡四爪蟒領後垂石青縧餘如褂皇子福晉朝之制貝勒夫人朝袍下至輔國公夫人鄉君並同藍及石青諸色隨所用繡四爪蟒領後垂石青縧餘如袍皇子福晉朝之制貝勒夫人吉服褂郡君同色用石青前後繡四爪正蟒各一團貝勒夫人蟒袍下至輔國公夫人鄉君並同藍及石青諸色隨所用通繡九蟒貝勒夫人領約下至輔國公夫人鄉君並同縧用石青色餘如約皇子福晉領之制貝勒夫人朝珠下至輔國公夫人鄉君並同縧用石青色餘如珠皇子福晉朝之制貝勒夫人綵帨下至輔國公夫人鄉君並同縧用石青色餘如帨皇子福晉綵之制貝子夫人朝冠郡君同頂鏤金二層飾東珠六餘如貝勒夫人朝冠之制貝子夫人金約郡君同鏤金雲六餘如貝勒夫人金約之制貝子夫人吉服褂縣君同色用石青前後繡四爪行蟒各一團鎮國公夫人朝冠縣君同頂鏤金二層飾東珠五餘如貝子夫人朝冠之制鎮國公夫人金約縣君同鏤金雲五餘如貝子夫人金約之制鎮國公夫人吉服褂輔國公夫人鄉君同色用石青繡花八團輔國公夫人朝冠鎮國公女鄉君同頂鏤金二層飾東珠四餘如鎮國公夫人朝冠之制輔國公夫人金約鎮國公女鄉君同鏤金雲四餘如鎮國公夫人金約之制輔國公女鄉君朝冠頂鏤金二層飾東珠三餘如輔國公夫人朝冠之制輔國公女鄉君金約鏤金雲三餘如輔國公夫人金約之制民公夫人朝冠冬以薰貂夏以青絨為之上綴朱緯前綴金簪三飾以珠寶䕶領縧用石青色其制下達命婦皆同後不具詳頂鏤花金座中飾東珠四上銜紅寶石民公夫人吉服冠侯伯子鎮國將軍夫人一品命婦皆同頂用珊瑚民公夫人金約下至七品命婦皆同青縀為之紅片金裏中綴鏤金火焰飾珍珠一左右金龍鳯各一後垂青縀帶二亦紅片金裏民公夫人耳飾下至七品命婦皆同左右各三每具金雲銜珠各二民公夫人朝褂下至七品命婦皆同色用石青片金緣繡文前行蟒二後行蟒一領後垂石青縧雜飾惟宜民公夫人朝袍下至奉國將軍夫人及三品命婦皆同藍及石青諸色隨所用披領及袖俱石青片金縁冬海龍縁繡文前後正蟒各一兩肩行蟒各一襟行蟒四中無襞積披領行蟒二袖端正蟒各一袖相接處行蟒各二後垂石青縧雜飾惟宜民公夫人吉服褂下至七品命婦皆同色用石青繡花八團民公夫人蟒袍下至奉國將軍夫人及三品命婦皆同藍及石青