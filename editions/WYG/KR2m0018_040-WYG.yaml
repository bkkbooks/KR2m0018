body:
  text: 欽定四庫全書皇朝通志卷四十禮畧吉禮五上陵臣等謹按鄭志上陵一門載於吉禮之次以事係祭祀與山陵之典有别也我皇朝尊祖敬宗典章詳審超軼徃代謁陵大禮憲古準今尤為隆備謹述鉅典載於篇中以彰聖朝誠孝之上儀焉肇祖原皇帝興祖直皇帝景祖翼皇帝顯祖宣皇帝陵曰永陵原皇后直皇后翼皇后宣皇后各合葬在興京西北十里啓運山臣等謹按肇祖原皇帝興祖直皇帝景祖翼皇帝顯祖宣皇帝陵舊在興京共一山天命九年建都東京奉移景祖顯祖陵於遼陽順治十五年奉移景祖顯祖陵仍祔于興京祖陵稱四祖陵十六年尊為永陵云太祖高皇帝陵曰福陵孝慈高皇后合葬在盛京城東北二十里天柱山太宗文皇帝陵曰昭陵孝端文皇后合葬在盛京城西十里隆業山孝莊文皇后陵曰昭西陵在遵化州昌瑞山孝陵之南世祖章皇帝陵曰孝陵孝康章皇后合𦵏端敬皇后祔𦵏在遵化州西北七十里昌瑞山孝恵章皇后陵曰孝東陵在孝陵之東聖祖仁皇帝陵曰景陵孝誠仁皇后孝昭仁皇后孝懿仁皇后孝恭仁皇后合葬敬敏皇貴妃從葬在孝東陵之東世宗憲皇帝陵曰泰陵孝敬憲皇后合葬敦肅皇貴妃從葬在易州西三十里永寧山孝聖憲皇后陵曰泰東陵在泰陵之東孝賢皇后陵慧賢皇貴妃哲憫皇貴妃淑嘉皇貴妃從𦵏在遵化州昌瑞山孝陵之西天聰六年十二月太宗文皇帝率諸貝勒大臣詣太祖陵行時享禮八年十二月上率諸貝勒大臣詣太祖陵行禮十年三月清明節上率諸貝勒大臣親祭太祖山陵崇徳元年四月以營建太廟遣官捧祝文祭告太祖山陵時定嵗除日清明日祭陵用牛一遣守陵官行禮東京陵用牛二遣宗室覺羅大臣行禮福陵用牛一羊二遣大臣一人行禮忌辰孟秋望日萬夀聖節上香燭獻酒果均遣大臣一人奠帛讀祝行禮每月朔望致祭用牛一不讀祝奠帛遣守陵官行禮四年四月以征明大㨗祭告福陵上親詣行禮順治元年七月以中原平定遷都於燕遣官告祭福陵二年正月定萬夀節應遣官祭福陵昭陵止上香燭供酒果不讀祝八年六月定諸陵祭典四祖陵於冬至嵗暮清明中元十月朔俱遣宗室覺羅大臣致祭每月朔望獻熟羊一令守陵章京致祭祭福陵昭陵上躬徃自左門入若遣官自右門入祭文祭品悉由中門入除清明中元嵗暮照常致祭外每嵗十月朔冬至亦各致祭一次凡和碩親王以下文武三品官以上或専往盛京或道過俱先謁福陵昭陵於二門外行三跪九叩禮及還辭陵禮如前十一年九月遣輔國公班布爾善等恭代祭福陵昭陵十五年十二月禮部議凡官員有以他事赴盛京者三品以上官於皇陵城門外行禮遇祭祀日二品以上大臣許入門同守陵各臣侍班從之十七年派宗室覺羅數人居盛京每祭陵日令其行禮康熙二年十一月禮部題福陵昭陵孝陵四季大祭恭奉神牌安設寳座致祭至聖誕忌辰十月朔及每月朔望祭祀既無祝帛應不必恭移神牌掲幔祭獻從之八年停止宗室覺羅居住盛京每年四陵四時大祭遣多羅貝勒以下奉國將軍覺羅男爵以上前往致祭九年八月聖祖仁皇帝奉太皇太后皇太后啟行恭謁孝陵至日行祗謁禮次日上詣隆恩殿大祭又次日詣寶城前致祭臣等謹案康熙九年以後聖祖仁皇帝恭謁孝陵二十七年以後恭謁孝莊文皇后暫安奉殿皆嵗或一行或至再至三兹惟謹載歴年以来禮儀初定或以事特舉者餘年均不備叙至世宗憲皇帝恭謁昭西陵孝陵孝東陵景陵皇上恭謁昭西陵孝陵孝東陵景陵泰陵泰東陵聖聖相承覲揚光烈至孝肫誠禮文賅洽不能盡述敬從前例約著於編十年九月聖祖仁皇帝詣盛京恭謁福陵昭陵啟行前一日上躬詣太廟行祇告禮次日啟鑾設騎駕鹵簿不作樂至日恭謁福陵行禮畢隨恭謁昭陵行禮次日恭謁福陵昭陵隆恩殿行大饗禮又次日於福陵昭陵隆恩殿前設黄幄焚楮帛行讀文致祭禮先期遣王暨内大臣前詣永陵致祭祭福陵昭陵時諸妃園寢亦照常致祭諸親王功臣墓各遣大臣奠酒及回鑾率王以下各官恭詣福陵昭陵行告成禮聖駕回鑾設儀仗作樂經過地方官咸朝服跪迎聖祖仁皇帝往返均詣孝陵奠酒行禮至京日恭詣太廟行祗告禮畢還宫次日王以下文武各官進表慶賀頒詔天下十五年定陵寢祭品祭儀詳見大清㑹典二十年三月奉移仁孝皇后孝昭皇后梓宫安葬上謁孝陵行禮次至仁孝皇后孝昭皇后陵命皇子等行禮奠酒自是年始聖駕謁孝陵畢次至皇后陵奠酒儀並同十一月上以雲南報㨗恭謁孝陵行禮次日行大祭禮二十一年二月上以雲南底定親詣永陵福陵昭陵告祭行禮啟行前一日祗告奉先殿過遵化州親詣孝陵奠酒三月恭謁福陵昭陵儀與康熙十年同駕至興京展謁永陵次日行大饗禮儀與福陵昭陵同四月以回鑾恭詣福陵昭陵奠酒五月至遵化州復詣孝陵奠酒聖駕回京祗告奉先殿其王以下文武各官行禮奉㫖停止二十七年四月奉移太皇太后梓宫於暫安奉殿五月上謁暫安奉殿行禮奠酒次謁孝陵行禮次至仁孝皇后孝昭皇后陵奠酒自是年始聖駕謁暫安奉殿次謁孝陵儀並同二十八年十月奉安孝懿皇后梓宫於陵寢上詣暫安奉殿孝陵奠酒又至仁孝皇后孝昭皇后孝懿皇后陵舉哀三十六年十月奉諭暫安奉殿非係山陵地方既近嗣後凡忌辰致祭著照四時大饗禮行三十七年七月上以親征平定噶爾丹恭奉皇太后詣盛京謁陵告祭啟鑾出古北口經䝉古諸部落至松花江及吉林烏拉地方九月駕至興京展謁永陵行禮至盛京展謁福陵昭陵次日大祭儀並與二十一年同回鑾入山海闗十一月謁暫安奉殿孝陵奠酒禮成回京六十年正月上以御極六十年大慶命皇四子和碩雍親王憲皇帝世宗廟諱皇十二子固山貝子允祹世子𢎞晟恭代祭告永陵昭陵福陵二月恭謁暫安奉殿孝陵孝東陵行禮次至仁孝皇后孝昭皇后孝懿皇后陵奠酒次日行大祭禮雍正元年四月世宗憲皇帝恭謁暫安奉殿孝陵孝東陵行禮次詣仁孝皇后孝昭皇后孝懿皇后陵行禮是日奉安聖祖仁皇帝梓宫於景陵饗殿八月上恭謁暫安奉殿孝陵孝東陵行禮遂至景陵饗殿行禮三年二月恭移孝莊文皇后梓宫安奉於昭西陵饗殿遣官致祭十一月上恭謁昭西陵孝陵孝東陵景陵行禮嗣是謁陵禮儀同四年十一月諭逢聖祖仁皇帝每年忌辰遵照周年例舉行十三年十月更定列祖列后忌辰致祭陵寢儀王大臣遵㫖議奏各陵寢四時大祭牲用太牢獻帛爵讀祝文致祭於隆恩殿具朝服行禮與各陵忌辰祭祀之禮不同嗣後恭遇列祖列后忌辰致祭陵寢均照四時大祭禮舉行從之乾隆元年正月皇上恭謁昭西陵孝陵孝東陵景陵行禮奠酒舉哀並命修葺山陵廟貌永陵福陵昭陵殿宇一體修繕二月特遣宗室將軍六人徃駐盛京給以田廬永逺承奉三陵祭祀二年十月以修理陵寢工竣恭謁昭西陵孝陵孝東陵景陵行禮次日遣官致祭上親詣景陵行禮三年二月上以清明節恭詣泰陵展謁行禮是日駕未至碑亭即降輦慟哭步入隆恩門至寳城前行禮奠酒哀慟良久次日躬祭泰陵未至碑亭即下輦步入隆恩門至隆恩殿行禮畢復詣寳城前奠酒舉哀嗣後聖駕謁陵祭陵儀並同八年七月上奉皇太后駕徃盛京恭謁祖陵啟行前一日親詣奉先殿祗告九月駕至興京恭謁永陵次日行大饗禮儀與康熙二十一年同駕至盛京恭謁福陵次日行大饗禮儀與康熙十年同禮畢即往謁昭陵儀與謁福陵同禮成乃親臨功臣之墓遣官往祭長白山北鎮醫巫閭山及遼太祖陵回鑾次日皇上親詣奉先殿告祭越二日禮部奏請行慶賀禮儀與三大節朝賀同十四年三月以金川平定上恭謁昭西陵孝陵孝東陵景陵行禮次詣泰陵行禮十七年十月奉安孝賢皇后梓宫於陵寢嗣是聖駕恭謁昭西陵孝陵孝東陵景陵禮畢至孝賢皇后陵奠酒儀並同十九年七月上奉皇太后自避暑山莊啟行駕徃盛京恭謁祖陵禮儀均與乾隆八年同是年議准展謁祖陵之日皇上素服行禮大祭日皇上禮服陪祀及執事大臣咸朝服二十年五月以平定準噶爾遣皇子代行祭告山陵二十五年二月以回部平定恭謁昭西陵孝陵孝東陵景陵行禮次詣泰陵行禮盛京三陵遣親王前往恭代行禮四十一年三月以金川平定恭謁昭西陵孝陵孝東陵景陵行禮畢次詣泰陵行禮四十二年三月奉安孝聖憲皇后梓宫於泰東陵恭奉神位升祔太廟禮畢皇上恭謁泰東陵慟哭行禮如謁泰陵之儀四十三年七月上三詣盛京恭謁祖陵如十九年之儀四十八年八月上四詣盛京恭謁祖陵如四十三年之儀凡皇帝恭謁祖陵儀嵗清明中元冬至除夕列聖列后忌辰及國有大慶大饗儀朔望謁奠儀及因事遣官祗告儀皆具載大清通禮五祀臣等謹按鄭志載天子七祀一門本諸周制王為羣姓立七祀曰司命曰中霤曰國門曰國行曰泰厲曰户曰竈洎乎漢晉以後惟祭五祀唐開元禮有祭七祀之儀後亦旋罷我朝祀事之隆折衷古今典制大備五祀之禮惟順治年中行之即于十八年停止盖以太廟階下合祭既停因並罷其専祀也惟是曽經舉行宜存故典謹編次於此以備考順治八年定制每嵗致祭五祀之神禮臣議奏以正月祭司户之神於宫門外道左南向以四月祭司竈之神於大内大庖前中道南向以六月祭中霤之神於文樓前西向以七月祭司門之神於午門前西角樓東向以十月祭司井之神於内府大庖井前南向中霤門二祀太常寺掌之户竈井三祀内務府掌之先是於嵗暮合祭是年停止十五年十二月復嵗暮合祭五祀之禮十八年正月奉諭㫖户竈井神停其祭祀又奉諭中霤門神停其祭祀是嵗王大臣奏罷太廟階下合祭之祀從之歴代帝王廟順治二年三月增定歴代帝王廟祀典禮部言三月三日例祭歴代帝王請以遼太祖及功臣耶律赫嚕金太祖世宗及功臣完顔尼瑪哈完顔沃哩布元太祖及功臣穆呼哩巴延明太祖及功臣徐達劉基並宜增祀用彰皇上追崇至意從之是月遣官致祭諸帝王祀以太牢筵各一品俱二十四功臣祀以少牢二位筵共一品俱十自後嵗以春秋仲月諏吉遣官致祭著為定典十四年正月定親祭歴代帝王廟儀二月世祖章皇帝親祭歴代帝王廟六月改定歴代帝王廟祀典時臺臣奏請以歴代守成令主入廟並祭又奏請罷宋臣潘美張浚從祀禮部議覆得㫖商中宗髙宗周成王康王漢文帝宋仁宗明孝宗俱入廟致祭遼太祖金太祖元太祖原未混一天下不宜與祭著停止康熙元年二月復定歴代帝王廟祀典大學士等議覆歴代帝王祀典如遼太祖金太祖元太祖俱係開創之君仍宜入廟崇祀至商中宗髙宗周成王康王漢文帝宋仁宗明孝宗守成七帝應照㑹典在各陵廟致祭從之三年詔修歴代帝王廟六十年四月詔增定歴代帝王廟祀典諭大學士等朕披覽史冊於前代帝王每加留意書生輩但知譏評往事前代帝王雖無過失亦必刻意指摘論列短長全無公是公非朕觀歴代帝王廟崇祀者每朝不過一二位或廟享其子而不及其父或配享其臣而不及其君皆因書生妄論而定甚未允當况前代帝王曾為天下主後世之人俱分屬臣子而可輕肆議論定其崇祀與不崇祀乎今宋明諸儒尚以其宜附孔廟奏請前代帝王既無後裔後之君天下者繼其統緒即當崇其祀典朕君臨宇内不得不為前人言也朕意以為凡曾在位除無道被弑亡國之主外盡應入廟崇祀爾等公同詳議具奏六十一年禮部疏覆上諭大學士等曰此所議應崇祀處皆是但其中尚有宜詳細斟酌者從前所定配享功臣大概開國元勲居多如明之徐達不過一草莽武夫劉基係元之進士遭遇成功遂以元勲配享其治安之世輔佐太平有功軍國者反不得與配享列是皆未為允當也又如有明天下皆壊於萬厯泰昌天啟三朝愍帝即位未嘗不勵精圖治而所值事勢無可如何明之亡非愍帝之咎也愍帝不應與亡國之君同論萬厯泰昌天啟實不應入崇祀之内爾等㑹同九卿分别確議具奏六十一年十二月禮部遵大行皇帝諭㫖議覆歴代帝王廟原祀伏羲氏神農氏軒轅氏金天氏髙陽氏髙辛氏陶唐氏有虞氏夏禹王商湯王周武王漢髙祖世祖唐太宗遼太祖宋太祖金太祖世宗元太祖世祖明太祖二十一位今擬增夏啟仲康少康杼槐芒泄不降扄厪孔甲臯發商太甲沃丁太庚小甲雍己太戊仲丁外壬河亶甲祖乙祖辛沃甲祖丁南庚陽甲盤庚小辛小乙武丁祖庚祖甲廪辛庚丁太丁帝乙周成王康王昭王穆王共王懿王孝王夷王宣王平王桓王荘王僖王恵王襄王頃王匡王定王簡王靈王景王悼王敬王元王貞定王考王威烈王安王烈王顯王慎靚王漢恵帝文帝景帝武帝昭帝宣帝元帝成帝哀帝明帝章帝和帝殤帝安帝順帝冲帝桓帝靈帝昭烈帝唐髙祖髙宗睿宗元宗肅宗代宗徳宗順宗穆宗文宗武宗宣宗懿宗僖宗遼太宗景宗聖宗興宗道宗宋太宗真宗仁宗英宗神宗哲宗髙宗孝宗光宗寧宗理宗度宗端宗金太宗章宗宣宗元太宗定宗憲宗成宗武宗仁宗泰定帝文宗寧宗明太宗仁宗宣宗英宗景帝憲宗孝宗武宗世宗穆宗愍帝凡一百四十三位其從祀功臣原祀黄帝臣風后力牧唐虞臣臯陶夔龍伯夷伯益商臣伊尹傅説周臣周公旦召公奭太公望召虎方叔漢臣張良蕭何曹參陳平周勃鄧禹馮異諸葛亮唐臣房元齡杜如晦李靖郭子儀張巡許逺李晟宋臣曹彬韓世忠岳飛遼臣耶律赫嚕金臣尼瑪哈沃哩布元臣穆呼哩巴延明臣徐達劉基三十九人今擬増黄帝臣倉頡商臣仲虺周臣畢公髙吕侯仲山甫尹吉甫漢臣劉章魏相丙吉耿弇馬援趙雲唐臣狄仁傑宋璟姚崇李泌陸贄裴度宋臣吕蒙正李沆冦準王曾范仲淹富弼韓琦文彦博司馬光李綱趙鼎文天祥金臣斛羅元臣博果宻托克托明臣常遇春李文忠楊士竒楊榮于謙李賢劉大夏凡四十人世宗憲皇帝諭是依議速行十二月增設歴代帝王廟牌位遣官致祭雍正二年三月親祭歴代帝王廟七月諭禮部嗣後親祭時鹵簿大駕俱由廟門映壁外行三年九月四年二月五年三月七年二月皆親祭行禮乾隆元年九月詔追諡明建文皇帝為恭閔惠皇帝入祀歴代帝王廟三年九月皇上親祭歴代帝王廟九年二月皇上親祭歴代帝王廟二十九年重修歴代帝王廟詔改葢黄瓦以崇典禮三月工竣皇上親詣致祭四十年三月四十八年三月皆親祭歴代帝王廟四十九年七月奉上諭朕因覽四庫全書内大清通禮一書所列廟祀歴代帝王位號乃因舊㑹典所定有所弗惬於心敬憶皇祖實錄有飭議增祀之諭令查取禮部原議紅本則係康熙六十一年十一月内具題爾時諸臣不能仰體聖懷詳細討論未免因陋就簡我皇祖諭㫖以凡帝王曾在位者除無道被弑亡國之主此外盡應入廟即一二年者亦應崇祀煌煌聖訓至大至公上自羲軒下至勝國其間聖作明述之君守文繼體之主無不馨香妥侑不特書生臆論無能仰喻髙深即歴代以來升歆議禮未有正大光明若此者也乃㑹議疏内聲明偏安亡弑不入祀典而仍入遼金二朝不入東西晉元魏前後五代未免意有偏向視若仰承聖意而實顯與聖訓相背朕意若謂南北朝偏安不入正統則遼金得國亦未奄有中原何以一登一黜適足啟後人之訾議即因東西晉前後五朝有因簒得國擯而不列如操丕不得為正統之例殊不知三國時正統在昭烈故雖以陳夀三國志之尊魏抑蜀而卒不能奪萬世之公評至司馬氏簒竊以還南朝神器數易如宋武帝崛起丹徒手移晉祚自不能掩其簒奪之罪其他雖祖宗得國不正而子孫能繼緒承休即為守文中主亦不可概從缺略况自漢昭烈以至唐髙祖統一區夏時之相去三百餘年其間英毅之辟節儉之主史不絶書又安可置而不論至於後五代如朱温以至郭威或起自冦竊或身為叛臣五十餘年更易數姓中華統緒不絶如綫然周世宗承藉郭氏餘業凴有疆域尚不失為令主此而概不列入則東西晉前後五代數百年間創守各主祀典缺如何以協千秋公議他如元魏雄據河北地廣勢强太武道武勤思政理講學興農亦可為偏安英主並當量入祀典以示表章朕前命館臣録存楊維禎正統辨諭内詳晰宣論以維禎所辨正統在宋不在遼金之説為是所以存春秋綱目之義見人心天命之攸歸且檢閲孫承澤春明夢餘録所載明代崇祀古帝王位號原未列遼金二朝今通禮内崇祀遼金而不入東西晉前後五代似此互相入主出奴伊于何底此皆議禮諸臣有懷偏見明使後世臆説之徒謂本朝於歴代帝王未免區分南北意存軒輊甚失皇祖降諭之本意也至明之亡國由於神熹二宗紀綱隳而法度弛愍帝承統時國事己不可為雖十七年身歴勤苦不能補救傾危卒且身殉社稷未可與荒淫失國者一例而論是以皇祖睿裁將神熹二宗撤出而愍帝則特令廟祀褒貶予奪毫釐不爽實千古大公定論乃諸臣於定議時轉復將漢之桓靈增入豈未思炎漢之亡亡於桓靈而不亡於獻帝乎從前定議未將東漢全局詳審論斷轉使昏闇之君濫叨廟食所議未為允協夫自古帝王統緒相傳易代以後饗祀廟庭原以報功崇徳至于嚴簒竊之防戒守成之主或予或奪要必出於至當而無所容心於其間方協彰癉之義所有歴代帝王廟祀典著大學士九卿更行悉心詳議具奏並著於定議後交四庫館恭録皇祖諭㫖並朕此㫖於通禮廟饗首卷以昭殷鑒歴朝垂示萬年之至意尋遵㫖議奏請增入廟祀晉元帝康帝明帝穆帝成帝哀帝簡文帝宋文帝孝武帝明帝齊武帝陳文帝宣帝元魏道武帝明帝太武帝文成帝獻文帝孝文帝宣武帝孝明帝唐明宗周世宗共二十三帝至漢之桓帝靈帝應遵㫖撤出又奏請唐憲宗金哀宗應否増祀伏候訓示遵行得㫖大學士九卿等㑹議増祀兩晉元魏前後五代各帝王一摺並聲請唐憲宗金哀宗應否一體增祀等語憲宗處唐中葉各鎮節度憑陵跋扈僣叛不臣憲宗命將専征削平淮西厥功頗偉在有唐一代中尚屬英主其末年被弑係禍變猝乗與荒亂失徳召變致叛者不同至金哀宗處衰弱之時國勢已不可問推其致敗之由實因熙宗海陵淫虐階厲哀宗自縊殉國與明之愍帝事同一例自應一體增祀餘俱著照所奏行五十年四月安奉歴代帝王廟神位工竣皇上親詣致祭行禮如儀皇朝通志卷四十
