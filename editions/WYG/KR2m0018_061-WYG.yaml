body:
  text: 欽定四庫金書皇朝通志卷六十一器服畧六鹵簿臣等謹按國初定制鹵簿儀仗參用宋明之舊而旂章麾葢視前倍簡焉乾隆十三年皇上憲古宜今釐正典禮更定法駕鑾駕騎駕鹵簿合三者則為大駕鹵簿凡旌旄麾幢旗纛之屬靡不折衷盡善用以隆郊祀而著朝儀備軌物而光羽衛典綦重也至若皇太后皇后儀駕及皇貴妃以下儀仗采仗悉經睿定詳載皇朝禮器圖式兹並敬謹編輯為鹵簿一門而旌旗則以次附見焉皇帝大駕鹵簿大祀則南郊陳之導葢一黄緞為之綢裏通髙八尺六寸三分葢徑五尺一寸五分繡八寳彩雲冠以金頂七寸三分垂幨三層各深一尺繡金龍九間以流雲火珠旁垂彯帶二長三尺一寸濶二寸五分如葢色垂五采流蘇曲柄木質塗金交龍徑二尺上下攅竹髤朱上長二尺五寸下長五尺四寸圍四寸七分鐓以銅鋄銀長二寸二分凡大朝㑹則陳於丹陛正中拂塵二朱氂為之長二尺結於木柄柄長二尺一寸二分圍一寸五分七釐通髤以金上飾鏤金龍首二寸五分銜小金鐶以綴拂下飾鏤金龍尾三寸三分末屬金環垂朱緌立夏始陳之處暑後不用凡大朝㑹設鹵簿則自拂塵至引仗以次排列提鑪二笵金為之形圓有葢通髙七寸八分深四寸六分口徑三寸二分腹圍一尺七寸六分項鈒花文銜珊瑚耳為雙龍三足各髙一寸二分葢髙二寸徑與口徑同環鏤芙蕖下垂雲葉頂鏤蟠龍提以金索四三屬於鑪一屬於葢並繫雲葉上提杆攅竹髤朱長四尺五寸圍三寸一分四釐兩端飾金龍首尾上綴金鈎以懸鑪行則提之陳設時承以八角盤置方几上盤口徑一尺三寸五分底徑一尺一寸一分通髤朱繪金花文几髙一尺四寸五分上徑一尺四寸四分下徑一尺四寸八分四足鏤螭首虎爪承以圓珠下周横距通髤以朱分繪金雲火珠香合二笵金為之形圓有葢通髙三寸五分口徑六寸三分葢髙一寸四分面為蟠龍周為雲龍口為回文下深一寸六分亦鏤雲龍回文足髙五分飾以雜寶盥盆一笵金為之形圓十二棱髙四寸五分口徑一尺五寸邊鈒花文飾以雜寶底徑一尺六寸鏤雲龍中銜紅玻璃唾壺一笵金為之形圓有葢通髙五寸口徑一寸五分葢髙二寸五分頂為蟠龍下深二寸五分底徑二寸一分座髙四寸徑三寸三分四足鏤螭首虎爪承以圓珠下周横距飾以雜寶水瓶二笵金為之有葢大小各一大者通髙一尺五寸七分深一尺三寸五分口徑四寸四分鈒花文腹圍二尺八寸八分鈒雲龍火珠下為波紋耳為螭首銜環底徑七寸葢髙一寸五分徑九寸四分飾以雜寶小者通髙一尺四寸五分深一尺二寸五分口徑四寸一分腹圍二尺六寸六分底徑五寸四分葢髙一寸五分徑八寸六分形制花文皆同香合以下陳設時制並同提鑪馬杌一枬質髤朱髙一尺五寸方一尺八寸面繪金雙龍間以流雲中為火珠四足鏤螭首虎爪承以圓珠下周横距雜繪八寶交椅一枬質塗金曲扶箕張倚上仰交足横距貫以鐵樞雙疊舉之通髙二尺九寸二分縱一尺一寸五分横二尺二寸座面織黄絲倚刻花草雲龍文踏几髙三寸三分縱九寸五分横一尺八寸六分亦塗金儀刀三十鍊鐵為之刃長二尺四寸八分木柄長一尺二寸五分端垂緑緌鞘長二尺七寸五分通鞔緑沙魚皮銎及鉆皆塗金鏤花文繫以黄鹿皮懸於革帶帶飾亦塗金櫜鞬三十以革為之黒色緑縁櫜長一尺一寸四分圍一尺四寸三分底木質髤朱徑五寸五分盛矢十有二鞬長二尺三寸三分上徑一尺一寸五分中徑七寸七分下徑二寸五分韜弓及半皆飾鏤金鉸具銜以雜寶繫以黄鹿皮懸於革帶鞬左櫜右帶飾亦塗金銜緑松石豹尾槍三十鍛鐵為之刃長一尺五分冐以木黄油繪行龍銎塗金縷垂雲文下綴朱氂垂鐶懸豹尾長三尺三寸柄攅竹髤朱繪金雲龍長九尺五寸圍四寸九分五釐鐏以鐵鋄銀長七寸殳四鍛鐵為之首長一尺四寸八棱上徑一寸一分下徑六分鋄金龍文銎長九寸鏤龍首上下鉆以鐵塗金鏤花柄長八尺餘如豹尾槍之制戟四鍛鐵為之援長一尺三寸胡外曲徑七寸三分中有􅟉􅟉上横二寸五分下横五寸内外各半外鏤龍首銎長九寸鏤龍首上銜通塗以金柄長八尺餘如豹尾槍之制九龍曲葢四黄緞為之通髙一丈二尺二寸葢徑五尺繡彩雲上冠金頂一尺一寸垂幨三層各深一尺一寸繡金龍九間以流雲火珠下綴金鈴各十五旁垂彯帶二長三尺五寸濶二寸五分如葢色亦繡彩雲綴鈴各三曲柄木質塗金龍首徑二尺三寸上下攅竹髤朱上長三尺七寸下長五尺二寸圍四寸七分鐓以銅鋄銀長八分翠華葢二緑緞為之通繡孔雀翎旁無彯帶餘如九龍曲葢之制紫芝葢二紫緞為之通繡五色芝二十四旁無彯帶餘如九龍曲葢之制九龍葢二十黄緞為之直柄餘如九龍曲葢之制五色花葢二十以緞為之五色各四通繡雜花直柄餘如九龍曲葢之制五色龍葢十以緞為之五色各二直柄餘如九龍曲葢之制方繖八以緞為之紅紫二色各四方五尺不施繡文四角出銅龍首垂五采流蘇直柄餘如九龍曲葢之制壽扇八黄緞為之通髙一丈一尺八寸扇圓徑三尺二寸繡青壽字一夾以五彩雙龍間流雲火珠中貫柄處飾藍緞上繡花文中繡流雲蝙蝠下繡山水文縁亦以藍週繡金回文背黄緞銷金龍二約以金花翠葉柄攅竹髤朱長八尺五寸圍四寸六分鐓以銅髙一寸五分雙龍扇一十六以緞為之紅黄二色各八通髙一丈八寸扇圓徑三尺五寸繡五彩升降龍間以流雲紅緑暈二重周為襞積巾貫柄處飾以藍上下為金蹲龍背為金團龍約以金花翠葉柄攅竹髤朱長七尺五寸圍四寸六分鐓以銅髙一寸五分雙龍扇二六黄緞為之藍縁餘如雙龍扇一之制雙龍扇三六黄緞為之藍縁銷金升降龍二餘如雙龍扇一之制單龍扇十六以緞為之紅黄