  text: 欽定四庫全書皇朝通志卷四十四
  hash: sha256:78b430246d454f80b214dfd9de093b771394d2f8e34f6f36baf3d046f64d84f4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_044-1a, image: WYG0644/WYG0644-0543a.png}
body:
  text: 禮畧軍禮一臣等謹按鄭樵通志列軍禮於賓禮之後恭查軍禮中有天子親征大閲大狩諸大典不應後於賓禮茲謹遵大清通禮次第序於賓禮之前鄭志所載有天子諸侯將出征類宜造禡并祭所過山川軷祭田獵講武命將出征宣露布大射鄉射合朔伐鼔祭馬祖時儺諸目兹遵㑹典序軍禮之大者曰皇帝親征曰親征凱旋曰命將出征曰凱旋郊勞曰獻俘受俘曰大閲曰大狩遞著於篇以昭聖代神武覲揚之盛烈鄭志所載諸目統已該備於篇中矣至合朔伐鼔祭馬祖為祠祭司及太僕寺之職掌不必列於軍禮而時儺一節亦非禮之重者皆不復述焉皇帝親征崇徳元年十月太宗文皇帝親統大軍往征朝鮮先期告天告廟頒行軍律令乃分兵為左右翼聖駕出撫近門設鹵簿吹螺奏樂恭謁堂子行三跪九叩禮復於堂子外建立八纛吹螺奏樂行三跪九叩禮畢遂啟行二年朝鮮國王服罪請降康熙三十五年二月聖祖仁皇帝以厄魯特噶爾丹悖天虐衆宜及時剪滅遣發大兵分道並進躬統六師由中道聲罪致討欽天監擇日啟行前期三日分遣官祗告天地太廟社稷太歲頒行軍律令至日遣官致祭道路火礟之神聖駕出宫進堂子街門行三跪九叩禮畢致禮於旗纛之神聖駕啟行至西巴䑓遣使齎勅往諭噶爾丹躬率前鋒軍進發噶爾丹知聖駕親征驚遁聖駕至克魯倫河盡獲鎧甲器械廬帳老弱於塗復率前軍追至托諾分兵遣平北將軍追躡聖駕回鑾是年九月噶爾丹收集散亡復圖侵掠大將軍報至聖祖仁皇帝親廵行北邊經理機務奉諭朕出塞試鷹當減從而往諸色人等不得告請從行欽天監擇定行軍日期左翼於十七日起程右翼於十八日起程至十九日聖祖仁皇帝駕發京師十月至白塔向歸化城十一月至和坦和碩渡河是時河氷未凍獨於渡處數里結為堅氷車馬坦行厄魯特来降者絡繹不絶噶爾丹知部曲潰散遣使納欵復頒勅諭遣使齎往招撫乃自棟斯垓統軍回鑾三十六年二月聖祖仁皇帝三舉北征仍分兩路出師聖駕巡晉及秦就近調遣口外王貝勒台吉等先傳諭㫖止其請安進貢各地方大員止許單身至黄河兩岸迎接時哈宻已擒逆子俘送軍前青海八台吉懇請來朝厄魯特之部長宰桑等皆納欵求降噶爾丹仰藥自殺丹濟拉諾顏格隆等攜其尸來歸朔漠蕩平聖駕自黄河舟行回鑾親征凱旋崇徳二年三月太宗文皇帝率從征王貝勒大臣等班師朝鮮國王率羣臣出王城十里外跪送太宗文皇帝下馬升座該王率羣臣行三跪九叩禮遣大臣二人送還國乃於軍中以班師行祭旗纛禮將至盛京二十里太宗文皇帝入黄幄陞座王貝子文武羣臣各䝉古部長等率衆排班奉慶賀表跪進行三跪九叩禮乃大燕至盛京日恭謁堂子行禮還宫康熙三十五年五月聖祖仁皇帝自克勒和碩統軍回鑾諸王大臣請行慶賀禮不許越五日撫逺大將軍大破賊於昭黙多之地㨗音至聖祖仁皇帝出行營南門外設香案謝天行三跪九叩禮入行宫諸王大學士等進賀㨗表文行慶賀禮六月駕還京詣堂子行三跪九叩禮還宫是年冬聖祖仁皇帝北巡駐蹕棟斯垓噶爾丹遣使納欵乃降勅招撫班師三十六年聖祖仁皇帝復臨邊方駐蹕狼居胥山指授諸將方畧截窮寇遁走之路噶爾丹自料立就誅戮仰藥自殺餘黨率衆歸降朔漠蕩平聖祖仁皇帝以六師大㨗於行營外率皇子諸王大臣謝天行三跪九拜禮畢羣臣行慶賀禮聖駕回京詣堂子行禮畢還宫禮部奏請舉行慶典遣官祇告天地太廟社稷永陵福陵昭陵暫安奉殿孝陵皇后陵寢及太歲旗纛礟神嶽鎮海瀆帝王陵寢先師闕里欽天監諏日御殿受賀是日頒詔天下復允羣臣所請宣付史館編輯平定朔漠方畧御筆勒銘磨崖刻石於察罕齊老托諾昭黙多及狼居胥山並建碑太學垂文紀勲昭示萬世命將出征崇徳元年太宗文皇帝命多羅武英郡王貝勒貝子等率諸大臣官兵出征親臨送至撫近門設鹵簿詣堂子行禮义於堂子外列䕶軍八纛行三跪九叩禮畢親送至演武場陞御座召郡王貝勒貝子等近前誡諭遣行是年命和碩睿親王和碩豫親王貝勒貝子公大臣率大軍出征儀同順治元年世祖章皇帝命攝政和碩睿親王同多羅豫郡王貝勒貝子公八旗都統副都統暨恭順懷順智順三王等率兵畧定中原詣堂子奏樂行禮又陳列八纛行禮畢大軍聲礟啟行是年命和碩英親王為靖逺大將軍往征流冦賜之以勅世祖章皇帝御門陞座内院大臣奉三體勅書宣讀畢奉勅印授大將軍王及出征各官行三跪九叩禮畢啟行五年命都統為征南大將軍統兵征討江西賜之以勅儀與元年同是年命固山貝子為平西大將軍討陜西叛回賜勅儀同康熙十三年命多羅順承郡王為寜南靖冦大將軍帥師之湖廣都統為安西將軍帥師之四川聖祖仁皇帝御殿陞座大學士奉勅印授王王跪受行三跪九叩禮聖駕詣堂子行三跪九叩禮出征王及諸王貝勒都統尚書等官咸隨行禮畢次於兵部所設纛前行三跪九叩禮聖駕出長安右門外送行出征王以下副都統以上咸佩弓矢上馬隨行至駐馬處出征王疾馬趨過聖駕還宫出征王行至列兵處禮部預設祖帳光禄寺備茶禮兵二部堂官奉茶飲畢望闕謝恩禮成啟行是年八月命王貝勒為大將軍出征遣親王内大臣出長安右門往送十月命和碩簡親王為揚威大將軍帥師之江寜和碩安親王為定逺平冦大將軍帥師之廣東儀與是年正月同二十九年命和碩裕親王為撫逺大將軍出征以皇子為副聖祖仁皇帝御太和門大學士二人一奉勅一奉印授王王跪受行禮畢上出東直門視大將軍王等啟行三十五年命領侍衛内大臣安北將軍伯為撫逺大將軍統西路大兵出征厄魯特噶爾丹令先自歸化城乗驛速赴京師至日大頒燕賚上御太和門陞殿作樂命大將軍進至御座前親賜以巵酒大將軍跪受退至階叩首飲都統大臣等均以次進前親賜巵酒副都統等亦近前侍衛賜酒自叅領以下每十人為一班進至階上跪飲又令部院大臣侍衛等徧視衆軍士飲燕畢賜賚有差大將軍率衆官兵等謝恩同叩首出遣大學士授大將軍勅印令自京復赴歸化城啟行五十七年命將征勦策旺阿喇卜坦上親詣堂子行禮拜纛禮成命内閣大臣頒給大將軍勅印於太和殿大將軍跪受謝恩行禮畢啟行雍正七年議准命將出征之前日應遣官行告廟禮起行之日應遣官祇告奉先殿其祝文均由翰林院撰擬是年議准命將出師授大將軍勅印拜纛儀又議准命使齎送勅印大將軍於軍中恭受儀其儀節並見大清㑹典通禮九年命撫逺大將軍出征遣官祇告奉先殿又遣官祭纛於徳勝門乾隆十三年命大學士忠勇公經畧統兵討金川先期授勅印出師之日隨皇帝先詣堂子行禮次祭纛畢駕至長安左門外御黄幄陞座親賜經畧巵酒遂啟行欽命大學士率侍衛為經畧祖道畢望闕謝恩啟行三十三年命大學士忠勇公為經畧帥師討緬甸授勅印親祭堂子祭纛御賜經畧巵酒祖道並如十三年之儀臣等謹按皇朝勇畧丕昭軍政整肅自列聖以來命將出師武功赫濯我皇上神武震疊光烈覲揚西師之役諸將士秉承廟算不數年間平定伊犁回部拓地二萬餘里西陲永靖及兩金川負恩反噬上干天討將軍副將軍等皆就軍中命帥未行命將出征之典而聖天子運籌密勿指示機宜用能迅奏膚功武成耆定益以見天威之無逺弗屆也命將出征凱旋崇徳元年和碩睿親王裕親王貝勒貝子等大兵凱旋太宗文皇帝率王貝勒貝子公等及文武各官出城十里外郊勞設八纛吹螺作樂上率衆拜天行三跪九叩禮畢御黄幄陞座出征王貝勒等跪進獻㨗表文行三跪九叩禮諭出征王貝勒等近前行禮王等以次趨至御前行一跪三叩禮賜坐設燕親賜巵酒及至京躬率凱旋王貝勒貝子公大臣等謁堂子行禮還宫順治二年以南京平定世祖章皇帝御殿攝政王率王公文武百官上表行慶賀禮是日遣官祇告天地太廟社稷是年定國大將軍和碩豫親王班師還京世祖章皇帝出正陽門於南苑北迎勞陳設大纛十作樂率諸王貝勒文武百官拜天行三跪九叩禮畢御黄幄諸王列侍左右大將軍和碩豫親王及出師王貝子各官朝見行三跪九叩禮和碩豫親王起近前跪行謁見禮投誠諸王亦行禮分坐賜茶畢還宫康熙元年撫逺大將軍多羅信郡王等征滅察哈爾班師凱旋聖祖仁皇帝率王公大臣迎勞於南苑之大紅門至京詣堂子行禮畢還宫十九年定逺平冦大將軍和碩安親王自湖廣班師凱旋上率王公大臣出郊迎勞駐蹕盧溝橋次日自駐蹕處迎凱旋大軍於二十里外大軍既至率諸王大臣等拜天禮畢御黄幄凱旋王大臣率將帥行禮詔王近前親起抱見行禮命近御座左側坐諸大臣依次列坐其行間効力軍士亦依次列坐賜茶畢還宫是年大將軍和碩康親王自福建凱旋上出郊迎勞儀同二十年以雲南報㨗上詣太皇太后皇太后宫奏聞行禮王以下文武百官集乾清門行慶賀禮上詣孝陵躬行昭告遣官祇告天地太廟社稷二十一年定逺平冦大將軍貝子征南大將軍都統等自雲南凱旋上出郊迎勞如儀三十五年撫逺大將軍伯大破噶爾丹於昭黙多之地凱旋後留駐斥堠是歲冬上巡狩至鄂爾多斯有㫖著大將軍伯自軍中乗驛前來將至命皇子往迎聖駕出黄幔城大將軍伯趨進跪請聖安乃召入黄幔城賜坐賜茶遂扈從於和坦和碩之南賜大將軍伯御佩櫜鞬弓矢復遣還軍雍正二年平定青海世宗憲皇帝御殿受賀御製平定青海碑文勒石太學昭示萬世乾隆十四年春經畧大學士忠勇公自金川凱旋命王公大臣迎勞於阜成門外至日上御殿經畧大學士忠勇公率凱旋諸臣至丹陛上謝恩行禮次日賜燕於瀛䑓行賞有差御製平定金川碑文勒石太學並命儒臣輯平定金川方畧二十一年以伊犁平定㨗音至上御殿行慶賀禮遣官祇告天地太廟社稷御製平定準噶爾碑文勒石太學二十五年西域平定定邊將軍武毅謀勇公等凱旋還京上駐蹕黄新莊親行郊勞是日法駕鹵簿全設在京王公大臣等預至郊勞處分翼排班候隨行禮設黄幄御座於郊勞處正中南向兩翼設青幕各八東西向築䑓於黄幄正南䑓上設將軍等凱旋纛於左右設皇帝拜褥於臺上正中設下馬紅柱東西各一樂部設鐃歌樂於臺左右設凱歌樂於御道左右設鳴螺軍士按翼於臺左右屆時皇帝出行宫至郊勞處軍士鳴螺鐃歌樂作將軍及從征官兵咸甲胄於紅柱外跪恭請聖安皇帝降輿至臺上拜天行三跪九拜禮將軍及王公大臣均隨行禮畢御黄幄陞座將軍等行三跪九叩禮候㫖將軍大臣行抱見禮賜坐賜茶禮部堂官奏禮成皇帝出御幄乗騎馬上凱歌樂作駕還行宫是年上御殿行慶賀禮祇告天地太廟社稷賜宴將軍等於紫光閣並命圖繪功臣百人像於紫光閣中前五十功臣御製贊詞後五十功臣命儒臣擬贊並藏得勝靈纛及俘獲軍器於閣中御製平定回部碑文勒石太學並命儒臣纂輯方畧四十一年金川平定定西將軍大學士誠謀英勇公凱旋回京上親行郊勞並如二十五年之儀慶賀祇告賜宴繪像並與二十五年同御製平定金川碑文勒石太學並命儒臣纂輯方畧獻俘受俘康熙三十六年親征朔漠王師大㨗哈密擒厄魯特噶爾丹之子色布騰巴勒珠爾俘獻於駐蹕之神木縣聖祖仁皇帝御行營受俘遣送京師拘禁於理藩院旋奉㫖赦而不誅至四十年宥釋授以一等侍衛給之妻室雍正二年命將討平青海解送俘囚至京師欽天監擇日獻俘於太廟社稷至期兵部率解俘官員兵丁押所解之俘白組繋頸至太廟街門外向北立候承祭官至俘向北跪承祭官入太廟陪祀文武各官分東西班豫集承祭官就行禮位行禮如時饗儀禮成兵部率解俘官員兵丁押俘至社稷街門外候承祭官入社稷壇行禮如春秋祈報儀禮成兵部率解俘官員兵丁押俘出次日行受俘禮前期工部設御座於午門樓檐下正中至日武備院鑾儀衛陳設諸王以下文武各官咸齊集皇帝鑾輿出宫陞寳座兵部堂官奏平定青海所獲叛逆俘囚謹獻闕下請㫖宣制曰所獻俘交刑部刑部堂官跪領㫖押俘出王以下文武各官行三跪九叩禮聖駕還宫是日賜觧俘官員兵丁銀幣有差恩賜該將軍鞍馬采幣其擒獲俘囚之將校及管領擒獲之人分别各加賞賚乾隆十四年議准凡出師克㨗應照雍正二年平定青海以俘獻於廟社如儀獻俘次日行受俘禮均如雍正二年之儀有赦而不殺者奉㫖釋縛交理藩院二十年征凖噶爾擒獲巴朗孟克特墨爾羅卜藏丹津獻俘受俘儀同二十一年平定伊犁擒獲逹瓦齊獻俘行禮宥罪儀同二十五年平定回部圅霍集占之首以獻四十一年平定金川逆酋全就俘獲並獻俘受俘如儀皇朝通志巻四十四
