body:
  text: 欽定四庫全書皇朝通志卷三十六禮畧臣等謹按自古帝王經國治世之典莫大於禮禮也者事神理人班朝治軍由仁孝誠敬之思以達於盡倫盡制之實治法所由大備也自有虞氏命典三禮成周始有吉凶軍賔嘉五禮之目漢唐以來規制畧存未臻大備秉筆紀載者亦無由上嫓隆古之規洪惟我皇朝聖聖相承監古定制典章鴻懿超越萬代皇上中和建極兼綜條貫自郊廟百神之祀朝覲燕饗之儀閲武訓戎之政柔逺安藩之畧以至愼終追逺之典皆本聖神之極思創制顯庸盡美盡善其儀節之精詳已載於大清㑹典大清通禮中兹纂輯皇朝通志禮畧惟謹繹規制之大者倣鄭樵通志體例登於卷中謹考鄭樵禮畧以吉嘉賔軍凶為序而所載皆漢唐以後之彌文如吉禮之眀堂靈星老君祠封禪厯代所尚葦茭桃梗高禖祓禊諸條嘉禮之三老五更賔禮之三恪二王後軍禮之軷祭祭馬祖凶禮之天子為大臣服至郡縣吏為守令服諸條皆一時所行之制不足垂為定範兹謹遵大清通禮成式五禮首吉次嘉次軍次賔次凶凡諸治神人而和邦國定損益而酌古今宏綱鉅目皆前代未有之隆儀為百王之矩範而於鄭志諸目之庳陋無稽為聖朝已經裁革者則皆刪去其目並隨條加按聲眀以示大經大法之所為立極並以誌體例之所由來焉吉禮一臣等謹按鄭志五禮首以吉禮二卷自郊天而下條目紛繁多述秦漢以來煩黷之制非盡古禮也我朝列聖以來釐定祭典精禋儼恪超越萬古自南郊北郊太社太稷以至於天神地祇之祀太廟祫祭時享以及於歴代帝王先師孔子羣神之典彛章眀備著於大清㑹典大清通禮謹依次敘載述為吉禮六卷其鄭志所有諸條本朝已經釐正者謹隨條附述案語於後以見盡善盡美之極制焉南郊臣等謹按兩郊大祀典禮攸崇我朝列聖以來敬事皇穹垂為成憲皇上紹承祗遹嵗必躬親潔蠲將事積乆益劭禮眀樂備昭示萬年謹考典制之所自敬著於篇至每嵗親祀大典惟恭纂有闗釐定者以符體例云太祖高皇帝天命元年正月貝勒以下諸臣奉上皇帝尊號立國建元行焚香告天禮天聰十年正月羣臣奉上太宗文皇帝尊號是年建圜丘於盛京徳盛門外其制九成周圍一百十丈南門三東西北門各一四月太宗率王貝勒以下文武羣臣齋戒三日親祀南郊以太牢熟薦建國號曰大清改元崇徳是為本朝祀天於郊之始十一月冬至大祀天於圜丘以將征朝鮮告是為冬至大祀圜丘之始七年冬至以駐蹕納蘭遣官恭代齋戒如禮停止行獵順治元年十月朔世祖章皇帝定鼎燕京親祀南郊告祭天地即皇帝位是年定制每嵗冬至大祀天於圜丘以大明夜眀星辰雲雨風雷為四從壇配享每嵗孟春以上辛日祈穀於圜丘凡祀圜丘以冬至日子時後定於黎明時與孟春祈穀均為大祀十一月冬至大祀親詣行禮二年十月定郊祀齋戒及設玉帛祝文香亭儀注三年四月設守視天壇地壇社稷壇官員四年三月定大祀南郊用胙牛之禮五年十一月冬至大祀天於圜丘奉太祖高皇帝配享八年三月定祭祀齋戒例南北郊祀皇帝於大内齋宫致齋三日壇内齋宫致齋一日四月定諸王文武羣臣陪祭扈從及送駕接駕儀注六月定大祀眡牲省牲之制十三年七月定祭祀出宫時刻凡祭圜丘方澤於五鼓出宫禮部先期一日奏聞十四年正月辛亥祈穀於上帝奉太祖高皇帝配享三月特舉大祀奉太宗文皇帝配享嗣後冬至郊天上辛祈穀並同十七年二月定祈穀壇祀典用燔柴禮四月己酉合祀天地百神於大享殿臣等謹按圜丘之典列祖以來躬親將事嵗乆益䖍有紀載不能盡述者兹纂唯恭載首事之年及典制有所増定之嵗餘不備述祈穀大祀方澤大祀紀載體例並與此同焉順治十八年正月聖祖仁皇帝登極遣官告祭昊天上帝尋以諸臣詳議祀典請罷禁中上帝壇及大享殿合祀從之十一月冬至大祀親詣行禮康熙六年十一月冬至大祀天於圜丘奉世祖章皇帝配享九年正月辛丑祈穀於上帝奉世祖章皇帝配享十二年八月定祭祀時刻壇廟皆黎眀行禮二十九年正月辛丑祈穀於上帝御製祝文親詣行禮四十六年十一月冬至大祀羣臣以天氣嚴寒請遣官恭代不許五十四年正月祈穀於上帝用下辛日先是祈穀例用上辛是年正月十日上辛尚未立春奉諭㫖以從前亦有用次辛下辛致祭者令諸臣議之乃以正月三十日下辛行禮五十七年十一月冬至大祀遣官恭代仍照常齋戒五十八年十一月冬至大祀命親王恭代仍親往瞻拜行禮奉諭㫖朕於祭祀之前升壇瞻仰省視俎豆量力跪拜退處幄次俟恭代親王行禮畢然後囘宫諸臣覆奏聖體違和初愈天氣嚴寒請停親祭奉諭㫖朕必親往朕行禮不必贊禮作樂將朕親詣之處著書於祝文内六十一年十一月世宗憲皇帝登極冬至大祀遣大臣恭代行禮雍正元年十一月大祀天於圜丘奉聖祖仁皇帝配享二年正月辛巳祈穀於上帝奉聖祖仁皇帝配享七年正月詔嚴壇廟演禮之禁部臣議奏凡祭祀執事等官當在凝禧殿演禮如有特加祭典先期於神樂觀演習從之八年正月祈穀奉諭㫖以初二日上辛行禮停止朝賀筵宴十三年正月祈穀以初十日上辛尚未立春用次辛行禮九月皇上紹登大寳逾三月後羣臣以祀典上請奉諭㫖大祀齋戒所以潔齊心志對越神眀朕意齋戒之日即當素服冠綴纓緯其視祝版亦當照例用禮服以昭敬謹禮部遵㫖議上從之乾隆元年正月祈穀行禮如儀二年四月大祀天於圜丘奉世宗憲皇帝配享先是禮部具儀奏上奉諭㫖爾部具奏皇考配享天壇儀注朕敬謹詳閱内稱配享時朕恭奉神牌陞壇奉安於東三青幄次並未議及㕘拜上帝之儀朕思升祔太廟時先行㕘拜列祖列后禮然後陞座今配享圜丘亦應先行㕘拜上帝禮然後陞座議政王大臣等遵㫖議上從之三年正月祈穀於上帝奉世宗憲皇帝配享四年正月祈穀用次辛日十一年正月祈穀同十二年十一月定郊壇大祀誓戒百官之制凡大祀於午門前宣誓戒陪祀之王公大臣官員朝服齊集跽聽行禮十二月定郊壇大祀省視神位及省視牲器之禮奉諭㫖郊壇神主向藏皇穹宇皇祇室皇乾殿考之唐開元禮先期升主陳設省視復收朕思因省視而陳設神主有違神道靜穆之義未協寅恭嚴事之忱應躬詣皇穹宇皇祇室皇乾殿上香行禮分獻官詣配殿行禮肅將悃忱以申對越著大學士㑹同該部詳悉定議并恭詣壇廟後親視籩豆之處具儀以聞尋遵㫖具儀奏上如儀行禮十三年十一月冬至大祀用新成祭器更定大駕鹵簿乗玉輅十四年五月詔齋宫致齋勿鳴鼓角是月詔修繕兩郊壇宇展拓舊制十六年九月改祈穀壇大享殿為祈年殿門為祈年門十九年大學士等奏午門外宣讀誓戒之禮令各衙門恭録勅諭製牌收貯於致齋日恭設堂中隨時仰瞻其宣讀之儀請停止從之二十三年正月祈穀用次辛日二十四年十一月冬至大祀以蕩平囘部並告成功三十七年十一月冬至大祀舊制皇帝詣齋宫乗禮轎乾隆七年改定乗輦是嵗以石街積雪鑾儀衛奏請仍舊例用禮轎從之先是大學士等遵㫖議定郊天儀注前一日皇上詣皇穹宇上香行禮畢即還齋宫其眡神位眡壇位省牲器命原遣視牲大臣恭代行禮又議舊制皇帝陞第一成位奠玉帛後即復第二成拜位立以次進俎初獻讀祝亞獻三獻受福胙徹饌皆如之今議奏皇帝陞第一成位奠玉帛後即就讀祝位以次進俎三獻飲福受胙畢始還第二成位行禮從之三十八年正月祈穀用次辛日先是大學士等議奏向例詣齋宫皆於祈年殿塼城門外降輦步入恭詣皇乾殿上香瞻拜今議由西門步入行禮以節行陟之勞從之四十二年正月祈穀用次辛日四十四年十一月冬至大祀先是奉諭㫖南郊典禮最為繁重朕明嵗即屆七旬雖拜跪尚可如常而精力究不免稍減恐過勞生憊轉非所以將誠意因思正位晉獻香帛俎爵自當躬致申䖍至配位列祖列宗惟上香仍前親奉其獻爵進俎則命諸皇子恭代庶得少節煩勞以專心祼薦即自今嵗冬至為始並勅部臣載入㑹典臣等謹按我皇上凝承昊眷恪謹郊禋每嵗大祀必躬親昭事禮儀隆備誠愫昭格乾隆三十七年始命禮臣議定郊天儀注三十八年行祈穀禮於西垣門外降輦步行入葢少節繁文益所以專精對越時聖夀已逾六旬天眷純熙積乆彌劭恭讀三十九年諭㫖有云朕臨御以來恒以敬天報本為要不敢稍有怠惰凡壇廟大祀必躬詣行禮自降輦以至成禮一切典禮必敬必誠四十年來未敢少有怠忽而一切禮儀宜盡之處靡不加增至三十七年朕年逾六十始勅大學士及該部將降輦步行之逺近及升降之無闗鉅典者酌減一二葢欲稍減步履之小節蓄養精力期於大典益致恪恭亦因朕年逾六旬始如此酌量節減所以益矢誠敬也萬世子孫其敬識朕意於諸大祀設非年至六旬一切典章斷不可稍減倘蒙上天眷佑年逾六旬方可遵朕現在所行舉行將此永著為例訓諭昭彰垂示萬世至四十四年奉諭南郊典禮最為繁重正位晉獻自當躬致申䖍配位則命諸皇子恭代自是嵗嵗敬承大祀劼毖益䖍酌儀文之準致純一之思所由仰答天心垂億萬年無疆之庥也臣等恭繹禮意謹誌因時定制之義以昭聖人誠恪事天之大典焉四十七年正月祈穀先期奉上諭今年正月初四日上辛朕以雍正七年皇考諭㫖因元旦朝賀不宜展祈穀之期於次辛行禮其乾隆己未丙寅戊寅丁酉四次用次辛者以詣東朝慶賀儀節不宜有闕也今非向年可比宜謹遵皇考眀諭祈穀仍用上辛自元旦即齋戒其朝正慶賀改用初五日行禮自皇上御極以來郊天祈穀之典嵗必躬親儼恪將事禮明樂備萬世法守其儀節並載大清通禮大雩禱水旱附國初定制嵗遇水旱則遣官祈禱天神地祇太嵗社稷至於親詣圜丘即為大雩之義初立天神壇於先農壇之南以祀雲師雨師風伯雷師其西立地祇壇以祀五嶽五鎮四陵山今為山五陵四海四瀆京畿名山大川天下名山大川皆因祈雨而修祀事義與雩同祈而應則報祀如儀直省各令建壇致祭常雩祈報並循定制行禮順治十四年四月世祖章皇帝以旱禱於圜丘率羣臣致齋三日禁屠宰不理刑名至期皇帝素服詣圜丘不設鹵簿不除道不奏樂不設配位不奠玉飲福受胙餘行禮如常儀遣官致祭方澤社稷壇神祇壇應時大雨越三日遣官行告謝禮十七年六月以乆旱禱雨先期三日世祖章皇帝歩行詣南郊齋宿是日早四際無雲頃之隂雲宻布甘霖大霈越三日行祈祀禮於圜丘祭畢雨復降越四日遣官行告謝禮是時禮部奏請修舉名山大川及古帝王聖賢祀典從之康熙四年三月旱命禮部遣官徃泰山祈雨十年四月以旱禱雨聖祖仁皇帝素服詣壇致祭旋以甘霖霑足遣官吿謝與順治十四年同十七年六月親祈雨於圜丘聖祖仁皇帝自壇西門步行至壇行禮時甘霖大霈仍步出壇西門乘馬囘宫十八年四月旱禱雨報謝如儀十九年四月旱禱雨報謝並如儀二十二年六月以亢旱命建壇祈禱即日雨二十六年五月親祈雨於圜丘御製祭文祭畢囘鑾甘霖立降越日遣官告謝如儀二十八年六月御製祭文遣官禱雨尋􅉈雨報謝如儀五十五年五月駐蹕熱河以天旱減膳齋戒諭京師䖍誠祈雨越七日雨足始復常膳五十六年五月親祈雨於圜丘是年冬諭諸皇子及大臣等曰京師初夏每少雨澤朕臨御五十六年約有五十年祈雨每至秋成悉皆豐稔昔年曽因暵旱朕於宫中設壇祈禱長跪三晝夜日惟淡食不御鹽醬至第四日歩詣天壇祈禱油雲忽作大雨如注歩行囘宫水滿兩鞾衣盡沾濕後各省人至始知是日雨徧天下又諭曰天行不齊多頼人事補救朕倉有餘粟帑有餘金隨時隨地皆可賑濟故雖逢旱嵗亦不能為災也雍正元年五月旱世宗憲皇帝減膳䖍禱甘霖立霈二年二月親詣黑龍潭祈雨越數日親祭歴代帝王廟甘雨大􅉈羣臣衣盡沾濕各加恩賜御製喜雨詩羣臣恭和自此至十三年偶値亢旱無不齋居䖍禱精誠感應嵗獲豐登乾隆二年六月以亢旱遣官致祭天神地祇太嵗各壇及四海之神七年五月増神祇壇祈雨樂章八年四月始行常雩禮於圜丘先是御史徐以升奏請於京城之内擇地建立雩壇倣古龍見而雩之禮勅下禮臣詳議尋議奏孟夏龍見擇日行常雩禮祀昊天上帝於圜丘奉列聖配享四從壇從祀於下孟夏後旱則祈天神地祇太嵗壇次祈於社稷壇次祈於太廟皆七日一祈旱甚乃大雩祀昊天上帝於圜丘雨足則報祀其以前望祭四海之禮可以停止疏上從之九年四月大雩於圜丘奉諭㫖目下畿輔雨澤愆期此次舉行雩祭正望恩迫切之時非每夏常雩可比其先期前詣齋宫及祭畢囘鑾朕俱御常服不乘輦不設鹵簿不作樂以示䖍誠祈禱為民請命之意二十四年四月常雩皇上步行親詣行禮五月皇上步禱社稷壇六月大雩於圜丘御製祝文步詣行禮越日大雨霑足報謝如儀自乾隆八年以來孟夏常雩皆躬親行禮惟巡幸之嵗遣官恭代自三十七年遵㫖議定郊天儀注三十八年以後常雩行禮並同偶値水旱精誠致禱雨暘立應祈祀報謝皆如常儀焉朝日夕月順治八年六月定春分秋分朝日夕月之禮初定祀典以日月從祀天壇罷春秋二分祀事至是禮臣請照舊典於從祀天壇外立朝日壇於朝陽門外東郊立夕月壇於阜成門外西郊從之凡祀日月為中祀祀朝日壇以春分日卯時値甲丙戊庚壬年皇帝親詣行禮餘年遣官承祀祀夕月壇以秋分日酉時値丑辰未戌年皇帝親詣行禮以北斗七星木火土金水五星二十八宿周天星辰共為從壇列聖以來春秋二分皆親詣遣官致祭如儀乾隆三年二月朝目於東郊皇上親詣行禮八月秋分夕月於西郊先是奉諭㫖今嵗夕月壇舊例係遣官之年但朕即吉之後初次舉行朕親詣行禮以展誠敬十一年二月春分皇上親祭朝日壇以次日日食不乘輦不設鹵簿不奏樂自是皆親詣及遣官致祭如儀臣等謹按鄭志朝日夕月之後有眀堂一門八蜡之後有靈星一門考眀堂之制始於成周厯代有之而制度迄莫能定漢儒所述大戴禮白虎通蔡邕之説制度已各不相符朱子謂郊者古禮眀堂者周制周公以義起之則其不必循行於後代可知我朝南郊大祀列聖配天極尊崇之鉅典眀堂之制不復建立洵為超軼前古矣自漢立靈星祠祀主天田配以后稷葢即祈穀之意我朝定制列星為圜丘配位后稷為太稷配位孟春祈穀嵗必躬親春秋社稷以祈以報靈星之祀誠無事於複舉也以上二條謹從刪八蜡臘臣等謹按鄭志有八蜡臘一門考八蜡之祭元明以來乆停其制本朝有以舉行蜡祭請者奉皇上諭旨詳晰指示不必舉行葢祈報之典已詳舉於各壇廟中停止蜡祭示無瀆也今謹載諭㫖於篇中以見酌古準今折衷盡善之定制焉乾隆十年十二月諭大學士等國家崇報之文眀禋肇薦考議周詳凡祀典所闗羣神咸秩即如雩祭諸禮事繋農桑近復議行有舉無廢皆以為民也邇年以來諸臣工每以蜡祭為請朕追惟舊制酌古準今有宜於詳慎者考大蜡之禮昉於伊耆三代因之所以報萬物之成也雖詠於詩詳於禮記周官而古制夐逺傳注叅錯難以折衷所謂八蜡配以昆蟲後儒謂其害稼不當與祭月令祈年於天宗蜡祭也註曰日月星辰則所主又非八神至所謂合聚萬物而索饗之其神甚多尤難定位且蜡與臘冠服各殊有謂臘即蜡者有謂蜡而後臘者是古制已不可考終無定衡至於後世自漢臘而不蜡此禮已湮魏晉以來迄於唐宋時行時止或溺於五行之説甚且天帝人帝及於龍麟朱鳥多至百九十二座議者以為失先王之禮逺矣蘇軾曰迎貓則為貓之尸迎虎則為虎之尸近於倡優所為是以子貢觀於蜡言一國之人皆若狂以其沿習日乆迹類於戲也葢祀於南郊已不合於古制而蜡于四郊則惟順成之方始祭較量區别叢雜瑣細於義有乖於禮未洽於神為䙝自元眀以來停止此典實有難於舉行之處况蜡祭諸神如先嗇司嗇日月星辰山林川澤今皆祀於各壇廟原於典文無闕即民間秋成之後休息農功祀神報賽大抵借蜡之遺意以盡其閭井歡洽之情猶有吹豳撃鼓之風亦皆聽從民便未嘗禁止是蜡祭原行於民間但田夫萃處雜以嬉戲各隨其鄉之風尚初不責以儀文若朝廷議祀潔蠲䖍享必嚴肅整齊何至有一國若狂之論可知此祭即古亦閭閻相沿之舊俗詎可定以為郊廟典禮如以為有祈無報則方春而祈穀冬又有事於圜丘禮謂郊之祭為大報天又云萬物本乎天大報本也豈得謂之有祈無報乎况二仲薦馨並崇社稷班固所謂為天下求福報功者具在陳祥道所謂大社國社農之所報在焉今社稷壇春秋兩祀祈穀之禮已備至義近於重複事渉於不經者即下之禮臣亦難定議因諸臣但泥古制多未深考是以特降此㫖俾共知之風師雨師諸星等祠臣等謹按鄭志有風師雨師及諸星等祠我朝定制祀雲雨風雷之神於天神壇以専禱水旱已見禱水旱門兹不重述北斗五星二十八宿周天星辰之神從祀於夕月壇已見朝日夕月門伏見雍正二年立時應宫以祀龍神六年立風神廟七年立雲神雷神之廟報答洪庥禮制詳備而太嵗壇祭每嵗之神特隆廟祀謹彚著於篇直省崇祀之典亦附見焉順治元年定每嵗致祭太嵗壇之禮太嵗殿在先農壇之東北正殿七間祀太嵗之神兩廡十有一間祀十二月將之神每年正月初旬諏吉及十二月嵗除前一日遣官致祭初春為迎嵗暮為祖自後嵗遇水旱則遣官祭告祈禱有應報祀如儀康熙三十五年二月聖祖仁皇帝親征噶爾丹遣官致祭太嵗之神凱旋祗告如之雍正元年建時應宫於西苑以祀龍神每嵗以六月十三日致祭用素羞香燭遣内務府官行禮六年七月建風神廟於都城内東北隅禮工二部㑹同内務府遵㫖議奏於都城東北隅擇得景山東邊當東北箕星之位建廟甚宜其廟宇倣時應宫規制每年於立春後丑日致祭奏上從之詔封為應時顯佑風伯之神廟曰宣仁廟是年以河臣奏請勅封江南清口風神為清和宣恵風伯之神嵗時致祭七年十月建雷神廟於都城内之西立夏後申日致祭建雲師廟於都城内之東秋分後三日致祭其規制祭儀俱倣宣仁廟封雲師為順時普䕃雲師之神廟曰凝和廟雷師為資生發育雷師之神廟曰昭顯廟十三年以撫臣請封廣東邊海郡縣廟祀風神為宣仁昭泰風伯之神封甘肅蘭州府廟祀雷神為顯仁應瑞之神春秋致祭乾隆元年十二月祭太嵗壇遣親王行禮十六年増定太嵗壇上香之儀十八年定太嵗壇供奉神牌之禮舊例祭時以黄紙書年建神牌祭畢與祝帛同焚至是禮部請供奉神牌於殿廡内神龕前列神座祭時請神牌奉安神座祭畢復龕恭遇皇上親詣上香不請神主出龕從之嗣是遵行永為定制二十年定制祭太嵗壇遣親王郡王行禮直省府州縣各建神祗壇祀雲雨風雷境内山川城隍之神嵗春秋仲月諏吉致祭在城文武各官皆與省㑹以總督巡撫主之若有故以布政使攝府州縣春秋致祭儀節與省㑹同皇朝通志卷三十六
