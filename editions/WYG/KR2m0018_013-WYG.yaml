front:
  text: 欽定四庫全書皇朝通志卷十三
  hash: sha256:f1608424098a6f034dd0051d3ee12790a395f3a75cd4c11555762a7b0ff49277
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_013-1a, image: WYG0644/WYG0644-0127c.png}
body:
  text: 六書畧三西域各部字體乾隆四十四年欽定滿洲䝉古漢字三合切音清文鑑臣等謹按是書以國語與䝉古語漢語通貫為一使互相音釋凡國語一句必兼載䝉古語漢語以明其義併各以蒙古字漢字對音以定其聲其聲為漢字所無者則三合以取之為䝉古字所無者則分各種讀法寫法以取之自有譯語以來無如是之經緯詳眀舉一即可知三者至䝉古字母考元史世祖中統元年命製新字其字僅千餘其母凡四十有一其相闗紐而成字者則有韻闗之法其以二合三合四合而成字者則有語韻之法而大要以諧聲為宗今考館書存目所載元朱宗文又稱朱巴顔撰䝉古字韻二卷首列各本誤字及重入漢字次列總括變化之圖次字母三十六字次篆字母九十八字次則以各蒙古字分韻排列宗文生于至正年間自謂能通音譯附㑹推尋實多不能脗合即如陶宗儀輟耕録載元國字以可侯字為首而是書又依韻㑹以見經堅字為首其字母已不相合而元史既稱有二合三合四合之法此書乃用直對而不用切音甚至累數字以釋一音清濁輕重毫無分别其他錯互大概可知轉不若眀金尼閣所撰西儒耳目資足以自伸其説第西儒耳目資殘缺頗多列音韻譜惟存第一攝至十七攝自十八攝至五十攝皆佚已非完書而䝉古字韻又蹖駮過甚不足據為典要故均從畧云御製西域同文志序云嵗庚午既定同文韻統序而行之蓋以梵音合國書切韻復以國書切韻叶華音字母於是字無遁音書皆備韻微特支􅄼呪語窔奥可探而且寰㝢方言拘墟盡釋兹者西域既平不可無方畧之書然準語回文非纂輯文臣所曉是宜示之綱領有所遵循俾無蹖駮舛訛之虞因以天山北路天山南路準部回部並西藏青海等地名人名諸門舉凡提要始以國書繼以對音漢文復繼以漢字三合切音其䝉古西畨托忒回字以次綴書又於漢文下詳註其或為準語或為回語於是兀格蟀自之言不須譯鞮象寄而凡識漢字者莫不通其文解其意瞭若列眉易若指掌書既成名之曰西域同文志同文云者仍闡韻統之義而特加以各部方言用明西域記載之實期家喻户曉而無魚魯毫釐之失焉然嘗思之天髙地下人位乎其中是所謂實也至於文蓋其名耳實無不同文則或有殊矣今以漢語指天則曰天以國語指天則曰阿卜喀以䝉古語準語指天則曰騰格里以西畨語指天則曰那木喀以回語指天則曰阿思滿令回人指天以告漢人曰此阿思滿漢人必以為非漢人指天以告回人曰北天則回人亦必以為非此亦一非也彼亦一非也庸詎知孰之為是乎然仰首以望昭昭之在上者漢人以為天而敬之回人以為阿思滿而敬之是即其大同也實既同名亦無不同焉逹者契淵源於一是昧者滯名象於紛殊是志也將以納方俗於㑹極祛羣疑之分畛舉一例凡豹䑕易辨即世道人心豈云無禆益哉臣等謹按切韻字母之學興於西域流傳中土夾漈鄭氏所謂雖重百譯之逺而音義可傳顧其論華梵書曰梵書左旋其勢向右華書右旋其勢向左華以正錯成文梵以偏纒成體要之鄭氏究未能洞悉原委故於聲經音緯之道雖得其大畧而不能備晰夫梵音之傳布藉繙譯以行由天竺而西畨由西畨而震旦唐吐畨相阿努親受天竺字法而仍譯以唐古特之字輾轉紆迴其勢然也前代輿圖未擴凡我朝重譯來同之地皆當日聲教所不通故晉唐以還經僧伽婆羅沙門不空諸人之傳譯而緇流持誦逈非西僧梵韻譬之嚼飯與人重増嘔噦斯言良為不謬皇朝統一函夏疆索周環䝉古諸藩盡列版圖迄西陲平定凡回準各部落逺至二萬餘里擊壤鼔腹同於几席皇上既命纂䝉古清文鑑一書頒示中外又特立唐古特托忒回回諸學俾之通習流傳乾大坤廣乆已示規模於無外今將御製西域同文志序恭載卷首其餘蒙古西畨托忒回回諸字即按地山水人四門撮其要者綴書其下不特舉一例餘顛末畧具即按之同文韻統之㫖亦無不同條共貫所謂櫛之於髮績之於絲雖細且多而不亂者矣巴爾庫勒居天山北舊隸版圖西鄰準界故以為天山北路之首回語巴爾有庫勒池也城北有池故名轉音為巴里坤此天山北路地名之首哈宻在天山之南舊隸版圖西接回部故以為天山南路之首回語哈勒宻勒之轉音哈勒瞭望之謂宻勒墩臺也地有瞭臺故名三合哈宻切音阿伊此天山南路地名之首汗騰格哩敖拉準語汗稱其君之詞騰格哩䝉古語準語謂天也敖拉準語謂山盖天山之主峰也三合切音歌哩阿㻝額伊傲阿此天山之主峰羅布淖爾羅布回語滙水之區淖爾為山南衆水所滙故名古泑澤一名鹽澤一名蒲昌海此即蒲昌海自葱嶺以東和闐葉爾𦍑諸水皆注焉博汗此綽羅斯始祖也自博汗至䇿旺多爾濟那木扎爾共十八世相襲稱汗此天山北路準噶爾部人名之首青吉斯汗回部之汗為第一世按回教相傳始墨克墨徳那諸國今天山南路𣲖噶木巴爾一支其的傳也青吉斯汗族又為舊君其國者因首叙焉此天山南路回部人名之首庫克淖爾䝉古語庫克青色淖爾水聚滙處即青海也以水名亦稱庫庫淖爾音之轉也此青海地名之首阿勒坦敖拉蒙古語阿勒坦金也山色如金故名此青海山名之首已見青海地名此青海水名之首古實汗圖魯拜呼準噶爾和碩特哈尼諾雅特洪郭爾之子封遵文行義敏慧古實汗按古實汗舊居青海以全境來歸為青海諸王公受封之始故首紀之此青海人名之首拉薩西畨語謂佛地也畨俗尚佛故名此西畨衛屬地名之首扎實倫博西畨語吉祥山也地以山名此西畨藏屬地名之首普克納克西畨語茂林也地多林木故名此西畨喀木屬地名之首實德總西畨語實德和平之謂總城也盖美其城風俗之詞此西畨阿里屬地名之首總噶爾拉西畨語噶爾白色拉嶺也嶺石色白下有舊城故名此西畨衛屬山名之首搏博拉西畨語搏博髙也嶺形髙峻故名此西畨藏屬山名之首多實拉西畨語多謂石實四數拉嶺也嶺有四石峰故名此西畨喀木屬山名之首哩克蘇木衮博哩西畨語哩克蘇木衮博謂文殊觀音及手持金剛也哩山也舊曽示現於此故名此西畨阿里屬山名之首臧博楚西畨語臧博清浄之謂楚水也河也取清浄無垢之義以名河其上流即藏地崖嚕臧博楚也此西畨衛屬水名之首崖嚕臧博楚西畨語崖嚕謂西境藏在衛西與衛屬之臧博楚本一河此其西流也此西畨藏屬水名之首沙克楚西畨語沙克水聲水流湍急有聲故名此西畨喀木屬水名之首斡康舂西畨語康空甸也河濱多狐旁有空甸故名此西畨阿里屬水名之首總喀巴羅布藏扎克巴衛地始興黄教之祖生於東總喀至衛建噶勒丹寺闡揚法教衣鉢開先一支八葉相傳為曼殊師利之呼必勒汗云此西畨喇嘛之首臣等又按東鶼西鲽風尚所同北轍南轅㑹歸有極欽惟我朝膺天眷命覆載之内悉主悉臣凡雕題漆齒之偕徕實疏仡循蜚所未有似宜附登卷末於以誌盛事于梯航闡遺經於山海第考館書存目所收如四譯館考八紘譯史二書要不過廣採異聞以資博覽間亦涉於鄒衍談天齊諧志怪之流考核之道槩乎未有聞焉至琉球國志一書曽經使臣周煌恭纂進御顧其所載琉球各字僅附之風俗門不過存什一於千百其餘四譯館中尚有存館雜字如暹羅緬甸百譯蘇禄八百回回西畨髙昌南掌西天凡十國零星錯雜其所載西天西畨回回諸字考之欽定西域同文志五譯合壁集要諸書總未能窺其奥窔實則牴牾孔多恐各國諸字亦未免承訛襲謬之弊盖羣言必衷諸聖館中所存皆未經欽定之書似未足以信今傳後毋寧闕而不録云皇朝通志卷十三
