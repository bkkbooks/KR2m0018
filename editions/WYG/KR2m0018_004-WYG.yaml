body:
  text: 氏族畧四滿洲八旗姓額蘇哩氏散處黑龍江瑪察等地方臣等謹按額蘇哩本金姓見金史以姓為氏烏嚕氏散處烏拉葉赫等地方布舒庫正黄旗人世居烏拉地方任副都統謚剛壯覺禪氏散處烏蘇哩佛阿拉等地方科竒哩氏散處瓦爾喀徳爾吉阿里庫村等地方索爾和諾鑲紅旗人世居瓦爾喀地方號國初來歸從征河間府有功子佛尼賜巴圖魯後陣亡贈騎都尉祀昭忠祠勒襲職任西安將軍征吳逆恢復朝天關生擒偽總兵一員斬偽總兵四員身經八十餘戰俱獲全勝尋卒於軍諡恭靖祀賢良祠其次子額楞特由佐領從征厄魯特噶爾丹有功授騎都尉任湖廣總督署西安將軍出征哈喇烏蘇猝遇賊兵力戰陣亡贈三等輕車都尉謚忠勇祀昭忠祠三子托栁任黑龍江將軍又索爾和諾曾孫紀三任都統武吉正紅旗人任都統理藩院尚書布特穆慎鑲紅旗人世居徳爾吉阿里庫村地方都國初來歸由閒散從征山東陣亡贈騎尉祀昭忠祠巴爾達氏世居巴爾達及蜚悠城地方尼沙氏世居尼沙及那木都魯地方臣等謹按尼沙本金姓見金史以姓為氏托和羅氏散處黑龍江呼爾哈等地方寧古里正藍旗人世居呼爾哈地方任户部尚書諡勤敏阿穆嚕氏世居伊爾費爾塔哈村及黑龍江等地方索爾多氏世居烏拉博爾濟城地方裕爾庫哷氏散處諾羅松花江黑龍江等地方滿扎氏世居庫察及葉赫地方烏色氏散處葉赫長白山等地方佑祐魯氏散處英額佑祜魯等地方圖色哩氏散處黒龍江薩哈爾察瀋陽等地方赫圖正黄旗人世居黒龍江地方由閒散從征滕縣首先登城陣亡贈騎都尉祀昭忠祠徹圖訥正黄旗人世居薩哈爾察地方由䕶軍校從征四川屢立軍功後在野狐嶺陣亡贈騎都尉兼一雲騎尉祀昭忠祠温特赫氏散處珠舍哩吉陽等地方音布鑲藍旗人世居珠舍哩地方由䕶軍校從征雲南貴州屢立戰功後於秦州陣亡贈騎都尉兼一雲騎尉祀昭忠祠臣等謹按温特赫本金部名見金史以部為氏梅勒氏世居葉赫及哈達地方博和哩氏散處黒龍江琿春等地方塔爾岱鑲白旗人世居薩哈連烏拉地方任都統謚勇壯臣等謹按博和哩本金姓見金史以姓為氏鈕顔氏世居葉赫地方烏達訥鑲黄旗人由䕶軍㕘領從征寶坻縣克其城後在薊州陣亡贈騎都尉祀昭忠祠烏爾古宸氏散處穆楞訥殷等地方和托諾鑲黄旗人世居穆楞地方國初來歸以招降阿庫里尼滿有功編佐領使統之後征大同陣亡贈騎都尉祀昭忠祠聶勒庫正紅旗人世居訥殷地方由御史從征山西陣亡贈雲騎尉其姪孫福善由䕶軍校從征凖噶爾陣亡贈雲騎尉並祀昭忠祠扎拉哩氏散處瓦爾喀那木都魯等地方西特庫正藍旗人由䕶軍㕘領圍錦州擊敗洪承疇三營兵授雲騎尉後征四川擊賊張獻忠陣亡贈騎都尉祀昭忠祠温都氏散處訥殷江綏芬等地方鄂海鑲白旗人世居訥殷江地方任四川陜西總督其從孫烏林泰由佐領從征凖噶爾陣亡贈雲騎尉祀昭忠祠寶金泰正黄旗人係和碩額駙薩爾泰正藍旗人駐國初來歸由佐領從征江西湖廣屢立戰功後防江寧擊海寇鄭成功陣亡贈騎都尉祀昭忠祠臣等謹按温都本部名見金史以部為氏蒙古爾濟氏世居葉赫地方臣等謹按蒙古爾濟氏考八旗氏族通譜滿洲蒙古兩見今併列於滿洲姓内又考蒙古之蒙古爾濟氏世居科爾沁地方阿禮哈氏散處和通吉鄂思屯等地方蘇都哩氏散處黑龍江蘇佳村等地方竒塔喇氏散處松花江雅爾呼等地方轄穆達鑲黄旗人世居松花江地方由䕶軍校從征福建陣亡贈雲騎尉祀昭忠祠鄂托氏散處赫圖阿拉葉赫等地方賽音達理正紅旗人世居赫圖阿拉地方國初來歸由佐領從征羅察陣亡贈雲騎尉祀昭忠祠洪吉哩氏世居烏拉地方墨勒哲哷氏世居松花江地方諾理爾達鑲黄旗人由二等侍衛從征西藏陣亡贈雲騎尉祀昭忠祠貝和鑲黄旗人由三等侍衛從征西路陣亡贈雲騎尉祀昭忠祠索齊哷氏散處吉林烏拉等地方敦多輝正藍旗人世居吉林烏拉地方任内宏文院大學士其姪尼雅哈由六品包衣大從征浙江福建陣亡贈雲騎尉祀昭忠祠托謨氏散處伊巴丹塔山哈逹等地方唐古氏世居哈達地方瓦爾達正白旗人由䕶軍校從征江西有功後攻長沙府首先登城陣亡贈雲騎尉祀昭忠祠都拉喇氏散處吉林烏拉黑龍江等地方扎魯察正白旗人世居吉林烏拉地方由藍翎侍衛從征西藏陣亡贈雲騎尉祀昭忠祠達爾達哈正白旗人扎魯察同族由藍翎侍衛從征昭定藏陣亡贈雲騎尉祀昭忠祠墨勒迪哷氏散處黑龍江寧古塔等地方喀勒達蘇氏散處烏拉黑龍江等地方赫舒哩氏散處哈達松花江等地方登庫鑲黄旗人世居哈達地方由驍騎校從征雲南有功後征廣東陣亡贈雲騎尉祀昭忠祠輝羅氏散處松花江等地方臣等謹按輝羅本金姓見金史以姓為氏濟禮氏世居長白山地方烏珠克圖正黄旗人由閒散從征山東攻泗水縣首先登城陣亡贈騎都尉祀昭忠祠烏爾漢氏世居遼河地方赫宜氏散處舒勒赫錦州等地方扎蘇哩氏世居卦勒察伯都訥等地方拜都氏世居葉赫地方布蘭泰正白旗人任山西巡撫古北口提督諡慤僖其孫永貴任吏部尚書協辦大學士謚文勤賴布氏世居扎庫木佛阿拉等地方碩幹正黄旗人世居佛阿拉地方任漕運總督布賽氏散處輝發薩哈爾察葉赫等地方賽喀那鑲白旗人世居葉赫地方國初來歸由䕶軍㕘領從征察哈爾布爾尼破賊有功授雲騎尉任副都統其子納齊哈任湖北巡撫諡勤恪噶努氏世居噶碩克村及噶努山地方鄂爾布正白旗人世居噶碩克村地方由前鋒校從征盖峙山陣亡贈雲騎尉其子烏喀訥襲從征湖廣陣亡贈騎都尉並祀昭忠祠臣等謹按噶努係地名以地為氏烏蘇占氏世居瓦爾喀什海蘭河地方臣等謹按烏蘇占本金姓見金史以姓為氏尼竒哩氏散處烏拉琿春等地方阿思瑚正紅旗人世居烏拉地方任都察院副都御史縁事降四品官從征湖廣陣亡贈雲騎尉祀昭忠祠鄂謨拖氏世居尼瑪察地方錫住鑲黄旗人由䕶軍校從征浙江有功授雲騎尉後征雲南屢著軍績任西安將軍棟佳氏散處嘉穆瑚嘉哈等地方薩海鑲黄旗人世居嘉哈地方任都察院左都御史阿克占氏散處哈達葉赫等地方臣等謹按阿克占本金部名見金史以部為氏葉穆氏散處葉赫赫爾蘇等地方喀爾拉氏散處遼河葉赫等地方圖錫巴鑲紅旗人由八品官從征江西湖廣屢敗賊兵後於來龍山陣亡贈雲騎尉祀昭忠祠薩克察氏散處綏芬尼瑪察等地方烏爾達氏散處葉赫吉林烏拉等地方翁愛鑲白旗人世居吉林烏拉地方由䕶軍校從征貴州有功後征湖廣陣亡贈雲騎尉祀昭忠祠圖克坦氏散處吉林烏拉等地方臣等謹按圖克坦本金部名見金史以部為氏郭爾佳氏散處長白山嫩河等地方洪鄂春氏散處宜漢阿拉屯齊村雅蘭等地方額爾圖氏散處敦達敦黑龍江等地方彰錦氏散處費雅郎阿沾河等地方特克慎正藍旗人世居費雅郎阿地方任廣州將軍聶格哩氏世居葉赫輝發等地方揚佳氏散處尼瑪察佛阿拉等地方洪鄂氏散處長白山哈達吉林等地方瑚圖鑲白旗人世居吉林地方任杭州將軍謚敏恪圖納鑲白旗人世居哈達地方任刑部尚書諡文恪臣等謹按洪鄂係地名以地為氏賢達禪氏世居松花江賢達禪等地方槐色正黄旗人世居松花江地方由閒散從征浙江陣亡贈雲騎尉祀昭忠祠臣等謹按賢達禪係地名以地為氏赫錫赫哩氏散處烏拉尼瑪察等地方庫穆圖氏散處倭濟愛滿那木都魯等地方康儀哩氏世居費爾塔哈村地方阿爾賽鑲黄旗人由䕶軍㕘領從征江西有功後征貴州陣亡贈雲騎尉照副都統例議卹諡壯愍祀昭忠祠額爾吉氏世居薩哈爾察地方舒墨哩氏世居沾河及烏拉地方錫克濟拉氏世居黑龍江地方徳敦氏世居黑龍江地方珠格氏世居烏拉地方臣等謹按珠格本金部名見金史以部為氏卦勒察氏散處長白山烏拉等地方徳明鑲黄旗人世居長白山地方任户部尚書諡端勤臣等謹按卦勒察係地名以地為氏多爾衮氏世居愛琿城及索倫地方楞格正黄旗人世居愛琿城地方由頭等侍衛從征凖噶爾陣亡贈雲騎尉祀昭忠祠洪佳氏世居烏拉及長白山地方盟佳氏散處郭爾羅斯伊巴丹等地方克音氏世居黑龍江地方錫爾璊正白旗人任將軍明安氏世居界凡地方烏禮蘇氏散處齊齊哈爾黑龍江等地方烏爾登正白旗人任都統薩哈勒濟氏世居葉赫及伯都訥地方尼珠琿氏世居長白山地方甘篤正黄旗人入國初來歸授佐領從征寧逺執纛先征北京遇明兵擊敗之擢兵部侍郎兼副都統征蠡縣克其城又敗洪承疇三營兵定鼎時擊敗流賊二十萬衆平定江南攻克崑山縣城授二等男其弟巴爾賽襲加至一等男綽拜鑲白旗人授一等子烏爾格齊氏世居葉赫地方瑚玉魯氏世居烏拉地方和和齊氏世居尼瑪察地方塔穆察氏世居黑龍江地方誇爾達氏世居哈達地方徳都哷氏世居徳都哷地方們岱正黄旗人由䕶軍㕘領從征厄魯特噶爾丹陣亡贈雲騎尉祀昭忠祠愷顔氏世居愷顔地方珠爾蘇氏世居安褚拉庫地方綽爾秦氏世居綽克秦地方安達拉氏世居黑龍江地方愛琿氏世居愛琿地方海拉蘇氏世居海拉蘇台地方烏靈阿氏世居巴林地方圖們氏世居烏拉地方臣等謹按圖們本金部名又金姓見金史以姓為氏勒第氏世居黑龍江地方額宜圖鑲黄旗人由前鋒校從征湖廣陣亡贈雲騎尉其姪徳明由二等侍衛從征凖噶爾陣亡贈雲騎尉並祀昭忠祠克爾徳氏世居烏拉地方哲伯氏世居漢楚地方薩哈塔由八品官從征陜西陣亡贈雲騎尉祀昭忠祠圖布蘇氏世居葉赫地方臣等謹按圖布蘇本金姓見金史以姓為氏托勒佳氏世居齊齊哈爾地方格格氏世居黑龍江地方罕扎氏世居巴顔和羅地方台弼圖鑲藍旗人由花馬池副將征王輔臣陣亡贈雲騎尉祀昭忠祠穆察氏世居那木都魯地方多囉氏世居葉赫地方沙色由雲騎尉從征凖噶爾陣亡加贈騎都尉祀昭忠祠楚庫勒氏世居楚庫勒地方伊禮布正藍旗人由驍騎校從征浙江有功後在海澄縣陣亡贈雲騎尉祀昭忠祠臣等謹按楚庫勒係地名以地為氏武聶氏世居薩哈爾察地方郭勒本氏世居黑龍江地方圖克敦氏世居達呼爾地方徹爾圖鑲藍旗人由䕶軍㕘領從征湖廣陣亡贈雲騎尉祀昭忠祠葉庫哩氏世居呼爾哈地方哲哩氏世居哈達地方喀錫啟鑲黄旗人由五品官從征陜西陣亡贈雲騎尉祀昭忠祠組佳氏世居鐡嶺地方唐達氏世居科爾沁地方卓克佳氏世居雅爾呼地方崇果嚕氏世居崇果嚕地方墨勒齊氏世居烏拉地方瓦哩氏世居黑龍江地方蔡佳氏世居費爾察哈村地方克葉哷氏世居吉林烏拉地方赫楞泰鑲白旗人由䕶軍㕘領從征凖噶爾陣亡贈雲騎尉祀昭忠祠富勒庫嚕氏世居松花江地方安竒鑲黄旗人由䕶軍㕘領從征凖噶爾陣亡贈雲騎尉祀昭忠祠萬琉哈氏世居清河地方穆顔氏世居琿春地方都善氏世居黑龍江地方拜格氏世居拜格地方臣等謹按拜格本金部名見金史以部為氏阿圖拉墨氏世居雅爾呼地方賽音薩爾圖氏世居扎嚕特地方穆和林氏世居穆和林地方蒙鄂索氏散處瓦面河沾河等地方薩察氏世居瓦爾喀琿春等地方額孟格鑲黄旗人世居琿春地方國初來歸擢置十六大臣之列佐領世定鼎時從征山東河南有功授職加二等輕車都尉臣等謹按薩察本金姓見金史以姓為氏錫墨埒氏散處琿春庫爾喀等地方留佳氏散處李佳和羅等地方臣等謹按留佳氏考八旗氏族通譜滿洲蒙