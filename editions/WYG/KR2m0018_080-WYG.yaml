body:
  text: 欽定四庫全書皇朝通志卷八十刑法畧六赦宥臣等謹按鄭志刑法畧所述赦宥凡大赦曲赦㮣置不録盖以歴朝赦令繁多難於枚舉故從簡畧我朝刑法協中毋枉毋弛列聖以來恭遇慶覃大典或逢水旱偏災則必有徳音下逮以施法外之仁既敬謹摘録而於停止勾决之年亦編次如左查㑹典赦宥概以欽恤今析出各自為卷從鄭例也凡赦宥若犯十惡殺人盜係官財物及強盜竊盜放火發塚受枉法不枉法贓詐偽犯姦略人略賣和誘人口若姦黨及讒言左使殺人故出入人罪若知情故縱聴行藏匿引送説事過錢之類一應實犯雖㑹赦並不原宥其過誤犯罪及因人連累致罪若官吏有犯公罪並從赦宥其赦書臨時欽定罪名特免及降減從輕者不在此限徒流人在道㑹赦計行程過限者不得以赦放有故者不用此律若曽在逃雖在程限内亦不放免其在途身死所隨家口願還者聴遷徙安置人准此其徒流遷徙安置人已至配所及犯謀反叛逆縁坐應流若造畜蠱毒採生折割人殺一家三人㑹赦猶流者不在此限凡以赦前事告言人罪者以其罪罪之若干係錢糧婚姻田土等項罪雖遇赦寛免事湏究問明白凡恩詔内開有軍流俱免之條其和同誘拐案内係民人改發烟瘴少輕地方者既凖寛免係旗下家人發遣為奴人犯一體援免凡官員問擬徒罪不論未已到配遇赦減免令各督撫造具咨部彚題存案其有闗人命擬徒常犯遇赦減等另冊報部核辦不得與尋常徒犯按季冊報凡直省偶值雨澤愆期應請清理庶獄除徒流等罪外其各案内牽連待質及笞杖内情有可原者該督撫一面酌量分别減等一面奏聞天命十年九月詔赦國中死罪以下人犯崇徳元年四月以受尊號禮成大赦除十惡外餘悉原之二年七月皇子生大赦五年十月萬夀聖節大赦七年十月以聖躬違和大赦凡重辟及械繫人犯俱令集大清門外宣諭曰爾等衆犯有罪應死者應責應罰者今俱釋爾罪其各改過自新毋再干國典八年二月上不豫大赦八月世祖章皇帝御極大赦順治元年十月定鼎京師頒詔中外大赦天下五年十月恭奉太祖髙皇帝配天並追尊四祖考妣禮成上親政詔赦天下十年諭立春不雨入夏苗旱朕心甚切憂惶雨澤愆期多由刑獄寃滯刑部堂官即日㑹同都察院大理寺及凡有刑名事件衙門督率司官將在部監獄及發各處羈保聴審人犯如實犯死罪未經審結果有情可矜疑者即日審明具奏定奪徒流人犯察非重情準與減等笞杖豁免候審干連證犯先行釋放限十日内開具簡明情節減免罪名及釋過人犯具奏發落大小獄情未審結者限一月内通行完結順天府督同大宛二縣五城御史督同司坊官直𨽻督撫按督同所屬道府州縣一體遵行務期申寃疏滯上格天心十一年六月以大婚禮成恭上皇太后徽號詔赦天下十一月上以災異修省詔赦天下十二年停止秋决定毎遇䘏刑之年内外悉暫停秋審十三年七月以乾清宫成詔赦天下是年停在京秋决十二月以冊封皇貴妃禮成詔赦天下除十惡及受贓官吏盜欠錢糧員役不赦外其餘死罪皆減一等軍流以下咸赦除之在京朝審候决及直省秋决重犯皆予減等發落十四年三月恭奉太宗文皇帝配天禮成詔赦天下五月雨澤愆期諭遣内閣大臣㑹同刑部將現在獄犯無論已結未結逐加詳審其有無知而罹法網小過而陷重辟者即與嚴察奏聞是年上以内外刑辟宜同一例命各省秋决亦暫停一次十五年正月以皇太后聖體違豫詔赦天下十七年正月以地震嵗祲上省躬詔赦天下十一月命監候各犯㮣從減等停止秋决十八年正月上大漸諭京城内除十惡外其餘死罪以下悉行放釋康熙元年詔赦天下凡罪不論已結及現在告發者但繫元年以前事悉赦之四年三月以星變地震上省躬詔赦天下九月恭上太皇太后皇太后徽號禮成詔赦天下六年七月上親政詔赦天下十一月恭奉世祖章皇帝配天並加上太皇太后皇太后徽號禮成詔赦天下七年五月以雨澤愆期命内大臣㑹同刑部詳審重囚其輕罪即行保釋九年五月孝康章皇后升袝太廟禮成詔赦天下十年四月以天旱命刑部清理現禁人犯如有可矜疑者即予減等發落十四年五月諭邇者天氣炎亢農事堪憂或因刑獄淹禁中有寃枉致干天和亦未可知兹特遣閣臣㑹同三法司將已結重案逐一詳審有罪可矜疑者即與察明事由開列具奏十六年十九年二十五年二十六年二十八年並同十六年停止秋決二十年二十一年二十三年二十八年三十二年四十一年四十四年五十年五十四年五十五年五十六年五十七年五十九年六十年六十一年並同二十年十二月以吳逆蕩平詔赦天下二十一年三月詣盛京謁陵禮成諭山海闗以外及寧古塔等處官吏軍民人等除十惡死罪不赦外其餘已結未結一切死罪皆減等發落軍流以下悉予赦免二十五年五月諭明罰勅法國憲不可以己雖嘗屢行矜卹絶去煩苛終思尚徳緩刑乃為至治之極軌自康熙元年中外臣民習染澆風姦貪詐偽頑鈍者恬弗知耻狡黠者愍不畏法以致是非乖繆綱紀陵夷朕親政後洞悉姦弊加意釐剔務使骩律干紀之衆人無遯情法無旁貸庶㡬禁遏頑豪杜塞僥倖近見罹罪罟者漸少但革面未能革心祇因法令嚴宻輒思茍免茍免之心切則彌縫之弊深巧偽滋多亦未可定今欲崇尚徳化務存惇大一切令之自新除前經審擬完結各案及闗係工程錢糧不議外一應枉法得贓行賄與受人員仍革職免擬重辟照例追贓其未經發覺者悉予寛免有以諭前事叅訐者一概不準自諭以後中外臣民湏洗心易慮省改前非守法奉公敦勵亷耻以副朕使人寡過之至意二十六年五月以天旱詔赦天下十一月以太皇太后聖體違和諭内外問刑衙門現監重辟人犯除十惡死罪及貪官光棍不赦外其餘已經奉㫖監候死罪重犯㮣行減等發落以昭祈天永佑至意是年題準停止本年内外秋審二十七年三十五年四十六年五十八年奉㫖同二十八年二月南巡欽奉諭㫖經過山東江南兩省除十惡死罪及官吏犯贓不赦外其餘自康熙二十八年二月十一日以前死罪及軍流徒罪以下已結未結悉著寛釋又諭浙省各屬地方罪犯現在監禁者令照江南山東例一體赦免三十八年四十二年四十四年並同四十四年並赦及福建二十九年九月諭今年内外秋决著停止情實及緩决各案皆不必具題其情可矜疑者著照例具奏三十四年三十九年四十九年五十三年並同三十一年八月諭今年秋審人犯情實者停其正法矜疑者照常完給先經具題情實正法人等亦著作速行文停其正法十月諭秦省西安等處地方比嵗薦饑閭閻困苦凡陕西所屬今年秋審緩决人犯内除十惡及軍機獲罪官員不赦外其餘自諭㫖到日通行免死減等發落有現在審擬未經結案者亦如之二十四年十一月以直省旱潦晉省地震詔赦天下三十六年七月以平定噶爾丹詔赦天下三十七年九月上以親臨烏喇命停止應决人犯並諭至盛京時亦照此例行四十一年八月諭見在刑部及直省監禁人犯凡經康熙四十年秋審奉㫖緩决者著察明通行發落仍開具人數奏明四十三年正月以萬夀聖節四海奠安河工告成詔赦天下八月奉㫖今年三月已頒恩詔所有罪犯無多秋審著停止五十二年同四十五年十二月諭歴年以來内外監候緩決人犯二百二十五名俱著免死減等發落在直𨽻各省者爾部即移文各該巡撫令遵㫖速行四十七年九月恩詔今年内外秋審情實人犯除已結省分外其未經具題各案情實者著處决緩决者減等矜疑者皆照例發落四十八年十月諭江南浙江連年災荒地方困苦又今年兩省疾疫盛行人命傷斃甚衆江浙兩省應處決情實人犯悉著停止一年五十二年三月以萬夀聖節詔赦天下五十五年諭刑部緩決人犯長繫囹圄殊屬可憫令九卿㑹同按其年分久逺憫屬可矜者分别奏明減等六十一年十一月世宗憲皇帝登極詔赦天下雍正元年二月恭上聖祖仁皇帝尊諡升袝太廟禮成詔赦天下八月恭上孝恭仁皇后尊諡升袝太廟禮成詔赦天下九月恭上孝誠仁皇后孝昭仁皇后孝懿仁皇后諡升袝太廟禮成詔赦天下十一月恭奉聖祖仁皇帝配天禮成詔赦天下是年奉㫖内外情實人犯今年停止處决二年四年五年六年七年八年十年十三年並同四年七月奉諭各省命案内其情由可惡者不准寛免外其餘一百七十七名俱著釋放此朕格外生全之恩為舊例之所未有凡兹小民當體朕省刑宥過之意九年六月以天旱命法司將監禁輕犯暫行保釋其擬絞監候賊犯已經二年者酌量釋放減等並諭將外省輕罪人犯已輕到部有問擬徒杖而准其折贖者悉行寛免十年以天旱命法司省釋輕罪監犯十三年九月皇上御極詔赦天下十二月恩詔犯法婦人除十惡不赦外其餘盡行赦免乾隆元年六月諭明刑敕法國之大典而肆赦所加原以昭法外之仁也恩詔之頒期以息事寧人使逺邇咸知遷善改過共為良民以成太平之治乃聞各直省於一切案件仍以提審駁審嚴刑酷夾恣意株連使無辜之人困於囹圄細微之事刻為鍜錬含寃稱屈所在多有夫罪名未定案情未協或有仍須審詳者但既非犯在不赦則斷讞亦易成招若使合於赦欵之人不得即邀赦免之澤而以酷刑斃命或因拖累破家則後即審明援赦亦已無及是朝廷已生全之有司故戕害之藐視功令殘虐民生莫此為甚且頒詔之後已逾半年而題結咨結批結之案尚屬寥寥遲玩已極著刑部即行令各該督撫速行嚴飭各屬立即詳慎察明遂一詳報歸結省釋如有仍前濫刑擾累及擔延滋弊以沮抑國家徳意者一經察出罪有攸歸斷不輕貸即刑部所有案件亦即速為剖晰勿致沉擱以副朕哀矜庶獄之至意是年奉㫖本年秋審情實人犯著停止勾次二年五年六年八年九年十一年十三年十五年十六年十九年二十六年三十六年四十五年並同又諭直省秋審冊内有自康熙五十二年至雍正三年以前皆繫緩決者著九卿科道等逐一詳加察覈悉心簡閲酌予減等二年三月恭奉世宗憲皇帝孝敬憲皇后升祔太廟禮成詔赦天下見在定議軍流徒罪人犯未至配所者㮣與寛免四月恭奉世宗憲皇帝配天禮成詔赦天下漢軍犯軍流罪者已照舊例以枷責完結其從前發遣在配者該部按其情罪具奏請㫖又軍流人犯已到配所者向例遇赦不准放回今特加恩此等人犯内除情罪重大及免死減等實繁兇惡棍徒外其餘因事議遣在配已過三年安静悔過情願回籍者該督撫具奏請㫖准其回籍又以天旱命清理滯獄諭雍正四年以後十三年以前所有不赦各案其中或有介于疑似及屢經秋審緩决之犯或未可定著總理事務王大臣㑹同刑部將秋審朝審招冊詳加覆勘如果有一綫可原應行減等者即酌定請㫖四年四月以天旱命法司將杖徒以下等罪查明請㫖減等釋放十一月諭著九卿等將秋審朝審緩决五次以上人犯酌其情罪稍輕尚可貸其生路者逐一分别請㫖比照兇盜免死減等之例充發邊逺烟瘴地方至情罪可惡者雖經屢年緩决亦不在減等之例五年五月以天旱諭刑部見在監禁人犯内有一綫可原者著大學士軍機大臣等㑹同爾部分别具奏其輕罪人犯亦即減等七年三月以天旱諭刑部將在部各案有牽連待質者有輕罪可矜原者或應省釋或應末減㑹同都察院大理寺詳覈妥議具奏直𨽻山東河南三省目下雨晹不均亦著照此例行嗣後各省凡遇灾𤯝之年著該督撫將清理刑獄之處奏聞請㫖八月諭今年上下兩江被水情形非常年可比見在江蘇安徽兩省人犯中有情有可原當在矜疑之列者或多年緩决不至正法乆繫囹圄者皆應減等完結著大學士㑹同刑部詳閲招冊分别妥議具奏十月諭乾隆四年朕曽降㫖秋審朝審緩决五次以上之人犯酌其情罪稍輕尚可貸以生路者比照兇盜免死減等之例充發邊逺烟瘴地方較之可矜減等杖流之例為重較之永逺監禁之犯為輕其情罪可惡者雖經多次緩决亦不在減等之例今已隔數年監禁之犯倍多於前久繫囹圄亦屬可憫著大學士九卿仿照乾隆四年之例悉心辦理分别請㫖再情實未勾人犯内或有情罪稍輕可以照此辦理者亦著大學士㑹同刑部分别具奏八年九月上詣盛京謁陵禮成諭自山海闗以外及寧古塔等處官吏軍民人等除十惡死罪外其餘已結未結一應死罪皆著減等發落軍流以下悉予寛免十九年四十三年四十八年並同十年四月以雨澤愆期諭刑部堂官將徒杖以下等犯覈明情節或應釋放或應減等即行具奏其尋常案件亦速為完結並行令直督一例辦理十五年十八年二十三年二十四年諭㫖並同三十六年三十九年四十八年四十九年則年併諭令京師直𨽻軍流以下等罪減等四十三及河南省四十九年併及山東省十一年正月詔赦天下奉諭古帝王治天下之道以省刑薄賦為先朕臨御以來愛育黎庻惟日孜孜於兹十年矣仰荷天祖眷佑海宇乂安萬民樂業朕心慶慰特沛曠典與民休息念各省獲罪之犯於上年勾到之後見有羈禁囹圄者雖伊等孽有自作法無可寛而其中情事不同輕重亦有差别國家赦宥之典或因行慶施惠或因水旱為災間一舉行今朕哀矜庶獄不忍令其淹滯圜扉所有刑部及各省已經結案監禁人犯除情罪重大及常赦不原者無庸辦理外其餘著大學士㑹同刑部酌量分别請㫖減等發落其軍流徒杖以下一并分晰減等完結俾伊等同霑肆赦之恩勉圖自新之路以副朕協中欽䘏本懷五月命各省覊禁人犯經督撫審題部駁未結及各省未經審題案犯事在恩㫖以前者俱著分别減免請㫖九月上巡幸五臺諭朕此次西巡著將直𨽻山西二省本年正月初三日恩㫖以後所有軍流以下人犯令該督撫分别情罪請㫖減等發落十五年二十六年四十六年並同十二年五月以天旱命減免緩決五次及徒罪以下人犯十三年三月上巡幸山東命寛減直𨽻山東兩省緩决五次及軍流以下罪犯十五年八月詔赦天下秋審緩決五次以上人犯量予減等犯法婦人除十惡不赦外其餘㮣予赦免見在監候質審干連人等凖予保釋九月上巡幸河南諭朕今嵗初次巡幸豫省所有河南省軍流以下罪犯著察明減等發落十六年正月諭直省朝審秋審各犯緩决至三次以上者即著該部察明酌量案情分别請㫖減等發落二十六年三十年三十四年三十六年四十一年四十九年並同十八年諭著該部察明朝審秋審各犯酌其情罪稍輕緩决至三次以上者分别請㫖減等發落此外有情罪本重累年辦理未經寛減而定案在康熙雍正年間緩决十餘次至數十次内有一綫可原者亦著察明分别請㫖二十年以平定伊犂詔赦天下除謀故殺外如原無讐隙偶因一時忿激相歐傷重致死者將兇犯免死決杖一百照例追銀四十兩給死者家屬軍流以下人犯㮣予減等發落除十惡不赦犯法婦人盡行赦免現在内外監候質審及干連人等久禁囹圄恐致無辜瘐死著㮣行釋放二十一年上東巡諭山東省見在軍流以下人犯悉予減等發落三十六年四十一年同二十二年上南巡諭江蘇安徽浙江等屬軍流以下人犯俱著減等發落二十七年三十年四十五年四十九年並同二十四年以平定回部詔赦天下流徒人犯在流徒處所身故其妻子願回籍者該地方官報明該部凖其各回原籍軍流以下人等㮣予減等發落三十六年同二十六年十一月恭遇皇太后萬夀聖節詔赦天下凡軍流以下人犯㮣予減等發落三十六年同二十九年諭緩决人犯不但三次者今秋應予減免即一二次者亦著查明分别減等該部即遵諭行四十二年五月恭奉孝聖憲皇后升祔太廟禮成詔赦天下四十三年諭交各省督撫查明各該地方從前軍流人犯已過十年安分守法别無過犯者分别咨部核議奏請省釋其有在配年久不願回籍者仍聴其自便四十九年諭本日勾到朝審情實各犯黄冊内舊事至三十餘案人數甚多毎年各該犯仍照例綁赴市曹仍㮣不予勾自應核其情節量為末減各犯已過三次勾到情罪較重者著加恩改為監候牢固監禁遇赦不赦其已過三次勾到情罪稍輕者著加恩改為緩次將来遇應予減等之時仍照例辦理大學士㑹同刑部秉公詳核分别定議具奏以副朕清理庶獄至意五十年以國祚綿長初逢大衍詔赦天下又奉諭本年舉行千叟宴盛典官民耆老咸得普被恩施用彰錫福其直省軍流以下人犯亦於恩詔内㮣予減等發落惟罪犯斬絞情節不至予勾或本擬緩决者俱應牢固監禁該犯等因身罹重辟雖年已老邁仍不免羈禁囹圄未得一體邀恩朕心深用惻然著刑部堂官于朝審秋審情實未勾并原擬緩决斬絞人犯内詳加查核除近年新事及舊案年未及七十者仍牢固監禁外其餘年七十以上未經予勾及本擬緩决之犯著加恩分别減免釋放該部詳悉妥議具奏臣等謹按杜佑作刑典於赦宥一門附以放生鄭樵刑法畧因之考禮記王制天子無事則嵗三田無事而不田曰不敬田不以禮曰暴天物其頒布禁令曰獺祭魚然後魚人入澤梁豺祭獸然後田獵鳩化為鷹然後設罻羅草木零落然後入山林昆蟲未蟄不以火田不麝不卵不殺胎不殀夭不覆巢所以順天時廣仁意者如此而已無所謂放生之説也其斷屠宰禁弋獵實自唐之武后始其時鳯閣舍人崔融已上議言其不合禮經矣我朝自列聖以來仁民愛物徳意交孚四海之内熙熙皡皡暨鳥獸魚鱉咸若人得其性物遂其生舉凡曲惠小恩皆所不取伏讀御製集載放生詩二篇其一曰魚喜江湖鳥喜天物各得所性自全意欲愛之乃害之適如敺魚之獺􅇌爵鸇嗟哉煦煦為仁流放生之事於是傳市井小兒謀利巧生淵取魚樹羅鳥持鬻街頭供放生猶然自咎所獲少剛幸九死得一生駾喙未定魂猶驚因縁仍復遭網罟終為几上之葅釡中烹君不見自從人好行小惠林泉之物乃少全其類其一曰滎陽逭沛公遂有放鳩制巴陵則放鴉用以卜新嵗因之傳放生隂隲盛後世鳥獸虫魚鼈其類初不計甲者謝曽公東齋曽備記其事始儒家詎出緇黄議羣生非自投仍由人捕致捕十活五六遇放復遭繫害生縁放生匪愛害實暨小道雖可觀致逺則恐泥恭繹天章可以知王政之大逈非煦煦為仁者所可同年語矣皇朝通志卷八十
