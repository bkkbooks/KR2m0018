body:
  text: 氏族畧八臣等謹按漢人姓氏鄭志氏族畧内俱經編録自無庸重見至滿洲旗分内之高麗尼堪臺尼堪撫順尼堪等姓氏仍應倣照八旗氏族通譜之例另為編載附於滿洲䝉古之後惟名位及格者無多每姓附録數人不以官職崇卑為區别云滿洲旗分内高麗姓金氏散處易州蓋州得州等地方新達理正黃旗包衣人世居易州地方天聰中率子弟來歸授為通事官時有新附高麗人登納米恩尼比往來高麗潛蓄異志新達理亷得其情奏聞皆置於法崇徳中從征高麗遇伏兵以計敗之統太宗文皇帝以俘獲高麗人户編佐領使之又從征松山有功任内務府三旗火器營總管其孫常明任御前大臣領侍衛内大臣贈太子太保諡慤勤新達理第三弟通事官三達理之曽孫金輝任兵部侍郎又新達理第四弟季達理由䕶軍校從征福建陣亡贈雲騎尉祀昭忠祠幾蚌伊鑲黃旗包衣人由司庫從征察哈爾布爾尼陣亡贈雲騎尉祀昭忠祠韓氏散居易州開城府等地方韓雲正紅旗人世居易州地方國初同弟韓尼來歸授二等輕車都尉從征錦州擊松山兵敗之入山海關擊敗流賊二十萬衆叙功授一等輕車都尉其子韓基襲職加至二等男韓尼授一等輕車都尉兼一雲騎尉其第三子傑都由䕶軍㕘領從征福建擊海冦鄭成功舟師敗之征四川擊敗施存禮等兵一萬七千餘衆後擊王屏藩陣亡贈騎都尉兼一雲騎尉祀昭忠祠韓尼第四子那秦任黑龍江副都統李氏散處黃河套平安道等地方騰那弼鑲藍旗包衣人天聰時來歸其孫滿達由䕶軍校從征準噶爾陣亡贈雲騎尉祀昭忠祠朴氏散處易州平壤等地方東安鑲白旗包衣人世居易州地方天聰時來歸任内大臣張氏散處易州望京等地方坦濟尼正藍旗人世居易州地方其孫雅圖任都統傅氏原籍無考三蘓正黃旗人其孫額依圖任副都統柏氏世居易州地方柏雲正黃旗包衣人天聰時來歸其孫海錫尼由䕶軍校從征耿逆擊敗之又奪洛陽橋陣亡贈騎都尉祀昭忠祠洪氏散處南大門易州開城府等地方牟易金正白旗人國初來歸任頭等侍衛崔氏散處易州𤓰克山等地方江那米正紅旗人世居易州地方國初來歸其長子四通阿任御史曾孫新鼐任御史劉氏散處安法博川郡等地方薩穆吉正黃旗包衣人世居安法地方任藍翎侍衛黃氏散處易州開州等地方伊勒穆蘇正白旗包衣人世居開州地方其子吉圖任䕶軍㕘領孫輝色任郎中岡氏散處易州望京等地方茂思鑲藍旗包衣人世居易州地方國初來歸其子拉揚阿任三等䕶衛楊氏世居輝寧地方傑漢尼正黃旗包衣人天聰時來歸其孫黃茂七十八曾孫徳平俱任通事官吳氏散處易州海州等地方那海鑲白旗包衣人世居海州地方天聰時來歸其元孫珠隆阿任三等䕶衛陳氏世居平壤地方巴顏鑲藍旗包衣人天聰時來歸其曾孫二達色任䕶軍文氏世居嘉山堡地方文瑞鑲白旗包衣人等國初來歸任八品通事官其孫三格任頭䕶衛孫氏世居望京地方玉蘭鑲藍旗包衣人等國初來歸其子謝秘任郎中孫杭愛任頭䕶衛丁氏世居恩山縣地方古爾瑪渾正紅旗包衣人國初來歸任通事官任氏世居易州地方外朗鑲白旗包衣人衛國初來歸其子申珠納任頭等䕶伊氏原籍無考朋楚尼正黃旗人初來歸其孫哈達任䕶軍校國宋氏原籍無考仲格正黃旗人騎國初來歸其子都爾都任驍校徐氏世居噶山地方徐大勇鑲白旗包衣人徐國初來歸其曾孫徐宗順任八品通事官宗孟任六品通事官車氏世居平陽地方調亥正黃旗包衣人天聰時來歸任通事官其元孫巴格任䕶軍㕘領萬氏世居平陽地方滿春尼正黃旗包衣人天聰時來歸其元孫鼎柱任三等侍衛江氏世居得州地方桂羲正黃旗色衣人天聰時來歸其曽孫七十任主事邊氏世居易州地方邊南正黃旗包衣人天聰時來歸任通事官何氏世居平安道地方何龍普正黃旗包衣人天聰時來歸其子常綬任通事官閔氏世居易州地方鐡令義鑲白旗包衣人天聰時來歸其子雅圖任包衣大林氏原籍無考林尚禮鑲藍旗包衣人天聰時來歸其孫雅圖任五品典儀佟氏世居開州地方佟佐正白旗包衣人其孫佟英舉任知府元孫六格任郎中㕘領兼佐領四世孫安保任員外郎瓦氏世居易州地方濟禮正白旗包衣人任通事官耿氏世居博川郡地方耿世尼正藍旗包衣人來歸年分無考其孫赫伸任㕘領馬氏世居𤓰克山地方高理鑲藍旗包衣人天聰時來歸鄭氏世居得州地方鄭義南正黃旗包衣人天聰時來歸曹氏世居建常地方曹基正紅旗包衣人考國初來歸曹國相正紅旗人來歸年分無其孫傅森額係前鋒郭氏世居易州地方登納宻正黃旗包衣人天聰時來歸沈氏世居得州地方傑林壁正黃旗包衣人天聰時來歸方氏世居得州地方徳克什正黄旗包衣人天聰時來歸秦氏世居得州地方囊弼資正黃旗包衣人天聰時來歸孟氏世居易州地方羅岱鑲白旗包衣人天聰時來歸田氏世居平壤地方興尼壁鑲白旗包衣人天聰時來歸辛氏原籍無考星嘉那宻正白旗包衣人來歸年分無考滿洲旗分内尼堪姓張氏張良弼正白旗包衣旗鼓人世居瀋陽地方國初來歸由閒散隨征克遼東授佐領圍錦州擊敗洪承疇兵授二等輕車都尉其子張時薦襲職加至三等男張文興鑲黃旗人世居開平衛地方任甘肅巡撫張滋徳正白旗包衣管領下人世居遼陽地方任山西巡撫李氏偏圖正白旗包衣旗鼓人世居瀋陽地方由都司從征山西有功任都統李鍈貴正白旗包衣旗鼓人世居遼陽地方任户部侍郎李懋功正白旗包衣人世居瀋陽地方任雲南永順鎮總兵官四十六鑲藍旗包衣人世居瀋陽地方任雲南鶴麗鎮總兵官李瀚鑲黃旗包衣管領下人世居瀋陽地方任江西巡撫髙氏地藏保鑲藍旗包衣人世居瀋陽地方由遊擊從征浙江福建于永寧衛陣亡贈雲騎尉祀昭忠祠布達理正白旗包衣管領下人世居瀋陽地方任内閣學士兼禮部侍郎雷氏雷宏華鑲白旗包衣人世居遼陽地方任鑾儀衛鑾儀使其孫浩善由副將從征陜西恢復豐縣等五城有功授雲騎尉後征四川陣亡贈騎都尉祀昭忠祠雷繼宗雷繼尊俱任都統陳氏陳達正黃旗包衣人世居瀋陽地方任陜西永固副將遇賊阿喇奈等犯邊迎擊陣亡贈雲騎尉祀昭忠祠周氏周天成鑲黃旗包衣旗鼓人世居瀋陽地方任宏文院學士胡氏胡海鑲黃旗包衣旗鼓人世居遼陽地方國初來歸授三等男董氏董徳貴正黃旗包衣人世居撫順地方任佐領入山海關擊敗流賊二十萬衆授二等輕車都尉其姪浩春任湖廣沅州鎮總兵官其姪董玉象任副都統黃氏黃世仁正白旗包衣人世居瀋陽地方天聰時來歸授二等輕車都尉鈕氏鈕成憲鑲白旗包衣管領下人世居遼陽地方由佐領從征大同陣亡贈騎都尉祀昭忠祠吳氏吳興祚正紅旗包衣人世居鐵嶺地方任福建巡撫平定海冦有功擢兩廣總督尚氏尚志立正白旗包衣人世居瀋陽地方由副將從征洞庭湖陣亡贈雲騎尉祀昭忠祠韓氏韓大任鑲黃旗包衣旗鼔人世居中後所地方由員外郎從征厄魯特噶爾丹陣亡贈雲騎尉祀昭忠祠馬氏僧格正白旗包衣人世居瀋陽地方任吏部尚書其弟費雅達任陜西潼闗鎮總兵官王氏性桂正藍旗人世居義州地方任吏部尚書曹氏曹璽正白旗包衣人世居瀋陽地方任工部尚書丁氏丁皂保正黃旗包衣人世居遼陽地方任内務府總管食一品俸諡温慤魏氏五十一正黃旗包衣管領下人世居瀋陽地方任内務府總管吕氏吕猶龍正紅旗包衣管領下人世居鐵嶺地方任浙江巡撫鄭氏鄭彬正黃旗包衣人世居瀋陽地方任江蘇巡撫羅氏定柱正黃旗包衣管領下人世居瀋陽地方任大理寺卿白氏博赫鑲黃旗包衣管領下人世居撫順地方任武備院卿劉氏劉明世鑲黃旗包衣旗鼓人世居三韓地方任知府徐氏四格鑲黃旗包衣旗鼓人世居瀋陽地方任頭等侍衛徐岱正白旗包衣旗鼓人世居瀋陽地方任㕘將崔氏崔昇鑲黃旗包衣旗鼓人世居遼陽地方任寧夏道楊氏陶色正黃旗包衣管領下人世居遼陽地方天聰時來歸任内管領孫氏孫天保鑲黃旗包衣旗鼓人世居撫順地方任䕶軍㕘領趙氏趙崔忠鑲黃旗包衣旗鼓人世居瀋陽地方任知府胡氏胡來象鑲黃旗包衣旗鼓人世居三韓地方任太常寺少卿其子胡祝任御史胡朝賓鑲黄旗包衣旗鼓人世居瀋陽地方任山東兵備道金氏金朝昇正黄旗包衣人世居瀋陽地方任遊擊許氏許兆麟鑲黄旗包衣人世居撫順地方任員外郎郭氏郭永慶鑲黄旗包衣旗鼓人世居瀋陽地方任員外郎佟氏佟田猷正白旗包衣管領下人世居松山地方任四品官何氏何誠正正白旗包衣管領下人世居瀋陽地方國初來歸任驍騎校鄧氏鄧安明鑲黃旗包衣旗鼓人世居瀋陽地方任驍騎校其孫鄧廣乾曽孫鄧智宗俱任郎中姚氏姚承徳正白旗包衣旗鼓人世居地方任副將其姪孫永泰任員外陽蕭氏四格鑲黃旗包衣旗鼓人世居瀋陽地方任三等侍衛謝氏謝承宗正黃旗包衣人世居瀋陽地方任驍騎校俞氏俞耀龍鑲黃旗包衣旗鼓人世居瀋陽地方任知府其子俞恵任知府俞龍門正黃旗包衣旗鼓人世居遼陽地方任湖北粮道其姪孫俞昌宗任浙江温處道田氏闗保鑲黃旗包衣管領下人世居撫順地方任員外郎康氏羅敏正黃旗包衣管領下人世居瀋陽地方任牧長烏什泰正白旗包衣管領下人世居瀋陽地方任郎中汪氏汪繼圖正白旗包衣旗鼓人世居瀋陽地方任員外郎兼佐領其姪四格任員外郎兼佐領田格任三等侍衛永保任郎中兼佐領汪國弼鑲白旗包衣管領下人世居鐵嶺地方任内閣侍讀學士閻氏閻成儒鑲黃旗包衣管領下人世居瀋陽地方任知州其子雅思泰任副將羅氏羅世泰鑲黃旗包衣管領下人世居瀋陽地方任郎中姜氏玉山正白旗包衣管領下人世居瀋陽地方任鴻臚寺卿戴氏齊克騰鑲黃旗包衣旗鼓人世居瀋陽地方任三等侍衛梁氏梁忠正紅旗包衣管領下人世居鐵嶺地方任江蘇按察使孟氏富保鑲黃旗包衣旗鼓人世居瀋陽地方任副驍騎校顧氏薩靈阿正黃旗包衣人世居瀋陽地方任䕶軍㕘領朱氏滿色正白旗包衣管領下人世居長白山地方任員外郎其子來住亦任員外郎杜氏杜天成正白旗包衣旗鼓人世居瀋陽地方任知縣蘇氏蘇有徳鑲黃旗包衣管領下人世居遼陽地方任廏長其子納爾泰任郎中孫定柱任三等侍衛程氏程武鑲黄旗包衣旗鼓人世居瀋陽地方任郎中兼佐領尤氏尤裕正黃旗包衣人世居遼陽地方任筆帖式任氏六格鑲黃旗包衣管領下人世居長白山地方任三等侍衛石氏石應舉正黃旗包衣人世居遼陽地方任䕶軍㕘領宋氏安達理鑲黃旗包衣管領下人世居鐵嶺地方任牧長潘氏方和鑲黃旗包衣管領下人世居鐵嶺地方任牧長祁氏祁澄叙正黃旗包衣人世居瀋陽地方任湖廣兵偹道聞氏黄英正黄旗包衣旗鼓人世居瀋陽地方任牧長紀氏莫爾泰正白旗包衣管領下人世居長白山地方任内副管領袁氏袁繼功正白旗包衣旗鼓人世居瀋陽地方任同知于氏于麟角正白旗包衣旗鼓人世居瀋陽地方任主事于志祥鑲藍旗包衣人世居瀋陽地方天聰時來歸其孫于二格任七品官侯氏俊才鑲黃旗包衣管領下人世居瀋陽地方其孫六格任永定河道國柱任員外郎拜思呼朗正白旗包衣管領下人世居瀋陽地方國初來歸任司胙官裴氏裴登舉鑲黃旗包衣旗鼓人世居瀋陽地方其曽孫浩善任員外郎方氏方義文鑲黃旗包衣管領下人世居瀋陽地方其孫七格任内管領