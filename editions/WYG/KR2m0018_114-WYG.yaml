front:
  text: 欽定四庫全書皇朝通志卷一百十四
  hash: sha256:d86736ea143d3d9dfab9d2b8ee5e3fef72e723143c0b61b2df06f520a60318bc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_114-1a, image: WYG0645/WYG0645-0525a.png}
body:
  text: 圖譜畧臣下八十四種四庫全書著録者二十五附存四庫全書總目者五十九經學黄宗炎周易圖學辨惑謹按是書附宗炎周易象辭之後别為一卷胡渭易圖明辨謹按胡渭此書辨定圖書究溯本末使學者知從來圖書之説依托舛謬乃修錬術數二家旁分易學之支流而非作易之根柢深有功於經學趙繼序周易圖書質疑謹按是書多從卦變起象以象數言易而不主陳卲河洛之説胡世安大易則通謹按是書闡明圖學彚萃諸家之圖各為之説卲嗣堯圖易定本謹按是書言易多本皇極經世而附以揲蓍之法姜兆錫周易藴義圖考謹按是編主先天之學推闡舊説張文炳易象數鈎深圖謹按張文炳薈萃諸家圖説以成一編間附以己論毛竒齡河圖洛書原舛編謹按是書著説於前列圖於後排撃異學殊有功於經義楊方達易學圖説㑹通謹按是編大指以朱子本義九圖為主博採諸家間附己論楊方達易學圖説續聞謹按楊方達既為易學圖説會通復自出己意成此編大扺主陳摶之學曹庭棟易準謹按是書専為圖學而作劉鳴珂易圖䟽義謹按是書因周易啓䝉本圖書原畫卦二篇之説而疏通其義呉脉鬯易象圖説謹按吴脉鬯櫽括諸圖各為之説間附以己作黎由髙周易後天歸圖謹按是書専明後天之易六十四卦反對之義而一歸之於圖劉天真河洛先天圖説謹按劉天真言易大㫖本於參天兩地而倚數之説王澍禹貢譜謹按是書各著經文於前而附圖於後大扺皆本蔡傳而參以諸家之説萬斯同廟制圖考謹按是書統會經史折衷廟制大㫖宗王黜鄭亦得失互陳毛竒齡辨定祭禮通俗譜謹按是編斟酌變通於古禮之必不可行及俗禮之誤托於古者剖析考證釐然有當朱建子服制圖考謹按是編集歴代喪服禮制凡三十九條所引經傳禮書及諸家文集頗稱該洽陳厚耀春秋世族譜謹按杜預作春秋釋例中有世族譜一書歴久湮沒不見永樂大典中僅存數條仍不免於闕畧厚耀當時既未覩杜預釋例原本因據孔氏正義旁參他書作此以補之顧棟髙春秋大事表謹按是書以春秋列國諸事比而為表後載輿圖附錄各一卷引據博洽議論精確多發前人所未發盧軒春秋三傳纂凡表謹按盧軒以三傳所言書法之例彚而為表其是非同異未及訂正顧宗瑋春秋左傳事類年表謹按是書僅一卷據其凡例尚有數卷未見盖非完書也盧雲英重編五經圖謹按盧雲英以其曾祖盧謙所刻五經圖原本體例參差復釐定增補成是編多所改正王皜六經圖謹按是編取六經圖舊本損益而成楊魁植九經圖謹按是書以信州石刻易詩書禮記周禮春秋六經圖析春秋三傳為三而益以儀禮為九經江永鄉黨圖考謹按是書取經傳中制度名物有涉扵鄉黨者分為九類考核精宻毛竒齡大學知本圖説謹按是書由古本大學著為圖説與朱子格物之傳不無齟齬毛竒齡竟山樂錄謹按是書據明寜王權唐樂笛色譜為準以解五音十二律還相為宫俾唐以來舊譜獨有考焉李塨李氏學樂錄謹按李塨嘗學五音七聲十二律以器色相配之説於毛竒齡作宫調圖七調全圖及十二律旋相為宫隔八相生等圖而皆為之論説王建常律吕圖説謹按是書大抵依蔡氏律吕新書次第為之圖説尤力申候氣之法歴引隋志及明人韓邦竒諸説為之發明張紫芝律吕圖説謹按是書首引朱子鍾律篇次列黄鍾圖自此以下凡三十八圖以月建日躔圖終焉毎圖各為之説顧炎武古音表謹按顧炎武有音學五書此其一也凡分十部考以古法多相脗合足糾吴棫以來之謬耿人龍韻統圖説謹按是書於古來字毋多所刪併盡改前代舊法顧陳垿八矢注字圖説謹按是編乃顧陳垿所定韻書八矢者譬字為的以八矢注之分為八門也錢人麟聲韻圖譜謹按是書即等韻舊法而變通之其所刪併多出己意江永四聲切韻表謹按是編論古法七音三十六母不可增易凡更定者皆妄作最為有見其論入聲尤詳潘遂先聲音發源圖解謹按是書為潘遂先草創其子命世續成之劉凝韻原表謹按劉凝初作文字韻原一編以限於篇幅乃倣史記諸表之例從各字偏旁序其世系分其支派以濟韻原之窮史乗萬斯同歴代史表謹按十七史自後漢書以下惟新唐書有表餘皆闕如萬斯同各為補撰多自創之例王懋竑朱子年譜謹按王懋竑於朱子遺書研思最乆因取李方子朱子年譜婺源洪氏續本互相參考根據語錄文集訂補舛漏勒成是編楊方晃孔子年譜謹按是書中三卷為年譜以天地人分紀之其前一卷及末一卷於史記世家歴聘紀年闕里舊志諸書頗有糾正徐沁謝臯羽年譜謹按是編搜採謝翺遺事為之張夏楊文靖年譜譜按張夏以楊時年譜詳畧失宜乃參稽史册語錄文集訂為此書黄中别本朱子年譜謹按是編冠以畫像世系題名錄别錄附以慶元黨籍吕祖泰書及歴代褒典李紱陸象山年譜謹按李紱取舊本重加補輯大㫖申王守仁朱子晚年定論之説左宰左忠毅年譜謹按左光斗事蹟具載明史本傳左宰復羅散失旁及文集所載補成此書較為詳備顧炎武顧氏譜系考謹按是書於顧氏世系考據最詳張愉曾十六國年表謹按是書以崔鴻所錄十六國事仿史記十二諸侯年表之例年經國緯條理分明便於尋覽孔尚質十六國年表謹按是編本崔鴻十六國春秋列傳改為編年亦仿史記年表之例曹溶金石表謹按是書雜列所蓄碑帖之目仿周譜旁行斜上之式以表為名褚峻金石圖謹按褚峻先刻此書上卷名金石經眼錄尚未載後漢永和二年燉煌太守裴岑紀功碑後與牛運震重編是圖其下卷則自吴天發神䜟碑迄唐顔真卿家廟碑凡六十圖毎碑繪其形製而具説其上天文胡亶中星譜謹按胡亶精天官家言是編所訂經星凡四十有五又於二十八舍之外益以大角等十七星議論皆簡明詳切邵昻霄萬青樓圖編謹按是書専論天文算數之術援引漢晉以來天官家言而各以己見附之余熈八線測表圖説謹按是編欽遵御製數理精藴由勾股和較割圜八線六宗三要諸法括為圖説以便初學研究地理闗中勝蹟圖志謹按是書陜西巡撫臣畢沅所進以守土之臣行部川原詢求舊蹟訂訛釐舛勒成是編南懐仁坤輿圖説謹按是書上卷自坤輿至人物分十五條皆言地之所生下卷載海外諸國道里山川民風物産分為五大州而終以西洋七竒圖説僧實行雁山圖志謹按僧實行居雁山能仁寺因搜羅名勝編次成書孫光􅀢畫筴圖謹按是書約取諸家之論氣脈者而附以己説政典劉應棠梭山農譜謹按是書分耕耘穫三卷詳其器與其事毎條綴以贊詞朱栗夷政譜謹按是編摘錄杜佑通典馬端臨文獻通考及邱濬大學衍義補諸書以類排纂凡十二門學術毛竒齡太極圖説遺議謹按周子太極圖説本易有太極一語特以無極二字啟朱陸之争毛竒齡又以其圖與參同契合併引唐明皇御製上方大洞真元妙經序無極二字為證因及於篇中隂陽動靜互根等語謂皆非儒書所有亦足以資參考蕭企昭性理譜謹按是書在於伸程朱而闢陸王大端醇正不失儒者之言王嗣槐太極圖説謹按是書論聖人言易有太極不應於太極之上復加無極二字疑此圖授自陳摶非周濓溪作亦力伸陸九淵之説也陳兆成太極圖説註解謹按是書發明朱子太極圖説註多講隂陽五行之説舒俊鯤洪範圖説謹按是書分元㑹運世四巻各為之圖附以己論秦錫淳演極圖説謹按是書推演周子太極之説亦各為圖論發明隂陽變合之理黄采性圖謹按是書立為六圖以發明心性之㫖大抵以孟子四端為説冉敬祖天理主敬圖謹按圖上標天理二字中列存養省察講學力行四項下書一敬字盖為姚江之學言超悟者而發李紱陸子學譜謹按是書専考陸氏學派之端委陸圻新婦譜謹按是書皆詳論為婦承順之道凡五十九條閔忠人道譜謹按是書仿劉宗周人譜之意以孝弟忠信禮義㢘耻為人之要分為八集各為標目雜採史事而各引先儒之説以發明之趙執信聲調譜謹按趙執信發唐人諸集排比鈎稽盡得聲調之法著為此書賴以邠填詞圖譜謹按是書踵張綖詩餘圖譜而作亦取古詞為譜而以黑白圏記其平仄為圖藝事孫承澤研山齋圖繪集覧謹按孫承澤深於賞鍳其書於古來畫家先叙本末後述所見真蹟附以䟦語足資考證鄒一桂小山畫譜謹按是編皆論畫花卉法多心得之語程雄松風閣琴譜謹按是編輯諸家遺譜而參以己意指法亦較他譜倍增物類胡世安異魚圖贊補謹按胡世安以楊慎異魚圖贊多所闕漏因摭其遺脱作為此編胡世安異魚圖贊箋謹按楊慎異魚圖贊間有自注僅標所據書名未暇備引其説世安既為之補又博採傳記以為之箋陳鼎竹譜謹按是編記竹之異者凡六十條樸靜子茶花譜謹按是編上卷為花品凡四十三種中卷為咏花之作下卷則種植之法汪憲苔譜謹按是編雜錄苔之故實詞句凡六卷陳邦彦烏衣香牒謹按是編皆採摭燕事凡分八門陳邦彦春駒小譜謹按是編皆採摭蟻事分為五門蒐羅甚廣可供談助皇朝通志卷一百十四
