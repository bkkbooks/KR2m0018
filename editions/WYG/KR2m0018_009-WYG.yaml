  text: 欽定四庫全書皇朝通志卷九
  hash: sha256:b08fe090967aa526dca5a3b1272c6a86145ef3388675eeb8484fcf41f1f97e3a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_009-1a, image: WYG0644/WYG0644-0099a.png}
body:
  text: 氏族畧九漢希姓臣等謹按漢人著姓源流具見鄭志惟希姓頗多遺漏五朝氏族已將可攷者補入今四方希姓難以枚舉惟就國朝題名碑及各直省選舉志職官志暨昭忠祠檔冊等書所有仍按四聲續載以備稽覽其人名位不以格拘惟因人以存姓至希姓之無冊可據者槩不列入焉平聲公氏公直任昌樂縣教諭公守垣任把總祀昭忠祠工氏工長年康熙庚戌進士同氏同化麟順治甲午舉人仝氏仝宗魁乾隆辛未進士崇氏崇士錦乾隆庚辰進士蒙氏蒙國相康熙癸夘舉人䝉浚乾隆辛未進士隆氏隆于禮任永春州吏目農氏農賡雍正壬子舉人雍氏雍元聰任太倉州學正容氏容而舒康熙甲子舉人支氏支邑康熙丁丑進士資氏資家禮任宜興縣巡檢司氏司世教順治己亥進士儀氏儀于庭康熙戊戌進士慈氏慈國璋乾隆戊戌進士峗氏峗開𤼵乾隆庚辰舉人隨氏隨人龍任鄒平縣教諭怡氏怡心海雍正丙午武舉人祈氏祈聖年任永寧州學正衣氏衣璟如順治己丑進士渠氏渠源博任撫寧縣訓導璩氏璩廷佑康熙辛丑進士俱氏俱日吉康熙己亥武舉人辜氏辜文麟康熙庚辰進士呼氏呼華國乾隆己未進士扶氏扶道宏雍正癸丑進士湖氏湖騰蛟任温州府教授犀氏犀大魁任縣丞祀昭忠祠崖氏崖葑任新寧州訓導才氏才瑞任邯鄲縣教諭開氏開仕任連城縣巡檢催氏催堯龍任百總邰氏邰祈任平南縣知縣銀氏銀文昭乾隆庚辰進士騫氏騫穏順治甲午武舉人旃氏旃兆鵬任兩淮鹽大使招氏招昌韶仕廣東陽江縣教諭鐃氏鐃崇秩任夀寜縣知縣多氏多象謙順治丙戌進士庹氏庹正國乾隆戊午副榜咼氏咼正儀順治戊戌進士那氏那甲任把總祀昭忠祠萇氏萇孕秀順治乙未進士昌氏昌天錦康熙乙未進士昌新運任守備祀昭忠祠昻氏昻紹善康熙丁未進士剛氏剛志徳正白旗漢軍仕庫大使衡氏衡虞衡順治己亥進士承氏承祖烈康熙甲午舉人卿氏卿悦康熙戊戌進士刑氏刑雲龍任藁城縣訓導經氏經騰鳯順治丁酉舉人騰氏騰雲輝任千總祀昭忠祠猶氏猶法賢任鎮逺縣教諭裒氏裒嘉言任廣東香山縣縣丞緱氏緱山鶴乾隆甲戌進士尋氏尋紹舞雍正癸丑進士諶氏諶紹洪康熙甲辰進士覃氏覃石長懐集人擊虎救母賔氏覃維楚任鄖西縣巡檢粘氏粘克昇乾隆戊戌進士憨氏憨意誠任新安縣教諭咸氏咸爾澤任博山縣訓導上聲拱氏拱翊勛乾隆丁丑進士仕氏仕秉哲乾隆辛未進士以氏以肚行任左州學正佀氏佀鸞舉順治己亥進士巨氏巨文彬任河南確山縣教諭仵氏仵魁乾隆壬辰進士俎氏俎如􅈍順治辛丑進士補氏補艾任西寜副將邸氏邸宗武順治丙戌進士買氏買國良任㕘將祀昭忠祠改氏改謙六康熙戊午武舉人每氏毎可薦順治乙酉舉人簡氏簡逄善任守備祀昭忠祠茒氏茒薦罄康熙己未進士保氏保兆炳乾隆癸未進士火氏火繼宗任江蘇呉縣縣丞乜氏乜承聖任奉天府治中噶氏噶羣任把總祀昭忠祠冶氏冶大雄任貴州提督哈氏哈元生任貴州提督賞氏賞我侯任崇信縣訓導幸氏幸洪詔乾隆壬戌進士靖氏靖道謨康熙丙戌進士受氏受有量鑲藍旗漢軍任七品官昝氏昝茹類康熙壬辰進士閃氏閃煜龍任藍翎侍衛橄氏橄夢元任沁源縣訓導去聲用氏用世榜任典史祀昭忠祠類氏類象升任山東鄆城縣訓導侍氏侍朝乾隆庚辰進士利氏利緯任崇義縣典史荔氏荔濬任淳化縣訓導秘氏秘丕笈康熙癸丑進士貴氏貴逄甲乾隆壬辰進士蔚氏蔚柱任河陽知縣蔚之煥任經厯祀昭忠祠閉氏閉啟運任息縣教諭拜氏拜恩哈任貴州副將賽氏賽枝大任恩安知縣賽清柱任把總祀昭忠祠佴氏佴杰任直𨽻知縣晉氏晉淑載順治丙戌進士晉見龍任逰擊祀昭忠祠陣氏陣大輦任臺灣道運氏運萬良任貴州副將寸氏寸珩任白鹽井訓導宦氏宦儒章乾隆壬申進士禪氏禪國榮任蕭縣主簿線氏線國安任廣西提督肖氏肖雅竒鑲黄旗漢軍任三等䕶衛較氏較無恭任舞陽縣教論較孝乾隆丁巳進士兆氏兆海桃任髙雷㢘道庫大使化氏化嘉誥任守備祀昭忠祠厙氏厙諶任鐡嶺縣訓導望氏望君録雍正癸夘進士壯氏壯純康熙辛丑進士正氏正振其任山西興縣教諭定氏定世勲雍正己酉武舉人勝氏勝國祥任遊擊祀昭忠祠但氏但開元任石首縣教諭淡氏淡如水任䝉城縣知縣淦氏淦良繪乾隆壬戌進士入聲竹氏竹綠猗順治乙未進士禄氏禄天錫康熙辛酉武舉人速氏速秉植任平樂縣知縣續氏續五美任醴泉縣典史竺氏竺華邦任滄州吏目沃氏沃洲乾隆丁丑進士粟氏粟千鍾康熙乙未進士出氏出科聯乾隆己未進士栗氏栗芳林康熙癸丑進士乞氏直隸南宫有乞姓闕氏闕文乾隆丁巳進士脱氏脱海龍鎮原人為賊所殺妻趙氏投崖死忽氏怱轉泰康熙辛酉武舉人頡氏頡際元任監利縣巡檢雀氏雀雲卿雍正間恩貢任知府赫氏赫皎任獲嘉縣教諭職氏職金丹仕新野縣教諭植氏植廷紀康熙庚子舉人國氏國涵任夀光縣訓導直氏首民者架聘妻直額康熙間以烈女旌黒氏黑天池康熙己丑進士弋氏弋照乾隆丁巳進士勒氏勒之道康熙壬子舉人合氏合揆雍正丁未進士答氏答思表順治丙戌進士塔氏塔新䇿任貴州總兵郟氏郟錦乾隆乙未進士皇朝通志卷九
