front:
  text: 欽定四庫全書皇朝通志卷十五
  hash: sha256:172a881595cb34c25fb0e97c1fdeeb49e5fbbe8320735a10608ade2f854af758
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_015-1a, image: WYG0644/WYG0644-0142c.png}
body:
  text: 七音畧二天竺字母説象教之興原於天竺即厄大藏一十二部原未嘗立定法門以何語言文字設為教品但就竺土大衆同曉之語言聲韻為之唱説其間義以音宣音由呼出音呼相繫韻切從生天竺字母有自来矣中土士庶不能盡識梵書沙門神珙製為華音等韻字母以為誦持標式特其字多空列音無的據縱使呼調得法終亦華梵殊歸夫天竺字母經咒諸字之淵源也西畨即唐字母經咒諸字之脈絡也考其法五十字母之内有十六音韻字三十四翻切字唐貞觀初吐畨相阿努嘗親受天竺字法悉得其奥於是依其本音譯以唐之字以為西域傳布經咒之用至􅄼哷唐羅雜斡復從阿努所譯五十字内考訂天竺原規為之唱演夾漈鄭氏所謂雖重百譯之逺一字不通之地而音義可傳者也今以天竺等韻字母列於簡端即于行下注以唐之字次列國書對音次列漢文對音由此而進之此五十字實為翻譯經咒之源也天竺字母譜音韻十六字天竺字母譜後説文殊問經金剛頂經師利問經三部内俱有此天竺字母五十字而所用漢字各有不同於三經内擇其與本字音韻相合者取用之其音韻不合者於欽定國書十二字頭漢字内取用天竺字皆清平聲其無清平字者用濁平字無平聲字者用仄聲字其本字呼聲應長者將本字疊書而下一字微小合為一字其本字下帯别音者即於本字下將别音字細書合為一字其漢字内有音無字者将所切二字並書合為一字其一字有二音者将分數多之字正書分數少之字細書合為一字照國書合聲切法急讀之即成一音俱将反切及喉齒唇舌等音註於其下其字音相近而呼法不同者如嘠噶匝雜查楂答達巴㧞十五字皆各三字相近而嘠匝查答巴五字𦂳讀噶雜楂達㧞五字緩讀帯哈字者帯喉音讀分别注明由此字母所生之字俱照此例庶梵字本韻皆了然矣臣等謹按欽定同文韻統著天竺字母譜以天竺字唐古特字與國書漢文比類成章實為華梵共證之大源也因文字之區分得義理之妙合而總本于國書以為之凖國書十二字頭以阿額伊鄂烏諤六字展轉相生成第一部字頭又以第一部字頭配字合聲成後十一部字頭雖無字母之名而六字為第一部字頭之母第一部字頭為十一部字頭之母一皆本于天地之元音易簡宏通周流不滯由是而推之西畨天竺皆可殊途而同歸也此譜系以前後二説互相發明凖國書以定字母之權衡標梵字而注以漢文之翻切旁通無閡義類得宗非特括音韻之大全益足以昭聲教之無外也已天竺音韻翻切配合字譜説譯義之用通乎經文譯音之用宜於咒語阿努所譯天竺字母字雖唐之字而音則實悉天竺之音然則欲得天竺字之本音舍唐之字其奚從歟今将唐所譯天竺音韻翻切配合所生諸字依其配合之法用中土之字對譯成譜其字母五十字内阿等十六字梵言為阿禮華言為音韻字嘠喀等三十四字梵言為嘠禮華言為翻切字以翻切三十四字配合音韻十六字除配阿字仍得本音外毎字各成十五字共成五百一十字又以翻切三十四字除末一字不用外餘三十三字各繫以鴉喇拉斡四字配合成一百三十二字又以翻切三十四字疊書成三十四字又以翻切三十四字除末九字不用外餘二十五字為五類将毎類末一字加於前四字之上疊書成二十字又於翻切五類二十五字之上各加拉沙卡薩四字疊書成一百字又於翻切三十四字之上各加喇字疊書成三十四字又舉鍋字為例加巴魯達一記號呼長三分者則於字旁加一圏成一字又加巴魯達三記號呼長九分者則於字旁加三圏成一字又於嘠喀二字上各加扎嘛嚕記號應帯阿字發聲者則於字上各加阿字疊書成二字又於巴葩二字上各加烏巴達嘛記號此記號有反正二寫法其用並同應帯阿字發聲者亦於字上加阿字疊書成二字又舉數字疊書為例成二十六字又以音韻字内阿伊烏厄鄂五字及翻切三十四字並三十四字配合伊烏厄鄂四字所生之一百三十六字共一百七十五字毎字配合以納字以哈蘭答記號聫之即成焉因字收聲又毎字配合以迎阿字以哈蘭答記號聫之即成陽英字收聲各成一百七十五字以上共成一千二百一十二字皆以唐之字按照天竺字例排寫而成今各用漢字音註分列成譜其中惟一字三譜重見並存以備體例天竺音韻翻切配合十二譜第一譜翻切三十四字配合音韻十六字除配阿字仍得本音外每字各成十五字共成五百一十字第二譜翻切三十四字除末一字不用外餘三十三字各繫以鴉喇拉斡四字成一百三十二字第三譜翻切三十四字疊書成三十四字第四譜翻切三十四字除末九字不用外餘二十五字為五類毎類末一字加於前四字之上成二十字第五譜五類二十五字之上各加拉沙卡薩四字成一百字第六譜翻切三十四字之上各加喇字成三十四字第七譜舉鍋字為例加巴魯達記號成二字第八譜嘠喀二字上加扎嘛嚕記號成二字第九譜巴葩二字上加烏巴達嘛記號成二字第十譜舉數字疊書為例成二十六字第十一譜音韻字内阿伊烏厄鄂五字及翻切三十四字並三十四字配合伊烏厄鄂四字所生之一百三十六字共一百七十五字毎字配合以納字以哈蘭答記號聫之即成焉因字收聲之一百七十五字焉字收聲者為陽如安干之類因字收聲者為陰如因金之類第十二譜音韻字内阿伊烏厄鄂五字及翻切三十四字並三十四字配合伊烏厄鄂四字所生之一百三十六字共一百七十五字毎字配合以字以哈蘭答記號聫之即成字收聲之一百七十五字陽字收聲者為陽如昂岡之類英字收聲者為陰如英京之類天竺音韻翻切配合字譜後説天竺字母音韻十六字惟阿伊烏唎利厄鄂七字為單字其七字之下又細書一字者即七字之長聲昂字即阿字合英字收聲即阿字帯斯字收聲故十六字之中止七字為單字然唎利二字以翻切字配之仍係各字之下帯本字音不能另成一字故七字之内又止阿伊烏厄鄂五字為單字皆收聲於本字之喉音與國書第一字頭之阿厄伊鄂烏五字相對其轉韻所成之字皆從此五字而生而伊烏厄鄂四字又皆根於阿字故阿字為元聲翻切三十四字皆收聲於阿字故以翻切三十四字配阿字仍得本字不能另成一音此阿字所以成始而成終也其第一譜配合所生之字毎字各成十五字亦惟配伊烏厄鄂四字所生之字各成單字其配昂字所生者即本字合昂字安字或帯嘛字收聲而昂字安字皆同生於阿字故亦能成單字其配字所生者即本字帯斯字收聲其餘皆成雙字即係本字之下各帯一音要皆子不離母故音韻十六字翻切三十四字皆朱書配合所生之字皆墨書其第二譜至第十譜皆以翻切本字或繫字於下或加字於上或疊書二字或疊書數字其繫字於下者即收聲帯别音其加字於上者即發聲帯别音其二字疊書者即一字帯二音其數字疊書者即一字帯數音皆係合書成字非由字母配合而生故皆墨書惟第二譜内翻切字下繫以斡字者亦成單字葢以翻切三十四字皆收聲於阿字而斡字音獨輕清與阿字尤近故能另成一字然其譜内皆繫字所成不列子母故亦用墨書其第十一譜第十六譜皆以音韻字内阿伊烏厄鄂五字及翻切三十四字並第一譜内翻切三十四字配伊烏厄鄂四字所生之一百三十六字共一百七十五字毎字配以納字即成字收聲與安恩因字頭之音相對毎字配以字即成字收聲與昂鞥英字頭之音相對其原有之一百七十五字皆朱書配合所成之各一百七十五字皆墨書其中有重見之字則以字母既同而配合轉韻又同故仍用本字以偹體例此外毎單字之下各繫以喇字則成字頭之音毎字繫以噶字則成字頭之音毎字繫以薩字則成字頭之音毎字繫以達字則成字頭之音每字繫以㧞字則成字頭之音毎字繫以拉字則成字頭之音毎字繫以嘛字則成字頭之音惟無字收聲􅀈字收聲之字如用字收聲之字則於翻切字下加鴉記號即作字收聲讀與埃額字頭之音相對如用􅅕字收聲之字則於長呼字上加納囉住記號於繫斡記號字上加吉固徴卜記號並加雙納囉記號之字隨宜分配即作􅅕字收聲讀與敖歐優字頭之音相對以上諸音皆係前譜字下各繫一字即成一音故不另列譜臣等謹按欽定同文韻統既著為天竺字母譜復将唐古特所譯天竺音韻翻切配合所生諸字依其配合之法用漢字對譯成諸共一千二百一十二字皆以唐古特字按照天竺字例排寫而成以漢字為之注系以前後兩説體備韻全皆與國書字頭音韻相符由是展轉環生妙用不竭既以得天竺之全音並以見唐古特字之大要矣皇朝通志卷十五
