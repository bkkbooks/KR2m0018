body:
  text: 欽定四庫全書皇朝通志卷四十六禮畧賔禮臣等謹按鄭樵通志賔禮一門惟列三恪二王後一條序山陽陳留零陵介國酅公之事規制庳陋不足垂為典禮我朝列聖加禮勝代至隆極渥超軼前古雍正元年世宗憲皇帝諭朕近於聖祖仁皇帝所遺書笥中檢得未經頒發諭㫖以明太祖崛起布衣統一方夏經文緯武為漢唐宋諸君之所未及其後嗣亦未有如前代荒淫暴虐亡國之跡欲大廓成例訪其支𣲖一人量授官爵以奉春秋陳薦仍世襲之朕伏讀之下仰見我聖祖仁皇帝天覆海涵深仁大度超軼萬古逺邁百王朕思史紀東樓詩歌白馬商周以來無不推恩前代後世類多疑忌以致歴代之君宗祀殄絶朕仰體聖祖如天之心逺法隆古盛徳之事謹將聖祖所遺諭㫖頒發訪求明太祖支𣲖子姓一人量授爵秩俾之承襲以奉春秋祭饗大學士即㑹同廷臣詳明妥議以副聖祖仁皇帝寛仁矜恤之至意旋遵奉議上明代後裔有鑲白旗見任直隸正定府知府朱之璉乃明太祖第十三子代簡王嫡𣲖奉㫖授為一等侯爵世襲授爵之後遣往江寧祭明太祖陵一次祭畢回京往昌平州祭明十三陵一次嗣後每年春秋二次致祭至於明陵所在列聖以來疊加修整防䕶乾隆五十年皇上親幸長陵不惜百萬帑金降㫖諸陵皆如制修葺優禮前代曠典特頒誠無取於賔恪之虚文為也恭讀御製新樂府二王後詩云三恪二王古有云受禪征伐説徒紛魏晉以降更以假不修實徳修空文元之瀛國明崇禮雖加封爵未聞延至奕世享隆恩天命天聰肇東土順治奄有中外建極尊然實取之流冦並非取之勝國者豈於明之後裔有所慙徳而當待以賔康熙有成命雍正舉以遵遂求朱氏之裔賜以通侯俾世守其祀而弗湮則我祖宗興滅繼絶之意超往代詎如李唐周旋周武隋文之子孫煌煌聖謨昭示本朝成法垂訓萬古兹輯通志鄭氏三恪二王後一條應從刪去而明著大義於簡端至賔禮之大者藩服朝貢之制鄭志皆闕畧未載謹考周禮大行人掌賔客之禮儀九州以外謂之蕃國各以其貴寶為贄我國家聲教暨訖四荒來賔徼外山海諸國典之禮部百餘年來敕封燕賚諸典儀文詳洽爰遵大清通禮之例輯為賔禮至漠南内扎薩克暨喀爾喀扎薩克青海西藏諸部暨西域回部外蕃諸朝貢儀節載於㑹典理藩院編謹詮次大畧著於篇中以彰聖朝賔服無外之盛軌而百官士民相見之儀附載其畧於後朝貢凡四夷屬國按期修職貢遣其陪臣齎表文方物來朝京師貢使將入境朝鮮以禮部通官二人迎於盛京鳯凰城安南琉球緬甸暹羅荷蘭蘇禄南掌諸國貢道所經之省督撫遣佐貳雜職官一人迎於邊界西洋以内務府司官及西洋人供職欽天監者各一人迎於廣東皆給以郵符經過地方有司供其次舍廪餼車舟夫馬沿途營汛遞遣官軍防䕶以達於京畿禮部豫行工部修飾館舍備器用薪炭户部給粟米芻豆光禄寺給牲魚酒漿蔬菓之屬既至提督㑹同四譯館鴻臚寺少卿飭屬延接入館以時稽其人衆均其飲食貢使就館翼日檢其方物表文貢使暨從官各服本國朝服以竢禮部儀制司官設表案於堂上正中黎明館卿朝服率貢使詣部由左角門入恭竢階下之左正使奉表在前副使次之從官在後鴻臚寺贊跪貢使以下皆跪贊接表正使舉表館卿恭接以授禮部侍郎侍郎受表陳於案正中復位贊叩興正使以下行三跪九叩禮興序班引退館卿率以出儀制司送表内閣竢命下禮部以方物分納所司貢使上表訖恭遇大朝常期皇帝御太和殿百官行禮畢序班引貢使暨從官詣丹墀西班末賜坐賜茶如儀若不遇朝期禮部諏日奏請召見館卿豫戒貢使及通事官習肄禮儀至日率貢使服其國公服通事補服詣宫門外祇竢皇帝御便殿領侍衛内大臣内大臣侍衛左右侍立如常儀禮部尚書一人蟒袍補服引貢使入通事隨入至丹墀西行三跪九叩禮畢引由西階升至殿門外跪皇帝降㫖慰問禮部尚書承傳通事轉諭貢使貢使對詞通事譯言禮部尚書代奏禮畢興引自西階降出引退如待以優禮是日皇帝御便殿侍衛如前議政大臣暨八旗大臣咸蟒袍補服入殿按翼侍立禮部尚書引貢使至丹墀西行三跪九叩禮興引由西階升入殿右門立右翼大臣之末通事隨入稍後立皇帝有㫖賜坐領侍衛内大臣内大臣議政大臣八旗都統副都統禮部尚書就立位一叩序坐貢使跪叩坐乃賜茶尚茶進皇帝茶衆跪叩侍衛徧授大臣及貢使茶咸跪受一叩坐飲畢跪叩如初皇帝降㫖慰問貢使跪聆答奏皆禮部尚書承傳通事譯言如前儀禮畢禮部尚書引貢使出至朝房承㫖賜貢使尚方飲食訖館卿率以退翼日黎明領赴午門外謝恩鴻臚寺傳贊貢使行三跪九叩禮如儀退朝貢禮畢禮部疏請頒賜國王並燕賚使臣及其從官從人既得㫖移諸司供備翼日所司陳賜物於午門外道左皮幣布帛白金陳於案馬陳於庭鞍轡具唯朝鮮貢使賜馬館卿朝服率貢使暨從官各服其國朝服由東長安門天安門端門至西朝房前東面序立祗候禮部侍郎以下衆官序立鳴贊贊齊班序班引貢使至西丹墀門以次序立北面東上贊行三跪九叩禮畢主客司官奉頒給國王賜物前授貢使貢使跪受轉授從人乃以次頒貢使及從官從人賜物主客司捧授各跪受訖贊行三跪九叩禮興引退館卿率貢使及從官從人出賜宴於禮部如儀畢皆退事竣貢使將回國光禄寺備牲酒菓蔬禮部侍郎一人詣館舍筵燕如儀朝鮮南掌仍以迎接官伴送出境安南琉球緬甸暹羅荷蘭蘇禄禮部奏遣司官一人伴送西洋以原迎官二人給郵符沿途供館舍舟車飲食官軍防䕶如初來禮至貢道所經省㑹賜燕司道一人主之儀與禮部燕同督撫大吏别遣官送出境自京伴送官以事竣復命於朝凡貢道朝鮮由鳯凰城琉球由福建荷蘭由廣東後改由福建緬甸由雲南安南由廣西太平府西洋由廣東暹羅由廣東蘇禄由福建南掌由雲南凡貢期朝鮮每年進貢一次並聖節元旦冬至三大節為四貢同進琉球二年一次荷蘭八年一次後改為五年一次安南三年一次後改為六年一次暹羅三年一次南掌五年一次後改為十年一次蘇禄五年一次凡貢物各將其國之土物非土産者勿進朝鮮安南琉球緬甸蘇禄南掌皆貢有常物西洋暹羅無常貢惟其所獻或輸内務府或入武備院或納鑾儀衛或留於盛京及邊省各付所司備用有因事慶賀及謝恩加貢者廩餼賚予如常儀其方物則留充正貢之數凡從人朝鮮貢使從書狀官一人大通官三人䕶貢二十四人有賞從役三十人無賞從役無常數琉球西洋暹羅蘇禄貢舟無過三每舟人無過百赴京無過二十安南緬甸南掌入貢人無過百赴京無過二十其不赴京者留於邊境邊吏廪餼之竢使回至邊率之歸國敕封外國凡朝貢之國世子嗣位權攝國事遣其陪臣請命於朝禮部疏聞得㫖報可工部製節内閣撰敇均送禮部禮部奏遣正副使各一人持節齎敕往封朝鮮封使以内大臣禮部滿侍郎内閣滿學士侍衛充服色儀從各從其品安南琉球以翰林院侍讀侍講編修檢討六科給事中禮部郎中員外郎主事内閣中書充特賜一品麒麟服儀從皆視一品啟行之日工部給龍旗御仗牌繖兵部給乘傳防䕶官軍皆候於禮部大門内禮部儀制司官設案於堂上正中陳節於左陳敕於右尚書侍郎二人於案左右立儀制司官二人隨其後均朝服封使朝服詣部至堂中跪儀制司官一人奉節一人奉敕各授尚書侍郎以授正副使皆恭接以興出儀門外官軍接奉加節衣負敕書乘馬行旗仗前導使者易征衣乘傳偕行封使入所封國境其國邊吏供備館傳夫馬所經之地文武官出郊跪接如迎詔書之儀將及國嗣封國王遣其陪臣出郊迎接敕書勞使者飾館舍供帳於國門之外備龍亭香亭旗仗鼓樂祇候於館列屏於王殿上設案於正中前設香案均南向設國王受封位於香案南拜位於受封位之南設衆官拜位於庭内東西皆北面贊禮二人位國王拜位之北引禮二人位贊禮之南引班四人位衆官拜位之北皆東西面樂陳於門内儀仗陳於庭中皆左右分列使者既及國迎接官迎至館恭設節敕於龍亭内馳報國王王率其國陪臣朝服郊迎迎接官以龍亭行香亭旗仗鼓樂前導使者乘馬從國王以下咸跪候過興隨入國門至府龍亭入中門升階陳於正中使者及階下馬從升執事者脱節衣奉節授正使前行奉敕授副使隨行入殿使者陳節敕於中案皆退立案東宣讀官列於使者之後引禮引國王就拜位北面引班引衆官均就拜位北面立贊禮贊跪國王率陪臣皆跪贊叩興國王以下行三跪九叩禮興國王進至受封位前贊禮贊跪國王跪副使進奉敕書付宣讀官西面展讀訖以敕書授國王國王祗受轉授從官跪接以興副使復位國王三叩興退至拜位前復行三跪九叩禮興率其陪臣出竢門外正使奉節詣龍亭執事者加節衣陳於亭舁出使者隨出國王以下跪送使者以節詣館國王乃易常服適館勞使者揖讓行禮畢退饗燕致饔餼如儀及歸率其陪臣跪送節於國門外如初迎禮使者回朝以事竣復命還節並賜服於所司使者既還朝王乃修表文具方物遣其陪臣詣闕謝恩廪餼燕賚均如常朝貢之儀若外夷歸誠初奉朝命者禮部奏請命正副使持節齎敕印往封儀與前同若荒逺阻絶之區以敕書授來使齎回儀制司官設案於午門外甬道上正中陳敇尚書一人立案左儀制司官隨其後鴻臚寺鳴贊二人立甬道左右均朝服館卿率來使朝服入至西丹墀内祗竢鳴贊贊授敕序班詣案前北面贊跪來使跪儀制司官一人奉敕授尚書以授來使來使恭接授從官興退詣丹墀之西贊行三跪九叩禮畢乃恭齎回國以授其國王遣使詣闕謝恩如儀科爾沁等扎薩克朝貢國家肇基東土威徳逺播漠南蒙古諸部落或誼屬戚畹或著有勲績或率先歸附咸奉其土地人民比於内臣設官分職與内八旗無異每嵗分班朝覲修貢唯謹秋月扈從行圍各依班次朝見燕饗賜予舍館饔餼之禮成典維昭咸𨽻於理藩院王㑹司詳見大清㑹典其貢道科爾沁扎賴特杜爾伯特郭爾羅斯由山海闗土黙特喀喇沁敖漢奈曼扎魯特阿嚕科爾沁翁牛特喀爾喀左翼由喜峯口烏朱穆沁巴林阿霸垓蒿薺忒阿霸哈納爾克什克騰由獨石口四子部落蘇尼特毛明安喀爾喀右翼由張家口呉喇忒歸化城土黙特鄂爾多斯由殺虎口來朝班次分為三班周而復始嵗以十二月十有五日後二十五日前咸集王以下均行三跪九叩禮奉制書亦如之親王郡王貝勒貝子公在宗室親王郡王貝勒貝子公之下一二等台吉在内大臣之下其次為子又其次為三等台吉又其次為都統又其次為四等台吉又其次為副都統又其次為㕘領佐領其男以下雲騎尉以上各依品級序班凡貢物每旗進羊一羫乳酒一埕以嵗除日新正十四日十五日各賜燕一次餘日五旗王府各設燕一次自王貝勒以下至長史䕶衛等官咸與焉凡賞賚廩給牧芻路費均有常制喀爾喀青海西藏朝貢國初䝉古北部喀爾喀三汗同時納貢厥後朔漠蕩平庇我宇下與漠南諸部落等承平以來懷柔益逺北逾瀚海西絶羌荒青海厄魯特西藏準噶爾之地咸入版圖朝貢皆有常制其貢道喀爾喀四部厄魯特土爾扈特由張家口獨石口喜峯口青海由西寧西藏由四川之打箭鑪喀爾喀等朝覲分為四班青海亦分為四班貢期各如其朝覲之班西藏則間嵗一貢附達賴喇嘛以進貢物喀爾喀厄魯特以駝馬湯羊土爾扈特青海以藏香氆氌西藏有佛像金經銀塔五色帕八吉祥之屬朝覲燕饗賞賚餼廪牧芻與漠南内扎薩克諸部落同西域外藩朝貢我皇上聖武丕昭既平定準噶爾凡天山以南回部素為準夷所羈屬者如解倒懸歸仁恐後厥後逆回負恩搆亂天戈所指臣服彌逺版圖所隸拓地二萬餘里今自嘉峪闗而外舊部若哈密若闢展吐魯畨新疆若哈喇沙爾若庫車若沙雅爾若賽喇木若拜達克若阿克蘇若烏什若喀什噶爾若葉爾羌若和闐碁布星羅同屬内地至土爾扈特逺隔俄羅斯境感慕皇仁挈其部屬三萬餘衆越數萬里之逺誠心歸順皇上撫綏安集俾恬居樂業等於内土齊民於是四衛拉特咸依化宇分班朝貢職有成規乃至伊犁以外葱嶺以西鱗集仰流而至者逺抵西海則有若哈薩克左右部布魯特東西部安集延瑪爾喀朗霍罕那木干塔什干巴達克山博羅爾愛烏罕竒齊玉斯諤爾根齊諸部落皆重譯輸誠遣使朝貢列為西域之外藩各以其輸欵來京之先後召見賞賚或賜宴於瀛臺或賜宴於熱河行宫俾得與觀燈火與觀大閲各授以敕書遣貢使齎奉回國其貢期或間年或三年無常期其貢物罽刀馬匹各以其國之所有賔服之盛逺訖汜濛猗歟盛已相見儀國初定王公以下内外職官士民相見之儀其目曰宗室外藩親王相見曰宗室外藩郡王相見曰宗室外藩貝勒相見曰宗室外藩貝子公相見曰京官敵體相見曰在京屬官見長官曰國學師弟子相見曰直省官敵體相見曰直省文官見長官曰直省武職見長官曰直省官見學政鹽政曰京府官屬相見曰直省文武官相見曰直省滿漢官相見曰直省學校師弟子相見曰賔友相見曰受業弟子見師長曰卑㓜見尊長辨等威慎禮度各有恒式其儀並見大清通禮皇朝通志卷四十六
