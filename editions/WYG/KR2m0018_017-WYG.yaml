body:
  text: 欽定四庫全書皇朝通志卷十七七音畧四康熙字典聖祖仁皇帝御製序曰古文篆隸隨世遞變至漢許氏始有説文然重義而畧於音故世謂漢儒識文字而不識子母江左之儒識四聲而不識七音七音之傳肇自西域以三十六字為母從為四聲横為七音而後天下之聲總於是焉嘗考管子之書所載五方之民其聲之清濁髙下各象其川原泉壤淺深廣狹而生故於五音必有所偏得則能全備七音者鮮矣此歴代相傳取音者所以不能較若畫一也又曰經傳至博音義繁賾據一人之見守一家之説未必能㑹通罔缺也爰命儒臣悉取舊籍次第排纂切音解義一本説文玉篇兼用廣韻集韻韻㑹正韻其餘字書一音一義之可採者靡有遺逸至諸書引證未備者則自經史百子以及漢晉唐宋元明以來詩人文士所述莫不旁羅博證使有依據然後古今形體之辨方言聲氣之殊部分班列開卷了然無一義之不詳一音之不備矣九音見溪羣疑牙音端透定泥舌頭音知徹澄孃舌上音幫滂並明重脣音非敷奉㣲輕唇音精清從心邪齒頭音照穿床審禪正齒音影曉喻匣喉音來日半舌半齒音十二攝迦結岡庚裓髙該傀根干鈎歌等韻切音果假二攝梗曽通三攝止蟹遇三攝山咸二攝深臻二攝江宕二攝効一攝流一攝臣等謹按天地之元音發於人聲人聲之象形寄於㸃畫前聖作書江从工河从可霜从相䨮从彗即韻之萌芽古人命物日者實月者缺水者準準古音之水切火者毁火古音虎偉切亦韻之寄寓自古韻失傳正字通率用音和而於字母淵源茫然未解以致幫滂莫辨曉匣不分貽誤後學為害匪淺我聖祖仁皇帝以字學並闗切要特命纂集字典一書所用翻切悉依唐韻廣韻集韻韻㑹正韻為主同則合見異則分載其或此數書中所無則參以玉篇類篇五音集韻等書又或韻書所無而經傳史漢老莊諸書音釋所有者亦行采入如字有兼數音則先詳正音次列轉音再次列以叶音或某字通及某字同者無不臚陳訓義辨析微芒集古今切韻之大成合天地中和之元氣後之言音切者莫能出乎範圍己音韻闡微世宗憲皇帝御製序曰聲音之道微矣天地有自然之聲人聲有自然之節古之聖人得其節之自然者而為之依永和聲至於八音諧而神人和胥是道也文字之作無不講求音韻顧南北異其風土古今殊其轉變喉舌唇齒清濁輕重之分辨在毫釐動多訛舛樊然淆混不可究極自西域梵僧定字母為三十六分五音以總天下之聲而翻切之學興儒者司馬光鄭樵皆宗之其法有音和類隔互用借聲類例不一後人苦其委曲繁重難以驟曉往往以類隔互用之切改從音和而終莫能得其原也我聖祖仁皇帝亶聰首出天地萬物之奥律厯象數之秘靡不心解神㑹洞徹本原以國書合聲之法出於自然足以盡括漢文翻切之要妙也又曰唐僧守温以牙舌脣齒喉定三十六字母括天下之音然尚有音和類隔互用借聲設例繁難得音非易聖祖仁皇帝欽定音韻闡微依國書合聲之法上一字取能生本音下一字取能收本韻二字合讀便得本音簡易精妙為從來翻切家所莫及十二字頭對音歌麻支微齊魚虞收本字喉音阿額伊一部對佳灰與支微齊同收聲衣字愛一部對蕭肴豪尤與魚虞同收聲烏字傲歐優一部對東冬江陽庚青蒸收鼻音昻鞥英一部對真文元寒刪先收舌齒音安恩音一部對侵覃鹽咸收唇音穆字收聲對屋沃覺藥陌錫職收鼻音克字收聲對質物月曷黠屑收聲舌齒特字收聲對緝合葉洽收脣音補字收聲對十二字頭之收聲於勒於斯於哷者其音為漢文所無則不對古今部分隨韻異音江韻音古與東冬近今與陽近殷韻音唐與真同用宋後與文同用古今部分隨母異音知徹澄古音與端透定相近今音與照穿床相近泥孃非敷古音異讀今音同讀南北部分隨母異音疑微喻南音各異北音相同合聲切音公舊古紅切今姑翁切巾舊居銀切今基因切牽舊苦堅切今欺煙切蕭舊蘇彫切今西腰切同母異韻翻切但換下一字音公姑翁切歸姑威切闗姑灣切光姑汪切巾基因切堅基煙切驕基腰切鳩基優切同韻異母翻切但換上一字音堅基煙切牽欺煙切天梯煙切邊卑煙切䖍竒延切纒池延切綿彌延切錢齊延切臣等謹按御製音韻闡微一書平上去各分六部而入分三部皆與國書十二字頭之部分相對韻中同音之字每音第一字注明其音將舊翻切列於前所擬合聲切列於後其有係以今用二字者因本母本呼於支微魚虞數韻中無字者則借仄聲或别部之字以代之但開齊合撮之類不使相淆遇本韻影喻二母無字者則借本韻旁近之字以代之於清母濁母之分不使或紊其取音比舊稍近也有再借鄰韻影喻二母中字以協其聲者則係以協用二字有雖借鄰韻并非影喻二母中字其聲為近而亦不甚協者則係以借用二字葢漢文有音無字者多又支微魚虞數韻并各韻影喻二母皆單音之字不能合聲欲得正音必婉轉以求其相近至於按韻分音在於字母三十六母内有一十三母重列者故縱分二十三行横分四等平上去入以聲相符唇喉齒舌以類相從凡經史韻書中有音有字者皆足以包之各省風土之殊古今音韻之變亦有以界之聖人之所以和順於道徳而理於義豈僅為漢文審音之樞要哉叶韻彚輯皇上御製叶韻彚輯序曰叶韻非古也而即古也有今韻而後有叶韻叶韻者以古韻而協之於今故曰非古然以今視之則用叶以合異以古視之則非叶而本同故曰即古又曰三代而上言律吕言諧聲言書名其於音韻當必審清濁别唇齒喉舌有一定之部分勒之簡䇿與律度量衡象魏之法同為當世所遵守而惜其世逺而不傳也好古之士欲忖而求之其道無由宋吳棫本易詩史漢諸書為韻補子朱子嘗取以釋毛詩楚辭明楊慎廣之為古音號稱淵博及證之羣籍其疎略不備者則已多矣因於幾暇指授儒臣博考經史諸子以及唐宋大家之文所用古韻舉而列之疏其所出次於今韻之後臨文索句就考焉可以恢見聞可以益思致諧聲不拘字義如詩以不知徳行叶何用不臧是用去聲敬韻之行作杭音與陽韻行列之行迥別四聲通用而律以今韻必變音以叶如喜起南風行露蔓草皆是彼此互叶如周易艮其限危薰心也艮其身止諸躬也或讀心為思容切以叶躬或讀躬為姑宏切以叶心毛詩其命匪諶鮮克有終或讀諶為市隆切以叶終或讀終為諸深切以叶諶一字兩叶如毛詩于嗟乎騶虞一讀虞為牛加切以叶葭豝一讀虞為五紅切以叶蓬豵臣等謹按欽定叶韻彚輯用吳棫韻補例専論叶音但廣韻集韻等書字數多於今韻逺甚如一東内有蟊窽衆梵等字江韻牕降等字集韻亦直列東韻内此等既係本韻則無待於通更不必列為轉叶是書悉以佩文詩韻為斷凡屬佩文詩韻所不收者總次於轉叶之列入聲緝合葉洽四韻本通必須轉讀始叶惟洽部并入業韻一部遂覺音韻聱牙有礙通轉按廣韻以二十六緝二十七合二十八盍二十九葉三十帖三十一洽三十二狎三十三業乏同用三十四乏為序集韻及禮部韻畧皆以二十九葉韻畧與帖業通三十帖三十一業三十二洽韻畧與狎乏通三十三狎三十四乏為序至韻㑹依平水韻併通用之韻乃以十四緝十五合十六葉十七洽為序而業與帖同併葉韻佩文詩韻亦依廣韻序次併業於洽是書本集韻韻畧及韻㑹通併次第将洽韻中業韻一部提入緝葉韻内以便轉通更覺界限截然其餘改正舊本小誤者如晨風之詩云未見君子憂心靡樂吳棫韻補櫟字叶藥韻注乃引作旣見君子云何不樂邵長蘅古今韻畧亦然韻補境字叶敬韻注引三國志楊戲季漢輔臣贊以魏文長為李正方端字叶陽韻注又以李正方為秦子敕之類有刪去舊本大誤者如漢郊祀歌云精建日月星辰度理隂陽五行周而復始本是四言四句兩用紙韻邵長蘅韻畧乃引作六言兩句云精建日月星辰度理隂陽五行而増注於真先叶韻内行字之下陳琳大暑賦云氣變志遷韻補讀遷為雌人切以叶真文韻而書遷作隸體字邵長蘅誤認作興遂改陳賦為氣變志興而増一興字作雌人切以叶真文韻甚至於巧字叶有韻注引司馬遷傳亦書作司馬興之類有似誤而疑有別本姑仍其舊者如仲長統詩請用從火與㳺心海左叶韻補乃作請用從大而以大字叶哿韻太元出險登邱莫之伐也與道不得也叶韻補乃作莫之代也而以代字叶職韻史記滑稽傳漆城蕩蕩楊慎轉注古音畧乃作漆城光光而以光字叶深韻劉向九歎捐林薄而菀死本與上文美夷為韻夷讀為雉轉注古音畧乃引作菀菀而以菀字叶下文赴淵隠山之類其餘轉叶之韻必引韻語或古書正文先儒音讀為證通叶之例彼此不能一律原本舊聞以為引證俾讀者於通韻自可類推於叶韻亦無嫌闕畧酌古準今昭然明備一洗從來通叶支離之説於數百年講古韻者誠為獨酌其中矣音韻述微皇上御製序曰國書以阿字為首梵經亦謂阿字能括天下之音其生生之序出於自然今以人之始生證之雖各國各地殊語至其孩啼音皆出於阿則阿字之為諸方聲韻之源綜其異而得其同從可知矣字母既源出西域則國書之阿字實㑹通梵華字母之樞紐以立義所以得天地之元聲不獨梵音藉國書而明即華音之字母亦因國書而愈明也又曰從來韻書主音字書主義二者不能兼賅而審音與分韻又岐而為兩夫輕重清濁音也平上去入韻也韻顯而易明音微而難察詩賦家所用惟韻可不必審音至詩餘詞曲則兼辨音而於平上去韻轉得通用此唐宋及今音韻之大畧也是書翻切悉遵闡微凡古今音韻之奥華梵㑹歸之故以國書為樞紐無不一以貫之而於古人韻書義訓未詳者則加推廣發明焉其訓釋古無今有者量加増訂期於字義明而字音悉協四聲準而等韻貫通皆即皇祖宣暢中聲嘉惠藝林之意纘述而引伸之元音阿烏椏切臣等謹按阿字古讀若娿而開口呼之即為本音其音在喉而清乃天地之中聲古來韻書未有拈出者國書字母以此為首與歌韻屋韻義並異考古音麻韻中字皆與魚虞相從如􅖗本作荼與虞韻之荼各自為音蒩柤並收虞韻䶥又收語韻等類自字母入中國始有麻韻一呼遂不能不增此一韻聖天子聲律身度於繩武之中寓考文之治真萬世音學之極也古音表臣等謹按古音表二卷國朝顧炎武撰音學五書之一也其書凡分十部以東冬鍾江為第一支脂之㣲齊佳皆灰咍為第二魚虞模侯為第三真諄臻文殷元魂痕寒桓刪山先仙為第四蕭宵肴豪幽為第五歌戈麻為第六陽唐為第七耕清青為第八蒸登為第九侵覃談鹽添咸銜凡為第十皆以平聲為部首而三聲隨之其移入之字與割併之部即附見其中考以古法多相脗合惟入聲割裂分配其説甚辨而論者終不能無異議焉唐韻正臣等謹按唐韻正二十卷亦即顧炎武所撰音學五書中之一也是編大㫖凡韻中之字其有今音與古音同者即不復注其不同者乃韻補相傳之誤則注云古音某並引經傳之文以正之其一韻皆同而中有數字之誤則止就數字注之一東是也一韻皆誤則每字注之四江是也同者半不同者半則同者注其畧不同者注其詳且明其本二韻而誤併為一五支是也一韻皆同無誤則不注二冬三鍾是也餘如此例其考訂頗精審亦足以有禆於音學也音論臣等謹按五方之音有遲疾輕重之不同淮南子云輕土多利重土多遲清水音小濁水音大陸法言切韻序曰吳楚則時傷輕淺燕趙則多傷重濁秦隴則去聲為入梁益則平聲似去約而言之一人之身而出詞吐氣先後之間已有不能齊者其重其疾則為入為去其輕其遲則為平遲之又久則一字而為二字茨為蒺藜椎為終葵是也故注家多有疾言徐言之解而劉勰文心雕龍謂疾呼中宫徐呼中徵夫一字而可以疾呼徐呼此一字兩音三音之所由昉也國朝顧炎武著音論三卷亦音學五書之一上卷三篇一古曰音今曰韻二韻書之始三唐宋韻譜異同中卷六篇一古人韻緩不煩改字二古詩無叶音三四聲之始四古人四聲一貫五入為閏聲六近代入聲之誤下卷分六篇一六書轉注之解二先儒兩聲各義之説不盡然三反切之始四南北朝反語五反切之名六讀若共十五篇皆引據古人之説以相證驗中惟所論入聲變亂舊法未為甚確餘皆源源本本足以訂俗學之訛盖五書之綱領也易音臣等謹按是書亦顧炎武所著音學五書之一炎武嘗考正三代以上之音注易為易音三卷盖即周易以求古音上卷為彖辭爻辭中卷為彖傳象傳下卷為繋辭文言説卦其音往往與詩不同又或往往不韻故炎武所注凡與詩音不同者皆以為偶用方言而不韻者則闕其論以古者卜筮之書多用音和以便人之玩誦雖夏商之易不傳於世然意其不始於文王也易彖文王所作其用音止此必欲連比象占牽合上下以就其音則聖人之意荒矣論極堅卓一洗訓詁家附㑹穿鑿之病詩本音臣等謹按是書亦顧炎武所著音學五書之一炎武嘗自述曰三百五篇古人之音書魏晉而降去古日逺至宋周顒梁沈約始有四聲之譜然秦漢之文其音已漸戾於古至東京益甚休文作譜不能上據雅南旁摭騷子以成不刊之典而僅按班張以下諸人之賦曹劉以下諸人之詩所用之音撰為定本於是今音行而古音亡為音學之一變其所著詩本音十卷大抵主陳第詩無叶音之説即本經所用之音互相㕘考證以他書明古音原作是讀非由遷就故曰本音第有求之太過反生葛藤如一章平上去入各用韻或兩部相近之音各用韻率謂通為一韻恐亦非古人之意古今通韻臣等謹按古今通韻國朝毛竒齡撰韻中字概本禮部韻亦有禮部韻所無而増以廣韻字者如同增桐公増蚣崇増饛通増蓪之類有今本禮部韻所無而仍增以舊禮部諸韻字者如風之渢翁之螉籠之蘢崇之娀之類隨音收入不注出處惟夢字衆字類在去送韻皆舊禮部所無而禮韻續降與毛晃禮部韻増入之者在唐律既未嘗用而古韻又三聲通轉竟從刪例至韻中有數音者各以一字領之如東韻中有東同終蟲等音而以東字為凍蝀之首同字為桐童之首所謂領音亦謂音紐今有刪去韻名及音紐者如灰韻咍字東韻㟅字之類並補之東部舊三十四紐毛晃禮部韻増一濃紐按濃字本屬鍾部唐律雖有押入東部者要是偶然惟宗農二紐在唐人東韻甚多故有疑是東部字者然三唐出韻詩比比皆有觀平聲三十韻盡然豈必偶刪此二字耶若中終皆照母風豐皆非母公宫皆見母自可併紐而隋陸法言作切韻時早已分列其中有禮部改紐與舊本互異仍依禮部本為主音紐下原有翻切昔人謂切韻以翻切得名者是也若五音集韻毎部首皆加切音竟稱徳紅東第一都宗冬第二未免過當考舊韻有懸頭字如枇杷之枇徘徊之徘有截脚字如徚之為行逕之為走有兩形字如戎之古為􅞯悤之俗為忩有兩音字如侗列同音又列通音潨列終音又列叢音有希見字如東之有􅀈支之有􅴬有轉見字如夢之列䝉頌之列容是書皆不録而於兩音之字如兹有龜兹竒有數竒音義並殊仍為各出兩形之字如同一筒字而有吹筩有郵筒同一同字而有鄭同有盧仝則亦擇其出處稍異者兩存之以備用者之採擇至於本字有義如同為酒尊通為樂器之類皆節録以為通押之用其他宋米元章謂韻有五聲沈隠侯求宫商而不得於是分平聲為二徐景安著樂書直曰宫為上平商為下平角為入徵為上羽為去即本晉吕静五音之説然而五音集韻分卷又有中平未知中屬何音程元初律古曲韻通云上平者以其聲氣從咢上出下平者以其聲氣從舌上出按咢與舌為商角之分與上下平聲諸部相校殊為不合至舉要所載七音韻鑑上平以東為首山為末謂日出於東而沒於山下平以先為首凡為末謂先輩傳於後輩一切影響不經之説概置弗道其作書大㫖在排斥顧炎武音學五書而㕘取諸家蒐採極博可與炎武之書並資考證唐韻考臣等謹按國朝紀容舒作唐韻考一書據徐鉉校定説文本所載翻切以存唐韻之梗概自隋陸法言撰切韻唐天寶中孫愐增定其書名曰唐韻後宋陳彭年等重修廣韻丁度等又作禮部韻畧為一代場屋程式而孫氏之書遂微考古韻者謂廣韻之二百六部即陸法言所定部分之舊然魏了翁已疑其前後㕘差今據夏竦古文四聲韻所列部分與廣韻小異則二百六部未可信為法言之舊本也容舒以徐鉉於雍熙三年校定説文在大中祥符重修廣韻以前所用翻切一從唐韻見於鉉等進書表乃取説文所載唐韻翻切排比分析各歸其類其部分則仍廣韻之舊所收之字有唐韻收而廣韻不收者如東部詷字㒻字㤨字之類是也有唐韻在此部而廣韻在彼部者如賨字廣韻作蔵宗切在冬部唐韻作徂紅切則在東部瓏字廣韻作盧紅切在東部唐韻作力鍾切則在鍾部之類是也其餘㕘互離合時有異同比覈精審議論俱有根據将使人由廣韻以証唐韻由唐韻以考古音則音聲遞變之故可得其大要焉古韻標準臣等謹按國朝江永撰古韻標準一書平上去三聲分十二部入聲分八部每部首先列韻目一韻岐分兩部者曰分某韻韻本不通而有字當入此部者曰別收某韻四聲異者曰別收某聲某韻大率本顧炎武採明陳第毛詩古音考屈宋古音義謂古無叶音之説詩之韻即是本音此説始於焦竑陳氏闡明之焦氏為之序其書列五百字以詩為本證他書為旁證是編即從此例以詩為主經傳騷子為證詩未用而古今韻異者采他書附益之於陳氏説之善者則多采録有舛誤處亦間摘一二其於古韻無書則借今韻離合以求古音今韻有隋唐相傳二百六部之韻顧炎武所著音學五書悉以唐韻為準是編本之而于音變源流及詩外之字亦多採顧説第顧氏詩本音欲改正舊叶之誤而有求之太過反生葛藤如一章平上去入各用韻或兩部相近之音各用韻率謂通為一韻恐非古人之意小戎二章以合軜邑叶驂以念字叶合軜邑尤失之甚者不得不為辨正若朱子取吳棫韻補釋詩以便學者誦讀如桃之夭夭灼灼其華之子于歸宜其室家晝爾于茅宵爾索綯其桐其椅其實離離豈弟君子莫不令儀此類今音可讀即不復加叶音其意在辨古音凡吳氏之叶音集傳從之而不安者亦行改正審其流變晰其是非自詡識斷精審此外尚有四聲切韻表細區今韻歸之字母音等及詩韻舉例一卷均有功於音學者皇朝通志卷十七
