玻璃逺鏡所視極其分明故以之觀列宿天之衆星較平時不啻多數十倍而且界限甚明即如昴宿傳云七星而實則三十六星鬼宿中積尸氣相傳為白氣如雲用鏡窺之則又三十五星歴歴可數他如牛宿中南星尾宿東魚星𫝊説星觜宿南星皆在六等之外所稱㣲茫難見者用鏡窺之則衆星列次之逺皆一一見焉若天漢相傳為白氣其實皆無數之小星從古天文家大都以可見可測之星求其形似連合而為象因象而命之名以為識别然名星之左右上下雖有可見之小星而其象㣲光不甚顯難以準測其度分次第惟以相近名星之比例可推而定焉今照法另列黄赤二道經緯表而屬之以相近之星座又以其次第别之亦可以備夫渾儀之作法而衆星之全象具昭於斯安有不快足乎窺天者之心目哉天漢臣等謹按李光地云二十八宿分四方者以雲漢之升降定之雲漢隂氣也列宿天中也雲漢之氣與列宿始交於申勢極於亥降交於寅沉化於巳潛明於午隂氣循環於是為著故四維之限因以定焉隂氣之升為西為北隂氣之降為東為南天之道也其説與天漢在第八重列宿之天相發明天漢在第八重列宿之天而其運動則正第八重之運動焉以廣面為界旁過二極斜絡於天體猶之黄赤等大圏平分之為二若論其體乃天體内無數之㣲星耳星因㣲小其光不能映射人目如諸大星又因其稠宻故覺所見之㣲光或成白道或如白河之象云爾天漢黄道經緯度晉書天文志云天漢起東方經箕尾之間謂之漢津乃分為二道其南經傅説魚天籥天弁河鼓其北經龜貫箕下次絡南斗魁左旗至天津下而合南道乃西南行又分夾瓠瓜絡人星杵造父螣蛇王良附路閣道北端大陵天船卷舌而南行絡五車經北河之南入東井水位而東南行絡南河闕邱天狗天記天稷至七星南而没明史天文志云近年浮海之人至赤道以南見雲漢過天狗之墟抵天社海石之南踰南船帶海山貫十字架蜜蜂傍馬腹經南門絡三角龜杵而屬於尾宿是為帶天一周靈臺儀象志天漢經緯度分列黄道南北赤道南北四表與明史合但不按宫次或分二界或分三界或分四界逐度列表其分合曲折之處尚有未詳今亦分黄赤南北四表而各按宫次分南界北界南之北界北之南界各列四層其分合既為明晰至其曲折之處經緯或有不同又於毎度之間細分列表按數圖之庶合懸象云臣等謹按天社海石等星即所謂近南極者也為中國之所不見自西人浮海測之始知仍屬尾宿而為帶天一周唐一行創兩戒山河之説以雲漢經天而為分野區域失之鑿矣皇朝通志卷十九
