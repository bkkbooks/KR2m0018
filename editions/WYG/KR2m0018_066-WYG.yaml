body:
  text: 職官畧三通政使司通政使滿洲漢人各一人掌受天下章奏校閲送閣副使滿洲漢人各一人初設左右通政乾隆十三年改為副使去左右銜㕘議滿洲漢人各一人初分左右㕘議乾隆十三年省左右銜經歴知事滿洲各一人漢人各一人掌出納文移承受案牘筆帖式滿洲六人漢軍二人登聞鼓㕔筆帖式滿洲漢軍各一人登聞鼔初屬都察院衙門康熙六十一年始併入通政司臣等謹按通政使司在明代為朝廷喉舌之總滙委寄過重奸蔽百出我朝達聰明目規制周詳凡臣工封事由奏事處恭遞直達御前其陳事之疏在内各部院則徑送内閣在外督撫則送通政使司亦苐校閱錯訛送閣票擬皇上躬親批答鉅細不遺銀臺閤門無不凛遵定制恪守官常諸弊肅清洵超軼前古萬萬矣大理寺卿滿洲漢人各一人掌平反重辟以貳邦刑與刑部都察院為三法司少卿滿洲漢人各一人初設漢人二人後裁一人左右寺丞滿洲漢軍漢人各一人分掌直省讞獄之事左右評事漢人各一人堂評事滿洲一人司務㕔司務滿洲漢人各一人掌收發文移筆帖式滿洲四人漢軍二人臣等謹按我朝慎重邦刑直省請讞皆令三法司核擬㑹疏具奏葢以刑部核其實以都察院大理寺簡其孚而大聖人欽恤深仁務使庶獄咸歸平允好生之徳洽于民心洵逺軼虞廷盛軌矣内務府總管大臣無定員以侍衛府屬郎中内三院卿府簡用或以王公大臣兼攝掌理内之政令凡職員選除財用出入宴饗祭祀膳羞服御賞賫賜予刑罰工作教習訓導之事皆綜理而受其成所屬七司及三院皆考核焉八國初置内務府順治十三年改置十三衙門十年仍改為内務府堂司員堂郎中一人堂主事一人堂筆帖式三十八人内一人委署主事兼司缺筆帖式四人掌治堂事凡府屬文職陞補及章奏文移皆𨽻焉廣儲司總管六庫郎中二人部員兼管六庫郎中二人郎中四人員外郎十二人部員兼庫員外郎六人主事一人委署主事一人司庫十二人無品級司庫十二人筆帖式二十六人俱掌庫事初名御用監順治十八年分為銀庫皮庫緞庫衣庫康熙十六年改定為廣儲司四庫二十八年分設磁庫茶庫共為六庫寧夀宫管理事務郎中二人員外郎二人主事一人委署主事一人筆帖式四人學習筆帖式四人内管領二人掌稽查派内寧夀宫陳設及造具檔册之事乾隆四十年務府大臣二人専管並設立郎中等官専司其事織造監督江寧府蘇州府杭州府各一人司庫各一人筆帖式各二人庫使各二人掌供奉務府上用緞匹嵗終造册呈内以副册送廣儲司察核㑹計司郎中二人員外郎六人主事一人委署主事一人筆帖式二十六人催長五人掌核理内府帑項出納之數及莊園地畞户口徭役定其籍而受其要焉初名内官監順治十七年改為宣徽院康熙十六年改為㑹計司内管領掌闗防一人協理闗防事務二人内管領三十人副内管領三十人筆帖式八人掌出内廷麗掃糊飾官三倉納酒菜器皿皆司之管理三旗納銀莊郎中一人員外郎六人委署主事一人筆帖式十有二人掌三旗各莊之糧税徵收治其賞罰與其撫恤之事掌儀司郎中二人員外郎八人主事一人委署主事一人筆帖式二十一人司俎官五人贊禮郎十有七人掌内府祭祀筵宴禮儀樂舞之事初名禮儀監順治十七年改為禮儀院康熙十六年定為掌儀司御茶膳房總管大臣無定員尚膳正尚茶正頭等侍衛各一人二等侍衛各二人尚膳副尚茶副三等侍衛各二人尚膳三等侍衛四人藍翎侍衛七人尚茶三等侍衛三人藍翎侍衛四人主事一人委署主事一人筆帖式十有二人掌敬設宴之上用茶品供奉御饌及供應賜茶筵事中正殿管理事務員外郎二人筆帖式四人雍和宫管理事務郎中一人員外郎一人筆帖式三人掌造辦佛像供應念經事務咸安宫官學管理事務大臣一人協理事務大臣一人總裁滿洲二人漢人四人以翰林院官充管理事務郎中二人員外郎二人筆帖式一人滿教習十三人漢教習九人官學生一百十八人䝉古學總裁二人管理事務司官二人教習二人官學生二十四人景山官學兼管事務司官五人滿教習九人漢教習十二人官學生三百八十八人掌訓迪内府三旗之俊秀教之書射以作興人材御藥房兼管司官二人内管領一人主事一人委署主事一人副内管領二人庫掌二人署庫掌二人筆帖式十二人掌詳慎供用藥料和合丸散之事都虞司郎中二人員外郎五人主事一人委署主事一人筆帖式二十六人催長八人掌府屬武職陞補及三旗禁旅訓練遣調供應畋漁之禁令初名尚膳監康熙十六年改為都虞司内務府武職鑲黄正黄正白三旗䕶軍營䕶軍統領各一人䕶軍叅領各五人副䕶軍叅領各五人孔雀翎委署叅領各三人前鋒委署叅領各二人鳥鎗䕶軍校各二十人舊營䕶軍校各十三人前鋒䕶軍校各二人前鋒戴藍翎委署䕶軍校各二人舊營戴藍翎委署䕶軍校各二人筆帖式各十人叅圓明園内務府三旗䕶軍營夸蘭大一人䕶軍領各一人副䕶軍叅領各一人委署叅領各一人䕶軍校各三人副䕶軍校各一人筆帖式四人俱掌宿衛及訓練察班之事熱河行行宫總管二人苑副四人掌總理翊衛各處二宫及陳設稽察之禁令千總十一人副千總十二人喀喇河屯長山峪兩間房巴克什營中闗波洛河屯濟爾哈朗圖阿穆呼朗圖張三營等處臺行宫千總各一人副千總各一人王家營釣魚黄土坎十八理汰等處行宫副千總各一人溥仁寺普樂寺安逺廟普陀宗乗廟殊像寺千總各一人副千總各一人普寧寺須彌福夀廟千總各一人副千總各二人廣安寺羅漢堂把總各二人掌典守稽查之事養鷹狗處管理事務三人協辦事務兼鷹狗統領二人藍翎侍衛頭領五人六品職銜副頭領五人筆帖式五人内養狗處頭目二人副頭目二人外養狗處頭目六人副頭目六人筆帖式三人掌飼養鷹狗以供蒐畋之事慎刑司郎中二人員外郎四人主事一人委署主事一人筆帖式二十人掌府屬審讞之事初名尚方司康熙十六年改慎刑司營造司郎中二人員外郎八人主事一人委署主事一人筆帖式二十六人掌繕修工作及薪炭陶冶之事初名惜薪司康熙十六年改營造司官房租庫值年總管内務府大臣一人郎中一人員外郎三人筆帖式七人庫掌一人掌内外城官房之租課按月徴收以供營造司之用御書處管理事務大臣一人兼管郎中員外郎無定員監造一人署監造一人庫掌三人署庫掌六人筆帖式二人掌敬刋御筆裱搨之事武英殿修書處管理事務王大臣一人監造二人庫掌四人署庫掌六人筆帖式四人掌繕刻裝潢各館書籍及二宫殿陳設書籍之事乾隆四十三年定設有總裁人提調二人纂修十二人養心殿造辦處郎中三人員外郎二人主事一人委署主事一人庫掌六人司匠十三人筆帖式十五人掌造辦供之事御物件監督工作管理儲蔵慶豐司郎中一人員外郎八人主事一人委署主事一人筆帖式十五人廐長十人廐副十九人掌蕃息牛羊羣牧供用考成之事臣等謹按内務府之制以七司各掌府事其餘分建衙門並鑄給闗防印信統轄於總管大臣而不與七司相𨽻屬唯是事類相近允宜依次分歸兹並遵㑹典成例以類序次唯内三旗䕶軍營圓明園䕶軍營暨各行宫千總㑹典序官著於武職篇而奉行則例仍載於都虞司卷中以府屬武職諸事均𨽻都虞司也兹並從類敘於其後焉太監職制附太監總管太監十四人銜二曰宫殿監督領侍曰宫殿監正侍副總管八人銜曰宫殿監副侍首領太監一百八十九人銜二曰執守侍曰侍監副首領四十三人無品級太監無定額順治年定制不過千餘人筆帖式四人惟敬事房有之乾隆七年定宫内等處太監官職以四品為限永不加至三品以上例四頒定則例七條宫殿監處分例十一條乂凡條各處首領太監處分例十六條永逺遵守錢糧俱按現行則例内額數不許增添其職掌惟敬事房辦理宫内一切事務禮儀及承行内務府文移再收納外庫錢糧其餘専掌隨侍守䕶承應灑掃坐更等事臣等謹按周禮以奄序官者惟内小臣為上士注謂奄上士奄之賢者但言奄則府史之類然則成周之制於内臣未嘗不班之以爵苐限以上士不使踰越而所供惟飲食門闥之事斯百代之良規矣漢唐以降人主因其職在禁近漸加委任遂干政事履霜堅氷淪胥莫救數或逾萬爵至開府逮於前明其弊尤甚欽惟我世祖章皇帝鑒古垂訓設立鐵牌裁定内官員數列聖相承無不防㣲杜漸訓誡周詳凡諸内臣恪恭職守無稍踰越我皇上恪遵成憲親定規條授爵以四品為限而統以内務府大臣正與周禮之領於天官者若合符節聖人治内之明度越千古兹附著太監職制於内務府之後以昭定制焉武備院卿二人又御用特簡大臣兼管無定員掌總理陳設武備修造器械及賞賜支放之事初名鞍樓以侍衛三人員外郎等官掌理順治十一年改為兵仗局十八年改今名雍正三年侍衛三人定為卿職乾隆十四年定為卿二人堂司員郎中一人主事二人委署主事二人筆帖式二十八人掌題奏事件總理四庫收發文移之事北鞍庫員外郎二人庫掌二人署庫掌一人傘房掌葢三人署掌葢三人班領三人署庫掌一人帳房處司幄三人署司幄三人鞍版司匠一人掌供奉上用鞍轡繖葢幄幕之事南鞍庫員外郎二人庫掌二人署庫掌一人熟皮作司匠一人掌官用鞍轡之事甲庫員外郎二人庫掌二人署庫掌一人䥳作司匠三人掌盔甲刀仗旗纛器械之事氊庫員外郎二人庫掌二人署庫掌一人司匠一人司弓三人署司弓三人司矢三人署司矢三人骲頭作司匠一人靴皮作司匠一人掌弓箭靴鞋氊片之事上駟院卿二人又務初特簡大臣兼管無定員掌總理敦御廐事名御馬監順治十八年改為阿衙門康熙十六年改今名初以大臣侍衛等官管理雍正六年定為卿職乾隆十四年定為卿二人堂司員堂郎中一人主事一人委署主事一人掌辦理揀選補放及稽查馬匹錢糧文移檔案等事左司右司員外郎各一人主事各一人委署主事各一人筆帖式二十二人左司掌内外羣廐游牧處馬駝數目及定議賞罰之事右司掌員役俸廩馬駝草豆及稽察奏銷之事又司鞍長三人廐長十七人牧長五人副牧長五人牧厩副四十五人䝉古醫生頭目三人掌謹慎出入時其芻牧以聴堂司之政令奉宸苑卿二人又初囿事務特簡大臣兼管無定員掌總理苑景山瀛臺事務屬尚膳監康熙二十三年設立奉宸苑雍正六年設立卿職乾隆十四年定為卿二人堂司員郎中一人員外郎四人主事一人委署主事一人苑丞十三人筆帖式十五人郎中主事掌題奏咨行補授職員之事員外郎掌分管各處河道園囿事務苑丞掌看守直宿陳設之事玉泉山稻田厰庫掌一人筆帖式三人掌辦理稻田蒔種儲蔵之事南苑郎中一人員外郎二人主事一人委署主事一人掌本苑官職陞除及分管九門草甸圍墻樹木牲獸之事苑丞三人苑副六人筆帖式五人掌看守直宿陳設器皿諸事初屬採捕衙門康熙二十三年歸併奉宸苑圓明園管理事務大臣無定員郎中一人協辦事務郎中一人主事一人委署主事一人苑丞六人苑副十七人筆帖式九人庫掌二人長春園熙春園綺春園春熙院管理事務員外郎一人苑丞三人苑副九人筆帖式四人暢春園管理事務郎中一人苑丞四人苑副六人署苑副十六人筆帖式六人清漪園静明園静宜園管理事務員外郎各一人苑丞九人苑副十人筆帖式四人學習筆帖式二人催長二人分掌園亭事務織染局員外郎無定員司庫一人筆帖式三人庫使六人司匠二人領催二人掌織造上用緞紗染綵繡繪之事皇朝通志卷六十六
