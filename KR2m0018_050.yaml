body:
  text: 欽定四庫全書皇朝通志卷五十諡略三追封皇后諡孝獻莊和至德宣仁溫惠端敬皇后順治十七年八月恭上順治十七年八月甲辰世祖章皇帝諭禮部曰皇貴妃棟鄂氏於八月十九日薨逝奉聖母皇太后諭旨皇貴妃佐理內政有年淑德彰聞宫闈式化倐爾薨逝豫心深為痛悼宜追封為皇后以示褒崇朕仰承慈諭特用追封加之諡號諡曰孝獻莊和至德宣仁溫惠端敬皇后其應行典禮爾部詳察速議具奏丙午禮部奏行追封禮越三日具册寶追封上諡皇貴妃諡慤惠皇貴妃乾隆八年六月諡敬敏皇貴妃雍正元年六月追諡惇怡皇貴妃乾隆三十三年四月諡臣等謹按以上俱聖祖仁皇帝皇貴妃敦肅皇貴妃雍正三年十一月諡純懿皇貴妃乾隆五十年二月諡臣等謹按以上俱世宗憲皇帝皇貴妃慧賢皇貴妃乾隆十年四月諡哲憫皇貴妃乾隆十年四月諡淑嘉皇貴妃乾隆二十年十二月諡純惠皇貴妃乾隆二十五年五月諡令懿皇貴妃乾隆四十年正月諡貴妃諡臣等謹按會典貴妃以下無諡奉特旨者豫諡溫僖貴妃康熙三十四年十一月諡臣等謹按以上聖祖仁皇帝貴妃妃諡敏惠恭和元妃崇德六年十月諡臣等謹按以上太宗文皇帝妃皇子諡皇長子追封和碩定親王永璜諡安乾隆十五年三月諡皇二子追封皇太子永璉諡端慧乾隆三年十月諡皇四子多羅履郡王永珹諡端乾隆四十二年三月諡皇五子和碩榮親王永琪諡純乾隆三十一年三月諡皇七子永琮諡悼敏乾隆十三年正月諡公主諡臣等謹按會典公主無諡奉特旨者豫諡端獻長公主康熙二年十月諡端順長公主康熙二年十月諡和碩親王諡和碩禮親王代善諡烈康熙十年六月追諡和碩鄭親王濟爾噶朗諡獻康熙元年二月諡和碩睿親王多爾衮諡忠乾隆四十三年正月追諡乾隆四十三年正月奉諭旨睦親彰善王政宜先繼絶昭屈聖經所重朕自臨御以來間日恭閲列祖列宗實録一册因得備知祖宗創業艱難及爾時懿親藎臣勤勞佐命底定中原偉伐殊功實為從古所未有而當時䇿勳錫爵榮號崇封所以酬答者本從優厚逮其後或有及身緣事旋被降削者或有子孫承襲更易封號者迄今平情準理若不為之溯述闡揚追復舊恩於心實有所未愜因念睿親王多爾衮當開國時首先統衆入關掃蕩賊氛肅清宫禁分遣諸王追殱流寇撫定疆陲一切創制規模皆所經畫尋即奉迎世祖車駕入都定國開基以成一統之業厥功最著顧以攝政有年威福不無専擅諸王大臣未免畏而忌之遂致殁後為蘇克薩哈等所搆授款于其屬人首告誣以謀逆經諸王定罪除封其時我世祖章皇帝實尚在沖齡未嘗親政也夫睿王果萌異志則方兵權在握何事不可為且吳三桂之所迎勝國舊臣之所奉止知有攝政王耳其勢更無難號召即我滿洲大臣心存忠篤者自必不肯順從然彼誠圖為不軌無難潛鋤異已以逞逆謀乃不於彼時因利乘便直至身後以斂服僭用明黃龍衮指為覬覦之證有是情理乎况英親王阿濟格其同母兄也於追捕流賊回京時誆報李自成身死且不候旨班師睿王即遣員斥責其非並免王公等往迎之禮又因阿濟格出征時脅令巡撫李鑑釋免逮問道員及擅至鄂爾多斯土默特取馬令議其罪降為郡王平日辦理政務秉公持正若此是果有叛志無叛志乎又實録載睿王集諸王貝勒貝子公大臣等遣人傳語曰今觀諸王貝勒大臣但知諂媚於豫未見有尊崇皇上者豫豈能容此昔太宗升遐嗣君未立英王豫王跪請豫即尊位豫曰爾等若如此豫當自刎誓死不從遂奉皇上纘承大統似此危疑之時以豫為君豫尚不可今乃不敬皇上而媚豫豫何能容自今以後有盡忠皇上者豫用之愛之其不盡忠不敬事皇上者雖媚豫豫不爾宥也且云太宗恩育豫躬所以特異於諸子弟者蓋深信諸子之成立惟豫能成立之每覽實録至此未嘗不為之墮淚則王之立心行事實能篤忠藎感厚恩深明君臣大義尤為史册所罕覯使王彼時如宋太宗之處心積慮則豈肯復以死固辭而不為邪説搖惑耶乃令王之身後久抱不白之寃於泉壤心甚憫焉假令當時王之逆迹稍有左驗削除之罪果出於我世祖聖裁朕亦寧敢復翻成案乃實由宵小姦謀搆成寃獄而王之政績載在實録者皆有大功而無叛逆之迹又豈可不為之昭雪乎昨於乾隆三十八年因其塋域久荒特敕量為繕葺並準其近支以時祭掃然以王之生平盡心王室尚不足以慰彼成勞朕以為應加恩復還睿親王封號追諡曰忠補入玉牒並令補繼襲封照親王園寢制度修其塋墓仍令太常寺春秋致祭其原傳尚有未經詳敘者並交國史館恭照實録所載敬謹輯録添補宗室王公功績傳用昭彰闡宗勛至意和碩豫親王多鐸諡通康熙十年六月追諡和碩肅親王豪格諡武順治十三年九月追諡和碩敬謹親王尼堪諡莊順治十年十月諡追封和碩親王達爾罕巴圖魯貝勒舒爾哈齊諡莊順治十年五月追諡追封和碩親王鎮國公祜塞諡忠順順治十年五月追諡臣等謹按親王諡例用一字國初諸王惟忠順親王諡有二字者蓋由賜諡在順治十年時追封為多羅郡王而郡王尚未定用一字諡之例故諡號用二字與慧哲宣獻通達諸郡王同康熙二十年始定例郡王亦用一字諡詳具下多羅郡王條和碩巽親王滿達海諡簡順治十二年八月諡和碩饒餘親王阿巴台諡敏康熙十年六月追諡和碩承澤親王碩色諡裕康熙十年六月追諡和碩襄親王博穆博果爾諡昭康熙十年六月追諡和碩頴親王薩哈亷諡毅康熙十年六月追諡和碩簡親王濟度諡純康熙十年六月追諡和碩敬謹親王尼實哈諡悼康熙六年三月諡和碩顯親王福夀諡懿康熙九年二月諡和碩簡親王德色諡慧康熙九年四月諡和碩純親王隆禧諡靖康熙十八年七月諡和碩安親王嶽羅諡和康熙二十八年閏三月諡和碩康親王傑書諡良康熙三十六年閏三月諡和碩簡親王雅布諡修康熙四十年十月諡和碩顯親王丹臻諡密康熙四十一年六月諡和碩裕親王福全諡憲康熙四十一年八月諡和碩康親王椿泰諡悼康熙四十八年六月諡追封和碩簡親王巴爾堪諡武襄雍正元年正月諡臣等謹按簡親王巴爾堪本係輔國將軍其諡武襄時追封為輔國公未封親王故用兩字諡和碩莊親王博果鐸諡靖雍正元年二月諡追封和碩理親王允礽諡密雍正二年十二月諡和碩淳親王允祐諡度雍正八年四月諡和碩怡親王允祥諡賢雍正八年六月諡雍正八年五月癸未禮部奏和碩怡親王薨逝恭候皇上特賜諡號勒石奉旨怡親王之懿德鴻勳自應錫以上諡但恐一字不足以彰王之美善古者有大功則賜之美號以表揚之朕曾親書忠敬誠直勤慎亷明八字賜王字字皆王之實迹今應否於諡號之上加此八字取古人申錫美號之義著大學士九卿會議具奏六月壬寅大學士九卿等遵旨議奏怡親王忠孝居心恪勤為國皇上篤念忠勳以一字未足以彰王之美善特欲將從前御書賜王忠敬誠直勤慎亷明八字加於諡號之上洵乎奉天道以彰善合人心之至公於古人申錫美號之義實相符契至其一字之諡照例請旨奉諭旨怡親王申錫美號之典與古禮相符庶足表王生平之美善朕心深慰著依議行其一字之諡著宗人府會同大學士定議具奏是月丙辰宗人府奏怡親王一字之諡奉旨仍令臣等集議臣等公擬諡法內可以包舉衆美者敬呈六字恭候欽定奉諭旨怡親王諡號著用賢字康熙六十一年十一月廷臣公擬皇考聖祖仁皇帝尊諡朕刺指血濡筆恭定今吾弟怡親王諡號朕滴淚研硃以定將此並諭王大臣等知之和碩恆親王允祺諡溫雍正十年五月諡追封和碩簡親王巴賽諡襄愍乾隆元年五月諡臣等謹按簡親王巴賽係乾隆十八年追封親王其諡襄愍以輔國公故用兩字諡追封和碩親王福惠諡懷雍正十三年十一月追諡追封和碩親王𢎞暉諡端雍正十三年十一月追諡和碩果親王允禮諡毅乾隆三年四月諡和碩康親王沖安諡修乾隆三年四月諡追封和碩莊親王𢎞普諡恭勤乾隆八年閏四月諡和碩簡親王德沛諡儀乾隆十七年九月諡和碩康親王巴爾圖諡簡乾隆十八年五月諡和碩簡親王竒通阿諡勤乾隆二十八年七月諡和碩履親王允祹諡懿乾隆二十八年九月諡和碩莊親王允祿諡恪乾隆三十二年三月諡和碩和親王𢎞晝諡恭乾隆三十五年八月諡和碩顯親王衍潢諡謹乾隆三十七年二月諡和碩和親王永璧諡勤乾隆三十七年四月諡和碩諴親王允祕諡恪乾隆三十八年十一月諡和碩恆親王𢎞晊諡恪乾隆四十年七月諡和碩簡親王豐訥亨諡恪乾隆四十一年二月諡和碩肅親王藴著諡勤乾隆四十三年五月諡和碩怡親王𢎞曉諡僖乾隆四十三年五月諡和碩鄭親王濟哈納諡恭乾隆四十九年七月諡多羅郡王諡臣等謹按國初諸郡王諡多用二字亦間有用一字者自康熙二十年六月奉聖祖仁皇帝諭追諡郡王滿漢文俱用一字後遂為定例云追封多羅郡王額爾衮諡慧哲順治十年五月追諡追封多羅郡王界堪諡宣獻順治十年五月追諡追封多羅郡王雅爾哈齊諡通達順治十年五月追諡多羅郡王塔爾納諡敏思順治十四年十月諡多羅謙郡王斡克達諡襄康熙十年六月追諡多羅衍禧郡王羅羅琿諡介康熙十年六月追諡多羅敏郡王勒度諡簡康熙十年六月追諡多羅郡王精濟諡懷愍康熙十年六月追諡多羅順承郡王勒克德琿諡恭惠康熙十年六月追諡多羅溫郡王孟額諡良康熙十三年七月諡多羅溫郡王佛永輝諡哀康熙十七年二月諡多羅平郡王克鐸諡比康熙二十一年七月諡多羅平郡王納爾福諡悼康熙四十年八月諡多羅安郡王瑪爾琿諡慤康熙四十八年十一月諡多羅順承郡王諾羅布諡忠康熙五十六年二月諡多羅愈郡王允禑諡恪雍正九年二月諡多羅誠郡王允祉諡隱乾隆二年九月諡多羅順承郡王熙良諡恪乾隆九年七月諡追封多羅信郡王公依布諡恪勤乾隆十一年閏三月諡臣等謹按信恪勤郡王豫諡時係輔國公是以用二字諡多羅平郡王福彭諡敏乾隆十四年二月諡多羅平郡王慶寧諡僖乾隆十六年二月諡多羅恂郡王允禵諡勤乾隆二十年四月諡多羅順承郡王泰裴英阿諡恭乾隆二十一年九月諡多羅慎郡王允禧諡靖乾隆二十三年七月諡多羅信郡王德昭諡懿乾隆二十七年五月諡多羅寧郡王𢎞皎諡良乾隆二十九年九月諡多羅果郡王𢎞曕諡恭乾隆三十年四月諡多羅愈郡王𢎞慶諡恭乾隆三十五年十二月諡多羅信郡王如松諡恪乾隆三十六年正月諡多羅和郡王綿倫諡謹乾隆三十九年十二月諡多羅淳郡王𢎞暻諡慎乾隆四十二年九月諡多羅順承郡王恆昌諡慎乾隆四十三年三月諡多羅克勤郡王慶恆諡良乾隆四十四年三月諡多羅理郡王𢎞暐諡恪乾隆四十五年十月諡郡王品級原封多羅貝勒允祁諡誠乾隆五十年十月諡臣等謹按康熙九年四月庚申宗人府等衙門題前代舊制諸王薨逝將諡號載於封號之下本朝現行例諸王薨逝給與諡號勒碑不將封號刋勒恐後世之人難曉今臣等酌議薨逝諸王未與諡號者應於封號下加諡號一字已與諡號者仍加寫封號得旨允行是書所纂以諡法為主故不與封號相聫屬云親王世子諡和碩鄭親王世子富爾敦諡慤厚順治十四年十月諡多羅貝勒諡多羅貝勒喀爾楚琿諡顯榮順治八年十一月諡追封多羅貝勒卓禮克圖貝勒巴雅喇諡剛果順治十年五月追諡追封多羅貝勒圖倫諡恪僖順治十年五月追諡追封多羅貝勒色桑古諡和惠順治