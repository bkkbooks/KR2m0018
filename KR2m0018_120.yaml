body:
  text: 欽定四庫全書皇朝通志卷一百二十金石略六石五浙江御製蠲江南逋賦詩賜浙江巡撫張鵬翮康熙二十八年七言絶一首行書御製靈隱寺詩康熙二十八年五言律一首行書御書雲栖二字康熙三十八年正書御書松雲間三字康熙三十八年正書御書蘇堤春曉四字康熙三十八年正書御書栁浪聞鶯四字康熙三十八年正書御書曲院風荷四字康熙三十八年正書御書雙峯插雲四字康熙三十八年正書御書三潭印月四字康熙三十八年正書御書斷橋殘雪四字康熙三十八年正書御書平湖秋月四字康熙三十八年正書御書雷峯西照四字康熙三十八年正書御書南屏晚鐘四字康熙三十八年正書御書花港觀魚四字康熙三十八年正書御書天然圖畫四字康熙三十八年正書御書靜觀萬類四字康熙三十八年正書御製再過鷲峯詩康熙三十八年七言絶一首正書御製西湖之作康熙三十八年五言律一首行書御臨蘇軾喜雨亭記康熙三十八年行書御製吳山詩康熙四十一年七言絶一首行書御製重修天竺寺碑文康熙四十一年正書御臨董其昌書賜翁嵩年康熙四十一年行書御臨朱子詩賜翁嵩年康熙四十一年行書御書書字針賜李法祖康熙四十二年四言正書御書正學闡教四字康熙四十四年行書御書渟泉二字康熙四十六年正書御製觀泉詩康熙四十六年五言絶一首行書御臨董其昌書舞鶴賦康熙四十六年行書御書浙水敷文四字康熙五十五年正書御書魏徴上唐太宗十思疏雍正四年行書御製得雨詩賜李衛雍正四年七言律一首行書臣等謹按世宗憲皇帝御書得雨詩十思疏原刻內廷者已恭載首卷至諸臣蒙賜重摹於各省者亦謹以次類載焉御書扇上七絶賜李衛雍正四年行書御書扇上七律賜李衛雍正四年行書御製寒月詩賜李衛雍正九年七言絶一首草書御製浙江海神廟碑文雍正十年正書御製重建天竺寺碑文雍正十三年正書御製尖山觀音廟碑文乾隆二年正書御製尖山壩工告竣碑乾隆五年正書御製駐蹕杭州詩乾隆十六年七言排律一首行書御製吳山恭依聖祖韻詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製吳山大觀歌乾隆十六年七言古一首行書御製敷文書院詩乾隆十六年七言律一首二十二年二十七年三十年四十五年四十九年五言排律各一首俱行書御製閲杭州旗兵詩乾隆十六年四十九年七言律各一首俱行書御製開化寺詩乾隆十六年五言古一首二十二年五言律一首二十七年七言律一首俱行書御製登開化寺六和塔記乾隆十六年行書御製六和塔詩乾隆十六年七言古一首二十二年五言古一首二十七年七言律一首三十年七言古一首四十五年五言古一首四十九年七言律一首俱行書御製錢塘觀潮詩乾隆十六年二十二年七言古各一首俱行書御製丁家山詩乾隆十六年七言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製雲栖寺詩乾隆十六年五言排律一首二十二年七言律二首二十七年七言律五言律各一首俱行書御製登北高峯絶頂詩乾隆十六年五言古一首行書御製蘇隄詩乾隆十六年七言絶二首行書御製蘇隄春曉詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製栁浪聞鶯詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製曲院風荷詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製雙峯插雲詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製三潭印月詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製斷橋殘雪詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製雷峯西照詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製平湖秋月詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製南屏晚鐘詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製花港觀魚詩乾隆十六年二十二年二十七年三十年四十五年四十九年七言絶各一首俱行書御製湖心亭詩乾隆十六年二十二年二十七年四十五年七言律各一首四十九年五言古一首俱行書御製聖因行宫即景詩乾隆十六年七言律二首俱行書御製四照亭詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製竹涼處詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製緑雲徑詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製瞰碧樓詩乾隆十六年五言律一首二十七年三十年四十五年四十九年五言絶各一首俱行書御製貯月泉詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製鷲香庭詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製領要閣詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御製玉蘭堂詩乾隆十六年五言律一首二十七年三十年四十五年四十九年七言絶各一首俱行書御書小有天園四字乾隆十六年行書御書入雲二字乾隆十六年行書御製小有天園詩乾隆十六年二十二年七言律各一首二十七年七言律五言律各一首三十年五言律一首四十五年七言古一首四十九年五