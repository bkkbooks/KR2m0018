body:
  text: 天文略五北極北極髙度北極為天之樞紐居其所而不移其出地有髙下者因人所居之地南北之不同也是故寒暑之進退晝夜之永短因之而各異焉蓋厯法以日躔出入赤道之度定諸節氣而北極出入之度即赤道距天頂之度倘推測不精髙度差至一分則春秋分必差一時而冬夏至必差一二日日躔既差則月離五星之經緯無不謬矣故測北極出地之髙下最宜精密不容或略也京師北極髙三十九度五十五分晝夜刻分節氣宫度詳見日月行道臣等謹按北極髙偏易地殊觀周天三百六十度在地下者為一百八十度天頂距地極距赤道皆九十度黃道出入赤道南北各二十三度九分京師北極出地三十九度五十五分則天頂距極五十度五分而赤道距天頂亦三十九度五十五分自京而北二百里而極髙一度自京而南二百里而極低一度而日月星之出入晝夜之長短因之而異是為南北里差自京而東一度而時遲四分自京而西一度而時早四分而交節之後先日月之早晚因之而殊是為東西里差此由人居地面隨在所見不同者也明史天文志雖列北極髙度偏度然兩京及江西廣東之外皆據圖約計不能實測則能得真正度分者鮮矣我朝於各省及蒙古回部金川皆實測以推晝夜節氣時刻亦從古所罕也爰備列之各直省北極髙度偏度盛京北極髙四十一度五十一分偏東七度十五分夏至晝長六十刻四分夜三十五刻十一分冬至反是節氣時刻遲二十九分以下冬至反是四字省臣等謹按西法分每時八刻晝夜共九十六刻與古人百刻之法殊蓋亦以整御零也李光地以為得易之真數八卦六爻互相乘兩四十八而為九十六矣推以餘卦頗合尼布楚北極髙五十一度四十八分偏西十七分夏至晝長六十五刻十三分夜三十刻二分節氣時刻早一分黑龍江北極髙五十度一分偏東十度五十八分夏至晝長六十四刻十分夜三十一刻五分節氣時刻遲四十四分三姓北極髙四十七度二十分偏東十三度二十分夏至晝長六十二刻十四分夜三十三刻一分節氣時刻遲五十三分白都訥北極髙四十五度十五分偏東八度三十七分夏至晝長六十一刻十三分夜三十四刻二分節氣時刻遲二十四分吉林北極髙四十三度四十七分偏東十度二十七分夏至晝長六十一刻一分夜三十四刻十四分節氣時刻遲四十二分山西北極髙三十七度五十三分三十秒偏西三度五十七分四十二秒夏至晝長五十八刻八分夜三十七刻七分節氣時刻早十六分朝鮮北極髙三十七度三十九分十五秒偏東十度三十分夏至晝長五十八刻六分夜三十七刻九分節氣時刻同吉林山東北極髙三十六度四十五分二十四秒偏東一度四十分夏至晝長五十八刻二分夜三十七刻十三分節氣時刻遲三分甘肅北極髙三十六度八分偏西十二度三十六分夏至晝長五十七刻十三分夜三十八刻二分節氣時刻早四十九分河南北極髙三十四度五十二分三十六秒偏西一度五十六分夏至晝長五十七刻七分夜三十八刻八分節氣時刻早八分陜西北極髙三十四度十六分偏西七度三十三分四十秒夏至晝長五十七刻三分夜三十八刻十二分節氣時刻早三十分江南北極髙三十二度四分偏東二度十八分夏至晝長五十六刻六分夜三十九刻九分節氣時刻遲九分四川北極髙三十度四十一分偏西十二度十六分夏至晝長五十六刻夜四十刻節氣時刻早四十九分安徽北極高三十度三十七分偏東三十四分夏至晝長五十六刻夜四十刻節氣時刻遲三分湖北北極髙三十度三十四分四十八秒偏西二度十七分夏至晝長五十六刻夜四十刻節氣時刻早九分湖南北極髙二十八度十三分偏西三度四十二分夏至晝長五十五刻五分夜四十刻十分節氣時刻早十五分浙江北極髙三十度十八分二十秒偏東三度四十一分二十四秒夏至晝長五十五刻十三分夜四十刻二分節氣時刻遲十五分江西北極髙二十八度三十七分十二秒偏西三十七分夏至晝長五十五刻五分夜四十刻十分節氣時刻早二分貴州北極髙二十六度三十分二十秒偏西九度五十二分四十秒夏至晝長五十四刻十分夜四十一刻五分節氣時刻早四十分福建北極髙二十六度二分二十四秒偏東二度五十九分夏至晝長五十四刻八分夜四十一刻七分節氣時刻遲十二分廣西北極髙二十五度十三分七秒偏西六度十四分夏至晝長五十四刻四分夜四十一刻十一分節氣時刻早二十五分雲南北極髙二十五度六分偏西十三度三十七分晝夜刻分同廣西節氣時刻早五十四分廣東北極髙二十三度十分偏西三度三十三分十五秒夏至晝長五十三刻十一分夜四十二刻四分節氣時刻早十四分各蒙古回部北極髙度偏度阿勒坦淖爾烏梁海北極髙五十三度三十分偏西二十八度四十分夏至晝長六十七刻三分夜二十八刻十二分節氣時刻早一百十五分汗山哈屯河北極髙五十一度十分偏西二十九度夏至晝長六十五刻三分夜三十刻十二分節氣時刻早一百十四分唐努山烏梁海北極髙五十度四十分偏西二十四度二十分晝夜刻分同前節氣時刻早九十八分布嚨堪布爾噶蘇台北極髙四十九度二十八分偏西十一度二十二分夏至晝長六十四刻夜三十二刻節氣時刻早四十五分額格色楞額北極髙四十九度二十七分偏西十二度二十五分晝夜刻分同前節氣時刻早五十分烏蘭固木杜爾伯特北極髙四十九度二十分偏西二十五度四十分晝夜刻分同前節氣時刻早一百零四分桑錦達賚北極髙四十九度十二分偏西十六度二十分晝夜刻分同前節氣時刻早六十五分額爾齊斯河北極髙四十九度二十分偏西二十五度四十分晝夜