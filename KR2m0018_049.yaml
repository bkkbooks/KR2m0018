body:
  text: 欽定四庫全書皇朝通志卷四十九諡略二列后尊諡原皇后直皇后翼皇后宣皇后俱順治五年十一月追尊恭上孝慈昭憲敬順仁徽懿德慶顯承天輔聖高皇后乾隆元年三月恭加上崇德元年四月丙戌恭上孝慈昭憲純德貞順成天育聖武皇后尊諡康熙元年恭改上尊諡曰孝慈昭憲敬順慶顯承天輔聖高皇后雍正元年八月己酉恭加上仁徽二字乾隆元年三月乙巳恭加上懿德二字孝端正敬仁懿哲順慈禧莊敏輔天協聖文皇后乾隆元年三月恭加上順治七年二月丁酉恭上孝端正敬仁懿莊敏輔天協聖文皇后尊諡雍正元年八月己酉恭加上哲順二字乾隆元年三月乙巳恭加上慈禧二字孝莊仁宣誠憲恭懿至德純徽翊天啓聖文皇后乾隆元年三月恭加上康熙二十七年正月辛巳聖祖仁皇帝諭禮部曰大行太皇太后聖德母儀昭示萬國昔奉我皇祖太宗文皇帝贊宣內政誕育我皇考世祖章皇帝顧復劬勞受無疆休大一統業朕踐阼方在沖齡仰荷我聖祖母訓誨恩勤以至成立晨昏依戀三十餘年方期洊享遐齡茂膺繁祉詎意適遭違豫奄忽上賓朕哀疚之深五中摧絶昊天罔極報德實難緬惟厚澤深仁信足炳傳簡册非薦隆號莫展哀誠宜恪遵彞憲恭上尊諡垂示無窮以慰朕尊親之意著內閣翰林院詹事府會同擬奏其應行典禮爾部詳議以聞內閣等衙門恭擬尊諡二道進呈奉旨應上太皇太后尊諡曰孝莊仁宣誠憲恭懿翊天啓聖文皇后十月乙卯恭上尊諡雍正元年八月己酉恭加上至德二字乾隆元年三月乙巳恭加上純徽二字孝惠仁憲端懿慈淑恭安純德順天翊聖章皇后乾隆元年三月恭加上康熙五十六年十二月己亥大學士馬齊嵩祝李光地蕭永藻王掞奏查康熙二年恭上慈和皇太后尊諡內閣翰林院擇二十四字分為兩條具奏奉旨尊為孝康慈和莊懿恭惠崇天育聖今恭上大行仁憲恪順誠惠純淑端禧皇太后尊諡臣等會同翰林院依例敬擇具奏奉旨此奏甚屬錯誤爾等恭瞻太廟奉先殿二位文皇后神主便知其誤矣庚子大學士等奏臣等遵旨恭詣太廟謹瞻神位見孝端孝莊兩太皇太后並從太宗文皇帝廟號俱有文字臣等愚昧查康熙二年慈和皇太后尊諡舊檔僅擬尊諡字樣具奏未將康熙九年奉旨慈和皇太后從世祖章皇帝廟號升祔太廟之例不以章皇后字樣一併寫出甚屬錯誤因將所擬字內敬寫章皇后字樣具奏得旨此事不比尋常但聲明錯誤則已該部嚴察具奏所擬尊諡亦未明晰朕記太皇太后徽號字樣甚多即就原徽號字內刪減擬定並未改換今通行改擬恐於例有不合丙午大學士等奏臣等恭查舊檔太皇太后徽號原有昭聖慈夀恭簡安懿章慶敦惠溫莊康和仁宣𢎞靖二十字賓天之後恭上尊諡將原字減去十五字留五字又添擬七字尊為孝莊仁宣誠憲恭懿翊天啓聖文皇后升祔太廟慈和皇太后徽號原有慈和二字後尊為孝康慈和莊懿恭惠崇天育聖皇后康熙九年升祔太廟時添寫章字大行皇太后徽號原有仁憲恪順誠惠純淑端禧十字今欽遵上諭照追上太皇太后尊諡例將原字內留五字添擬七字尊為孝惠仁憲端懿純德順天翊聖章皇后又將原字內留四字添擬八字尊為孝惠仁憲莊定端純順天翊聖章皇后恭候皇上訓示得旨前一條所擬是五十七年三月辛酉恭上尊諡雍正元年八月己酉恭加上慈淑二字乾隆元年三月乙巳恭加上恭安二字孝康慈和莊懿恭惠溫穆端靖崇天育聖章皇后乾隆元年三月恭加上康熙二年五月甲午恭上大行慈和皇太后尊諡曰孝康慈和莊懿恭惠崇天育聖皇后康熙九年二月庚戌聖祖仁皇帝諭禮部曰慈和皇太后誕育朕躬未遂孝養思慕之忱每切于懷雖已上尊諡但今升祔太廟配食皇考典禮關係重大其應進諡號著議政王貝勒大臣九卿科道會同詳議具奏是月丁己議政王等恭議太祖高皇帝皇后稱高皇后太宗文皇帝皇后稱文皇后今慈和皇太后配祀世祖章皇帝前上孝康慈和莊懿恭惠崇天育聖尊諡亦宜加上尊諡為章皇后得旨是五月丙辰朔恭加上尊諡雍正元年八月己酉恭加上溫穆二字乾隆元年三月乙巳恭加上端靖二字孝誠恭肅正惠安和淑懿儷天襄聖仁皇后乾隆元年三月恭加上康熙十三年五月辛未聖祖仁皇帝諭禮部曰皇后赫舍哩氏作配朕躬已經六載上事太皇太后皇太后克盡誠孝佐朕內治尤極敬勤節儉居身寬仁逮下宫闈式化淑德彰聞兹于康熙十三年五月初三日崩逝惓懷懿範痛悼彌深宜有稱諡以垂永久著內閣翰林院會同擬奏應行典禮爾部詳察以聞大學士等恭議上尊諡曰仁孝皇后得旨是六月庚申行册諡禮康熙六十一年十二月追上尊諡曰仁孝恭肅正惠安和儷天襄聖皇后雍正元年四月改上尊諡曰孝誠恭肅正惠安和儷天襄聖皇后九月庚辰恭加上尊諡曰孝誠恭肅正惠安和儷天襄聖仁皇后乾隆元年三月乙巳恭加上淑懿二字孝昭靜淑明惠正和安裕欽天順聖仁皇后乾隆元年三月恭加上康熙十七年三月癸酉聖祖仁皇帝諭禮部曰皇后鈕祜祿氏端懿夙著作配朕躬奉事太皇太后皇太后恪恭婉順殫竭孝忱正位宫闈節儉寬仁克襄內治芳型伊始淑德彌彰兹于康熙十七年二月二十六日崩逝追念壼儀良深痛悼宜有稱諡以垂永久著內閣翰林院會同擬奏其應行典禮爾部詳察速議具奏大學士等恭議上尊諡曰孝昭皇后得旨依議閏三月辛酉行册諡禮康熙六十一年十二月恭上尊諡曰孝昭靜淑明惠正和欽天順聖皇后雍正元年九月庚辰恭加上仁字乾隆元年三月乙巳恭加上安裕二字孝懿溫誠端仁憲穆和恪奉天佐聖仁皇后乾隆元年三月恭加上康熙二十八年七月壬寅聖祖仁皇帝諭禮部曰皇后佟氏淑德夙成芳徽懋著侍奉皇太后克盡孝誠撫育諸子悉均慈愛褆躬敬慎御下寬仁式備儀型宫闈胥化頃遵慈諭作配朕躬尚期內治之永襄何意沉疴之難起兹於康熙二十八年七月初十日崩逝惓懷懿範痛悼良深宜有稱諡以垂永久著內閣翰林院會同擬奏其應行典禮爾部詳查速議以聞尋大學士等恭議上尊諡曰孝懿皇后得旨依議九月乙卯行册諡禮康熙六十一年十二月恭上尊諡曰孝懿溫誠端仁憲穆奉天佐聖皇后雍正元年九月庚辰恭加上仁字乾隆元年三月乙巳恭加上和恪二字孝恭宣惠溫肅定裕慈純贊天承聖仁皇后乾隆元年三月恭加上雍正元年五月甲辰世宗憲皇帝諭曰朕惟尊親之典首重易名聖善之修必崇顯號我皇妣大行皇太后端莊恭肅慈惠安和奉侍先皇壼儀茂著誕育沖藐母道備隆顧復恩周命提義盡寬仁逮下澤洽宫庭謙儉持躬化流禁掖朕繼承大統嗣服鴻基方期合萬國之歡心奉慈闈之色養不意遽遭大故仙馭上升抱痛銜哀感深罔極惟藉顯揚之典少申孝慕之誠允宜稽考彞章薦升尊諡六月丁巳大學士等恭擬上尊諡曰孝恭宣惠溫肅定裕贊天承聖仁皇后得旨是八月己未恭奉册寶上尊諡乾隆元年三月乙巳恭加上慈純二字孝敬恭和懿順昭惠佐天翊聖憲皇后雍正十三年十一月恭上雍正九年十月甲午世宗憲皇帝諭禮部曰皇后納喇氏作配朕躬經四十載奉事皇祖妣孝惠章皇后皇考聖祖仁皇帝皇妣孝恭仁皇后克盡孝忱深蒙慈愛服膺朕訓歷久而敬德彌純懋著坤儀正位而小心益至居身節儉待下寬仁慈惠播于宫闈柔順發于誠悃昔年藩邸內政聿修九載中宫德輝逾耀兹于雍正九年九月二十九日崩逝惓惟閫職襄贊多年追念懿徽良深痛悼宜加稱諡以永休光著內閣翰林院擬奏應行典禮爾部詳察議奏特諭癸卯大學士等恭議上尊諡曰孝敬皇后得旨依議十二月己亥行册諡禮雍正十三年九月己亥皇上登極癸卯諭禮部曰朕惟致治莫先于崇孝徽稱首重于易名天地之覆載同功帝后之尊親一體欽惟孝敬皇后作配皇考懋著坤儀孝德夙洽於宫闈仁惠久孚於壺掖朕躬承顧復備荷恩慈恭上皇考大行皇帝尊諡宜並追崇恭上尊諡以展孝思爾等詳查典禮具奏十一月戊戌總理事務王大臣會同禮部議上竊惟尊親之典帝后同稱孝慕之忱顯揚並切溯有娀于殷世祥祉攸凝紀太姒於周詩徽音永炳矧係聖代之母儀宜有加崇之顯號欽惟孝敬皇后功符坤載德協乾元篤誠孝於宫庭動循禮則懋勤勞於壺掖翊贊謨猷溫恭備著夫嘉徽和慎聿昭其淑德丕宣閫教化啓肅雍共被仁慈恩推鞠育慶升平而佐理帝治彌昭貽福祉以垂庥孝思倍摯臣等恭遵諭旨敬考彞章謹擬恭上尊諡曰孝敬恭和懿順昭惠佐天翊聖憲皇后伏候命下之日一切應行典禮交與該衙門敬謹辦理謹奏奉旨是依議十一月丙辰恭奉册寶上尊諡孝聖慈宣康惠敦和敬天光聖憲皇后乾隆四十二年三月恭上乾隆四十二年正月辛卯奉皇上諭旨大行皇太后坤元協德懋著徽音四十二年母儀天下尊養兼隆福德備至實古今史册所未有今忽遭仙馭升遐朕心哀痛不能稍釋敬稽典禮宜隆諡號以表尊崇第至德難名實非臣下擬議所能切當朕欲親尊為孝聖憲皇后其令大學士九卿公議可否如是及所有節次晉加徽號其中或有按例應行酌減及應增加字樣仍著敬謹詳議具奏二月己亥大學士等遵旨議奏臣等伏考歷代母后尊諡自漢明帝始建光烈之稱厥後典制相仍著於史册而所上諡號類皆出於臣下由其徽音令德雖有不同而考禮定名尚易比擬故也欽惟大行皇太后誕育皇躬母儀天下備福夀者八十六載受孝養者四十二年合九州萬國以尊親萃五世一堂而頤樂鴻稱疊晉慶典便蕃扶輦環億兆之臚歡款關集鰈鶼之來賀蠲租錫類而感洽羣黎偃武集勳而威宣諸徼凡我皇上之功德巍盛悉由聖母之美善崇隆敬仰懿徽與天無極洵非尋常諡號所得形容萬一惟我皇上本至孝以定典章宣示諭旨以至德難名親尊為孝聖憲皇后仍令臣等集擬具奏臣等謹按鄭樵通志所載上諡百三十有一字首以神聖並列考之宋代有慈聖光獻曹后宣仁聖烈高后雖以聖為諡尚屬鋪張揚厲之文而于大行受大名之義均有未當今大行皇太后之至德實為史牒所未有誠如諭旨難以名言惟欽定為孝聖乃克崇闡洪儀昭示奕祀揆之古來諡議允為式協輿論詢之在廷臣寀莫能復贊一詞至歷年恭晉徽號奉旨有按例酌減及應增加字樣臣等謹查孝莊文皇后徽號二十字孝惠章皇后徽號十字恭上尊諡時俱敬列十二字今大行皇太后徽號係十八字臣等遵旨詳議于徽號擬用六字又照例增加四字恭上尊諡曰孝聖慈宣康惠敦和敬天光聖憲皇后以符禮制謹合詞具奏伏候欽定奉諭旨是依議三月壬午恭奉册寶上尊諡孝賢皇后乾隆十三年四月恭上乾隆十三年四月乙卯禮部恭議上大行皇后尊諡曰孝賢皇后奉旨依議皇朝通志卷四十九
