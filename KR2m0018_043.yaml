body:
  text: 禮畧嘉禮二臣等謹按鄭樵通志載天子納后妃天子冊立妃嬪夫人之儀兹謹據本朝㑹典通禮所述皇帝大婚冊立皇后暨冊封妃嬪之典著於篇中其儀節之詳備見於通禮者不復具載而皇子親王以下婚儀公主以下下嫁之儀以次附見焉皇帝大婚冊立皇后禮崇徳元年四月冊立中宫嫡妃為皇后是日設黄幄於清寧宫前設黄案於幄内王公百官朝服序立崇政殿前太宗文皇帝御殿閱冊寳命正副使持節至清寧宫宣讀冊文行冊立禮禮成正副使持節復命皇后率公主王妃命婦于太宗文皇帝殿前行六肅三跪三拜禮諸妃率公主王妃命婦詣中宫行六肅三跪三拜禮上御殿諸王大臣進滿洲䝉古漢字三種表文次第宣讀行慶賀禮順治八年八月世祖章皇帝大婚冊立皇后前期題定納采大徴禮數大婚前一日遣官祭告天地太廟届日質明上朝服出御太和殿視冊寳授冊封使臣禮部官前導由協和門出詣皇后邸是日先遣親王二人奏請皇太后至位育宫上出宫步迎至太和門内皇太后由太和殿入宫冊封使臣既至皇后邸内院官讀冊寳文畢獻皇后皇后跪受望闕行六肅三跪三叩禮畢皇后升輦至太和殿階下皇后降輦由中道入宫禮部堂官奏請上御中和殿率諸王入宫於皇太后前行三跪九叩禮畢上復御中和殿皇后率諸王妃朝見皇太后行六肅三跪三叩禮畢禮成皇后還宫諸王妃入侍皇太后燕上出御太和殿賜諸王及察哈爾額駙阿布鼐親王土謝圖親王卓禮克圖親王等並貝勒文武羣臣宴畢上回宫皇太后乘輦還慈寧宫上恭送如初次日上御太和殿諸王貝勒文武羣臣上表行慶賀禮頒詔天下十一年六月冊立皇后行大婚禮前期諭禮部諏吉日擬定儀注及大婚之日御太和殿閱冊寳宣制命正副使持節詣皇后邸行冊立禮有司具儀駕鹵簿奉迎皇后升輦入宫大婚禮成次日上御太和殿文武羣臣上表行慶賀禮賜宴頒詔天下康熙四年九月聖祖仁皇帝大婚冊立皇后前期一日行大徴禮届期上御太和殿閱冊寳畢授冊封使臣捧至皇后第宣讀皇后謝恩行禮畢鑾儀衞陳儀仗車輅鼓樂前導皇后由大清中門行御道至太和殿階下降與内監奉冊寳前導恭侍命婦十人祇迎入中宫上具禮服詣太皇太后宫皇太后宫行禮還宫行合卺禮畢上陞太和殿賜皇后親屬及諸王百官筵宴皇后詣太皇太后宫筵宴諸王以下免行禮公主王妃以下免㑹次日皇后詣太皇太后皇太后宫行朝見禮次日上御太和殿王以下文武各官上表行慶賀禮頒詔天下十六年八月冊立皇后前期遣官祇告天地太廟後殿聖祖仁皇帝親詣奉先殿告祭届日設節案於太和殿正中設冊寳案於左右同日嬪敬冊封端嬪貴妃榮嬪安嬪惠嬪案宜嬪右次僖嬪設後遇貴妃冊寳案冊封嬪冊於左稍後以同日妃節並嬪儀同上御太和殿閱冊寳王公百官咸朝服按翼序立乃宣制命正副使持節行冊立禮正副使至景運門内監接奉節冊寳入宫皇后受冊寳行禮如儀行受貴妃冊嬪各禮内監接奉節授正副使正副使還至後左門復命上率王公大臣詣太皇太后皇太后宫行禮次日皇后禮服詣太皇太后皇太后宫皇帝前行禮各如儀公主福晉命婦免隨行禮越三日上御太和殿王公百官上表行慶賀禮如儀免公主福晉命婦詣中宫行禮頒詔天下二十八年七月冊立皇貴妃為皇后先期遣官告祭太廟至日行冊立禮頒詔天下雍正元年十二月冊立嫡妃為皇后前期遣官告祭天地太廟社稷至期行冊立禮俱如儀惟慶賀典禮得㫖俟三年後補行次日頒詔天下三年十月上御太和殿王以下文武大臣官員進表補行慶賀冊立皇后禮禮畢御乾清宫皇后率妃嬪行六肅三跪三叩禮次日妃嬪率公主王妃命婦詣皇后宫行慶賀禮均如儀乾隆二年十二月冊立嫡妃為皇后先是雍正十三年十二月諭禮部朕祗遵皇太后懿㫖立嫡妃富察氏為皇后應行典禮爾禮部詳察具奏乾隆元年二月禮部擬定典禮具奏得㫖冊立皇后典禮著於二十七月後舉行至是始行冊立禮前期遣官告祭天地太廟社稷至日御太和殿宣制遣使皇后受冊寳均如儀次日上率王公大臣詣皇太后宫行慶賀禮畢御太和殿王公百官上表稱賀如儀皇后率貴妃妃嬪詣皇太后宫行慶賀禮畢内監請皇上御内殿皇后率貴妃妃嬪行禮畢還宫貴妃率妃嬪及公主王妃命婦詣皇后宫行禮是日頒詔天下十五年八月冊立攝六宫事皇貴妃為皇后先是十三年冊命皇貴妃攝六宫事至是年行冊立禮前一日遣官告祭天地太廟社稷至日御殿遣使受冊寳慶賀行禮諸儀均與乾隆二年同凡大婚之禮制下禮部徧布諸司供備諏納采大徴奉迎吉日以聞㑹工部製金冊金寳翰林院撰制冊文進呈欽定送内閣恭鐫如儀命尚書一人充納采使内務府總管一人充副使凡冊立之禮制下禮部尚書一人赴内閣承制乃諏吉以聞徧布有司供備恭製冊寳如儀以大學士充冊立使尚書充副使凡冊封皇貴妃命下禮部諏吉以聞工部製冊禮部製寳均以金送内閣鐫字如儀正使以大學士尚書充副使以侍郎内閣學士充先一日遣官祗告太廟後殿奉先殿至日内鑾儀衞設皇貴妃儀仗於本宫門外使至宣冊寳受冊寳及朝見行禮並如儀冊封貴妃儀命下所司供備製冊寳均以金遣官祗告内鑾儀衞設貴妃儀仗於本宫門外宣冊寳受冊寳及朝見並如冊封皇貴妃之儀冊封妃儀命下所司製冊印均以金遣官祗告内鑾儀衞設妃采仗於本宫門外宣冊印受冊印及朝見儀俱與貴妃同冊封嬪儀命下所司製冊以金奏請命使不遣官祗告至日内鑾儀衞設嬪采仗於本宫門外宣冊受冊儀均與妃同皇子親王以下婚儀凡皇子指婚内務府豫劄欽天監諏吉日並列大臣命婦中偕老者奏襄婚事既得㫖以告於福晉家届期贊事大臣偕福晉父蟒袍補服詣乾清門東階下福晉父北面跪贊事大臣西面稱有㫖今以某氏女作配與皇子某為福晉福晉父承㫖訖行三跪九叩禮退廼諏吉納幣奉迎合卺品物禮節如儀婚禮既成翼日皇子及福晉夙興朝服内務府管領妻二人導詣皇太后皇帝皇后前行朝見禮皇子三跪九叩福晉六肅三跪三叩其有妃嬪所出者次詣所出妃嬪前行禮皇子二跪六叩福晉四肅二跪二叩各如儀凡親王將及冠訪朝臣女或外藩王女年齒相當者奏聞請㫖命下以次行禮定婚納幣成婚如儀如奉㫖賜婚者是日王朝服詣太和殿前謝恩如儀既成婚之明日王及福晉夙興朝服詣大内謝恩行禮如皇子婚儀凡世子郡王納幣禮降於親王一等若聘外藩親王女鞍馬甲胄繒帛白金器如親王聘外藩郡王女之數婚禮既成餽贈外藩親王郡王及福晉送女來者並女之兄弟及隨從男婦衣物均如親王例凡長子貝勒婚儀納幣禮數降於郡王一等凡貝子宗室公宗室將軍閑散宗室婚儀各以次降一等其儀物並見大清通禮公主以下下嫁儀凡公主下嫁之禮内務府豫劄欽天監諏指婚吉日並列大臣命婦中偕老者奏襄婚事既得㫖禮部以告於額駙家届期贊事大臣偕額駙蟒袍補服詣乾清門東階下額駙北面跪贊事大臣西面稱有㫖今以某公主擇配某人額駙祗受命行三跪九叩禮退初定筵宴皇帝御保和殿賜額駙父等宴如太和殿宴禮宴畢内務府鴻臚寺官引額駙父等至乾清門西階下行三跪九叩禮退是日皇后率皇貴妃貴妃妃嬪詣慈寧宫皇太后陞寳座筵宴額駙母及諸婦行禮各如儀内監引額駙母及諸婦詣皇后宫行六肅三跪三叩禮退于歸合卺禮成翼日行朝謝禮公主額駙夙興朝服公主詣皇太后皇帝皇后前行禮其有妃嬪所出者並詣所出妃嬪前行禮額駙詣慈寧門外東階下乾清門外内右門外行禮各如儀凡郡主將及笄訪外藩蒙古王子年齒相當者奏聞請㫖命下以次行禮若奉㫖賜婚者額駙先詣乾清門謝恩如公主指婚之儀成婚之明日額駙偕郡主夙興朝服詣大内謝恩行禮如親王納福晉儀凡縣主出嫁納幣視郡主降一等筵宴儀凖郡王郡君出嫁筵宴儀凖貝勒縣君筵宴儀凖貝子鄉君筵宴儀凖宗室公其納幣禮數各以次降一等其儀並見大清通禮頒朔臣等謹按鄭志讀時令一條備載漢唐時立春立夏大暑立秋立冬讀五時令之儀兹考帝王授時協令典莫大於頒朔我朝一道同風正朔之奉逺訖四海頒朔儀節備著於㑹典通禮謹甄録大節著於篇中順治二年時憲書成欽天監進呈御覽世祖章皇帝御武英殿文武各官咸朝服齊集午門外頒朔行禮是年題定每年十月初一日欽天監官奉恭進皇帝皇太后皇后時憲書至太和門丹墀左行三跪九叩禮授内府官奉時憲書入恭進皇帝皇太后皇后是日黎明貝子公暨文武各官咸朝服集午門外欽天監官先陳設頒給王公百官時憲書於紅案上鴻臚寺官宣制曰欽天監進某年時憲書其賜王公百官頒行天下宣畢羣臣行三跪九叩禮畢親王郡王各令所屬依次跪領貝子公親跪領文武官各以其長一人跪領回署頒給所屬官各退十八年定朝鮮國每年十月朔遣使齎咨赴部恭領時憲書豫劄欽天監封送儀制司本司郎中朝服於司署頒發來使跪領齎回本國康熙三十二年頒時憲書於内扎薩克科爾沁等二十四部落均以各來使請安之便按名給發五十三年頒時憲書於外扎薩克喀爾喀等十有五部落與科爾沁等部落同雍正三年定頒給青海扎薩克王台吉等時憲書於每年領俸幣時一同給發七年定各省布政使司每嵗四月由欽天監頒發考定時憲書式敬謹刋刷鈐盖庫貯欽天監時憲書印信凡見任文武大小官及在籍有職官舉人貢生等各給一本以彰敬授人時之意至各省民户繁多勢難遍給應將所刻書板發貯公所聴匠役或書坊備紙刷印赴布政使司鈐盖欽天監時憲書印發賣俾深山僻壤咸知時序月令乾隆二年覆准散給青海扎薩克王台吉等時憲書於每年五六月間同俸幣給發似覺稍遲應先期於每年十月將次年時憲書由兵部交驛站發往青海散給十九年定孟冬頒朔於午門親王郡王貝勒亦令親領行禮是年頒時憲書於杜爾伯特部落與喀爾喀部落同二十八年頒時憲書於哈宻闢展喀什噶爾英吉沙爾葉爾羌和闐烏什阿克蘇哈喇沙爾土魯畨伊犂庫車沙雅爾等十三部落俱由理藩院給發冊封親王世子郡王臣等謹按鄭志有冊封諸王侯一條我朝監古定制無冊封藩國之典兹謹循㑹典通禮所載冊封親王親王世子郡王儀節著於篇中而冊封公主及福晉夫人等儀附見焉凡冊封親王及親王世子命下禮工二部製冊寳皆以金若嗣封王則注名於冊寳世相傳授豫期禮部諏吉奏請命内大臣散秩大臣一人為正使内閣學士翰林院學士禮部侍郎一人副之詣王邸第正使持節前行副使奉制冊禮部官奉寳隨行王率所屬官朝服跪迎入門行三跪九叩禮宣制冊宣寳王退立拜位行三跪九叩禮畢正使奉節出王率屬出大門外跪送如儀封使回還節有司退若冊封郡王製冊寳皆銀質金飾餘與親王及世子同凡冊封郡王長子貝勒貝子命下工部製制冊以紙前期禮部奏請命内閣侍讀學士侍讀翰林院侍讀學士侍講學士侍讀侍講一人為正使禮部郎中員外郎一人副之迎節冊受冊送節均如諸王儀凡冊封公主命下工部製冊以金禮部諏吉奏請命正副使持節往封如親王之儀公主率侍女跪迎於儀門内道右受冊送節均如儀凡親王世子郡王福晉長子貝勒貝子夫人間五嵗禮部彚疏請行冊封禮制冊封使各如其夫爵節冊視彚封人之數福晉等迎節冊受冊送節各如公主儀凡郡主縣主縣君間五嵗禮部彚請遣使冊封制冊用紙儀注與福晉夫人同三老五更臣等謹按鄭志載三老五更一條厯敘漢明帝安帝暨曹魏後魏後周之制牽率附㑹伊古以來未有定論恭讀我皇上御製三老五更說三老記及題張廷玉三老五更議折衷千古之疑昭然若揭日月乾隆五十年御新建辟雍講學禮成鉅典輝煌超軼萬古恭讀御製國學新建辟雍圜水工成碑記有云若夫三老五更之說予以為括於養老化俗之儀而非天子所必應並行而不遺者盖弗見於詩書乃特出杜氏通典之私耳且予向有三老五更之說已明闢其謬兹不複綴乎辭御製上丁釋奠後臨新建辟雍講學得近體四首有云三五昔經著說詳謂他杜撰失荒唐注云三老五更之說不見詩書惟禮記出漢儒非孔子之言左傳始有三老凍餒之文注疏者紛紛不一而蔡邕獨斷遂有父事兄事之說白虎通直以為老更各一人且曰父一而已不宜有三其謬更甚杜佑通典亦宗其說真成杜撰矣向嘗著說闢之詳見三老五更說今命刻於辟雍碑隂大哉聖言曠然若發蒙矣兹編謹存三老五更之目恭載御製文於卷中以昭析古今議禮家之迷誤焉御製三老五更說三老五更之說不見於詩書其見於禮記者盖出於漢儒非孔子之言惟左傳三老凍餒之文為最古然傳謂公聚朽蠧而三老反不見養遇非與五更相提並論也註三老五更者多矣或謂上中下夀或謂工商農而不及五更或謂明天地人與五行之事或謂取象三辰五星或謂知三徳五事者各以臆度不堪僂指矣至蔡邕獨㫁乃有父事兄事之說而白虎通之謬直以為老更各一人且曰父一而已不宜有三吁可怪哉天子養老即所以教孝於天下何至以父事之且即其說父一而已則天子已自有父今復事一人是非二父乎腐儒執虚文而謬大義真不直一噱耳邕復觧更為叟謂豕亥之訛夫叟與老同既有老又何藉叟為哉予以謂三者天地人之數養老自以三舉其數耳若夫五更則更事之說為近而五倫五常莫不具於此人數不必其備行之以敬誠愷悌則中和位育將在是矣後儒一切穿鑿之論何足數哉御製三老記予既為三老五更之說以闢諸家之謬然以三老之稱數典於左氏其何以稱三老則求其觧而終不得其辭兹以三餘之暇書辟雍詩冊有三老之語臨池下恍然悟曰三老之言實出孟子所謂老而無妻老而無夫老而無子此非三老而何孟子雖出左氏後而此語自由古以傳故即繼之曰文王發政施仁必先斯四者可知文王時即有三老之稱左氏提其綱孟子晰其目耳且晏子對叔向歎齊之將為陳氏所云公棄其民三老凍餒乃指一國鰥寡獨窮之民之無恤者設以上夀中夀下夀論之豈八十以下之老即可以弗恤乎其餘附㑹之論愈說愈逺然總於辟雍養老興賢有何涉乎自是而三老之稱徧於鄉閭所謂三老董公壺闗三老之類不一而足盖耆艾而長於鄉者即可稱三老而非定三人也夫予三老五更之說成於戊戌逮今又六年求其說而不得而筆下偶得之是不可以不記且此六年中何嘗不讀孟子而未有㑹兹偶㑹之益見理不可不日窮書不可不日讀寧渠呈已之是顯人之非以為博聞廣識而已哉御製題張廷玉三老五更議戊戌年為三老五更說亦既闢其踳駮而勒之新建辟雍之碑矣今秋駐避暑山莊檢續書之四庫全書内文頴集中有三老五更議之篇而挂漏其名因命檢文津閣之書乃知為張廷玉所撰憬然憶之事在乾隆戊午為廿七月既閱諸禮畢舉之時於視學之前曾向軍機大臣等談及三老五更而咨其可行與否彼時鄂爾泰依違其間張廷玉則斷以為不可於是奏此議而遂寢其說盖鄂爾泰固好虚譽而近於驕者張廷玉則善自謹而近於懦者且二人彼時皆可望登此席者也以今觀之則廷玉之議為當設爾時勉强行之必有如廷玉所謂資後人之議者矣若朕戊戌年之所為三老五更說戊戌去戊午厯四十年其事早已忘之盖戊午朕方廿八嵗而戊戌則六十有八此亦足騐四十年間學問識見之效而年少時猶未免有好名泥古之意至今則灑然矣兹觀廷玉之議與朕之說不約而同樹之前旌焉因命並勒辟雍碑以識已學之淺深及弗掩人之善也夫廷玉既有此卓識何未見及朕之必不動於浮言遵皇考遺㫖令彼配享太廟而臨休致歸里時乃有求入廟之請此所謂老衰而戒之在得乎朕又以廷玉之戒為戒且為廷玉惜之鄉飲酒禮順治元年定京府及直省府州縣每嵗於正月十五日十月初一日舉行鄉飲酒禮設賓介主人衆賓之席順天以府尹為主直省府以知府州以知州縣以知縣為主大賓擇鄉里年髙有徳之人位於西北介以次長位於西南三賓以賓之次者為之位於賓席之西衆賓序齒列坐司正以教職為之主揚觶以罰失儀者贊禮讀法以生員為之以申明朝廷之法敦序長㓜之節二年定順天府詳稽鄉飲酒舊制移送禮部題請施行嗣後每嵗由順天府具題將所舉賓介等姓名履厯呈部存案鄉飲酒讀律令曰律令凡鄉飲酒序長㓜論賢良年髙有徳者居上其次序齒列坐有過犯者不得干與違者罪以違制失儀則揚觶者以禮責之康熙元年定奉天府州縣行鄉飲酒禮儀與順天同四年定錦州府州縣行鄉飲酒禮儀與奉天同雍正元年諭鄉飲酒禮乃敬老尊賢之古制近聞年乆視為具文應飭令加謹舉行是年順天府舉行鄉飲酒禮特命禮部堂官前往監禮嵗以為常乾隆二年覆凖鄉飲之典必賓介得人始足以示觀感而興教化應通行嚴飭嗣後所舉賓介務擇齒徳兼優允協鄉評之人如地方官徇情濫舉即應題㕘若所舉得人而不法之徒或有藉端阻撓者亦應嚴加究治十八年覆准各省鄉飲竟有頻年闕畧不舉致曠大典者應令各省督撫轉飭所屬府州縣每嵗遵照定例於正月十月舉行二次其賓介之數據舊儀所載鄉飲酒圖有大賓介賓一賓二賓三賓衆賓與大僎一僎二僎三僎之名按儀禮賓若有遵者諸公大夫則既一人舉觶乃入注言今文遵為僎又曰此鄉之人仕至大夫者來助主人樂賓主人所榮而遵法者也或有無來不來用時事耳又曰不干主人正禮也謂之賓者同從外來耳大國有孤四命謂之公又疏言一人舉觶為旅酬始乃入即是作樂前入又戴記坐僎於東北以輔主人所謂席於賓東助主人樂賓者也其言主人親速賓及介而衆賓自從之至於門外主人拜賓及介而衆賓自入三揖至於階三讓以賓升拜至獻酬辭讓之儀繁及介省矣至於衆賓升受坐祭立飲不酢而降皆無一言及僎者所謂不干主人正禮者也嗣後應令順天府及直省府州縣先期訪紳士之年髙徳劭者一人為賓次為介又次為衆賓皆由州縣詳報府尹督撫覈定舉行其本地有仕至顯官偶居鄉里願來觀禮者依古禮坐於東北順天府及直省㑹城一品席南嚮二三品席西向各府州縣三品以上席南向四五品席西向無則闕之不立一僎二僎三僎之名不入舉報之内仍將所舉賓介造具姓名籍貫清冊送部存案以昭慎重皇朝通志巻四十三
