body:
  text: 刑法略四刑制秋朝審凡秋審定例直省督撫將重犯審擬情實緩決可矜三項具題每嵗限五月內到部刑部將原案及法司督撫各看語刋刷招册送九卿詹事科道各一册八月在金水橋西先是在準天安門外至康熙二十三年覆定於金水橋西會審合同詳核分擬具題請旨裁定其盛京等處案件亦造入各省秋審案內具題俟命下日先後咨行直省將情實人犯於霜降後冬至前正法其文到限期雲南貴州四川廣東廣西福建限四十日江西浙江湖南甘肅限二十五日江南陜西湖北限十八日河南限十二日山東山西限九日直隸限四日盛京限十五日寧古塔限一個月限內遲延不到者將遲延各地方官察明指參其刑部見監重犯每嵗一次朝審刑部於霜降後摘敘緊要情節刋刷招册送九卿各官如秋審例霜降後十日在金水橋西會同詳審分别情實緩決可矜具題請旨其情實者俟命下之日刑科三覆奏皆經御定大學士承旨用硃筆勾決其餘仍監固凡各省每年秋審臬司核辦招册先期定稿以次移咨在省司道會同虛𠂻商𣙜聨銜具詳督撫覆核定擬至期會審司道各官俱集每年應入秋審案犯於應勘時仍令各督撫提解省城率同在省司道會勘其緩決人犯解審二次之後情罪無可更定者祗令有司敘由詳報停其解審其曾擬情實未經勾決之犯及前擬緩決後改情實并緩決人犯內情可矜者仍照例解審凡在京每年秋審遇審某省即令某道御史與掌道一體上班朝審令京畿道御史同掌道與審勾到時遇某省本章即著某道御史承辦朝審案件令京畿道専辦行刑時著刑科給事中及刑部侍郎一人監視乾隆十四年定例如此今係刑部滿漢侍郎各一人刑科給事中一人新資刑部員外郎一人十八司滿漢司員各一人監視各省官犯於定案時即在按察司衙門收禁秋審勾到本到省照刑部決囚之例將情實官犯全數􅀈赴市曹即令按察司監視行刑奉到諭旨當埸開讀按照豫勾之犯驗明處決秋審勾到後大學士會同刑部將已勾未勾情節摘敘簡明事由奏聞行知各督撫於處決時榜示通衢曉諭朝審由刑部發交該城榜示其各省官犯俱俟朝審勾到後奏聞頒發又朝審勾到刑部將人犯綁出之日步軍統領衙門𣲖步軍翼尉一員護送凡各省官犯如繫貪酷敗檢侵虧狼籍及有心巧詐不盡臣職罪應斬絞之員其審題結案在行刑之日以前皆補疏題請情實豫勾者即行刑之日已過亦著行刑在行刑以後審結者入下年新事册內刑部仍貼簽聲明其尋常私罪案犯無前項情節者牢固監候以俟次年秋審不得概請補入本年情實其常犯罪該斬絞如連斃二命妖言惑衆傳集符咒等項定讞時已在該省熱審之後刑部即補入本年秋審情實册內具題或遇停決之年其情實案內有糾衆聚匪劫奪辱官以及前項官常犯情罪重大之案刑部仍開具事由清册専行奏聞請旨正法凡各省駐防旗人犯該斬絞者無庸解部即在理事同知衙門收禁有應入秋審人犯令將軍都統等悉心確核分别情實緩決可矜造册題達刑部九卿會核具題至勾到時某省駐防即另册同各省應勾人犯一體辦理新疆地方定擬死罪監侯人犯凡經秋審緩決五次及情實十二次未勾者準於新疆地方互相調發為奴秋朝審情實官常犯有經十次未勾者刑部奏聞下次入緩決不得擅改可矜官犯已改緩決後如遇查辦緩決三次以上時不得與常犯一例減等其中或有應行寬宥者出自特恩凡竊盜滿貫及三犯竊贓至五十兩以上擬絞之犯除情罪重大應擬情實外其餘應入緩決者秋朝審一次之後改發雲貴兩廣極邉煙瘴充軍其可矜人犯內如子婦不孝詈毆翁姑其夫忿激致斃或因該犯之母素有姦夫已經拒絶後復登門尋釁以致拒毆致斃者此等情切天倫一時義激與尋常鬬狠者不同刑部會同九卿查核遇有似此罪犯案情既確俱量為區别照免死減等例再減一等發落仍逐案隨本聲明請旨凡罪干服制由立決改為監候者刑部於秋審時俱入情實彚為一册先期進呈候勾俟經兩次免勾之後大學士會同刑部堂官將此等人犯招册覆加詳勘其有情節可寬者摘敘案情確加看語請旨改入緩決緦麻服屬人犯於停勾二次之後亦照期功以上例大學士會同刑部一體省核改入緩決順治二年諭以後重辟如奉監候再審之旨地方毋得輕決著各巡按御史會同監司從公研審報部覆奏候旨處決其事有寃抑情可矜疑者徑自奏聞十二年諭三法司核擬罪必靣同研審不得但用文移往復康熙十二年諭刑部向來朝審之例先期進呈招册然後九卿科道會審覆奏完結及各省秋審奏本內止有節略觀覽未能明晰又有續到者不及入覆奏案內以致留俟來年殊為不合以後各省秋審應照在京朝審例豫期造册進呈著九卿科道覆核奏請定奪四十四年諭各省秋審尚無可議朝審則太寬書云罪疑惟輕以其罪有可疑之處而輕之也若無可疑則以公平為貴現在殺人之人情罪顯然又何所疑而欲從寬乎執法之人但當詳情據理以定罪一味從寬則惡人何所警戒可以此諭刑部五十三年諭刑部秋審奏章繁復者甚多皆由府州縣司道各官審録供招盡行全載所致該府司道果讞有别情自應敘入若無互異之處但注明該府司道與各州縣等官原審皆同一語止將州縣初招並督撫大吏審擬之處敘明足矣此非為朕便於觀覽案牘繁多則事務必致遲延矣雍正二年諭明刑所以弼教君德期於好生誠以民命至重寧過乎仁毋過乎義也朕念朝審重囚其情實者刑科必三覆奏聞勾除者方行處決而外省情實重囚惟於秋審後法司具題即咨行該省無覆奏之例中外一體豈在京諸囚宜加詳慎在外省者獨可不用詳慎乎自今年為始凡外省重囚經秋審具題情實應決者爾法司亦照朝審之例三覆奏聞以副朕欽恤之至意三年諭人命至重須平心研究求其可生之路至萬無可生然後勾決則國法所不容亦其自取耳從來法寬則愚民易犯非刑期無刑之意十一年諭今年各省秋審人犯有不應緩決之案經九卿改為情實者甚多督撫通省大僚臬司刑名總匯録囚定獄何等重事豈可因循苟且如有司執法科罪而九卿奏請平法或九卿據法定議而朕酌奪從寬方合政體豈有執法之官而任意於法外徇縱者乎倘督撫臬司或謂九卿定議從刻稍存迎合之見遂於矜疑之案概以情實奏讞其弊尤不可言爾等將改正各案逐一核明通行申飭之又諭明刑所以弼教除暴所以安民朕臨御萬方不得一道同風俾我民免於刑戮每以自咎所望內外大臣抱刑期無刑之心執辟以止辟之法先使民不敢犯俾無漏網之姦凶繼則導人不為非漸化向風之頑懦如此需之嵗月庶幾習俗可移朕十年以來一切刑獄莫不虗𠂻斂息詳慎推研寬嚴本無成見惟其自取每見廷臣疆吏諄切開示諒已悉朕心矣今者秋審大典詳覽各册有法無可貸情無可原而各督撫概擬緩決並無勘語且有上次擬情實而今年自改緩決者有監候多年之犯而每年秋審忽擬情實忽擬緩決者有本定緩決因部改情實即照擬情實本定情實因部改緩決即照擬緩決者試問該督撫等豈竟漫不經心抑竟漫無定見耶夫踈縱之過甚於苛刻姑息之害等於殘忍但本公誠之至意逹仁義之通權方為平允若以為欲嚴是負朕心若以為欲寬亦辜朕訓內外大臣務籌逺大不枉法不弛刑由此類推庶政皆然其各身體而勤求之毋忽十三年諭朕聞外省會審之時不論案件多寡悉於一日定議均聽督撫主張司道守令不敢置喙究其實督撫亦未必了然不過憑幕賔略節貼於册上徒飾觀瞻不察情罪之輕重率定爰書之出入以致讞獄不平寃情莫訴勸懲兩失凶暴肆行所謂明刑弼教者安在朕臨御以來法司所進立決本章必令三覆奏每年朝審秋審先期細覽招册至勾到時復與廷臣往復講論蓋哀矜惻怛之意動於不得已而發於不自知並非欲博欽恤好生之名也聖祖於當年勾到日皆著素服朕亦效法行之凡受封疆之寄者應同此心乃刻期草率定局並不博採羣議且有結綵設筵徴歌演劇者此則殘忍性成不學無術者之所為嗣後各宜謹慎周詳殫心辦理不妨多寬時日毋得視為具文至於會集既久除常餐外倘有肆筵設席仍蹈前習者經朕訪聞必加嚴處乾隆十年諭向來冬至既屆一應秋審之犯例不行刑若逺省地方奉到文書在冬至以後者則留至次年冬至前正法後因此等人犯盡屬凶惡罪無可緩若遲至一年之久未免别生事端仍於奉到部文時處決諸犯既無可緩適值冬至亦須稍遲嗣後如有過期接到部文者著於冬至七日以後照例處決該部行文各督撫知之十四年諭八旗滿洲互相殺傷案件向例俱從斬決至雍正年間乃按律以謀殺鬬毆分别斬絞亦即行正法自朕御極之後以旗民條例輕重懸殊特諭九卿八旗會同定議一切命案俱著監候至秋審時茍非謀故重情概為緩決但思立法之道與其狎而易犯不若使知所畏而不敢蹈向來立法從嚴具有深意惟是旗民事例既經畫一今又改從斬決朕心有所不忍嗣後滿洲與滿洲毆殺案件著於秋審時俱入情實八旗都統通傳知悉務使旗人各惜身畏法不罹罪譴又諭廣東南海縣民劉德滿繼妻關氏揢死前妻之子劉應周致令伊夫絶嗣一案朕因其情罪可惡於法司核擬時特為存記今經秋審擬入緩決據刑部查稱乾隆十一年直隸省張心堯繼妻張氏藥死前妻之子依律擬絞監候每年於秋審時查明張心堯續娶有子將應否減等請旨定奪如終至絶嗣將張氏正法關氏案照此辦理等語朕思繼母如母名分甚尊其於前妻之子究無屬毛離裏之愛果其撫如已出則子自當事若所生然忿戾殘刻非理淩虐者比比而是皆由法雖設而不行人心無所警畏故也夫謂親雖不慈子不可以不孝豈非扶持名教之言而從古所謂閔損王祥者能有幾人顧可以是責之庸衆之流乎律載故殺子孫者杖六十徒一年嫡繼慈養母殺者加一等致令絶嗣者絞律文之以加等科罪正以其與親生者有間當其殘害軀命則母子之恩已絶况致令絶嗣則得罪於其夫得罪於其夫之先代原其初雖曰母子也夫婦也至於故殺而母子夫婦天倫盡廢執國法以繩之固殺人之凶犯耳揆之天理人情毫無可恕朕意子果不孝經官驗明有據則雖繼母亦不必治以加等及擬絞之罪如其無罪致死則但當治以國法而不當復追論其名分其絶嗣擬絞亦但當論其見在之有無子息而不必計其後此之續娶另生凡情罪可惡者以情實定擬與謀故人犯一併正法如此則慘毒之行有所畏憚而不敢肆庶足以正刑章而厚倫理又諭朝審情實人犯例由刑科三覆奏其後各省秋審亦皆三覆奏慎重民命即古三刺三宥遺制謂臨刑之際必致詳審不可稍有忽略耳非必以三為節也朕每當勾到之日置招册於旁反覆省覽常至五六遍必令毫無疑義至臨勾時猶必與大學士等斟酌再四然後豫勾豈啻三復也哉若夫三覆奏本章科臣匆遽具題不無豕亥且阻於時日豈能逐本全覽嗣後刑科覆奏各省皆令一次朝審仍令三覆又諭朕因刑科三覆奏之例各省奏牘繁多迫於時日轉致不能詳覽已命簡去二覆以從務實今思勾決之時朕詳閲招册反覆斟酌辨論大學士在朕前一靣秉筆代勾一靣聽受諭旨雖殿庭咫尺自無舛錯但多經一遍視覽於勾決更為慎重嗣此著於勾到後將原本進呈覆閲再行批發著為例又諭秋審為要囚重典輕重出入生死攸關直省督撫皆應詳慎推勘準情酌法務協乎天理之至公方能無枉無縱各得其平朕於情實招册皆反覆省覽再三究極情狀毫不存從寬從嚴之成見所勾者必其情之不可恕所原者必其情之有可原惟以一理為權衡而於其人初無愛憎好惡之見者存也今年各省招册經九卿改定之案甚多其中有緩決改入情實者或謀殺或故殺或拒捕或誣良致死或威逼致死或姦民聚衆不法或邪術迷拐或強姦幼女或羞忿自盡或連砍數人或毆死有服尊屬皆情罪較重萬無可貸此等凶徒斷不應擬以緩決設非九卿改正經朕裁酌置之典刑則姦徒幸免死傷屈辱者寃無可伸而刑罰於是乎失中豈所謂詰姦止辟之義耶此於法紀倫常風化所繫甚重所有審擬不當之各督撫皆著嚴行申飭又諭朕於侵貪各案諄諄垂戒前後所降諭旨不啻三令五申此次勾到辦理侵貪各案有督撫輕擬九卿改入情實者有九卿溷入緩決經朕指示情節改入情實者所有二年限滿之犯完數如例者業經分别原減其逾限未完營私入已確然有憑者豫勾正法誠以律不容弛法當共守與其失之寬而犯者衆不如顯然示以無所假藉俾知所戒而不至更蹈覆轍所全者實多也朕前降旨令刑部於秋朝審時將各省官犯彚為一册得以詳悉推勘以昭慎重之意此雖不僅指侵貪而官犯內惟侵貪者常多以理論之潔已奉公人臣之職分應爾倉庫錢糧莫非小民脂膏上以供軍國經費人君且不得私有而乃漫無顧忌如取如携婪正供而入私槖是閭里之輸將轉為若輩填溪壑也夫取非其有謂之盜况取國家之所有乎貪人之財猶謂之盜而况其貪國家之財乎此其情可恕乎乃向來錮習以為寧盜毋貪此在為上者為民之深權其輕重謂與其厲民毋寧損上以是重言人臣之不可貪耳而豈忍以盜待臣子哉為臣子者又豈甘以盜自處哉人徒知漁利於民者貪也蠧食於官者侵也援律傅罪輕重判然不知貪者固有害於下而侵者實無所畏於上以無畏之心而濟之以無窮之欲則𣲖纍以肥槖者有之因事而勒索者有之甚至枉法受贓者有之朝廷之府庫且所不顧更何民瘼之可矜民膏之足惜此侵則必貪勢使然也此等劣員多留一日則民多受一日之殘國多受一日之蠧既以劣迹敗露尚可因循姑息繫之囹圄獲全首領下愚不肖之輩其何所警惕而絶其行險僥幸之心又安知其不轉以身被刑辟之虛名而子孫享富厚之實惠且自為得計耶是斧鑕一日未加則侵貪一日不止惟一犯侵貪即入情實且即豫勾決人人共知法在必行無可幸免身家既破子孫莫保則叨餮之私心必能自禁何至甘心扞網冒法此狂瀾之必不可不回而膏肓之必不可不救旋轉之機斷在於此用是再頒諭旨詳悉開導俾共知潔己奉公之大義凜服官典守之大防杜絶侵漁終逺刑辟為良有司國家實嘉賴焉如其不知畏懼不知悛改則三尺具在斷在必行前鑒昭然慎勿視為具文也此諭著刋刻頒發令內外文職衙門入於交盤册內永逺傳示各宜凛遵十七年諭各省由立決改為監候人犯皆係服制攸關其改擬監候已屬原情酌減若秋審時入於緩決則減之又減殊非慎重倫常明刑弼教之道是以上年降旨令改入情實此其中情節多端如父母被毆致傷或勢在危急救護乃其至情使父毆叔而子助父以斃叔亦得謂之救父則是長不友不睦之風非止辟之意但散在各省招册中有勾決者有未勾決者或未悉朕輕重權衡反滋擬議著該部將此等案犯彚為一册與官犯招册先期進呈候勾其有應宥者亦即豫減等發落朕於各省招册反覆研究務協理法之大中人命至重大德好生何忍不以哀矜為念但骫法違道務在活人斯乃婦人之仁中外問刑者其共知之十八年諭各省由立決改監候人犯情罪本重纍次秋審仍列入情實上年四十起內未勾者二十三人此次已勾一起但節次存留監禁將積而愈多是因緩死而屢次綁赴市曺亦非所以重刑章也嗣後此項除本年未勾人犯下次仍入情實外其餘著大學士會同刑部堂官將招册覆加詳勘其有實在情節可寬如弟毆兄斃或果因其兄干犯父母迫於親命或素有瘋疾一時病發凡似此類酌量分别敘述案情確加看語請旨即入緩決蓋倫常所繫不猒周詳朕於勾決册內已再三審量更一畨公同斟酌則情節益明庶協明慎用刑矜恤民命之至意著為令二十七年諭國家秋讞大典上繫刑章下關民命慮囚時設情法未衷於至當何以昭弼教之用心每嵗刑部進呈各省情實人犯招册朕必將逐案事由一一披覽使獄情毫無遺漏而各案適輕適重又詳為稱量比擬有其迹雖涉疑似而情尚一線可原者既於册內折角存記即情罪重大於法萬無可貸不得已而豫勾之案亦反覆推勘於犯事實欵隨其節目次第折角及勾到前一日與臨勾之時必三經檢核須俾毫髮無疑然後豫勾所謂求其生而不得則死者皆無憾也夫緩重犯須臾之命使被害者銜寃不得自申婦寺之仁刑官尚不應出此何况天下共主若以既嚴三尺均屬應斷之刑而不為銖量權衡將案內細微同異之由並歸無憾則此輕掉之心已乖與衆共棄之本義此朕自揣兢兢明慎固不肯稍存寬嚴之見即督撫九卿已數為擬議猶未敢稍緣因任者也苐向來勾到事畢原閲招册祗存貯內閣其問刑衙門不過預聞臨時商𣙜之言而先事全局折衷所以一再不釋者未能盡喻又何以定司憲之準所有本年各省情實招册可於勾到後即發交刑部其近今二三年內閣所貯册一併檢發俾詳悉披繹因端領會庶幾體朕意以求協中則成牘不為無助著為例四十二年諭調姦拒捕逞凶斃命之犯情罪固為可惡但按律擬以斬候於法已無可加乃聲敘以為不足蔽辜請即正法恐無識者轉疑為有意從嚴所辦未免過當著傳諭各督撫嗣後如遇此等案犯按律定擬後即夾片聲明趕入本年秋審情實較之尋常案件歸入下年秋審者已屬從嚴毋庸將不足蔽辜字樣聲敘四十四年諭勾到湖廣山東等省秋審人犯內王成馮文煒二犯俱砍殺一家六命其子應行緣坐王成之子王喜娃年僅十嵗馮文煒之子馮大甫年僅六嵗馮二甫年僅二嵗刑部俱擬入情實應斬本屬例所宜然王成馮文煒凶惡已極即將伊全家抵死僅足相償實為情真罪當而刑部定例將殺六命之已絶嗣者其子均擬斬決若尚未絶嗣者擬斬監候而於緣坐者之年嵗未為區别因念二犯緣坐之子犯事時年僅數嵗尚在童稚無知若概豫駢誅究覺不忍是以均未豫勾此即朕之姑息然仰體上天好生之心毋寧失之厚耳惟是此等凶孽留其喘息已屬法外之仁若伊等長成後或遇赦減等釋宥仍聽婚配俾有遺孽將何以昭示平允并何以慰死者之心嗣後遇有此等凶犯緣坐之子年在十一嵗以上者仍照見行之例辦理如在十嵗以下者俱著問擬斬候永逺監禁雖遇赦不準減釋令其老死囹圄庶於準情之中仍不廢法著為令四十八年欽遵諭旨奏準各省重犯於招解到省定案後即行留禁省城於臬司首府首縣各監酌量均勻分撥禁固俟勾決部文到日即在省城處決其中或間有九卿改入情實者為數無多仍令各督撫飭令各州縣照舊例辦理或有九卿由情實改入緩決者即解回本州縣監禁所奉聖諭榜示省城外仍行文各本州縣張挂曉諭以警人心又欽遵諭旨奏準酌擬情重罪犯留省監禁者共三十四條其餘服制緣坐姦宿拐騙尋常鬭毆共毆及婦女老幼之犯易於防範者俱仍於招解後發回各州縣牢固監候皇朝通志卷七十八
