body:
  text: 欽定四庫全書皇朝通志卷八十三食貨略三賦稅上順治初年世祖章皇帝軫念民生力除明季加派積弊詔言前朝厲政莫如加派遼餉以致民窮盜起而復加勦餉再為各邊抽練而加練餉惟此三餉數倍正供更有召買糧料名為當官平市實則計畝加徵乃令自順治元年始凡正額之外一切加派盡行蠲免如有官吏朦朧混徵暗派者殺無赦時巡按御史栁寅東建言解京錢糧頭緒紛雜有一縣正額止三千餘兩而條分四十餘項有一項錢糧祇一兩六七錢而加費至二三十兩宜總計各欵彚解以杜賠纍山東巡撫方大猷亦請清釐錢糧欵目並刻由單使民易曉御史寧承勳又請飭所部於賦役全書外給易知由單一應無藝之徵通行裁革而御史衛周祚見正定府荒亡請亟行編審之法使丁地稅糧得符實數又緣明季內官縱恣紳襟優免逾額部臣議將各厰地租照御用監近例歸併有司徵解巡撫王文奎請革優免舊習蘇小民取盈攤派之困其言並見採用于是首令直省文臣齎錢糧册籍以朝禁天下徵收錢糧毋得于額外加火耗以故民內監地畝錢糧總歸户部管轄二年諭凡前朝宗室祿田散在直省者與民間一例起科三年特遣大學士馮銓與公英俄爾岱往户部察核錢糧原額在京責成各管衙門在直省責成撫按彚造賦役全書頒行天下是時天下財賦最重之區莫如江南江西浙江三省而蘇松嘉湖諸府尤最撫臣黃徽請以漕白二糧與嵗貢絹布俱官兑官解以紓民纍江西南昌瑞州袁州三府荒地浮糧懸欠日久巡按黃贊元請丈出荒地永行豁免其近山易旱近水易潦者上則改為輕則俱從之是年革太平府姑溪橋米稅金柱山商稅安慶府鹽稅以明季所增也六年頒易知由單將各州縣衛所額徵起運存留本折分數漕白二糧及京庫本色俱條悉開載通行直省按户分給又特諭戶部設關以寓譏察非專與商賈較量錙銖爾部亟行文各關差員悉照原定則例起稅如有徇情權貴放免船隻乃於商船增收或希充私槖例外多徵者罪七年定衛所屯田科徵先是衛所屯田分給軍丁因有操練城守捕盜領運之則科徵較民田輕減至是裁汰衛軍凡有運糧衛所仍舊徵收其無運衛所照民田起科八年命御史分巡各省察民間利病蘇松巡按秦世禎因條上興除八事一田地令業主自丈量明注印册以清花詭一額定錢糧俱填易知由單設有增減另給小單使姦胥不能藉口一由單詳開總散數目花户姓名以便磨對一催科不許濫差衙役設立滚單以次追比一收糧聽里户自納簿匱俱加司府印封以防姦弊一解放以緩急分先後勒限掣鎖不得分毫存留衙役之手一民差查田均𣲖與排門册對驗無使苦樂不均一備用銀兩概行節省不得透支令各布政使每季提徵解原册年底報部扶同容隱者罪從之先是户工二部十九處關津每關専差户部漢司官一員督管稅務嗣後增設滿洲官一員漢軍官一員關差員數遞增書吏多行不法甚至沿河􅌉貨商賈畏蹜不前上深知其弊著仍舊每關設官一員其添設者悉行裁去九年定直省典鋪稅例在外當鋪每年徵稅銀五兩其在京當鋪並各鋪該順天府酌量鋪面徵收又以廣東屯糧全征本色未免苦纍屯丁令本折各半徵收十年以江南秣陵廣武英武三衛屯糧路隔長江輸糧不便準其折色又令各關差刋刻定例設匱收稅不得勒扣火耗需索陋規並禁關役包攬報單十一年户部請訂正賦役全書又請如明制令各布政使或三年或五年將人丁地土繕造黃册以便稽查隙地漏糧之弊時户科給事中杜篤祐條奏關弊四事一裁吏役一查稅纍一關差回避一批文對核限章並下所司遵行是年減江西袁州瑞州二府浮糧又以各關有納銀數多給票數少者許商民首告十三年上以前明加𣲖陋規屢經裁減猶恐有司胥吏有侵漁中飽之弊乃命戶部右侍郎王宏祚將直省額定征收起存實數詳稽往牘酌量時宜有參差遺漏悉行駁正凡自明季以漸加增豁免未盡者概行豁免至漕白雜項或改折或本色俱細加清核勒成一編頒示天下於是於賦役全書外又輔以會計赤歷丈量黃册其徵收則行一條鞭法給以易知由單又佐以截票串票印簿循環簿及糧册奏銷册此外又有所謂序册者其條件悉如奏銷册康熙四年以其糜費無益停止及康熙七年又以各省地丁欵目有奏銷册已完未完實數有考成册皆每嵗奏報其丁口增減册籍又五年一編審法已詳密其黃册十年一造會計册每年一造俱停止至十八年並赤歷册亦除之其各關稅務令各關差當堂設匱設梁頭貨物條例商民親自填簿輸銀投匱驗明放行如有濫委差役苛索民間小船及往來行人衣服食物者該撫按據實參處十四年定關稅照部頒條例刋榜豎立關口便商輸納十五年江西御史許之漸深言財賦之大害莫如蠧役官以參罰去而蠧役歷久尚存前無所懲後無所誡遂至纍萬盈千而不知足請飭撫按將從前侵蠧姓名數目逐一清查籍其家業侵多者立梟市曹侵少者即時流配捐此所侵之數以清積蠧之源工科給事中史彪古又言國家財用原取足于正供乃今之州縣有一項正供即有一項加泒應敕各撫按將見行申飭私𣲖之令刋入易知由單使閭閻共曉德意上以所奏皆切時弊令所司議行十六年將四川屯糧歸併州縣起科以裁衛所故也十八年令州縣徵收錢糧各置木匱排列公衙門首納戶眼同投匱以免尅扣凡布政司及州縣均遵部頒法馬稱兑勿令書吏髙下其手時工科給事中隂應節言錢糧之弊一州縣挪移一紳士包攬一土豪冒名紳户一隔縣寄莊抗糧請飭該撫嚴查懲治從之是年定張家口殺虎口及兩翼稅額又以雲南衛辨職田向例收租準俸不納稅糧嗣後各歸衛所編入户口俱以本七折三徵收其舊係每畝一斗九升至三斗者照軍糧例起科三斗至五斗者概以三升為額康熙二年工科給事中吳國龍言直省解京各項錢糧國初原總歸户部自順治七年復令各部寺分管催收致欵項繁多易滋姦弊請嗣後一應雜項俱稱地丁錢糧作十分考成除扣撥兵餉外通解户部其易知由單頒給民間者盡除别項名色是年以江西巡撫張朝璘言免南昌府屬浮糧其漕米一項浮多亦並核實減免三年以直省各州縣錢糧上司動用差提不無勒索令嚴行禁止如州縣官挪移虧空揑稱民欠或加𣲖私徵者即行革職該管官不即參報亦罪之四年諭户部設官原以養民近聞守令徵收錢糧加添火耗或指公費科𣲖或向行户強取借端肥已獻媚上官致民無控告科道各官務將此等情弊不時糾參至夏秋分徵原有定期隔年預徵民何以給嗣後永停預徵之例又各關定例抽分溢額者加與紀録因而各差兾邀恩典困苦商民乃令悉照定額抽分永免溢額議敘之例其輪流差遣部員亦停止尋以王大臣九卿科道議定左右兩翼張家口殺虎口四處仍差户部滿官輪管其崇文門歸順天府治中天津關歸天津道通州歸通州道居庸關歸昌密道龍泉各關歸井陘道紫荆各關歸直隸守道臨清關歸東昌道西新關歸江鎮道蕪湖關歸池太道揚州關歸驛傳道滸墅關歸蘇常道淮安關歸淮海道北新關歸浙江布政使荆州關歸荆州府同知九江關歸九江道揠運廳歸通薊道贛關歸吉南贛道太平橋歸南雄府知府遇仙橋浛光厰歸韶州府知府兼理嗣是屢飭各關違例收稅遲延掯勒及地方官濫徵私派之弊並責令在內科道在外督撫不時糾參失察者坐罪五年直隸巡撫王登聨請徵收關稅處刋刻木板豎立關口並商賈往來孔道遍行曉諭以杜吏役濫徵部議準行是年定居庸關稅額罷崇文門出京貨物稅課六年以由單欵項繁多小民難以通曉令嗣後止將上中下等則應徵銀米實數開明其湖廣陜西二省糧石派徵本折數目向未開載行令照例填注免浙江麗水等九縣積荒田賦令有司招墾成熟後另行起科又以江南石城等衛屯糧改折太重仍徵本色時御史徐浩武言江南淮海道専管海防勢難兼及稅務其淮安關稅應另委員管理户部因議各處關稅俱應如所請于是以浙江北新南新兩關改歸杭州府同知七年又以北新關改歸浙江鹽運使八年户科給事中蘇拜言關稅一差改隸外府佐二各官俱有専掌且身為地方官畏懼上司希圖足額必致增派商民請仍差滿漢官員専理乃命以關稅多者簡差各部院賢能司員稅少者交地方官徵收于是定張家口殺虎口照舊遣差户部司員滸墅關蕪湖關北新關九江關淮安關太平橋揚州關天津關西新關臨清關簡差各部院滿漢賢能司員其揠運􅈦居庸龍泉紫荆荆州贛州各關仍交地方官管明年裁江南西新關户部差併歸龍江關工部江南蕪湖關工部羞歸併本關户部初直隸各省廢藩田産改入民户號為更名地內有廢藩自置之田給民佃種輸糧外又納租銀上以既輸賦又徴銀重為民纍令與民田一例輸糧免其納租十年以廣東屯糧十倍民賦因而荒棄者多令照民田重則起科嗣於三十年冉令減則輕收照民田例十二年禁官吏無得私稅市貨十三年以正陽關稅歸鳳陽府通判臨淮關稅發大使徴收停差部員時江南有隱占詭寄包攬諸弊積習相沿百姓苦纍至是申明截票之法諸弊悉除十八年令州縣日收錢糧流水簿同奏銷册於嵗終齎司磨對停止嵗造赤歷册二十一年移九江關榷於湖口縣先是潼關稅額歸有司徴收嵗止七千餘兩康熙十九年差郎中敦多禮監督每嵗得課銀四萬有餘至是上以秦省兵民苦於挽運著照舊額不必差遣部曹二十三年以湖南偏橋鎮逺二衛屯地屯糧併歸貴州徵收嗣後湖南屯糧屢經更定二十五年以同鼓衛併歸新寧縣三十六年以辰州衛歸盧溪縣又城步縣有經徴靖州衛屯糧仍歸靖州綏寧俱照民田一例起科又以侍郎金世鑑言令浙江沿海照山東例聽民人往海上載五百石以上船隻貿易捕採至收稅處量貨貴賤定稅是時大開洋海市舶户科給事中孫蕙請設立専官收稅上以不先酌定則例必為商纍乃差郎中伊爾格圖前往酌議伊爾格圖因請給各關定例欵項於橋頭渡口一並徴收上諭開海原以利民非為稅計若概徵橋道渡口何異無稅之地增一關乎尋以廷臣定議止收海上船載稅其海口內橋津船車等物永停抽分是年定通惠河稅差照各關例掣籖二十四年以天下户口土田視昔有加其間條目易於混淆命重修賦役全書止載切要欵目刪去絲杪尾數以除飛灑之弊又減洋船丈抽分數粵東向有東西二洋夷商往來皆量物抽稅自明隆慶年間以夷人報貨姦欺改定丈抽之法按船大小為額國朝開海禁以後皆因之至是伊爾格圖言日前多載珍竒近係日用雜物請於原額外再減二分明季于西洋商船定為九等東洋定為五等其後於西洋貨船酌減三分其江浙閩廣四省印烙船隻往外國者亦照例先是康熙四年已禁關差溢額議敘之例後因各關差採辦銅斤價直不敷按在京寶泉寶源二局鼓鑄銅斤例各關差分採因而稍稍溢額廷臣亦漸以議敘請行又各關定例四季造册送部以免擅改商人親填部册而關差往往以解册需費為辭二十五年上以此等情形既已充肥私槖更圖濫叨議敘令廷臣酌議加增銅價即於各關原額外量增均𣲖以給銅直停其議敘無許溢額其報部册聽其於任滿彚報至於缺額處分原有例令御史敦拜乃請從重議處並刻限賠補日期以懲虧欠上以法令太嚴必致纍商不允所請是年敕閩海關照粵關一例丈抽二十六年令天下免刻由單蓋因官役有指稱紙版之費用一𣲖十民間受纍經山西撫臣奏請遂飭免刋是時直省惟江蘇所屬仍聽册報如舊時直省征納錢糧設立二聨印票一給納户一存有司有司竟有通同姦胥藉稱磨對將納户票強留不給遂有已完作未完多徵作少徵者二十八年創行三聨票法凡徵收錢糧及豆麥等項俱如數登填一存州縣一付差役應比一給納户執照如官吏掯不與填及無票付執許民間首告以監守自盜論是年飭各處榷關凡商民抵關交納後毋得稽留苛勒又諭江浙閩廣四處海關有沿海捕採魚蝦及民間日用貨物僅為糊口者免稅其海關各差一員管理嗣以閩海監督殷達禮言減閩海關額稅銀六千四百九十餘兩永為例先是國初定制紳襟户下不應差役因而民間多詭寄紳户紳襟亦自此包納銀米耗羡盡入於私甚至衙役兵丁亦得效尤免差通行包攬徭役不均官民皆纍二十九年乃令紳户將從前詭寄地畝盡還業户明年令直省州縣衛所悉照賦役全書科則勒石公署門外使民悉知是時惟貴州值兵燹荒廢正當招徠勸墾暫停勒石每遇嵗征先期曉諭三十三年設立山海關差専員管理稅務明年定山海關額稅時湖廣省里甲有大户小户之名小户輸賦付大户收取不敢自封投匱甚至大户驅使小户如奴隸然三十五年令小户别立里甲造册自納嚴革包攬之弊是年又令洋海商船但收貨物正稅免其雜費三十七年減粵海關額稅銀三萬二百八十餘兩著為例三十八年上諭向來偶因軍需費繁各關差於正額外以所得盈餘支納充用今思官差孰肯自捐私財勢必仍行苛虐自今一概停罷是時直省荒土盡闢又屢設法清丈升減俱符實數自截票串票三聫票行積弊漸清而民間猶有巧立名色有合邑通里共攤同出者名曰軟擡有各甲輪流獨當者名曰硬馱官吏豪民皆得以包攬分肥三十九年乃設立滚單法滚單者每里中或五户或十户止用一單於納户名下注明田畝若干該徵銀若干春應完若干秋應完若干分作十限每限應完銀若干給甲內首名挨次滚催令納户自封投匱不許里長銀匠匱役稱收一限若完二限又依次滚催法行民稱甚便四十年以湖南沅州龍陽靖州黔陽四州縣屯地有將賦役全書訛刋之數改正減免四十二年令州縣徵收串票分注漕項地丁數目四十四年以江南蘇松常鎮四府賦稅繁重奏銷時不能全完者量為輕減又豁免湖北江夏等十八州縣地課銀三百六十兩丈出坍地故也四十五年以湖南清浪平溪二衛屯糧艱於輸運改徵折色又丈出江西九江府屬濱江地畝三千七十餘頃上則改為下則五十一年四川巡撫年羮堯言川省荒地廣闢而見徵錢糧甫及原額十分之一宜立勸懲之法五年內有增及原額之四五分者即升不及一分者降調無增者參革御史假曦以為不可略言川省自明季兵燹地廣人稀我朝平定後雖屢經清查增報猶甫及原額十分之一今遽欲增及十分之四五是增見糧之三倍四倍賢能之員必罹參革不肖有司希圖升進必至抑勒首報滋弊無窮祇宜嚴飭有司實心勸首上如所議五十二年特諭廷臣曰民之生齒日繁朕故欲知人丁之實數不在加徵錢糧也嗣後止將見在錢糧册內有名丁數垂為定額其滋生人丁但核所增實數另造清册永不加賦尋以廷臣定議自康熙五十年額定人丁外新增者補足舊額缺數其餘謂之盛世滋生册永不加賦五十五年以鳳陽關稅務交巡撫經理五十七年以南新北新兩關交杭州捕盜同知經理時閩浙總督覺羅滿保言船貨往來臺灣必令到厦門盤驗護送但有泊處厦港者有自臺灣往四海關者宜分别在厦港貿易者照例徵抽往各海關者聽其在泊處報稅從之是年令湖北衛沔陽屯糧較湖南清浪衛減則征收以係水窪故也六十年以淮安關稅交江蘇巡撫經理時因關差多以虧欠獲罪有南新關監督詢之巡撫王度昭如何不致缺額度昭告以從寬征收自然饒足後如所言而驗明年世宗憲皇帝即位詔各關稅務悉交地方官經理所有羡餘該督撫題解應賞給者再行賞給雍正元年議定九江滸墅揚州西新蕪湖贛浙海閩海粵海太平橋均照淮安天津交與各撫委地方官兼理其崇文門仍差內務府官山海關左右兩翼古北口潘桃口殺虎口渾河等處照例差遣部曹按二年淮安關仍差部員滸墅關交蘇州織造管理是時屢飭督撫毋誤任屬員飭關差毋任信家丁縱容胥吏扶同作弊乃定直省征納錢糧該督撫於開征之始著該府遴選賢員與該州縣同封銀匱其委員以一二旬更替當衆拆封立即起解并坐委員以隱徇處分又詔部臣核減各關贏餘于是將淮安北新南新鳳陽天津臨江江海浙海荆州等九關加增贏餘悉行裁去先是康熙年間以浙江湖北山東三省匠班銀自明季相沿歷年已久而丁絶户存有司或派民户代完或自行賠補乃令勻派地內帶完厥後又以廣東丁銀就各州縣地畝分攤至是直隸巡撫李維鈞請以直屬丁隨地轉詔令廷臣集議於是議定直隸每地賦銀一兩攤入丁銀二錢七釐有竒嗣後各省計人派丁者次第改隨地畝矣按丁隨地起之例廣東四川已先行之此後惟奉天府民人入籍增減無數仍舊分征而山西省至乾隆十年始參用攤征之法其攤丁銀數各州縣按人丁多寡地賦廣狹分為等差初無一定大概每地一兩攤丁不過二錢二年移江西湖口榷關於九江口分設口岸於大姑塘時江西巡撫裴􅏍度清釐湖口盈餘奏請解部上以為數過多則必額外剝削商民乃諭關稅多少係於年嵗豐歉本難預定倘不及之年不可定求足數又諭各差歸併巡撫以為封疆大吏必能加惠商旅但各關津岸逺近不一所委家人難免額外苛求及勒取飯食之弊稍不遂欲則執送有司有司又以畏憚巡撫徇情枉法商民無所控告乃令各關差將應稅貨物征收則例逐項刋刷詳單遍示津口其從前豎立之木榜不許藏匿遮蓋又以徴收錢糧間有儒户宦户包攬令督撫曉諭糧户除去儒户宦户名目其州縣徴糧紅簿統於上年冬季申送布政司鈐蓋印信屆徵給州縣眼同納户登記上司􅌉查即取司印紅簿對驗其徵收卯簿該管官親對完欠不使假手户書倘納户銀色不足州縣官擇銀匠之信實者連名互保聽民投鋪傾銷旋諭民間納糧用自封投匱法本屬便民偶有短少令其增補每至多索應將原銀發還仍於原封內照數補足時有州縣虧空錢糧闔屬百姓代賠名曰樂捐其實強派上聞亟行禁止是年以山西巡撫諾岷言提解火耗歸公分給官吏養廉及他公用火耗者加於錢糧正額之外自明以來已有之蓋因本色折銀鎔銷之際不無折耗因而州縣征收不得不稍取盈餘以補耗羡之數行之既久州縣分送上司上司苛索州縣一切日用之資皆取給焉一遇公事重加征派名色繁多又不止於重耗而已至是諾岷請限定分數將州縣應得之項聽其如數扣存上以提解火耗使上司分火耗以養州縣誠為善策但約定分數將來竟成定額必致有增無減見在徵收錢糧皆百姓自封投匱同城官公同拆封起解耗羡正項同解州縣皆知重耗無益於己孰肯加徵若將應得之數扣存勢必額外取益浮於應得之數於是定為官給養亷之例是時天下草萊益闢通計直省田賦銀較康熙二十四年增至一百九十一萬八千有餘糧增至四十餘萬石三年上諭以蘇松浮糧聖祖時切軫念屢頒諭旨本欲核實裁減而彼時廷臣數以舊額相沿國課綦重執意覆奏且恐以一時減免倘後來國用不足又開議論之端是以從衆而止然屢蠲舊欠實與減額無異今國家帑藏充溢準將蘇州府正額蠲除三十萬兩松江府正額蠲免十五萬兩後又蠲江西南昌府額徵銀七萬五千五百五十兩時以川陜總督嶽鍾琪請定川省征收船料稅悉照淮關尺寸則例沿途地方官不得任意需索四年豁除雲南太和鄧州等處土軍丁銀緣前明設守防於太和鄧州等處因有土軍名色沿久既非承佃軍田之丁而納糧之外兼輸軍賦每丁額銀一兩十倍民丁不無苦纍悉令除之又諭州縣徵收火耗各省多寡不同倘有司於應取之外稍溢分數必罪五年減浙江嘉興府額徵銀四萬七千二百九十餘兩減湖州府額徵銀三萬九千九百九十兩臣等謹按蘇松嘉湖之賦獨重於他省者由明洪武初四府民人為張士誠固守明太祖惡之平定之後乃籍諸豪族及富民田以為守田按私租簿為稅額建文二年以太祖不過懲一時頑民豈可定為則例悉與減免畝不過一斗成祖盡革建文之政浙西之賦復重宣德以後屢減官田之額然官田與民田輕重終自懸殊至嘉靖之世乃行權宜之法併官民田為一例以官田之重稅攤入民田於是官佃之困少蘇而賦額之浮於他省者終不能議蠲我朝定鼎以來因陸續辦理軍需經費所在未遽裁減然聖祖加惠東南屢念及此舊逋新欠不時免蠲世宗仰承先志次第蠲免五十餘萬固徵仁恩之廣被亦以見承平日久泉府充溢云六年福建巡撫常賚請聽暹羅夷商來往厦門貿易照例征稅運米至江浙閩廣各關者亦如之得旨米穀不必上稅著為例又江蘇布政使髙斌奏滸墅關見行征收則例與部頒原額不同請飭部刋刻木榜豎立關口尋以部議並直省各關亦按見徵則例刋榜豎立又以夔州關稅照淮關例派差監督是年蘆溝橋蓋造安歇會試舉子官房工成飭崇文門查稅官嚴飭巡察人役毋稽留舉子借端苛索七年蠲除湖南武陵縣之宿郎堰水淹浮糧又命盛京户部侍郎會同奉天府尹清查該地田畝肥瘠分别上中下三等起科永為令向來奉天地畝概以上則征收緣彼處多有隱匿或三四畝祗報一𤱔者至是遣官清丈皆得實數故有是諭又以陜西朝邑縣與山西蒲州接壤界近黃河近因河流西徙東漲則西坍令清丈分界酌定二省錢糧應豁應徵之數定為額時直省俱有寄莊寄糧之名人地相隔有五六百里者至是順莊編里之法行悉歸就近完納先是各關收稅皆部頒號簿以便稽查而關差以船隻來往不齊未必日有收數因而設私簿徵收於報部時始將號簿挨日填造與商船過稅串票毫不相符上諭各關嗣後於部頒號簿填寫如無船隻過稅之日亦即注明免滋弊端是年以浙江南北兩關交該省織造辦理八年定徵收落地稅銀溢額議處之例凡地方官征收落地稅如有搜求需索致盈餘之數倍於正額令該督撫參革上司失察徇庇議處其實在盈餘者以八百兩為率準加一級至多不過三級永以為例按落地稅者在明季津頭小岸皆有零星抽分名色紛雜因為弊藪留國初已盡除之惟於市集輻輳之處帶征所收為本地公用報出多者準其加級猶恐地方官征取過多以圖議敘至是定以限制時倉場侍郎嶽爾岱言聫三版串之法應令有漕地方畫一通行嗣後州縣徵收糧米預將花户的名填入聫票如例納户經承州縣官分存對册完納即行截給歸農其未截給者即係欠户有糧無票有票無糧即係書吏侵蝕先是湖南永順府秋糧二百八十兩皆屬永順保靖桑植三土司交納名為秋糧實不從田畝徵收在永順名火坑錢保靖名鋤頭錢桑植名煙火錢火坑者民間炊爨每一坑徵銀二錢二分鋤頭者貧民種山一鋤入山納銀三五錢不等煙火錢與火坑相等所交錢糧即於此內撥解至于成熟之田土官多擇其肥者自種民間止得零星磽確之地每年雜派數次此土司徴民之陋規也自改土歸流之後有司按土户均攤或照土司舊册攤𣲖民已樂於輸納然無田之家尚以火坑等未除而有力之家隱占田畝多不輸稅至是特令豁秋糧一年其有産之家令一年自首官給印照為業有司按肥瘠定則一切雜派私徵永行禁止是年清釐四川田賦令額糧稍重之州縣照就近適中之科則核減徵輸十年定帶征江南逋欠限直省惟江南為財賦之區而積欠較他省倍蓰先是雍正三年江蘇巡撫張楷清查紅册自康熙五十一年至雍正元年惟蕭贛榆無欠泰州碭山儀徴江浦欠猶不過數百其嘉定長洲等四十七州縣積欠至八百八十一萬有竒請勻作十分每年帶征一分十年按數徵完其最多之州縣勻作十五分次多者作十二分上已敕部議行顧舊欠未清而新欠彌重於是特遣户部侍郎王璣刑部侍郎彭維新等會同地方官徹底清查通計各屬積欠一千一十一萬六千有竒其中官侵吏蝕者四百七十二萬六千有竒實在民欠者五百三十九萬有竒乃令侵蝕之項分作十年帶徴民欠之項分作二十年帶徴如本年帶徵之數完納若干即照所完之數蠲次年正額之數十一年令錢糧一錢以下準納制錢其錢以十文折銀一分凡大户零星尾欠及拆封短少在一錢以下者概準以錢折銀後又令小户距城路逺錢糧在一兩以下者準附大户投匱如數在一兩外及數少而願自交者仍遵例自封投匱十二年定四川夔州商稅以見在奏報七萬三千七百四十兩為定額其米稅額難定令該撫不時稽察飭監收官盡收盡解時以黔省永寧縣併歸四川詔將永寧稅裁革止留敘永廳稅其錢糧一切俱照川省例行按永寧縣與敘永􅈦同處一城從前􅈦隸四川縣隸貴州各設稅口征收鹽茶等課至是縣併蜀省止留稅􅈦十三年定寬徵錢糧之限定例地丁錢糧二月開徵五月停忙八月接徵十一月全完至是以物土異宜收獲早晚不同令督撫按地方情形酌量徴期不拘四月完半之數時給事中尚德言宣化府為南北通衢來往商貨經張家口居庸關上稅不應一貨兩徵乃過府之時張家口監督復委家丁照數重收致肩背擔負小物無不邀攔民情甚為不便又居庸關距張家口三百里監督勢難兼及因而差家丁攜印單征收書吏得以串通家人私用小票隱漏偷肥請定南北商貨已上張家口居庸關稅宣府不許重徵仍刋木榜豎立關口其居庸關另設稅課大使一員所收稅銀月解監督照宣府例日用小物免徵從之又特旨頒示天下凡市集落地稅在人煙湊集之處準照例徵收其鄉鎮村落全行禁革時有淮關監督年希堯於徐州所屬例應地方官徵收者改為關額私添稅口并市集買賣微物亦勒令上稅上知之交督撫究審并飭查明應徴之處歸地方官徴收應革者即行革除皇朝通志卷八十三
