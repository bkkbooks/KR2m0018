body:
  text: 欽定四庫全書皇朝通志卷六十七職官略四太常寺卿滿洲漢人各一人或禮部欽派大臣兼管掌祭祀禮樂之事初𨽻後歸本寺掌行少卿滿洲漢人各一人職任與卿同寺丞滿洲一人漢人二人典簿滿洲漢人各一人博士滿洲漢軍漢人各一人司庫滿洲一人協律郎漢人五人讀祝官滿洲八人贊禮郎滿洲二十四人漢人十四人司樂漢人二十三人歸禮部統轄筆帖式滿洲九人漢軍一人壇廟官漢人各天壇祀丞漢地壇尉滿洲各八人祠祭署奉祀一人人各一人大廟尉滿洲十人人洲八社稷壇尉滿洲五人祭署奉堂子尉滿日壇月壇祠祀各一人廟祠先農壇祠祭署奉祀祀丞各一人人委帝王祭署無専員以贊禮郎司樂內一理神樂署署正一人左右署丞各一人歸禮部統轄臣等謹按我國家惇崇祀典樂備禮明列聖相承無不敬天尊祖肅奉明禋凡遇郊廟大典躬行祼獻固非三代以後具文從事者所克比擬於萬一至樂官祀丞之屬初沿明制率用道流乾隆七年特奉詔禁止凡充太常樂員者毋得仍習道教祀事祇承於是益加嚴潔矣陵寢各官領一人永陵掌關防官一人副關防官兼內管副關防官兼尚茶正尚膳正二人筆帖式四人有六人永陵總管一人翼領二人防禦十福陵掌關防官一人副關防官二人尚茶正尚膳正各一人內管領一人筆帖式四人福陵總管一人翼領二人防禦十有六人世襲騎都尉一人雲騎尉品級官七人六品官一人七品官五人八品官四人昭陵掌關防官一人副關防官二人尚茶正尚膳正各一人內管領一人筆帖式四人昭陵總管一人翼領二人世襲一等侍衛兼二等輕車都尉一人防禦十有六人世襲雲騎尉四人雲騎尉品級二人世襲六品官七人以上俱滿洲員額掌守衛以三陵凡班直之令饗獻之禮灑掃之節咸時分司其事焉康熙十永陵總管等員康熙九年置掌關防等員一年置福陵昭陵掌關防總管等員俱順治十三年置又等永陵有副總領司香尚膳及國戚章京員千丁佐福陵有副茶領副膳領尚茶尚膳司香管領等員又國戚章京六十五員員昭陵有副總領尚茶尚膳司香管千丁佐領等又恩賜國戚防禦品級三員國戚章京二十員俱順治初年以來先後增置室貝勒東陵泰陵管理承辦事務衙門宗貝子公均無常員帥其屬東陵衛護時泰陵內務府總管各一人掌而嚴薦享以祗奉陵寢初康熙二年始除內大臣侍衛等守護孝陵康熙六十一年十二月建景陵領侍衛特命以王公守護别置大學士尚書侍郎內大臣內務府總管副都統散秩大臣除乾清門侍衛守護不乾隆二年定御前侍衛等員皆有缺泰陵人員貝勒二人公一人大臣官員十人侍衛十人皆奉事務旨除往尋設東陵泰陵承辦衙門各鑄給印章以守其政令陵之貝勒貝子公及內務府總管等同領焉守陵寢總兵官馬蘭鎮泰寧鎮各一人掌督帥官兵巡防遊徼以翼衛陵寢其內務府總管奉命兼攝者皆由中一特簡不為二例讀祝官昭西陵奉祀禮部郎人員外郎人二人贊禮郎四人筆帖式二人關防郎中一人兼管孝孝陵奉祀禮部掌東陵事務員外郎二人讀祝官二人贊禮郎四人筆帖式二人人贊孝東陵奉祀禮部員外郎二人讀祝官二禮郎四人筆帖式二人祝官二景陵奉祀禮部郎中一人員外郎二人讀人贊禮郎四人筆帖式二人人贊禮郎三景陵皇貴妃園寢讀祝官二人景陵妃園寢讀祝官二人贊禮郎三人東陵事泰陵奉祀禮部郎中一人兼管泰務員外郎二人讀祝官二人贊禮郎四人筆帖式四人人贊禮泰東陵奉祀禮部員外郎二人讀祝官二郎四人筆帖式四人郎三人泰陵妃園寢主事一人讀祝官二人贊禮孝賢皇后陵寢奉祀禮部郎中一人員外郎二人讀祝官二人贊禮郎四人筆帖式二人純惠皇貴妃園寢讀祝官二人贊禮郎三人端慧皇太子園寢讀祝官二人贊禮郎三人東陵承辦事務衙門主事二人筆帖式二人一人筆西陵承辦事務衙門主事一人委署主事帖式四人以上東陵宗室郎中一員外郎一主事一額郎中泰陵宗室員外郎一主事一餘俱滿洲員員外郎主事掌判署文案監視禮儀嵗供其品物以序祀事讀祝官掌讀祝詞奉制帛贊禮郎掌讃唱導引以詔行禮之節筆帖式掌繕録文移員額自康熙二年以來先後置乾隆二年定以孝陵奉祀禮部郎中為掌關防郎中凡各理有闕則掄選引見請陵事務皆令會同辦旨簡補四十六年改置宗室郎中員外郎主事共五人四人陵工部郎中一人員外郎四人筆帖式東泰陵工部郎中一人員外郎一人筆帖式四人泰東陵工部員外郎一人泰陵妃園寢工部主事一人掌嵗時修葺繕治之事祭祀熙二則供其楮幣官府所須咸給其器具焉員額自康年以來先後置事一人昭西陵內務府郎中一人員外郎一人主尚茶正尚膳正各一人內管領一人筆帖式二人一人尚孝陵內務府郎中一人員外郎一人主事茶正尚膳正各一人內管領一人內副管領一人筆帖式二人事一孝東陵內務府郎中一人員外郎一人主人尚茶正尚膳正各一人內管領一人筆帖式二人景陵內務府員外郎一人主事一人尚茶正一人尚膳正二人內管領一人內副管領一人筆帖式二人景陵皇貴妃園寢內務府員外郎一人尚茶副尚膳副各一人委署內副管領一人泰陵內務府員外郎一人主事一人尚茶正一人尚膳正二人內管領一人內副管領一人筆帖式二人泰東陵內務府郎中一人員外郎一人主事一人尚茶正尚膳正各一人內管領一人筆帖式二人泰陵妃園寢內務府主事一人內副管領一人人主孝賢皇后陵寢內務府郎中一人員外郎一事一人尚茶正尚膳正各一人內管領一人內副管領一人筆帖式二人純惠皇貴妃園寢尚茶副尚膳副各一人委署內副管領一人副端慧皇太子園寢內副管領一人尚茶副尚膳各一人以上俱內務府員額郎中員外郎主事掌奉祭祀奠享之禮掃除開闔之節藝林木剃草萊皆因時經理之尚茶尚膳正副掌熟俎之具蔬茹之品酏漿之用咸潔治而敬共之內管領內副管領掌餅餌飴蜜之物以時薦之筆帖式分掌文案員額康熙二年以來先後置昭西陵防禦十有六人驍騎校二人筆帖式二人昭西陵孝陵總管一人翼領二人俱兼管孝東陵事務防禦十有六人輕車都尉一人雲騎尉二人驍騎校二人筆帖式二人孝東陵防禦十有六人驍騎校二人筆帖式二人驍騎校景陵總管一人翼領二人防禦十有六人二人筆帖式二人人景陵皇貴妃園寢防禦四人驍騎校一景陵妃園寢防禦八人驍騎一人四泰陵驍騎校泰東陵總管一人翼領二人防禦十人五人筆帖式二人孝賢皇后陵寢總管一人翼領二人防禦十有六人驍騎校二人妃園寢防禦八人驍騎校一人端慧皇太子園寢防禦委署翼領一人防禦七人委署驍騎校一人以上俱滿洲員額總管翼領掌帥八旗官兵巡視守護防禦驍騎校掌守衛門户庫藏祭祀則共其几筵筆帖式分掌文案員額自康熙二年以來先後置臣等謹按我朝祀事加隆禮明儀備凡壇廟陵寢各官皆以敬供典禮其職掌之分見於禮部工部內務府太常寺者謹滙敘於此以昭崇重太僕寺卿滿洲漢人各一人掌兩翼牧馬場之政令凡隨蹕司慢城網城之事初附於兵部武庫司後析建衙署獨掌行之又初設有寺丞常盈庫漢大使主簿等官後俱裁少卿滿洲漢人各一人左司員外郎滿洲蒙古各一人主事滿洲蒙古各一人掌馱載駝隻以備巡幸之用初不分司乾隆六年始置左右二司各分職掌右司員外郎滿洲蒙古各一人主事滿洲蒙古各一人掌察驗牧場馬匹盈虧以時印烙主簿滿洲一人掌章奏文移筆帖式滿洲八人蒙古八人兩翼牧場官統轄兩翼總管一人以察哈爾副都統兼理兩翼總管各一人翼長各一人護軍校各四人張家口辦理牧場事務主事一人筆帖式一人俱掌張家口外兩翼牧場之事凡總管員闕於察哈爾佐領世爵及牧場翼長等官內選用翼長以下於護軍校等官選用皆由寺引本寺見注授張家口主事於主事筆帖式內選派臣等謹按秦漢以後戎馬皆養於官以太僕専司其事利害得失之由具詳史册我朝考牧精詳斯臧志慶即口外草肥土衍之地分置牧厰自太僕寺左右翼暨上都達布遜諾爾達里岡愛烏梁海大淩河以及蒙古部落孶牧蕃息雲錦成羣逺軼前古而哈薩克拔逹克山等部競以所産上貢天間牧廄豐盈標營充實按地分飼條格精詳牧政之善古今莫及也光祿寺卿滿洲漢人各一人或事初欽派大臣兼管掌祭饗宴勞酒醴膳饈之𨽻禮部後以精膳司所掌析歸本寺少卿滿洲漢人各一人大官署署正滿洲漢人各一人署丞滿洲二人掌肉修茹蔬之屬辨其物而共之珍饈署署正滿洲漢人各一人署丞滿洲二人掌及時獻其禽鮮以供祭祀燕饗良醖署署正滿洲漢人各一人署丞滿洲二人掌共祭祀燕饗之酒醴良醢署署正滿洲漢人各一人署丞滿洲二人掌共百事之鹽及果實醢醬之屬典簿滿洲漢人各一人掌章疏文移司庫滿洲二人掌庫帑出納筆帖式十八人順天府府尹漢人一人掌京畿之治理雍正元年以來又以部院大臣兼管府事皆由特簡其首領有經歷照磨司獄崇文門副使漢人各一人府丞漢人一人掌學校之政令治中漢人一人掌供文武鄉會試之饔餼通判漢人一人掌京城各市牙儈之籍而榷其常稅初設推官一人康熙六年裁臣等謹按順天府初止轄大興宛平二縣康熙十五年始以昌平良鄉等州縣併𨽻順天府今所屬自大興宛平以外凡州縣二十有五設東西南北四路同知以分領之皆兼統於直𨽻總督復特簡大臣兼管府事以重其任兹専敘京尹衙門於此至順天府所屬州縣各職俱分載直省各門故不另贅奉天府倣此鴻臚寺卿滿洲漢人各一人掌朝會賓客吉凶行禮傳贊之事諸藩入貢與夫百官之謝恩者並鴻臚引奏初𨽻禮部後歸本寺以禮部滿尚書總統之少卿滿洲漢人各一人職掌與卿同鳴贊滿洲十六人漢人二人掌儐導及行禮唱贊之事序班漢人四人掌序百官之班位主簿滿洲漢人各一人掌文移章牘筆帖式滿洲四人臣等謹按初設漢左右寺丞康熙五十二年裁國子監祭酒滿洲漢人各一人又諸生欽派大臣兼管掌成均之法以時程課每嵗仲春仲秋上丁祀卿先師則總其禮儀初兼太常寺少銜後停初𨽻禮部後歸本監司業滿洲蒙古漢人各一人職掌與祭酒同監丞滿洲漢人各一人職掌學規以督教課均廩糈博士滿洲漢人各一人掌闡明經説以助督課助教六堂漢人各一人分教直省俊選之士八旗官學助教滿洲十六人蒙古八人分教八旗子弟八旗官學漢教習由本監奏請考補三年期滿候用算法館助教漢人一人分教算學生俄羅斯學助教滿洲漢人各一人分教俄羅斯子弟俱由額設內掄選二人兼司之學正學録學正漢人四人學録漢人二人分𨽻六堂以掌教課典簿滿洲漢人各一人掌簿書文移典籍漢人一人掌經史以資諸生誦習筆帖式滿洲四人蒙古漢軍各二人臣等謹按成均之法為教化所由興我國家崇儒重道學校風行皇上親詣太學謨誥屢申乾隆四十八年復特命創建圜水辟雍斟今酌古度地鳩工事既蕆于五十年仲春上丁釋奠禮成躬臨講學蓋自元明五百年以來久未建置而大聖人久道化成聿昭茂典御製碑記發明復古之意槐市諸臣恭逢盛儀益當推廣教思興起多士也欽天監監正滿洲西洋各一人並步推特簡大臣兼理掌察天文定氣朔占候之事每嵗孟冬朔日呈奏明嵗時憲書移禮部頒行於天下初西洋監正名曰監修雍正三年更正所屬主簿二人初有漢監正後省監副滿洲漢人各一人左右監副西洋各一人時憲科五官正滿洲蒙古各二人掌譯布文字秋官正漢軍一人春夏中秋冬官正漢人五人各掌推驗之事五官司書漢人一人掌刋布時憲書博士滿洲三人漢軍二人漢人十有六人嵗以漢博士二掌直譙樓初設回回科後裁歸漢軍秋官正掌之天文科五官靈臺郎滿洲三人漢軍一人漢人四人五官監候漢人一人博士滿洲三人漢人二人掌視天象之垂書雲物以協嵗事漏刻科五官挈壺正滿洲漢人各二人五官司晨漢軍一人博士漢人六人掌調壷漏測中星審緯度相隂陽以諏時日而卜營建焉主簿滿洲漢人各一人掌章奏文籍筆帖式滿洲十一人蒙古四人漢軍二人天文生食俸者四十八人食糧者五十六人分𨽻三科各掌司推箅觀候之事隂陽生漢人十人𨽻漏刻科太醫院院使院判院使漢人一人左右院判漢人各一人掌醫之政令率其屬以供醫事御醫以下等官御醫十有五人吏目三十人醫士四十人醫員三十人俱漢人員額掌九科之法以治疾分班侍直給事宫中者曰宫直給事外廷者曰六直御醫等官初制增減不一後定設如今額聖賢後裔世職衍聖公掌奉爵至聖孔子闕里廟祀順治元年題準封一如前朝階正一品班列尚書上二年改六年依賜三臺銀印十三年依例授光祿大夫十例給清漢文三臺銀印乾隆十四年改給清漢篆文一品三臺銀印翰林院五經博士二十六人孔氏北宗一人南宗一人元聖周公復聖顔子宗聖曽子亞聖孟子先賢仲子閔子冉子伯牛冉子仲弓端木子言子卜子顓孫子有子周子明道程子伊川程子張子邵子後裔各一人朱子後裔二人先儒韓子後裔一人關氏後裔三人各掌奉祀之事聖裔太常寺博士一人掌奉聖澤書院祀聖裔國子監學録二人一奉尼山書院祀一奉洙泗書院祀聖裔國子監學正一人掌奉儀封聖廟祀聖裔世襲六品官一人掌分獻崇聖祠職國初仍前代曲阜用孔氏世知縣乾隆六年改為世襲六品官曲阜縣缺不必拘用孔氏四氏學教授一人學録一人掌訓課孔顔曽孟四氏生徒聖廟執事官四十人掌凡祭祀分獻及爵帛香祝之執事司樂等官司樂一人掌樂章樂器奎文閣典籍一人掌書籍及禮生屯田管勾一人掌祀田錢穀之出入林廟守衛司百户一人掌林廟之户籍知印一人掌書一人書寫一人掌公府文書印信奏差一人掌齊衍聖公章奏隨朝伴官六人掌隨衍聖公朝覲辦事臣等謹按聖裔世爵始自西漢若餘官則後漢始置百石卒史然至晉時已廢後魏孝文嘗官孔氏顔氏而亦未聞世襲也至唐末始以文宣公兼曲阜令宋時又置官學教授自是歷代相承遞有增設更元及明置官漸備然四時將享主鬯者雖膺上公之封而駿奔者不皆服官之侣至國朝設六等執事官然後牽牲贊采章紱輝煌真足以補前朝之闕典矣皇朝通志卷六十七
