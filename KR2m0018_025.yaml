body:
  text: 地理畧二疆域二河南省所屬府九直𨽻州四開封府省會領州二縣十四㕔一祥符附郭鄭州初屬府雍正二年升直𨽻州領滎陽滎澤河隂汜水四縣十二年改屬府河隂後省禹州初屬府雍正二年升直𨽻州領宻新鄭二縣十二年改屬許州府乾隆六年屬府陳留杞通許尉氏洧川鄢陵中牟蘭陽滎陽滎澤汜水三縣初屬府雍正二年屬鄭州十二年仍屬府密新鄭二縣初屬府雍正二年屬禹州十二年屬許州府乾隆六年仍屬府儀封㕔初為縣乾隆四十九年改㕔陳州府初為州屬開封府雍正二年升直𨽻州十二年升府領縣七淮寧附郭雍正十二年設商水初屬開封府雍正十二年屬府西華項城沈邱太康四縣初屬開封府雍正二年屬州十二年屬府扶溝初屬開封府雍正十二年屬府歸徳府領州一縣七商邱附郭睢州寧陵鹿邑夏邑永城虞城柘城彰徳府領縣七安陽附郭湯隂臨漳林内黄初屬直𨽻大名府雍正三年改屬府武安涉衛輝府領縣十汲附郭新鄉獲嘉淇輝延津初屬開封府雍正二年改屬府濬滑二縣初屬直𨽻大名府雍正二年改屬府考城初屬歸徳府乾隆四十八年改屬府封邱初屬開封府乾隆四十八年改屬府懷慶府領縣八河内附郭濟源原武初屬開封府雍正二年改屬府修武武陟孟温陽武初屬開封府乾隆四十八年改屬府河南府領縣十洛陽附郭偃師鞏孟津宜陽登封永寧新安澠池嵩南陽府領州二縣十一南陽附郭南召附郭順治十六年裁雍正十二年復設鄧州裕州鎮平唐泌陽桐柏内鄉新野淅川舞陽葉汝寧府領州一縣八汝陽附郭信陽州正陽上蔡新蔡西平遂平確山羅山陜州初屬河南府雍正二年升直𨽻州領縣三靈寳閿鄉二縣初屬河南府雍正二年屬州盧氏初屬河南府雍正十二年屬州汝州領縣四魯山郟寳豐伊陽許州初屬開封府雍正二年升直𨽻州十二年升府乾隆六年仍改直𨽻州領縣四臨潁襄城郾城長葛四縣初屬開封府雍正二年屬州十二年屬府乾隆六年仍屬州光州初屬汝寧府雍正二年升直𨽻州領縣四光山固始息商城四縣初屬汝寧府雍正二年屬州江南江蘇省初為江南省康熙元年分設安徽巡撫六年定為江蘇安徽二省所屬府八直𨽻州三㕔一江寧府省會領縣七上元江寧附郭二縣句容溧水江浦六合高淳蘇州府領縣九吳長洲元和附郭三縣雍正二年析吳長洲地置元和崑山新陽與崑山同城雍正二年析置常熟昭文與常熟同城雍正二年析置吳江震澤與吳江同城雍正二年折置松江府領縣七華亭附郭婁附郭順治十三年設奉賢金山二縣雍正二年設上海南滙雍正二年設青浦雍正二年分設福泉縣旋併入青浦常州府領縣八武進附郭陽湖附郭雍正二年設無錫金匱與無錫同城雍正二年析置江隂宜興荆溪與宜興同城雍正二年析置靖江鎮江府領縣四丹徒附郭丹陽金壇溧陽初屬江寧府雍正二年改屬府淮安府領縣六山陽附郭阜寧雍正九年設鹽城清河安東桃源揚州府領州二縣六江都附郭甘泉附郭雍正九年設高郵州泰州儀徴興化寳應東臺乾隆四十年設徐州府初為直𨽻州雍正十一年升府領州一縣七銅山附郭雍正十一年設邳州初屬淮安府雍正二年升直𨽻州十一年屬府蕭碭山豐沛四縣初屬州雍正十一年屬府宿遷睢寧二縣初屬淮安府雍正二年屬邳州十一年改屬府太倉州初屬蘇州府雍正二年升直𨽻州領縣四鎮洋與太倉州同城分治雍正二年設崇明嘉定二縣初屬蘇州府雍正二年屬州寳山雍正二年設海州初屬淮安府雍正二年升直𨽻州領縣二贛榆沭陽二縣初屬淮安府雍正二年屬州通州初屬揚州府雍正二年升直𨽻州領縣二如臯泰興二縣初屬揚州府雍正二年屬州海門㕔初為海門縣屬揚州府雍正二年屬通州乾隆四十年特設為㕔江南安徽省初為江南省康熙元年分設安徽巡撫六年定為安徽省所屬府八直𨽻州五安慶府省會領縣六懷寧附郭桐城潛山太湖宿松望江徽州府領縣六歙附郭休寧婺源祁門黟績溪寧國府領縣六宣城附郭寧國涇太平旌徳南陵池州府領縣六貴池附郭青陽銅陵石埭建徳東流太平府領縣三當塗附郭蕪湖繁昌廬州府領州一縣四合肥附郭無為州廬江舒城巢鳯陽府領州二縣五鳯陽附郭夀州宿州懷逺定逺鳯臺雍正十一年設靈壁潁州府初為州屬鳯陽府雍正二年升直𨽻州十三年升府領州一縣五阜陽附郭雍正十三年設亳州初屬鳯陽府雍正二年升直𨽻州十三年屬府潁上霍邱二縣初屬鳯陽府雍正二年屬州十三年屬府太和䝉城二縣初屬鳯陽府雍正二年屬亳州十三年屬府和州領縣一含山滁州領縣二全椒來安廣徳州領縣一建平六安州初屬廬州府雍正二年升直𨽻州領縣二英山霍山二縣初屬廬州府雍正二年屬州泗州初屬鳯陽府雍正二年升直𨽻州領縣三旴𣅿天長五河三縣初屬鳯陽府雍正二年屬州江西省所屬府十有三直𨽻州一南昌府省會領州一縣七南昌新建附郭二縣寧州進賢奉新靖安武寧豐城饒州府領縣七鄱陽附郭餘干樂平浮梁徳興安仁萬年廣信府領縣七上饒附郭玉山弋陽貴溪鉛山廣豐興安南康府領縣四星子附郭都昌建昌安義九江府領縣五徳化附郭徳安瑞昌湖口彭澤建昌府領縣五南城附郭新城南豐廣昌瀘溪撫州府領縣六臨川附郭金溪崇仁宜黄樂安東鄉臨江府領縣四清江附郭新淦新喻峽江吉安府領縣九㕔一廬陵附郭泰和吉水永豐安福龍泉萬安永新永寧蓮花㕔瑞州府領縣三高安附郭新昌上高袁州府領縣四宜春附郭分宜萍鄉萬載贛州府領縣八㕔一贛附郭雩都信豐興國會昌安逺長寧龍南定南㕔南安府領縣四大庾附郭南康上猶崇義寧都州初為寧都縣屬贛州府乾隆二十年升直𨽻州領縣二瑞金石城二縣初屬贛州府乾隆二十年屬州福建省所屬府十直𨽻州二福州府省會領縣十閩侯官附郭二縣古田閩清屏南雍正十二年設長樂連江羅源永福福清泉州府領縣五晉江附郭南安恵安安溪同安建寧府領縣七建安甌寧附郭二縣建陽崇安浦城政和松溪延平府領縣六南平附郭將樂沙尤溪順昌永安汀州府領縣八長汀附郭寧化上杭武平清流連城歸化永定興化府領縣二莆田附郭仙遊邵武府領縣四邵武附郭光澤泰寧建寧漳州府領縣七龍溪附郭漳浦南靖長泰平和詔安海澄福寧府初為直𨽻州雍正十二年升府領縣五霞浦附郭雍正十二年設福鼎乾隆三年設福安寧徳二縣初屬州雍正十二年屬府夀寧初屬建寧府雍正十二年屬府臺灣府康熙二十四年設領縣四臺灣附郭鳯山諸羅三縣康熙二十四年設彰化雍正三年設永春州初為縣屬泉州府雍正十二年升直𨽻州領縣二徳化初屬泉州府雍正十二年屬州大田初屬延平府雍正十二年屬州龍巖州初為縣屬漳州府雍正十二年升直𨽻州領縣二漳平寧洋二縣初屬漳州府雍正十二年屬州浙江省所屬府十有一杭州府省會領州一縣八錢塘仁和附郭二縣海寧州初為縣乾隆三十八年升州富陽餘杭臨安於潛新城昌化嘉興府領縣七嘉興秀水附郭二縣嘉善海鹽石門初為崇徳縣康熙元年改平湖桐鄉湖州府領縣七烏程歸安附郭二縣長興徳清武康安吉初為州乾隆三十八年改縣孝豐寧波府領縣六鄞附郭慈谿奉化鎮海初為定海縣康熙二十六年改定海康熙二十六年由舟山衛改設象山紹興府領縣八山陰會稽附郭二縣蕭山諸暨餘姚上虞嵊新昌台州府領縣六臨海附郭黄巖天台仙居寧海太平金華府領縣八金華附郭蘭谿東陽義烏永康武義浦江湯溪衢州府領縣五西安附郭龍游江山常山開化嚴州府領縣六建徳附郭淳安桐廬遂安夀昌分水温州府領縣五永嘉附郭瑞安樂清平陽泰順處州府領縣十麗水附郭青田縉雲松陽遂昌龍泉慶元雲和宣平景寧皇朝通志卷二十五
