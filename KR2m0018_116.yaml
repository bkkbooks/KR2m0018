body:
  text: 欽定四庫全書皇朝通志卷一百十六金石畧二石一内府臣等謹按列聖奎章皇上宸翰其奉頒發模勒太學鐫刻名勝祠宇以及通行直省翠墨流播煥若日星薄海内外罔不仰瞻效法珍藏世守至於内廷祕刻非奉賞賚不能寓目尤藝林所希覯也兹敬謹排類列於石刻之首為一卷御書清愼勤三大字康熙十六年正書臣等謹按聖祖仁皇帝御書清愼勤三大字又刻於廣西臨桂虞帝廟御書龍飛鳯舞四大字康熙十六年正書後有沈荃恭題七言絶一首并跋御書千字文康熙十八年正書御製昇平宴集詩帖康熙二十一年行書臣等謹按昇平宴集栢梁體詩聖祖仁皇帝御書序文詩則沈荃奉勅書也御製乾清宫宴集詩帖康熙二十一年正書臣等謹按乾清宫宴集栢梁體詩聖祖仁皇帝御書序文其詩亦沈荃奉勅書與宴者勒徳洪以下九十三人御書行殿讀書賦帖康熙二十三年書御製并書行御書孝經康熙二十四年正書御書暢春園記康熙二十七年書御製并書行御臨趙孟頫平泉圖記帖康熙二十九年行書御臨趙孟頫輞川詩帖康熙二十九年行書御臨趙孟頫秋聲賦帖康熙二十九年行書欽定懋勤殿法帖康熙二十九年奉㫖模勒上石臣等謹按聖祖仁皇帝欽定懋勤殿法帖凡二十六卷前四卷刻歴代帝王書又世祖章皇帝御書十二種聖祖仁皇帝御書二十九種其自五卷至二十四卷刻歴代名臣書二十五卷二十六卷刻本朝臣工孫承澤沈荃史鶴齡張英米漢雯孫岳頒等六人書其中有御臨樂毅論蘭亭帖聖教序智永千文禇遂良負苓者傳顔眞卿告身蘇帖四種米帖五種趙帖七種董帖三種又御製曹娥碑跋蘭亭跋不自棄文跋均刻於原帖之後御書小楷百家姓康熙三十一年正書御臨董其昌書金剛經康熙三十二年正書御書草訣百韻帖康熙三十三年草書御書淵鑑齋法帖康熙三十三年奉㫖模勒上石臣等謹按御書淵鑑齋法帖十卷臨橅歴代法書而趙董為多後有米漢雯宋駿業請摹刻御書奏摺二通卷末列排類校對諸臣銜名御書靖邊帖康熙三十五年行書臣等謹按靖邊帖乃聖祖親征朔漠御製勒石紀功之銘刻於察罕齊老拖諾山昭木多狼居胥四處銘詞四言此則内廷重刻之本也御書懋勤殿法帖康熙三十八年奉㫖模勒上石臣等謹按御書懋勤殿法帖八卷前二卷恭刻世祖章皇帝御書聖經七佛偈陋室銘三種三卷以下恭刻聖祖御書御臨各種其中如周公廟孔子廟諸碑皆另有碑石此則諸臣彚刻成帙者也御書大字千字文康熙三十九年行書臣等謹按御書大字千字文係臨米芾賜呉琠者今沁州另有石刻御書萬夀帖康熙三十九年正書奉㫖模勒上石臣等謹按萬夀帖乃聖祖御製恭祝皇太后萬夀無疆賦亦稱尊親帖御書心經塔圖康熙四十二年正書御書避暑山莊記康熙五十年正書御書正大光明四大字康熙五十年正書御書佩文韻府序康熙五十年正書御書唐詩選序康熙五十二年正書御書朱子全書序康熙五十二年正書御書大字心經康熙五十二年行書御書溥仁帖康熙五十三年正書臣等謹按溥仁帖即御製溥仁寺碑也今承徳府另有碑石御書多心經康熙五十四年正書御書避暑山莊法帖康熙五十五年蔣漣等奉㫖摹勤上石臣等謹按御書避暑山莊法帖五卷眞行大小不等内如避暑山莊記朱子全書序唐詩序韻府序各種内府另有專刻此亦彚刻本也御書金剛經康熙六十年正書御書裴潾劄子行書臣等謹按裴潾疏帖御題云此文言正而理順故倣董其昌筆意書之右聖祖仁皇帝御書石刻御製得雨詩帖雍正二年七言律行書御製九日宴集詩帖雍正四年行書臣等謹按九日宴集栢梁體詩世宗憲皇帝御製序文并書其詩則果親王允禮奉勅書也御刻金剛經塔圖正書御書魏徴十思疏雍正四年行書臣等謹按世宗憲皇帝御書十思疏敬刻金剛經塔圖碑隂御書朗吟閣法帖乾隆元年奉石㫖模勒上臣等謹按御書朗吟閣法帖凡十六卷乃世宗憲皇帝潛邸所書進呈詩賦以及雜臨唐宋以來名人書蹟末刻乾隆三年皇上御跋二則御書四宜堂法帖乾隆元年奉石㫖模勒上臣等謹按御書四宜堂法帖凡八卷乃世宗憲皇帝御極以後所書内御製詩文居多亦有另立碑石者如御製黑龍潭碑闕里孔廟碑之類右世宗憲皇帝御書石刻御製得雪詩乾隆元年七言律一首行書御製畊織圖詩帖乾隆四年行書臣等謹按耕織二圖毎圖二十三事首幅恭刻康熙三十五年聖祖御書序文乾隆四年皇上御書序文毎幅首列縁起又聖祖御製七言絶句一章皇上御製七言絶句一章末刻于敏中等恭跋御書示大學士詩乾隆五年五言古一首行書御書太上黄庭内景外景二經乾隆九年正書御書常清浄經乾隆九年正書御書黄庭經乾隆九年正書御臨鍾繇薦季直表並題七言絶句一首乾隆十八年御書妙法蓮華經乾隆十九年正書臣等謹按是卷前繪佛像後有御跋又蔣溥等恭跋御書天馬賦乾隆二十年行書御書敬勝齋法帖乾隆二十六年蔣溥等奉㫖模勒上石臣等謹按御書敬勝齋法帖四十卷自一卷至十二卷皆御製詩文十三卷以下御書御臨各種法帖大小行楷不一諸臣謹跋皆附刻於御書各種之下御畫文殊像乾隆二十六年像左鐫并鐫御製五言律詩御贊像右御跋俱行書御製手植檜詩并畫乾隆三十三年七言絶一首行書御製西畨蓮賦并畫乾隆四十年行書下方鐫于敏中梁國治詩各一首御書擬白居易新樂府帖乾隆四十二年行書御題吉祥天母贊乾隆四十二年四言行書臣等謹按御題吉祥天母贊國書正書蒙古西畨四體書下有畫像御書月令七十二候詩帖乾隆四十四年行書御書懐舊詩帖乾隆四十四年五言古行書御書古稀説乾隆四十五年行書御書言志詩乾隆四十六年五言古行書御書改教詩乾隆四十六年五言古行書御書知過論乾隆四十六年行書御製青松詩并畫乾隆四十六年五言古一首行書御書通鑑綱目續編内發眀廣義題辭乾隆四十七年行書御筆詩帖並畫蘭乾隆四十九年行書臣等謹按一刻乾隆甲戌御臨趙孟頫書東坡詩行書下繪蘭花又一石刻御製七言律詩并跋行書下附刻張照臨黄庭外景一叚小楷書御書經筵御論大學樂只君子節乾隆五十年行書臣等謹按御書經筵御論首列大學詩云樂只君子一節御跋云此壬戌春御論中不自謂能盡父母之道而翰臣繕寫綾本誤作君子二字刻本亦沿訛未改今正之御書題養正圖詩乾隆五十一年行書臣等謹按題養正圖詩乃乾隆二十三年御製凡詩六十首五十一年重書末有御題跋右皇上御書石刻御定李邕帖康熙三十四年奉㫖上石臣等謹按聖祖仁皇帝御定李邕帖一大照禪師碑一牡丹詩御刻曹娥碑臣等謹按曹娥碑舊本有前人跋二通聖祖御跋拉薩哩恭紀沈荃書劉源高士竒審定欽定三希堂石渠寳笈法帖乾隆十二年臣等謹按欽定三希堂法帖三十二卷卷首恭刻諭㫖前二卷起鍾繇至王珣書三卷起梁武帝至顔眞卿書四卷孫䖍禮書五卷懐素至楊凝式書六卷七卷起宋太宗至孝宗書八卷至十七卷皆宋人書十八卷至二十二卷趙孟頫書末附管道昇書二十三卷至二十八卷元明人書二十九卷至三十二卷董其昌書帖中御書題跋分列各卷者共四十則末刻梁詩正等恭跋及總理排類諸臣銜名御定墨妙軒法帖乾隆十二年臣等謹按御定墨妙軒法帖四卷自唐褚遂良至元趙孟頫凡十八人書分為四卷卷中恭刻御書題跋三則二卷有御書懐素苦笋帖釋文并跋末有蔣溥等恭跋帖石嵌萬夀山之恵山園墨妙軒兩壁間御刻小字蓮華經乾隆二十四年正書臣等謹按小字蓮華經唐僧義道與其妹為親薦福而書譬喻品結語中脱去十四句凡五十六字奉㫖即取經中所有字補足有眀僧道衍跋乾隆辛未上因其餘幅御書心經於後並跋末刻王鴻緒原跋蔣溥等恭跋御刻淳化閣帖乾隆三十四年臣等謹按淳化閣帖翻刻寖多初搨絶尠皇上嘉恵藝林擇内府所蓄畢士安賜本命于敏中等詳加考正釋文旁註鉤摹上石砌於藴眞齋之廊更名淳化軒凡十卷每卷各有御識前勒乾隆三十四年御筆諭㫖又三十六年御製淳化軒記冠於卷端御刻四體書七佛偈乾隆三十八年臣等謹按御刻七佛偈分國書正書西畨䝉古四體書上繪七佛像御刻蘭亭八柱帖乾隆四十四年臣等謹按御刻蘭亭八柱帖内前三冊為虞世南褚遂良馮承素模本四冊為柳公權書蘭亭詩五冊為戲鴻堂刻柳公權書蘭亭詩六冊為御勅于敏中補柳公權書蘭亭詩七冊為董其昌倣柳公權書蘭亭詩八冊為御臨董其昌倣柳公權書蘭亭詩卷首御題五言排律一首卷中御題七言絶六首七言律四首御跋四又于敏中恭和御製元韻七言律一首御刻趙孟堅落水蘭亭帖乾隆四十七年臣等謹按趙孟堅所藏蘭亭帖即定武石刻也有姜夔趙孟頫跋落水始末見孟堅自跋御題山隂眞面四大字御製七絶四首末有和珅等恭和作欽定快雪堂帖馮銓原本臣等謹按快雪堂帖五卷故臣馮銓原刻後歸閩中黄氏督臣楊景素購進内顔眞卿鹿脯帖蘇軾書三種米芾書三種原本木刻奉㫖重易以石并御書快雪堂記一篇御題七律二首帖石嵌快雪堂兩廊原刻木版並弆堂中右御刻厯代法帖欽定夢墨樓帖陳奕禧書臣等謹按夢墨樓帖十卷陳奕禧書大小眞行備載雍正十二年奉㫖模勒上石御製落葉詩帖乾隆七年張照奉勅正書臣等謹按御製落葉詩七律六首張照奉勅書羣臣和者自鄂爾㤗以下凡二十三人並刻於後御製柳絮詩帖乾隆八年張照奉勅行書臣等謹按御製柳絮詩七律五首張照奉勅書羣臣和者自鄂爾㤗以下凡十六人并刻於後欽定天瓶齋法帖張照書乾隆二十二年奉㫖模勒上石臣等謹按天瓶齋帖十卷張照書前三卷皆奉勅書及恭録御製詩文四卷至八卷恭刻御筆墨蘭并御題一則及雜臨各帖九十兩卷則其自書也欽定時晴齋帖汪由敦書乾隆二十三年奉㫖模勒上石臣等謹按時晴齋帖汪由敦書前二卷奉勅書三卷恭錄御製詩文四五六卷雜臨各帖七卷以下皆其自書御製盛京賦四體書臣等謹按御製盛京賦眞草𨽻篆四體書帖眞書為勵宗萬草書為梁詩正𨽻書為張若靄篆書為汪由敦冊高二寸許筆細如髮御刻萬福集成讚乾隆三十六年臣等謹按萬福集成讚彭元瑞恭集聖教序字綴輯成文恭進奉㫖以内府珍弆舊拓本鉤摹上石御製七佛塔碑記乾隆四十二年書國書正書䝉古托忒四體書其正為于敏中奉敕書右御刻臣工書乾清宫宴集栢梁體詩帖乾隆四年書御製序行臣等謹按乾清宫宴集聨句諸臣自顯親王衍福等以下凡九十九人御製序文并書其聨句詩則梁詩正奉勅書也元宵聨句乾隆八年自張廷玉以下凡十六人五言排律梁詩正奉敕正書燈夕錫宴聫句乾隆八年自鄂爾㤗以下凡十二人七言排律梁詩正奉勅正書澄海樓聫句乾隆八年梁詩正張照扈從奉盛京聫句五言排律梁詩正巡幸正勅書重華宫賜宴聫句乾隆十年自張廷玉以下凡十二人五言排律梁詩正奉勅正書重華宫聫句乾隆十一年自莊親王允禄以下凡十八人七言排律梁詩正奉勅正書流杯亭聫句乾隆十一年自張廷玉以下凡四十五人五言排律梁詩正奉勅正書惇叙殿賜宴宗室栢梁體聫句乾隆十一年自和碩康親王以下凡一百三人七言排律莊親王允禄奉勅正書爆竹聫句乾隆十二年自張廷玉以下凡十六人五言排律梁詩正奉勅正書燈夕錫宴聫句乾隆十五年自傳恒等以下凡二