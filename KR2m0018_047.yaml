body:
  text: 欽定四庫全書皇朝通志卷四十七禮略凶禮臣等謹按鄭樵通志凶禮門列大喪及山陵制至朋友相為服諸目內如天子弔大臣服天子為大臣及諸親舉哀諸侯及公卿大夫為天子服皇太后長公主及三夫人以下為天子服杖四條皆綜括於典禮中初不必另述為條目至如挽歌秀孝為舉將服郡縣吏為守令服師弟子相為服朋友相為服五條皆因時設義不必垂為定制兹謹略諸目惟述本朝典制之大者載於篇中恭惟我朝以純孝治天下列聖列后大事定行三年之喪一切禮儀斟酌古今慎重賅備歷稽古昔未有若斯之盡禮盡哀者謹依會典通禮所載序列聖大喪儀列后大喪儀而皇貴妃以下喪儀皇子以下喪儀以次序列至服制之設通行於天下者誠為盡倫盡制經常不易之恆典謹附著於篇末以昭成法焉列聖大喪儀凡列聖大喪初喪嗣皇帝就主喪位冠去緯哭踊宫中自皇后以下咸摘耳環去首飾屆時恭奉梓宫奉安於宫中正殿設几筵建丹旐於宫門之左陳法駕鹵簿於宫門之外至太和門外特簡王公大臣恭理喪儀既斂乃奠王公以下民公侯伯子男以上二品官於乾清門外三品以下文武有頂帶官於景運門外皇后妃嬪宫人公主皇子皇孫福晉及近支王公福晉夫人於几筵殿內諸王公福晉夫人郡主縣君以上二品夫人於丹墀右三品淑人以下於隆宗門外齊集哭臨皆男摘冠緯女去首飾奠獻時皆隨行禮舉哀畢各退皇帝成服截髮辮居倚廬皇子皇孫隨成服截髮辮居宫中别室王公百官宗室覺羅咸成服截髮辮旗員居闕左門外漢員於各官署皇后率妃嬪等成服翦髮皇子皇孫福晉隨成服翦髮諸王福晉命婦及內府三旗官員護軍等妻咸成服翦髮皇帝行三年喪禮百日內上諭用藍筆百日後素服御門聼政郊壇大祀祭服行禮詣几筵前仍喪服諸皇子皇孫及恭理喪儀王公大臣殯宫守衛執事各官百日除服羣臣二十七日除服咸百日剃髮奏疏文移二十七日內皆用藍印京朝官二十七月不作樂期年不嫁娶在京軍民人等二十七日素服百日不作樂一月不嫁娶頒遺詔於天下直省官期年不作樂百日不嫁娶不剃髮軍民去冠緯素服二十七日百日不作樂一月不嫁娶成服後朝晡日中三設奠朝夕奠設法駕鹵簿三日後至一月設鑾駕鹵簿每奠王公百官咸齊集質明皇帝出倚廬詣几筵前東立西嚮舉哀乃啓宫門恭理喪儀王大臣及執事官率尚茶尚膳舉茶膳由中門中路進至几筵前尚茶跪進茶內外齊集衆咸跪皇帝親舉茶恭奠於茶几行一拜禮衆皆隨行禮尚茶徹茶衆皆興次尚膳進膳皇帝親上食畢執事官進奠几於正中皇帝詣几前跪進爵王大臣跪進爵皇帝祭酒三爵每祭行一拜禮衆皆隨行禮興乃徹饌出闔門衆哀止皇帝還倚廬衆皆退午奠晡奠儀同諏日行殷奠禮王公百官公主福晉命婦咸齊集所司陳設皇帝詣几筵前視饌上食舉哀讀祝官奉祭文至閾外正中北面跪禮部堂官二人跪展祭文進奠几皇帝於几前跪衆於齊集處跪哀暫止讀文畢仍復於案退衆舉哀乃進爵皇帝祭酒三爵每祭行一拜禮衆隨行禮舉哀畢徹俎豆讀祝官奉祭文禮部堂官前引侍臣奉冠服自殿陛內大臣十人前引恭送燎所皇帝舉哀隨行詣燎所內大臣侍衛扈從齊集王公百官咸從皇帝於燎所祭酒三爵行禮舉哀衆隨舉哀行禮畢皇帝還倚廬乃焚冠服楮帛衆各退諏日而殯先期以奉移梓宫祇告几筵行啓奠禮禮儀與殷奠同至日奉移梓宫於殯宫豫為大升舉於景運門外屆時皇帝詣几筵舉哀執事官進奠几皇帝祭酒三爵恭理喪儀王公大臣鑾儀衛工部堂官率校尉恭進小輿奉梓宫出登大升輿禮部尚書祭輿焚楮帛內大臣祭所經門橋皆三祭酒每祭行一叩禮焚楮帛皇帝步送王公百官各以次隨行皇后率妃嬪等先詣殯殿後左旁恭俟靈駕至行奉安禮皇帝祭酒舉哀衆隨行禮舉哀畢焚楮帛丹旐各退以側殿為苫次二十七日後還居倚廬行初祭禮設法駕鹵簿於殯宫大門外陳設畢皇帝親詣上食祭酒如前儀翼日繹祭遣官行禮如儀行大祭禮與初祭儀同翼日繹祭如儀周月讀文致祭與啓奠同王公九卿及文武官承旨恭擬尊諡廟號進呈御覽敕所部製玉册寶香册寶絹册寶諏吉恭行上尊諡禮前期遣官祗告天地太廟後殿奉先殿社稷至日設鹵簿於殯宫大門外陳設畢皇帝素服御太和門恭閲册寶畢行一跪三拜禮退立東旁大學士詣案前一跪三叩恭奉册寶降階陳於各黃亭跪叩如前校尉舁亭御仗黃蓋前導王以下入八分公以上齊集協和門外册寶亭至候過隨行皇帝還宫易喪服豫詣殯宫側殿祗俟贊引太常卿二人恭導皇帝由左門入贊奏就位皇帝就位立贊跪拜興皇帝率羣臣行三跪九拜禮興奏跪皇帝率羣臣跪典儀奏進册大學士詣案奉册跪獻於左皇帝受册拱舉授禮部堂官跪接興奉安於案三叩退進寶由右儀亦如之乃宣册宣寶皇帝率羣臣行三跪九叩禮乃奠帛讀祝三獻爵如儀禮成恭奉祝帛絹册絹寶送燎所由中道出皇帝轉立拜位旁西嚮候過復候燎半奏禮成皇帝還宫衆皆退翼日頒詔天下百日奠獻儀與初祭同既卜葬吉奉移山陵前期遣官祗告天地太廟社稷前奉移一日行祖奠禮儀與啓奠同祭畢焚鑾駕鹵簿至日執事官陳大升輿於殯宫大門外設册寶亭於階下皇帝詣梓宫前舉哀祭酒三爵衆隨行禮畢皇帝先至大門東旁立俟奉移梓宫出跪候過步隨行梓宫登大升輿禮部尚書祭輿三祭酒行三叩禮畢焚楮帛靈駕發册寶亭及騎駕鹵簿咸前列沿途分站豫設蘆殿繚以黃幔城皇帝步送至郊皇太后以下亦先往祗俟王公大臣官員侍衛內監等隨輿所過門橋遣內大臣祭酒焚楮帛靈駕將至宿次皇帝率王公百官舉哀跪迎靈駕安奉於蘆殿乃行晡奠如儀奠畢皇帝還行宫衆皆退翼日昧爽行朝奠如儀皇帝跪送啓行步送里外仍先詣宿次如儀臣等謹按孝聖憲皇后大喪皇上恭奉梓宫至泰東陵路經泰陵之東清晨皇上先展謁泰陵次詣泰東陵閲視工程畢豫至泰陵分路處候梓宫至暫停皇上於道旁躬代向泰陵展叩行禮畢再奉啓行先是會典未有此禮禮臣亦未經議及皇上孝思隆篤禮以義起垂為萬世法守因敇部載入會典通行至陵日守陵貝勒公大臣官員咸於十里外舉哀跪迎靈駕至隆恩門外降大升輿安奉梓宫於隆恩殿皇帝祭酒三爵衆隨行禮舉哀是日遣官祭告各陵寢並祭后土皇陵山神翼日行饗奠禮儀如祖奠臣等謹按饗奠之禮舊稱遣奠載於會典乾隆四十二年皇上恭奉孝聖憲皇后山陵之禮奉諭遣字義涉輕忽稱用殊不安於心因命儒臣稽所自昉大學士等覆奏遣奠之稱禮經並無明文惟見於孔穎達士喪禮疏唐以後相沿用之蓋穎達第用儀禮葬日將行苞牲體之車名為遣車遂取遣字為奠名牽合無當復考儀禮將行之祭徹巾苞牲鄭康成注云象既饗而歸賓俎也又禮記雜記云大饗既饗卷三牲之俎歸於賓館所以為哀也鄭注云既饗歸賓俎言孝子哀親之去也是將行之祭原用饗禮舊稱遣奠似不若作饗奠為長既與鄭注相合稱名亦理得心安並請敕部更正從之謹識於此以著饗奠稱名之所自始焉大葬前期行遷奠禮儀如饗奠恭理喪儀王大臣等率夫校進小輿奉移梓宫於寶城前蘆殿恭奉梓宫登龍輴進饌筵皇帝祭酒三爵衆隨行禮舉哀畢駕還行宫衆皆退至日皇帝詣梓宫前祭酒屆吉時恭移龍輴自隧道入地宫安奉寶牀設香册寶於左右几遂掩閉元宫皇帝於方城前舉哀祭酒行禮畢卒哭出至幄次易吉服王公百官咸采服禮部堂官奏請皇帝詣隆恩殿行題主禮皇帝入殿左門就拜位立大臣一人啓櫝奉神主設於題主案大學士二人朝服詣案東行一跪三叩禮興就位西嚮恭題神主畢大臣奉主安於寶座三叩退乃行虞祭禮皇帝就拜位王公百官各就拜位上香奠帛讀祝三獻爵送燎均如儀禮成鑾儀衛堂官率校尉舁黃輿設階上正中南嚮太常卿跪奏恭請神位升祔太廟皇帝詣寶座前行一跪三拜禮恭奉神主奉安黃輿內行一跪三拜禮興內大臣十人大學士禮部堂官導引啓行皇帝率王以下各官於大門外跪候過先詣塗次黃幄祗俟沿途朝夕奠皇帝親詣上香行三跪九拜禮還京升祔太廟期年小祥讀文致祭張黃幄於皇陵方城前陳俎豆列饌筵於祭臺左右皇帝喪服詣黃幄內奠獻隨往之王公百官咸於陵寢門外隨行禮舉哀與前祖奠同再期大祥儀與期年同二十七月行除服禮皇帝喪服於皇陵方城前行奠獻禮儀與百日奠獻同祭畢除服三周行禮儀同再期列后大喪儀凡列后大喪聖子皇帝主喪儀初喪恭奉梓宫奉安於宫中正殿設几筵建丹旐於宫門外之右陳儀駕於宫門外皇帝成服截髮辮諸王福晉為子婦者皆成服翦髮皇太后宫中女侍內監皆成服翦髮截髮辮既斂王以下及姻戚於宫門外三品官以下於外門之外福晉以下及姻戚婦女於丹墀右三品淑人以下於宫門外齊集舉哀奏疏文移十五日用藍印頒遺詔於天下內外各官二十七日除服百日不作樂不嫁娶軍民二十七日不作樂不嫁娶皆百日剃髮朝晡日中之奠進茶膳以女官恭理喪儀王公大臣內務府總管率之內監轉進於皇帝親奠殷奠既徹饌女官奉冠服詣燎所福晉命婦內府婦女皆從欽命公主福晉或姻戚大臣夫人一人於燎所祭酒行禮將葬隨行有女侍及內府婦女餘皆如列聖喪儀凡皇后大喪皇帝主喪儀初喪皇帝冠去緯輟朝皇子去冠服哭踊宫中自妃嬪以下咸摘耳環去首飾屆時奉安梓宫於宫中正殿設几筵建丹旐於宫門外之右陳儀駕於宫門之外特簡王公大臣恭理喪儀既斂乃奠皇帝成服皇子福晉以下咸成服皇帝縞素十三日而除兩月後御門聼政郊壇大祀祭服行禮親臨几筵前素服視奠恭遇皇太后皇帝躬詣几筵皇太后乘輿由中門中道至簷下降輿皇帝乘輿由中門中道至階上降輿皇子喪服百日餘日素服詣几筵前仍喪服皇子福晉亦如之皇孫恭理喪儀王公大臣及殯宫守衛執事各官及姻戚百日除服羣臣二十七日除服皆百日剃髮十三日內各衙門文移用藍印奏本用硃印內外官員二十七日不作樂不嫁娶皆百日剃髮外省以初喪日起算不以詔到日起算軍民素服七日不作樂不嫁娶成服後朝晡日中三設奠皇子出苫次詣几筵前西嚮舉哀行禮如儀諏日行殷奠禮皇帝親臨上食畢讀祝官奉祭文至閾外正中跪皇子衆皆跪哀暫止讀文畢執事進奠几皇帝旁坐祭酒三爵每祭皇子行一叩禮衆隨行禮如儀諏日而殯先期以奉移告几筵行啓奠禮與殷奠同至日奉移梓宫於殯宫皇帝親臨祭酒三爵靈駕至殯殿行奉安禮設几筵陳册寶皇子祭酒衆隨行禮如儀行初祭禮翼日繹祭如儀行大祭禮翼日繹祭儀同周月奠獻儀與啓奠同承旨恭擬諡號敇工部製册寶諏吉行册諡禮前期遣官祗告太廟後殿奉先殿至日陳設皇帝素服詣太和門升座閲册寶畢皇帝還宫正副使恭奉册寶詣殯宫宣册宣寶畢陳於几筵左右皇子上香奠帛讀祝三獻爵如儀禮成正副使復命翼日頒詔天下百日奠獻儀同初祭既卜葬吉奉移前三日遣官祗告天地太廟社稷奉移前期一日行祖奠禮儀與啓奠同至日皇帝親詣梓宫前祭酒三爵不往送祭酒時皇子行禮衆隨行禮畢靈駕發册寶亭及儀駕咸前列沿途分站豫設蘆殿繚以黃幔城皇子王公以下隨行靈駕至宿次奉安蘆殿乃行晡奠如儀翼日昧爽行朝奠如儀至陵寢安奉梓宫於饗殿皇子祭酒三爵衆隨行禮舉哀是日遣官祭告各陵寢並祭后土皇陵山神翼日行饗奠禮儀如初奠先葬一日行遷奠禮儀如饗奠至時恭奉梓宫於寶城前蘆殿皇子三祭酒至日皇子詣梓宫前祭酒恭移龍輴自隧道入地宫安奉寶牀設香册寶於左右几遂掩閉元宫皇子祭酒舉哀乃卒哭各退行題主禮既陳設大學士二人朝服行一跪三叩禮興恭題神主禮畢乃行虞祭禮如儀禮成恭奉神主奉安黃輿導引啓行沿途仍朝夕奠俟還京時升祔如距大葬之期尚逺乃於殯宫東廡製神主欽命大學士二人至几筵前行題主禮期年小祥讀文致祭禮儀與初奠同再期大祥儀與期年同二十七月行除服禮皇子喪服奠獻與百日禮同祭畢除服三周行禮儀同再期皇貴妃以下喪儀凡皇貴妃喪禮初薨皇帝輟朝五日素服十日若殯期逾十日及殯而止命所出皇子公主持服如儀內閣擬諡號候欽定諏日行册諡禮如儀凡貴妃喪禮皇帝輟朝五日妃喪禮皇帝輟朝三日嬪喪禮皇帝輟朝二日餘禮節並如儀凡皇祖皇考妃嬪薨各按封號以治喪追封者視所追封之號治喪皆如儀皇子以下喪儀凡皇子喪禮未分封之皇子薨逝適長者皇帝輟朝五日已生子者皇子福晉及所生皇孫並成服如儀如奉旨追封擇吉行追封禮奉册寶宣讀如儀凡親王薨喪聞皇帝輟朝三日有特恩親臨者王子率合屬官員跪迎於大門外設御座於左有司設奠几皇帝坐祭酒三爵舉哀畢駕興王子率屬跪送如初迎儀王子以下府屬官本支諸王以下應有服者皆成服諭祭二次賜諡如儀世子薨喪聞皇帝輟朝二日賜諡賜給初祭大祭羊酒如儀郡王薨喪聞皇帝輟朝二日貝勒薨皇帝輟朝一日及貝子以下鎮國公輔國公皆賜諡賜給羊酒如儀民公以下兵民以上居喪二十七月內不燕會不鼓樂不娶妻納妾門户不換舊符服制凡服制有五曰斬衰三年曰齊衰杖期不杖期五月三月曰大功九月曰小功五月曰緦麻三月服之差等有八曰斬衰三年者子為父母子之妻同子為繼母父之後妻慈母謂妾子無母父命他妾養之者養母自幼過房與人者子之妻同庶子為適母為所生母庶子之妻同為人後者為所後父母為人後者之妻同女在室為父母已嫁被出而返在家者同適孫為祖父母及髙曽祖父母承重適孫之妻同為人後者承重同妻為夫妾為家長同曰齊衰杖期者適子衆子為庶母謂父妾有子者適子衆子之妻同子為嫁母謂親生母父歿而改嫁者子為出母謂親生母父在而被出者夫為妻父母在不杖適孫祖在為祖母承重曰齊衰不杖期者祖為適孫父母為適長子及衆子父母為適長子之妻父母為女在室者父母為子為人後者繼母為長子衆子子為改嫁繼母謂父歿繼母改嫁而已從之者從子為伯叔父母及姑在室者為已之親兄弟及姊妹在室者為親兄弟之子及女在室者孫為祖父母孫女為祖父母雖適人不降庶孫為生祖母慈母養母孫同女出嫁為父母為人後者為其本生父母仕者解任士子輟考丁憂一年女在室及雖適人而無夫與子者為其兄弟姊妹及兄弟之子兄弟之女在室者女適人為兄弟之為父後者婦為夫親兄弟之子及女在室者妾為家長之父母妾為家長之正妻妾為家長之長子衆子與其所生子為同居繼父兩無大功以上親者曰齊衰五月者為曾祖父母女孫雖適人不降曰齊衰三月者為髙祖父母女孫雖適人不降為繼父先同居今不同居者自來不同居者無服為同居繼父兩有大功以上親者曰大功九月者祖為衆孫及孫女在室者祖母為適孫衆孫及孫女在室者生祖母為庶孫慈養祖母同父母為衆子婦及女之已嫁者慈母養母為其子婦同伯叔父母為從子婦及兄弟之女已嫁者為人後者為其兄弟及姑姊妹在室者夫為人後其婦為夫本生父母為已之同堂兄弟及姊妹在室者為姑及姊妹之已嫁者為兄弟之子為人後者女出嫁為本宗伯叔父母及兄弟與兄弟之子為姑姊妹及兄弟之女在室者婦為夫之祖父母為夫之伯叔父母曰小功五月者為伯叔祖父母謂祖之親兄弟為同堂伯叔父母謂父之堂兄弟為同堂姊妹之出嫁者為再從兄弟及再從姊妹在室者為同堂兄弟之子及女在室者為祖姑之在室者謂祖之親姊妹為堂姑之在室者謂父之同堂姊妹為兄弟之妻祖為適孫之婦為兄弟之孫及兄弟之孫女在室者為外祖父母為母之兄弟姊妹為姊妹之子及女之在室者為人後者為其姑及姊妹之已嫁者婦為夫兄弟之孫及孫女在室者婦為夫之姑及夫之姊妹在室出嫁同婦為夫之兄弟及夫兄弟之妻婦為夫同堂兄弟之子及女之在室者女出嫁為本宗姊妹之出嫁者為本宗堂兄弟及堂姊妹之在室者曰緦麻三月者祖為衆孫婦曾祖父母為曾孫曾孫女髙祖父母為元孫元孫女祖母為嫡孫衆孫婦為乳母為曾伯叔父母為族伯叔祖父母為族伯叔父母為族兄弟及族姊妹在室者為曾祖姑在室者為族祖姑及族姑在室者為兄弟之曾孫及曾孫女在室者為兄弟之孫女出嫁者為同堂兄弟之孫及孫女在室者為再從兄弟之子及女在室者為祖姑謂祖之親姊妹及堂姑謂父之堂姊妹及已之再從姊妹出嫁者為同堂兄弟之女出嫁者為父姊妹之子為母兄弟之子為母姊妹之子為妻之父母為壻為外孫及外孫女為兄弟孫之妻為同堂兄弟子之妻為同堂兄弟之妻婦為夫髙曾祖父母為夫之伯叔祖父母及夫之祖姑在室者為夫之堂伯叔父母為夫之堂姑在室者為夫之同堂兄弟及同堂兄弟之妻為夫之同堂姊妹在室出嫁同為夫之再從兄弟之子及女在室者為夫同堂兄弟之女出嫁者為夫同堂兄弟子之妻為夫同堂兄弟之孫及孫女在室者為夫兄弟孫之妻為夫兄弟之孫女出嫁者為夫兄弟之曾孫及曾孫女之在室者女出嫁為本宗伯叔祖父母及祖姑在室者為本宗同堂伯叔父母及堂姑在室者為本宗堂姊妹之出嫁者為本宗堂兄弟之子及