body:
  text: 地理略四疆域四廣東省所屬府十直𨽻州三廣州府省會領縣十四南海番禺附郭二縣順德東莞從化龍門新寧增城香山新會三水清逺新安康熙五年裁八年復設花康熙二十四年設韶州府領縣六曲江附郭樂昌仁化乳源翁源英德南雄府領縣二保昌附郭始興惠州府領州一縣九歸善附郭連平州博羅長寧永安海豐陸豐雍正九年設龍川河源和平潮州府領縣九海陽附郭豐順乾隆二年設潮陽揭陽饒平惠來大埔澄海康熙五年裁八年復設普寧肇慶府領州一縣十二髙要附郭德慶州四會新興陽春陽江髙明恩平廣寧開平順治十年設鶴山雍正九年設封川開建髙州府領州一縣五茂名附郭化州電白信宜吳川石城廉州府領州一縣二合浦附郭欽州靈山雷州府領縣三海康附郭遂溪徐聞瓊州府領州三縣十瓊山附郭儋州萬州崖州澄邁定安文昌會同樂會臨髙昌化陵水感恩羅定州領縣二東安西寧連州初屬廣州府雍正五年升直𨽻州領縣二陽山連山二縣初屬廣州府雍正五年屬州嘉應州初為程鄉縣屬潮州府雍正十一年升直𨽻州領縣四長樂興寧二縣初屬惠州府雍正十一年屬州平逺鎮平二縣初屬潮州府雍正十一年屬州廣西省所屬府十有一直𨽻州一桂林府省會領州二縣七臨桂附郭永寧州全州興安靈川陽朔永福義寧灌陽柳州府領州一縣七馬平附郭象州雒容羅城柳城懷逺來賔初屬府雍正三年屬賔州十二年仍屬府融慶逺府領州四縣四宜山附郭河池州東蘭州南丹州土州那地州土州天河思恩欣城土縣思恩府領州三縣三武緣賔州初屬栁州府雍正三年升直𨽻州領來賔遷江上林武宣四縣十二年改屬府田州土州陽萬分州土州遷江上林二縣初屬栁州府雍正三年屬賔州十二年屬府泗城府雍正五年設領州一縣二凌雲附郭乾隆三年設西隆州康熙五年設屬思思府雍正五年升直𨽻州八年屬府西林康熙五年設屬思恩府雍正五年屬西隆州八年屬府平樂府領州一縣七平樂附郭永安州恭城富川賀荔浦修仁昭平梧州府領縣五蒼梧附郭藤容岑溪懷集潯州府領縣四桂平附郭平南貴武宣初屬柳州府雍正三年屬賔州七年屬府南寧府領州六縣三宣化附郭新寧州橫州上思州歸德州土州果化州土州忠州土州隆安永淳太平府領州十八縣二崇善附郭養利州左州永康州寧明州雍正十年設萬承州思陵州憑祥州太平州安平州茗盈州結安州佶倫州龍英州都結州龍州江州思州上下凍州自萬承州以下皆土州羅陽土縣鎮安府雍正七年設領州五縣一大保附郭乾隆三年設奉議州歸順州二州舊係土州屬思恩府雍正十年改流屬鎮安府下雷州向武州都康州三州皆土州鬱林州初屬梧州府雍正三年升直𨽻州領縣四博白北流陸川興業四縣初屬梧州府雍正三年屬州雲南省所屬府十有四直𨽻州四廳三雲南府省會領州四縣七昆明附郭嵩明州晉寧州安寧州昆陽州富民宜良呈貢羅次祿豐易門大理府領州四縣三太和附郭趙州鄧川州賔川州雲龍州雲南浪穹臨安府領州三縣五建水附郭初為州乾隆三十五年改縣石屏州阿迷州寧州通海河西嶍峨蒙自楚雄府領州三縣四楚雄附郭南安州鎮南州姚州初屬姚安府乾隆三十五年裁姚安府屬府定逺廣通大姚初屬姚安府乾隆三十五年屬府澄江府領州二縣二河陽附郭新興州路南州江川順寧府領州一縣一順寧附郭乾隆三十五年設雲州曲靖府領州六縣二南寧附郭霑益州陸涼州羅平州馬龍州尋甸州初為府康熙八年改州屬府宣威州雍正五年設屬鎮沅府乾隆三十五年屬府平彞康熙三十四年設麗江府領州二縣一麗江附郭乾隆三十五年設鶴慶州初為府乾隆三十五年改州屬府劔川州初屬鶴慶府乾隆三十五年屬府普洱府雍正七年設領縣一寧洱附郭雍正十三年設永昌府領州一縣二保山附郭騰越州永平廣南府領縣一寶寧附郭乾隆元年設開化府康熙六年設領縣一文山附郭雍正七年設東川府康熙三十八年設東川府𨽻四川省雍正四年改𨽻雲南領縣一會澤附郭雍正五年設昭通府初為烏蒙土府屬四川省雍正三年改𨽻雲南省九年改名昭通府領州一縣二恩安附郭雍正六年設鎮雄州初為軍民府𨽻四川省雍正六年改州來屬永善雍正六年設廣西州初為府乾隆三十五年改直𨽻州領縣二師宗彌勒二縣初為州屬府乾隆三十五年屬州武定州初為府乾隆三十五年改直𨽻州領縣二元謀初屬府乾隆三十五年屬州祿勸初為州屬府乾隆三十五年改縣屬州元江州初為府乾隆三十五年改直𨽻州領縣一新平初屬臨安府雍正十年屬州鎮沅州雍正五年以土司設鎮沅府乾隆三十五年改直𨽻州領縣一恩樂雍正五年設乾隆三十五年屬州蒙化廳初為土府乾隆三十五年改廳永北廳初為永北府乾隆三十五年改廳景東廳初為土府乾隆三十五年改廳貴州省所屬府十有三廳一貴陽府省會領州三縣四貴築附郭開州定番州廣順州龍里康熙十一年設貴定修文康熙二十六年設思州府領縣二玉屏青溪二縣雍正五年設思南府領縣三安化附郭婺川印江鎮逺府領縣三鎮逺附郭施秉天柱初屬湖南靖州雍正五年改屬黎平府十一年屬府石阡府領縣一龍泉銅仁府領縣一銅仁附郭黎平府領縣三開泰附郭錦屏雍正五年設永從安順府領州二縣三普定附郭康熙十年設鎮寧州永寧州清鎮安平二縣康熙二十六年設南籠府雍正五年設領州二縣二永豐州雍正五年設普安州普安順治十八年設安南康熙二十六年設一州二縣初屬安順府雍正五年屬府都勻府領州二縣三都勻附郭康熙十年設麻哈州獨山州清平康熙七年裁十一年復置荔波初屬廣西慶逺府雍正十年屬府平越府領州一縣四平越附郭康熙十年設黃平州甕安湄潭餘慶大定府康熙五年設二十六年改州屬威寧府雍正七年仍改府領州三縣一平逺州黔西州二州初為府康熙二十二年改州屬府二十六年改屬威寧府雍正七年仍屬府威寧州康熙五年設為府雍正七年改州屬府畢節康熙二十六年設屬威寧府雍正七年屬府遵義府舊𨽻四川省雍正六年改屬領州一縣三遵義附郭正安州桐梓綏陽仁懷廳乾隆四十一年由遵義府所屬之仁懷縣改設舊藩蒙古內扎薩克二十五部五十一旗東至黑盛京龍江界西至賀蘭山厄魯特界南至長城北踰絶漠袤延萬餘里國初歸附定為四十九旗後增設二旗共五十一旗科爾沁六旗扎賴特一旗都爾伯特一旗郭爾羅斯二旗敖漢一旗奈曼一旗翁牛特二旗巴林二旗扎嚕特二旗喀爾喀左翼一旗阿嚕科爾沁一旗克什克騰一旗土默特二旗喀拉沁二旗康熙四十四年增設一旗烏珠穆親二旗阿巴噶二旗霍薺特二旗蘇尼特二旗阿巴哈那爾二旗四子部落一旗喀爾喀右翼一旗烏喇特三旗毛明安一旗鄂爾多斯六旗雍正九年增設一旗歸化城土默特二旗乾隆二十一年增設一旗二十三年裁八旗遊牧察哈爾東至克什克騰界西至歸化城土默特界南至太僕寺牧厰及山西邊界北至蘇尼特及四子部落界袤延千有餘里國初定為八旗新藩蒙古喀爾喀四部八十二旗東至黑龍江界西至阿勒坦山伊犂東北路界南至內扎薩克界北至俄儸斯界延袤八千餘里康熙二十八年歸附三十年編審旗分定為後部東部西部共三十七旗後遞增設四十五旗又設賽因諾顔部共四部合八十二旗後部土謝圖汗初轄旗十有七康熙三十二年至雍正十年增設二十一旗尋分二十旗屬於賽因諾顔部乾隆元年以後復增二旗共為二十旗東部車臣汗初轄旗十有二康熙三十五年至乾隆二十二年遞增設十一旗今為二十三旗西部扎薩克圖汗初轄旗八康熙三十三年至乾隆二十二年遞增設九旗今為十有七旗賽因諾顔部雍正十年於土謝圖汗部內分轄二十旗别為一部乾隆元年以後復增二旗共為二十二旗蒙古青海四部二十九旗東至甘肅河州界西至西藏界南至四川界北至甘肅安西州界延袤二千餘里康熙三十六年歸附受封雍正元年誘衆犯邊大兵討平之編審旗分定為四部二十八旗後增設一旗共四部二十九旗厄魯特部初二十旗乾隆十一年增設一旗喀爾喀部一旗土爾古特部四旗回特部三旗賀蘭山厄魯特駐賀蘭山隂一旗康熙三十八年受封又有喀爾喀河厄魯特二旗達拉爾河厄魯特一旗皆康熙三十八年受封乾隆二十六年遷屬喀爾喀之賽因諾顔部管轄其駐牧即在賽因諾顔部內西藏東至四川界西至大沙海南至雲南界北至青海及回部界延袤六千餘里其地有四曰衛曰藏曰喀木曰阿里共轄六十餘城互市在四川西徼打箭爐之地國初崇德七年畨僧遣使歸誠順治十年受封其國稱圖伯特即唐古忒最尊者曰逹賴喇嘛班禪喇嘛代喇嘛理事者曰第巴又有汗則青海蒙古部長為之康熙三十二年有第巴潛通厄魯特為亂拉藏汗誅之詔遣使安撫其地五十三年準噶爾策妄阿喇布坦興師侵藏滅壞喇嘛戕拉藏汗詔遣大兵討平之此後不復設汗雍正五年噶卜倫阿爾布巴等搆亂後藏噶卜倫頗羅鼐走避以聞遣兵進勦阿爾布巴等伏誅頗羅鼐由台吉封多羅貝勒總理衛藏噶卜倫事務乾隆四年晉封多羅郡王子珠爾默特納木扎勒嗣尋隂謀叛逆駐藏都統傅清左都御史拉布敦誅之十六年設噶卜倫四岱賁五第巴三堪布一分理藏務均受駐藏大臣及逹賴喇嘛統轄衛地居諸藏之中亦名中藏藏地在衛西南喀木地在衛東南阿里地在藏地極西新疆伊犂東至喀爾喀界西至藩部哈薩克界南至天山回部界北至俄儸斯界延袤萬餘里舊為準噶爾部乾隆二十年大兵進討二十四鄂拓克二十一昂吉九集賽爭先迎降伊犂平阿睦爾撤納尋叛二十二年分南北路進討平之伊犂復定設立伊犂將軍統轄天山南北諸路及參贊大臣辦事大臣等員設立駐防屯田兵丁分東南路西北路二境其東南之烏魯木齊已新設迪化州𨽻於甘肅省伊犂東南路伊犂西北路庫爾喀喇烏蘇塔爾巴哈台回部東至甘肅省安西州界西至蔥嶺南至沙海接西藏界北至天山接伊犂界延袤萬餘里初羈屬於準噶爾乾隆二十年伊犂平始內附二十一年逆回波羅泥都霍集占以諸城叛大兵討平之二十四年回部悉定仍立回部伯克等官設駐劄大臣侍衛等官以統轄之其哈密及闢展吐魯畨二城舊先歸附以俱係回人併紀於回部中哈密康熙三十五年歸附受封闢展吐魯畨二城雍正四年率衆內附移駐內地之肅州安西州境乾隆二十四年以西域底定仍歸故土喀喇沙爾乾隆二十一年內附二十三年叛附逆回尋討平之庫車乾隆二十三年定沙雅爾乾隆二十三年定賽喇木拜阿克蘇三城為逆回霍集占舊部地乾隆二十三年大兵進討逆回遁走庫車諸伯克以城降烏什乾隆二十三年定喀什噶爾為逆回波羅泥都舊部乾隆二十四年逆回遁其舊伯克以城降葉爾羌乾隆二十四年大兵進討逆回二酋由葉爾羌踰山遁旋授首其舊伯克以城降和闐乾隆二十三年定皇朝通志卷二十七
