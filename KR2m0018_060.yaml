body:
  text: 器服略五車輅革輿附臣等謹按周制玉輅以祀金輅以賓以封同姓象輅以朝以封異姓革輅以即戎以封四衛木輅以田以封藩國此五輅之别也國初定制有玉輅大輅大馬輦小馬輦香步輦乾隆八年改大輅曰金輅大馬輦曰象輅小馬輦曰革輅香步輦曰木輅與玉輅為五以符五輅之制十三年始造二輦三輿而制度益詳考鄭樵通志器服略車輅之後别載輦輿今遵皇朝禮器圗式及大清會典輯為車輅一門而以輦輿附焉皇帝車輅玉輅木質髤朱圓蓋方軫通髙一丈二尺一寸蓋髙三尺一分飾以青銜玉圓版四冠金圓頂一尺二寸九分鏤金垂雲承之簷徑八尺一寸周帖鏤金雲版三層青緞垂幨亦三層各深五寸繡金雲龍及羽文相間繫繡金青緞帶四屬於軫四柱各髙六尺七寸九分相距各五尺六寸繪以金龍門髙五尺一寸九分濶二尺四寸九分左右門濶二尺二寸五分垂朱簾四面各三座縱八尺五寸橫八尺四寸環以朱闌飾間金彩其髙一尺六寸五分各闕其中二尺四寸闌內周布花毯中設金雲龍寶座髙一尺三寸濶二尺九寸兩輪徑各三尺三寸各十有八輻鏤花飾金貫以軸轅二長二丈二尺九寸五分兩端飾金龍首尾軫長一丈一尺一寸五分徑八尺四寸後建太常升用納陛五級左右闌皆髤朱亦飾金彩駕象一靷以朱絨紃陳設時以行馬二承轅亦髤朱直竿兩端鉆以銅凡大朝會則陳五輅於午門外金輅圓蓋方軫蓋飾以黃銜金圓版四黃緞垂幨三層繫黃緞帶四屬於軫後建大旗餘俱如玉輅之制木輅圓蓋方軫通髙一丈一尺六寸五分蓋髙二尺六寸一分飾以黑銜花梨圓版四黑緞垂幨三層繫黑緞帶四屬於軫四柱各髙六尺五分方五尺一寸門髙五尺二寸濶二尺二寸五分左右門濶二尺二寸座縱九尺橫八尺八寸環以朱闌各闕其中二尺二寸轅三各長二丈一尺軫長九尺徑八尺八寸後建大麾服馬二驂馬四設遊環和鈴餘俱如玉輅之制象輅圓蓋方軫通髙一丈一尺三寸蓋髙二尺六寸五分飾以紅銜象牙圓版四紅緞垂幨三層繫紅縀帶四屬於軫四柱各髙六尺四寸九分相距各五尺八寸門髙五尺九分濶二尺四寸五分座縱一丈五分橫九尺一寸環以朱闌各闕其中二尺二寸五分轅三各長二丈二尺三寸軫長一丈五分徑九尺一寸後建大赤服馬二驂馬六設遊環和鈴餘俱如玉輅之制革輅圓蓋方軫通髙一丈一尺三寸蓋髙二尺五寸五分飾以泥銀銜圓黃革四白縀垂幨三層繫白縀帶四屬於軫四柱各髙五尺五寸九分門髙五尺濶二尺二寸五分左右門濶二尺一寸九分座縱一丈六寸橫八尺三寸五分環以朱闌各闕其中二尺三寸轅二各長一丈九尺五分軫長一丈六寸徑八尺三寸五分後建大白服馬一驂馬三設遊環和鈴餘俱如玉輅之制玉輦木質髤朱圓蓋方座通髙一丈一尺一寸蓋髙二尺飾以青銜玉圓版四冠金圓頂七寸鏤金垂雲承之曲梁四垂端為金雲葉簷方徑六尺二寸青緞重幨各深五寸五分周為襞積繡金雲龍繫黃絨紃四屬於座隅四柱髙五尺三寸相距各五尺繪雲龍門髙四尺八寸濶二尺三寸五分冬垂青氊幃夏易以朱簾黑縀緣四面各三座髙二尺四寸下方七尺七寸上方七尺六寸綴版二層上繪彩雲下繪金雲環以朱闌餘間金彩其髙一尺六寸八分各闕其中二尺一寸闌內周布花毯中設金雲龍寶座髙一尺三寸濶二尺七寸左列銅鼎右植服劍轅四內二轅長三丈八寸五分外長二丈九尺兩端銜金龍首尾升用納陛五級左右闌皆髤朱亦飾金彩舁以三十六人冬至大祀孟春祈穀孟夏常雩皆御之大朝會則陳於太和門外金輦圓蓋方軫通髙一丈五寸蓋髙一尺九寸飾以泥金銜金圓版四冠金圓頂一尺簷徑七尺一寸黃緞重幨各深五寸柱髙五尺相距各四尺九寸門髙四尺七寸五分濶二尺二寸五分冬垂黃氊幃夏易以朱簾黑縀緣四面各三座下方七尺五寸上方七尺三寸環以朱闌其髙一尺三寸各闕其中二尺三寸轅四內二轅長二丈八尺一寸外長二丈六尺一寸舁以二十八人餘俱如玉輦之制夏至祀方澤四孟時享嵗暮祫祭春秋二仲祀太社太稷皆御之大朝會則陳於太和門外禮輿楠質通髙六尺三寸上為穹蓋二層髙一尺三寸上層八角飾金行龍下四角飾亦如之冠金圓頂八寸九分鏤金垂雲承之銜以雜寶簷縱四尺七寸橫三尺五寸明黃緞重幨各深八寸五分繡金雲龍四柱各髙五尺縱距三尺九寸橫三尺飾蟠龍門端及左右闌飾雲龍皆鏤金內為金龍寶座髙一尺七寸縱二尺一寸橫二尺七寸倚髙二尺二寸幃用明黃雲縀氊紗各惟其時左右啓櫺夏以藍紗冬以玻璃直轅二各長一丈七尺六寸五分大橫杆二各長九尺小橫杆四各長二尺二寸五分肩杆八各長五尺八寸皆髤朱繪金雲龍橫鉆以銅縱加金龍首尾舁以十六人朝日夕月祭文廟耕藉諸中祀皆御之步輿木質塗金不施幰蓋通髙三尺五寸倚髙一尺六寸五分鏤花文中為蟠龍座髙一尺八寸五分縱一尺八寸橫二尺二寸冬施紫貂坐具夏以明黃粧緞四足為螭首虎爪承以圓珠周繪雲龍踏几髙三寸一分縱九寸五分橫二尺二寸籠以黃縀底縱三尺四面為橫距直轅二各長一丈五尺五寸大橫杆二各長七尺六寸中為雙龍首相對小橫杆四各長二尺八寸肩杆八各長五尺六寸飾如禮輿之制亦舁以十六人駕出入常御之輕步輿木質髤朱不施幰蓋通髙三尺四寸倚髙一尺五寸八分象牙為之座髙一尺八寸二分縱一尺八寸三分橫二尺二寸踏兒髙三寸縱九寸橫二尺一寸五分髤以金直轅二各長一丈五尺四寸五分加銅龍首尾大橫杆二各長九尺一寸小橫杆四各長二尺八寸四分肩杆八各長五尺八寸五分皆鉆以銅餘俱如步輿之制亦舁以十六人行幸常御之皇太后車輅龍鳳車木質髤以明黃通髙九尺五寸穹蓋二重髙一尺七寸上繪八寶八角各飾金鳳下繪雲文四隅飾亦如之冠金圓頂八寸五分鏤雲文銜以雜寶簷縱四尺九寸橫四尺明黃縀垂幨上深三寸下深一尺一寸蓋明黃絡四隅繫明黃絨紃屬於軫四柱各髙三尺三寸縱四尺八寸橫三尺一寸左右及後皆繪金龍鳳中各啓櫺青紃網之門髙三尺濶一尺八寸五分上鏤金龍鳳相向明黃縀幃黃裏坐具明黃縀彩繡龍鳳輪徑各四尺九寸各十有八輻轅二各長一丈七尺五寸鉆以鐵鋄金軫長六尺二寸濶三尺三寸駕馬一儀車木質髤以明黃通髙九尺九寸穹蓋上圓下方髙一尺冠銀圓頂塗金髙七寸七分簷縱五尺六寸橫四尺二寸五分四隅繫明黃絨紃屬於軫明黃縀垂幨深一尺二寸四柱各髙二尺九寸縱四尺八寸橫三尺三寸不加繪飾裏髤淺紅明黃縀幃黃裏坐具明黃縀彩繡龍鳳輪徑各四尺各十有八輻轅二各長一丈五尺九寸鉆以鐵鋄銀軫長五尺九寸濶三尺五寸駕馬一萬夀輦制同金輦明黃縀幃繡夀字篆文皇太后萬夀時御之龍鳳輿木質髤以明黃通髙七尺穹蓋二重髙一尺五寸五分上為八角各飾金鳳下正方四隅飾亦如之冠金圓頂七寸二分鏤雲文銜以雜寶簷縱五尺橫三尺七寸六分明黃縀垂幨上深三寸下深一尺一寸皆銷金龍鳳四柱各髙四尺七寸縱四尺上橫二尺九寸下二尺三寸五分皆繪金龍鳳櫺四啓青紃網之前為雙扉髙二尺六寸濶二尺一寸啓扉則舉櫺懸之內髤淺紅中置朱座髙一尺七寸倚髙一尺八寸坐具明黃縀彩繡龍鳳前加撫式亦髤明黃繪金龍鳳直轅二各長一丈七尺二寸五分大橫杆二各長八尺中為鐵鋄金雙鳳相向小橫杆四各長三尺肩杆八各長五尺一寸皆髤明黃橫鉆以銅縱加銅鋄金鳳首尾舁以十六人儀輿木質髤以明黃通髙六尺一寸上為穹蓋髙七寸冠銀圓頂塗金髙六寸五分簷縱四尺九寸橫三尺八寸四隅繫黃絨紃屬於直轅明黃縀垂幨深一尺二寸四柱各髙四尺八寸縱四尺二寸橫三尺一寸門髙三尺九寸濶二尺七寸明黃緞幃黃裏中置朱座髙一尺七寸倚髤眀黃髙一尺八寸繪金龍鳳坐具明黃緞亦繡龍鳳直轅二各長一丈五尺六寸橫杆二各長七尺八寸中為鐵鋄金雙鳳相向肩杆四各長五尺三寸俱髤明黃兩端鉆以銅鋄金舁以八人皇后車輅鳳車木質髤以明黃左右及後皆繪金鳳門上鏤金鳳相向坐具繡彩鳳餘並同龍鳳車皇太后儀車木質髤以明黃通髙九尺五寸穹蓋上圓下方髙九寸冠銀圓頂塗金髙七寸簷縱五尺五寸橫四尺一寸四隅繫明黃絨紃屬於軫明黃緞垂幨深一尺二寸四柱各髙二尺八寸縱四尺七寸橫三尺二寸不加繪飾裏髤淺紅明黃緞幃黃裏坐具明黃緞繡彩鳳輪徑各四尺各十有八輻轅二各長一丈五尺鉆以鐵鋄銀軫長五尺八寸濶三尺四寸駕馬一鳳輿木質髤以明黃繪飾彩繡皆金鳳肩杆八各長五尺舁以十六人親蠶御之尺寸形制同鳳輿皇太后龍儀輿木質髤以明黃通髙五尺九寸上為穹蓋髙六寸七分冠銀圓頂塗金髙六寸三分簷縱四尺七寸橫三尺六寸四隅繫黃絨紃屬於直轅明黃縀垂幨深一尺一寸四柱各髙四尺七寸縱四尺橫三尺門髙三尺七寸濶二尺五寸明黃縀幃紅裏中置朱座髙一尺五寸倚髤明黃髙一尺六寸繪金鳳坐具明黃縀繡彩鳳直轅二各長一丈五尺五寸橫杆二各長七尺七寸中為鐵鋄金雙鳳相向肩杆四各長五尺二寸兩端鉆以銅鋄金舁以八人皇貴妃車輅翟車木質髤以明黃蓋飾金翟左右及後繪金翟門上鏤金翟相向坐具繡彩翟轅鉆以鐵鋄銀餘同后皇鳳車儀車木質髤以明黃坐具繡彩翟餘同儀車皇后翟輿木質髤以明黃繪飾彩繡皆金翟橫杆中為鐵鋄銀雙翟相向翟首鋄金凡杆皆縱加銅鋄金翟首尾肩杆四舁以八人餘同鳳輿皇后儀輿木質髤以明黃倚繪金翟坐具繡彩翟橫杆中為鐵鋄銀雙翟相向翟首鋄金餘同儀輿皇后貴妃車輅儀車木質髤以金黃幨幃皆用金黃縀坐具亦如之繡彩翟餘同儀車皇后翟輿木質髤以金黃蓋幨坐具皆用金黃緞繪飾彩繡皆金翟橫杆中為鐵鋄銀雙翟相向翟首鋄金凡杆皆縱加金翟首尾肩杆四舁以八人餘同鳳輿皇后儀輿木質髤以金黃幨幃坐具皆用金黃緞繪飾彩繡皆金翟橫杆中為鐵鋄銀雙翟相向翟首鋄金餘同后儀皇輿妃車輅輅嬪車同儀車木質髤以金黃冠銅圓頂塗金幨幃皆用金黃縀坐具亦如之繡彩翟餘同儀車皇后翟輿木質髤以金黃冠銅圓頂塗金蓋幨坐具皆用金黃縀繪飾彩繡皆金翟橫杆中為鐵鋄銀雙翟相向翟首鋄金直杆加銅髤金翟首尾肩杆四鏤翟首尾髤以金舁以八人餘同鳳輿皇后儀輿木質髤以金黃冠銅圓頂塗金幨幃坐具皆用金黃緞繪飾彩繡皆金翟肩杆二舁以四人餘同后皇儀輿公主福晉品官命婦等車固倫公主車公主以下縣主以上亦得乘轎金黃蓋四角紅緣金黃幨紅幃轅杆軫輪皆髤朱和碩公主車朱輪紅蓋四角金黃緣金黃幨紅幃郡主車朱輪紅蓋四角皂緣紅幨紅幃縣主車朱輪紅蓋四角青緣青幨紅幃郡君車貝子夫人同朱輪紅蓋四角青緣青幨紅幃縣君車鎮國夫人同朱輪皂蓋四角紅緣紅幨皂幃鎮國公女鄉君車輔國公夫人同朱輪皂蓋四角青緣紅幨皂幃輔國公女鄉君車鎮國將軍夫人同朱輪皂蓋紅幨青幃親王福晉車王福晉以下貝勒夫人以上亦得乘轎紅蓋四角皂緣餘同固倫公主車世子福晉車紅蓋四角皂緣紅幨餘同和碩公主車郡王福晉車皂幨餘同郡主車貝勒夫人車朱輪紅蓋四角皂緣紅幨皂幃輔國將軍夫人車朱輪青蓋紅幨青幃奉國將軍淑人車奉恩將軍恭人同朱輪皂蓋皂幨皂幃民公夫人車黑轅輪緑蓋四角皂緣緑幨皂幃侯伯夫人車緑蓋四角青緣餘同民公夫人