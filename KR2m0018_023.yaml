body:
  text: 天文略六儀象臣等謹按靈臺儀象志所載南懷仁新製黃道經緯儀赤道經緯儀地平經儀地平緯儀即象限儀紀限儀天體儀又儀象考成所載戴進賢新製錫名璣衡撫辰儀皆法天體渾然之象互相考測不差纍黍具詳載於器服略內然天文非推步不詳而推步非儀器不密今恭録御製儀象考成序及南懷仁戴進賢序説與弧三角形以闡明推步之理數另為一卷列於象緯之後庶考察者得以因理求器因器知象天文之學於斯備矣御製儀象考成序上古占天之事詳於虞典書稱在璿璣玉衡以齊七政後世渾天諸儀所為權輿也歷代以來遞推迭究益就精密所傳六合三辰四逰儀之制本朝初年猶用之我皇祖聖祖仁皇帝奉若天道研極理數嘗用監臣南懷仁言改造六儀輯靈臺儀象志所司奉以測驗其用法簡當如定周天度數為三百六十周日刻數為九十有六分黃赤道以備儀制減地平環以清儀象創制精密尤有非前代所及者顧星辰循黃道行每七十年差一度黃赤二道之相距亦數十年差一分所當隨時釐訂以期吻合而六儀之改創也占候雖精體制究未協於古赤道一儀又無遊環以應合天度志載星象亦間有漏略躐次者我皇祖精明步天定時之道使用六儀度至今必早有以隨時更正矣豫小子法祖敬天雖切於衷而推測協紀之方實未夙習兹因監臣之請按六儀新法參渾儀舊式製為璣衡撫辰儀繪圗著説以禆測候考天官家諸星紀數之闕者補之序之紊者正之勒為一書名曰儀象考成縱於斯之未信期允當之可循由是儀器正天象著而推算之法大備夫制器尚象以前民用莫不當求其至精至密矧其為授時所本熙績所關尤不容有秒忽差者折衷損益彰往察來以要諸盡善奉時修紀之道敢弗慎諸至乃基命宥密所為夙夜孜孜監于成憲者又自有在是為序南懷仁靈臺儀象志序夫古帝王憲天出治未有不以欽若敬授為兢兢也皇古以前可不論已若夫堯典置閏餘而定四時紀七政而明天度必在璿璣玉衡以齊之者誠以授時有理與象與數而儀器即在所首重也夫儀也者授時之理由此得精焉授時之法由此得密焉度數之學實範圍於此而莫可外焉矣聞之古人每遇交食分至及五緯凌犯諸變異乃始靜悟於心繼必詳録於䇿而猶恐考驗之無憑也乃復法象而製為器以其次年之所測較勘於前年之所驗者推而廣之接續成書精確不刋以貽來世使後之學者師其意而不泥其迹則凡授時諸數靡不可因之而有所考究焉且授時之法欲其歷世而常新也夫歷世愈逺則其理愈精而其為法乃愈密然非器之有合乎法又烏從闡微抉奧使法極其密而理極其精乎且夫天距地之逺者幾何日月五星各列本天而各天有上下層次及逺近相距一定之度列宿諸行之細微與夫七曜各有本道而諸道各有南北不同之兩極又各有本道所行各與地逺近與其行最低最髙之處皆各有定期又皆各有本體一定之度分五緯各有遲疾順逆諸行之不同亦有留而不行之定日凡此象數萬端難以測量之際要皆恃儀象而為之準則焉故授時者舍測候之儀而欲求法之明效大驗蔑由也是以稽時者必以儀為依據明時者必以儀為紀録失推者必以儀而改正算合者必以儀而參互較之者非儀無由而信從學之者非儀無由而啓悟良法得之以見其長敝法對之而形其短甚哉儀象之為用大也仁自受命以來夙夜祗懼畢智竭能務求精乎儀象之有利於用而以密測天行貽為典則此愚分之所矢素心自盡者也雖然儀象之作蓋以定永逺之明徵而使後世有以私智自用者無所騁其臆説則其事可易言也哉是何也夫諸儀有作之法有安之法有用之法三法備而後諸法可次第舉也况夫測天之儀貴恰肖乎天本然之象故其造法亦必以天象為準但廣大莫如天也覆冒無外輕清莫如天也健駛難形堅固微妙莫如天也運行終古而無虧經緯秩然而不紊使非會通而得其全乃漫云吾以制器也則必得此而失彼挂一而漏萬竊恐廣大輕清堅固微妙之四者未有能兼備而無遺者矣説者曰儀之體製巨則合天為易固已然所謂巨者其徑線長周面濶也則度數易分而分秒之微亦易見然其體巨則勢必不能輕巧而若少用其銅亦作徑長面濶之形則又必薄弱而不適於宜矣故特舉輕重學之數法并五金堅固之理以詳其用焉然諸儀應天道之度分南北兩樞又列春秋二分冬夏二至先後皆有常期黃赤二道地平天頂子午過極過至過分諸圈彼此相交於一點細微之內而各道各圈之中心又必同歸於一天體之中心而不使其毫髮之或謬斯已也但儀為小天之形未免拘限要能符合天象無所過差此其作儀之難者一也今諸儀已成界線布星固稱詳密矣然又使安置無法則窺測不靈而儀亦歸於無用矣此其安儀之難者二也且古來皆重正南之向然或稍偏東西則何所取以為定如勝國所營觀象臺在當時作者以為諸儀正對之規模萬向之標的由今察之其正面方向正南北線已多乖違何論東西與上下左右哉蓋儀中各道各圈各極各經緯之度分在天固有相應之元道元圈元極元經緯之度分也彼此互相照應者也假有一端之不應則測候即有不合者矣然安定正對之法既得矣茍用之未能通變反誣良法有不合天者此其用儀之難者三也仁今之所闡者亦惟明夫諸儀之用法以及於推測之所施蓋欲使學者由器而徵象由象而考數由數而悟理有所依據而盡心焉用以歷久逺而世禆夫羲和恢恢乎其有餘矣嗟乎自漢迄元改易者七十餘次而創法者十有三家其間創造儀象者指不多屈焉不可以見其難也哉仁不敏深懼授時之學不明於世而敬於昭代新創之諸儀逐節伸明演為解説精粗兼舉細大不捐而復圗之以互相引喻總以期乎理精法密不愧傳流以無負聖天子欽若敬授垂憲無窮之至意豫小臣敢自多其力與謹序南懷仁新制六儀説夫儀者時憲之法合天與不合天之明徵也故測驗天行儀愈多愈精而測驗乃愈密蓋凡天上一星所歷時刻雖躔有一定之度分然以儀相對而測之則必與天上東西南北之各道有上下左右逺近之分焉故測驗其星所躔之度分必依各道之經緯度分而推測之始無所戾是則欲為密合天行之法而非有備具密合天行各道之儀厥道無由也如康熙己酉八年正月初三日是日立春內院大學士圗海李霨諸巨公名卿奉旨同視測驗立春一節於本日午正仁測得太陽依象限儀在地平上三十三度四十二分依紀限大儀離天頂正南五十六度十八分依黃道經緯儀在黃道線正中在冬至後四十五度零六分在春分前四十四度五十四分依赤道經緯儀在冬至後四十七度三十四分在春分前四十二度二十六分在赤道南十六度二十一分依天體儀於立春度分所立直表則表對太陽而全無影依地平所立八尺零五寸表則太陽之影長一丈三尺七寸四分五釐六儀並用而參互之而立春一節皆合於預推定各儀之度分如此則凡所推之節氣其合於天行無疑矣然非藉有合法之儀又何從測而得之夫所謂儀之合法者抑豈憑臆説而強就之也哉要皆法其本然之象耳蓋渾天之體原有赤道有黃道而居乎渾天之半者曰地平經緯分焉故因其本然之象崇而效之制有三規一曰黃道經緯儀一曰地平經緯儀地平儀又分為二一曰經儀一曰緯儀即象限儀便用故也凡日月五星二十八宿之行以及所躔之度分總於此三規而推定焉四儀之外又有百遊之紀限儀旋轉盡變以對乎天凡有或正交或斜交於三規錯綜之行以定諸星東西南北相離逺近之度分不差纍黍總之天行七政於本圗所列之經緯各道之宫次度分諸星先後相連之序與夫東西南北相距之逺近皆從天體而見瞭如指掌焉故制六尺徑之天體儀以為諸儀之統且此六儀相須並用則凡礙之於彼者而有此以通之則亦何求不得哉故欲密測以求分秒無差則必六儀互用相參要以製器精良安置如式測驗得法而無有不合者矣其有不合者則即推其所以不合之端何在而更為釐正之使釐正之後測復參差則於諸儀中擇其所測之同者而用之如此而不密合乎天行者未之有也使止據一儀以求盡乎天如舊法之簡儀是何可信其為必然也哉蓋舊法黃赤儀膠柱而不運動况止可謂赤道儀無黃極無緯圈無黃表無測黃道經緯之正法其天頂立圈太近於地平其窺表不能測在地平相近之星夫天球而既無星距無黃道等圈無宫次之分其地平無度數則器總歸於無用矣考古圭表之法其圭原偏而向地平其表更偏而離天頂又離正南北之線故仁以勾股之法修正之庶幾可免夫乖舛也已戴進賢璣衡撫辰儀説虞書舜典在璿璣玉衡以齊七政孔頴逹疏曰璣衡者王者正天文之器漢世以來謂之渾天儀者是也馬融云渾天儀可旋轉故曰璣衡其橫簫所以視星宿也蔡雍云璣長八尺孔徑一寸下端望之以視星辰蓋懸璣以象天而橫望之轉璣窺衡以知星宿是其説也上天之體不可得知測天之事見於經者惟此璿璣玉衡一事而已揚子法言云或問渾天曰落下閎營之鮮于妄人度之耿中丞象之幾乎幾乎莫之能違也閎與妄人武帝時人宣帝時司農中丞耿壽昌始鑄銅為之象史官施用焉江南宋元嘉年太史丞錢樂陳氏師凱曰錢樂本名樂之孔疏脫之字鑄銅作渾天儀傳於齊梁周平江陵遷於長安尚書蔡注曰宋錢樂鑄銅作渾天儀衡長八尺孔徑一寸璣徑八尺圎周二丈五尺強轉而望之以知日月星辰之所在即璿璣玉衡之遺法也歷代以來其法漸密本朝因之為儀三重其在外者曰六合儀平置黑單環上刻十二辰八干四隅在地之位以準地面而定四方側立黑雙環背刻去極度數以中分天脊直跨地平使其半入地下而結於其子午以為天經斜倚赤單環背刻赤道度數以平分天腹橫繞天經亦使半出地上半入地下而結於其卯酉以為天緯三環表裏相結不動其天經之環則南北二極皆為圎軸虛中而內向以挈三辰四遊之環以其上下四方於是可考故曰六合次其內曰三辰儀側立黑雙環亦刻去極度數外貫天經之軸內挈黃赤二道其赤道則為赤單環外依天緯亦刻宿度而結於黑雙環之卯酉其黃道則為黃單環亦刻宿度而又斜倚於赤道之腹以交結於卯酉而半入其內以為春分後之日軌半出其外以為秋分後之日軌又為白單環以承其交使不傾墊以其日月星辰於是可考故曰三辰其最在內者曰四遊儀亦為黑雙環如三辰儀之制以貫天經之軸其環之內則兩面當中各施直距外指兩軸而當其要中之內面又為小窽以受玉衡要中之小軸使衡既得隨環東西運轉又可隨處南北低昂以待占候者之仰窺焉以其東西南北無不周遍故曰四遊此其法之大略也今考前史漢初落下閎造渾天儀本無黃道或云賈逵所加或云李淳風所加或云一行所加而宋錢樂之渾天儀制雖有黃道並無黃道經圈其四遊圈亦不貫於黃極則亦未盡黃道之用元郭守敬作簡儀乃分渾儀而變其制則設立運圈以測地平經緯度而不設黃道圈蓋黃道與黃極經圈成經緯設黃道又設經圈則圈多而不便於測候故不用黃道而専用赤道圈明正統三年鑄銅渾儀簡儀於北京即宋元遺法也我朝康熙八年監臣南懷仁新製六儀赤道黃道分為二器皆不用地平圈而地平象限天體諸儀則地平之經緯與黃赤之錯綜皆已畢具康熙五十二年監臣紀利安製地平經緯儀合地平象限二儀而為一其用尤便制作之妙於斯極矣我皇上敬天法祖齊政勤民親蒞靈臺遍觀儀象以渾天制最近古而時度信宜從今觀其會通斯成巨典於是用今之數目合古之型模御製璣衡撫辰儀用禆測候誠唐虞之遺意昭代之新規也儀制三重其在外者即古之六合儀而不用地平圈其正立雙環為子午圈兩面皆刻周天三百六十度自南北極起初度至中要九十度是為天經斜倚單環為天常赤道圈兩面皆刻周日十二時以子正午正當子午雙環中空之半而結於其中要是為天緯其南北二極皆設圎軸軸本實於子午雙環中空之間而軸內向以貫內二重之環其下承以雲座仰面正中開雙槽以受雙環東面正中開雲窩以受垂球下面置十字架施螺旋以取平架之東西兩端各植龍柱龍口銜珠開孔以承天常赤道卯酉之兩軸依觀象臺測定南北正線將座架安定則平面之四方正又依京師北極出地三十九度五十五分自北極而上五十度五分即上應天頂自南極而下五十度五分即下對地心而應天頂之衝於天頂施小釘懸垂線而垂適當地心又適切於雙環之面不即不離則上下正立面之四方亦正而地平已在其中故不用地平圈也次其內即古之三辰儀而不用黃道圈其貫於二極之雙環為赤極經圈兩極各設軸孔以受天經之軸兩面皆刻周天三百六十度結於赤極經圈之中要與天常赤道平運者為遊旋赤道圈兩面皆刻周天三百六十度與天之赤道旋轉相應自經圈之南極作兩象限弧以承之使不傾墊測得三辰之赤道經緯度則黃道經緯可推且黃道與赤道之相距古逺今近縱或日久有差而儀器無庸改制故不用黃道圈也其在內者即古之四遊儀貫於二極之雙環為四遊圈兩面皆刻三百六十度定於逰圈之兩極者為直距綰於直距之中心者為窺衡遊圈中要設直表以指經度及時窺衡右旁設直表以指緯度此古今所同無容置議者也是故體制倣乎渾天之舊而時度尤為整齊運量同於赤道新儀而重環更能合應至於借表窺測則上下左右無不宜焉夫羲和遺制不可考已漢世以來或作而不傳或傳而不久蓋制器尚象若斯之難也而稽古宜今至我朝乃臻盡善易繫傳云備物致用立成器以為天下利莫大乎聖人詎不信乎弧線弧三角形弧三角形者球面弧線所成也古専家有黃赤相準之率大約就渾儀度之僅得大概未能形諸算術惟元郭守敬以弧矢命算黃赤相承始有定率視古為密但其法用三乘方取數甚雜自西人利瑪竇湯若望等翻譯算書始有曲線三角形之法三弧度相交成三角形其三弧三角各有相應之八線弧與弧相交即線與線相遇而勾股比例焉於是乎有黃道可以知赤道有赤道可以知黃道有經可以知緯有緯可以知經觀象之法至此而備勾股之用至此而極矣正弧三角形正弧三角形必有一直角者蓋因南北二極為赤道之樞紐皆距赤道九十度蓋凡過南北二極經圈與赤道相交所成之角俱為直角其相當之弧皆九十度又凡有一圈即有兩極其過兩極經圈與本圈相交亦必為直角其所成三角形必皆為正弧三角形夫正弧三角形所知之三件弧角相對者用弧角之八線所成勾股為比例而弧角不相對者則用次形蓋以弧角之八線所成勾股比例不生於本形而生於次形而次形者乃以本形與象限相減之餘度所成故用本形之餘弦餘切即用次形之正弦正切也其法可易弧為角易角為弧若斜弧三角形可易大形為小形易大邊為小邊鈍角為鋭角邊與角雖不相對可易為相對且知三角即可以求邊其理實一以貫之也斜弧三角形弧三角之有斜弧形猶直線三角之有鋭鈍形也但直線三角之鋭鈍形惟二種一種三角俱鋭一種一鈍兩鋭而斜弧形則不然或三角俱鋭或三角俱鈍或兩鋭一鈍或兩鈍一鋭其三邊或俱大過於九十度或俱小不及九十度或兩大一小或兩小一大參錯成形為類甚多而新法數書所載推算之法益復繁雜難稽蓋三角三邊各有八線但線與線之比例相當即可相求是故或同步一星或同推一數而所用之法彼此互異遂使學者莫知所從兹約以三法求之無論角之鋭鈍邊之大小並視先所知之三件為斷其一先知之三件有相對之邊角又有對所求之邊角則用邊角比例法其一先知之三件有相對之邊角而無對所求之邊角或求角而無對角之邊或求邊而無對邊之角則用垂弧法其一先知之三件無相對之邊角或三邊求角或有兩邊一角而角在所知兩邊之間或三角求邊或有兩角一邊而邊在所知兩角之間則用總較法明此三法則斜弧之用已備而七政之升降出沒經緯之縱橫交加無不可推測而知矣臣等謹按考成上編所載弧三角形備列綱領條目圗説相求比例總較之法誠以恆星七政皆藉是以推步也兹録總論及正斜形各一篇附於儀象之後學天文者因器求線神而明之簡易之妙不外斯云皇朝通志卷二十三
