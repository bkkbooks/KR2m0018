body:
  text: 諡略五尚書諡禮部尚書二等輕車都尉滿達爾漢諡敬敏順治十二年十月追諡兵部尚書三等輕車都尉伊孫諡襄壯順治十二年十月追諡少保兼太子太保禮部尚書王鐸諡文安順治十年十二月諡兵部尚書張秉貞諡僖和順治十三年正月諡兵部尚書贈太子少保李際期諡僖平順治十三年正月諡巡撫南贛太子太保兵部尚書兼都察院右副都御史劉武元諡明靖順治十三年正月諡提督操江巡撫安徽等處太子太保兵部尚書兼都察院右副都御史李昆諡忠敏順治十三年閏五月諡巡撫河南兵部尚書兼都察院右副都御史吳景道諡慤僖順治十三年六月諡理藩院尚書一等輕車都尉沙濟達喇諡正直順治十三年六月諡巡撫甘肅兵部右侍郎加兵部尚書周文華諡僖敬順治十三年六月諡吏兵二部尚書都統一等輕車都尉噶達洪諡敏壯順治十四年六月諡致仕太子太保工部尚書謝啓光諡僖敏順治十五年八月諡少保兼太子太保吏部尚書王永吉諡文通順治十六年三月諡户部尚書寧古里諡勤敏康熙二年三月諡致仕太子太保吏部尚書明安達禮諡敏果康熙八年二月諡太子少保户部尚書蘇納海諡襄愍康熙八年八月追諡巡撫直𨽻工部尚書王登聮諡慤愍康熙八年八月追諡少傅兼太子太傅工部尚書劉昌諡勤僖康熙九年七月諡巡撫山東工部尚書袁懋功諡清獻康熙十年十一月諡太子太保內大臣理藩院尚書喀蘭圖諡敏壯康熙十二年三月諡禮部尚書龔鼎孳諡端毅康熙十二年十二月諡太子少師工部尚書性納諡敏襄康熙十三年八月諡太子太保兵部尚書王宏祚諡端簡康熙十三年十二月諡户部尚書一等男又一雲騎尉米思翰諡敏果康熙十四年二月諡刑部尚書姚文然諡端恪康熙十七年七月諡致仕太子太保禮部尚書王崇簡諡文貞康熙十七年十二月諡刑部尚書劉楗諡端敏康熙十八年十月諡翰林院掌院學士兼禮部侍郎贈禮部尚書拉沙里諡文敏康熙十九年正月諡巡撫直𨽻兵部尚書金世德諡清惠康熙十九年五月諡廣西巡撫贈太子少保兵部尚書馬雄鎮諡文毅康熙十九年七月諡工部尚書陳􅀈永諡文和康熙二十年六月諡禮部尚書銜刑部右侍郎兼翰林院學士葉方藹諡文敏康熙二十一年八月諡禮部尚書管刑部尚書事郭四海諡文敏康熙二十一年十二月諡吏部尚書郝惟訥諡恭定康熙二十二年九月諡刑部尚書魏象樞諡敏果康熙二十六年十月諡吏部尚書鄂爾多諡敏恪康熙三十年閏七月諡議政大臣刑部尚書圖納諡文恪康熙三十六年四月諡禮部尚書兼太常寺卿署倉場總督事荆山諡端簡康熙五十六年三月諡兵部尚書趙宏燦諡敏恪康熙五十六年五月諡福建巡撫贈禮部尚書陳璸諡清端康熙五十七年十月諡户部尚書趙申喬諡恭毅康熙五十九年十一月諡禮部尚書陳詵諡清恪雍正元年十二月諡禮部尚書贈太子太保張伯行諡清恪雍正三年二月諡禮部尚書贈太傅顧八代諡文端雍正三年八月追諡左都御史贈太子少傅禮部尚書沈近思諡端恪雍正五年十二月諡福建巡撫贈兵部尚書朱綱諡勤恪雍正六年十月諡户部尚書贈太子少保德明諡端勤雍正十年四月諡太子少傅吏部尚書勵廷儀諡文恭雍正十年五月諡禮部尚書加太子少保錢以塏諡恭恪雍正十年十一月諡禮部尚書張大有諡文敬雍正十一年二月諡禮部尚書吳士玉諡文恪雍正十一年三月諡禮部尚書吳襄諡文簡雍正十三年三月諡禮部侍郎追贈尚書蔡世逺諡文勤乾隆元年二月追諡禮部尚書兼管國子監事贈太子太傅楊名時諡文定乾隆元年十一月諡太子太保户部尚書三等男高其倬諡文良乾隆三年十二月諡太子太保吏部尚書甘汝來諡莊恪乾隆四年十月諡太子少保尚書銜食俸贈太傅徐元夢諡文定乾隆六年十二月諡刑部尚書兼管國子監事劉吳龍諡清慤乾隆七年七月諡吏部尚書楊超曾諡文敏乾隆八年三月諡太子太保刑部尚書張照諡文敏乾隆十一年五月諡致仕吏部尚書性桂諡恭簡乾隆十二年十一月諡太子少保內大臣户部尚書海望諡勤恪乾隆二十年十一月諡致仕工部尚書魏廷珍諡文簡乾隆二十一年四月諡吏部尚書王安國諡文肅乾隆二十二年四月諡太子太傅吏部尚書贈太子太師汪由敦諡文端乾隆二十三年三月諡户部尚書贈太子太保李元亮諡勤恪乾隆二十六年七月諡工部尚書歸宣光諡昭簡乾隆二十八年二月諡河南巡撫贈太子太保兵部尚書胡寶瑔諡恪靖乾隆二十八年二月諡太子太保刑部尚書秦蕙田諡文恭乾隆二十九年十一月諡禮部尚書董邦達諡文恪乾隆三十四年九月諡刑部尚書贈太子太保楊廷璋諡勤慤乾隆三十七年二月諡刑部左侍郎贈尚書錢維城諡文敏乾隆三十八年二月諡太子少傅工部尚書裘曰修諡文達乾隆三十八年五月諡太子太保吏部尚書託庸諡誠毅乾隆三十八年十一月諡刑部侍郎加太子太傅刑部尚書贈太傅錢陳羣諡文端乾隆三十九年三月諡致仕都察院左都御史加太子太傅禮部尚書張泰開諡文恪乾隆三十九年十月諡工部尚書贈太子太保閻循琦諡恭定乾隆四十一年二月諡户部尚書贈太子太保王際華諡文莊乾隆四十一年四月諡吏部右侍郎加尚書銜吳紹詩諡恭定乾隆四十一年十二月諡太子少保禮部尚書鐘音諡文恪乾隆四十三年十月諡廣東巡撫贈尚書銜李湖諡恭毅乾隆四十六年十二月諡刑部尚書德福諡勤肅乾隆四十七年十月諡禮部尚書曹秀先諡文恪乾隆四十九年九月諡都察院左都御史贈兵部尚書周煌諡文恭乾隆五十年六月諡理藩院尚書博清額諡恭勤乾隆五十年七月諡都御史諡都察院左副都