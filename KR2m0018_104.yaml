body:
  text: 欽定四庫全書皇朝通志巻一百四藝文畧八文類第十二下總集書賦史碑碣評四六餘奏議文詩詩總集御選古文淵鑒六十四卷康熙二十四年學士徐聖祖仁皇帝御選内閣乾學等奉編註敕御定全唐詩九百卷康熙四十二年奉敕編御定佩文齋咏物詩選四百八十二卷康熙四十五年奉敕編御定歴代題畫詩類一百二十卷康熙四十六年奉敕編御定四朝詩二百九十二卷康熙四十八年奉敕編御定全金詩七十四卷康熙五十年奉敕編御選唐詩三十二卷附録三卷康熙五十二年御定聖祖仁皇帝御選唐宋文醇五十八卷乾隆三年御定御選唐宋詩醇四十七卷乾隆十五年御定皇清文頴一百二十四卷乾隆十二年御定欽定四書文四十一卷乾隆元年奉敕編詩紀匡繆一卷馮舒撰玉臺新咏考異十卷紀容舒撰明文海四百八十二卷黄宗羲編唐賢三昩集三卷王士正編二家詩選二卷王士正刪録明徐禎卿高叔嗣二人詩唐人萬首絶句選七卷王士正編明詩綜一百卷朱彛尊編宋詩鈔一百六卷吳之振編宋元詩㑹一百卷陳焯編粤西詩載二十五卷粤西文載七十五卷粤西叢載三十卷汪森編元詩選一百一十一卷顧嗣立編全唐詩録一百卷徐倬編甬上耆舊詩三十卷胡文學編檇李詩繫四十二卷沈季友編古文雅正十四卷蔡世逺編鄱陽五家集十五巻史簡編南宋雜事詩七卷沈嘉轍呉焯陳芝光符曾趙昱厲鶚趙信同撰宋百家詩存二十八卷曹庭棟編以上見文淵閣著録昭明文選越裁十一卷洪若臯編選詩定論十八卷吳湛撰文選音義八卷余蕭客撰馮氏校定玉臺新咏十卷馮舒校二馮評㸃才調集十卷馮舒馮班同評玉臺新咏箋註十卷呉兆宜撰唐詩鼓吹箋註十卷錢朝鼎王俊臣同註王清臣陸貽典同箋續宛雅八卷蔡蓁春施閏章同編宛雅三編二十四卷施念曾張汝霖同編蕭氏世集無卷數蕭伯升編太倉十子詩選十卷呉偉業編樂府英華十卷顧有孝編唐宫閨詩二卷費密編斯文正統十二卷刁包編樂府廣序三十卷朱嘉徴編三蘇談十卷高阜撰栁洲詩集十卷陳增新等編三家文鈔三十二卷宋犖編江左十五子詩選十五卷宋犖編溯洄集十卷魏裔介撰高言集四卷田茂遇董俞同編古文輯畧無卷數曹本榮編臨川文獻八卷胡亦堂編詩原二十五卷顧大申撰滕王閣集十三卷續集無卷數蔡士英編宋金元詩永二十卷補遺二卷吳綺編澄逺堂三世詩存八卷李繩逺編古詩選三十二卷王士正編十種唐詩選十七卷王士正編載書圖詩一卷王士正編新安二布衣詩八卷王士正編明吳兆程嘉燧二人詩樵川二家詩四卷朱霞編宋嚴羽元黄鎮成二人詩宋四名家詩無卷數周之鱗柴升同編楊氏五家文鈔十二卷楊長世及其從子以獻以儼從孫兆鳯兆年撰翠樓集三巻劉之份編詩苑天聲二十一卷范良撰練音集補七巻王輔銘増補明翟校原本國朝練音集十二巻王輔銘編姑蘇楊栁枝詞一卷汪琬編金華文略二十巻王崇炳編説唐詩二十二卷徐増撰百名家詩選八十九卷魏憲編皇清詩選三十卷孫鋐編國雅初集無卷數陳允衡編宋詩刪二十五巻顧貞觀編續垂棘編三集十卷四集九卷范鄗鼎編傳是樓宋人小集無卷數不著編輯名氏榕村講授三卷李光地編古文精藻二卷李光地編羣雅集十二卷李振裕編瑞竹亭合稿四巻王愈擴及其弟愈融撰姚江逸詩十五卷黄宗羲編明文授讀六十二卷黄宗羲編洛如詩鈔六卷朱彛尊選陸奎勲編漢詩音註五卷漢詩評五卷李因篤撰詩觀十四卷别集二卷鄧漢儀編朱子論定文鈔二十巻吳震方編鳯池集無巻數沈玉亮吳陳琰同編續三體唐詩八卷髙士竒編唐詩掞藻八卷高士竒編楚風補五十卷廖元度編四家詩鈔二十八卷王企埥編濓洛風雅九卷張伯行編于野集七卷王原編唐宋十大家全集録五十一卷儲欣編松風遺韻五十一卷姚宏緒編述本堂詩集十八巻方登嶧及其子式濟孫觀承撰青溪先正詩集無卷數鮑楹編延陵書塾合璧四巻吳季長撰八劉唐人詩集八卷劉青夕編唐詩叩彈集十二卷續集三卷杜詔杜庭珠同編邱海二公文集合編十六卷焦映漢賈棠同編明文逺無巻數徐文駒編文章鼻祖六卷楊繩武編唐四家詩八卷汪立名編二家詩鈔二十巻邵長蘅選王士正宋犖二人詩棣蕚書屋近刻四卷朱緗及其弟綘綱撰誠求堂彚編六卷徐間錫撰明文在一百卷薛熙編漢詩説十卷費錫璜沈用濟同編嶺南五朝詩選三十五卷黄登編義門鄭氏奕葉吟集七卷鄭爾垣編義門鄭氏奕葉集十卷鄭爾垣編宋十五家詩十六卷陳訏編篤敘堂詩集五卷許豸許友許遇許鼎許均許簠臣許良臣撰續姚江逸詩十二卷倪繼宗編韜光菴紀遊集無巻數釋山止編興善寺歴代名賢留題集二巻釋净溥編倪城風雅二巻勞巁編三詩合編三巻黄光岳編吳學詩黄鎡李堅三人詩渠風集略七卷馬長淑編七十二峯足徴集一百一卷吳定璋編明倫初集五巻續集五巻鄭文炳編長林四世弓冶集五卷林其茂編莆風清籟集六十卷鄭王臣編山左明詩鈔三十五巻宋弼編廣東詩粹十二巻梁善長編豐陽人文紀略十巻聶芳聲編南園後五子詩集二十八卷陳文藻等編二南遺音四卷劉紹攽編崇川詩集十二卷孫翔編柬臯詩存四十八卷王之珩編濮川詩鈔三十五巻不著編輯名氏閨秀集初編五卷閨秀季婣編磁人詩十巻楊方晃編晚唐詩鈔二十六卷查克宏編友聲集七卷頼鯤升編殘本湖陵江氏集五卷江八斗編以上見四庫全書存目總集類凡一百三十六部賦御定歴代賦彚一百四十巻外集二十卷逸句二卷補遺二十二卷康熙四十五年奉敕編以上見文淵閣著録歴朝賦格十五巻陸葇編東山草堂集六卷潘安禮撰皆其所作律賦歴朝賦楷八卷王修玉編以上見四庫全書存目賦類凡四部碑碣欽定校正淳化閣帖釋文十卷乾隆三十四年淳化命内廷諸臣校定閣帖刻石加以案語釋文侍郎金簡恭録為是編求古録一卷顧炎武撰金石文字記六巻顧炎武撰石經考一巻顧炎武撰石經考一巻萬斯同撰來齋金石考三巻林侗撰嵩陽石刻集記二卷葉封撰觀妙齋金石文考略十六卷李光映撰淳化秘閣法帖考正十二卷王㴻撰竹雲題跋四卷王㴻撰金石經眼録一巻禇峻摹圖牛運震補説石經考異二巻杭世駿撰以上見文淵閣著録禊帖綜聞一巻胡世安撰閒者軒帖考一巻孫承澤撰天發神䜟碑釋文一巻周在浚撰昭陵六駿贊辨一巻張弨撰瘞鶴銘辨一巻張弨撰瘞鶴銘考一巻汪士鋐撰金石遺文録十巻陳奕禧撰續金石録無巻數葉萬撰金石續録四巻劉青藜撰中州金石考八卷黄叔璥撰石蹟記一卷不著撰人名氏以上見四庫全書存目碑碣類凡二十三部四六陳檢討四六二十巻陳維崧撰程師恭註以上見文淵閣著録善卷堂四六十巻陸繁弨撰吳自高註以上見四庫全書存目四六類凡二部奏議欽定明臣奏議二十巻乾隆四十六年奉敕編張襄壯奏疏六卷張勇撰文襄奏疏八巻蘄輔撰莘野疏稿五巻郭琇撰以上見文淵閣著録奏議稽詢四十四卷曹本榮編兼濟堂奏疏無巻數魏裔介撰文襄公奏疏十五巻附年譜一巻李之芳撰郝恭定集五卷郝維訥撰清忠堂奏疏無卷數朱宏祚撰西臺奏議一卷京兆奏議一卷附曲徙録一卷楊素藴撰大觀堂文集三卷余縉撰疏稿一卷胡文學撰存菴奏疏無卷數徐越撰楊黄門奏疏無巻數楊雍建撰撫黔奏疏八巻楊雍建撰于山奏牘七卷附詩詞一巻于成龍撰平岳疏議一巻平海疏議一卷附平海咨文一卷師中小札一巻萬正色撰督漕疏草二十二卷董訥撰奏議稿無卷數江蘩撰撫豫宣化録四巻田文鏡撰河防疏略二十卷朱之錫撰以上見四庫全書存目奏議類凡二十一部書牘雋四卷蕭士琦撰尺牘新語二十四卷徐士俊汪淇同編尺牘嚶鳴集十二卷王相編以上見四庫全書存目書類凡三部文史金石要例一卷黄宗羲撰文心雕龍輯注十卷黄叔琳撰以上見文淵閣著録四六金針一卷陳維崧撰棗林藝簣一卷談遷撰然脂集例一卷王士禄撰鐵立文起二十二卷王之績撰以上見四庫全書存目文史類凡六部詩評歴代詩話八十卷吳景旭撰漁洋詩話三卷王士正撰師友詩傳録一卷續録一卷郎廷槐編劉大勤續編談龍録一卷趙執信撰宋詩紀事一百卷厲鶚撰全閩詩話十二卷鄭方坤撰五代詩話十卷鄭方坤得王士正五代詩話原稿重為補正以上見文淵閣著録蠖齋詩話二卷施閏章撰詩話八卷毛竒齡撰詩辨坻四卷毛先舒撰五代詩話十二卷王士正遺稿宋弼等補輯圍爐詩話八卷吳喬撰漫堂説詩一卷宋犖撰説詩樂趣二十卷附偶詠草續集一卷伍涵芬撰栁亭詩話三十卷宋長白撰原詩四卷葉爕撰春秋詩話五卷勞孝輿撰榕城詩話三巻杭世駿撰學稼餘譚三卷不著撰人名氏以上見四庫全書存目詩評類凡十九部詩餘詞集詞話詞選詞韻臣等謹按鄭志文類細目至文史詩評而止今從欽定續通志之例增入詩餘一門並以詞集詞選詞話詞韻分𨽻焉珂雪詞二巻曹貞吉撰以上見文淵閣著録蓼花詞一巻余光耿撰玉山詞無巻數陸次雲撰炊聞詞二巻王士禄撰南耕詞六巻嵗寒詞一卷曹亮武撰情田詞三巻邵璸撰澹秋容軒詞一卷范青撰四香樓詞鈔無卷數范纘撰以上見四庫全書存目右詞集御定歴代詩餘一百二十巻康熙四十六年奉敕編詞綜三十四卷朱彛尊編十五家詞三十九卷孫黙編絶妙好詞箋七卷查為仁厲鶚同撰以上見文淵閣著録選聲集三卷吳綺撰羣賢梅苑十卷舊題朱鶴齡編今訂為偽本蕉雨軒詩餘彚選八卷陳㴻編粤風續九四卷吳淇編東白堂詞選初集十五卷佟世南撰名家詞鈔無卷數聶先撰林下詞選十四卷周銘撰浙西六家詞十卷不著編輯名氏以上見四庫全書存目右詞選詞藻四卷彭孫遹撰詞話二卷毛竒齡撰詞苑叢談十二巻徐釚撰以上見文淵閣著録古今詞話六巻沈雄撰古今詞論一卷王又華撰填詞名解四卷毛先舒撰以上見四庫全書存目右詞話詞律二十卷萬樹撰以上見文淵閣著録詞韻簡一卷吳綺撰詞韻二卷仲恒撰詞學全書十四卷查繼超編以上見四庫全書存目右詞韻詩餘類凡三十部皇朝通志卷一百四
