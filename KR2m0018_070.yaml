body:
  text: 職官略七盛京將軍等官盛京將軍一人掌鎮撫分留都安輯旗民董率文武副都統三人各守地以贊其治盛京等處駐防城守尉十人協領十人佐領一百二十四人防禦九十二人驍騎校二百有四人掌巡防譏察之事又有委官一百人皆以七品冠帶食領催前鋒錢糧將軍衙門主事一人筆帖式十有一人各處駐防衙門筆帖式十有三人倉官六人分掌行移案牘糧儲出納之事吉林將軍一人掌鎮守吉林烏喇等處地方繕固鎮戍綏和軍民秩祀山川輯寧邉境副都統五人各守分地以贊其治各處駐防總管一人協領二十有五人參領一人佐領一百十九人防禦八十有一人驍騎校一百十六人管水手四品官二人五品官二人六品官二人職掌與盛京各駐防同吉林理事同知一人獄官一人掌獄訟之事將軍衙門主事一人筆帖式十有二人白都訥副都統衙門委署主事一人各處駐防衙門筆帖式二十有八人管臺站筆帖式十有二人管倉筆帖式十有二人倉官七人助教十人分掌文案郵傳倉儲教習之事黑龍江將軍一人掌鎮守黑龍江等處地方均齊政刑修舉武備綏徠部旗控制東陲副都統三人各守分地以贊其治各處駐防副都統銜總管一人城守尉一人協領十有六人總管七人參領一人副總管二十有六人佐領二百三十八人防禦二十有四人驍騎校二百三十一人護軍校二人管水手四品官四人五品官二人六品官四人管造船四品官一人五品官一人六品官一人職掌與主盛京吉林各駐防同將軍衙門主事一人理刑事一人銀庫主事一人筆帖式十有二人各處駐防衙門筆帖式二十人管臺站筆帖式三十有三人六品官二人臺站官二人管倉筆帖式六人管官屯七品官四人分掌刑名賦餉郵驛倉儲之事臣等謹按盛京為發祥重地分置節帥率師鎮守西自呼倫布雨爾北循興安嶺黑龍江而東南跨鴨緑江地方五六千里各因形勢險要列屯置戍以控扼之兵防周密條畫周詳皇上覲揚光烈翠華臨蒞秋郊獮閲賞賚優加復屢命增置辨兵修繕甲仗慎選親勳俾膺閫寄規模益昭閎逺矣新疆各官伊犂將軍一人統掌新疆之軍政參贊大臣一人領隊大臣五人印房司官二人筆帖式二人糧餉司官二人筆帖式一人駝馬處司官一人筆帖式一人卡倫侍衛十二人總管六人副總管七人協領十有二人佐領一百有八人防禦五十有六人驍騎校一百有八人署理營務筆帖式十人總理回務伯克二十三人臣等謹按伊犁本準噶爾部在天山之北以平定之後移回人于此屯種故設伯克以總理之伯克本回部官名我皇上加意綏懷從大臣所請仍其舊號而定以品秩自三品以至七品等序有差所謂齊其俗不易其宜之至意也烏嚕木齊都統一人副都統一人掌烏嚕木齊之軍政滿洲緑旗官兵皆屬焉協領六人佐領二十有四人防禦二十有四人驍騎校二十有四人九品筆帖式二人卡倫侍衛二人庫爾喀喇烏蘇領隊大臣一人屬於烏嚕木齊管理糧餉官一人又有管理臺站屯政文武各員或由陜甘二省除派或由伊犁烏嚕木齊調撥無定員塔爾巴哈臺參贊大臣一人領隊大臣二人初駐雅爾後移今治總管一人副總管一人佐領四人驍騎校八人卡倫侍衛十二人印房章京三人筆帖式三人管理糧餉官一人巴里坤領隊大臣一人協領四人佐領十六人防禦十六人驍騎校十六人印房筆帖式二人臣等謹按烏嚕木齊已設迪化州州屬各官統於甘肅省至巴里坤今為鎮西府治且原𨽻版圖不在新疆之數以其為新疆北路之門户故以參贊大臣並列於此至其屬官則各見本門中烏什等處參贊大臣一人自烏什葉爾羌以下山南回部皆所統屬協理大臣一人阿克蘇領隊大臣一人掌烏什阿克蘇之政令兼統賽喇木拜城其阿克蘇一城舊别設大臣乾隆三十一年併𨽻烏什印房章京二人筆帖式三人管理糧餉官一人協領一人佐領二人防禦二人驍騎校二人護送伯克侍衛一人卡倫侍衛十有一人軍臺委署筆帖式十人管理回民伯克五十八人葉爾羌辦事大臣一人協辦大臣一人印房章京二人筆帖式三人委署筆帖式二十人管理糧餉官一人佐領二人驍騎校二人聽差坐卡侍衛十三人管理回民伯克四十八人和闐辦事大臣二人委署筆帖式二人管理回民伯克四十九人喀什噶爾辦事大臣一人協理大臣一人印房章京一人辦理回務章京一人筆帖式一人委署筆帖式六人軍臺委署筆帖式一人管理糧餉官一人總管一人參領二人防禦一人驍騎校三人聽差守卡侍衛十三人管理回民伯克五十四人庫車辦事大臣一人兼轄沙雅爾印房章京一人筆帖式二人委署筆帖式三人辦理糧餉官一人管理回民伯克三十人哈喇沙爾辦事大臣一人印房筆帖式六人管理糧餉官一人管理回民伯克二十人吐魯畨辦事大臣一人初駐闢展乾隆四十二年改駐吐魯畨參領二人佐領十有五人驍騎校十有五人印房章京一人正八品筆帖式一人委署筆帖式六人總理回務札薩克郡王一人協理圖撒拉克齊二人伯克十人哈密辦事大臣二人印房章京一人驍騎校一人筆帖式六人總理回衆郡王一人臣等謹按哈密歸附已久以其為新疆南北兩路之門户故列於此哈密闢展吐魯畨諸境並設有同知通判巡檢等官𨽻於甘肅省兹不備述欽惟皇上德威廣播蕩平準部戢定回疆天山南北二萬里而遙悉歸版宇建城邑置官守廣屯種轄以參贊大臣諸務秩舉鴻規巨典條理粲如至山南回部諸官錫名仍舊品秩則悉視天朝賞罰黜陟亦與內地諸官無異威德昭宣膚功於爍伊古以來所未睹也各處駐劄大臣喀爾喀軍營定邉左副將軍一人烏里雅蘇台參贊大臣一人科布多參贊大臣一人掌喀爾喀四部之軍政凡四部會盟參贊大臣間嵗