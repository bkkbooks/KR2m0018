郭里氏古英鑲白旗人世居寧衮郭羅地方從征吳逆陣亡贈騎都尉祀昭忠祠寧佳特氏博爾博遜鑲白旗人世居察哈爾地方從征吳逆陣亡贈雲騎尉祀昭忠祠鄂濟特氏拜星果勒鑲紅旗人世居巴林地方從征吳逆陣亡贈雲騎尉祀昭忠祠烏楚肯氏阿里瑪鑲紅旗人世居喀喇沁地方雍正中以員外郎從征凖噶爾陣亡贈雲騎尉祀昭忠祠兆齊特氏舍利保鑲紅旗人世居察哈爾地方雍正中從征準噶爾陣亡贈雲騎尉祀昭忠祠博爾克氏宜穆圖正藍旗人世居敖漢地方順治初以擊流賊功授騎都尉後征湖廣陣亡贈一等輕車都尉蘇宻爾氏碩蘭泰正藍旗人世居黄山地方由騎都尉從征福建海寇陣亡贈三等輕車都尉祀昭忠祠巴岳圖氏巴圖禮正藍旗人世居察哈爾地方順治中征浙江陣亡贈雲騎尉祀昭忠祠諾勒特氏烏拉海正藍旗人世居巴林地方從征吳逆陣亡贈雲騎尉祀昭忠祠薩喇圖氏阿海正藍旗人世居葉赫地方從征耿逆陣亡贈雲騎尉祀昭忠祠囊嘉特氏烏拉岱正藍旗人世居科爾沁地方由䕶軍校從征吳逆陣亡贈雲騎尉祀昭忠祠鄂禮克氏達賴鑲藍旗人世居察哈爾地方順治中從征河南江南有功後征甘州陣亡贈騎都尉祀昭忠祠鄂爾敦氏和濟格爾鑲藍旗人世居敖漢地方從征吳逆陣亡贈雲騎尉祀昭忠祠齊黙特氏羅布希鑲黄旗人以軍功授二等輕車都尉後征吳逆陣亡贈三等男祀昭忠祠瑪古思氏班第正黄旗人任都統三等男和托果特氏薩喇勒正黄旗人任副都統二等超勇伯皇朝通志卷七
