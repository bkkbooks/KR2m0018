body:
  text: 氏族畧七附載滿洲八旗姓臣等謹按滿洲蒙古姓氏具載八旗氏族通譜前卷已倣照編列今考八旗通志内名臣勲臣忠烈各傳及行查八旗檔冊所載姓氏有八旗氏族通譜所未見者謹另載一卷以備稽覽至所載之人無多不能以官職崇卑為區别悉照本傳及原冊録入其原籍無考者概不登載云洪羅氏拖色鑲黄旗人世居松阿里烏拉地方從征耿吳二逆叙功授騎都尉鄂岳氏五格鑲黄旗人世居錫伯哩城哈達地方從征吳逆及征厄魯特噶爾丹有功授騎都尉英資鑲紅旗人世居葉赫地方康熙中從征厄魯特噶爾丹陣亡贈騎都尉祀昭忠祠顔濟氏伊騰鑲白旗人世居葉赫地方從征浙江雲南有功授雲騎尉費雅氏吞珠祜鑲白旗人世居輝發地方從征吳逆有功授雲騎尉額托氏薩音達哩正紅旗人世居長白山地方順治中從征俄羅斯陣亡贈雲騎尉祀昭忠祠其子席錦泰襲職從征厄魯特噶爾丹有功加授騎都尉老溝氏金泰正紅旗人世居老溝地方雍正中由前鋒校從征準噶爾陣亡贈雲騎尉祀昭忠祠臣等謹按老溝係地名以地為氏托里氏簡泰鑲白旗人世居薩哈連烏拉地方順治中從征雲南陣亡贈雲騎尉祀昭忠祠松顔氏烏噶達鑲紅旗人世居尼雅滿地方康熙中從征吳逆陣亡贈雲騎尉祀昭忠祠倉佳氏噶布碩鑲藍旗人世居松阿里河地方崇徳中從征明陣亡贈佐領其弟西竒納襲職順治中從征山東陣亡加贈雲騎尉並祀昭忠祠商佳氏海保鑲藍旗人世居鄂和地方康熙中從征陜西陣亡贈雲騎尉祀昭忠祠鄂諾氏西宻賴鑲黄旗人世居薩哈連烏拉地方任副都統雍正中從征準噶爾陣亡贈騎都尉祀昭忠祠修和哩氏齊拉布正白旗人康熙中從征江西陣亡贈雲騎尉祀昭忠祠博爾津氏巴扎爾正白旗人世居阿巴噶克嚕倫地方從征吳逆陣亡贈雲騎尉祀昭忠祠扎嚕察氏索倫正白旗人世居杜賢地方康熙中由藍翎侍衛從征準噶爾陣亡贈騎都尉祀昭忠祠郭齊里氏特穆深鑲紅旗人世居徳爾吉阿庫哩地方崇徳中從征山東陣亡贈騎都尉祀昭忠祠鈕旺堅氏烏達納鑲藍旗人世居輝發地方崇徳中從征明陣亡贈騎都尉祀昭忠祠覺爾察氏達海正藍旗人世居覺爾察地方通滿漢文國初直内廷専司滿文翻譯漢書天聰中白旗人賜巴克什號授遊撃世職諡文成辛泰正任三等輕車都尉䕶軍統領從征陣亡贈騎都尉祀昭忠祠錫爾根正白旗人任内大臣加太子太保其孫珍泰任齊齊哈爾將軍牛鈕鑲紅旗人從征耿逆及𠞰海冦屢著軍功任副都統臣等謹按覺爾察係地名以地為氏伯蘇特氏廣東鑲藍旗人世居佛阿拉地方以從征吳逆功授雲騎尉薩瑪喇氏花色鑲黄旗人世居寧古塔地方康熙中從征四川陣亡贈雲騎尉祀昭忠祠諤爾格氏徳福鑲黄旗人世居薩哈連烏拉諤爾格村地方雍正中從征準噶爾陣亡贈雲騎尉祀昭忠祠拉庫勒氏卓爾泰鑲黄旗人世居穆楞扎古喇地方雍正中以征西藏功授騎都尉精格哩氏薩哈連正黄旗人世居烏拉地方崇徳中從征錦州有功又敗流賊叙功授騎都尉烏雅拉氏科爾堪正黄旗人世居薩哈連烏拉地方崇徳中從征山東有功授騎都尉功加定鼎時以敗流賊二等輕車都尉扎特黑氏海都正黄旗人世居額木赫索囉地方以征吳逆及厄魯特噶爾丹有功授三等輕車都尉鼐齊哩氏希岱正藍旗人世居克什克騰地方魯國初從征山東有功賜巴圖號授騎都尉順治中從征廣東叙功加一等輕車都尉兼雲騎尉索察喇氏郭濟正藍旗人世居吉林烏拉地方以從征吳逆功授騎都尉塔勒滿鑲藍旗人以從征耿逆及平海寇功授雲騎尉索爾濟氏塔那喀鑲藍旗人世居烏拉地方以從征耿逆及厄魯特噶爾丹功授騎都尉布吉爾根氏扎克丹正藍旗人世居額勒敏地方順治中從征福建陣亡贈雲騎尉祀昭忠祠塔察覺爾察氏班布哩正黄旗人天命中侍直穆内廷勤慎機警有馬爾屯人名起者逆謀迎宴力阻勿往五人代往盡為所害太祖太祖髙皇帝命嘉其忠直贈賞賚甚優卒騎都尉世職阿顔塔塔爾氏喜佛鑲白旗人授一等輕車都尉吉朗吉瓦爾喀氏發爾那正白旗人世居長白山地方定鼎時撃破流賊又從征浙江江西貴州屢著戰功授三等輕車都尉噶爾噶斯氏鄂爾竒逹遜正黄旗人任副都統授三等勤敬伯大佳氏色海鑲黄旗人世居杭間地方從征大同及征流賊有功授三等輕車都尉附載䝉古八旗姓揆龍氏阿什岱鑲黄旗人世居克什克騰地方天聰時從征明有功賜巴圖魯號授雲騎尉平定河南及征貴州叙功累加至三等男烏宻氏巴賴都爾莽鼐正黄旗人世居察哈爾地方崇徳中來歸從征錦州陣亡贈三等子祀昭忠祠其子哈岱襲職以征浙江海冦功加授一等子任内大臣其子阿喇納襲職康熙中以征吐魯番功授都統晉封三等伯諡僖恪錫喇氏克什圖鑲黄旗人世居科爾沁地方崇徳中從征明有功授騎都尉又以追流賊功加一雲騎尉巴林氏那親鑲紅旗人任都統代通鑲紅旗人任副都統授三等男臣等謹按今内扎薩克有巴林部以部為氏齊墨氏徳根鑲黄旗人世居義州地方順治中從征江西廣東叙功授騎都尉加一雲騎尉卓克氏諤勒哲圖正紅旗人世居浩齊特地方崇徳中從征山東有功贈雲騎尉坦開氏托克托瑚正紅旗人世居察哈爾地方順治中以破流賊及征浙江功授雲騎尉加騎都尉烏璘氏滿都祜鑲白旗人世居科爾沁地方順治中從征浙江有功授騎都尉加二等輕車都尉鄂秦氏鄂爾和岱鑲白旗人世居葉赫地方從征吳逆有功贈雲騎尉濟特氏海色鑲紅旗人從征雲南有功授雲騎尉烏爾占鑲紅旗人康熙中從征厄魯特噶爾丹有功授雲騎尉科特氏訥爾徳正藍旗人世居葉赫地方順治中以破流賊及征浙江功授雲騎尉加騎都尉鈕掄氏額爾吉圖正藍旗人世居巴林地方順治中以敗流賊及征四川有功授雲騎尉加三等輕車都尉台楚氏托克托囉鑲藍旗人世居巴林地方天命中從征囊努克有功授備禦世職定鼎時以敗流賊功加授騎都尉兼一雲騎尉表特氏格對正藍旗人世居喀喇沁地方康熙中從征湖廣陣亡贈雲騎尉祀昭忠祠巴遜氏布徳正藍旗人世居克什克騰地方康熙中從征厄魯特噶爾丹陣亡祀昭忠祠莽那特氏阿賴正黄旗人世居喀爾喀圖呼爾扎地方國初來歸以軍功賜名庫魯克逹爾漢授一等㕘將世職順治中駐防漢中以克復忻州功加二等男任都統禮部尚書加太子太保諡襄敏鄂爾沁氏羅理正黄旗人世居察哈爾地方天聰中來歸授一等輕車都尉崇徳中從征明錦州陣亡贈副都統祀昭忠祠烏梁海濟勒黙氏噶爾圖鑲白旗人世居遼河地方順治初以敗流賊功授騎都尉阿勒坦鄂謨克氏阿都賴正藍旗人世居喀喇沁地方順治中從征江南有功授三等輕車都尉又撃敗海寇叙功加一等輕車都尉兼一雲騎尉卓巴魯特氏巴拜正藍旗人世居喀喇沁地方順治中從征浙江陣亡贈雲騎尉祀昭忠祠錫爾徳特氏賽色岱正藍旗人世居喀喇沁地方順治中從征貴州旋師至江南撃敗海寇有功授雲騎尉康熙中從征吳逆陣亡贈騎都尉祀昭忠祠博爾和羅氏海三岱鑲藍旗人世居巴岳特地方授騎都尉後從征福建攻厦門陣亡贈三等輕車都尉祀昭忠祠薩拉塔克氏戴啟鑲藍旗人世居克什克騰地方從征吳逆陣亡贈騎都尉祀昭忠祠烏爾杭阿氏瑪第鑲紅旗人世居鄂謨倫地方康熙中以員外郎奉差至哈宻被漢都等屬下所害贈雲騎尉祀昭忠祠珠爾齊特氏羅里正黄旗人授三等男喀爾諾特氏多鼐正藍旗人世居喀喇沁地方順治中從征廣東廣西旋師至江寧撃海寇鄭成功陣亡贈騎都尉又加一雲騎尉祀徳昭忠祠綽爾們正藍旗人世居察哈爾地方崇時來歸順治初以軍功授一等男後從征陣亡祀昭忠祠伊克明安氏青海輝特部扎薩克圖汗部之厄魯特一旗皆伊克明安氏扎哈齊特氏拜音圖正白旗人順治中從征江西有功授雲騎尉加騎都尉阿喇克球氏阿必達正白旗人世居察哈爾地方從征耿吳二逆及噶爾丹有功授騎都尉竒爾果特氏嘉穆蘇正紅旗人世居察哈爾地方崇徳中從征山東濵州有功賜巴圖魯號授騎都尉兼一雲騎尉徳特齊特氏諾們鑲白旗人世居英郭和羅地方天聰中授騎都尉加一雲騎尉烏訥穆爾氏阿齊圖鑲白旗人世居薩喇穆魯地方順治初以從征山西四川功授雲騎尉後征廣東叙功加二等輕車都尉鄂恩濟特氏喀喇岱鑲紅旗人世居巴林地方天聰中授騎都尉順治中以撃流賊功加三等輕車都尉竇里吉特氏羅邦鑲紅旗人世居喀喇沁地方順治初以撃流賊征陜西有功授雲騎尉烏濟竒特氏噶爾瑪正藍旗人世居克什克騰地方從征吳逆有功授雲騎尉瑚拉巴斯氏叟色鑲藍旗人世居察哈爾地方魯國初從征明有功賜巴圖號授佐領圖羅魯特氏圖薩圖正藍旗人世居喀喇沁地方從征吳逆有功授雲騎尉噶必齊克氏烏巴里沙津鑲藍旗人係喀喇沁貝勒國初來歸從征張家口有功授三等輕車都尉齊爾博蘇氏特穆里鑲藍旗人世居圖們地方以征殺虎口有功授三等輕車都尉其姪布達襲順治中從征湖廣荆州有功授一等輕車都尉加至三等男阿爾塔斯氏沙雅鑲藍旗人世居敖漢地方順治中從征雲南有功授雲騎尉哈爾吉努氏烏遜岱正黄旗人世居喀爾喀地方從征吳逆陣亡贈雲騎尉祀昭忠祠齊木克圖氏蘇巴什達正紅旗人世居喀喇沁地方從征吳逆陣亡贈雲騎尉祀昭忠祠莽格努特氏瑪尼鑲白旗人世居喀喇沁地方從征吳逆陣亡贈雲騎尉祀昭忠祠洪鄂羅特氏索羅岱鑲紅旗人世居克什克騰地方崇徳中從征山東陣亡贈騎都尉祀昭忠祠薩爾圖克氏色楞鑲紅旗人世居察哈爾地方康熙中從征四川陣亡贈雲騎尉祀昭忠祠吉爾必斯氏孟額圖正藍旗人任一等輕車都尉鄂爾果諾特氏阿岱正黄旗人世居喀爾喀地方國初來歸授三等輕車都尉從征朝鮮屢著戰功加二等輕車都尉任都統其孫巴朗襲職以撃敗李定國兵叙功加至二等男塔本努圖克氏充固正白旗人世居阿勒台杭愛地方崇徳中從征明有功賜巴圖魯號順治中以軍功加一等輕車都尉後從征湖廣陣亡贈三等男祀昭忠祠圖克齊納喇氏庫色鑲黄旗人世居羅和郭爾地方崇徳中從征明有功授雲騎尉加三等輕車都尉哈勒齊塔特氏薩拜正紅旗人世居瓦爾喀葉赫地方順治中撃賊有功授騎都尉卓齊布楚特氏圖爾孟克鑲白旗人世居洪果和碩地方順治中従征貴州旋師至江寧敗海冦鄭成功授雲騎尉後從征吳逆陣亡贈騎都尉祀昭忠祠哈爾濟諾特氏巴雅魯鑲白旗人世居薩喇穆魯地方崇徳中從征明有功又撃敗流賊授騎都尉布爾哈齊特氏噶爾扎鑲藍旗人世居察哈爾地方康熙中因差往烏嚕特至哈察被漢都屬下所害贈雲騎尉祀昭忠祠齊岳噶穆特氏威徴正黄旗人世居科爾沁地方天聰時來歸任副都統以軍功授二等輕車都尉順治中征湖廣陣亡贈一等輕車都尉祀昭忠祠阿穆哈爾努氏昻阿正黄旗人世居巴林地方崇徳中來歸從征朝鮮及征明有功授騎都尉塔喇巴齊克氏察罕岱鑲藍旗人世居土黙特地方從征吳逆陣亡贈三等輕車都尉祀昭忠祠額爾格特恩氏巴圖吉爾嘎勒正黄旗人任副都統内大臣圖伯特氏拉錫正白旗人任領侍衛内大臣其子旺扎爾任都統兼領侍衛内大臣理藩院侍郎諡恪慎那穆扎爾任都統靖邊將軍贈一等伯追封三等義烈公諡武毅謨爾琿正白旗人任都統綽囉斯氏外扎薩克之都爾伯特部賽音諾顔部之厄魯特二旗皆綽囉斯氏圖爾格氏阿