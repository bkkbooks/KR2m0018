body:
  text: 諡略四額駙諡太子太保和碩額駙耿昭忠諡勤僖康熙二十五年十月諡太子太保和碩額駙耿聚忠諡慤敏康熙二十六年二月諡都統和碩額駙諾穆圖諡慤僖康熙五十年二月諡內大臣都統右翼前鋒統領固倫額駙班第諡恭勤乾隆十八年年四月諡和碩超勇親王固倫額駙策凌諡襄乾隆十五年四月諡科爾沁親王固倫額駙色布騰巴爾珠爾諡毅乾隆四十年五月諡尚書和碩額駙一等忠勇公福隆安諡勤恪乾隆四十九年四月諡藩王諡定南王孔有德諡武壯順治十一年五月諡義王孫可望諡恪順順治十八年五月諡靖南王耿繼茂諡忠敏康熙十年五月諡海澄公追贈王爵黃芳度諡忠勇康熙十五年三月諡平南親王尚可喜諡敬康熙十六年六月諡民公諡臣等謹按一品官以上應否與諡請旨定奪子諡者交內閣撰擬諡號工部給碑價翰林院撰擬碑文二品以下無諡奉特旨者豫諡公圖爾格諡忠義順治九年六月追諡公圖賴諡昭勳順治九年六月追諡都統三等公和碩圖諡端恪順治十二年十月追諡定西將軍內大臣一等公愛星阿諡敬康康熙三年三月諡輔政大臣一等公索尼諡文忠康熙六年六月諡一等公遏必隆諡恪僖康熙十三年二月諡陜西提督贈公爵給三等精竒尼哈畨世職陳福諡忠愍康熙十五年三月諡太子太保一等海澄公贈太保黃梧諡忠恪康熙十六年六月諡太子太保一等海澄公贈少保黃芳世諡忠襄康熙十七年六月諡內大臣一等公噶布喇諡恪僖康熙二十年十月諡太子太傅議政大臣都統中和殿大學士兼吏部尚書三等公贈少保圖海諡文襄康熙二十一年二月諡內大臣都統一等公舅舅佟國綱諡忠勇康熙二十九年十月諡領侍衛內大臣一等公費揚古諡襄壯康熙四十年九月諡兵部尚書公孫徵皓諡清端康熙五十五年十月諡領侍衛內大臣一等公追贈太傅佟國維諡端純雍正元年四月諡追封一等公輕車都尉加贈太師佟養真諡忠烈雍正元年四月諡衍聖公孔育圻諡恭慤雍正元年十二月諡領侍衛內大臣一等公音德諡慤敬雍正五年十一月諡一等海澄公贈太子少保黃芳泰諡襄慤乾隆三年五月諡一等海澄公黃應纘諡溫簡乾隆六年五月諡內大臣品級承恩公淩柱諡良榮乾隆十二年四月諡追封一等公李榮保諡莊慤乾隆十四年四月諡三等威信公四川提督嶽鍾琪諡襄勤乾隆十九年四月諡定北將軍一等誠勇公班第諡襄烈乾隆二十一年九月諡靖逆將軍贈三等義烈公那木扎爾諡武毅乾隆二十三年十二月諡太子太保協辦大學士户部尚書一等謀勇公贈太保兆惠諡文襄乾隆二十九年二月諡將軍兼雲南貴州總督兵部尚書一等誠嘉毅勇公明瑞諡果烈乾隆三十三年四月諡太子太保協辦大學士户部尚書果毅公阿里衮諡襄壯乾隆三十四年十二月諡太保保和殿大學士一等忠勇公贈太傅傅恆諡文忠乾隆三十五年七月諡護軍統領公和爾本諡端儼乾隆三十五年七月諡太子太保內大臣追封一等公哈實屯諡恪敏乾隆三十五年七月諡太子少保户部尚書果毅繼勇公豐升額諡誠武乾隆四十二年十月諡侯伯諡二等伯明安諡忠順順治十一年五月諡都統三等伯阿濟格尼堪諡武敏順治十二年十二月追諡一等伯又一雲騎尉議政大臣程尼諡誠介順治十三年正月諡內大臣三等伯鄂碩諡剛毅順治十四年九月諡定西將軍都統三等侯默爾根侍衛李國翰諡敏壯順治十七年四月諡少保兼太子太保漢軍都統三等伯石廷柱諡忠勇順治十八年三月諡都統一等侯兼一雲騎尉宜爾德諡襄敏順治十八年十一月諡三等伯覺羅摩囉琿諡剛勇康熙二年五月諡內大臣二等伯伊爾登諡忠直康熙二年七月諡浙江提督二等侯贈太傅田雄諡毅勇康熙二年七月諡福建提督三等侯加贈一等侯馬得功諡襄武康熙四年正月諡議政大臣都統二等伯卓羅諡忠襄康熙七年九月諡承恩伯周全斌諡恪順康熙十年二月諡議政大臣正白旗滿洲都統一等伯伊里布諡武壯康熙十九年八月諡四川提督三等伯贈太子太保世襲騎都尉王之鼎諡忠毅康熙二十年四月諡少傅兼太子太師靖逆將軍靖逆侯甘肅總督贈少師張勇諡襄壯康熙二十三年八月諡福州將軍伯佟國瑤諡忠慤康熙二十八年十一月諡太子少保靖海將軍靖海侯施琅諡襄壯康熙三十六年閏三月諡江南提督一等侯贈太子太保兵部尚書張雲翼諡恪定康熙四十八年十二月諡議政大臣領侍衛內大臣一等侯又一雲騎尉巴琿德諡恭恪雍正元年九月諡領侍衛內大臣兼佐領贈伯爵馬武諡勤恪雍正五年三月諡太保保和殿大學士世襲二等伯贈太傅馬齊諡文穆乾隆四年九月諡太傅保和殿大學士三等伯鄂爾泰諡文端乾隆十年五月諡內大臣一等伯欽拜諡肅敏乾隆十三年六月諡領侍衛內大臣漢軍都統二等伯伊勒慎諡肅靖乾隆十三年閏七月諡都察院左都御史一等伯拉布敦諡壯果乾隆十六年六月諡都統一等伯傅清諡襄烈乾隆十六年六月諡兵部尚書襄勤伯鄂容安諡剛烈乾隆二十一年九月諡寧夏將軍贈一等伯和起諡武烈乾隆二十一年十二月諡大學士陜甘總督三等忠勤伯黃廷桂諡文襄乾隆二十四年二月諡都統伯喇納諡僖恪乾隆二十四年二月諡一等伯傅良諡恭勤乾隆四十二年十月諡子爵諡都統銜二等子吳賴諡康毅順治十年十二月諡都統一等子左夢庚諡莊敏順治十一年七月諡都統一等子楞額禮諡武襄順治十二年十月追諡都統一等子準塔巴圖魯諡襄毅順治十二年十月追諡都統三等子何和里諡溫順順治十二年十月追諡副都統三等子碩翁科羅巴圖魯勞薩諡忠毅順治十二年十月諡二等子喀山諡敏壯順治十二年十月諡前鋒統領三等子碩翁科羅巴圖魯圖魯什諡忠宣順治十二年十月追諡三等子恩格德爾諡端順順治十二年十月追諡三等子巴拜諡僖順順治十二年十月追諡二等子索諾穆諡順良順治十二年十月追諡都統二等子陳泰諡忠襄順治十三年二月諡都統二等子佟養性諡勤惠順治十三年六月諡三等子祖可法諡順僖順治十四年七月諡內大臣二等子加一級覺羅色勒諡勤慤順治十四年十二月諡都統管佐領一等子又一雲騎尉贈太子太保阿爾津諡端果順治十五年六月諡太子太保都統三等子圖賴諡勤襄順治十五年六月諡內大臣一等子多爾濟達爾罕諾顔諡順僖順治十七年五月諡一等子加一級碩爾布錫諡敏襄順治十七年五月諡太子太保盛京總管一等子敦拜諡襄壯順治十七年五月諡三等子納穆生格諡直勇康熙二年五月諡一等子馬光逺諡誠順康熙二年九月諡副都統三等子教善諡敏勇康熙三年二月諡內大臣二等子都爾瑪巴圖魯占諡忠直康熙三年三月諡太子少保都統二等子鄂羅色辰諡果敏康熙三年九月諡太傅兼太子太師內祕書院大學士一等子范文程諡文肅康熙五年九月諡户部尚書蒙古都統一等子瑪爾賽諡忠敏康熙八年三月諡內大臣一等子吳拜諡果壯康熙八年七月諡都統三等子朱馬喇諡襄敏康熙八年十一月諡前鋒統領三等子博爾黑圖諡忠勇康熙十年四月諡內大臣一等子哈岱諡勤壯康熙十九年七月諡勇略將軍雲南貴州總督一等子趙良棟諡襄忠康熙三十六年六月諡廣西提督一等子又一雲騎尉贈太子少保張朝午諡襄毅康熙五十六年五月諡歸化城都統三等子丹津諡壯敏乾隆二年六月諡參贊大臣贈三等子三泰諡果勇乾隆二十三年十二月諡大學士諡少傅兼太子太傅宏文院大學士謝升諡清義順治二年正月諡內翰林宏文院大學士贈太保希福諡文簡順治十年正月諡贈大學士巴克實達海諡文成順治十一年四月諡內翰林國史院大學士贈太子太保張端諡文安順治十一年七月諡太子太保內翰林宏文院大學士髙爾儼諡文端順治十三年七月諡國史院大學士宋權諡文康順治十六年三月諡少師兼太子太師內國史院大學士額色黑諡文恪順治十八年十月諡經略湖廣等處五省太傅兼太子太師武英殿大學士兵部尚書三等輕車都尉洪承疇諡文襄康熙四年三月諡少傅兼太子太傅內國史院大學士二等輕車都尉寧完我諡文毅康熙四年四月諡內國史院大學士金之俊諡文通康熙九年二月諡少保兼太子太保內國史院大學士蔣赫德諡文端康熙九年十月諡祕書院大學士車克諡文端康熙十年七月諡太保兼太子太師內祕書院大學士兼禮部尚書馮銓諡文敏康熙十二年十二月諡內祕書院大學士孫廷銓諡文定康熙十四年正月諡少師兼太子太師保和殿大學士兼户部尚書衛周祚諡文清康熙十四年八月諡太子太保文華殿大學士管吏部尚書事對哈納諡文端康熙十四年九月諡宏文院大學士覺羅伊圖諡文僖康熙十六年七月諡陜西經略武英殿大學士刑部尚書管兵部尚書事摩囉諡忠愍康熙二十二年九月諡太子太師保和殿大學士兼户部尚書李霨諡文勤康熙二十三年九月諡文華殿大學士兼吏部尚書黃機諡文僖康熙二十五年四月諡太子太傅文華殿大學士宋德宜諡文恪康熙二十六年七月諡太子太傅內大臣中和殿大學士兼吏部尚書巴泰諡文恪康熙二十九年十一月諡太子太師保和殿大學士兼禮部尚書杜立德諡文端康熙三十年七月諡太子太保武英殿大學士兼禮部尚書吳正治諡文僖康熙三十一年二月諡太子太傅文華殿大學士兼刑部尚書馮溥諡文敏康熙三十一年二月諡文華殿大學士兼吏部尚書李之芳諡文襄康熙三十四年二月諡武英殿大學士阿蘭泰諡文清康熙三十八年十月諡武英殿大學士李天馥諡文定康熙三十八年十一月諡少傅兼太子太傅保和殿大學士兼禮部尚書王熙諡文靖康熙四十二年四月諡文華殿大學士兼吏部尚書伊桑阿諡文端康熙四十二年七月諡保和殿大學士兼刑部尚書吳琠諡文端康熙四十四年五月諡文華殿大學士贈太傅張英諡文端康熙四十七年十一月諡武英殿大學士兼吏部尚書贈太子太保熊賜履諡文端康熙四十八年十一月諡文華殿大學士贈太子太保張玉書諡文貞康熙五十年七月諡文淵閣大學士兼吏部尚書陳廷敬諡文貞康熙五十一年五月諡文華殿大學士兼吏部尚書溫達諡文簡康熙五十四年六月諡文淵閣大學士李光地諡文貞康熙五十七年六月諡太子太傅文華殿大學士吏部尚書張鵬翮諡文端雍正三年二月諡太子太傅武英殿大學士兼工部尚書贈少傅王頊齡諡文恭雍正三年八月諡太子少傅文淵閣大學士兼禮部尚書髙其位諡文恪雍正五年三月諡太子太師文華殿大學士田從典諡文端雍正六年六月諡太子太傅武英殿大學士富寧安諡文恭雍正十年七月諡太子太傅文華殿大學士蔣廷錫諡文肅雍正十年八月諡文華殿大學士贈太傅朱軾諡文端乾隆元年十一月諡太子太傅文淵閣大學士陳元龍諡文簡乾隆元年十一月諡武英殿大學士兼吏部尚書邁柱諡文恭乾隆三年五月諡東閣大學士贈太子太傅尹泰諡文恪乾隆三年十一月諡太子太傅文華殿大學士兼吏部尚書管浙江總督事贈少保嵇曽筠諡文敏乾隆四年六月諡東閣大學士徐本諡文穆乾隆十三年二月諡東閣大學士張允隨諡文和乾隆十六年五月諡保和殿大學士張廷玉諡文和乾隆二十年五月諡太傅武英殿大學士福敏諡文端乾隆二十一年十一月諡太子太傅文淵閣大學士陳世倌諡文勤乾隆二十三年五