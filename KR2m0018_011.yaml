body:
  text: 欽定四庫全書皇朝通志卷十一六書畧一臣等謹按周官六書之義康成所釋前志載之詳矣顧其源流條貫足以證古今誦習之同而未足罄乾坤槖籥之妙欽惟我國家肇造區夏列聖天亶神靈剏制文字用垂久逺實得天地之中聲其理根於律吕損益還宫之法故其用實總乎音韻之全聖祖仁皇帝考文制度既已定為清文鑑一書復以音韻闡微與康熙字典實相表裏頒示訓行薄海暨訖一掃諸家之陋俾陽開隂闔洞啓機緘五均七始互相樞紐葢漢文之言六書者至於魏晉而始有聲類南北朝而始有切韻後遂執所謂切韻者以上檢六經旁覈百氏究未得其要領國書則諧韻生聲探源星宿於是聲之所在而形成焉洪纎鉅細無不指之事疾徐俯仰無不㑹之意十二字頭生生不已以聲為轉注也人名地名間用對音以聲為假借也錯綜變化之中實於六書之義無不賅備此真恃源而往之道也至於篆降而隸隸降而楷偏旁穿鑿不免影響依附我皇上沿流溯源定為清篆三十二體符璽印章昭回雲漢其餘各體並薈萃於御製盛京賦蟲魚鳥獸草木山川陶鎔萬象歸於一治又直追古皇仰觀俯察之心以神而明之則國書為諧聲之祖何嘗非象形之祖與外如䝉古舊語天竺梵音以及西番譯語回準方言莫不並蓄兼收登於䇿府按之欽定西域同文志同文韻統三合清文鑑五譯合璧集要諸書譬之百川赴壑趨海朝宗列宿經天向辰拱極臣等謹将國書首載簡端次列清篆用昭皇朝制作之盛其䝉古西畨回準各部亦依次登載餘如塞垣别部海島名藩言不雅馴無闗訂證均畧而不載焉國書太祖初命額爾徳尼巴克什同噶蓋扎爾固齊将蒙古字創立滿文臣等謹按此創立滿文之始所云無圏㸃檔案是也誠萬世臣民所當遵守者太宗命達海巴克什等繙譯書籍庫爾禪等記注政事諭達海増加圏㸃臣等謹按此即今所遵用國書如之字即加㸃之始之字即加圏之始大抵十二字頭率以三字或二字蟬聯成句自加圏㸃而雨不至混於奴僕户口之户不至混於泥土之土魚剌不至混於男子之類朗若列眉於是字無遁聲聲無遺字於文字通行信為明晰臣等謹按十二字頭實為國書生生不已之母而第一字頭又為十一字頭之母至此六字則更為第一字頭之母阿讀如六麻韻額平聲讀伊怡宜義義字平聲讀鄂平聲讀烏伍武務渥伍字以下俱平聲讀諤平聲讀隂陽闔闢上本律元以下合音切韻諸法詳見七音畧餘倣此臣等謹按此第二字頭就第一字頭加一字成音如阿加依呼成愛餘倣此臣等謹按此第三字頭就第一字頭加一字應以哷字帶音餘倣此臣等謹按此第四字頭就第一字頭加一字成音如阿加安成安餘倣此臣等謹按此第五字頭就第一字頭加一字成音如阿加昻成昻餘倣此臣等謹按此第六字頭就第一字頭加一字其音之屬從隂則加一字以克字帶音餘倣此臣等謹按此第七字頭就第一字頭加一字以斯字帶音餘倣此臣等謹按此第八字頭就第一字頭加一字以特字帶音餘倣此臣等謹按此第九字頭就第一字頭加一字以補字帶音餘倣此臣等謹按此第十字頭就第一字頭加一字成音如阿加傲成敖餘倣此臣等謹按此第十一字頭就第一字頭加一字以勒字帶音有向用爾字對音者仍通用爾字餘倣此臣等謹按此第十二字頭就第一字頭加一字以穆字帶音有應讀作第四字頭之音者仍照第四字頭對音餘倣此十二字頭正字之外増添外字臣等謹按増添外字以補十二字頭之未備如之類為外單字如之類為外聯字兩字連冩切成一字臣等謹按切音清字用漢字一字對音如為聶為年之類其一字未能切當用漢字二字對音如為尼雅為費揚之類太祖欲以䝉古字製為國語頒行國中令額爾徳尼巴克什與噶葢扎爾固齊酌定之二人辭曰䝉古文字臣等習而知之相傳久矣未能更製也太祖諭曰漢人讀漢文凡習漢字與未習漢字者皆知之蒙古人讀䝉古文雖未習䝉古字者亦皆知之今我國之語必譯為蒙古語讀之則未習䝉古語者不能知也如何以我國之語製字為難反以習他國之語為易耶額爾徳尼巴克什與噶葢扎爾固齊同對曰以我國語製字最善但更製之法臣等未明故難耳太祖因諭之曰阿字下合一麻字非阿麻乎額字下合一墨字非額墨乎吾籌此已悉爾等試書之何為不可額爾徳尼巴克什遂與噶葢扎爾固齊遵諭将䝉古字編輯連冩製為成語創立滿文頒行通用滿文傳布自此始今所用滿文數字連為一字者皆額爾徳尼巴克什與噶葢扎爾固齊擬製奉太祖欽定俾國人習之者也臣等謹按滿文製字之法以十二字頭為樞紐因而有外字又因而有切音單字切音雙字至為簡易顧操至約以馭至繁要以聨字一法為凖今恭繹太祖阿麻額墨之訓已示聯字之大凡當時承㫖編輯踵事加詳如之字在聯字内作字在聯字内作字在聯字内作之類則聮字變體之在首者如字聫字内在首則變體作在中則變體作在下則變體作之之類則聫字變體之分上中下者以下諸字皆倣此如第二字頭之字在聫字内則改作之類則字體之全變者以下諸字頭皆倣此㕘伍錯綜擬議變化而規矩謹嚴毫髮不爽聯字之法因以大備至於結體之分合用筆之後先如字牙字之圏字之㸃字之尾之類心手了然纎悉必較上自祝版内廷宫殿門榜以及諸司章奏必以楷書為主則尤與心正筆正之㫖為脗合焉命分别滿文語氣臣等謹按滿文演繹字求實義解證虚神往往有漢文所不能疏通者證以滿文而脈絡分明神理畢現則尤在助語虚字輕重之别如三字上用則下用上用則下用上用則下用等字以韻相從此則語氣之未然者也六字上用則下用上用則下用上下上下上卞等字亦以韻相從此則語氣之已然者也如同一字上用則為令詞上用則為被詞同一上用則為可字上用則為為字之類此則語氣之以承應而異者也如之上必用之下必用之上必用之上必用之類此則語氣之以承應而全者也外如等字則又有單用聫用之分提冩不提冩之別諸如此類不可枚舉絲聫繩貫洵為細入無間矣康熙八年聖祖諭達海巴克什通滿漢文字於滿書加添圏㸃俾得分明又照漢字増造字様於今賴之十二年聖祖特諭傅達禮曰滿漢文義照字繙譯可通用者甚多後生子弟漸致差謬爾任翰林院掌院可将滿語照漢文字彚發明某字應如何用某字當某處用集成一書使有益於後學此書不必太急宜詳慎為之務期永逺可傳其書斟酌周詳後二十餘年始脱稿刊行即今清文鑑也臣等謹按滿文字畫辨析微芒製為國語其中有可相通者有不可相通者不容稍混如同中之異則同一夀字而福夀之夀與夀數之夀異同一恩字而恩澤之恩與施恩之恩異同一氣字而人生之氣與氣血之氣異同一火字而無焰之火與水火之火異他如顔色之色之異於彩色之色是非之是之異於是之也無論已如異中之同則為南而亦可觧為前字為北而亦可解為後字為東而亦可解為上字為西而亦可解為下字他如甲乙之甲又解為青色之青甲乙之乙又解為淺緑色以下為十干而五方之色亦如之子時之子又觧為䑕丑時之丑又解為牛以下為十二支而十二相亦如之無論已故語之不得不分者如父之與亦解為父母之與亦解為母利益之利之與元亨利貞之利造次之與緩急之類是也語之不妨於合者如為方而亦可為面為視而亦可為火為智而亦可為精能之精賢才之賢為義而亦可為行次之行部院之部之類是也實字之可以虚用者如誠理之類是也虚字之可以實用者如為疑問之詞而又解為兄弟之弟為使令之詞而又解為車轅横木之類是也虚字之疑似而不容不辨者如之與之與之與之類是也實語之疑似而不容不辨者如初之與作事之始節省之節之與奢儉之儉不和之與不睦清之與明約之與簡之類是也至於語解精㣲義藴奥妙又有觸處旁通而愈研愈出者即如五經之字均為對音今改為易書詩春秋禮記按之各經本義洵為確切不移其餘清文鑑中續入新定國語五千餘句以此類推咸歸諦當我皇上因列祖之剏垂逺宗近守益昭大備國書之制不更如揭日月而行哉清語改音不改字臣等謹按運筆貴乎清晰語音貴乎瀏亮此翻切諸字緩讀本有二音急讀則成一字也國書成語讀法如六字於聯字清語内從無用在句之中間者間有讀阿字者皆係字讀額字者皆係字讀伊字者皆係字讀鄂字者皆係字讀烏字者皆係字又字頭下用字讀作呢字頭下用字在别字頭下用字仍作衣之類字頭下聫用字俱作啊字俱作窩字俱作烏字作哦字作伊之類聫話清語内遇字俱作傲字俱作哈字俱作豁之類又如衆兄之字讀作匝等之字讀作則疊字句内如並讀作薩匝金線讀作塞則之類以上諸字單字原讀本音聯字必須改讀庶幾施之應對曲折如意斯又善學者所宜究心者矣乾隆三十七年命清漢對音字式臣等謹按滿漢文義凡句櫛字比上下承應之法斷不能同是以有繙譯以通之至對音之無義可尋誠如聖諭漢文天字以國書合音字當云梯烟決不得援謬解以立義從來以字義之優劣強為分别軒輊如金史書烏珠為兀术貝勒為勃極烈或為孛堇又同一蒙古人名於膺世爵者則書羅卜藏於隸讞牘者則書羅卜贓實與䝉古語鄂博而以鄂為嵯峨之峨博為軷祭之軷皆為強作解説卒之求其義而不得遂并其音而失之故向來對音字式訛誤相沿我皇上特命依國書十二字頭酌定對音自一字至數字不等以備行文酌用於對譯之法更歸簡易謹畧述梗槩用昭法守焉皇朝通志卷十一
