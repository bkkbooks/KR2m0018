body:
  text: 欽定四庫全書皇朝通志卷八十九食貨略九錢幣臣等謹按錢幣之制漢之五銖唐之開通差為得中其餘非失之太輕即失之過重而積弊叢生有不可究詰者及前眀官鑄漸偷私錢日甚至熹懷時而其弊極矣我國家法制詳備府事修和泉貨流通盡善無弊自龍興之初即鑄錢二品逮定鼎燕京內則設寶源寶泉二局于京師外則開局鼓鑄于直省輪郭肉好輕重適中邇自西陲底定開局于葉爾羌阿克蘇等城遵式改鑄荒陬僻壤一體流通錢法之盛超越前古至于金銀交鈔之屬均以濟錢之不足而銀錢互權實為上下通行之幣以故輸納國用惟以銀錢兼收而鈔法遂永行停止若夫開採銅鉛轉輸撥濟其所以籌鼓鑄之需者實詳且盡焉兹輯通志特詳書錢幣之大端著于篇天命元年倣古九府圜法鑄錢二品一國書一漢字輪郭外周文曰天命通寶其滿文一品錢質較漢文一品頗大天聰二年鑄錢二品形質如舊文曰天聰通寶至世祖章皇帝定鼎燕京大開鑄局以足國用始定為一品設寶泉局屬户部寶源局屬工部文曰順治通寶按眀直省鑄局皆稱寶泉本朝惟京局稱之每局以漢侍郎一貟督理錢法滿漢司貟各一人監管局務開鑄以一期為一卯計數以千錢為一串始定制以紅銅七成白銅三成配搭鼓鑄每銅百斤折耗十有二斤以一萬二千串為一卯每年額鑄三十卯每文重一錢二分凡錢七文凖銀一分其舊錢不如式者以十四文凖一分四年戶部議錢價既重不便行使請更定為每十文凖銀一分又請于各省重鎮頒式開鑄于是開山西陕西省及密雲薊宣大同延綏臨清等鑄局後又開盛京江西河南湖廣省城及湖廣之荆州常德二府鑄局五年開江南之江寧府鑄局停盛京延綏二局六年移大同局于陽和城開浙江福建山東各省鑄局七年開湖廣襄陽鄖陽二府鑄局八年準于各布政使駐劄之省城量留一局其餘各鎮及湖廣之荆州等府鑄局俱停止十年復開密雲薊宣陽和臨清等鎮鑄局共增爐三百零四座先是故眀諸藩竊據邊省私鑄偽號姦民因乘便盜鑄而當草竊未定時民間雜用假銀及行使低銀物價迄無定凖至是詔令嚴行禁戢而偽錢假銀始不得行又定鑄錢務重一錢二分五釐錢背左鑄漢文一釐二字其戶部鑄戶字工部鑄工字各省及密雲等鎮並鑄開局地方一字錢形字體備極精緻不合式者即為盜鑄仍照舊例每千凖銀一兩其現行舊錢厚薄不等暫從民便直省錢法責成右布政使督查凡官爐夾帶私鑄者以枉法贓論十二年準戶部議于每年二八月以局錢半成配給官俸兵餉其直省兵餉官役俸工驛站雜支等項亦按季視錢局多寡配銀給發是年開山東萊州府局十三年停福建局復移陽和局于大同按陽和地近大同眀洪武築城其間景泰時置宣大總督鑄國初因之移大同府治于兹六年並移局至是裁宣大總督鑄局復移十四年戶部議直省征納錢糧銀錢並收以銀七錢三為凖銀則盡數起解錢留充用自是銀錢交納民間便之時開爐太多詔令停止各省鼓鑄爐座専歸京局較舊錢體質更加濶厚每文重一錢四分磨鑢精緻錢面鑄順治通寶四漢字錢幕鑄寶泉寶源二滿字俟三年後新錢足舊錢盡行銷燬乃定私鑄禁例凡為首及匠人擬斬為從及知情買使者擬絞甲長知情不舉首者照為首例其餘輕重有差又定攙和舊錢廢錢禁例及各官失察處分十七年復開各省鼓鑄局定錢幕鑄地名兼用滿漢字謹按是時定錢幕地名字如江南江寧府鑄寧字江西鑄江字浙江鑄浙字福建鑄福字湖廣武昌鑄昌字河南鑄河字山東鑄東字山西太原鑄原字陕西鑄陕字密雲鑄密字薊鎮鑄薊字宣化鑄宣字大同鑄同字臨清鑄臨字增置雲南鑄雲字滿文在左漢文在右京局之寶泉寶源俱用滿文前順治十年所鑄一釐錢幕漢字地名惟江南之江寧作江字江西之南昌作昌字湖廣之武昌作武字餘俱與是年所鑄同其後至雍正元年始定各省局錢幕皆用滿文至今通行蓋鑄年號以昭王制鑄國書以示同文洵為不刋之制也十八年戶部以前議舊錢限三年後盡行銷毁至是期滿新錢鑄造尚少因請于一釐字錢暫令展限行使先收買十年以前無一釐字制錢每斤給直七分發局改鑄而御史余司仁亦言盜鑄私錢及眀季之舊錢廢錢積聚民間不可勝數令禁止攙和行使而未講求收買之方法令雖嚴難以遽盡請于京師並直隸各省地方設法收買俾民間無所行使則攙和自息從之是年減大同局爐座增入山西省城局康熙元年鑄康熙通寶輕重如舊制頒行天下乃停各省鼓鑄止留江寧府局二年戶工二部以舊議一釐字錢限二年行用至是期滿奏請各部撥銀收買每斤給直六分發局改鑄三年復申定失察私鑄之例自督撫司道各府州縣並吏目典史及衛所官均有處分四年更定各官失察攙和舊錢廢錢處分六年復開各省鎮鼓鑄增置湖南江蘇甘肅三省局照式鑄地名滿漢文其錢幕湖南鑄南字江蘇鑄蘇字甘肅鞏昌府局鑄鞏字按湖廣左右布政使舊駐武昌府康熙三年移右布政使于長沙府改為湖南布政使司江南右布政使舊駐江寧府順治十八年移右布政使于蘇州府康熙六年改為蘇州布政使司陕西左右布政使舊駐西安府康熙二年移右布政使於鞏昌府五年改為甘肅布政使司故特增鑄局七年開四川廣東廣西貴州四省鑄局錢幕滿漢文四川鑄川字廣東鑄廣字廣西桂林府局鑄桂字貴州鑄貴字九年四川巡撫張德地言四川僻處邊地州縣夲無存留錢糧而陸路有棧道之艱水路有川江之險若銀錢並收則起解甚纍現在無需錢之用請停鼓鑄經戶部議準並江寧等十五布政使鑄局均恐有需用非急之處諭俱暫停嗣後各省局鎮局更迭存留惟視錢價低昻期于流通初無定限是時錢制甚工費銅甚巨銅價浮于錢價因而姦民銷燬制錢造作銅器獲利以倍御史羅人傑請定私銷制錢照私鑄例論罪官吏失察亦如之尋以九卿議定民間市肆除紅銅鍋及已成銅器與新造黃銅器在五斤以下者不禁其餘不得濫行鑄造違禁者治罪十八年議戶工二部俱令以滿右侍郎一貟督理錢法又令戶工二部都察院堂官同詣鑄局清查弊端十九年開福建漳州府局錢幕鑄滿漢文漳字二十一年增置雲南大理府祿豐縣蒙自縣局錢幕俱鑄雲字二十二年上以京局二部錢法向以夲部右侍郎管理不無隱徇乃命選差詳察尋以吏部侍郎陳廷敬兵部侍郎阿蘭泰刑部侍郎佛倫都察院左都御史馬世濟管理于是佛倫言寶源局每月分二卯鼓鑄而各關解銅不無遲延尾欠每年局銅僅可供鑄六月有餘餘月匠役各歸鄉村不能保無私鑄請將各關稅及蘆課銀增買銅斤一年按月鑄足二十四卯不令匠役出局可杜私鑄之弊陳廷敬又言錢日少而貴者蓋因姦宄不法毁錢作銅所致鼓鑄之數有限銷毁之途無窮欲除毁錢之弊求制錢之多莫如鑄稍輕之錢使燬錢為器既無厚利其弊自除于是㝎每文重一錢令寶泉局按卯增鑄其各省局俱照新定錢式二十三年定寶泉局每年額鑄四十卯二十四年增置雲南臨安府錢局錢幕亦鑄雲字時福建巡撫金鋐請禁止舊錢上以詢內閣諸臣內閣學士徐乾學言錢者歷代通行之貨自漢五銖以來皆古今錢相兼行使以從民便未有廢古而専用今錢者若隋時盡銷古錢眀天啓以後廣興鑄局盡括古錢以充廢銅此錢之變也舊錢已盡即使良工更鑄而海內之廣一時難遍上採其言乃諭舊錢流布直省皆然若驟為禁止恐有不肖之徒借端生事貽􅊣平民著永罷舊錢之禁二十五年增廣東肇慶府局錢幕亦鑄廣字越眀年停止二十六年戶工二部錢法停止選差専貟仍令夲部右侍郎督理二十八年開福建臺灣府鼓鑄局錢幕鑄臺字二十九年復定收買私錢之令在京限六月交送戶部照銅價每斤給銀一錢在外以文到日為始亦限六月各州縣動庫銀照銅價收買解交布政司三十三年令寶泉局每年開鑄三十六卯三十七年上詣盛京謁陵見民間私用小錢廢錢兩局錢行使絶少下廷臣確議錢法事宜尋議定凡有職司地方之責者均有失察私販私鑄處分三十八年議令民間自行銷毁私錢交官收買四十一年大學士等會議制錢輕小易于攙和錢宜改鑄每文重一錢四分三年之內暫用舊錢小錢其新錢每串凖銀一兩舊鑄小錢每串凖銀七錢俟三年後通行銷毁四十五年以舊小錢展限搭用價直甚賤大錢壅滯令官為收買時山東長山縣多盜鑄者特差侍郎恩丕等赴長山縣捕緝其私錢流行民間者令來年徴收山東錢糧銀一兩折錢二千俟私鑄盡而止四十七年嚴定失察私錢處分凡有私鑄及興販不法之徒地方文武官不行嚴緝一經發覺知情者照私鑄為首例斬決家産入官不知情者以溺職論官船戶有販運私錢押運官知情者與同罪不知者亦以溺職論五十三年令寶源局每年開鑄三十六卯五十五年令京局暫行收買舊銅以充鼓鑄于是姦民私銷小制錢作廢銅變賣較之錢價獲利以倍諭令廷臣集議尋議錢局只許收買舊銅器皿不許買新鑄板塊如有毁小制錢充作廢銅者通行八旗步軍統領並五城大興宛平兩縣嚴緝分首從治罪房主鄰佑知情不首者照為從例不知者勿論該管官亦如之五十八年罷京局收買舊銅之令六十一年將京師平糶官米錢文交五城市易以平錢直並令八旗月餉暫以銀錢各半配給嗣後每遇平糶率以為例雍正元年鑄雍正通寶錢頒行天下令寶泉局嵗鑄新錢與順治康熙大小制錢相兼行使又于大興宛平兩縣設立錢行官牙平直錢價時雲南各厰銅産日旺于是開雲南省城及臨安府大理府霑益州鼓鑄局錢幕滿文俱鑄寶雲字二年定寶源局每年亦開鑄四十卯三年申私錢之禁責令凡經紀鋪戶人等不許攙入私錢一文其從前收買在家者限一月內赴官首眀官給半價收毁如逾限仍攙和行使不論錢數多寡俱發遣邊外給披甲人為奴四年令寶源寶泉二局每年各鑄四十一卯又定寶泉局分設四厰鼓鑄增設大使各一貟停雲南大理府霑益州鼓鑄增雲南省城及臨安府局爐座其錢發運各省並準于鼓鑄正額外加帶鑄錢及外耗錢其發各省該督撫動藩庫錢一串易銀一兩交滇省解官領回如錢制輕薄不合式各督撫參奏監局官交部議處時大學士九卿議言姦民銷毁制錢改鑄銅器從前立法甚嚴而弊不能禁者緣定例時但定將來未造之器而已成之器不問又現在之器惟禁五斤以上而五斤以下不問故禁久玩生仍然銷毁鑄造也今欲杜毁錢之源惟是除紅白銅并黃銅之樂器天平法馬及五斤以下圎鏡不禁其餘俱不許黃銅制造其已成銅器作廢銅交官平買禁官吏不得扣剋則私毁可除于錢法實有禆益上善其言遂下禁銅器之詔令下數月民間交官者少而市店猶行貨賣復定例京城內除三品官以上其餘概不得用黃銅器限三年內將所有悉行報出當官收買旗人交夲旗佐領漢人交五城御史處隨交隨收逾限不交者照私藏禁物律治罪其直省照京城例定限交收眀年以向議三品以上許用黃銅猶覺過濫嗣後惟一品之家許用餘俱遍行禁止有藏匿私用者概以違禁論後復令各省有舊欠錢糧準其以黃銅器皿按成色斤兩抵算其無舊欠之省分州縣民戶有交官者亦按成色給直地方官不得借捐買名色剋減價直重稱收買自是各省銅器俱陸續首出該督撫將所收銅斤奏請歸局開鑄五年開甘肅鼓鑄局錢幕滿文鑄寶鞏字六年令寶源局增設新厰開鑄停甘肅寶鞏字鑄局七年增設寶源局大使二貟令湖北湖南江西浙江河南山東山西各開鼓鑄局錢幕滿文江西南昌府局鑄寶昌字浙江杭州府局鑄寶浙字湖北武昌府局鑄寶武字湖南長沙府局鑄寶南字河南開封府局鑄寶河字山東濟南府局鑄寶濟字山西太原府局鑄寶晉字八年開貴州畢節縣鑄局錢幕滿文鑄寶黔字九年開江蘇鑄局于蘇州府開安徽鑄局于江寧府在江蘇者錢幕滿文鑄寶蘇字在安徽者鑄寶安字按是時安徽布政使駐札江寧府城故鑄安字停河南山西局十年停江蘇局開四川成都府鑄局錢幕滿文鑄寶川字十一年開雲南東川府局錢幕亦鑄寶雲字停江西寶昌局浙江寶浙局湖北寶武局湖南寶南局十二年停安徽寶安鑄局議開雲南廣西州局鑄錢運京錢幕亦鑄寶雲字時上以錢重銅多易滋銷毁著照順治二年例每文重一錢二分通行各省照式磨鑢精工其現行一錢四分之錢聽一體行使嗣後寶泉局每卯用銅鉛十萬二千八百五十七斤有竒鑄錢一萬二千四百九十八串有竒寶源局視寶泉之半十三年定剪邊錢禁例及各官失察處分乾隆元年鑄乾隆通寶頒行天下戶部尚書海望言鼓鑄日增而錢價昻貴建議者多籌禁銅之法而奉行不良易滋弊竇夫銅器散布民間一旦禁使勿用其情有所不便往往遷延而不交交納而不盡緩之則互相觀望急之則百弊叢生胥吏借此需索刁民借此訛詐得賄則賣官法不得則入人罪搜括難盡用法不均民隱既難上達有司未必皆賢民間交納銅器竟有除去使費空手而歸者名為收銅實為勒取此等銅質夲極粗雜加以鏽壞經錢局鎔化折耗甚多而工價不減所得不償所失于鼓鑄全無禆益况黃銅乃用紅銅白鉛配成今禁黃銅而不禁紅銅是較未禁之先銅又多費適以速其私毁是故未禁黃銅之先白銅甚少既禁黃銅之後白銅甚多皆姦匠銷毁制錢和藥水煮白成器其弊如此夫自古錢文重輕必隨銅價之低昻而增減之上年世宗憲皇帝因私銷之弊議減錢分重一錢二分所以調劑夫銅貴錢重者已有成效固不必屑屑于禁銅之末務矣上善其言乃停止收銅之令二年出工部節慎庫存留餘錢八萬串于京城設官局十處出易以平錢直嗣後各省錢價昻貴之時亦設官局以所鑄餘錢易换俟價平即止是時京城每紋銀一兩只换錢八百故有是議未幾錢價復平即停止官局三年停山東局及雲南廣西府局五年浙江布政使張若震見私毁之弊屢禁不能杜絶訪諸爐匠皆言配合銅鉛加入點錫即成青錢姦民即使銷毁不能成器因請飭戶工二局改鑄黃錢為青錢與現在黃錢相兼行使并令開局各省照式改鑄是年復開江蘇浙江局又開福建局錢幕鑄滿文寶福字六年開雲南東川府局復開湖南局七年令寶泉寶源二局每年各開鑄六十一卯遇閏月加鑄四卯又開廣西局于桂林府錢幕鑄滿文寶桂字復開江西局時江南鑄局用銀一兩祗鑄錢八百九十六文每嵗配給餉錢以八百八十錢折銀一兩餘錢十六文充錢局及運腳公費八年上以兵丁月餉僅敷食用著照定例每一兩給錢一千其錢局運腳準銷公項並飭各省鼓鑄有折扣者悉如江南例是年復開雲南大理府局九年復于京城設官錢局令寶源寶泉二局于正額六十卯外各加鑄十卯眀年復令二局各帶鑄五卯如鑄二十卯並交官局易换尋以錢價漸減將官局停止兩局仍照原額為六十一卯又開廣東省鑄局于廣州府錢幕滿文鑄寶廣字開直𨽻保定府鑄局錢幕鑄寶直字十三年復開山西局開陕西西安府局錢幕鑄寶陕字十五年復開雲南廣西府局十六年增定寶泉寶源二局每年各開鑄七十一卯嵗添錢十六萬九千八百餘串遇錢價昻貴即發八旗米局減價出易是時上巡幸江浙商民雲集乃先期命截留滇銅于江蘇浙江二局加卯開鑄屆期設立官局減價出易以平市直嗣後恭遇南巡盛典照以為例二十二年諭前代廢錢流傳今已無幾若盡行查禁吏役轉得借端滋擾如唐宋元眀之舊錢仍聽民便至偽號錢文例當嚴禁該督撫出示曉諭準民間檢出官為收换二十四年移貴州畢節縣局于省城二十五年令寶泉局每年開鑄七十六卯先是二十四年因平定回疆甘肅經理一應屯田事宜需錢甚夥乃增四川湖廣錢局按數分運協濟尋議開西域葉爾羌城鼓鑄局回部之葉爾羌喀什噶爾和闐城舊有錢文名曰普爾以紅銅為之重二錢制小而厚輪郭外周而中無方孔每五十錢當銀一兩謂之騰格至是蕩平式廓上從將軍兆惠所請令戶部頒制錢式仍用紅銅每文亦重二錢陽幕鑄漢字文曰乾隆通寶隂幕鑄葉爾羌城名左國書右回字先以預偹軍營之銅開鑄五十萬貫易回部舊錢銷毁其後于夲疆各城産銅之地陸續採取至二十六年又開阿克蘇城鼓鑄局亦如葉爾羌之制惟錢幕鑄阿克蘇城名其銅設七品伯克管理回部于該地開採二十九年開雲南順寧府鑄局錢幕仍鑄寶雲字三十年議準四川重慶夔州二營生息銀兩交寶川局每年加鑄二卯三十一年又以雲南總督劉藻請減雲南順寧府加卯鼓鑄增省城臨安鼓鑄卯期尋以銅斤不敷將東川新設爐二十五座大理廣西各十五座臨安順寧各八座暫為裁減先是晉省鼓鑄自乾隆十四年安爐十座十八年減去四座二十三年復添爐五座錢價日賤至三十六年撫臣請酌減從前加增五爐以疏錢法從之是年又以江西巡撫海眀奏減去寶昌局爐四座仍照舊六爐鼓鑄以乾隆壬辰年為始四十年開伊犁鼓鑄局錢幕用寶伊字伊犁為凖部總滙之區乾隆二十年王師平定遂𨽻版圗既有重兵駐守兼多商販貿易需用錢文較葉爾羌更為緊要是年遂令開鼓鑄局四十一年以雲南銅斤足敷加鑄復定東川局增爐十五座曲靖府安爐十八座廣西州復爐十五座保山局增爐四座大理局增爐三座省局五十六爐之外復添一座統成一百四十一爐除東川局二十五爐先經加卯帶鑄外餘俱令每爐于正鑄外一律加鑄三十六卯半又令貴州寶黔局復爐鼓鑄四十四年以滇省銅斤不敷各省採買裁減大理局爐一座省局五座移設大理廣西局裁去四座將東川局二十爐內減去四座移設廣西各加鑄半卯其臨安保山曲靖三局復設十三座盡數裁去惟東川府需錢較多仍令照舊鼓鑄又減廣西省鑄局及湖北寶武局爐座四十六年又以四川銅斤不敷將寶川局再停十二卯五十年定各省錢局交代之例凡藩臬及道貟經管者于新舊交卸時俱著前往造册移交新任並具結造報巡撫倘有欵項未清即將前任經管之貟參處以專責成皇朝通志卷八十九
