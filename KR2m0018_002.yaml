  text: 欽定四庫全書皇朝通志卷二
  hash: sha256:0764d80b0574d7d65be724d99528bce6b9c6eba3b6f02687f2ccf1b7800c22e8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_002-1a, image: WYG0644/WYG0644-0013a.png}
body:
  text: 氏族略二滿洲八旗姓臣等謹按鄭樵通志氏族略祗詳受姓原始而不臚載人名蓋統古初以迄唐宋勢不能備書也兹恭纂皇朝氏族自應倣八旗氏族通譜之例每姓俱係以人惟是我國家數百年來休養生息人才蔚起支族繁衍其間名登仕籍者不勝臚列謹擬於國姓而下凡后族尚主開國戰功及位躋一品爵列五等者咸為登載外此不及格者不能遍録其以勳績賢能特豫諡法名入祀典者雖平等官職自應採入若僅襲世職膺髙位而别無事功或罹罪譴雖洊歷貴顯亦從刪節此又微寓變通之義而非盡以名位拘也至姓氏前後次序悉照八旗氏族通譜恭載其有滿洲蒙古姓氏通譜未載而見於八旗通志及各旗檔册者並為附載另立一卷所載之人無多名位不以格拘庶氏因人著人因氏存二者並行不廢云瓜爾佳氏散處蘇完葉赫訥殷蜚悠城安禇拉庫尼瑪察瓦爾喀費德里哈逹烏拉呼爾哈嘉通阿等地方索爾果鑲黃旗人原係蘇完部長有子十人其族最盛費英東其次子也國初隨父率五百户首先來歸焉征瓦太祖高皇帝嘉之授一等大臣以孫女降爾喀國取噶家路悉收降人以歸又征安禇拉庫路取屯寨二十餘處值烏拉國發兵萬人要諸路復大敗其衆又取撫順縣明兵來援督諸軍大破之後從征烏拉及業赫皆克其城授一等子任都統崇德中追封直義公配享三等公太廟順治中定為開創第一功臣加世職雍正中加封號信勇公納海費英東次子授備禦駐防千山地方有追亡殺賊之功後在旅順口陳亡贈三等輕車都尉祀昭忠祠其子顧素襲職從征錦州敗松山援兵又連敗洪承疇十三萬衆征福建破海寇鄭成功兵敘功授三等男索海費英東第六子任刑部尚書圖賴費英東第七子由廢員從征錦州擊却寧逺援兵又征北京連破明總兵滿桂兵授騎都尉後取大凌河敗明監軍道張春兵征山東擊敗吳三桂八千餘衆連克四城授三等男都敗之定鼎時以步戰破賊李自成營復追至慶封三等公又攻拔太平府城擒福王晉封一等公後征福建擊黃鳴駿等於仙霞關十五戰皆捷下泉州府等十城殺唐王朱聿釗及方國安等降其衆八千餘人以病卒於軍諡昭勳配享太廟其子頗爾噴襲爵任領侍衛內大臣圖賴之曾孫瑪爾泰由都統任陜甘總督瑪爾薩任內大臣授參贊大臣征準噶爾陳亡贈騎都尉兼一雲騎尉其子敦住襲職署建寧鎮總兵官從征金川有功後在木克什陳亡贈三等輕車都尉並祀昭忠祠又費英東元孫兆德襲三等公任都統其弟哈逹漢任都統議政大臣領侍衛內大臣兵部尚書郎格費英東第七弟任尚書議政大臣衛齊費英東第九弟授騎都尉征呼爾哈收獲五百户又攻克遵化州有功授三等輕車都尉預十六大臣之列任八門總管諡端勤卓普特衛齊次子由佐領征黑龍江有功授雲騎尉後圍錦州敗松山杏山兵又從征杭州海寧平湖松江等處後征湖廣克王公嶺敘功授三等男加二等男任都統鼇拜衛齊第三子由佐領從征錦州有功後由大同入邊克得勝堡大兵征皮島鼇拜鼓勇先登克之授三等男賜巴圖魯號圍錦州洪承疇率吳三桂等十三萬衆來援太宗文皇帝親統大軍往禦鼇拜等益奮勇進擊大破之吳三桂等夜遁鼇拜復追殺其馬步兵過半敘功授三等子晉封一等侯統兵駐防大同總兵薑瓖叛督官兵破其營斬獲殆盡晉封二等公加少保受世祖章皇帝顧命為輔政大臣令其子特賜一等公加太師其軍功所得二等公納穆福承襲任領侍衛內大臣後鼇拜緣事獲罪之孫蘇聖祖仁皇帝追賜一等男以其親弟巴哈赫承襲世宗憲皇帝復賞還一等公爵又加封超武公令其孫逹福承襲隨征準噶爾陳亡贈騎都尉祀昭忠祠巴哈由頭等侍衛從征陜西湖廣四川等處及追殺流寇有功授一等輕車都尉晉一等男任內大臣其次子蘇爾達任領侍衛內大臣諡恪僖第七子訥爾都係和碩額駙第八子卦勒察任領侍衛內大臣揚善鑲白旗人費英東之姪授騎都尉擢置十六大臣之列取大凌河時以軍功授三等輕車都尉其曾孫穆賽任都統元孫邁祿任都統宜蓀揚善次弟以軍功擢置十六大臣之列任兵部尚書諡襄壯吉蓀揚善第三弟任禮部尚書其子蘇丹由護軍參領從征湖廣陳亡贈雲騎尉孫邁圖由雲騎尉從征吳逆擊敗偽都督郭應福等兵後征廣東陳亡贈騎都尉元孫伊成額由騎都尉從征準噶爾陳亡贈三等輕車都尉並祀昭忠祠烏賴鑲黃旗人亦費英東之姪由廢員從征山東連敗太監馮永盛兵又擊敗流賊二十萬衆授二等輕車都尉晉二等男任都統其孫布爾賽任都統從孫南太由佐領從征準噶爾陳亡贈雲騎尉祀昭忠祠車克鑲白旗人費英東同族由前鋒侍衛圍錦州連敗洪承疇兵又擊敗流賊二十萬衆授一等輕車都尉任户部尚書擢內祕書院大學士加少師諡文端其弟色克任都統郭邁鑲黃旗人費英東同族任內大臣烏巴海正黃旗人國初來歸授騎都尉征瓦爾喀俘獲多人征烏扎拉及阿庫里尼滿等處獲其戶口以歸授一等輕車都尉又以征額赫庫掄有功授三等男後率寧古塔兵追獲叛亡授三等子任寧古塔將軍嘉隆阿正白旗人授雲騎尉於延安府追擊流賊陳亡贈三等輕車都尉祀昭忠祠其從孫瑪賴授二等男邁堪正藍旗人授一等輕車都尉任散秩大臣諡勤順其姪富逹理任三等侍衛贈一等輕車都尉諡忠貞常鼐正藍旗人邁堪同族任吏部尚書倭赫正藍旗人邁堪同族國初來歸任禮部尚書加太子太保丹岱正藍旗人邁堪同族任杭州將軍鄂泰正白旗人國初來歸由廢員從征有功招撫王賜巴圖魯號征江西攻克九江府征陜西輔臣有功授騎都尉兼一雲騎尉任副都統海音布正黃旗人圖國初來歸由間散從征薊州克之賜巴魯號授二等輕車都尉任城守尉永貴正黃旗人由騎都尉從征福建陳亡贈一等輕車都尉祀昭忠祠阿拉穆正黃旗人擊國初來歸由佐領從征松花江俘獲多人後追流寇陳亡贈雲騎尉祀昭忠祠其子安珠瑚襲職從征浙江舟山有功授二等輕車都尉任寧古塔副都統擢奉天將軍瑪爾圖正黃旗人阿拉穆同族任户部尚書其弟瑪爾吉順治壬辰進士郎殿試第一甲第一名任兩江總督尋調刑部侍奉員後奉命征廣西招撫吳逆之偽總兵等五十五旨在步軍統領上行走其姪賡額任兵部尚書巴林鑲黃旗人騎國初來歸由間散攻深州城奮勇先登陳亡贈都尉祀昭忠祠逹蘭正黃旗人征國初來歸由間散攻克永平府城授雲騎尉後朝鮮陳亡贈騎都尉祀昭忠祠武魯理由護軍校從征貴州回兵時遇海寇鄭成功兵擊敗之授雲騎尉後征湖廣陳亡贈騎都尉祀昭忠祠達色正黃旗人任都統領侍衛內大臣烏巴海正白旗人國初來歸授前鋒校從征湖廣陳亡贈雲騎尉祀昭忠祠石國柱正白旗人舉太祖高皇帝取廣寧國柱偕弟天柱廷柱城迎降授輕車都尉屢從征伐有功授三等男擢工部尚書其孫賽音逹禮任都統石廷柱以獻城功授三等輕車都尉取囊弩格時奮勇克敵授三等男從征察哈爾及旅順口有功又擊敗松山杏山兵招撫昌平懷來等州縣太原等府纍授至一等子晉三等伯後圍大同敗澤州賊兵三千又攻克渾源州汾州府等五城晉一等伯任兵部尚書京口鎮海將軍加少保贈少傅諡忠勇其子華善係和碩額駙任內大臣定南將軍石琳任兩廣總督孫石文炳任福州將軍石文晟任湖廣總督石文英石文昌俱任都統石文焯任禮部尚書曾孫穆赫麟觀音保俱任都統扎爾泰正白旗人任都統諾倫鑲黃旗人任綏逺城將軍勞薩鑲紅旗人世居安禇拉庫地方國初來歸由間散攻克遼東授三等輕車都尉取大凌河屢擒敵哨征錦州擊敗明監軍道張春兵授三等男賜碩翁科洛巴圖魯號圍錦州擊敗松山兵又破明兵八千餘衆授二等男後擊洪承疇陳亡贈三等子諡忠毅其子程尼襲三等子晉封一等伯授議政大臣後征湖南陳亡加贈一雲騎尉諡誠介並祀昭忠祠羅璧勞薩之弟由佐領圍錦州屢敗杏山松山兵又破洪承疇三營兵定鼎時擊敗流賊二十萬衆招撫鳯翔等五府加授一等輕車都尉晉封二等公授議政大臣加少保其元孫欽拜任綏逺大將軍諡肅敏額洛圖欽拜之姪任奉天將軍殷泰鑲紅旗人任川陜總督諡清端尼唐阿鑲藍旗人世居尼瑪察地方努國初率兄弟同里來歸設佐領使統之其弟尼授騎都尉其子根特襲職尉征山定鼎時敗流賊二十萬衆加一等輕車都西攻克芮城縣又敗李建泰郭宗傑等二萬餘衆續征湖南敗孫可望兵於分山路口敘功授三等男征浙江恢復舟山授一等男任都統議政大臣諡襄壯祀賢良祠常綬鑲藍旗人任禮部尚書扎爾赳鑲藍旗人世居瓦爾喀地方原係本處部長并國初率百户來歸編佐領令其子顔布理統之授騎都尉從征瀋陽陳亡贈二等輕車都尉其曾孫葛逹渾由佐領從征陜西在平涼府擊王輔臣兵陳亡贈雲騎尉並祀昭忠祠新泰鑲紅旗人扎爾赳同族任都統吉哈理鑲白旗人由前鋒侍衛從征準噶爾陳亡贈雲騎尉祀昭忠祠格思特鑲白旗人由前鋒參領從征浙江舟山有功後征厄魯特噶爾丹陳亡贈雲騎尉加副都統職銜祀昭忠祠俄孟額鑲藍旗人世居瓦爾喀地方國初率族衆來歸設佐領使統之預十六大臣之列授二等輕車都尉其元孫法喀任都統諡勤恪其從弟滿福任都統征沙喇斯瑪呼斯陳亡諡勤毅祀昭忠祠額爾必赫正白旗人力國初來歸由間散從征大同攻左衛首先登城戰陳亡贈騎都尉祀昭忠祠阿士喜鑲紅旗人世居長白山地方任兩江總督托木星阿正白旗人由護軍參領從征福建陳亡贈騎都尉祀昭忠祠扈圖正白旗人世居蜚悠城地方國初來歸由護軍校從征福建克汾水關後征湖廣敗楊勇等兵三千餘衆又攻曹縣首先登城克之授雲騎尉護軍統領其子竒爾薩襲職任都統德福鑲紅旗人由前鋒侍衛從征準噶爾陳亡贈雲騎尉祀昭忠祠巴山鑲黃旗人世居哈逹地方由佐領從征山東敗太監馮永盛兵梯攻巨鹿縣克其城加一雲騎尉又擊敗流賊兵授三等輕車都尉加至三等男後駐防江寧以防守功授二等男其子舒恕襲職從征陜西擊敗王輔臣兵續征雲南有功授一等男其從弟布克沙由參領從征皮島首先進擊圍錦州敗松山杏山援兵奪其纛又破洪承疇三營兵征山東取蒙隂沂水二縣後追騰吉斯敗土謝圖汗及碩羅汗兵授一等輕車都尉任户部侍郎副都統其子貴福由二等侍衛從征雲南攻沅江府克其城後征江西陳亡贈雲騎尉祀昭忠祠葉成額鑲白旗人世居葉赫地方任刑部尚書蘇已泰正黃旗人由間散從征山東攻濟南府首先登城克之賜已圖魯號授騎都尉圍錦州擊敗松山杏山援兵加至一等輕車都尉兼一雲騎尉明愛正藍旗人國初來歸由間散從征大同攻左衛首先登城力戰陳亡贈雲騎尉祀昭忠祠其子尚吉圖襲職從征四川屢敗賊張獻忠馬步兵征山西江西湖廣等處均有功授二等輕車都尉任副都統滿都理鑲黃旗人世居烏拉地方由護軍從征朝鮮奪船有功圍錦州敗洪承疇十三萬衆授二等輕車都尉任內大臣其姪三泰任禮部尚書協辦大學士議政大臣諡文恭多鼐鑲白旗人國初來歸設佐領使統之以從征哈達功授二等輕車都尉擢置十六大臣之列其姪索渾任都統額黑瑪庫正白旗人由三等侍衛從征福建擊海寇於厦門陳亡贈雲騎尉祀昭忠祠其姪珠滿襲職從征江西續征雲南均有功授騎都尉兼一雲騎尉任荆州將軍巴喀正紅旗人由前鋒參領從征準噶爾陳亡贈雲騎尉祀昭忠祠圖赫特正藍旗人由三等輕車都尉從征湖廣陳亡贈二等