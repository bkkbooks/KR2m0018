功又恢復廣東二府一州二十一縣後留鎮漳州擢刑部尚書西林覺羅氏散處汪秦尼瑪察寧古塔哈達長白山等地方屯台鑲藍旗人世居汪秦地方之國初率族屬來歸圖魯郡太祖高皇帝甚愛重以屯台女弟為巴王禮敦妃以覺羅叔瓦爾喀女弟妻之設佐領使統焉長子圖們襲職從征大凌河首先破敵明監軍道張春率兵數萬來援力戰陳亡給備禦世職祀昭忠祠曾孫鄂爾泰任雲貴總督授西北兩路經略擢保和殿大學士三等伯加太保諡文端配享泰長子太廟其弟鄂爾竒任户兵兩部尚書鄂爾鄂容安任兵部尚書征伊犁有功值阿睦爾撒納叛逆殉節贈襄勤伯諡剛烈次子鄂實由三等侍衛授前鋒統領在葉爾羌陳亡諡果壯並祀昭忠祠三子鄂弼任四川總督諡勤肅祀賢良祠四子鄂寧任雲貴總督雅爾納鑲白旗人世居尼瑪察地方國初率屬來歸授騎都尉以克遼東功授二等輕車都尉加至三等男布顔正白旗人世居長白山地方國初同族衆來歸擢置五大臣之列凱音布布顔同族任兵部尚書都統兼步軍統領諡肅敏通顔覺羅氏世居雅爾呼地方茂海鑲藍旗人犯國初來歸授騎都尉時有賊兵來耀州力戰敗之後圍錦州陳亡贈三等輕車都尉祀昭忠祠其子科爾昆襲職加至三等男阿顔覺羅氏散處葉赫額爾敏赫圖阿拉福齊希美佛赫費雅朗阿等地方輝蘭鑲藍旗人世居葉赫烏蘇村地方由間散從征大凌河擊敗明監軍道張春兵又征大同圍錦州有功後擊洪承疇三營兵陳亡贈騎都尉祀昭忠祠碩色正藍旗人世居瓦湖木地方天聰時來歸授佐領其子綽克托任刑部尚書巴什正白旗人世居赫圖阿拉地方由護軍校從征厄魯特噶爾丹陳亡贈雲騎尉祀昭忠祠呼倫覺羅氏散處黑龍江葉赫等地方玉三保鑲紅旗人世居黑龍江地方由前鋒校從征準噶爾陳亡贈雲贈尉祀昭忠祠阿哈覺羅氏散處薩克蘇和羅佛阿拉哈達等地方阿爾達世鑲黃旗人世居薩克蘇和羅地方來歸年分無考任兵部侍郎察喇覺羅氏世居長白山地方佟佳氏散處瑪察雅爾呼加哈哈逹佟佳等地方巴篤理正白旗人世居瑪察地方國初率五百戶來歸設佐領使統之預十扎爾固齊之列從征旅順口克之敗毛文龍兵於薩爾滸又攻克遵化州授二等輕車都尉擢禮部尚書兼都統議政大臣後征大同陳亡贈三等男諡壯敏祀昭忠祠其子卓洛襲爵征山東擊敗太監馮永盛總兵侯世祿等兵又擊敗松山兵定鼎時敗流賊二十萬衆敘功授一等男任副都統征湖廣敗賊一隻虎於荆州攻克寶慶府城授三等子擢禮部尚書兼都統議政大臣征雲南攻取沅江府城晉封二等伯諡忠襄其孫舒敏襲爵任都統瑪哈達任都統元孫伊勒慎襲二等伯任都統領侍衛內大臣諡肅靖蒙阿圖巴篤理次弟授佐領預十六大臣之列任工部尚書逹哈塔巴篤理之姪任吏部尚書雅西塔正白旗人巴篤理同族國初率衆來歸設佐領使統之任護軍統領其子穆福由護軍參領攻前屯衛克其城又敗流賊二十萬衆授騎都尉加一雲騎尉征江西攻九江府屢著戰功取南昌府招服南豐縣攻克九江府城授一等輕車都尉任領侍衛內大臣加太子少傅諡襄壯海祿渾正白旗人巴篤理同族由護軍校從征浙江舟山擊敗阮思兵數萬餘衆於海上又擊敗張德洪等兵三萬餘衆授雲騎尉從征福建擊海寇鄭成功陳亡贈騎都尉兼一雲騎尉祀昭忠祠羅多理正白旗人巴篤理同族由防禦圍錦州首先登城破流賊滅福王屢著戰功征福建攻延平府克其城後攻大同陳亡贈騎都尉祀昭忠祠拜正白旗人巴篤理同族副國初來歸從征瓦爾喀力戰敗賊授雲騎尉任都統緣事革職後由廢員從征大同陳亡贈騎都尉祀昭忠祠扈爾漢正白旗人世居雅爾呼地方國初來歸授一等大臣居五大臣之列有費約城長䇿穆特黑請內附扈爾漢奉命往遷其家口以三百兵破烏拉萬人征東海兀集部取赫席黑等處又征滹野路悉降所部以歸賜逹爾漢侍衛號征扎庫塔克其城附近諸路盡招撫之征東海薩哈連部取河南北三十六寨復渡江取江北十一寨又招降諸路部長四十人後明兵四路來侵擊敗之盡殪劉綎兵又擊敗明逰擊喬一竒兵擒一竒敘功加三等子第四子準塔由佐領授騎都尉從征皮島克之擢授三等男賜巴圖魯號征山東擊敗太監馮永盛總兵侯世祿等兵又敗流賊二十萬衆平定淮安屢著戰功授三等子征四川斬賊張獻忠又征遵義夔州等處敘功授一等子任都統諡襄毅其子阿拉密襲職任內大臣薩木什喀扈爾漢第三弟征董夔及旅順口有功又攻克皮島授二等男任工部尚書雅賴扈爾漢第七弟從征烏拉擊敗蒙古兵征董夔及旅順口屢敗賊兵授騎都尉又破流賊滅福王平定河南江南等處有功授三等男加一等男兼一雲騎尉七十五扈爾漢姪孫任刑部尚書阿納海正紅旗人由騎都尉從征流寇追至九江府敗之征四川屢敗張獻忠何進等兵後圍大同陳亡贈三等男祀昭忠祠其弟巴漢襲職從征貴州回兵時擊敗海寇鄭成功征廣東廣西雲南等處屢著戰功授一等男總噶爾正黃旗人由護軍校從征福建浙江及雲南均有功授雲騎尉後征厄魯特噶爾丹陳亡贈騎都尉祀昭忠祠哈克山正藍旗人世居加哈地方由護軍統領授參贊大臣征湖廣及察哈爾布爾尼屢敗賊衆授三等輕車都尉後攻永興陳亡贈一等輕車都尉兼一雲騎尉諡武毅祀昭忠祠瑚密色鑲黃旗人由佐領從征昌平通州等處屢敗賊兵又擊敗松山杏山兵定鼎時大破流賊於山海關外敘功授騎都尉兼一雲騎尉後從征浙江陳亡贈二等輕車都尉其弟哈爾漢由章京從征錦州敗松山兵又破流賊二十萬衆後駐守延安府擊賊陳亡贈騎都尉並祀昭忠祠希佛正藍旗人任刑部尚書佟養正鑲黃旗人世居佟佳地方國初率族衆來歸從征遼陽有功授三等輕車都尉尋奉叛投明命駐守朝鮮界之鎮江城時中軍陳良䇿將毛文龍執養正不屈死雍正中追贈一等公加贈太師諡忠烈祀昭忠祠其子佟圖賴襲職從征大凌河擊敗明監軍道張春兵圍錦州取白官兒屯台又取金塔口三臺攻克塔山杏山二城授一等輕車都尉又取前屯衛中後所二城攻克太原招降全晉破流賊滅福王攻揚州嘉興等城皆克之擢授二等男尋授定南將軍恢復寶慶下全州加一等子任兵部尚書兼都統加太子太保諡勤襄係孝康章皇后之父加封一等公加贈太師祀賢良祠長子佟國細襲爵任內大臣兼都統康熙中察哈爾布爾尼作亂奉特噶爾命授為安北將軍率兵往鎮宣府後厄魯丹蠢動命與其弟國維參贊軍務至烏蘭布通地方進擊陳亡贈騎都尉兼一雲騎尉諡忠勇加贈太傅祀昭忠祠其次子法海任兵部尚書三子夸岱任工部尚書孫補熙任綏逺城將軍諡溫僖納穆圖任領侍衛內大臣兼都統佟國維佟圖賴次子任內大臣係孝懿仁皇后之父封一等公征厄魯特噶爾丹至烏蘭布通地方其兄國綱戰沒國維親冒矢石衝入賊陳遂敗其衆贈太傅諡端純其三子隆科多任吏部尚書孫順阿顔係和碩額駙任領侍衛內大臣佟養性佟養正之弟國初來歸東有太祖高皇帝以孫女降焉授三等男徙征遼功加二等子其子六十襲職晉三等伯任都統諡勤惠其子佟國瑶襲爵任福建將軍諡忠慤又佟養性曾孫佟世功由佐領從征陜西於髙長坡陳亡贈雲騎尉祀昭忠祠又佟養正姪孫佟國印由騎都尉圍錦州擊敗洪承疇兵又攻克塔山杏山二城加一雲騎尉後征山東回兵取邊臺七座擊牆子嶺兵敗之又克中後所前屯衛二城加至三等男任工部侍郎佟鎮國佟養正同族偽國初來歸授三等輕車都尉因擒獲賫送廣寧書之人超授三等男席特庫佟養正同族由騎都尉從征大凌河寧逺慶安等處有功授三等輕車都尉征山東敗牆子嶺兵圍錦州破洪承疇三營兵又擊敗流賊追至安肅縣斬獲甚衆又於絳州渡口大敗流寇追騰吉斯擊敗土謝圖汗及碩羅汗兵加至三等男任副都統蘭拜佟養正同族由間散從征黑龍江有功授騎都尉圍錦州破洪承疇三營兵又敗流賊二十萬衆授三等輕車都尉後征湖廣屢著戰功加至二等男任吏部尚書兼都統加太子太保其姪倭赫任四川陜西總督佟山佟養正同族任兵部尚書其子屯岱由佐領圍錦州破洪承疇三營兵攻取塔山杏山二城授雲騎尉攻中後所前屯衛克其城又於延安府屢敗流賊征湖廣有功授三等輕車都尉任浙閩總督兵部尚書其子佟徽年任湖南提督又佟山之姪佟養甲任兩廣總督姪孫佟壯年任都統碩鼐鑲藍旗人由騎都尉征雲南貴州等處屢著戰功授二等輕車都尉任都統托時正黃旗人任漕運總督烏納哈賴正紅旗人世居長白山地方由護軍參領圍錦州大敗松山兵又敗流賊二十萬衆授騎都尉又破流賊滅福王平定河南江南等處屢著戰功後攻江隂縣陳亡贈三等輕車都尉祀昭忠祠邁圖正白旗人世居哈達地方由二等侍衛從征山東浙江福建等處均克獲有功授雲騎尉任副都統議政大臣後征厄魯特噶爾丹陳亡贈三等輕車都尉祀昭忠祠諡忠毅介福鑲黃旗人任禮部侍郎兼副都統加都統銜瑪爾泰正白旗人任將軍長生鑲藍旗人任都統臣等謹按佟佳係地名以地為氏又考八旗氏族通譜載達爾漢侍衛扈爾漢曽蒙太祖高皇帝賜姓覺羅今倣五朝氏族之例統歸總論賜氏一門於本氏下概不重注又佟養正之祖因貿易遷寓關東其子姓遂以佟為氏與鄭志之省言一類今並敘於佟佳氏而仍於總論附列之那木都魯氏散處那木都魯綏芬琿春長白山等地方康武理正白旗人世居那木都魯地方原係本處部長預國初率族衆來歸尚公主封為額駙授三等子十六大臣之列任户部尚書其子賴塔由廢員圍錦州敗松山杏山兵又征山東有功授前鋒侍衛破流賊滅福王平定河南江南等處屢著戰功征福建攻克汀州府城征廣東恢復三府二州十八縣授三等男尋授平南將軍征興化府連破二十六營平定辰州等十九處海寇授征南大將軍征雲南大破賊兵於石門坎黃草壩地方未敘功而卒追贈一等男加封一等褒績公諡襄毅祀賢良祠其弟喀克都理任都統其從孫海夀任刑部尚書蘇滿任都統逹都正白旗人任都察院左都御史成根柱正白旗人由護軍參領從征準噶爾陳亡贈雲騎尉祀昭忠祠明安圖巴顔鑲紅旗人世居綏芬地方原係本處部長和國初率衆來歸編二佐領令其子哈哈納與綽納分統之哈哈納由副將從征烏拉及遼東有功又於昌平等處大敗敵衆擢置十六大臣之列綽和納授逰擊職預十六大臣之列從征遼東有功授三等輕車都尉後取大凌河擊明監軍道張春兵陳亡贈一等輕車都尉祀昭忠祠其子福喀禪襲職加至一等男授西安將軍征甘州克其城招撫河州涼州二郡征四川湖廣等處生擒賊首郝搖旗袁宗第敘功授三等子達理善正黃旗人明安圖巴顔同族由間散從征山東攻克濟南府城尉圍錦腸巴圖魯號授一等輕車都尉兼一雲騎州敗洪承疇三營兵征江西大破金聲桓七萬餘衆續征雲南於沅江府敗賊有功授三等男諡武毅阿爾修正黃旗人明安圖巴顔同族由騎都尉從征山東攻濟南府有功加一雲騎尉後從征黑龍江陳亡贈三等輕車都尉祀昭忠祠其姪塔克圖由領催從征山東攻克濟南府城賜巴圖魯號授一等輕車都尉其子塔爾納襲職加至三等男法喇正白旗人任都統珠瑪喇正白旗人世居琿春地方由騎都尉從征額倫鑰色生庫勒額赫庫掄地方有功加一雲騎尉征山東攻諸城縣克之圍錦州敗松山兵又敗流賊二十萬衆加至一等男任副都統其姪能特任都察院左都御史喀喇鑲紅旗人由間散從征冠縣首先登城陳亡贈騎都尉其孫凱泰襲職從征準噶爾陳亡贈一雲騎尉並祀昭忠祠喀爾圖正白旗人世居長白山地方任刑部尚書其姪武逹禪任都統議政大臣諡襄敏臣等謹按那木都魯本金姓見金史以姓為氏皇朝通志卷二
