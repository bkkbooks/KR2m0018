body:
  text: 欽定四庫全書皇朝通志卷一百二十二災祥略一臣等謹按史家皆志五行始自漢書詳列五行傳説及其占應後代作史者皆因之人主致中和則天地位萬物育其機甚捷其理甚微而為災異之學者必欲條分縷析遂事以求其應有不合又旁引曲證以傅會其説此鄭樵所以斥為欺天之學也鄭氏作災祥略専記實迹而削去五行相應禨祥術數之説誠通論已續通志既踵其體例編次成卷我國家重熙纍洽庥和之氣暢垓泝埏實無所謂變異之徴如前史所載者至於列聖相承敬天勤民之心傳為家法皇上體中和之極賅對育之原兢業淵衷無時暫釋故不因見祥而喜亦不待見災而凛用以承景貺而集庥徴蓋聖心即天心也茲謹就國初以來事迹依類臚於卷內庶幾傳信徴實用以仰見欽若天道敬授人時之至意焉紀災天類地類臣等謹按鄭氏災祥略綜春秋迄隋千有餘年之事迹志天則次以日月星志地則次以水旱而月與五星之薄蝕凌犯不載雷電雪霜氷雹之異不登蓋名之為略固與史家五行志體例各殊也惟考鄭氏志於天則有天裂天鳴諸異於日則有衆日並照日夜出諸異於月則有兩月並見月晝明諸異以類相從我朝至治光昭天地交泰既無此變徴則原書類例自當酌刪若夫堯湯水旱為上世所不能無列聖厪念黎元如傷在抱皇上周咨民瘼宵旰勤求每遇閭左偏災立加撫恤是以水旱之數較之前史為獨多者前代水旱之來未必盡皆入告而我朝則隱飾有譴稽遲有罰則無不上達之隱也前代于水旱之告未能盡皆邀恤而我朝則賑貸有法蠲除有令則無不下究之澤也若依鄭志之例但書作某郡水某郡旱而不臚載恩施則聖朝之厚澤深仁超越千古者無由共見若於一邑一隅之旱潦並皆敘列則事不勝書且賑恤蠲免之條又當入之食貨門而不在災祥占驗之科矣今惟舉其事之大者類繫於篇天類順治元年八月丙辰朔日食在張宿八度十八分食二分有差二年十二月己卯朔日食食不及一分是日隂雲不見五年五月乙丑朔日食在觜宿十一度七分食九分有差七年十月辛巳朔日食在亢宿二度十五分食七分有差十四年五月癸卯朔日食在觜宿二度十二分食六分有差十五年五月丁酉朔日食在畢宿六度五十七分食四分有差康熙三年十二月戊午朔日食在斗宿二十一度二十分食八分有差五年六月庚戌朔日食在井宿九度四十五分食九分有差八年四月癸亥朔日食在婁宿十一度食五分有差十年八月己卯朔日食在張宿九度二十九分食一分有差十五年五月壬午朔日食食不及一分二十年八月辛巳朔日食在翼宿初度二十三分食三分有差二十四年十一月丁巳朔日食在心宿一度二十二分食二分有差聖祖仁皇帝諭大學士等曰天象稍有愆違即當修省或施行政事有未當歟或下有寃抑未得伸歟廷臣詳議以聞二十七年四月癸卯朔日食在婁宿十度五十九分食九分有差諭大學士等曰欽天監奏四月朔日食凡應行應革之事其令九卿詹事掌印科道集議以聞二十九年八月己未朔日食在張宿九度二十分食二分有差三十年二月丁巳朔日食在危宿十度五十二分食三分有差三十一年正月辛亥朔日食在虛宿九度三十四分食五分有差先期諭禮部曰天象之變見於嵗首朕兢惕靡寧力圖修省其罷元旦行禮筵宴至是覽欽天監所奏日食占驗有大臣黜近臣有憂之語諭大學士等曰朕觀自古帝王于不肖大臣正法者頗多今設有貪汚之臣朕得其實亦必置之重典此皆係於人事凡占候當直書其占語今欽天監往往揣度時勢附會陳説如去年視有旱狀則用天時亢旱之占譸張殊甚可傳欽天監諭之三十四年十一月己未朔日食在尾宿三度二十六分食八分有差三十六年閏三月辛巳朔日食在婁宿一度五十七分食十分有差諭大學士曰日食雖可預推然自古帝王皆因此而戒懼蓋所以敬天變修人事也若庸主則委諸氣數矣可諭九卿有宜修改者悉以聞四十三年十一月丁酉朔日食在心宿一度二十六分食四分有差四十五年四月戊子朔日食在胃宿八度十八分食六分有差四十七年八月甲辰朔日食在翼宿一度四十二分食五分有差四十八年八月己亥朔日食在張宿九度二十六分食四分有差五十一年六月癸丑朔日食在井宿十度三十二分食五分有差五十四年四月丙寅朔日食在婁宿十二度十九分食六分有差先期諭大學士九卿曰自古帝王敬天勤政凡遇垂象必實修人事以答天戒其係國計民生有應行應改者詳議以聞五十八年正月甲戌朔日食在危宿初度四十五分食七分有差諭大學士九卿曰元旦日食以隂雲微雪未見别省無雲之處必有見者况日值三始人事不可不謹政或有闕失諸臣確議以聞五十九年七月丙寅朔日食在栁宿五度十六分食七分有差六十年閏六月庚申朔日食在井宿二十九度四十二分食二分有差雍正八年六月戊戌朔日食在井宿二十度四十二分食九分有差先期世宗憲皇帝諭大學士等曰朕御極以來七年之中未遇日食今欽天監奏稱六月朔日食朕心甚為畏懼時刻修省內外臣工宜共相勉朂以凛天戒尋山西巡撫以至期隂雨不見食稱賀江寧織造以是日隂雨過午晴明日光無虧稱賀俱奉旨切責又諭大學士等曰天象之災祥由於人事之得失若上天嘉佑而示以休徴欲人之知所黽勉永保令善於勿替也若上天譴責而示以咎徴欲人之知所恐懼痛加修省也日食乃上天垂象示警所當敬畏詎可以偶爾觀瞻之不顯而遂誇張以稱賀乎山西偶值陰雨不可以概天下江南日光不虧朕推求其故蓋日光外向過午之後已是漸次復圎之時所虧止二三分是以不顯虧缺之象昔年遇日食四五分之時日光照耀難以仰視皇考親率朕同諸兄弟在乾清宫用千里鏡測驗四周以紙遮蔽日光然後看出又豈可因此而怠忽天戒稍存縱肆之心乎慶賀之奏甚屬非理大違朕心宣諭中外知之九年十二月庚寅朔日食在斗宿初度二十六分食九分有差十三年九月丁酉朔日食在角宿二度五分食八分有差乾隆七年五月己未朔日食在畢宿七度十七分食七分有差十年三月癸酉朔日食在壁宿六度四十九分食一分有差十一年三月丁卯朔日食在室宿十一度二十三分食六分有差先期二月上諭大學士等曰本月十六日月食三月初一日日食且自上冬以及今春雨雪稀少土膏待澤朕敬天勤民之心倍增乾惕所望大小臣工共體朕意加修省迓天和夫修省之道以實不以文其有關於民生國計者當盡心籌畫竭誠辦理以盡職守若朕躬有愆􅍝政事有闕失應行陳奏者即據實以聞不得避忌瞻徇亦不得牽引虛文負朕咨詢之意十二年七月己丑朔日食在栁宿六度三十三分食二分有差十六年五月丁酉朔日食在昴宿七度三十七分食四分有差諭曰日食天象之大者自古重之顧僅以引咎求言虛文從事夫豈應天以實之義乃者五月丁酉朔日有食之朕自惟宵旰憂勤無時不深乾惕寧待懸象著明始知戒謹然遇災而懼罔敢不欽戒懼修省惟崇實政行在鑾儀衛早晚鼓角是日著停止一日以示撤懸齋戒我君臣當就常存之敬畏倍加謹凜並修實政即如朕向來巡幸地方官惟修治道途此外一無華飾自乾隆十三年東巡該撫等於省會城市稍從觀美後乃踵事增華雖謂巷舞衢歌輿情共樂而以旬月經營僅供途次一覽實覺過於勞費且耳目之娛徒增喧聒朕心深所不取今嵗恭遇皇太后萬夀兆庶亦藉以申祝嘏之忱是以俯順民情至朕待督撫有司惟因其能實心辦事令地方日有起色方加恩奬豫而不知朕心者未必不以辦差華美求工取恱為得計將玩視民瘼専務浮華此風一開於吏治民風所關者甚大嗣後以違制論諭中外知之二十三年十二月癸丑朔日食在斗宿一度五十一分食八分有差諭大學士九卿科道等曰春秋書日食古聖克警天戒惟是為兢兢兹者季冬之朔日食至八分之多望日又值月食一月之間雙曜薄蝕災莫大焉我君臣當動色相戒側席修省念邇年來西陲底定殊域來歸克奏膚功皆仰賴上蒼福佑在朕宵旰殷懷無刻不以持盈保泰為惕並非出於矯強亦中外臣民所共知苐人情當順適之時檢持或有未至昔人所稱人苦不自知良非虛語夫天心仁愛人事宜修倘用人行政之間有所闕失而不力為振飭何以禆政治而召休和在廷諸臣共襄治理寅恭夙夜宜有同心其各抒所見據實敷陳無有隱諱二十五年五月甲辰朔日食在參宿一度十七分食九分有差諭大學士等曰序臨北至一隂始生薄蝕適逢益切乾惕所有本月朔內廷例用龍舟上年既以禱雨不行今雖際時和並飭停止用申祇荷天仁示戒之至意二十七年九月庚申朔日食在角宿三度二十六分食五分有差二十八年九月乙卯朔日食在軫宿六度一分食七分有差三十四年五月壬午朔日食在畢宿八度三十八分食三分有差三十五年五月丁丑朔日食在昴宿七度三十四分食三分有差三十八年三月庚寅朔日食在室宿十二度三十七分食四分有差三十九年八月壬午朔日食在張宿十度五十三分食三分有差四十年八月丙子朔日食在張宿初度六分食四分有差十二月甲辰朔日食在斗宿二十三度四十三分食一分有差四十九年七月甲寅朔日食在栁宿十六度二十一分食一分有差五十年七月戊申朔日食在栁宿五度三十五分食四分有差十二月以眀年正月元旦日食命停止朝賀並宣諭中外諭曰五十一年正月初一日日食業經頒諭停止朝賀其救護典禮禮部遵例奉行朕仍於內殿恭設香案虔申祈禱以答上天垂象警惕修省之意至於下詔求言史册所稱朕以為轉涉虛文蓋事天以實為人君者敬天勤民躬理庶務日慎一日乃職分所當然即大臣言官應行陳奏事件原當隨時入告豈待日食然後求言况今每日御便殿聽政批答章奏大學士軍機大臣及九卿科道等不時召見咨詢政務即外省自督撫至道府無不隨到宣召未致民隱壅於上聞詎因日食方始下詔求言耶至薄蝕天變日時度數有定昔宋仁宗康定元年正月丙辰朔應日食先時日官楊維德等請移閏於庚辰年則日食在前月之晦帝曰閏所以正天時而授民事其可曲避乎不許所見甚為合理蓋凡日食必以合朔移於晦日尤為非是又考漢唐以來如光武帝建武二年北魏孝文帝延興四年太和十四年唐太宗貞觀六年均以正月朔日食昔我皇祖時以康熙三十一年及五十八年正月朔日食且三十一年錫伯瓜爾察達呼爾等來歸喀爾喀格楚爾喀亦以屬裔來歸之事可見日食為定數而君人者則當因此益加戒懼至於以改移為消弭之説則尢斷斷不可朕踐阼之始即叩天默禱以若蒙天佑享國至六十年即當傳位歸政不敢如皇祖之數逾花甲今幸五十年來夀逾古稀康強如昔惟有宵旰勤求不遑暇逸以仰副上天眷顧之殷祖宗付託之重設以天變為可消弭即於今嵗歸政則是移咎後人圖卸已責如宋髙宗年未六十傳位孝宗置軍國大事於不問不獨無以對天並無以對子朕豈肯出此乎從前推算天行度數乾隆六十年乙卯亦當正旦日食與今嵗同若於是年歸政則值嗣子首嵗元正尤屬非宜朕心亦有不忍何若以是嵗為朕臨御六十年頤和錫福之餘即以次年為嗣子迎庥改元之始國祥家慶天日重光以符朕首祚之祈以紹我大清億萬年之寶命不其懿歟然此願亦不敢期必總以猶日孜孜以靜俟上天垂佑耳將此通諭中外臣民咸知朕意臣等謹按鄭氏災祥略但紀日食而不及月食蓋以日為陽象故春秋書法特重日有食之今從其例右日食順治九年九月太白晝見是月乙未辰時太白見於翼宿三度丙申酉時有流星起中天入紫微垣時世祖章皇帝將巡塞外以上天垂象即行停止康熙三年十月彗星見東南方是月己未朔彗星見於軫宿之次在左轄星之旁其體微小每夜逆行尾迹漸長經翼張井昴胃諸宿至十一月庚戌在婁宿之次聖祖仁皇帝諭議政王大臣曰星象示異皆因德薄敷政失宜所致今惟力圗修省務期允當以答天心四年二月彗星復見先是三年十二月壬戌彗星移奎宿之次其體漸小四年正月癸巳不復見二月己巳復見東南方在女宿之次閲十餘日經虛室壁三宿諭曰異星復見實由德薄所致上天垂象屢示警戒敢不益圖修省以後凡用人行政務加敬慎以求允當至於關係國家利弊民生休戚應興應革事宜內而部院及科道官外而督撫其各抒所見以備採擇朕不憚改正七年五月太白晝見是月甲辰未時太白見午位在栁宿三度丙午庚戌同癸丑諭曰太白晝見天象屢示警戒朕甚懼焉今力圗修省彌加敬慎勵精勤政以答天心在內部院官各盡乃職公亷自效在外督撫提鎮以下各綏理地方撫恤軍民咸今得所二十一年七月彗星見東北方是月己巳彗星見於井宿之北其色白尾迹指西南壬申行東北尾迹長六尺餘癸酉諭大學士等曰天道關於人事彗星上見政事必有闕失其應行應革者令九卿詹事科道會議以聞乾隆七年正月異星見東南方是月丙戌異星見于斗宿之次在天辨第二星之上其色黃白向西北逆行四十餘日隱伏八年十一月彗星見是月己亥彗星見奎壁之中距奎宿第二星二度體如彈丸其色黃尾迹長尺餘每夜向西逆行由戌宫至亥宫十二月丁卯上御門聽政畢召大學士等前曰星象見異朕思天心仁愛垂象示警必政事之間有所缺失我君臣當夙興夜寐勤加修省以回天意惟是應天以實不以文修省之實非徒託之空言也且書不云乎王省惟嵗今嵗序將周正其時矣我君臣必深思所以致此之由缺失何在亟圗悛改庶幾盡事天之道有以感召和氣而消未萌之眚也癸酉諭曰昨召見大學士陳世倌據奏近日彗星見宜下修省之詔宣示百官朕思人主君臨天下敬天勤民之心必嚴恭寅畏無時不凛上帝之鑒觀念兆人之休戚以期弭咎於未然誠以修省全在乎平日此朕之所以夙夜兢兢者事天以實不以文以誠不以偽也若但托於文告飾為敬慎警懼之詞而無引咎責躬之實徒務臣民之觀聽以塞責是眀以示戒而更加粉飾則欺世慢天其過愈大豈能感召天和潛消沴戻乎前日御門時朕面降諭旨原欲與大臣等交相警省深思所以致此之由缺失何在亟圖悛改格天之道惟在乎修省之實而不在修省之文我君臣其共勉之十三年三月客星見東方是月癸丑客星見於室宿第三星之南一度其色黃向東順行至次日即消二十四年三月彗星見東南方是月甲午彗星見於虛宿之次其色蒼白尾迹長尺餘指西南每夜順行十餘日伏不見四月戊辰復出西南方在張宿第二星之上體勢甚微向東順行至五月初仍隱伏至十一月戊辰有客星見東南方在未宫井宿四星之下自未宫行至酉宫胃宿之次尋亦隱伏三十四年七月彗星見東南方是月甲辰彗星見于昴宿之次體如彈丸其色蒼白尾迹長二尺餘指正西偏南每夜順行八月望後伏不見十月復移見西方尋即隱伏三十五年閏五月客星見東南方是月己酉客星見于斗宿之次在天辨第一星之西其色蒼黃每夜向北行十餘日即隱伏十一月彗星見東南方是月彗星見于栁宿之次在第一星之下色蒼白尾迹長尺餘指南每夜向北行十餘度七日隱伏右星變皇朝通志卷一百二十二
