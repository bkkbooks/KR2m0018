body:
  text: 欽定四庫全書皇朝通志卷九十六食貨略十六河工順治元年特設河道總督一人駐劄濟寧州後移駐清江浦總理黃運兩河事務設分司駐劄各境定分汛防守之法每遇桃汛伏汛秋汛將臨令該管官辨加謹分防二年考城之流通口決旋即堵塞八年築祥符單家寨堤封邱李七寨堤又築陳橋堤鄭家莊堤九年河決封邱大王廟口水從長垣趨東昌壞安平堤北入海因於丁家寨鑿渠引河殺其勢築祥符時和驛堤又築常家寨隄及商邱王家壩堤考城王家道口堤十年定南旺臨清等處煞壩濬淺每年一小濬三年一大濬十一年築陽武慕家樓商邱夏家樓虞城土樓諸堤十二年築祥符守么寨及回龍廟月堤陳橋堤並築蘭陽板厰陽武潭口寺包家厰諸堤十四年築祥符之槐疙疸清河集並陳留之孟家埠諸堤是年陳留孟家埠口決於堤南築縷月堤五百丈並濬引河一道以分水勢十六年總河朱之錫疏言兩河利害條奏十事一陳眀南河夫役一酌定淮工夫役一查議通惠河工一特議建設柳圍一嚴剔河工弊端一釐核曠盡銀兩一慎重河工職守一申明河官専責一申明激勸大典一酌議撥補夫食疏入從之康熙二年準朱之錫請定河差滿漢官仍照舊例三年更換按三年一換之例係順治十四年河臣楊方興奏定嗣因六部司官輪流升轉又兼滿漢並差議將管河分司改為一年更替之例七年築祥符一覽臺聶家寨及儀封石家樓小宋集諸堤九年河水盛漲自桃源界起東至龍王廟俱因舊址加築髙濶十五年髙家堰及漕堤等處潰決特遣尚書冀如錫前往察勘悉心籌辦於是開白洋清河以東引水河使黃河入海開清河兩旁引水河使淮水出河又築河岸遙堤縷堤修髙堰堵翟壩而揚境以內各工亦同時並舉是年裁髙郵分司及南河工部又準總河靳輔請挑山清髙寶四州縣運河並清口爛泥淺引河四道及清口以下至雲梯關河一道十七年命撤回南北中河三分司其河道工程委該地方監司府佐二管理又定河工頂衝之地即以舊堤為縷堤於舊堤之外别築遙堤以為重門保障又準靳輔請自翟壩至周橋二十五里湖陂築大堤一道自桃源東界至石人溝築縷堤一道又自龍王廟至四鋪溝接築四千九百三十八丈十八年建宿遷之朱家堂溫州廟桃源之古城清河之王家營安東之茒良口減水壩共六座二十三年上南巡閲視河工諭朕觀髙家堰地勢髙於寶應髙郵諸水數倍前人於此作石堤障水實為淮揚屏蔽且使洪澤湖與淮水併力敵黃衝刷淤沙關係最重仍須嵗嵗防護又諭運道之患在黃河禦河全憑隄岸若南北兩隄修築堅固則河水不致四潰水不四潰則濬滌淤墊沙去河深隄岸益可無慮今隄防雖經整理還宜隨時修築以防未然於是於髙家堰舊口周家橋翟壩及蕭家渡九里岡崔家鎮七里溝黃家觜新莊一帶緊要近溜之處所築長壩與逼水壩均每嵗加築髙厚二十四年靳輔疏言徐州鳳陽淮安所屬十九州縣沿近黃河南北兩岸頻受水患請共築束水隄三十萬丈隨地髙低牽築頂髙二丈底寬六丈八尺以資保護從之三十一年戶部侍郎博濟疏言黃河南岸之楊橫莊煙墩馬邏及北岸之朱家莊便益門東安門六險工向無月堤且所下之掃亦俱單薄應請築堤培掃以資鞏固從之三十八年上巡幸江浙審視清口髙家堰地方見洪澤湖水較黃河甚低河水逆流入湖以致泛溢於興化鹽城諸州縣諭總河於射陽湖淤墊處分委效力人員并力開濬其黃淮交滙之口令於黃河南岸近淮之堤更迤東長二三里築令堅固淮水近河之隄亦迤東灣曲拓築使斜行會流毋使黃水倒灌又以河通則流自急流急則沙自刷而河自深令於清口西數灣曲處試行濬直直濬有益漸將上流曲處一律直濬尋經漕運總督桑格河道總督張鵬翮等議定挑濬蝦鬚二溝及鮑家莊滔子河撈魚港老河口等處三百餘里引積水流出歸海四十三年疏濬戴村壩淤塞舊河築和尚林月堤逼水仍歸故道以免東平州一帶水患四十七年疏濬蘇松常鎮所屬支河港蕩並修建新舊閘壩四十九年濬徐邳境內房亭等河雍正四年揠濬濮州之魏河聊城之泄水河並開濬鬲津趙牛等河五年疏濬濟南府屬之管氏倪倫溫聰漯刁強等河又於東省安山湖開濬支河六道并於六堤口建閘以利節宣又定濱河居民架水板房有礙河道者坍圮之後不許再行修造至濱河未報升科之新漲地畝並越砌石磡實繫妨礙河道之處皆令速毁違者罪之該管官失於稽察分别議處六年議準吳淞天妃七浦三閘各設閘官一人白茅徐六涇二閘共設閘官一人又議準劉莊青龍橋改為石閘鮑宗壩運鹽河建築土堤鹽城石噠口天妃口廖家口草堰口如臯苴河洋黃河洋各增建石閘董家溝徐家涵等處建設涵洞以資宣泄七年增築髙家堰堤閘通用石工八年議準串場河王道港新洋港牛龍港草堰口廖家港五處積沙照吳淞白茅等海口之例用犁船犁鬆用混江龍按時疏濬又議準泰州興化縣東臺地方設立水利同知一人統轄所屬串場河道九年議準戴村新壩拆低與舊壩相等並將髙岸改作漫坡以泄水通沙十年議準如臯之岔河以北至豐利場二十八里岔河以東至掘港場五十里各就淺深分段增濬俾蓄水五尺以利運行十二年修補泰州屬之栟茶地方舊隄移進三四里别築新隄如臯縣之豐利掘港馬塘通州屬之石港西亭餘西餘中餘東吕四及泰州屬之丁溪草堰興化縣屬白駒劉莊鹽城縣屬之伍佑等場范堤並令鑲築防風乾隆元年諭治河之道必將全河形勢熟悉胸中黃河自河南武陟至江南安東入海長隄綿亘二千餘里舊設總河一人駐劄清江浦雍正七年復設河東總河誠慮鞭長不及故俾南北分隸各有責成惟是河流日久變遷舊險既去新險復生其間防浚事宜有病在上流而應於下流治之者有病在下流而應於上流治之者若河臣於南北形勢未能洞悉遇有開河築隄等事或至各懷意見則上遊下遊必有受弊之處所關匪細徐州府當南北之衝為兩河關鍵最為緊要著將副總河移駐徐州凡兩河開築事宜令其就近與南北河臣公同酌議舉行其毛城鋪等處減水閘壩仍令督率徐屬廳營按時啓閉五年上以清口黃淮交滙係黃運湖河之樞紐定於風神廟前東壩及運口頭壩外各接長數十丈以資收束其運口頭壩之南接長挑水壩使其回流入運六年又定黃運兩河自宿遷至清河通築縷隄二萬五千餘丈格隄九道十字河至九里岡通築縷隄百餘丈格隄五道仍以運河南岸縷隄作黃河北岸遙隄先是洪澤湖濱每遇風浪船多漂溺康熙年間曾設救生樁全活甚衆十一年諭夏家橋地方有舊蘆壩一座髙堰迤西有順水壩一座皆有口門為遭風船躲避之所著於髙堰老隄頭山旴髙澗壩及徐家灣周橋增護隄救生壩四處又以裏河運口為淮揚運河關鍵全賴口門收束令頭二三壩口門毋許過四丈十六年上南巡周覽河工諭洪澤湖上承清淮汝潁諸水滙為巨浸所以保障者惟髙堰一堤天然壩乃其尾閭伏秋盛漲輒開此壩泄之而下流諸縣胥被其害冬月清水勢弱不能刷黃往往濁流倒灌在下遊居民深以開壩為懼朕親臨髙堰循隄而南越三滾壩至蔣家閘周覽形勢乃知天然壩斷不可開近者河臣又請於三滚壩外增建石滚壩以資宣泄不知增三為五即以過水一二尺言之向過三尺者即五尺向過六尺者增而至丈是與天然壩名異實同亦當為之限制上年滚壩過水三尺五寸天然壩仍未開放應即以是為凖於是於天然壩立石永禁開放其五壩以仁義禮智信為次仁義禮三壩一如其舊智信二壩則於石面之上加封浮土如仁義禮三壩已過水三尺五寸不足減盛漲則啓智壩之土仍不減乃次及於信壩永著為例至髙堰石隄南滚壩以南舊用土工石隄有首無尾亦令自新建信壩北雁翅以北一律改建石工十八年淮水盛漲泄洪澤五壩泛車邏南關二閘黃河復決銅山隄南注靈虹諸邑歸宿洪澤奪淮而下特命舒赫德劉統勳往來董率堵築均於嵗冬合龍尋又於髙堰武家墩迤北築磚工隄堰千餘丈以資捍禦又總督髙恆疏稱海州沭陽地方逼近海濱地勢窪下為衆流之所趨請將下遊入海道路再加疏浚於是挑濬髙墟口湯家溝及義澤車軸五圖等河於鹽河場河大伊山洪河三汊口一帶並武障越河南股河尾修閘幫堰以資蓄泄十九年疏山陽縣之澗河涇河寶應縣之子嬰河髙郵州五里車邏三壩下之引河泰州丁溪閘之古河二十年諭上年江省被災各屬雖屢經撫恤猶恐將來青黃不接之時閭閻糊口維艱現在下河及芒稻河等處有應行疏浚修築者可隨宜興舉為以工代賑之䇿於是濬山陽縣之市河寶應縣之黃浦河築安東縣之平旺河子堰挑沛縣之茶城支河及邳雎屬峯山閘下之引河又暫借公帑修築桃源清河二縣六塘河兩岸堤堰按舊例此河堤堰原係民修兹因災民無力興工故豫借帑銀代修分作三年帶徵還項二十一年黃河漫溢疏荆山橋河身以泄滕嶧等縣積水二十二年上兩度南巡親蒞河干指示一切疏泄捍禦機宜時微山昭陽諸湖俱已疏通而駱馬湖隄堰淺缺不足禦運河盛漲於是並築駱馬湖隄又以六塘河以下餘潦停積桃源宿遷諸窪地多成巨浸山東之金鄉魚臺等屬未涸地畝尚有十餘莊江南之宿遷靈璧及河南之永城夏邑等處漫衍地界不下數百里經山東巡撫鶴年奏報即命鶴年赴荆山橋偕白鍾山及侍郎夢麟籌濟寧金鄉魚臺滕嶧五縣水勢隨遣侍郎裘曰修馳視山東河南上江積水並飭欽差河臣揀熟諳水利之員先其最要者舉行餘亦次第並修統於嵗內告成於是自濉城以東堅閉毛城鋪諸閘使不得泄黃壅濉於亳潁一帶及虞城夏邑商邱永城各屬支河幹河一律疏濬以泄中州諸水去路挑兖州之府河洸河改金口涵洞為減水閘改楊家壩為石閘浚伊家河泄微山湖入運又堵築沂水不使入運以免沛縣旁溢添設昭關滚壩建髙郵運河東堤石閘酌定水則以時啓閉浚芒稻閘越河以闢湖河歸江尾閭於荆山橋上一帶支河専派道員駐劄隨涸隨疏以暢下遊之勢是年築髙堰添甃石隄嗣又築髙堰北岸土隄二十四年浚山東曹單二縣江南豐沛二縣之順堤河與山東之衛河泉源以濟運二十五年又開運河東堤金灣壩下引河改低董家溝寥家溝石羊溝三壩又添築河南懷慶府城外月隄二十六年督臣髙晉疏言下河州縣境內支河汊港及田間積水向俱滙入串場河北流於鹽城境內諸閘歸海其閘下舊有歸海引河不可不加疏治請將丁溪小海二閘引河疏浚並順勢再開一引河滙入王家溝歸海又將上岡草堰陳家沖三閘引河疏浚亦再開一引河滙入射陽湖歸海以分泄水勢從之二十七年上三度南巡駐蹕蘇州命劉統勳兆惠會同河臣詳勘湖河歸江之路尋議定開擴新挑引河下遊使有建瓴之勢拆金灣中二閘添建石閘三十丈落低西灣壩四尺於河頭加挑深寬以資利導又特示宣泄機宜令展拓清口十丈並建立水志以垂永久又於徐州河堤自甎工止處接築甃石十七層為經久善後之計三十年諭前因微山湖蓄水過多瀕湖窪地每致淹浸經崔應階等奏請宣泄微湖以水志一丈為度於韓莊添建新閘以殺其勢並挑荆山橋以暢其流朕今嵗南巡回鑾時舟行所經詢知窪地近多涸出農田耕作有資但湖水暢消亦恐艱於濟運今據楊錫紱奏稱湖內之水須存一丈二尺用至五月八閘底水尚可得四尺餘寸若止存一丈則五月間八閘底水止存二尺六七寸重運難行請交東省河撫可否量改水志或將湖口以下數十里河底一律挑濬五尺等語所奏於漕渠轉輸自有裨益但水志改加二尺於低窪地畝有無妨礙及挑深河底是否可行著崔應階會同李宏詳悉確勘具奏期於漕運民田均得利賴尋議定將滚壩內機心每孔安砌石槽設立板片水小之年加板欄束其八閘河亦將新淤沙泥儘力挑占至舊時河底而止三十四年挑東省運河一律深五尺計工五年而後止三十九年黃河老壩口漫溢遣大學士舒赫德赴江南會同髙晉設法堵築旬月集事黃河大溜全由故道歸海四十一年諭清口為湖河最要關鍵而陶莊之水逼河南流清水勢弱黃水勢強每有倒灌之虞康熙年間聖祖親蒞河干周覽形勢命於清口迤西隔岸治陶莊引河導黃使北其南岸築挑水壩橫截河流遏入陶莊河口時河臣經理未善隨濬隨淤乾隆四年命大臣閲視仍謂難行乃以木龍挑溜北趨不過聊為目前補救之計甚屬無禆著河臣薩載督臣髙晉測量髙下曲直繪圖貼説圖上上用硃筆點記其處反復指示於是復開陶莊引河不期年告成而新河順流安軌直抵周家莊始會清東下旋又命於新河頭下添石壩一道為重門保障由是清水常勝黃水無倒灌之虞四十三年儀封考城漫口潰決遣大學士阿桂刑部尚書袁守侗前往察勘嗣據阿桂等議定堅閉金門展濶引河接築挑水壩遏溜北趨合龍後又請修馬港河西岸殘隄接至北潮河西岸民堰以禦倒灌從之四十五年上五度南巡閲視髙家堰隄閘命總督薩載將三堡六堡等磚工一律改建甃石並加髙數尺其徐州舊有石隄九百七十餘丈較新築石隄短少三層亦令一律加髙自韓家莊至奎山一帶隄堰四百五十餘丈一律改築石隄直接山腳以垂鞏固四十六年邳睢南岸之魏家莊大隄潰隨飭河臣裹護漫口預防北岸河隄然後籌計經久良䇿未幾北岸曲家隄亦漫浸逼運河上以黃水經過河湖下遊無不淤墊之理諭河臣急赴運河籌辦分泄事宜確勘微山湖水淺深尺丈迅速堵築時大學士阿桂奉命查勘海塘工程即令董理河務尋經阿桂疏奏於東西兩壩下掃追壓堅實壩臺增加髙厚金門斷流大溜全歸引河引河中泓流行迅駛直注六塘河歸海四十七年南北兩處漫口合龍後陡蟄三十餘丈隨諭阿桂等於上遊南岸改築壩工俾得吸溜歸槽井令薩載展寬下遊潘家屯六塘等處去路挑微山湖下顧家莊等引渠阿桂等勘定上遊自蘭陽三堡至商邱七堡南隄外添建大隄一道內開引渠一百六十餘里導河水入渠下注商邱歸入正河故道入海四十九年河撫李奉翰疏言邳睢廳黃河南岸瓦房迤上張家莊地方因黃水盛漲大溜趨逼塌去外灘應趕下大掃簽釘長樁加廂追壓從之又挑挖荆山橋及蘇家山壩引河五十年以天然閘下引河年久淤塞自黃河岸起至韓家莊挑河築堰又李奉翰疏言裏河廳頭壩外兜水壩乃重門收東兜攔湖水多入運口以濟重運應請建築壩工從之河南巡撫畢沅疏言賈魯會濟諸河久經淤塞應請及時開濬且於水旱不時可資蓄泄從之海塘順治元年禮科給事中張惟赤疏請嵗修海塘以防潮患於是修錢塘縣石塘二十一丈二年增修六十丈按海塘自前明崇禎二年同知劉元瀚建修海寧捍海塘後不復修康熙三年海決修海寧縣塘築石堤並築尖山石堤五千餘丈九年設浙江海防同知二人専司塘務三十八年修錢塘江塘四十年修錢塘江岸築石塘每塘一丈用石一縱一橫固以油灰鎔鐵錠鑲嵌石縫深根堅杵加築子塘以為重障共建石塘六百六十七丈子塘八百九十五丈四十一年江塘圮布政使郎廷極築之建潮神祠於上五十年重築江塘布政使殷志熙董築其法用石一縱一橫每層鑿孔以巨木貫之每五六石聨為一石又於橫直合縫處用鐵錠鑲嵌成塘二十丈五十七年修築海寧石塘濬備塘河巡撫朱軾建築其法每塘丈用木匱二每匱貯石塊五十斤為塘基外築坦水復開備塘河建閘一座五十九年從巡撫朱軾請於老鹽倉築魚鱗石塘開濬中小亹淤沙令海防同知専督嵗修是年分修海寧塘六十一年改築草塘雍正元年以赭山海口壅塞逼近塘口諭該督撫即行疏通毋使潮汛留沙漫壅以固海寧塘根二年命吏部尚書朱軾會同江浙督撫議興海塘事宜尋議浙江海塘自餘姚縣之滸山鎮至臨山衛土塘三道內有一道為老塘年久沙淤百姓占耕築土塘二道形勢卑弱應加髙厚自上虞縣之烏盆村至會稽縣瀝海所石塘暨兩頭土塘漸致坍塌應於塘底填築亂石上鋪大石貼石築土以資培護自海寧縣之陳文港至尖山亂石砌邊土塘加築髙厚其塘如式改修塘外亂石子塘重修完固其原無子塘者如式添建海鹽縣自秦駐山三澗寨至演武場石塘衝塌百五十餘丈應如式修築議得松江海塘自金山衛城北至華家角漴闕墩至東灣金山墩至西墩兵厰至張家舍倪家路至三岔墩周公墩至華家角各土塘計二百五十餘里內有最險工一段次險工二段俱應改土為石其餘水勢稍緩之處宜堅築土塘自華家角至上海之頭墩塘外淤沙之處與頭墩至嘉定縣界內外土塘二道俱令徑直加築塘外密釘排樁以防衝潰俱從之三年命於塘內一概增建復塘以禦海嘯五年巡撫李衛請增築浦兒兜草壩並改建姚家堰草塘從之姚家堰舊建土堤是年復修海寧縣錢家坂馬牧港等處塘工又修江塘六年修海寧縣老鹽倉西塘縣南門外海塘錢塘江塘七年命建海神廟於海寧縣東門內又改建海寧縣荆煦廟等處石塘向係草塘後改土塘今建石塘築陳文港等處草壩八年築寧西塘大壩設海防兵辨鑄鎮海鐵牛五座又修仁和縣塘九年續修海寧錢塘塘工十年築仁和沈家埠海寧華家弄草塘十一年命內大臣海望查勘浙江海塘於海寧之尖山塌山中間建石壩一道以堵截江溜又諭於中小亹開濬引河以分水勢增設道員一同知一守備二千總三把總七兵八百専司隨時修補又修仁和錢塘平湖諸邑塘岸十二年濬南港河築尖山西浮壩十三年總督程元章疏定海塘事宜四一錢糧宜分案具領一分别保固年限一令承修官會同估造一於緊要工所豫貯物料從之增築魚鱗石塘葺浦兒兜舊塘加築海寧南門外魚鱗石塘又定攻沙法大學士嵇曾筠疏言寧邑塘工之患皆由南岸沙灘沙觜挑溜致水勢全向北趨請於南岸沙洲用鐵具梳挖陡岸俾河岸根腳空虛海潮來往自為衝刷坍卸以泄水勢從之乾隆元年建築仁和海寧魚鱗石塘六千餘丈并海寧南門石塘設運石海船五十隻二年編石塘草塘字號向例各塘坍􅀈率以某家東西起止開報易於朦混雍正年間監督汪漋張坦麟等議將各塘編立字號至是大學士嵇曽筠咨部將各塘照千文編號以二十丈為一號建豎界碑仁和計編七十二號海寧編六百四十號其餘海鹽等塘均照此例改建海寧繞城坦水四年停草塘嵗修改建浦兒兜等處石工續築尖山未竣壩工前大學士嵇曾筠因水勢險急灘以堵塞疏請暫停兹撫臣盧焯以水勢已平合龍甚易疏請補築復濬備塘河興築仁和錢塘江海塘埭五年續建東塘石工是年尖山水口成乾隆二年經始鑄鎮海鐵牛四座六年總督德沛復請老鹽倉迤西至仁和縣之章家菴柴塘改建石工從之命左都御史劉統勳查勘浙江海塘先是五年十一月德沛曾有是請部議準行以劉統勳言改建不必過急乃緩興築至是復請故遣統勳會勘七年總督那蘇圖疏言海寧縣之華家弄柴塘外沙綿漲數里無須改建石塘惟老鹽倉汛至東石塘界地俱頂衝請擇其最險之觀音堂汛坐字號老鹽倉汛伏字蓋字等號建築竹簍石壩是年左都御史劉統勳疏言親履南北兩岸柴塘改建石塘誠經久之圖請俟水緩沙停乘機興築每年以三百丈為率督臣那蘇圖復疏言老鹽倉汛至東石塘界最險請先間段排築石簍俟石簍根腳堅實再照原議改建石塘均從之九年命吏部尚書公訥親勘修浙江塘工尋疏稱仁寧二縣柴塘外護沙寬廣不必改建石塘從之是年海寧魚鱗大石塘工成乾隆二年經始十二年濬中小亹工成十三年增築護塘土堰又議增滚壩及塘汛辨兵十五年海潮平謹按海水自乙丑嵗以來大溜直趨中亹至是年海波不揚臣民慶幸冬十二月撫臣永貴以秋汛安瀾塘工穩固疏聞十六年上巡幸江浙蒞錢塘江幸六和塔敬念世宗憲皇帝奠安之德勒石紀事永示無極十八年海潮平十九年督臣喀爾吉善請裁改海塘營官辨江海塘工向設兵備道一員統率守備二員千總四員把總八員外委十六員馬步兵千分守防護至是以尖山石壩告成中小亹引河暢流塘工穩固裁汰道員塘工歸杭嘉湖道専管其守備以下等官兵辨均裁改留堡夫四百名三百名守北岸一百名守南岸餘兵改歸杭乍二營二十二年上巡閲海塘幸觀潮樓命建海神廟於城南明年廟成御製碑文勒石二十四年酌復海塘營辨兵復千總一把總二外委三馬兵二十步戰兵六十守兵三百名海寧分設二汛舊設堡夫悉行裁汰統歸兵額加築護塘土堰時撫臣莊有恭言海寧石塘近城一帶護沙沖塌故有是築增築層石坦水修海寧條石坦水時江流海潮復改由北大亹出入二十五年修東西塘坦水及韓家池柴塘復修築海寧南門外堵坦水時海寧南門外及石門繞城塘外二層坦水為五月望汛潮損故復修二十六年修胡家兜坦水時潮水逼塘護沙全刷地當頂衝故建之修魚鱗石塘坦水自雍正八年建後已歷年久今外無護沙故改建修馬牧港塘工坦水築秧田廟坦水修韓家池柴塘均以潮汛沖塌護沙故修二十七年上巡幸浙江躬閲海塘咨度經久之計將老鹽倉柴塘改建為石因下木樁試之奈沙質浮鬆所下之樁不能牢固其柴塘向內數十丈雖可下樁又皆田廬溝塍上命仍築柴塘定嵗修坦水以資擁護又改築四里橋魚鱗石塘并華嶽廟等處石塘盤頭坦水二十八年改建念里亭諸處魚鱗石塘二十九年置老鹽倉護塘竹簍增築念里亭坦水三十年命於海寧全城環繞石塘普築三層坦石並隨時修整以資防護四十五年上五次南巡親視海寧塘工以柴塘究不如石塘鞏固因命該督撫督率所屬自海寧陳文港石塘迤上至老鹽倉柴塘四千餘丈通建魚鱗石工旋遣大學士阿桂往來勘視工程四十七年據總督陳輝祖奏西塘頭圍為江海交接之處漲沙十餘里橫江截海阻隔水道致范公堤以東漸致搜刷章家菴迤西沖擊灘墈因於頭圍沙灘開引河一道待春夏山水暴注時開放引河借山水奔騰之勢順流攻沙會春雨漲發大溜直趨引河范公堤正溜開向南行漸有南坍北漲之勢四十八年原辦續辦魚鱗工竣又奉上諭浙江范公塘一帶看來竟須一律改建石塘以資捍衛昨已諭知富勒渾等矣明春南巡時朕親臨閲視指示機宜降旨後即可興工辦理至富勒渾有老土塘根腳同係淤沙土性浮鬆之語從前老鹽倉一帶亦稱淤性浮鬆難以開槽打樁乃自建石工一律穩固堅實可見事在人為該處改建石工所費不過較前三分之一方今府藏充盈即多費數十萬帑金捍衛民生使閭閻永臻樂利亦所不靳也四十九年上親視海塘工程諭浙海建築石塘所以保障民生自應於石塘既建後砌築坦水保護塘根乃督撫惟云柴塘必不可廢此受工員慫恿為後日嵗修冒銷地步况添建石塘原欲留柴塘為重門保障並未令其拆去若如該督撫言復加嵗修安用費此數百萬帑金為耶又石塘之前柴塘之後見有溝槽一道槽內積水並無去路將來日積日甚石塘根腳勢必淹浸滲漏該督撫亦並未慮及又石塘上堆積土牛甚屬無謂設遇異漲又豈幾尺浮土所能抵禦所有塘上土牛即著填入積水溝槽之內仍將柴塘後之土順坡斜做祗露出石塘三四層為度并於其上栽種柳樹俾根株蟠結塘工益資鞏固如此則石柴連為一勢即以柴塘為石塘之坦水至范公塘一帶亦需一律接建石工方於省城永資鞏護著自新築石塘工止處之現做柴塘及挑水段落起至硃筆圈記處止再接築至烏龍廟止一體添築石塘豫限五年分段從東而西陸續修築以期海疆永慶安瀾皇朝通志卷九十六
