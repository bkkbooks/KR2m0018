body:
  text: 欽定四庫全書皇朝通志卷六十二樂略一臣等謹案虞書云詩言志歌永言聲依永律和故鄭樵志樂謂樂以詩為本詩以聲為用其所列四門皆系以聲而輒以聲歌湮沒風雅不分為言蓋必有聲律身度之聖人斯能推闡精微折衷美善以昭盛德之形容也洪惟我國家列聖相承功成治定作為大樂美偹詳明聖祖仁皇帝貫通理數特揭正樂審音和聲定律協均度曲之旨詳載律吕正義一書垂示萬世而於審比聲歌之事猶有待也我皇上極建中和業隆繼述以前書內尚少樂章字譜用加釐正别陰陽辨清濁音律之髙下節奏之短長咸分刌而節比之務使律吕各得其宜歌奏不淆其序故自郊廟登歌朝廷宴饗以及丹陛導迎鐃歌鼓吹逺方藩服之音干籥羽翳之制莫不繪圖定譜列入律吕正義後編夫而後聖祖之所為審音定樂制器協均者一一施諸實用至於一切慶典舉行每親製宸章宣諸金石即令臣工撰擬亦必特加訂定一歸敦雅莊和此所由廣大清明成文從律洋洋乎載如地而幬如天上嫓簫韶之雅奏也比者皇上猶以聲音之道宜趨古雅而樂工承襲往往但徇工尺莫究聲律之原特命樂部大臣取律吕正義後編內樂譜駢注宫商等字樣俾避俗歸雅克諧古音仰見聖天子釐定宫懸精研聲律敷宣雅化期協同和之至意因是編祗載樂章名目其宫商角徵羽奉旨詳定在律吕正義後編內兹不具列仍依鄭樵原志按類次序分為正聲遺聲祀饗正聲祀饗别聲附以樂舞至鄭志尚有十二律五聲八音名義諸門本襲通典之文應於皇朝通典內按門詳載不贅敘於是云正聲臣等謹案鄭樵樂略正聲一門所載鐃歌言戰陳之事鼓吹為警嚴之節西涼等曲逺方之樂亦屬韎師職掌之遺至相和歌以下等曲多巷陌歌謡之詞無關雅奏我朝審比聲歌一洗前代靡曼之習今所綜輯皆光昭國典之章初非鄭樵所録能髣佛萬一也鐃歌大樂二十八章大清朝四時仗承天眷貢琛球錦繡乾坤中天盛世奉宸歡晴開五雲瑞雲籠駕六龍扈翠華四時念壯軍容日初升嘉祥曲練吉日謁珠邱御黼座長白山布爾湖建遼陽瀋陽城鐵嶺山孕嘉産育靈禽蕃珍樹建皇極鑠皇清鐃歌清樂二十七章九龍旃鬯皇威整貔貅河清海晏輦路平景清明聖武光昭皇風泰慶雲呈象天行虹流華渚皇都無外夏諺歌芳塍曲渥窪曲美留都溯興京格皇天大凌河狩于原日上扶桑九五飛龍聖德巍巍蹀躞遊龍慶皇圖萬國瞻天昊天命臣等謹按右鐃歌大樂二十八章鐃歌清樂二十七章皇帝躬祀郊廟禮成回鑾及御樓受俘並擇奏之車駕省方則設於旌門外每夕奏數闋恭遇大閲駕出鐃歌大樂奏壯軍容之章駕入鐃歌清樂奏鬯皇威之章乾隆七年定平西凱旋郊勞鐃歌十六章帝效天爍月竁振王鈇攻庫車厥角稽黑水戰援兵來阿克蘇鹿斯奔回城降伊水洱和門開天斷成皇式辟雍帝圖鞏平西凱旋郊勞凱歌四十章臣等謹按乾隆二十五年平定西域大軍凱旋皇帝跓蹕黃新莊親行郊勞是日陳設鹵簿大駕設黃幄御座於郊臺正中鐃歌鳴螺軍士俱於臺左右排立凱歌樂排立於御道左右駕至郊臺軍士鳴螺奏平西鐃歌禮成皇上出黃幄乘騎鐃歌樂止停鳴螺馬上奏平西凱歌駕還行宫樂止平定兩金川鐃歌十六章皇威鬯慎行師犄角攻趲拉平討促浸迅霆復八旗勇窮猿僵扼宜喜越重壕河之西後路清一窟摧釡底魂穴蟻掃武功成御製平定兩金川凱歌三十章臣等謹按乾隆四十年八月平金川大軍攻克勒烏圍紅旗報捷御製凱歌十章十一月攻克西里第二峯四十一年二月攻克噶喇依並御製凱歌各十章四月大軍凱旋皇上親行郊勞於黃新莊命以凱歌三十章與鐃歌十六章並奏之自二十五年平西時至此十七年之間膚功疊奏聖武逺揚洵千古未有之盛烈也臣等又按鄭樵於正聲首列鐃歌考鐃歌源於漢代本為軍中之樂馬端臨謂二十二曲中以其名義考之若上之回則巡幸之事上陵則祭祀之事朱鷺則祥瑞之事至艾如張釣竿篇之屬則各指事為言非專為戰伐也魏晉以後代易新名至唐則有破陳樂等四曲宋則有上帝命等十四曲顧唐如栁宗元所上晉陽武等十二曲宋如尹洙所進皇雅十篇當時未見施行自元至明則寂如已我朝所定篇目孔多義各有取至平西平兩金川諸製布昭聖武宣鬯皇威尤為度越前古云導迎樂臣等謹按周禮鐘師以鐘鼓奏九夏杜子春謂王出入奏王夏此導迎樂之所由昉若宋之永至梁之皇雅皆其類也我朝憲於前典準齋日不樂之義凡遇大祀皇帝出宫鼓吹陳而不作禮畢還宫則奏之值齋期仍不奏其餘如進表進箋頒時憲書頒詔殿試迎榜進吻等皆得奏是樂其制定於順治元年乾隆七年重定樂章十七年奏準凡躬祭回鑾名曰祐平一應慶典名曰禧平典禮之隆聲容之盛非宋之六州十二時明之武成所能並論也皇帝耕藉禾詞一章三十六禾詞臣等謹按雍正二年定耕藉禾詞樂工於耕藉所排列俟行禮時歌此詞巨典光昭足補古禮之所未備皇后躬蠶歌詞一章采桑歌臣等謹案乾隆七年定先蠶壇樂章兼定此歌皇后躬桑時采桑歌排列桑外東西徑道唱之用與禾詞略同笳吹樂章六十七章牧馬歌古歌如意寶佳兆誠感詞吉慶篇肖者吟君馬黃懿德吟善哉行樂土謡踏搖娘頌禱詞慢歌唐公主丹誠曲明光曲吉祥師聖明時微言際嘉平善政歌長命詞窈窕娘湛露四賢吟賀聖朝英流行堅固子月圓緩歌至純詞美封君少年行四天生吟宛轉詞鐵驪木槵珠好合曲童阜天馬吟大龍馬吟始條理追風赭馬回波詞長豫平調遊子吟平調曲髙士吟哉生明髙哉行三章圓音欄杆思哉行法座引接引詞化導詞七寶鞍短歌夕照歸國謡僧寶吟婆羅門引三部落五部落番部合奏樂章三十一章大合曲染絲曲公莫雅政詞鳯凰鳴乘驛使置西鰈曲政治詞千秋詞鴻鵠詞慶君侯慶夫人羡江南救度詞大番曲遊逸詞興盛詞艷冶曲慶聖師白鹿詞合歡曲白駝歌流鶯曲君侯詞夫人詞賢士詞舞詞鼗鼓曲調和曲臣等謹按笳吹樂章六十七章番部合奏樂章三十一章皆乾隆七年定於皇帝筵宴進果進酒進饌清樂止慶隆舞畢後奏之如恭遇盛京大宴凱旋賜宴並擇奏數闋考鄭樵所載九部樂當時第演習其聲無與服教畏神之盛也我朝中外一家化隆道洽逺方藩服之樂登奏殿廷兹謹備列笳吹諸樂章以方周禮鞮鞻氏之職掌焉古稀祝嘏樂章臣等謹案乾隆四十五年皇上七旬萬壽藏僧班禪額爾德呢恭獻此詞聖祉延洪逺方忭祝聲教之廣福祚之隆於斯並可仰見云御製新樂府七德舞法曲二王後海漫漫立部伎華原磬上陽白髮人胡旋女新豐折臂翁太行路司天臺捕蝗昆明春城鹽州道州民馴犀五絃彈蠻子朝驃國樂縛戎人驪宫髙百鍊鏡青石兩朱閣西涼伎八駿圖澗底松牡丹芳紅線毯杜陵叟繚綾賣炭翁母别子陰山道時世裝李夫人陵園妾鹽商婦杏為梁井底引銀瓶官牛紫亳筆隋隄栁草茫茫古冡狐黑潭龍天可度秦吉了鴉九剱采詩官臣等謹按御製新樂府五十章皆用白居易原題恭讀御製序云以古喻今以今方古我國家受命開基祖功宗德俾子孫知創業之艱謹神器之守至哉聖訓所謂不因文而作者與雖未宣諸樂部命被管絃而義叶人心律符天矩詢足藻金石而絣萬祀已遺聲臣等謹按鄭樵遺聲一門謂為逸詩之流蓋以喻篇章之未被管絃者顧僅目為雅言幽思初無與於功德之隆也我朝文煥功巍隆古莫並一時臣下詠歌盛業無非導揚紀實之文登之簡編足以凌轢今古兹之所載謹從皇清文頴幸魯盛典平定兩金川方略諸書內録入皆有關政典之篇若泛常擬作未經奏進入選者不敢概行列載云皇雅涇邱關隴南紀巨浸臣等謹按右皇雅四篇康熙二十年臣葉方藹上涇邱十二章受降也關隴十二章平隴右也南紀十一章平閩也巨浸十一章平海寇也鐃歌鼓吹曲聖皇出遼水奠安隴右豫章翻掃七閩海波平平五羊桂水深殱渠魁洞庭湖收成都克黔陽定昆明文德舞臣等謹按右鐃歌鼓吹曲康熙二十年臣徐嘉炎上聖皇出皇帝受命也遼水奠平察哈爾之亂也安隴右平王輔臣也豫章翻定江西賊也掃七閩平耿精忠也海波平驅海冦鄭錦也平五羊討尚之信也桂水深定廣西亂也殱渠魁吳三桂伏天誅逆黨漸自解散也洞庭湖平湖南郡縣也收成都平全蜀也克黔陽定貴州也定昆明誅吳世璠平全滇也文德舞告成功也凡一十四章平滇鐃歌聖同天出師初皇矣於鑠民畝昔夜郎萬方平於都審天心山石臣等謹按平滇鐃歌十章康熙二十年臣袁佑上東巡雅臣等謹按康熙二十三年駕幸闕里行釋奠禮臣下矢詩紀盛臣徐元文上此篇凡十三章親祠闕里雅臣等謹按右雅一篇康熙二十三年臣李振裕上述聖政雅臣等謹按右雅二篇東山十章南薰十章康熙二十三年臣顧汧上聖駕幸闕里樂府臣等謹按右樂府十二章康熙二十三年臣金居敬上大駕南巡樂府東南春嵗星謡江水清桃花然臣等謹按右樂府四章康熙二十八年臣趙執信上東南春道路無擾也嵗星謡蠲租稅也江水清吏知法亷也桃花然變民俗也聖駕南巡風謡十章臣等謹按右樂府十章康熙二十八年臣彭會淇上聖武雅惟天皇矣武成臣等謹按康熙三十五年三十六年大駕三臨沙漠厄魯特全國蕩平臣陳廷敬上雅三篇惟天十有一章言初臨沙漠安邊破敵武功盛也皇矣十有一章言直臨沙漠撫降人民武功再盛也武成十有一章言臨沙漠禽孽殱凶武功大成也平北雅臣等謹按右雅一篇康熙三十六年臣王士正上聖武神功蕩平漠北鐃歌鼓吹曲揚聖武神幾捷峙金湯踣猘獸天駟煌天行健穽孤雛伏天誅衢歌繁武功成光芝檢陳王會臣等謹按右鐃歌十二章康熙三十六年臣杜臻上聖武功成鐃歌鼓吹曲聖武昭行天討虔祭告命將帥嘉祥應三出塞廣招徠大無外凱歌還辭尊號臣等謹按右鐃歌十章康熙三十六年臣陳論上平北雅成命皇祐天監臣等謹按右雅三篇康熙三十六年臣宋駿業上成命九章天子自將出塞靖邊塵安萬民也皇祐九章天子再出塞料軍實決機宜也天監九章天子三出塞凶醜窮蹙服天誅集大功也聖駕北巡鐃歌撫萬國乘法駕紫壇髙六龍旋臣等謹案右鐃歌四章康熙三十六年臣沈涵上撫萬國大威北指厄魯特逺遁也乘法駕大駕巡邊喀爾喀等懇切輸誠也紫壇髙德合天人甘霖屢沛也六龍旋還宫齋祓親詣北郊行禮也大駕親平沙漠還京凱歌皇矣有山崔嵬從軍樂絶大漠二儀樂雄狐歌凱旋臣等謹按右凱歌七篇康熙三十六年臣薑宸英上皇矣頌宸斷也有山崔嵬述貞符也從軍樂恤將士也絶大漠頌神武也二儀樂好生也雄狐美諸將能稟神算成大功也歌凱旋樂冦平大駕早還也聖武逺揚青海平定鐃歌麋之窮賊母俘屈羣醜臣等謹按右鐃歌三章雍正二年臣錢陳羣上頌平定青海之烈麋之窮言我師深入賊衆逃竄也賊母俘言渠魁被擒又獲賊母也屈羣醜言捷音奏聞詣學行禮也聖駕恭謁祖陵大禮慶成樂府聖大孝發鑾輅盛京樂謁三陵懷祖烈禮成宴羣蕃朝大狩閲永錫類六龍回臣等謹按右樂府十章乾隆八年皇上恭謁祖陵禮成臣沈德潛上帝鑒臣等謹按右樂府十章乾隆八年皇上謁陵禮成時臣萬承蒼上平定金川雅有繹戎車繁雲鸞鑣臣等謹按乾隆十四年平定金川臣梁詩正上雅四篇有繹五章美出師也戎車四章翦二豎也繁雲五章番酋降也鸞鑣五章告成功也聖武逺揚雅臣等謹按右雅一篇乾隆十四年平定金川臣夢麟上平定兩金川雅苞蘖寅威周阹凱懌臣等謹按右雅四篇乾隆四十二年臣程景伊上苞蘖十章儹拉肇釁按旅徂征遂平之也寅威七章索諾木納我叛人守險拒命簡帥濟師審戎機以摧堅鋭也周阹十章師武臣力克承睿策悉俘羣醜武功成也凱懌十章聖武既昭行慶秩典申無疆也皇朝通志卷六十二
