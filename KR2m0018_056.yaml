body:
  text: 欽定四庫全書皇朝通志卷五十六器服略一臣等謹按聖人南面而治天下器服為典禮攸關王政之大者也洪惟我國家創制顯庸列聖相承隨時損益等威以辨物采以彰皇上憲古宜今欽定皇朝禮器圗式御製序文有云籩豆簠簋所以事神明也前代以碗盤充數朕則依古改之至於衣冠乃一代昭度夏收殷冔本不相襲朕則依我朝之舊而不敢改焉至矣哉聖訓煌煌敬天尊祖折𠂻盡善洵足為億萬祀之法守矣今纂皇朝通志恭依皇朝禮器圖式大清會典撮舉大要輯器服略六卷仰見聖天子制作之精心所以斟酌乎百王而垂型于奕世者迥非前代可及而我國家文物典章之盛亦可於是焉觀其備矣祭器臣等謹按祀國之大事也故周官戴記所載祭器特詳鄭樵作通志謂祭器出于禮圖於器服略中首列尊彛爵觶之制亦以重祀事也本朝舊制圜丘用蒼玉爵乾隆十三年欽定祭器皇天上帝列聖配位俱用匏爵下逮羣祀美報並崇一物一名悉經睿斷令遵皇朝禮器圖式以類敘次並詳其規模形製凡器之為玉為金為陶為木以至色有互異用有不同皆敬謹備識其一器疊見者則不復贅列以歸簡約云璧天壇正位用蒼璧圜徑六寸一分好徑四分通厚七分有竒祈榖壇正位同壇正位天朝日壇用赤璧圜徑四寸六分好圜徑四分通厚五分夕月壇正位用白璧圜徑三寸六分好方徑二分有竒通厚三分有竒琮地壇正位用黃琮方徑四寸有竒中厚七分邉厚二分微作剡首下正方一角有縱理如山形亦以象地圭太社圭色白有黃彩以象土德太稷圭色青取發生之義俱方徑三寸厚三分左右出剡首厚一分旁厚二分有竒邸厚三分有竒爵天壇正位用匏爵刳椰實之半不雕刻取尚質之義髙一寸八分深一寸三分口徑三寸七分金裏承以坫檀香為之其下岐出為三足象爵形髙二寸九寸列聖配位天壇從位陶爵用青色瓷通髙四寸六分深二寸四分兩柱髙七分二足相距各二寸八分髙二寸腹為雷紋叨餮形祈榖壇正位用匏爵同壇正位天配位同壇正位天地壇正位用匏爵同壇正位天配位同壇正位天地壇從位陶爵用黃色瓷形制大小花紋同天壇從位社稷壇正位玉爵通髙三寸四分深八分兩柱髙一寸腹為藻紋三足相距各二寸六分髙一寸四分正位陶爵同壇從位地配位陶爵同壇從位地朝日壇陶爵用紅色瓷形制大小花紋同天壇從位夕月壇正位陶爵用月白色瓷形制大小花紋同天壇從位配位陶爵同位正先農壇陶爵同壇從位地先蠶壇陶爵同壇從位地天神壇陶爵用白色瓷形制大小花紋同天壇從位地祇壇陶爵同神壇天太嵗壇正位陶爵同神壇天兩廡陶爵同神壇天太廟正殿用玉爵通髙五寸三分深二寸四分兩柱髙九分腹為藻紋三足相距各一寸六分髙二寸一分太廟後殿同正殿太廟東廡陶爵用白色瓷通髙四寸二分深二寸二分兩柱髙六分三足相距各一寸六分髙一寸八分花紋同壇從位天西廡同廡東奉先殿用金爵通髙三寸五分深一寸四分柱髙一寸一分為芝形腹為星紋三足相距各一寸髙一寸六分文廟正位銅爵範銅為之通髙四寸六分深二寸三分兩柱髙七分三足相距各一寸五分髙二寸形制花紋同壇從位天配位同位正十二哲同位正兩廡同位正崇聖祠正位同正位文廟配位同正位文廟兩廡同正位文廟傳心殿正位同正位文廟配位同正位文廟帝王廟正位同正位文廟兩廡同正位文廟先醫廟正位同正位文廟配位同正位文廟兩廡同正位文廟關帝廟前殿同正位文廟後殿同正位文廟都城隍廟同正位文廟內城隍廟同正位文廟永祐廟同正位文廟天下第一泉龍王廟同正位文廟昭靈沛澤龍王廟同正位文廟盞天壇從位盞用青色瓷通髙一寸九分深一寸五分口徑三寸四分足徑一寸五分純素地壇從位盞用黃色瓷通高二寸深一寸五分口徑三寸五分足徑一寸八分朝日壇盞用紅色瓷通髙一寸八分深一寸五分口徑三寸五分底徑一寸四分夕月壇正位盞用月白色瓷通高一寸八分深一寸五分口徑三寸五分底徑一寸二分足高二分配位同位正先農壇盞用白色瓷通髙一寸八分深一寸五分口徑三寸五分底徑一寸二分先蠶壇同農壇先太嵗壇正位盞用白色瓷形制大小同從位天壇兩廡同位正登天壇正位登用青色瓷通髙六寸一分深二寸一分口徑五寸校圍六寸六分足徑四寸五分口為回紋中為雷紋柱為叨餮足為垂雲紋蓋高一寸八分徑四寸五分頂高四分上為星紋中為垂雲紋口亦為回紋配位同正位天壇從位同正位祈榖壇正位同壇正位天配位登用青色瓷通髙五寸三分深一寸九分口徑四寸五分校圍六寸足徑四寸二分蓋髙一寸七分徑四寸形制花紋同位天壇正地壇正位登用黃色瓷形制大小花紋同天壇正位配位同位正地壇從位同位正社稷壇正位同壇正位地配位同壇正位地朝日壇登用紅色瓷形制大小花紋同天壇正位夕月壇正位登用月白色瓷通髙五寸三分深一寸九分口徑四寸五分校圍六寸底徑四寸二分蓋髙一寸七分徑四寸頂髙三分形制花紋同位天壇正配位同位正先農壇同壇正位地先蠶壇同壇正位地太嵗壇正位登用白色瓷形制大小花紋同天壇正位兩廡同位正太廟正殿登用黃色瓷上口為回紋腹及校足皆為蟠龍紋波紋頂上為垂雲紋中為蟠龍紋口為回紋大小同壇正位天太廟後殿同正殿奉先殿同廟正殿太文廟正位登範銅為之通髙六寸深二寸口徑四寸九分校圍六寸九分足徑四寸七分蓋髙一寸六分徑四寸六分頂高三分形制花紋同位天壇正帝王廟正位同正位文廟關帝廟前殿同正位文廟鉶天壇從位東西二壇鉶用青色瓷髙三寸九分深三寸六分口徑五寸底徑三寸三分三足髙一寸三分