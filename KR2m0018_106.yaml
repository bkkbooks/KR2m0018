body:
  text: 校讐略二武英殿校刋十三經注疏考證易經至禮記共一百六十七條易經周易經傳原目韓康伯注音義王輔嗣止注大經句監本大訛六先儒以上下經二篇為大經據毛居正六經正誤改乾卦彖注天也者形之名也健也者用形者也郭京謂健也者健字應作乾疏云天是定體之名乾是用體之稱體即形也足明用形是乾健字以音近而訛坤卦初六履霜堅氷隂始凝也郭京曰隂始凝也上誤增堅氷二字履霜與堅氷時侯頗異不合相連結義按魏志許藝引易傳亦作初六履霜無堅氷二字屯卦君子以經綸疏綸謂繩綸句監本繩訛綱又綸謂緯也句緯亦訛綱並據李鼎祚集解改蒙卦六四困蒙吝疏此釋六四爻辭也按疏例從無於本節之下自言此釋某文者此七字疑衍需卦卦辭疏此需卦繇辭也監本繇訛係據毛氏本改此六字疑亦衍文他卦無此例九二注履健居中中訛實據毛氏本改訟卦彖注不閉其源使訟不至郭京謂使訟不至不字當作得若閉其訟源訟則不至不閉訟源則訟得至不至與不閉義弗合訟卦象注物有其分監本分字下衍起契之過四字據毛氏本刪師卦六四疏漢書韓信云兵法欲右背山陵前左山澤按此非韓信語云字上當有傳字履卦六三眇能視注志存於王頑之甚也按毛居正六經正誤志存於五作王字誤正義曰以六三之微欲行九五之事注志存於五也建安余氏本亦作五大有彖疏六五應九二九二在乾體故云應乎天也監本作六五應乾九二亦與五為體誤據毛氏本改大有象注遏惡揚善成物之美順夫天德休物之命四句監本作遏惡揚善成物之性順天休命順物之命按順夫天德解順天二字休物之命解休命二字於文義為合據毛氏本改觀卦六三象注處進退之時三句監本以王注作孔疏誤坎卦彖注習乎重險也監本訛作習重乎險也據毛氏本改咸卦九三疏文監本訛脫據毛氏本補萃卦六三注四亦失位不正不正相聚相聚不正患所生也郭京謂古本無相聚不正四字艮卦九三艮其限注止加其身中體而分郭京云身當作限六四艮其身注云中上稱身九三施止於分體故謂之限則身字當為限字之訛漸卦彖辭漸之進也注之於進也舊説疑之字為衍按卦名以進為義者三晉也升也漸也而漸獨以漸進為義故言漸之進以别於晉之進升之進也郭雍云傳言漸之進如女之歸則吉以女歸有漸也與王注意合既濟卦彖辭既濟亨小者亨也郭京謂亨字下脫小字按亨小之義陸氏銓之説極當故折中從之繫辭俯以察於地理疏彖謂卦下之辭總説乎一卦之象也監本脫卦下之辭總五字今校補聖人之情見乎辭注文監本訛脫今校補能研諸侯之慮注諸侯物主有為者也按注説未免附會牽強當從朱子本義以侯之二字作衍文序卦故受之以履吳澄纂言云此下疑有履者禮也四字今韓注有之而王弼略例引此四字當是後人誤以正文為注耳物不可以終動動必止之今本無動必二字據監本補雜卦原目下監本有注雜卦者雜糅衆卦錯綜其義或以同相類或以異相明也二十二字古注本無蓋因疏文而妄添之也今從刪書經舜典在璿璣玉衡以齊七政傳王者正天文之器句監本王訛玉據毛氏本改又孔疏內太史丞錢樂鑄銅作渾天儀陳氏師凱云錢樂本名樂之孔疏脫之字肆類於上帝音義王注云上帝天也馬云上帝太乙神在紫微宫天之最尊者監本誤以此二十四字為孔傳今校改臯陶謨能哲而惠疏馬融云禹為父隱故不言鯀也按馬融説史記注引之作鄭康成語禹貢恆衛既從疏衛水出常山靈夀縣東北入滹沱按地理志原文入滹沱之上當有東字言衛水出靈夀縣之東北其下流則入滹沱也疏脫一東字雷夏既澤疏在濟隂城陽縣西北按城陽當作成陽各本俱誤此成陽屬濟隂堯冢所在與城陽國近東海者不同浮於濟漯逹于河疏漯水出東郡東武陽縣至樂安千乘縣入海疏引地理志當云東北至千乘入海至字上脫東北二字又按樂安二字亦非原文千乘縣前漢為千乘郡治後漢和帝時始改郡名樂安也岷嶓既藝疏地理志蜀郡有湔道按湔字下脫氐字漢湔氐道今四川松潘衛是也織皮崑崙析支渠搜傳云有此四國疏云四國崑崙也析支也渠也搜也顔師古曰崑崙析支渠搜三國名也傳疏並作四國誤底柱析城至于王屋疏引地理志云析城在河東濩澤縣西按漢志原文作西南此脫南字甘誓王曰嗟六事之人傳各有軍事監本事訛士據疏校改胤征序傳羲氏和氏二段監本訛刋此傳於後標目下今校改惟仲康肇位四海疏羿滅夏后相句按羿當作浞滅相者浞非羿也各本俱誤仲虺之誥成湯放桀於南巢疏桀奔南巢一段監本誤列於後奉若天命注下又此篇疏文多不依經傳之次今校改太甲上自周有終傳周忠信也句舊説自由也由忠信之道則有終王氏柏曰周當作君金氏履洋謂古文君字與周字相似故誤吳氏經説亦云作君牧誓序疏監本誤列於後標目之下今校改洪範無有作好傳言無有亂為私好惡句監本為訛無今校改四曰攸好德疏好惡者不知惡之為惡謂惡是善二句監本脫謂惡二字今校補康誥惟三月哉生魄疏太保以戊申至七日庚戌句按召誥云越三日庚戌自戊申至庚戌為三日也此作七日誤各本並同或疑召誥疏言庚戌是七日然此文不應爾王曰嗚呼小子封疏所以可畏者以其輔誠故也二句監本脫所以可畏四字今校補洛誥序使來告卜傳疏監本誤列於後標目之下今校改多士序殷遺多士皆非在官監本作皆非民事誤據毛氏本校改君奭有若散宜生句下監本脫音義一百十八字據毛氏本補多方慎厥麗乃勸厥民刑用勸疏作天下民主句下監本脫湯既為民主五字今校補今爾奔走臣我監五祀傳監為成周之三監按此指洛邑之治殷民者非謂武庚時事也即孔疏並不解三監字義則知三字為衍文康王之誥賔稱奉圭兼幣疏圭是致馬之物致馬舊本作文馬據覲禮賈疏皆以幣帛致之當作致馬為是據監本改又引覲禮諸侯享天子馬卓上九馬隨之按覲禮作匹馬卓上九馬隨之則馬卓上當有匹字君牙序疏穆王命其臣一段監本誤列於經文涉於春氷之下今校改文侯之命序疏監本誤列於後標目之下今校改詩經國風卷耳篇我姑酌彼兕觥箋飲酒禮自立司正之後句禮字上各本並脫飲酒二字按立司正見鄉飲酒禮據蜀本石經補桃夭篇序箋疏宗子雖七十無無主婦諸本並脫一無字據禮記曽子問補采蘋篇于以采藻箋芼之以蘋藻句監本作芼用蘋藻按昏義文本作芼之以蘋藻據石經校改摽梅篇序疏然則男自二十以至二十九句監本脫二十以至四字據毛氏本補終風篇惠然肯來箋惠順也監本脫此三字據石經補雄雉篇百爾君子箋君或有所留或有所遣二句監本脫或有所遣四字據石經補采葛篇彼采蕭兮疏釋草云蕭荻也按荻字當作萩説文云萩蕭也襄公十八年左傳秦周伐雍門之萩是也爾雅釋草誤作荻故疏仍其訛權輿篇于嗟乎不承權輿句爾雅引此文作胡不承權輿大雅大明篇篤生武王箋則我皇妣太薑之姪句監本妣訛姒據國語校改周頌清廟篇序箋成洛邑居攝五年時李氏樗謂周公成洛在七年非五年此本孔氏傳據洛誥誕保文武受命惟七年之説也九峯蔡氏辨之謂周公留後洛邑七年而薨者極是箋云五年者據伏生書傳及明堂位之文書傳當為可據仍從箋説作五年為長般篇允猶翕河疏齊桓公塞為一者不知所出何書按春秋保乾圖云移河為界在齊吕填閼八流以自廣當是本此周禮天官以為民極句注庶民於之取中句下監本有按尚書洪範云皇建其有極十一字蓋因上文誤衍今從刪太宰以九職任萬民疏晉衛之男女皆是句下云故引晉惠以釋之也則晉衛當作晉惠大朝覲會同疏但春夏受享秋冬一受之於廟按上文云諸侯會同皆依四時常朝春夏受贄於朝受享幣者於廟秋冬一受之於朝此止云春夏受享應有闕文小宰以法掌祭祀朝覲會同賔客之戒具疏監本錯簡在下節今校改獸人凡祭祀喪紀賔客共其死獸生獸疏監本錯簡在下節今校改醫師嵗終則稽其醫事以制其食疏本草木之寒溫量疾病之淺深監本脫本草木之四字又脫量字據漢書補凌人掌氷疏火中而寒暑退此其極也能無退乎監本訛此其極也二句於注下今校改醯人注疏監本分經文為二段而注疏則於上段內連續不分今合經文為一節而移注疏於下方大府凡邦國之貢疏注釋曰一段監本混入下節今校改外內命夫命婦之命屨疏仍有韋辨白屨冠辨黑屨句以服屨之倫次之則仍有下當有爵辨纁屨四字地官大司徒以土會之法疏􅋯脙瘠也監本脙訛脈據爾雅校改日至之景疏注是時周公居攝五年句監本訛在上文惟三月丙午朏之下經注錯雜今校改以荒政十有二聚萬民疏司樂凶荒别文句監本樂訛農周官無司農而所引大司樂文今校改小司徒凡民訟以地比正之疏各本並錯在下節今校改鄉大夫正嵗令羣吏考法于司徒以退各憲之於其所治按各本所治下俱有之國二字蓋由石經誤衍一之字後人遂割下節國大詢于衆庶之國字以從之今見石經之國二字刓缺監本直去此二字而下節之首未增國字但作大詢于衆庶蓋誤調人鳥獸亦如之疏監本於賞其價直句下有和之使辟於此不得就而仇之十二字乃誤衍下節注文今從刪弗辟則與之瑞節而以執之疏剡圭以和難句按典瑞作剡圭以除慝當係賈氏誤引穀圭之文春官大宗伯以賔射之禮疏王制有王大子是為世子時共在學者也按大字下應有王子羣后之大子卿大夫元士之適子十五字文義方合此有脫落大司樂以樂舞教國子注文始舜之韶舞名監本脫文始二字據漢書注補樂師凡國之小事疏若大次二者之樂則天地及宗廟大司樂令之也監本誤則天地及宗廟六字於元冕所祭之下今校改大胥掌學士之版疏以宗廟言之謂重釀之酒祭宗廟而用之監本誤以宗廟言之五字於相飲之法下今校改大史正嵗年以敘事疏正月一日得雨水中監本雨水訛啓蟄按韗人注云啓蟄孟春之中也古法以啓蟄為正月中氣而此疏上文則已云正月立春節雨水中不應互異夏官司士孤卿特揖疏王揖之皆逡遁者約鄉黨而知按鄉黨無此文考大射禮公降一等揖賔賔辟注云逡遁不敢當盛則鄉黨當是大射之訛秋官萍氏下士二人音義監本脫郭注云甲蟲大如虎豆緑色十一字據陸德明經典釋文補掌客賔客有喪惟芻稍之受注不受饗食饗食加也按此注二句并疏中不受饗食起至不受饗食共五十四字俱屬下節遭主國之喪不受饗食注此係錯簡冬官輪人望其輻疏鄭司農云揱讀為紛容揱參之揱此蓋有文今檢未得按此出上林賦賈氏偶忘之耳匠人為溝洫疏古者人耕皆畎上種穀按畝髙畎低畝以種穀畎以通水此畎字當作畝賈氏弗檢偶訛耳儀禮士冠禮主人元冠朝服疏證此元冠朝服而筮者是諸侯之士監本冠作冕按士服至爵辨而止無冕也今校改筮人執策疏引少牢大夫禮文亦云三人占二句按少牢禮無此文朱子蓋嘗疑之贊者盥於洗西升疏贊者盥于洗西無正文按經文明言之乃云無正文何也蓋誤冠者升筵坐疏聘禮注云糟醴不卒故也監本卒作啐按卒謂不卒爵也經言啐醴則非不啐明矣再醮兩豆疏云螔蝓醢者蚹螺螔蝓監本脫蚹螺螔蝓四字據爾雅補繼世以立諸侯象賢也按朱子云此下三節於冠義無當疑錯簡也疏義亦非是士昏禮主人迎賔於廟門外疏引有司徹注云拂者外拂之也按今有司徹注無此文主人爵辨疏天子諸侯為尊則尊矣不須攝盛監本作尊則衮矣按諸侯惟上公則服衮侯伯以下不得也賈氏常有尊則尊矣之語今從之凡行事必用昏聽注壻悉計反從士從胥俗作壻女之夫按此十四字不類康成語且東漢未有反切之法且此節記無壻字康成何緣以注蓋後人攙入者耳對曰某之子憃愚疏賔告之辭句下監本有下經致命四字按此四字無著蓋以上有下經致命之文而誤壻授綏姆辭曰未教不足與為禮也注姆教人者經文及注共十九字監本脫落據石經及楊復儀禮圖本補士相見禮擯者對曰注還贄者請使受之句下監本有今按某也蓋主人之名九字本朱子儀禮經傳通解中語不應攙入注疏今從刪鄉飲酒禮坐祭遂飲卒觶疏主人辭賔降賔辭監本脫賔辭二字據通解補坐祭坐飲不拜既爵疏衆賔之長也五字監本錯在故上賔介之上今校改尊者降席席東南面句監本脫一席字據石經補鄉射禮賔卒洗揖讓如初升疏釋曰言如初則亦一揖一讓也十二字監本訛列於下節之下今校改皆當其物句疏釋曰皆左足履物者以下二十七字監本訛列於下節之下今校改執觶者受觶注執觶以下共二十字又疏內此經曰執觶者以下共三十字監本誤列於卒受者以虛觶降奠於篚節下按此數句於彼經無當今校改士鹿中翿旌以獲及注謂小國之州長也以下二十九字監本皆脫其經文石經及敖繼公本並有之注則依朱子通解及楊復儀禮圖本補燕禮設洗篚於阼階東南當東霤按敖繼公謂諸篇設洗無連言篚者下别云篚在洗西則不可以東霤為節此係衍文享於門外東方句上按石經及楊復本敖繼公本俱有其牲狗也四字此蓋有脫文大射儀工人士與梓人升自北階疏則鄉射記長與距隨是也鄉射記長四字監本作上文橫三字按上文既無其文而橫字與下三字亦不屬今據鄉射記校改蓋謂長其縱距隨其橫也若與諸公卿大夫之耦不勝句按敖繼公云比耦時大夫有與士為耦者諸公卿無與士為耦者諸公卿三字誤聘禮夫人使下大夫韋辨歸禮句下監本有小注云今文歸作饋下及記同九字按此非鄭注又非釋文唯通解有此今從刪宗人授次句朱子云周禮幕人掌朝會共帷幕掌次掌張幕此作宗人誤公食大夫禮公降一等疏解經辭曰一段監本誤列于賔西階東北面答拜之下今校改先者反之由門入升自西階監本析經文為二節以疏誤作注列於先者反之句下今依朱子通解訂正而合經文為一節喪服出妻之子為父後者句顧炎武謂此節經文疏以為傳中引傳而誤連之當别為一節今從之而疏則仍其舊傳曰嫁者其嫁於大夫者也疏女子子為祖父母傳不言不敢降其祖監本於為祖父下重衍傳亦不敢言降其祖父九字今從刪傳曰何以大功也尊同也疏此鄭疊傳文句監本於此字下有謂祖禰但不得祖禰先君也此謂十四字蓋緣上文而誤衍今從刪夫之諸祖父母報疏夫之所為小功者妻服之降一等句下監本誤復上節疏文據續通解刪夫之所為兄弟服妻降一等疏釋曰妻從夫服其族親一段監本誤列下節經文之下今校改士喪禮為銘各以其物注今文銘皆為名末為斾也監本脫皆為名末四字據續通解校補既夕記有彌節焉亦張可也監本張可訛可張據石經校改士虞禮哀薦祫事注今文曰合事句監本合作古按祫之為言合也作合字文義方協合與古以形近而訛哭止告事畢賔出此七字監本全脫據石經補特牲饋食禮衆賔答再拜句敖繼公云衆賔答一拜作再拜誤按鄊飲鄊射禮主人三拜衆賔衆賔皆答一拜祝命挼祭注監本脫今文改挼皆為綏古文此皆為挼祭也十五字士虞禮尸取奠節疏引此注有之今據補舉觶者祭卒觶拜長皆答拜監本脫此十一字據石經補少牢饋食禮以授尸坐取簞興監本脫此七字據石經本補主人出立於阼階上西面疏釋曰自此盡廟門以下數句監本誤列在下文祝先尸從節之下今校改有司徹酌獻侑侑拜受三獻北面答拜監本於此下重衍受爵酌獻侑侑拜受三獻北靣答拜十四字石經及舊本無之今從刪兄弟之後生者疏兄弟之後生者以下數句監本誤列於上文二人洗觶疏末今校改乃托於魚臘爼注今文托為揲句今文二字續通解作古文禮記曲禮國君下齊牛式宗廟疏引榖梁傳云曹公子首僂同時聘齊按曹公子首僂句上脫季孫行父秃晉卻克眇衛孫良夫跛十四字孔疏引書斷無割裂至此當係刋本脫誤涖牲曰盟疏春秋左氏云周禮有司盟之官按此係左傳説之辭非傳文也左氏下當有説字檀弓夫子制于中都疏周禮大宰職云諸侯立三卿五大夫也按大宰職云設其參傅其伍注云參謂卿三人伍謂大夫伍人此當作大宰職注刋本誤脫注字耳小斂之奠以下按此自為一章舊本誤接仲梁子下讀賵以下此亦自為一章刋本接孟獻子章而誤録其疏於下賔客至無所館此亦自為一章刋本因無疏誤接上章耳陳乾昔寢疾疏晉趙孟孝伯並將死其語偷按此引晉趙文子及魯孟孝伯兩事也孝伯上脫魯孟二字王制至於南嶽疏自魏武帝以來始徙南嶽之神於廬江霍山按徙衡祀於霍自漢武帝始此作魏武帝誤六禮冠昏喪祭鄊相見此下自為一節舊本誤列於諸侯之大夫不世爵祿下而以上節疏附篇末今校改月令以太牢祠于髙禖注娀簡吞之而生契按簡字下當有狄字其祀行注行在廟內外之西為軷壤厚二寸廣五尺按壤當作壇屬上句讀周禮大馭賈疏引此句作為軷壇是也壇壤以形近而訛曾子問其虞也先重而後輕也疏舊本誤與下章宗子雖七十經文相連而疏一段誤脫在下章之末今校改又何反於初疏舊本誤在下章今校改成婦之義也注疏舊本注誤與經文下二章接連疏尤附麗失次今並校改諸侯旅見天子以下舊本自此至當祭而日食太廟火章孔子答語未全即截為十八卷其十九卷首簡即係前章答語之半文義割裂今斷自此章以下為十九卷祝畢獻而已注疏舊本注與下章經文相接而疏亦脫誤今校改郊特牲社所以神地之道也疏引尚書無逸篇大社惟松數語按此係尚書逸篇見後漢志注無字衍文天子適四方先柴二句舊本與前文祭則受福句相接而前疏誤刋此節之下今校改玉藻侍坐則必退席音義黨鄉之細也句下釋文二十八字監本誤作鄭注今校改少儀幼則曰能負薪未能負薪注下應接疏二假下節執玉執龜策不趨又自為一節不相連也樂記咸池備矣疏熊氏引五行鈎命決云伏羲樂為立基神農樂為下謀祝融樂為祝績按鈎命決孝經緯也周禮大司樂賈疏亦引此文作孝經緯此作五行誤也又疏引樂緯帝嚳曰六英顓頊曰五莖顓頊宜敘帝嚳之前文亦倒置今夫新樂進俯退俯以下此卷分卷未合不應截子夏答魏文侯語強割為二應從前篇魏文侯問于子夏二節為此節之首雜記有三年之練冠則以大功之麻易之疏先師解此凡有三義引聖證論范宣子以下云云按三義即范宣子及賀瑒庾蔚之三説而孔氏斷從庾説者也聖證論是魏時王肅所撰范宣子即東晉范宣在肅之後何緣得引之觀後文為妻父母在不杖不稽顙疏引禮論范宣子申語知聖證論當係禮論之訛孔子曰伯母叔母注按此節注下無疏舊本誤以上章國禁災及童子哀不偯二節之疏接於注下今移置上章泄栁之徒為之也疏按此疏誤在下章注下今校改君子上不僣上下不逼下疏舊本誤列此疏二段于下章婦人非三年之喪下今校改中庸子曰好學近乎知注疏以此下另為一章朱子云子曰二字衍家語載此章於成功一也之下有公曰子之言美矣至矣寡人實固不足以成之也故其下復以子曰起詞今無此問而猶有子曰二字當為衍文惟天之命注易曰君子以慎德積小以成髙大舊本慎作順今改正以成髙大易無成字係衍文投壺司射庭長及冠士立者以下王氏謂司射至主黨二十四字與上文魯令弟子若是者浮相屬陳澔從其説移此一節於鼓字之上大學楚書曰疏按疏于此書兩引王孫圉及昭奚恤事止以鄭注謂楚書是楚昭王時書未嘗指定是楚語也但疏引楚語僅列觀射父脫楚史倚相一段又引劉向新序司馬子反訛作子發燕義升成拜疏為拜故下賔未拜也下不敢輒拜禮殺也按儀禮注原文賔作實下不輒拜句無敢字皇朝通志卷一百六
