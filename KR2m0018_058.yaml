以上武官御前侍衛各省巡撫皆服之皇太子雨裳色用紅前為完幅氊及羽紗油紬惟其時腰為横幅用石青布裳制下逹同而衣二品官雨衣色用青制如常服袍而袖端平或如常服褂而加領長與坐齊皆前施掩襠氊及羽紗油紬惟其時二品以下文武官下至軍民皆服之二品官雨裳色用青前為完幅氊及羽紗油紬惟其時腰為横幅用石青布黨制下逹同雨衣四品官雨冠色用紅前加縁二寸五分後五寸青色氊及羽紗油紬惟其時藍布帶四品至六品文武官皆用之七品官雨冠色用青前加縁二寸五分後五寸紅色氊及羽紗油紬惟其時藍布帶七品至九品文武官凡有頂帶人員以上皆用之軍民雨冠色用青氊及羽紗油紬惟其時藍布帶行營冠服附皇帝行冠冬以黒狐秋以黑羊皮或以青絨如常服冠之制夏織藤絲或竹絲為之紅紗裏縁如其色上綴雨纓頂及梁皆黄色前綴珠一皇帝行褂色用石青長與坐齊袖長及肘棉袷紗裘惟其時皇帝行袍制如常服袍長減十之一右裾短一尺色及花文隨所御棉袷紗裘惟其時皇帝行帶色用明黄左右佩繫以紅香牛皮為之飾金花文鋄銀鐶各三佩帉以髙麗布視常服帶帉微濶而短中約以香牛皮束綴銀花文佩囊明黄圓縧飾珊瑚結削燧雜佩惟宜皇帝行裳色隨所用左右各一前平後中豐上下斂並屬横幅氊袷惟時冬用鹿皮或黒狐為表横幅則以石青布為之親王以下行冠冬如吉服冠之制氊貂各惟其時夏織玉草或藤絲為之上綴雨纓其制下逹庻官翎頂各從其所得用親王以下行褂色用石青長與坐齊袖長及肘棉袷紗裘惟時其制下逹庻官親王以下行袍制如常服袍長減十之一右裾短一尺色隨所用棉祫紗裘惟時其制下達庻官親王以下行帶佩帉素布視常服帶帉微濶而短版飾惟宜縧皆圓結其制下逹庻官帶色金黄石青各從其所得用親王以下行裳藍及諸色隨所用左右各一前平後中豐上下斂並屬横幅氊祫惟時冬以皮為表其制下逹庻官領侍衛大臣行褂色用明黄凡諸臣之曾服之賜黄褂者皆八旗副都統行褂正黄旗色用金黄正白旗正紅旗正藍旗各如旗色鑲黄旗鑲白旗鑲藍旗紅縁鑲紅旗白縁前鋒㕘領䕶軍㕘領火器營官皆服之豹尾班侍衛行褂色用明黄左右及肩前施雙帶以結之健鋭營前鋒㕘領行褂色用明黄藍縁健鋭營兵行褂色用藍明黄縁虎槍營總統總領行褂色用金黄領左右端青縁直下至前裾虎槍營槍長行褂色用紅領左右端青縁直下至前裾虎槍營兵行褂色用白領左右端青縁直下至前裾火器營兵行褂色用藍白縁皇朝通志卷五十八
