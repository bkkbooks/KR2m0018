body:
  text: 欽定四庫全書皇朝通志卷五十八器服畧三冠服臣等謹按禮之大者昭名分辨等威莫備乎冠服自虞廷觀象文明漸啟夏收殷哻損益不同所以成一代之制度而垂法守也我朝冠服之制夏凉冬燠各因其時而品節燦然觀瞻有秩葢列聖相承凖宜増定美矣備矣皇上慎守成憲治協垂裳萬國衣冠㑹歸有極洵乎放之四海而大同昭兹來許而弗替者也兹輯器服畧恭載皇帝冠服朝珠佩帶下至品官軍民無不備具各有等差并附以雨冠雨衣及行營冠服咸著于篇皆據皇朝禮器圗式以類叙次於以彰我國家服物采章之盛如御製序所云以綿國祚承天祐於鑠哉世徳作求永永無斁焉爾皇帝朝冠冬用薫貂黒狐惟其時上綴朱緯頂三層貫東珠各一皆承以金龍各四飾東珠如其數上銜大珍珠一夏織玉草或藤絲竹絲為之縁石青片金二層裏用紅片金或紅紗上綴朱緯前綴金佛飾東珠十五後綴舍林飾東珠七頂制同皇帝吉服冠冬用海龍薫貂紫貂惟其時上綴朱緯頂滿花金座上銜大珍珠一夏織玊草或藤絲竹絲爲之紅紗綢裏石青片金縁上綴朱緯頂制同皇帝常服冠冬夏皆紅絨結頂餘俱如吉服冠皇帝端罩以黒狐及紫貂為之明黄緞裏左右垂帶各二下廣而鋭色與裏同皇帝衮服色用石青棉祫紗裘惟其時繡五爪正面金龍四團兩肩前後各一其章左日右月前後萬夀篆文間以五色雲皇帝朝服色用明黄惟祀天用藍朝日用紅夕月用月白紗裘單袷惟其時披領及袖俱石青片金縁冬加海龍縁繡文兩肩前後正龍各一要惟行龍五袵正龍一襞積前後團龍各九裳正龍二行龍四披領行龍二袖端正龍各一列十二章日月星辰山龍華蟲黼黻在衣宗彞藻大粉米在裳間以五色雲下幅八寳平水十一月朔至上元披領及裳俱表以紫貂袖端薫貂繡文兩肩前後正龍各一襞積行龍六列十二章俱在衣間以五色雲皇帝龍袍色用明黄棉袷紗裘惟其時領袖俱石青片金縁繡文金龍九列十二章間以五色雲領前後正龍各一左右及交襟處行龍各一袖端正龍各一下幅八寳立水裾左右開皇帝常服褂色用石青花文隨所御棉祫紗裘惟其時皇帝常服袍色及花文隨所御裾左右開棉祫紗裘惟其時皇帝朝珠朝珠用東珠一百有八佛頭記念背雲大小墜雜飾各從其宜大典禮御之惟祀天以青金石為飾祀地珠用蜜珀朝日用珊瑚夕月用緑松石吉服朝珠珍寳隨所御縧皆明黄色皇帝朝帶色皆用明黄一用龍文金圓版四飾紅寳石或藍寳石及緑松石每具銜東珠五圍珍珠二十左右佩帉淺藍及白各一下廣而鋭中約鏤金圓結飾寳如版圍珠各三十佩囊文繡燧觽刀削結佩惟宜縧皆明黄色大典禮御之一用龍文金方版四其飾祀天用青金石祀地用黄玉朝日用珊瑚夕月用白玉每具銜東珠五佩帉及縧惟祀天用純青餘如圓版朝帶之制中約圓結如版飾銜東珠各四佩囊純石青左觽右削並從版色皇帝吉服帶色用明黄鏤金版四方圓惟便銜以珠玉雜寳各從其宜左右佩帉純白下直而齊中約金結如版飾餘俱如朝帶常服帶同皇太子朝冠謹遵圖式皇朝禮器登載冬用薰貂黒狐惟其時上綴朱緯頂金龍三層飾東珠十三上銜大東珠一夏織玉草或藤絲竹絲為之縁石青片金二層裏用紅片金或紅紗上綴朱緯前綴金佛飾東珠十三後綴舍林飾東珠六頂制同皇太子吉服冠子皇同冬用海龍薰貂紫貂惟其時上綴朱緯紅絨結頂夏織玉草或藤絲竹絲為之紅紗綢裏石青片金縁上綴朱緯頂制同皇太子端罩黒狐為之杏黄緞裏左右垂帶各二下廣而鋭色與裏同皇太子龍褂子皇同色用石青繡五爪正面金龍四團兩肩前後各一間以五色雲棉袷紗裘惟其時皇太子朝服色用杏黄紗裘單祫惟其時披領及袖俱石青片金縁冬加海龍縁繡文兩肩前後正龍各一要惟行龍五袵正龍一襞積前後團龍各七裳正龍二行龍四披領行龍二袖端正龍各一間以五色雲下幅八寳平水十一月朔至上元披領及裳俱表以紫貂袖端薰貂繡文兩肩前後正龍各一襞積行龍六間以五色雲皇太子龍袍色用杏黄棉袷紗裘惟其時領袖俱石青片金縁繡文金龍九間以五色雲領前後正龍各一左右及交襟處行龍各一袖端正龍各一下幅八寳立水裾左右開皇太子朝珠縧用明黄色珊瑚緑松石青金石隨所用珍寳雜飾惟宜皇太子朝帶色用明黄金圓版四飾青金石每具銜東珠五左右佩帉淺藍及白各一下廣而鋭結佩惟宜縧如帶色皇太子吉服帶色用明黄金版四方圓惟便銜以雜寳惟宜左右佩帉純白下直而齊餘如朝帶皇子朝冠親王同冬用薰貂青狐惟其時上綴朱緯其制下逹文武一品皆同後不具詳頂金龍二層飾東珠十上銜紅寳石夏織玉草或藤絲竹絲為之縁石青片金二層裏用紅片金或紅紗上綴朱緯前綴舍林飾東珠五後綴金花飾東珠四頂制同皇子端罩紫貂為之金黄緞裏左右垂帶各二下廣而鋭色與裏同皇子朝服色用金黄披領及袖俱石青片金縁冬加海龍縁繡文兩肩前後正龍各一要帷行龍四裳行龍八披領行龍二袖端正龍各一下幅八寳平水十一月朔至上元之制與皇太子同皇子蟒袍色用金黄片金縁繡文通九蟒裾左右開制逹宗室後不具詳皇子朝珠親王世子郡王同縧皆金黄色不得用東珠餘隨所用雜飾惟宜皇子朝帶親王同色用金黄金銜玉方版四每具飾東珠四中飾貓睛石一左右佩縧如帶色皇子吉服帶親王世子郡王同色用金黄版飾惟宜佩縧如帶色親王吉服冠世子郡王貝勒同冬用海龍薰貂紫貂惟其時夏織玉草或藤絲竹絲為之紅紗綢裏石青片金縁上綴朱緯其制下逹庻官皆同後不具詳頂用紅寳石曽賜紅絨結頂者亦得用之親王端罩下至貝子固倫額駙皆同青狐為之月白緞裏曽賜金黄色者亦得用之左右垂帶各二下廣而鋭色與裏同親王補服世子同色用石青繡五爪金龍四團前後正龍兩肩行龍親王朝服蟒袍世子郡王同藍及石青諸色隨所用曽賜金黄者亦得用之餘如袍皇子朝服蟒之制世子朝冠頂金龍二層飾東珠九上銜紅寳石夏朝冠前綴舍林飾東珠五後綴金花飾東珠四世子朝帶色用金黄金銜玉方版四每具飾東珠三左右佩縧如帶色凡宗室帶色皆如之覺羅用紅郡王朝冠頂金龍二層飾東珠八上銜紅寳石夏朝冠前綴舍林飾東珠四後綴金花飾東珠三郡王補服色用石青繡五爪行龍四團兩肩前後各一郡王朝帶色用金黄金銜玉方版四每具飾東珠二貓睛石一左右佩縧如帶色貝勒朝冠頂金龍二層飾東珠七上銜紅寳石夏朝冠前綴舍林飾東珠三後綴金花飾東珠二貝勒補服色用石青前後繡四爪正蟒各一團貝勒朝服下至輔國公和碩額駙皆同色不得用金黄餘隨所用披領及袖俱石青片金縁冬加海龍縁繡文兩肩前後正蟒各一要惟行蟒四裳行蟒八披領行蟒二袖端正蟒各一下幅八寳平水十一月朔至上元披領及裳俱表以紫貂袖端薰貂繡文兩肩前後正蟒各一襞積行蟒六間以五色雲貝勒蟒袍下至輔國公和碩額駙皆同色不得用金黄餘隨所用片金縁繡文通九蟒皆四爪貝勒朝珠下至輔國公和碩額駙皆同縧用石青色餘如親王朝珠之制貝勒朝帶色用金黄金銜玉方版四每具飾東珠二佩縧皆石青色貝勒吉服帶下至宗室將軍同色用金黄版飾惟宜縧皆石青色貝子朝冠固倫額駙同頂金龍二層飾東珠六上銜紅寳石戴三眼孔雀翎孔雀花翎有三眼雙眼單眼之分等威辨著凡遇思實者均准戴用夏朝冠前綴舍林飾東珠二後綴金花飾東珠一貝子吉服冠頂用紅寳石戴三眼孔雀翎貝子補服固倫額駙同色用石青前後繡四爪行蟒各一團貝子朝帶色用金黄金銜玉方版四每具飾東珠一固倫額駙吉服冠頂用珊瑚戴三眼孔雀翎乾隆五十二年遵布騰㫖照固倫額駙色巴爾珠爾之例戴紅寳石帽頂固倫額駙朝帶色用石青或藍金銜玉圓版四毎具飾東珠一左右佩縧皆石青色固倫額駙吉服帶和碩額駙同色用石青或藍版飾及佩惟宜鎮國公朝冠和碩額駙同頂金龍二層飾東珠五上銜紅寳石戴雙眼孔雀翎夏朝冠前綴金林飾東珠一後綴金花飾緑松石一鎮國公吉服冠輔國公同入八分公頂用紅寳石未入八分公用珊瑚俱戴雙眼孔雀翎鎮國公端罩輔國公和碩額駙同紫貂為之月白緞裏左右垂帶各二下廣而鋭色與裏同鎮國公補服輔國公和碩額駙同色用石青前後繡四爪正蟒方補鎮國公朝帶輔國公同方版每具飾貓睛石一餘如貝子朝帶之制輔國公朝冠頂金龍二層飾東珠四餘同鎮國公朝冠之制和碩額駙吉服冠頂用珊瑚戴雙眼孔雀翎和碩額駙朝帶方版每具飾貓睛石一餘如固倫額駙朝帶之制民公朝冠頂鏤花金座中飾東珠四上銜紅寳石民公吉服冠侯伯子文武一品鎮國將軍郡主額駙皆同頂用珊瑚民公端罩貂皮為之藍緞裏左右垂帶各二下廣而鋭色與裏同侯以下文三品武二品及縣主額駙輔國將軍以上京堂翰詹科道等官應服端罩者皆如之民公補服侯伯同色用石青前後繡四爪正蟒民公朝服藍及石青諸色隨所用披領及袖俱石青片金縁冬加海龍縁兩肩前後正蟒各一要帷行蟒四中有襞積裳行蟒八十一月朔至上元披領及裳俱表以紫貂袖端薰貂兩肩前後正蟒各一襞積行蟒四皆四爪曽賜五爪蟒緞者亦得用之侯以下文三品武二品以上有職掌大臣及縣主額駙輔國將軍以上一等侍衛皆服之民公蟒袍藍及石青諸色隨所用通繡九蟒皆四爪曽賜五爪蟒緞者亦得用之侯以下文武三品郡君額駙輔國將軍以上一等侍衛皆如之民公朝珠珊瑚青金緑松蜜珀隨所用雜飾惟宜縧用石青色侯以下文五品武四品以上及京堂翰詹科遒侍衛禮部國子監太常寺光禄寺鴻臚寺等官凡在陛侍儀壇用朝珠廟執事及殿應者皆如之民公朝帶色用石青或藍鏤金銜玉圓版四每具飾貓睛石一佩帉下廣而鋭帶色下逹庶官皆同後不具詳民公吉服帶色用石青或藍佩帉下直而齊版飾及佩惟宜下逹庶官俱如之侯朝冠頂鏤花金座中飾東珠三上銜紅寳石侯朝帶郡主額駙同鏤金銜玉圓版四每具飾緑松石一伯朝冠頂鏤花金座中飾東珠二上銜紅寳石伯朝帶鏤金銜玊圓版四每具飾紅寳石一一品官朝冠鎮國將軍郡主額駙子皆同頂鏤花金座中飾東珠一上銜紅寳石一品官補服色用石青文職繡鶴惟都御史繡獬豸武職皆繡麒麟一品官朝帶子同色用石青或藍鏤金銜玊方版四每具飾紅寳石一鎮國將軍補服郡主額駙子並同色用石青前後繡麒麟鎮國將軍朝帶色用金黄餘如一品官朝帶之制二品官朝冠輔國將軍縣主額駙男皆同冬用薫貂貂尾惟其時頂鏤花金座中飾小紅寳石一上銜鏤花珊瑚二品吉服冠輔國將軍縣主額駙男皆同頂鏤花珊瑚二品官補服色用石青文職繡錦雞武職繡獅二品官朝帶縣主額駙男並同鏤金圓版四每具飾紅寳石一輔國將軍補服縣主額駙男並同色用石青前後繡獅輔國將軍朝帶色用金黄餘同二品官朝帶之制三品官朝冠冬用薰貂及貂尾惟時武職專月薫貂頂鏤花金座中飾小紅寳石上銜藍寳石三品官吉服冠奉國將軍郡君額駙皆同頂用藍寳石三品官補服色用石青文職繡孔雀惟副都御史及按察使繡獬豸武職皆繡豹三品官朝帶郡君額駙一等侍衛皆同鏤花金圓版四奉國將軍朝冠郡君額駙同冬用薰貂其制下逹未入流皆同頂鏤花金座中飾小紅寳石一上銜藍寳石奉國將軍補服郡君額駙一等侍衛皆同色用石青前後繡豹奉國將軍朝服文四