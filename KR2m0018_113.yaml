body:
  text: 欽定四庫全書皇朝通志卷一百十三圖譜畧一臣等謹按鄭樵通志輯圖譜為專門上自經史下迄物類臚舉博矣然分記有記無者以鄭氏生際南宋偏安書缺有間未能賅載無遺故存信而闕疑也欽惟我朝重熙累洽列聖相承考文制度美備精詳凡金匱石室之藏悉羲畫禹疇之要固已左圖右史囊括古今矣我皇上聖學緝熙幾餘考鏡兼綜條貫金聲而玉振之若球圖法象闗纘述之大者丕揚光烈式廓訏謨如日月之麗中天其他縑毫緗帙繪治象而編掌故一經宸翰品藻雲漢天章益臻典貴巍乎煥乎迥非徃代王㑹圖經世譜所能髣髴於萬一然猶搜羅散佚海内藏書畢輸秘館莫不折衷於睿鑒則圖籍之富至今日而誠粲然大備也臣等謹裒輯冊府御定諸書御製詩集文集所載圖譜聖明親加釐定者弁於編首用昭皇極敷言之盛軌若本朝諸臣専家圖譜之學可資考證者稽諸四庫燦若列眉自無庸倣鄭志記有記無之例依次登載仰見盛世文治光昭賅羣言而包衆有至按類標題悉沿其舊不復於各門中更分細目稍為變通酌歸簡覈云御定六十一種經學毛詩全圖謹按宋馬和之工於繪事供奉高孝兩朝嘗取毛詩三百篇篇為一圖以進流傳零落内府所藏僅十分之三我皇上幾餘染翰指授梗㮣命畫院諸臣撫舊補新獲成完璧是圖重繪至再上備乙覽伏讀御製圖後題跋及序文闡發經㫖洞見比興之原誠覺三代朝章列邦民俗犂然在目不徒為文苑風雅揚扢已也史乗列代紀事年表謹按康熈四十六年聖駕南廵布衣龔士炯獻歴代年表所載至隋而止乃詔儒臣重修成編上起帝堯元載甲辰下迄元順帝至正二十年戊申首末凡三千七百二十五年準史記年表月表司馬光資治通鑑目錄而條理分明脈絡連屬上下數千年包括無遺實為讀史之津梁南薫殿奉藏列代帝后圖像謹按列代帝后圖像舊藏内府嵗久渝脱奉命重加􅋔潢自太皥伏羲氏而下帝后圖像為軸者六十有八為冊者七為卷者三先聖名賢圖冊五詳定位置次第秩然藏之紫禁伏見我朝所以尊崇帝統敬紹道源者俱于是乎在列代賢明妃后垂稱奕世者取繪十二謹按取繪十二賢明妃后如西陵教蠶太姒誨子姜后脱簪樊姬諫獵燕姞夢蘭許后奉案以及婕妤當熊班姬辭輦馬后練衣徐妃直諫昭容評詩曹后重農皆宸翰親系以贊永為後式焉聖帝明王圖謹按是圖乃畫院臣冷枚奉敕恭繪並載各書傳事實歴朝賢后故事圖謹按是圖自孝事周姜葛覃親採麟趾貽休濯龍蠶織身衣練服並約束外家戒飭宗族教訓諸王含飴弄孫禁苑種榖女中堯舜親掖鸞輿共十二事為圖有二一係畫院臣冷枚恭繪一係臣焦秉貞恭繪藏諸御府永為千古極則平定準噶爾回部五十功臣像贊謹按西陲底定圖大學士将軍以下五十功臣於紫光閣皇上親御丹鉛各系以贊其後五十功臣則儒臣奉命綴辭仰見國家心膂之臣宣力策勲後先疏附以視著績雲䑓凌煙者不更偉乎平定兩金川五十功臣像贊謹按兩金川平定命倣西師蕆績之例畫五十功臣像於紫光閣上親灑宸翰就其事實各為之贊併繪其次五十功臣敇儒臣撰擬贊辭以示賞功惟重之至意玉牒謹按宗人府以時修輯皇族之屬籍仰見天潢派衍垂裕無疆之休我皇上福備慶長一堂五世尤為前古史冊未有之盛事綿諸萬禩繼繼承承實非螽斯麟趾所可擬議也敬誌於此宗室王公功績表傳謹按乾隆二十九年上命宗人府内閣考覈宗室王公功績輯為表一卷詳列封爵世系傳五卷嗣因所載事迹尚有未協乃詔館臣恭檢實録紅本重為改撰體例如舊而事必具其始末語必求其徴信仰見我國家宗室懿親銘勲竹帛之盛䝉古王公功績表傳謹按䝉古諸部落自我國家肇興東土前後歸誠莫不執殳效命禦侮折衝用能名著旂常而慶延孫子我皇上垂念舊勲表章遺迹命儒臣纂輯成編俾柳城松漠稽首而効心膂者炳然與宗室王公功績並傳不朽實為前史所未聞也八旗姓氏通譜謹按我朝肇興東土雲從景附日盛因分旗𨽻屬以明其統系迨國家定鼎以來或聚居遼左或散處燕畿迄今百五六十年累朝休養煦植生聚愈繁奉命載稽圖籍考其得姓受氏之初並官階勲績各綴小傳詳列於篇與國史相為表裏天文數理精藴謹按推測星度西法與中法稍異我聖祖仁皇帝奉若天道研極理數洞見西法之精審可垂永久敕靈䑓專行弗失御製數理精藴五十三卷上編五卷以立綱明體下編四十卷以分條致用又表八卷其别有四通中西之異同殫天人之㣲奥自𨽻首以來咸未窺斯秘也厯象考成謹按是書四十二卷上編十六卷曰窺天察紀以闡其理下編十卷曰明時正度以詳其法又表十六卷以致其用仰經聖祖親加審定於圓靈儀象殫極精㣲雖庖犧之仰觀俯察未能踰聰明之天縱也厯象考成後編謹按雍正八年世宗憲皇帝因御製厯象考成中六儀之法閲一甲子将届七十年嵗差之候命續定日躔月離二表但有表無説亦無算法皇上敕監臣増補圖説為後編十卷葢璿衡齊政之術至是愈精密矣儀象考成謹按是書以六儀新法參渾儀舊式製為璣衡撫辰儀繪圖著説以禆測候併考天官家諸星紀之殘缺失次者補而正之為儀象考成五十三卷皆研究嵗差以符天運其星圖較舊増一千六百一十四皆經聖明釐定欽若授時垂為令典洵測算之大成千古莫易也地理皇輿表謹按坤輿圖志前史率多舛訛康熈十八年特命儒臣詳加考正易圖為表瞭如指掌嗣因幅員日廣外藩屬國次第歸誠如喀爾喀青海諸部無不稱臣向化比於郡縣復奉敕考其山川封域増列於編以補原書之所未載輿地圖謹按是圖乃康熈年間聖祖命人乗傳詣各部詳詢精繪所定自平定準噶爾西陲諸部悉入版章因奉敕遣大臣率西洋人由西北兩路分道至各鄂拓克測量星度占候節氣詳詢其山川險易道路逺近繪圖一如舊制以垂諸永久云盛京吉林黒龍江等處標注戰蹟輿圖謹按盛京吉林黒龍江諸處乃我朝肇迹興王之所而皇輿全圖向未賅備我皇上敬稽實録事迹命将軍等臣詳考道里形勢按圖増補且拓為大圖於聖武豐功標注地名之右恭紀太祖太宗親征及遣諸王貝勒等征討輪蹄所及之地計圖一百四十有四列聖開創丕基山川疆域釐然可攷恭繹御製鴻篇所以述祖烈而示來兹誠可永垂不朽矣皇輿西域圖志謹按西陲疆索列代未紀以幅員所限語言不通也我皇上聖武逺揚膚功耆定拓地二萬餘里準噶爾回部之人皆在廷執事音譯既便諸臣馳驅是役者親履其地俾司校勘既詳且覈夫豈漢唐之程督異域者所可同日語哉避暑山莊三十六景圖謹按熱河乃近塞名區聖祖仁皇帝肇建避暑山莊為秋獮駐蹕之地天開勝景繪圖三十六幅悉經寳翰親題每嵗我皇上翠華臨幸掞揚奎藻寄興知仁復増三十六景地靈日闢屹為都㑹敬附誌於此盤山十六景圖謹按盤山為畿甸名區慎郡王允禧恭繪成圖皆經御題為幅共十有六政典太祖實録戰圖謹按實録戰圖八冊乃國家盛京時舊本敬貯乾清宫嗣奉敕依式重繪二本以一本恭送盛京尊藏以一本貯上書房傳之奕世用昭祖徳豐功開億萬載無疆之丕業萬夀圖謹按康熙五十二年恭逢聖祖六旬萬夀自畿輔各省以至遐陬百官耆庶輻輳京師迎駕呼嵩填衢溢巷畫院諸臣奉敕依輦路經行之處繪為全圖祝嘏之盛誠曠古所未有也南廵圖謹按江浙兩省濵於河海一切隄防實闗民生至計聖祖仁皇帝翠華南幸親示機宜凡鑾輅所經無不普被恩膏臣宗業駿恭繪事實以紀省方盛典我皇上法祖觀民六舉時廵之典賜復蠲租涵濡周洽於海塘河工不惜億萬帑金永期鞏固臣民顒顒望幸之心方諸夏諺更誠且切敬誌於此耕織圖謹按是圖各二十三幅昔聖祖仁皇帝厪念農桑詠其勤苦幅繋以詩序而刻之以垂示久逺伏讀御製賡和詩章仰見我皇上勤恤民隠先後同揆較之豳風無逸更深切著明矣農器圖謹按是圖自初耕以至納稼為器十具命工冩於多稼軒中伏讀天章於民生本務不啻三致意焉棉花圖謹按是圖乃直𨽻督臣方觀承所進昔聖祖御製木棉賦備詳吉貝所自起及種植流傳實闡古今之秘我皇上厪恤民依藻詠始末固將與蠶桑浴繭同衣被萬世也親蠶圖謹按是圖恭紀孝賢皇后親蠶之典藏諸蠶館用以昭農桑並重之至意職貢圖謹按我朝車書一統遐陬景附凡遇元辰萬夀慶賀典禮如外藩䝉古諸屬國及朝鮮交趾南掌之類莫不嵗時納貢抃舞殿廷特命畫院諸臣詳繪成圖玉帛冠裳之盛豈僅如王㑹侈陳已哉皇朝禮器圖式謹按禮器之制我朝極為美備惟祀饗朝㑹軍旅諸大政所司展事具儀間沿前代舊式時有未協皇上特命禮官自郊壇祭器及鹵簿儀仗輦輅以次釐正至冠服樂器一準彛章永為定則而觀象臺儀器嵗久漸差武備器什向未臚載咸是笵是程仰經進御聖明親加審定薈萃成帙垂光䇿府云歴代職官表謹按設官分職歴代建置不同我國家間沿勝朝舊制而更定損益特為盡善滿漢一體文武並重永為萬世良法皇上特命儒臣詳訂昭代官制並考古今升降沿革著之以表垂示不刋平定準噶爾回部戰圖謹按西師底定皆我皇上發謀授畧决勝萬里乃於紫光閣既圖有功臣之像復奉命就征戰之地詳繪軍營形勢御製鴻章以旌勞績武功赫濯實從古未有也烏什戰圖謹按烏什介於阿克蘇喀什噶爾之間為回部適中之地恃其地險土饒敢作不靖時乾隆乙酉二月也仰經皇上命将行師天威播震越六月而事平爰繪為圖悉䝉奎藻題詠用紀将士成勞而防戍官軍得形勢之地以鎮壓衆回部西陲永見寜謐矣平定兩金川戰圖謹按兩金川負固一隅地勢險峻凡命将行師皆廟謨决䇿用能擒渠掃穴全境蕩平奉敕将奪碉撲卡攻搗形勢詳繪成圖與西域戰功後先輝映而大聖人不得已用兵之心恭繹御製奎文義正仁育度越萬古矣哨鹿圖謹按是圖乃聖駕初幸木蘭秋獮行圍命郎世寧恭繪用彰講武習軍為萬世不易之法寳譜謹按我朝御寳向尊藏交泰殿歴年既久㑹典所載率多失真皇上親加考正排次定為二十有五以符天數并著成譜其文自乾隆十七年釐考國書篆字成復詳加酌定惟世傳御寳仍舊不復更易其常行誥敕所鈐用者咸改兼篆文以崇典章而昭法守焉印譜謹按乾隆十七年釐考國書篆字成復奉命酌定印信篆文内自部院司寺以下外自督撫提鎮以下印章悉改鑄篆文以昭畫一而大将軍經畧及諸将軍之印或存舊或兼篆各依時次譜圖系説並使崇勲茂績附以益彰學術養正圖謹按是圖自寢門視膳以及借事納忠共六十事皆仰經御題備著法戒之意懿戒圖謹按是圖乃侍郎臣董誥奉敕恭繪仰經御題懸諸祕殿伏見我皇上健行不息而猶取於武公之懿戒誠法天體乾悠久無疆矣歴代帝王道統圖謹按是圖為閨秀錢陳書所繪其子陳羣恭進並撰贊語十六章呈御覽嗣陳羣奉命書於畫冊左方復䝉御筆題籖永為祕府之珍莊子故事圖謹按是圖自姑射神人庖丁解牛支離鼓筴壺子示機列子食豕儵忽鑿竅象罔得珠並輪扁斵輪東施捧心濠梁觀魚痀僂承蜩伯昏論射共十有二事皆仰經御題補繪離騷全圖謹按離騷原圖係國朝蕭雲從所繪祇有三閭大夫鄭詹父漁父及九歌天問等圖而目録所稱離騷經逺遊諸圖俱已闕佚香草一圖則自稱有志未逮核之楚詞篇什挂漏良多皇上幾餘披覽以其用意雖勤而脱畧不免特命内廷諸臣參考釐定各為補繪體物摹神粲然具備且靈均㫖趣可藉以攷見其比興之原藝事佩文齋書畫譜謹按康熙四十七年奉詔發中祕之藏搜輯歴代書畫我聖祖仁皇帝觀文游藝親為審定勒成是編分門列目引據詳賅非特殫藝事之精㣲而實為考證之資糧也詞譜謹按康熙五十四年特命儒臣輯成是編凡八百二十六調二千三百六體自唐至宋元遺篇靡弗採録分刌節度窮極窈眇實立詠歌之準而通聲氣之元曲譜謹按是編與詞譜同時奉敕所撰相輔而行凡諸家論説以及舊譜舛訛無不辨訂詳核匪獨倚聲家當永為法守而五音六律得所考正且與大樂同和矣陶冶圖謹按是圖畫院臣孫祐周鯤丁觀鵬所繪督理九江鈔闗内務府員外郎臣唐英恭編成帙藏諸御府備見考工搏埴之遺意物類廣羣芳譜謹按羣芳譜乃明王象晉所編體例尚有未醇考證亦多疎漏我聖祖仁皇帝親加釐定正訛補闕凡殊方絶域之産花鏡圃史之書徵名覈實一一詳載以成博物之鴻編而昭聖朝之隆軌何爾其圖謹按是鳥出於黒龍江康熙年間命蒋廷錫所繪瑞穀圖謹按雍正二年三年自帝耤御園及兩河三晉江省嘉禾叢生侍郎臣蔣廷錫繪為總圖並獻頌紀瑞瑞蔬圖謹按雍正三年十月宣示御園萊菔九枝連蒂侍郎臣蒋廷錫繪圖獻頌以表庥徴十蔬圖謹按乾隆丙寅年上命剪園蔬賜大學士并内廷翰林等臣蒋溥繪十蔬圖以進仰䝉御題永為藝林盛事國學瑞槐圖謹按國學古槐於乾隆辛未嵗重榮大學士臣蒋溥繪圖以進復荷睿題蔚為人文嘉瑞十駿圖謹按十駿皆外藩所進為天閑上駟臣郎世寧奉敕恭繪如意驄圖謹按準噶爾進大宛馬臣郎世寧奉敕恭繪並錫嘉名用示招徠愛烏罕四駿圖謹按是圖乃臣金廷標奉敕恭繪以補郎世寧畫所未到白鷹圖謹按此鳥為喀爾喀貝勒阿約爾所進較越裳獻雉向化更逺矣鷟鸑爾圖謹按是鳥乃尚書臣阿桂還自伊犁所獻郎世寧奉敕恭繪時西域既屯且城實綏逺之徴殊方瑞應也西清古鑑謹按乾隆十四年奉命内廷諸臣考訂御府所藏彛器繪其形模備摹欵識不特鑑古之精三代法物穆乎如見西清硯譜謹按前代舊硯御府儲藏最富特命内廷諸臣甄覈品次詳繪規制薈綜成編永為文房至寶錢錄謹按乾隆十五年奉命詳列歴代泉布並外域諸品以及吉語異錢厭勝諸品勒成是編皆據内府儲藏考証典核摹繪逼真不特見稽古責實而錢幣之利弊一覽具覩洵足折衷百代皇朝通志卷一百十三
