  text: 地理略八水道四太湖諸水荆溪在宜興縣城南其在城西者曰西溪東曰東溪凡廣德州溧陽金壇諸縣水皆來會東北流至百瀆口入太湖金線泉河出長興縣西北境東南流至夾浦港入太湖合溪即箬溪亦名若溪出長興縣西東流有南溪來會經縣北運河支渠來會至大沈灣港入太湖苕溪出孝豐縣南之天目山經縣城東北流經安吉縣東南分二支而合會諸水又分二支一經長興縣東南合運河又分二支一支仍入運河一支與正流合至湖州府城西有餘不溪來會又分二支一為小梅溪入太湖一會府城東諸水至大錢湖口入太湖餘不溪即東苕水其上源曰北溪出臨安縣西北與孝豐界之東天目山東南流一源曰南溪出臨安縣西與於潛界之化龍鎮東流與北溪會經餘杭縣南分二支而合有武康縣水來會北流有小山河自錢塘縣北界來會經德清縣南有封溪及後溪自武康縣來會分為三派一東塘河自德清經歸安石門縣至湖州府城南一西塘河行德清縣境一正流經武康縣東至府城西南並合又分支津一經嘉興府西北境又經吳江界入運河正流會苕溪水至大錢湖口入太湖七十二漊在烏程縣者三十有八在長興縣者三十有四並入太湖太湖即古震澤亦名具區又名笠澤五湖環二省常州蘇州湖州三府宜興荆溪武進陽湖無錫金匱吳縣長洲吳江震澤長興烏程歸安十三縣地下流入海最大者曰吳淞江曰婁江吳淞江自太湖分流出吳江縣東南經吳縣合龎山湖經崑山縣西又經青浦之澱山湖入松江府華亭縣境合趙屯大盈顧會嵩子盤龍五浦水入上海縣西北至黃浦合嘉興平湖縣水及蘇州澱山湖滙為三泖湖東北入於海婁江今曰劉家河自太湖分流經吳江縣西北至蘇州府城西入運河又東受陽城巴城諸湖水經崑山縣南又經太倉州城南諸水悉會至劉家口入於海其别支為七鴉浦自崑山合常熟諸水至太倉州北入於海浙江諸水浙水有南北二源北源徽江亦曰新安江出徽州府歙縣西北與黟縣界之黃山至府城西南有東界河自績溪縣來會又南有南港河自黟縣經休寧縣合婺源縣之率山水來會入浙江嚴州府界南流經淳安縣南又南有龍溪自遂安縣來會經建德縣西有艾溪自夀昌縣來會經嚴州府治建德縣南南源來會南源有二一曰衢港一曰婺港衢港亦曰信安江源出開化縣北二支合流經縣東東南流經常山縣西北至衢州府城西有文溪自江山縣南仙霞嶺來會經龍遊縣北有笋籜溪自夀昌縣桃溪自遂昌縣來會又東北有湯溪縣水來會又東北至蘭溪縣南婺港來會婺港亦曰東陽江出東陽縣東之大盆山西流有小溪來會經縣城北又西經義烏縣城南有荆浦溪來會又西有慈航溪來會至金華府城南有梅溪亦曰縉雲水自縉雲縣東北合好溪水經永康武義縣合諸水來會西流分二派南支先入衢港北支至蘭溪縣南與衢港會北流至嚴州府城東南與新安江合二江既合北流過七里瀨經桐廬縣東南有桐溪水自於潛昌化經縣界來會至富陽縣界有新城縣溪水來會又東北有湖溪自浦江縣經富陽縣界來會至縣城南有篠嶺水來會折北流東岸經蕭山縣境有浦陽江即浣江自浦江義烏諸暨山隂縣境合諸水來會入錢塘縣南境折東北流至杭州府城東南南岸即蕭山縣境又東北經蕭山縣北境又東北至龕山與北岸海寧州境之赭山相對如門入於海西湖在杭州府城西源出諸山中滙為湖周三十里其水引貫城而東出灌海寧州田三江口在紹興府北山隂會稽蕭山三縣諸水之尾閭也腹曰鑑湖其源無數在會稽東南境者曰東溪合若耶寒溪上竈諸水在山隂西南境者曰西溪合相溪餘支溪諸水在蕭山境者合運河西河塘河湘湖諸水俱滙至三江閘入於海閘稱三江從古名自山隂築臨浦壩浦陽江已入於浙會稽築崤壩曹娥江自入於海東西兩江俱不從此入海也曹娥江即剡溪源出天台及東陽縣境經新昌縣西北至嵊縣南有西港來會東北流有新昌寧海奉化三縣水合而來會又北流東為上虞界西為會稽界又東北有夏蓋湖水來會入於海甬江即鄞江有二源南源曰姚江出餘姚縣西南經上虞縣南又經慈溪縣南有藍溪文溪諸水來會有二壩分為南港東港北源曰奉化江出奉化縣西南經縣城東南有東剡溪來會北流分二支北支與慈溪二壩下流會至寧波府城南與南支合又東北與姚江之南港東港先後並會經鎮海縣南又東入於海靈江亦曰澄江出天台縣西南合天台山諸水東北流經臨海縣西北有仙居溪水自仙居縣南合縉雲界之馮水師山水永康界之蒼嶺水天台界之白水來會經台州府城西有臨海東境諸水來會又東南黃巖縣之永寧江來會又東入於海甌江亦曰永嘉江出處州府龍泉縣西南經城東又經雲和縣北有遂昌松陽二縣之大溪來會至處州府西南有虎踏溪自宣平縣來會又東有縉雲縣溪來會又東南有臘溪自青田縣來會經青田縣西北有彪溪自景寧縣來會折東南入溫州府永嘉縣境至府城南有楠溪自仙居縣來會又東有永寧河來會經樂清縣西南又東入於海閩江諸水閩江即建江有三源東源建溪出浦城縣北南流經縣城東南有新溪來會又南有臨江溪來會經建陽縣東至建寧府治甌寧縣西北有崇溪自崇安縣合武彞山九曲溪經建陽合邵武縣諸水來會東南流有東溪自浙江龍泉慶元經松溪政和二縣來會至延平府東北南至延津西源富屯溪出光澤縣西東流經邵武府城北又東南經順昌縣西有將溪自將樂縣會建寧泰寧二縣諸水來會東流會沙溪西南源沙溪出寧化縣西東南流有淮溪自長汀縣來會經清流縣西又東南有文川溪自連城縣來會經永安縣西東北流有坊溪沙洋溪自歸化縣來會經沙縣西南至延平