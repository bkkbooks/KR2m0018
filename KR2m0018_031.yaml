哈喇圖河來會又西有竒喇河來會又西有博喇濟河尼斯庫河來會北流滙於烘和圖淖爾淖爾西北有昌吉斯河柴羅爾河合北額爾齊斯河來會在塔爾巴噶台之東境額彬格遜淖爾源出迪化州境東源為呼圖克拜河西源為瑪那斯河並流而滙於淖爾布勒哈齊淖爾在庫爾喀喇烏蘇之西源出天山北麓曰庫爾河北流而西有濟爾噶朗河來會又西有額布圖河來會其北有綽爾河來會滙於布勒哈齊淖爾淖爾之西有晶河北流來入又西有鄂拓克賽里河會數水又會庫色木蘇克河東流來入其西有裕勒雅爾河額敏河自為經流不入淖爾又有阿拉克圖古勒淖爾合諸小水瀦蓄成澤伊犂河出天山北之渾都賴嶺合諸水東流折而北有搭拉錫克河來會經伊犂城曰伊犂河北行有空格斯河自東南境來會有哈什河自東北境來會折而西北合察罕烏蘇阿里瑪圖河諸水又有策集河薩瑪勒河奎屯河並會北流會阿斯哈嶺以北諸水折東北滙於巴勒喀什淖爾淖爾之北為哈薩克界其東有愛呼斯河合必齊干河來入東南有察林河合摩垓圖河來入圖斯庫勒在天山木素爾峯北羣源競發環集而瀦於庫勒其大者曰濟爾噶朗河曰招哈河曰哈喇河並滙自西北流出為吹河受薩勒齊圖烏蘭烏蘇阿爾察克圖察罕烏蘇諸水又西北有和爾衮河合墨爾根河古爾班哈納圖河自南來會又西北滙於和什庫勒塔拉斯河源出天山額得墨克嶺之北西北流有古爾班哲爾格河合諸水自北來會又有烏可克嶺水自南來會又西北有哈喇布拉河自西南來會北流有哈拉河合北山數水自東來會西北流經塔拉斯地滙為淖爾是為伊犂之極西境其西為右哈薩克界皇朝通志卷三十一
