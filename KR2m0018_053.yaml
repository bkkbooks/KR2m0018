body:
  text: 諡畧六庶官諡臣等謹按定例一品官以上應否予諡請㫖定奪予諡者交内閣撰擬諡號工部給碑價翰林院撰擬碑文二品以下無諡其有予諡者係奉特㫖或効職勤勞或没身行陣或以文學或以武功均得邀逾格茂典仰見我國家奬勵臣工之至意謹列叙于左䕶軍綂領管佐領三等男邇塔喇諡忠壯順治十三年二月諡䕶軍綂領費雅思哈諡僖恪康熙十一年閏七月諡致仕太子少傅䕶軍綂領孫達禮巴圖魯諡果壯康熙十四年四月諡㕘贊大臣䕶軍綂領三等輕車都尉哈克山諡武毅康熙十九年六月諡前鋒㕘領雲騎尉贈前鋒綂領呉木篤諡襄壯康熙十九年八月諡臣等謹按呉木篤以隨征福建創發病故照陣亡例予卹故得贈諡步軍綂領開音布諡肅敏康熙四十一年閏六月諡前鋒綂領鄂實諡果壯乾隆二十三年十二月諡以上綂領户部右侍郎梁雲構諡康僖順治十一年四月諡兵部侍郎騎都尉超哈爾諡果壯順治十二年十月追諡理藩院侍郎一等男尼堪諡勤慤順治十三年正月諡户部侍郎一等輕車都尉兼一雲騎尉庫禮諡僖恪順治十三年閏五月諡理藩院侍郎席達禮諡僖敬康熙三年三月諡詹事府詹事加禮部侍郎沈荃諡文恪康熙二十三年十二月諡太子少保刑部左侍郎宋文運諡端慤康熙二十四年二月諡欽天監治理加工部右侍郎南懐仁諡勤敏康熙二十七年二月諡湖廣糧道贈工部右侍郎葉暎榴諡忠節康熙二十八年二月追諡康熙二十八年聖祖仁皇帝南巡二月戊午諭扈從部院諸臣曰楚省兵譁時湖廣糧道葉暎榴盡節捐軀朕心深加憫悼特詔所司優贈亞卿兼予卹廕今巡行江南見其子葉旉迎伏道左彌増軫惻忠節之臣應特予諡以彰異數爾等其㑹議以聞諸臣擬諡忠節上即親灑宸翰賜之福建巡海道贈工部侍郎陳啓泰諡忠毅康熙三十三年七月追諡刑部右侍郎勵杜訥諡文恪康熙四十四年二月諡康熙四十四年二月辛巳聖祖仁皇帝諭大學士等曰原任刑部侍郎勵杜訥向在南書房効力二十餘年為人敬慎積有勤勞並無過譴其品級雖不及予諡之例曩者原任侍郎沈荃曽經予諡今勵杜訥亦著賜諡爾等㑹同禮部議奏尋大學士等㑹同禮部擬諡請㫖得㫖勵杜訥著諡文恪壬午上御書文恪二字遣乾清門一等侍衛副都綂馬武等賜於其家禮部侍郎高士竒諡文恪康熙四十四年三月諡康熙四十四年三月壬戌聖祖仁皇帝諭大學士等曰原任禮部侍郎高士竒在内廷供奉有年其品級不應予諡朕軫念舊臣原任刑部侍郎勵杜訥已照侍郎沈荃例今高士竒亦應予諡以示特恩爾等㑹同禮部議奏尋大學士等㑹同禮部擬上得㫖高士竒著諡文恪以上侍郎諡副都綂三等輕車都尉納爾察諡端壯順治十二年十月追諡副都綂贈一等男穆克譚諡忠勇順治十二年十月追諡副都綂管佐領騎都尉兼一雲騎尉陳逢泰諡康僖順治十三年正月諡副都綂兼管佐領一等輕車都尉卜舟諡毅勤順治十三年正月諡副都綂二等輕車都尉韋徴諡忠慤順治十三年二月諡副都綂一等輕車都尉兼一雲騎尉董俄諡勤僖順治十六年七月諡副都綂一等輕車都尉琿津諡壯勤順治十七年五月諡副都綂三等男蘇禄邁巴圖魯諡勤勇康熙三年二月諡副都綂一等男額黙克圖巴圖魯諡襄壯康熙十二年五月諡盛京副都綂三等輕車都尉額黙克圖諡勤壯康熙十三年九月諡䝉古副都綂一等輕車都尉楚庫巴圖魯諡襄壯康熙十四年五月諡副都綂王府長史佐領雅頼諡襄壯康熙十七年九月諡副都綂兼佐領阿爾瑚諡敏壯康熙十七年九月諡署副都綂三等男達禮善巴圖魯諡武毅康熙十七年十二月諡副都綂額泰諡襄壯康熙十七年十二月諡一等侍衛副都綂管理武備院事禪布諡勇恪康熙十九年九月諡副都綂布舒庫諡剛壯康熙二十二年十二月諡䝉古副都綂巴圖諡恪敏康熙二十五年三月諡副都綂邁圖諡忠毅康熙二十九年十一月諡近御一等侍衛授副都綂品級海清諡果毅康熙五十一年四月諡副都綂阿南達諡恪敏雍正三年三月追諡副都綂三格諡剛勇乾隆二十三年十二月諡以上副都綂贈三等輕車都尉照男爵品級立碑敦達禮諡忠毅順治十一年五月諡三等男達珠呼諡襄敏順治十二年十月追諡扎爾固齊三等男阿蘭珠諡順毅順治十二年十月追諡三等男舒賽諡壯敏順治十二年十月追諡二等男荆古爾達諡忠直順治十三年正月諡三等男管佐領蘇班𢃄諡順僖順治十三年正月諡一等輕車都尉照男爵品級管佐領兼一雲騎尉阿濟拜諡勤僖順治十三年二月諡三等男一等侍衛加一級劉麟圖諡僖順順治十六年七月諡三等男胡亮諡忠敏康熙七年六月諡二等男卓布泰諡武襄康熙十七年五月諡以上男爵監察御史追贈内閣學士兼禮部侍郎陸隴其諡清獻乾隆元年六學追諡以上内閣士散秩大臣黙爾根侍衛阿淑諡勤僖康熙二十四年正月諡以上㪚秩大臣學士額爾徳尼巴實格諡文成順治十一年四月諡學士騎都尉加一雲騎尉瑪魯諡忠勤順治十四年二月諡學以上士浙江温處道贈通政使司通政使陳丹赤諡忠毅康熙三十三年七月追諡以上通政使江西建昌府知府贈太僕寺卿高天爵諡忠烈康熙四十六年五月追諡以上太僕寺卿二等輕車都尉乳公哈喇諡恭襄順治十一年八月諡八門總管三等輕車都尉衛齊諡端勤順治十二年十月追諡扎爾固齊一等輕車都尉雅希禪諡敏果順治十二年十月追諡三等輕車都尉西喇巴諡順壯順治十二年十月追諡一等輕車都尉侍衛傅達理諡忠烈順治十八年四月諡一等輕車都尉乳公邁堪諡勤僖康熙十四年四月諡二等輕車都尉乳公滿達理諡良僖康熙十七年閏三月諡以上輕車都尉䕶軍㕘領照副都綂例予卹阿爾賽諡壯愍康熙二十一年八月諡㕘領照副都綂例予卹博爾和代諡襄慤康熙三十年二月諡領以上㕘山西巡撫贈兵部侍郎祝世昌諡僖靖順治十三年五月諡陜西巡撫博清額諡清獻康熙九年七月諡廣東巡撫劉秉權諡端勤康熙十四年三月諡江西巡撫白色純諡勤僖康熙十五年二月諡江寧巡撫馬祜諡清恪康熙十五年十一月諡河南巡撫佟鳯彩諡勤僖康熙十六年十一月諡四川巡撫杭愛諡勤襄康熙二十三年二月諡直𨽻巡撫格爾古徳諡文清康熙二十三年十一月諡浙江巡撫王維珍諡敏慤康熙三十五年三月諡湖北巡撫納齊喀諡勤恪雍正三年七月諡福建巡撫潘思榘諡敏惠乾隆十七年二月諡以上巡撫陜西延綏總兵官贈太子少保許占魁諡恪敏康熙十七年閏三月諡浙江平陽總兵官贈太子少保朱天貴諡忠壯康熙二十二年九月諡浙江温州總兵官贈太子少保蔣懋勲諡襄僖康熙三十五年九月諡陜西凉州總兵官師帝賓諡恪僖康熙五十二年四月追諡甘肅西寧鎮總兵官高天喜諡果義乾隆二十三年十二月諡雲南臨沅鎮總兵官王玉廷諡勤義乾隆三十三年四月諡以上總兵廣西富川縣知縣劉欽鄰諡忠節康熙四十二年十二月追諡以上知縣外藩諡朝鮮國王李倧諡莊穆順治六年八月諡朝鮮國王李淏諡忠宣順治十六年九月諡朝鮮國王李棩諡莊恪康熙十四年正月諡朝鮮國王李昀諡恪恭雍正三年正月諡朝鮮國王李昑諡莊順乾隆四十一年七月諡朝鮮國王世子追封王爵李涬諡恪愍乾隆四十一年七月諡一品大臣奉特㫖追諡太子太保領侍衛内大臣一等公福善諡恭懿乾隆元年正月追諡太子太保保和殿大學士兼禮部尚書贈太子太傅魏裔介諡文毅乾隆元年正月追諡西安振武將軍佛尼勒諡恭靖乾隆元年正月追諡鎮海將軍莽依圖諡襄壯乾隆元年正月追諡正藍旗漢軍都綂馮國相諡桓僖乾隆元年正月追諡工部尚書管詹事府事湯斌諡文正乾隆元年正月追諡吏部尚書兼翰林院掌院學士徐潮諡文敬乾隆元年正月追諡吏部尚書贈太子太傅瑪爾罕諡恭勤乾隆元年正月追諡乾隆元年正月丁巳總理事務王大臣奉諭㫖易名之典古昔所重我朝賜諡尤為謹嚴亦有當時未蒙錫予而追諡于數十年之後者葢以事乆論定協乎懿好之公也皇考世宗憲皇帝風勵臣工肇舉賢良祠祀誠曠古鉅典其列祠者如一等公福善大學士魏裔介將軍佛尼勒莽依圖都綂馮國相尚書湯斌徐潮瑪爾罕等其殁時皆有卹而無諡朕思諸臣既與賢良之祀似宜邀易名之典其應否追諡之處著九卿會議具奏九卿等議應請追諡欽定諸臣諡如右禮部尚書韓菼諡文懿乾隆十七年二月追諡乾隆十七年二月奉諭㫖故禮部尚書韓菼種學績文湛深經術其所撰制義清真雅正實開風氣之先足為藝林楷則從前未邀易名之典著加恩追諡用示褒榮大學士具擬以聞擬上欽定諡曰文懿刑部尚書王士正諡文簡乾隆三十年四月追諡乾隆三十年四月奉諭㫖原任刑部尚書王士正績學工詩在本朝詩人中流派頗正從前未邀易名之典宜示褒榮以為稽古者勸著大學士察例議諡具奏擬上欽定諡曰文簡子孫請諡刑部尚書正紅旗都綂三等男濟世哈諡勇壯康熙六十一年十一月諡康熙六十一年十一月丁酉西安副都綂阿魯疏奏臣父濟世哈因軍前効力擢用至都綂尚書於康熙元年八月内病故未䝉諡典伏乞皇上加恩賜諡上允之賜諡勇壯王府長史額爾徳黒諡果毅雍正四年八月追諡雍正四年六月兵部議駮奉天將軍噶爾弼奏請伊父原任長史額爾徳黒曽在軍前立功今因伊進藏請停其本身議叙追賜伊父額爾徳黒諡號上曰噶爾弼為伊父額爾徳黒奏請賜諡著照所請給與奪諡臣等謹按易名之典自古重之我朝勸忠勵績于予諡尤為謹嚴其有功不掩罪及備官竊禄身後獲倖邀飾終殊禮者或日乆論定或生前罪蹟因他案而敗露既追裭其爵則必削奪其諡書諸簡冊所以著炯戒也謹列敘如左和碩端重親王博洛諡定順治九年三月諡十六年十月追降貝勒奪諡禮部侍郎加尚書銜贈太子太師沈徳潛諡文慤乾隆三十四年十奪諡四十三年十一月乾隆四十三年十一月奉諭㫖本日大學士九卿具奏定擬逆犯徐述夔等一案已將各犯應得之罪分别降㫖矣至據稱查出徐述夔之傳係沈徳潛所作請將沈徳潛從前所有官銜諡典盡行革去其鄉賢祠内牌位一併撤出及賜祭葬碑文查明仆毁等語實屬罪所應得逆犯徐述夔身係舉人且自其高曾以來均在本朝食毛踐土厚澤涵濡乃於所作一柱樓詩各種敢於妄肆詆譏狂誕悖逆實為覆載所不容至其詩内懷想勝朝之語無非藉以為名不可信以為實即以前明政事而論並無可以動民繫戀者如洪武開基嚴刑峻罰永樂簒逆瓜蔓抄誅士民無不含寃又如洪武因蘇松嘉湖各府為張士誠固守遷怒及民浮糧加重寖至末季徴斂日増累及天下民多愁苦嗟怨此皆見於史册者有何可以繫感之處而追念不忘乎至我本朝列聖相承愛養百姓賑災蠲緩厚澤頻施而江浙浮糧之額節經裁減以除民害朕踐阼至今四十三年普免天下錢糧三次普免漕糧二次其他災賑之需動輒數百萬窮簷疾苦疊沛恩膏小民各具天良豈有不知感戴轉屬念於前朝全無恩徳及民者之理此不過抑鬱無聊之人自揣毫無進路遁而為此與匹夫匹婦之自經溝壑無異而讀書失志之徒遂託言懷想前朝以為萬一敗露猶可藉以立名其肺腑真可洞鑒此等鬼蜮伎倆豈能匿於光天化日之下若無知者以此輩為真有追懷故國之思轉是為若輩所愚矣至伊子徐懷祖敢將伊父逆詞公然刋刻均實罪大惡極乃沈徳潛所作傳内稱其一柱樓編年詩已付梓并云品行文章皆可法是沈徳潛於徐述夔所作悖逆不法詩句皆曽閲看並不切齒痛恨轉欲為之紀述流傳尚得謂稍有人心者乎又伊傳内稱徐述夔之從弟徐賡武妄罹大辟閱十七月而寃雪之語因命薩載等查閱原案則係乾隆元年有泰州民繆照乘與繆又南之妻蔣氏通姦商同勒死親夫蔣氏因曽被徐賡武刁姦懷恨是以到案供指徐賡武同謀後經審出實情業已枷杖完結徐賡武刁姦婦女本屬有罪之人沈徳潛為之論叙稱寃身為大臣不應顛倒是非若此沈徳潛自中式進士及選入翰林時朕因聞其平日學問尚好格外施恩又念其留心詩學且憐其晚成是以不數年間即擢為卿貳又令在尚書房行走而伊自服官以來不過旅進旅退毫無建白並未為國家絲毫出力衆所共知及乞休後復賞給尚書銜晉階太子太傅并予在籍食俸恩施至為優渥沈徳潛理宜飭躬安分謹慎自持乃竟敢視悖逆為泛常為之揄揚頌美實屬昧良負恩且伊為徐述夔作傳自係貪圖潤筆為囊槖計其卑汚無恥尤為玷辱搢紳使其身尚在雖不至與徐述夔同科亦當重治其罪今伊業已身故不加深究然竟置而不論俾其身後仍得永受恩榮則凡在籍朝紳又將何以警愓乎著照所請將沈徳潛所有官爵及官銜諡典盡行革去其鄉賢祠牌位亦一併撤出至所賜祭葬碑文現派阿彌達前往㑹同楊魁查明仆毁以昭炯戒將此通諭中外知之雲貴總督卞三元諡恪敏康熙三十六年閏三月諡乾隆四十六年二月奪乾隆四十六年二月奉諭㫖朕恭閱皇祖實録内載雲貴總督卞三元與張國柱李本深等合詞奏留呉三桂總管雲貴事務一節因檢閱卞三元列傳載其與張國柱等俱傾附呉逆即當日共疏乞留三元疏詞尤為廹切可見三元實為呉逆用人當日皇祖洞燭幾先未允所請而呉逆事權遂以觧退三元後見呉逆反跡漸露遂託言母病乞休迨削平呉逆張國柱李本深俱已伏誅三元竟脱然事外且自乞養歸旗閱三十年及伊殁後又復邀恩得賜祭葬並諡以恪敏夫三元本一進退無據首鼠兩端之人在皇祖當日或念三元開國之初由牧郡洊歴封疆曽有帶兵轉餉微勞且當三桂倡亂之時伊先已告休在家因為曲予包容保全終始今事閱百年詳加論定不得不明白宣示以昭彰癉朕於臣工功罪論斷一秉至公即如前代諸臣之懷二心以事君者猶且另為立傳不稍寛假况卞三元逮事兩朝寵承恩遇乃始則攀援黨逆力疏保留繼則抽身逺引以圖避害其居心行事殊不可問幸而老死牖下未被顯戮已邀國家寛大之恩若復以飾終令典永荷殊榮將何以肅綱紀而示懲勸乎所有卞三元生前官秩及死後諡法並所得誥勅俱著追奪其祭葬碑文並著該旗查明一併仆毁將此通諭中外知之皇朝通志卷五十三
