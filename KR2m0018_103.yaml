  text: 藝文略七文類第十二上楚辭别集臣等謹案鄭志文類於楚辭别集總集之外又分贊頌針銘等目今從欽定續通志之例於賦及碑碣四六諸門有自為一書者則依鄭例分類編次其専集中雜見諸體未便分析仍收入别集總集二門不復别標諸目云楚辭山帶閣注楚辭六卷楚辭餘論二卷楚辭説韻一卷蔣驥撰以上見文淵閣著録天問補注一卷毛竒齡撰楚辭燈四卷林雲銘撰離騷經注一卷九歌注一卷李光地撰離騷經解一卷方楘如撰離騷解一卷顧成天撰讀騷列論一卷顧成天撰楚辭九歌解一卷顧成天撰離騷中正無卷數林仲懿撰屈騷心印五卷夏大霖撰楚辭新注八卷屈復撰楚辭章句七卷劉夢鵬撰以上見四庫全書存目楚辭類凡十二部别集注解别集編録臣等謹案文類别集有唐宋諸家著述經後人注釋及重加編次者欽定續通志于别集之前别分注解編録二門謹從其例並為分載仍依注解編録人先後為次李義山詩注三卷補注一卷朱鶴齡注李義山文集箋注十卷徐樹榖箋徐炯注溫飛卿集箋注九卷顧豫咸補注顧嗣立重訂補注東坡編年詩五十卷查慎行補注庾開府集箋注十卷吳兆宜箋注徐孝穆集箋注六卷吳兆宜箋注杜詩詳注二十五卷附編二卷仇兆鼇注韓集點勘四卷陳景雲撰李太白詩集注三十六卷王琦注庾子山集注十六卷倪璠注王右丞集箋注二十八卷附録二卷趙殿成箋注以上見文淵閣著録杜詩説十二卷黃生撰讀書堂杜詩注解二十卷張潛撰陶詩箋五卷邱嘉穗撰陶詩彚注四卷吳瞻泰撰杜詩會粹二十四卷張逺撰杜詩論文五十六卷吳見思撰杜詩闡三十三卷盧元昌撰杜律疏八卷紀容舒撰讀杜心解六卷浦起龍撰樊紹述集注二卷孫之騄撰玉川子詩集注五卷孫之騄撰西崑發微三卷吳喬撰李長吉歌詩彚解五卷王琦撰以上見四庫全書存目右别集注解白香山詩集四十卷附録年譜二卷汪立名編以上見文淵閣著録剡源文鈔四卷黃宗羲編朱子文集大全類編一百一十卷朱玉編諸葛丞相集四卷朱璘編香山詩鈔二十卷楊大鶴編東坡養生集十二卷王如錫編王陽明集十六卷王貽樂編陽明文鈔二十卷張問達編陽明全集二十卷傳習録一卷語録一卷俞嶙編以上見四庫全書存目右别集編録聖祖仁皇帝御製文集一百七十六卷詩文共分四集癸亥以前為初集四十卷丁丑以前為二集五十卷辛卯以前為三集五十卷皆大學士張玉書等恭編壬辰至壬寅為四集三十六卷莊親王允祿等恭編通一百七十六卷世宗憲皇帝御製文集三十卷文二十卷分十三體詩十卷前七卷為雍邱集康熙壬寅以前作後三卷為作四宜堂集雍正癸卯以後御製樂善堂文集定本三十卷乾隆二十三年尚書協辦大學士蔣溥等奉編敕御製文初集三十卷乾隆二十八年恭録十奏進奉十敕刋布凡五百七餘篇分有九體各以年月為次御製詩初集四十四卷目録四卷二集九十四卷目録十卷三集一百卷目録十二卷四集一百卷目録十二卷古今體詩編年為次自丙辰至丁卯為初集自戊辰至己卯為二集自庚辰至辛卯為三集自壬辰至癸卯為四集甲辰以後之詩恭俟續編梅村集四十卷吳偉業撰湯子遺書十卷湯斌撰兼濟堂文集二十卷魏裔介撰學餘堂文集二十八卷詩集五十卷外集二卷施閏章撰忠貞集十卷范承謨撰林蕙堂集二十六卷吳綺撰精華録十卷王士正撰堯峰文鈔五十卷汪琬撰午亭文編五十卷陳廷敬撰讀書齋偶存稿四卷葉方藹撰松桂堂全集三十七卷延露詞三卷南􅐹集三卷彭孫遹撰曝書亭集八十卷附録一卷朱彞尊撰政書八卷于成龍撰愚菴小集十五卷朱鶴齡撰抱犢山房集六卷嵇永仁撰文端集四十六卷張英撰西河文集一百七十九卷毛竒齡撰蓮洋詩鈔十卷吳雯撰張文貞集十二卷張玉書撰西陂類稿三十九卷宋犖撰鐵廬集三卷外集二卷附録一卷潘天成撰湛園集十卷薑宸英撰古歡堂集三十六卷附黔書二卷長河志籍考十卷田雯撰榕村集四十卷李光地撰三魚堂文集十二卷外集六卷附録一卷陸隴其撰因園集十三卷趙執信撰懷清堂集二十卷湯右曽撰二希堂文集十二卷蔡世逺撰敬業堂集五十卷查慎行撰望溪集八卷方苞撰存硯樓文集十六卷儲大文撰香屑集十八卷黃之雋撰鹿洲初集二十卷藍鼎元撰樊榭山房集二十卷厲鶚撰杲堂集十二卷沈彤撰松泉文集二十卷詩集二十六卷汪由敦撰以上見文淵閣著録燕香齋文集四卷詩集六卷劉餘祐撰金文通集二十卷金之俊撰灌研齋集四卷李元鼎撰用六集十二卷刁包撰秀巖集三十一卷胡世安撰淡友軒集十六卷薛所藴撰桴菴集四卷薛所藴撰搜遺稿四卷彭賔撰青溪遺稿二十八卷程正揆撰己亥存稿一卷孫承澤撰淳雲集十一卷陳之遴撰靜惕堂詩集四十四卷曹溶撰粵遊草一卷曹溶撰橘洲詩集六卷范士楫撰且園近集四卷且園近詩五卷王岱撰了葊文集九卷王岱撰內省齋文集三十二卷湯來賀撰古處堂集四卷髙爾儼撰沚亭文集二卷孫廷銓撰薪齋集八卷吕陽撰讀史亭詩集十六卷文集二十二卷彭而述撰道山堂前集四卷後集七卷陳軾撰山圍堂集二十三卷鄭宗圭撰石雲居士集十五卷詩七卷陳名夏撰栖雲閣詩十六卷拾遺三卷髙珩撰栖雲閣詩略無卷數髙珩撰誠正齋集八卷上官鉝撰青箱堂文集三十三卷詩集三十三卷王崇簡撰東村集十卷李呈祥撰蕉林詩集無卷數梁清標撰東谷集三十四卷歸庸集四卷桑榆集三卷白允謙撰陳士業全集十六卷陳宏緒撰九山遊草一卷李確撰梅花百咏一卷李確撰二槐草存無卷數王翃撰直木堂詩集七卷釋本晝撰南耕草堂詩稿無卷數曹亮武撰南雷文定十一卷文約四卷黃宗羲撰紫