  text: 藝文畧七文類第十二上楚辭别集臣等謹案鄭志文類於楚辭别集總集之外又分贊頌箴銘等目今從欽定續通志之例於賦及碑碣四六諸門有自為一書者則依鄭例分類編次其専集中雜見諸體未便分析仍收入别集總集二門不復别標諸目云楚辭山帶閣註楚辭六巻楚辭餘論二卷楚辭説韻一巻蒋驥撰以上見文淵閣著録天問補註一巻毛竒齡撰楚辭燈四卷林雲銘撰離騷經註一卷九歌註一卷李光地撰離騷經解一卷方楘如撰離騷解一巻顧成天撰讀騷列論一巻顧成天撰楚辭九歌解一卷顧成天撰離騷中正無卷數林仲懿撰屈騷心印五卷夏大霖撰楚辭新註八卷屈復撰楚辭章句七卷劉夢鵬撰以上見四庫全書存目楚辭類凡十二部别集註解别集編録臣等謹案文類别集有唐宋諸家著述經後人註釋及重加編次者欽定續通志于别集之前别分註解編録二門謹從其例並為分載仍依註解編録人先後為次李義山詩註三卷補註一巻朱鶴齡註李義山文集箋註十卷徐樹榖箋徐炯註温飛卿集箋註九卷顧予咸補註顧嗣立重訂補註東坡編年詩五十卷查慎行補註庾開府集箋註十卷吳兆宜箋註徐孝穆集箋註六卷呉兆宜箋註杜詩詳註二十五卷附編二卷仇兆鼇註韓集㸃勘四卷陳景雲撰李太白詩集註三十六卷王琦註庾子山集註十六巻倪璠註王右丞集箋註二十八卷附錄二卷趙殿成箋註以上見文淵閣著録杜詩説十二卷黄生撰讀書堂杜詩註解二十巻張潛撰陶詩箋五卷邱嘉穗撰陶詩彚註四卷吳瞻泰撰杜詩㑹粹二十四卷張逺撰杜詩論文五十六卷呉見思撰杜詩闡三十三卷盧元昌撰杜律疏八巻紀容舒撰讀杜心解六卷浦起龍撰樊紹述集註二巻孫之騄撰玉川子詩集註五卷孫之騄撰西崑發㣲三卷吳喬撰李長吉歌詩彚解五卷王琦撰以上見四庫全書存目右别集註解白香山詩集四十卷附録年譜二卷汪立名編以上見文淵閣著録剡源文鈔四卷黄宗羲編朱子文集大全類編一百一十卷朱玉編諸葛丞相集四巻朱璘編香山詩鈔二十巻楊大鶴編東坡養生集十二卷王如錫編王陽明集十六巻王貽樂編陽明文鈔二十卷張問達編陽明全集二十卷傳習録一巻語録一卷俞嶙編以上見四庫全書存目右别集編録聖祖仁皇帝御製文集一百七十六巻詩文共分四集癸亥以前為初集四十卷丁丑以前為二集五十卷辛夘以前為三集五十卷皆大學士張玉書等恭編壬辰至壬寅為四集三十六卷莊親王允禄等恭編通一百七十六卷世宗憲皇帝御製文集三十卷文二十卷分十三體詩十卷前七卷為雍邱集康熙壬寅以前作後三卷為作四宜堂集雍正癸夘以後御製樂善堂文集定本三十卷乾隆二十三年尚書協辦大學士蒋溥等奉編敕御製文初集三十卷乾隆二十八年㳟録十奏進奉十敕刋布凡五百七餘篇分有九體各以年月為次御製詩初集四十四卷目錄四卷二集九十四卷目録十卷三集一百卷目録十二卷四集一百卷目録十二巻古今體詩編年為次自丙辰至丁夘為初集自戊辰至己夘為二集自庚辰至辛夘為三集自壬辰至癸夘為四集甲辰以後之詩㳟俟續編梅村集四十卷吳偉業撰湯子遺書十卷湯斌撰兼濟堂文集二十卷魏裔介撰學餘堂文集二十八卷詩集五十卷外集二卷施閏章撰忠貞集十卷范承謨撰林蕙堂集二十六卷吳綺撰精華録十卷王士正撰堯峰文鈔五十卷汪琬撰午亭文編五十卷陳廷敬撰讀書齋偶存稿四卷葉方藹撰松桂堂全集三十七巻延露詞三巻南􅐹集三巻彭孫遹撰曝書亭集八十卷附録一巻朱彞尊撰政書八卷于成龍撰愚菴小集十五卷朱鶴齡撰抱犢山房集六卷嵇永仁撰文端集四十六巻張英撰西河文集一百七十九卷毛竒齡撰蓮洋詩鈔十卷呉雯撰張文貞集十二巻張玉書撰西陂類稿三十九卷宋犖撰鐵廬集三巻外集二卷附録一巻潘天成撰湛園集十卷姜宸英撰古懽堂集三十六卷附黔書二卷長河志籍考十卷田雯撰榕村集四十卷李光地撰三魚堂文集十二巻外集六卷附録一巻陸隴其撰因園集十三卷趙執信撰懷清堂集二十卷湯右曽撰二希堂文集十二卷蔡世逺撰敬業堂集五十巻查慎行撰望溪集八巻方苞撰存硯樓文集十六卷儲大文撰香屑集十八卷黄之雋撰鹿洲初集二十卷藍鼎元撰樊榭山房集二十巻厲鶚撰杲堂集十二卷沈彤撰松泉文集二十卷詩集二十六卷汪由敦撰以上見文淵閣著録燕香齋文集四卷詩集六卷劉餘祐撰金文通集二十卷金之俊撰灌研齋集四卷李元鼎撰用六集十二卷刁包撰秀巖集三十一卷胡世安撰澹友軒集十六卷薛所藴撰桴菴集四卷薛所藴撰搜遺稿四卷彭賔撰青溪遺稿二十八卷程正揆撰己亥存稿一卷孫承澤撰淳雲集十一卷陳之遴撰静惕堂詩集四十四巻曹溶撰粤遊草一巻曹溶撰橘洲詩集六卷范士楫撰且園近集四卷且園近詩五卷王岱撰了葊文集九巻王岱撰内省齋文集三十二卷湯來賀撰古處堂集四卷髙爾儼撰沚亭文集二巻孫廷銓撰薪齋集八卷吕陽撰讀史亭詩集十六卷文集二十二卷彭而述撰道山堂前集四巻後集七卷陳軾撰山圍堂集二十三巻鄭宗圭撰石雲居士集十五卷詩七卷陳名夏撰栖雲閣詩十六卷拾遺三卷髙珩撰栖雲閤詩畧無卷數髙珩撰誠正齋集八卷上官鉝撰青箱堂文集三十三卷詩集三十三卷王崇簡撰東村集十卷李呈祥撰蕉林詩集無卷數梁清標撰東谷集三十四卷歸庸集四卷桑榆集三巻白允謙撰陳士業全集十六卷陳宏緒撰九山遊草一卷李確撰梅花百咏一卷李確撰二槐草存無卷數王翃撰直木堂詩集七卷釋本晝撰南耕草堂詩稿無巻數曹亮武撰南雷文定十一卷文約四卷黄宗羲撰紫