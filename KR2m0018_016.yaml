body:
  text: 七音略三華梵字譜臣等謹按反切之學自西域入中國至齊梁間盛行第今所存廣韻集韻古今韻會諸書皆止華言並無梵韻所以轉梵為華之故稽考實難我朝文德覃敷化行無外天竺西番字母皆得洞悉周知因以逐字尋聲因聲考字聲經音緯洞若發蒙蓋韻分六部呼分四等至於輕重清濁之辨平聲之字甚顯仄聲之字差微就平聲之字按韻尋呼按呼求字則每韻皆有四字收聲每呼各得諧聲一字其音之宫商清濁無不吻合將華嚴三十六字母列於前舊傳三十字及近世字母列于後牙齒喉舌各注本條又取梵音三十六字為華音字母所從出者列于上各按音韻呼法展轉求之則華之某字出於梵之某字與其用華之仄不如用梵之平顯然共見謹據同文韻統各譜具著於篇華梵字母合璧譜華梵合璧諧韻生聲十二譜第一譜阿厄伊烏俞五字為諧韻生聲之元第二譜歌基姑居四呼收聲於厄伊烏俞四字第五譜干堅官涓四呼收聲於安焉彎淵四字第七譜岡薑光四呼收聲於昂央汪四字第八譜庚京公扄四呼收聲於鞥英翁雍四字第九譜該皆乖四呼收聲於埃崖歪四字第十譜裓規四呼收聲於額威四字第十一譜髙驕四呼收聲於敖么四字第十二譜鉤鳩四呼收聲於歐由四字皇朝通志卷十六
