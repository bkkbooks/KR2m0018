body:
  text: 欽定四庫全書皇朝通志巻一氏族畧一臣等謹按鄭志氏族畧以三十二類敘得姓受氏之原附以四聲綴以總論旁羅古今綦辨且博雖炫多聞而廣附會在所不免然伊古姓氏已備見於此矣恭惟我國家肇興東土受姓自天帝統既尊皇支益衍謹誌國姓於卷首以昭億萬年之鴻業至國初時攀龍附鳯之衆奔走後先或舊屬編氓或舉族内附首編滿洲八旗次列蒙古八旗建師設長制度釐然有條不紊迨皇上御極之初軫念族姓日繁不有成書將無以知世徳所自爰命廷臣編輯八旗氏族通譜表以地系以名官階勲績與八旗列傳相為表裏於是名位世系昭然可考今以通譜所載考諸徃史滿洲氏族見於金史者什之三䝉古氏族見於元史者什之一葢閲世既逺以姓為氏者或數典未忘而以地為氏者徃徃混淆莫辨故通譜於𤓰爾佳氏載某與某同族凡二十餘條於納喇氏著别族之有三於佟佳氏聯漢軍而為一謹嚴詳晰兹皆甄載篇中若夫記載之體前纂五朝續志於遼金元分部姓二條今通譜中之以地以姓著者多寡懸殊難以分載爰仍通譜次序編分卷帙約存其畧其部姓之見於金元者加案聲明繼以滿洲旗分内高麗尼堪臺尼堪撫順尼堪等姓其漢人希姓依五朝氏族例續補昭代人名而以總論綴於其末凡賜氏改氏等分為八類以仍前志之例臣伏讀聖製八旗氏族通譜序諄諄訓迪有云前之人既以忠實勤勞覆幬其後嗣凡兹食舊徳而服先疇者其何以無隳厥緒大哉王言益曉然於氏族之書闗係世徳淳風者非淺鮮也謹臚載大畧以彰我朝之族望以備一代之典章為書凡十卷云國姓愛新覺羅氏我朝先世發祥於長白山山之東有布庫哩山下有池曰布勒瑚里相傳有天女三浴於池浴畢有神鵲銜朱果置季女衣季女取而吞之遂有身尋産一男生而能言體貎竒異及長母告之故命曰汝以愛新覺羅為姓天生汝以定亂國其徃治之汝順流徃即其地也與小舠乘之母凌空去子乘舠順流至河步登㟁端坐其上時有三姓爭雄長日搆兵讐殺有取水河步者見而異之歸語衆衆走視問所自語姓名如母命且曰我天女所生定汝等之亂者衆驚曰此天生聖人也乃交手舁之歸三姓遂以女妻之奉為國主其亂遂定於是居長白山東鄂多理城國號滿洲傳至肇祖原皇帝居呼蘭哈達山下赫圖阿拉地二傳至興祖直皇帝子六傳位四子景祖翼皇帝居赫圖阿拉地稱寧古塔貝勒子五傳位顯祖宣皇帝為第四子初景祖才智過人兼長子禮敦英勇盡收五嶺東蘇克蘇瑚河西二百里内諸部由此遂盛再傳至太祖高皇帝太宗文皇帝聖聖相承創建帝業垂億萬年無疆之統云臣等謹按愛新覺羅氏國語以金為愛新覺羅乃姓也滿洲係滿珠之轉音亦稱曼珠我朝龍興東土每嵗西藏獻丹書稱曼珠師利大皇帝曼珠華言妙吉祥也當時滿珠之鴻號萬里同符矣至朱果發祥早膺天眷而肇祖光復以後寖熾寖昌歴興祖景祖顯祖以及太祖高皇帝瓜綿椒衍本支實蕃逮太宗文皇帝天聰八年詔宗人自興祖直皇帝出者為六祖後免其徭役九年詔太祖庶子稱阿哥天潢宗派以顯祖宣皇帝本支為宗室繫黄帶六祖子孫俱稱覺羅繫紅帶以别之乾隆四十七年九月奉諭宗室王公之子孫均照例恩給官爵其餘閒散一概給與四品頂帶四十八年正月賜宴乾清宫宗室與宴者共二千人御製乾清宫大宴宗室聯句詩紀其盛焉敬惟太祖子孫至現在禇英支下之賜名奉福奉夀凡十一世興祖而下至現在覺羅卑幼凡十四世天潢蕃衍無疆惟庥凡皇上古稀平格五代一堂洵亘古莫與比隆矣宗室覺羅之外有民覺羅氏其族屬之衆者冠以地名如伊爾根舒舒西林通顔之類散處者上加民字以不同於國姓也民覺羅各氏並見後巻若夫聖祖神宗鴻謨大烈舉世共仰日月之光華而宗室王公之賢者勲緒自具國史宗支别見帝系兹不備載云皇朝通志卷一
