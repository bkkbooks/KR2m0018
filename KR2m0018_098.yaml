body:
  text: 藝文略二禮類第二周官月令儀禮會禮喪服儀注禮記臣等謹案鄭志禮類七門今悉依例編次其每門細目概從刪併若禮記門之中庸則移入四書類云周官臣等謹案周禮古稱周官鄭志謂推本而言周官為是今遵欽定義疏復其本名至諸家注本舊題周禮者不復一一追改焉欽定周官義疏四十八卷乾隆十三年奉敕撰周禮述注二十四卷李光坡撰周禮訓纂二十一卷李鍾倫撰周官集注十二卷方苞撰禮説十四卷惠士竒撰周官祿田考三卷沈彤撰周禮疑義舉要七卷江永撰以上見文淵閣著録周禮訂釋古本無卷數王芝藻撰髙注周禮二十二卷髙愈撰周禮惜陰録六卷徐世沐撰周官辨非一卷萬斯大撰周禮問二卷毛竒齡撰周禮節訓六卷黃叔琳撰周官析疑三十六卷考工記析疑四卷方苞撰周官辨一卷方苞撰周禮集傳六卷李文照撰周官翼疏三十卷沈淑撰周禮會要六卷王文清撰周禮質疑五卷劉青芝撰周禮輯義十二卷薑兆錫撰周禮拾義無卷數李大濬撰周禮三注粹鈔二卷髙宸撰以上見四庫全書存目周官類凡二十二部儀禮欽定儀禮義疏四十八卷乾隆十三年奉敕撰儀禮鄭注句讀十七卷附監本正誤石經正誤二篇張爾岐撰儀禮商二卷萬斯大撰儀禮述注十七卷李光坡撰儀禮析疑十七卷方苞撰儀禮章句十七卷吳廷華撰補饗禮一卷諸錦撰禮經本義十七卷蔡德晉撰宫室考十三卷任啓運撰肆獻祼饋食禮三卷任啓運撰儀禮釋宫增注一卷江永撰儀禮小疏一卷沈彤撰儀禮集編四十卷盛世佐撰以上見文淵閣著録儀禮惜陰録八卷徐世沐撰儀禮經傳內編二十三卷外編五卷薑兆錫撰儀禮節要二十卷朱軾撰重刋朱子儀禮經傳通解六十九卷梁萬方撰儀禮訓義十七卷不著撰人名氏儀禮釋例一卷江永撰儀禮易讀十七卷馬駉撰以上見四庫全書存目儀禮類凡二十部喪服讀禮通考一百二十卷徐乾學撰以上見文淵閣著録讀禮問一卷吳肅公撰讀禮紀略六卷附婚禮廣義一卷朱董祥撰喪禮吾説篇十卷毛竒齡撰以上見四庫全書存目喪服類凡四部禮記大戴禮附臣等謹案鄭志大戴禮記列於小戴記之前今以禮記之屬皆指小戴記而言謹從欽定四庫全書例以大戴記附録禮記之末日講禮記解義二十六卷謹按是編為乾隆元聖祖仁皇帝講筵舊本年詔儒臣校刋頒行欽定禮記義疏八十二卷乾隆十三年奉敕撰深衣考一卷黃宗羲撰陳氏禮記集説補正三十八卷納喇性德撰禮記述注二十八卷李光坡撰禮記析疑四十六卷方苞撰檀弓疑問一卷邵泰衢撰禮記訓義擇言八卷江永撰深衣考誤一卷江永撰以上見文淵閣著録禮記提綱集解四卷邱元復撰禮記疏略四十七卷張沐撰禮記惜隂録八卷徐世沐撰禮記偶箋三卷萬斯大撰曽子問講録四卷毛竒齡撰禮記詳説無卷數冉覲祖撰禮記章義十卷薑兆錫撰校補禮記纂言三十六卷朱軾重訂元吳澄原本戴記緒言四卷陸奎勳撰禮記類編三十卷沈元滄編學禮闕疑八卷劉青蓮撰檀弓論文二卷孫濩孫撰禮記章句十卷任啓運撰禮記彚編八卷王心敬撰右禮記夏小正解一卷徐世溥撰夏小正注一卷黃叔琳撰大戴禮刪翼四卷薑兆錫撰夏小正詁一卷諸錦撰右大戴記附以上見四庫全書存目禮記類凡二十七部月令臣等謹案鄭志月令一門有古月令續月令及時令嵗時諸目今以夏小正解之類已見大戴記惟續月令及時令嵗時諸書則入此門不復分列古月令諸目云御定月令輯要二十四卷圖説一卷康熙五十四年奉敕撰以上見文淵閣著録古今類纂嵗時部四卷董榖士董炳文同編節序同風録無卷數孔尚任撰時令彚記十六卷餘日事文四卷朱濓撰以上見四庫全書存目月令類凡四部會禮三禮通禮臣等謹案鄭志會禮一門凡禮論禮問及三禮總義皆入之今從欽定四庫全書之例以發明經義者為三禮兼詳歷代制度者為通禮分門編次並為會禮焉學禮質疑二卷萬斯大撰讀禮志疑六卷陸隴其撰郊社禘祫問一卷毛竒齡撰參讀禮志疑二卷汪紱撰右三禮禮書綱目八十五卷江永撰五禮通考二百六十二卷秦蕙田撰右通禮以上見文淵閣著録三禮合纂二十八卷張怡撰讀禮竊注一卷孫自務撰稽禮辨論一卷劉凝撰昏禮辨正一卷毛竒齡撰廟制折𠂻三卷毛竒齡撰大小宗通釋一卷毛竒齡撰學校問一卷毛竒齡撰明堂問一卷毛竒齡撰郊社考辨一卷李塨撰三禮約編十九卷汪基撰三禮會通二卷張必剛撰右三禮禮學彚編七十卷應撝謙撰禮學通考三十卷胡掄撰右通禮以上見四庫全書存目會禮類凡十九部儀注朝廟禮儀雜禮書臣等謹案鄭志儀注一門凡朝廟禮儀以及家禮書儀等雜禮書皆入焉欽定續通志因之今從其例幸魯盛典四十卷康熙二十三年襲封衍聖公孔育圻等恭輯萬夀盛典一百二十卷康熙五十二年內廷諸臣恭輯欽定大清通禮五十卷乾隆元年奉敇撰南巡盛典一百二十卷乾隆三十五年大學士總督髙晉等恭輯欽定滿洲祭神祭天典禮六卷乾隆四十二年奉敕撰千叟宴詩四卷康熙五十二年奉敕編千叟宴詩三十六卷乾隆五十年奉敕編北郊配位議一卷毛竒齡撰右朝廟禮儀朱子禮纂五卷李光地編右雜禮書以上見文淵閣著録學典三十卷孫承澤撰文廟從祀先賢先儒考一卷郎廷極撰頖宫禮樂全書十六卷張安茂撰琉球入太學始末一卷王士正撰辨定嘉靖大禮議二卷毛竒齡撰國學禮樂録二十四卷李周望謝履忠同撰聖門禮樂統二十四卷張行言撰學宫備考十卷彭其位撰太學典祀彚考十四卷張璿撰學宫輯略六卷余炳撰右朝廟禮儀讀禮偶見二卷許三禮撰學記五卷李塨撰家禮辨定十卷王復禮撰四禮寧儉編無卷數王心敬撰婚禮通考二十四卷曹廷棟撰齊家寶要二卷張文嘉撰右雜禮書以上見四庫全書存目儀注類凡二十五部樂類第三樂書琴曲臣等謹案鄭志樂類凡十一門如歌辭題解之類今無其書概從刪併惟以樂書及琴曲為標目云樂書御纂律吕正義康熙五十二年御撰聖祖仁皇帝御纂律吕正義後編一百二十卷乾隆十一年皇上御撰古樂經傳五卷李光地撰古樂書二卷應撝謙撰聖諭樂本解説二卷毛竒齡撰皇言定聲録八卷毛竒齡撰此二書並因推闡考聖祖仁皇帝論樂聖諭證而作樂律表微八卷胡彥升撰律吕新論二卷江永撰律吕闡微十卷江永撰以上見文淵閣著録大成樂律一卷孔貞瑄撰律吕新書衍義一卷吕夏音撰鐘律陳數一卷顧陳垿撰樂經內編二十卷張宣猷撰律吕新書注三卷周模撰賡和録二卷何夢瑶撰易律通解八卷沈光邦撰樂律古義二卷童能靈撰大樂元音七卷潘士權撰律吕新書箋義二卷附八音考略一卷羅登選撰音律節略考一卷潘繼善撰黃鍾通韻二卷都四德撰樂原無卷數舊本題囂囂子撰律吕纂要二卷不著撰人名氏以上見四庫全書存目樂書類凡二十三部琴曲琴旨二卷王坦撰以上見文淵閣著録操縵録十卷胡世安撰溪山琴况一卷徐谼撰琴學心聲二卷莊臻鳯撰琴談二卷程允基撰琴學內編一卷外編一卷曹庭棟撰南曲入聲客問一卷毛先舒撰以上見四庫全書存目琴曲類凡七部小學類第四文字古文音韻法書臣等謹案鄭志小學類八門今分文字音韻古文法書為四門其小學音釋蕃書神書等目並從刪併云文字御定康熙字典四十二卷康熙五十五年奉敕撰欽定西域同文志二十四卷乾隆二十八年奉敕撰欽定增訂清文鑑三十二卷補編四卷總綱八卷補總綱一卷乾隆三十六年奉文鑑敕撰因加補輯聖祖仁皇帝御定清舊本重欽定滿洲蒙古漢字三合切音清文鑑三十三卷乾隆四十四年奉敕撰字詁一卷黃生撰説文繫傳考異四卷附録一卷汪憲撰以上見文淵閣著録他山字學二卷錢邦苞撰六書準四卷馮調鼎撰六書通十卷閔齊伋撰黃公説字無卷數顧景星撰讀書正音四卷吳震方撰字辨七卷熊文登撰六書分類十二卷傳世垚撰説文廣義十二卷程德洽撰天然窮源字韻九卷薑日章撰六書辨通五卷楊錫觀撰六書例解一卷附六書雜説一卷八分書辨一卷楊錫觀撰五經字學考五卷成端人撰六經字便無卷數劉臣敬撰字學正本五卷李京撰字學同文四卷衛執榖撰文字審一卷不著撰人名氏以上見四庫全書存目文字類凡二十二部音韻御定音韻闡微十八卷康熙五十四年奉敕撰欽定同文韻統六卷乾隆十四年奉敕撰欽定叶韻彚輯五十八卷乾隆十五年奉敕撰欽定音韻述微三十卷乾隆三十八年奉敕撰音論三卷顧炎武撰詩本音十卷顧炎武撰易音三卷顧炎武撰唐韻正二十卷顧炎武撰古音表二卷顧炎武撰韻補正一卷顧炎武撰古今通韻十二卷毛竒齡撰易韻四卷毛竒齡撰唐韻考五卷紀容舒撰古韻標準四卷江永撰以上見文淵閣著録重訂馬氏等音外集一卷內集一卷梅建刋不著撰人名古韻通八卷柴紹炳撰古韻叶音六卷楊慶撰佐同録五卷楊慶撰聲韻叢説一卷韻問一卷毛先舒撰韻學通指一卷毛先舒撰韻白一卷毛先舒撰韻蕞一卷徐世溥撰詩韻更定五卷吳國縉撰聲韻源流考無卷數萬斯同撰諧聲品字箋無卷數虞德升撰類音八卷潘耒撰韻學要指十一卷毛竒齡撰韻雅五卷施何牧撰古音正義一卷熊士伯撰等切元聲十卷熊士伯撰古今韻表新編五卷仇廷模撰類字本意無卷數莫宏勳撰韻學臆説一卷王植撰韻學五卷王植撰五方元音二卷樊騰鳯撰詩經叶音辨訛八卷劉惟謙撰詩傳叶音考三卷吳起元撰本韻一得二十卷龍為霖撰音韻源流五十卷潘咸撰韻岐四卷江昱撰音韻清濁鑑三卷王祚禎撰以上見四庫全書存目音韻類凡四十一部古文篆隸考異二卷周靖撰隸辨八卷顧藹吉撰分隸偶存二卷萬經撰以上見文淵閣著録廣金石韻府五卷林尚葵李根同撰石鼓文定本二卷劉凝撰篆文纂要四卷陳䇿撰篆字彚十二卷佟世男撰鐘鼎字源五卷汪立名編以上見四庫全書存目古文類凡八部法書臣等謹案鄭志以法書入小學以畫入藝術欽定續通志因之謹從其例凡一書中兼論書畫者仍歸藝術類書法正傳十卷馮武撰六藝之一録四百六卷倪濤撰以上見文淵閣著録研山齋墨迹集覽一卷法書集覽三卷孫永澤撰書學彚編十卷萬斯同撰草韻彚編二十六卷陶南望撰漢溪書法通解八卷戈守智撰以上見四庫全書存目法書類凡六部皇朝通志卷九十八
