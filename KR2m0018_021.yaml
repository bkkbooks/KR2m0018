body:
  text: 天文略四五星五星伏見留退遲疾順逆臣等謹案五星之伏見留退遲疾順逆莫明晰於晉志而元史術益加詳惟繁簡踈密或有不同我朝用西法推步凡頒來嵗之朔經緯躔度預載全書驗無差忒兹據乾隆九年以後七政時憲約舉其綱領云五星近太陽則伏逺大陽則見星體大黃道正升正降緯度在北則速見遲伏星體小黃道斜升斜降緯度在南則遲見速伏五星之體金星最大木水二星次之土星又次之火星最小星體大則太陽在地平下之度少即可見星體小則太陽在地平下之度多方可見土星當地平太陽在地平下十一度可見木星水星當地平太陽在地平下十度可見火星當地平太陽在地平下十一度三十分可見金星當地平太陽在地平下五度可見五星行上弧順輪心行自西而東為順為疾行下弧逆輪心行自東而西為退為逆五星距地有逺近次輪有大小上弧之度多於下弧其多少又各不同土木二星輪小而距地逺上下弧不甚懸殊土星上弧一百九十二度有餘下弧一百六十七度有餘木星上弧二百度有餘下弧一百五十九度有餘火金水三星輪大而距地近上弧之度愈多下弧之度愈少火星上弧二百八九十度下弧七八十度金星上弧二百七十度下弧九十度水星上弧二百二十二度下弧一百三十八度五星與太陽同度太陽在星與地之間星為太陽所掩伏而不見是為合伏土木火三星能距太陽半周地在星與太陽之間星與太陽正相對照如月之望是為衝金水二星常繞太陽行不能相距半周星在太陽與地之間於次輪下半退行正當太陽之下如月之朔是為退伏土木火三星合伏後漸逺太陽則晨見順行先疾後遲遲極而留為留退初退行先遲後疾距太陽一百八十度為退衝旋夕見退行先疾後遲遲極而留為留順初順行先遲後疾漸近合伏則夕不見金水二星合伏後漸逺太陽則夕見順行先疾後遲遲極而留為留退初退行先遲後疾漸近太陽則夕不見復與太陽同度為合退伏漸逺太陽則晨見退行先疾後遲遲極而留為留順初順行先遲後疾漸近合伏則不見土星合伏後約踰二十五日移三度餘晨見東方順行約踰一百日移七度餘為留退初退行約踰六十日移四度餘為退衝次日夕見約踰七十日移四度餘為留順初順行約踰一百日移九度餘夕不見約踰十五日移二度餘復為合伏木星合伏後約踰十五日移四度餘晨見東方順行約踰一百十日移十七度餘為留退初退行約踰五十五日移五度餘為退衝次日夕見約踰六十日移五度餘為留順初順行約踰一百十日移十五度餘夕不見約踰十五日移四度餘復為合伏火星合伏後約踰三十七日移二十餘度晨見東方順行約踰二百七十日移一百四十餘度為留退初退行約踰二十五日移五度餘為退衝次日夕見約踰三十日移六度餘為留順初順行約踰三百三十日移二百八十餘度夕不見約踰四十七日移三十餘度復為合伏金星合伏後約踰二十五日移三十餘度夕見西方順行約踰二百四十日移七度餘夕不見次日移一度為合退伏又次日移一度晨見東方約踰二十日移七度餘為留順初順行約踰二百二十日移二百六十餘度晨不見約踰二十日移二十八度餘復為合伏水星合伏後約踰十二日移二十餘度夕見西方順行約踰二十八日移二十餘度為留退初退行約踰二日移一度夕不見約踰四日移三度餘為合退伏約踰六日移四度餘晨見東方約踰七日移二度餘為留順初順行約踰二十日移二十餘度晨不見約踰十五日移二十餘度復為合伏臣等謹案物理小識云西國近以望逺鏡測太白則有時晦有時光滿有時為上下弦計太白附日而行逺時僅得象限之半與月異理因悟時在日上故光滿而體微時在日下則晦在旁故為上下弦也辰星體小去日更近難見其晦明而其運行不異太白度亦與之同理或問熒惑嵗填去日逺近曰熒惑在嵗填內在日外蓋為其行黃道速於二星遲於日也木星在火外以其行黃道速於土遲於火填星在木外其行黃道最遲也恆星無視差七政皆有視差且以此斷以上語簡而理明録之以備稽覽五星用數康熙二十三年甲子天正冬至為數元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十以上五節五星所同後不重録土星每日平行一百二十秒小餘六二二五五一土星最高每日平行十分秒之二又一九五八三土星正交每日平行十分秒之一又一四六七二八土星本天半徑一千萬土星本輪半徑八十六萬五千五百八十七土星均輪半徑二十九萬六千四百一十三土星次輪半徑一百零四萬二千六百土星本道與黃道交角二度三十一分氣應七日六五六三七四九二六土星平行應七宫二十三度一十九分四十四秒五十五微土星最高應十一宫二十八度二十六分零六秒零五微土星正交應六宫二十一度二十分五十七秒二十四微木星每日平行二百九十九秒小餘二八五二九六八木星最高每平行十八秒之一又五八四三三木星正交每日平行百分秒之三又七二三五五七木星本天半徑一千萬木星本輪半徑七十萬五千三百二十木星均輪半徑二十四萬七千九百八十木星次輪半徑一百九十二萬九千四百八十木星本道與黃道交角一度一十九分四十秒氣應七日六五六三七四九二六木星平行應八宫零九度一十三分一十三秒一十一微木星最高應九宫零九度五十一分五十九秒二十七微木星正交應六宫零七度二十一分四十九秒三十五微火星每日平行一千八百八十六秒小餘六七三五八火星最高每日平行十分秒之一又八三四三九九火星正交每日平行十分秒之一又四四九七二三火星本天半徑一千萬火星本輪半徑一百四十八萬四千火星均輪半徑三十七萬一千火星最小次輪半徑六百三十萬二千七百五十本天高卑大差二十五萬八千五百太陽高卑大差二十三萬五千火星本道與黃道交角一度五十分氣應七日六五六三七四九二六火星平行應二宫一十三度三十九分五十二秒一十五微火星最高應八宫初度三十三分一十一秒五十四微火星正交應四宫一十七度五十一分五十四秒零七微金星每日平行三千五百四十八秒小餘三三五一六九與太陽平行同金星最高每日平行十分秒之二又二七一五九金星伏見每日平行二千二百一十九秒小餘四三一一八八六金星本天半徑一千萬金星本輪半徑二十三萬一千九百六十二金星均輪半徑八萬八千八百五十二金星次輪半徑七百二十二萬四千八百五十金星次輪面與黃道交角三度二十九分氣應七日六五六三七四九二六金星平行應二十分一十九秒一十八微與數元甲子年天正冬至次日子正初刻太陽平行度同金星最高應六宫零一度三十三分三十一秒零四微金星伏見應初宫一十八度三十八分一十三秒零六微水星每日平行三千五百四十八秒小餘三三五一六九與太陽平行同水星最高每日平行十分秒之二又八八一一九三水星伏見每日平行一萬一千一百八十四秒小餘一一六五二四八水星本天半徑一千萬水星本輪半徑五十六萬七千五百二十三水星均輪半徑一十一萬四千六百三十二水星次輪半徑三百八十五萬水星次輪心在大距與黃道交角五度四十分水星次輪心在正交當黃道北交角五度零五分一十秒其與大距交角較三十四分五十秒水星次輪心在中交當黃道北交角六度一十六分五十秒其與大距交角較三十六分五十秒水星次輪心在正交當黃道南交角六度三十一分零二秒其與大距交角較五十一分零二秒水星次輪心在中交當黃道南交角四度五十五分三十二秒其與大距交角較四十四分二十八秒氣應七日六五六三七四九二六水星平行應二十分一十九秒一十八微與數元甲子年天正冬至次日子正初刻太陽平行度同水星最高應十一宫零三度零三分五十四秒五十四微水星伏見應十宫零一度一十三分一十一秒一十七微月五星凌犯臣等謹案月五星凌犯亦猶日月薄蝕自有常度可推歷來史傳多著占應甚無取焉西法于月星相距之度分為之預算皆由行度遲速經緯逺近得之則談天家無庸侈為罕見異聞矣兹備列月五星恆星之常度於左太陰與五星恆星相距十七分以內曰凌十八分以外曰犯兩緯同度曰掩以本日太陰經度在星前次日太陰經度在星後為入限緯度在北為上在南為下如同在黃道北逺者為在上近者為在下同在黃道南近者為在上逺者為在下太陰在上者以三度為距限太陰在下者以一度為距限五星自相距及與恆星相距三分以內曰凌四分以外曰犯兩緯同度曰掩以本日此星經度在彼星前次日此星經度在彼星後為入限緯度無論在上在下皆以一度為距限五星自相距以行速者為凌犯之星行遲者為受凌犯之星如遲速相同而一順一逆則以順行者為凌犯之星逆行者為受凌犯之星太陰與五星皆循黃道右旋皆得相距太陰行黃道南北不過六度填星行黃道南北不過三度嵗星行黃道南北不過二度熒惑行黃道南北不過五度太白行黃道南北不過十度辰星行黃道南北不過四度故太隂每凌犯五星五星每自相凌犯恆星在黃道南北三度以內者太陰五星皆得與相距四度以內者太陰填熒惑太白辰得與相距五度以內者太陰熒惑太白辰得與相距六度以內者太陰熒惑太白得與相距七度以內者太陰太白得與相距十度以內者太白得與相距紫微垣諸星皆在黃道北二十度外太陰五星莫得犯之太微垣右執法右上將左執法左上相長垣第三第四星靈臺三星明堂第一第二星在黃道南北三度內太陰五星皆得犯之長垣第一星在黃道北四度內太陰填熒惑太白辰得犯之內屏第二星謁者在黃道北五度內太陰熒惑太白辰得犯之內屏第一第三星右次將長垣第二星明堂第三星在黃道南北六度內太陰熒惑太白得犯之五帝座第五星三公第一第三星內屏第四星右次相左次相在黃道北十度內太白得犯之其他諸星在黃道北十度外無犯焉天市垣惟左垣墻宋星在黃道北十度內太白得犯之角宿角第一星平道二星進賢二星在黃道南北三度內太陰五星皆得犯之天門第二星在黃道南六度內太陰熒惑太白得犯之角第二星天門第一星在黃道南北十度內太白得犯之亢宿亢第一第四星在黃道北三度內太陰五星皆得犯之折威第六第七星在黃道南七度內太陰太白得犯之亢第二星折威第二第三第四第五星在黃道南北十度內太白得犯之其他諸星在黃道南北十一度外無犯焉氐宿氐第一第二星在黃道南北三度內太陰五星皆得犯之第三星在黃道北五度內太陰熒惑太白辰得犯之第四星天輻二星在黃道南北十度內太白得犯之其他諸星在黃道南北十度外無犯焉房宿房第三第四星鍵閉星鈎鈐二星東咸第三第四星日星在黃道南北三度內太陰五星皆得犯之罰第三星西咸第三第四星東咸第二星在黃道北四度內太陰填熒惑太白辰得犯之房第一星在黃道南五度內太陰熒惑太白辰得犯之東咸第一星在黃道北六度內太陰熒惑太白得犯之西咸第二星在黃道北七度內太陰太白得犯之房第二星罰第二星在黃道南北八度內太白得犯之其他諸星在黃道南北十三度外無犯焉心宿心第一第二星在黃道南四度內太陰填熒惑太白辰得犯之第三星在黃道南六度內太陰熒惑太白得犯之積