body:
  text: 地理略六水道二黃河黃河源出崑崙山在今回部極西境有三源一為喀什噶爾河出喀什噶爾城極西之哈喇庫勒迤北兩水合流南注東會支河經城東流計千餘里一為葉爾羌河出葉爾羌城西南山內紆折出山分流經城左右復合亦千餘里會喀什噶爾河一為和闐河出南山二源分流名玉隴哈什河哈喇哈什河夾額里齊城而北合流數百里與喀什噶爾河葉爾羌河會東流有阿克蘇河源出北山名托什干河經烏什城北迤南至阿克蘇城南又南流來會遂名塔里木河東流有木素爾河源出北山西南流又東過拜城又東過賽刺木城合庫車之赫色勒河過沙雅爾城北來會又東流有海都河源出北山之裕勒都斯經哈喇沙爾城西滙為博斯騰淖爾自淖爾流出經庫隴勒境來會又東滙於羅布淖爾而伏即古所謂鹽澤蒲昌海也河水伏流千餘里東南有孔道斜直青海之西境重發於巴顔喀喇山噶達素齊老之上涌為天池水色獨黃流為阿勒坦河三百餘里入于鄂郭淖爾即元史所謂星宿海也東南流出注於札楞淖爾又東南注於鄂楞淖爾又折東南流始名黃河又東南流經阿木奈瑪勒占木遜山之南亦名大雪山即禹貢導河之積石也其南有三昆都倫河一曰得特昆都倫一曰多木達都昆都倫一曰道喇昆都倫三河先後來注之折而轉西北流繞大雪山之北又折東流經庫庫淖爾之南庫庫淖爾即青海也有恰克圖河魁屯西里河碩爾渾河來會又東北入甘肅河州歸德所邉臣等謹案古言河出崑崙莫詳其地史記漢書言張騫窮河源河出蔥嶺一源出于闐伏於鹽澤重出於積石酈道元水經注因之但言之未能詳盡論者疑為荒邈不經元篤什窮源得之於星宿海反以今大雪山為崑崙而以河源為在崑崙之西仍訛踵謬習傳不察乾隆四十七年皇上命使告祭河神務窮真源始知河之重源在星宿海西三百餘里噶達素齊老之上天池濆涌水色獨黃流為阿勒坦河為黃河重發之明證而崑崙在回部極西在今實為版圖之內故喀什噶爾葉爾羌之西巨嶺綿亘千有餘里即古之蔥嶺二源交發所謂河出蔥嶺也和闐即于闐所謂一源出于闐也蔥嶺及和闐南山岡巒橫接實崑崙之支體即爾雅所云河出崑崙墟也羅布淖爾之伏阿勒坦河之重見稽圖勘迹瞭如指掌元人誤以大雪山為崑崙者以河經其地有三昆都倫河來入因字音之近而妄指之其舛甚矣伏讀聖製河源詩讀宋史河渠志文河源簡明語切指前古相傳之誤並命儒臣纂輯河源紀略諭旨煌煌原委秩然大河靈迹至聖代而始論定謹稟承載述一洗從前各志之舛略云黃河入河州有青海南境諸水來會過小積石山經蘭州府西有大夏河即古灕水來會又東有洮河來會洮河見後又東有湟水來會湟水見後又東有莊浪河來會又東循長城經金縣境有浩尾河來會又北有會寧安定二縣水來會出長城又東南流入折東北有清水河自固原州來會又經靈州北東北經寧夏府境又東北出邉經河套鄂爾多斯部地分流復合折東南經烏喇特部境又東南有黑河自歸化城境來會南流入山西平魯縣邉界自此而南出河套東岸為山西境西岸為陜西境經河曲縣西府谷縣東又經保德州東岢嵐州西又經神木縣東興縣西有蔚汾水自嵐縣經興縣來會又經葭州東臨縣西過孟門鎮又經永寧州西吳堡縣東有白泉河即古離石水自永寧州合寧鄉縣諸水來會折西南經清澗縣東有榆林水合米脂縣綏德州諸水及奢延川來會又經石樓縣西延川縣東又經永和縣西延長縣東有延水自延安府來會又南經大寧縣西有昕川合隰州蒲縣大寧縣諸水來會又南經宜川縣東吉州西其南為壺口山又南有汾川水合銀川丹陽諸水來會又東南經鄉寧縣西韓城縣東其東岸為河津縣之龍門山西南流有汾水來會汾水見後又經郃陽縣東臨晉縣西又經朝邑縣東蒲州永濟縣西有涑水自絳縣聞喜縣合安邑解州猗氏臨晉諸水來會又南經朝邑縣南有洛河來會洛河見後又經華隂縣東有渭水來會渭水見後折東流至潼關南岸入河南閿鄉縣境又東經芮城縣南又經靈寶縣北有宏農河來會又經陜州北平陸縣南又東過底柱山經澠池縣北垣曲縣南有清水出絳縣沇水出王屋山來會又東北岸亦入河南界經新安縣北濟源縣南又經孟津縣北孟縣南又經鞏縣北有濟水自北來會濟水見後又經溫縣南鞏縣北又經汜水縣北有洛水來會洛水見後又東北有豬龍河來會豬龍河見後又東南有沁水來會沁水見後又經滎陽縣北又東經滎澤縣北原武縣南鄭州北又經陽武縣南中牟縣北又經延津縣南祥符縣北封邱縣南陳留縣北又東南經南陽考城縣北又東入山東界經曹縣南又東經單縣南又東南流入江南界經碭山縣北豐縣南蕭縣北沛縣南又東南經徐州府城北又經邳州南睢寧縣北又東經宿遷縣南桃源縣北又東南至清河縣南即清口淮水洪澤湖水來會淮水見後東北流經山陽縣之清江浦北經阜寧縣北安東縣南又東北過雲梯關入於海臣等謹案禹貢舊河道自積石以下至今滎澤縣與今水道並同滎澤以下自原武縣北東徑陽武延津二縣北新鄉汲縣南又東北至濬縣西南大伾山在焉折北行經內黃湯隂安陽會漳水經臨漳大名成安肥鄉曲州平鄉廣宗至巨鹿古大陸澤在焉又北經南宫新河冀州束鹿深州衡水武邑武強阜城獻縣交河青縣靜海大城寶坻至天津直沽口入於渤海入河諸水洮河源出洮州廳西南邉外之西傾山東麓入邊經洮州廳南岷州西北又東北經舊臨洮府南又北有三岔河自邊外來會西北流至蘭州府西境入黃河湟水即洛都水源出西寧府西北邉外當青海之東東流入西寧邊有北川河即古破羌水南川河即古六谷水並會東南流經