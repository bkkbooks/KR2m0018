body:
  text: 諡略八追諡明代忠節二通諡節愍八百三十六人逰擊竇永澄贊理通判董爾礪守備江萬春撫順千總王命印都司陳尚仁王崇信徐國全分守遼海道左參政顧頤開元兵備簽事崔儒秀自在州知州段展瀋陽參將夏國卿同知陳柏寧逺通判金啓倧鎮守永平薊鎮總兵官朱國彥巡撫順天右副都御史整飭薊州邊備王元雅保定推官李獻明署薊州事永平推官何天球遵化知縣徐澤遵化知縣武起潛薊鎮遵化遊擊彭文炳香河知縣任光裕永平道標中軍守備一作都司程應琦一作竒永平推官盧一作羅成功督師軍前監紀永平推官鄭感民三屯營副總兵官焦延慶東勝左衛指揮簽事張國翰一作端中書舍人廖一作唐汝欽得勝堡參將李全保安州知州閻生斗靈邱知縣蔣秉采靈邱守備于世竒茨溝守備張修身户部主事趙悅保定通判王禹佐昌平守備咸一作威貞吉順義知縣上官藎順義遊擊冶國器都指揮蘇時雨寶坻知縣趙國鼎安肅知縣鄭延任大城知縣武維周安州知州崔維葎蘭州知州薛一鶚總督薊遼保定軍務兵部右侍郎右簽都御史吳阿衡任邱知縣白慧元慶都知縣黃承宗文安知縣王鑰户部員外郎李崇德蠡縣知縣王采新河知縣崔賢故城一作固安知縣王九鼎青縣一作興濟知縣張文煥興濟一作青縣知縣錢珍淮安同知周霖雨安平知縣孔聞俊趙州知州王端冕慶雲知縣陳緘通志作針靈夀知縣馮登鰲吏部考功司員外郎耿蔭樓知州馬士偉尚寶司丞孫鑰孫之浩中書舍人孫之沆一作沅鄒平知縣魏克家鹽山知縣陳志濟南推官陸燦山東分巡濟南道參政周之訓山東提學副使翁鴻業山東都轉鹽運使唐世熊濟南府知府茍好善濟南同知陳虞孕濟南通判熊烈獻署臨清州事山東布政司理問薑道元歷城知縣韓承宣邱縣知縣髙重光署武定州事濟南通判馬嗣煜臨邑知縣宋希堯博平知縣張列宿茌平知縣黃廷一作律極武城知縣李承一作永芳巨鹿知縣郭司南兵備道張斗姚恭王之楨副總兵江一作汪翥饒一作陳勳整飭霸州道副使趙輝霸州知州丁師羲湖廣右布政使李時茪一作蕘户部主事馬嗣烋兵科給事中周而淳分巡登萊道兵備簽事邢國璽河間府同知姚汝明襄陽知縣一作推官賈太初柏鄉知縣丁茂桂阜城知縣吕大成台州府知府傅梅文華殿中書舍人孟魯鉢張鳯鳴定州知州唐鉉黃州推官侣鶴舉富陽知縣杜斗愚平鄉知縣杜前山東巡撫兖西道簽事李格臨清總兵官劉源清總督宣大兵部侍郎右副都御史張宗衡户部員外郎邢泰吉臨汾知縣尹任太常寺少卿張振秀陽信知縣張豫卿鄒平知縣朱迥一作溱武城知縣任萬民兖州同知談絲同知曽一作曹文蔚通判一作運河同知閻鼎一作調鼎推官李昌期魯府左長史俞起蛟滋陽知縣郝芳聲滕縣知縣瞿騫兵部車駕司郎中劉宏緒萊蕪知縣馮守禮户部主事楚煙兵部職方司主事劉大年東阿知縣吳汝宗髙苑知縣周啓元豐縣知縣劉光先沭陽知縣劉士璟一作燝夀光知縣李耿莒州知州景淑範武邑知縣鄭集命六合知縣郭凝鼎淮安通判劉文蔚山東副使申為憲萊陽知縣陳顯際吏部稽勳司郎中宋應亨內閣中書舍人趙士驥沙河知縣項易遼東寧前衛副總兵陶宗儀濱州知州王道隆自在州知州周繼謨三關遊擊邵定前屯衛總兵官李鳴鳯寧逺總兵官王定宸前屯衛副總兵羅文耀薊州兵備道鞠世讓汝寧通判楊爾俊真定知縣髙知彰任縣知縣李唐衡州府同知鄭奉先以上封疆殉節諸臣一百四十九人定逺侯鄧文明鎮逺侯顧肇迹西寧侯宋裕德清平侯吳遵周陽武侯薛濓彭城伯張光祖恭順侯勳衛吳汝徴寧逺伯李尊祖錦衣衛指揮同知許達允順天通判張凝和提督順天學政福建道御史陳純德户部員外郎寧承烈貴州道御史巡視山海居庸二關俞志虞內閣中書舍人宋天顯光祿寺署丞于騰雲一作蛟右都督方履泰錦衣衛千户李國祿錦衣衛指揮同知李若圭濮州知州馬象乾大同總兵官朱三樂密雲副總兵吕應蛟保定左衛指揮文昌運劉洪恩戴世爵劉元靖吕九章吕一照一作李照李一作吕一廣光祿寺少卿張羅彥廣靈知縣阮泰邠州知州韓東明南宫知縣彭士宏中書舍人王永隆錦衣衛指揮使蕭偲户部郎中葛凝秀工部郎中寇可教兵部主事楊會英沈邱知縣李昌齡太醫院吏目楊元真定督標遊擊陳三傑光祿寺監事胥自修湖廣督學道簽事周大啓猗氏知縣李澍聲濟南簽事劉世芳定海知縣朱懋華潮州司理李育新歸德通判張垣崇虎賁左衛參軍李正光左都督劉繼祖錦衣衛都指揮馬國瑊吏部郎中張柳芳户部員外郎張三傑錦衣衛指揮使張養所虎賁右衛世襲指揮使劉一松錦衣衛指揮張國維户部主事陳貞達錦衣衛指揮髙甲北鎮撫司都指揮使梁清宏商城知縣張國光儀封知縣張三益大同總兵官都督簽事汪登瑞滎陽知縣徐兆任呈貢知縣黃卷布政司參議王若之臨漳知縣梁希阜天津兵備道陳六韐刑科給事中李汝璨御史鄭封兵部主事尹詔永平通判韓上桂知縣毛協恭西寧道副使李豫樂亭知縣施溥户部員外郎范方博羅知縣徐有度平涼同知郭寅日巡撫甘肅右簽都御史楊汝經延綏總兵官宋偉保定知縣楊珮監察御史王與印太常寺少卿傅鍾秀劉河遊擊李中孚以上甲申殉節諸臣八十一人儀封知縣周寶瑜兩淮都轉鹽運使楊振熙一作時熙監餉知縣吳道正江都縣丞王志端一作志瑞副總兵官汪思誠揚州府同知一作監軍道簽事王纘爵江都知縣羅伏龍泗州援將侯方巖福山副總兵官魯之璵江隂訓導馮厚敦常熟知縣王鐡武英殿中書舍人文震亨兵部職方司主事一作杭州府同知王道焜髙岱葉汝蘅一作􅀢户部郎中劉成治中書舍人徐念祖户部