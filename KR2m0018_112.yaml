front:
  text: 欽定四庫全書皇朝通志卷一百十二
  hash: sha256:a749ecb595132fc99411d6580ced6346e3076355f101488fba101829e1c56115
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_112-1a, image: WYG0645/WYG0645-0503c.png}
body:
  text: 校讐略八欽定四庫全書提要校正書籍子部集部共八十八條孔叢子舊本題漢孔鮒今按其書記鮒之沒自不得為鮒撰朱子疑其文氣不似西漢即如六宗之説與偽孔傳偽家語並同是亦晚出之明證也漢賈誼新書書録解題謂非誼本書今考漢書所引各條皆與今本同陳氏所云非篤論也漢桓寬鹽鐵論諸史皆列之儒家千頃堂書目誤入史部食貨類中今校正唐太宗帝範述古堂書目誤入疏諫類今校正入儒家唐鄭氏女孝經書録解題誤題為班昭作今據原序校正司馬法舊題齊司馬穰苴撰隋唐志並同考史記稱威王命大夫追論古者司馬兵法而附穰苴於其中則非穰苴自撰明矣明曹允儒握機經三卷又以孫子十三篇吳子六篇為握機緯千頃堂書目有元人孫子握機緯十三卷劉寅吳子握機緯二卷與此書相符殆即是書而誤題之也管子舊有房元齡注朝公武以為尹知章所托考唐書藝文志自有尹知章注管子三十卷則朝氏考之未審也宋傅霖刑統賦霖以竇儀等所作刑統不便記誦乃韻而賦之並為之注讀書志稱或人為之注蓋未之詳核也宋陳敷農書書録解題作陳雱殆因字形相近而訛今據本書標名校正唐王冰注黃帝素問讀書志誤作王砅今據唐宋藝文志校正隋巢元方巢氏諸病源候論隋志稱吳景賢撰不及巢氏書宋志有巢氏書而無吳書惟新唐書志二書並載一題吳景一注巢元方疑當時本屬官書或為監修或為編撰標題遂異耳讀書志止列巢氏足證前史之謬其隋史作吳景賢賢蓋監字之訛今校正唐王燾外臺祕要卷首題校正醫書局校理林億等名述古堂書目因誤題林億撰今校正夀親養老新書四卷前一卷宋陳直撰後三卷元鄒鉉續撰直書本名養老奉親文獻通考誤倒其文稱為奉親養老此本與鄒書合編當係鄒改題今名也傳信適用方不著撰人名氏考書録解題有傳道適用方稱吳彥夔撰與此本卷帙正同知此即吳書當係陳氏訛信為道耳急救仙方不著撰人名氏宋志及諸家書目皆不著録惟焦竑經籍志載有救急仙方注云見道藏則係誤倒其文也今據道藏目録校正晉劉徽海島算經按徽自序是書當名重差初無海島之目亦但附於勾股之下不别為書唐書藝文志始有劉徽海島算經之名而隋志唐志又有劉徽九章重差圖或亦以另本單行至唐志又列劉向九章重差一卷則直誤以劉徽為劉向而重出矣今據永樂大典本校正唐王孝通緝古算經唐志及王堯臣崇文總目皆誤作李淳風注今據本書首題孝通撰並注校正不列淳風之名北周衛元嵩元包崇文總目誤以為唐人文獻通考亦沿其訛今據楊楫原序校正宋蔡沈洪範皇極內外篇經義考作洪範內外篇今據王圻續通考校正漢京房京氏易傳三卷讀書志誤以為即錯卦不知錯卦八卷别自為書已佚不傳今據本書校正明萬民英星學大成千頃堂書目以為陸位撰今據本書自序及凡例校正金張行簡人倫大統賦千頃堂書目不著撰人名氏實為脫漏今據本書標名校正唐朱景元唐朝名畫録唐書藝文志題曰唐畫斷文獻通考因之今據景元自序校正宋劉道醇五代名畫補遺讀書志誤劉道成書録解題則誤題為五代名畫記文獻通考又據兩家之目而重載之今據書首陳詢直序校正宋李豸德隅齋畫品書録解題誤作德隅堂今據原書校正宋李孝美墨譜文獻通考題為墨苑按墨苑别係一書見是書出灰磨試二條注中馬考殆因此而訛今據卷首馬涓李元膺二序校正宋蔡襄茶録文獻通考誤題為試茶録今據襄自序校正東溪試茶録舊本題宋宋子安撰讀書志誤作朱子安今據宋藝文志及左圭百川學海校正僧贊寧筍譜讀書志誤作僧惠崇撰今據書録解題及王得臣麈史校正唐羅隱兩同書書録解題引中興書目以為唐吳筠撰考宋藝文志别有吳筠兩同書與此書異則謂為筠撰者誤也漢班固白虎通義崇文總目作白虎通德論考後漢書固本傳稱天子會諸儒講論五經作白虎通德論令固撰集其事蓋諸儒議奏統名曰白虎通德論固撰集後乃名曰通義今據唐書藝文志校正宋戴埴鼠璞文獻通考誤入小説家今校正入雜家類宋黃伯思東觀餘論述古堂書目誤入金石門今校正入雜家類宋洪邁容齊五筆述古堂書目誤入類書門今校正入雜家類唐李綽尚書故實宋志凡兩載之一見史部傳記類一見子部小説類而注其下云綽一作緯實一作事今據曽慥類説所引亦明標綽名則作緯者誤矣宋宋敏求春明退朝録文獻通考凡兩載之一入故事一入雜家自係一書重出今觀所記雖述宋代掌故而雜説雜事亦錯出其間故編入雜家類宋宋祁筆記或誤作宋庠至卷末庭戒治戒左志右銘皆祁身後事應係其子孫編入宋王欽臣王氏談録舊題王洙撰即欽臣之父蓋以卷末觀覽書目有王洙敬録字而誤也今校正宋龎元英文昌雜録宋藝文志誤入故事今校正入雜家類宋朱辨曲洧舊聞文獻通考誤入小説家今考其書既涉史事亦近諧謔兼及神怪故編入雜家類宋應俊輯琴堂諭俗編宋志列入子部雜家而史部刑法類中又出諭俗編一條前後重復且意在於諭民並非斷獄實於刑法門不合今校正入雜家類元李冶敬齋古今黈文淵閣書目誤題宋人今校正初學記唐書藝文志載元宗事類及是書注曰張説類集徐堅韋述等分撰讀書志則專舉是書稱初係張説類集又經堅與韋述等分門撰次今考南部新書載開元中集賢學士韋堅等纂經史文章之要以類相從上制曰初學記當以朝氏之説為是而唐志相連遞及誤合兩書為一耳唐林寶元和姓纂鄭志作李林寶撰然樵於氏族略中又譏寶作姓纂而不知林姓所自出則知藝文略中多一李字顯為傳刻所誤增耳宋馬永易實賔録其後集為文彪續補書録解題標列甚明考讀書志稱馬永易異號録宋藝文志並載實賔異號二録皆題永易撰今按是書初名異號録至後集始易其名因并追改本書朝氏所見蓋為未經增廣之本宋志直以一書誤為兩書矣宋任廣書敘指南按廣係浚儀人文獻通考訛作任浚今校正明李黼王制考雜採經史制度自分門類並非專疏禮記之王制經義考附列禮記未免循名失實今校正唐韋絢劉賔客嘉話録唐志作劉公嘉話録宋志既載劉公嘉話又載賔客嘉話誤分兩書今校正唐馮贄雲仙雜記書録解題又有馮贄雲仙散録考孔傳續六帖所引散録各條皆今本雜記中語則實非兩書矣宋鄭文寶南唐近事宋史藝文志誤作南唐近事集今校正宋王闢之澠水燕談録宋志誤作王關之文獻通考又誤作王闢今據本書題名校正宋陳長方步里客談宋志作陳唯室考長方號唯室著其號而略其名殊失史家載筆之體今校正梁吳均續齊諧記唐志作吳筠按吳筠乃唐大厯時人此書隋志已著録則非吳筠明甚今校正隋顔之推還寃志唐志誤作寃魂志今據文獻通考宋志校正唐高彥休唐闕史書録解題云彥休自號參寥子唐志亦同宋志既載參寥子闕史又别出高彥休闕史誤為兩人兩書今校正宋吳淑江淮異人録尤袤遂初堂書目誤作江淮異人傳然諸書徴引俱題作録今據校正梁任昉述異記讀書志以唐志述異記題祖沖之作為誤按祖沖之原有述異記隋志已著録當是别是一書朝氏未免誤糾矣宋周文玘開顔集文獻通考誤作周文規今據本書標名校正魏王弼老子注隋志作老子道德經王弼注舊唐書經籍志作元言新記道德亦稱弼注新唐書又稱元言新記道德為王肅撰而以弼所注者為新記元言道德既已一書兩出而書名顛倒益滋訛舛矣列子舊本題列禦冦撰高似孫緯略謂並無其人今考爾雅疏實引其書則知非莊子寓名之流不得斥為偽托也後蜀彭曉周易參同契通真義唐志誤列於五行經義考又誤列之周易今校正入道家類晉葛洪神仙傳諸家著録並同隋志誤作列仙傳今校正何粲亢倉子注考亢倉子為唐處士王士元所補高似孫子略誤以士元為王褒讀書志又誤以粲作璨今校正明鄭璞輯揚子雲集六卷所收諸針凡三十篇考雄針實止二十八篇璞蓋誤入崔駰崔瑗諸作也今校正晉陶潛淵明集舊本八卷昭明太子所定此本為北齊陽休之編誤增入聖賢羣輔録孝傳二書今校正仍刪存八卷以符原第宋鮑照參軍集舊本題作昭唐人避武后諱也又照本東海人讀書志誤作上黨人今並校正唐吳筠宗元集三卷附録元綱論一卷內丹九章經一卷宗元為筠私諡元綱論見新舊唐書當為筠作至內丹九章經未免荒誕今姑以舊本存之唐釋貫休禪月集文獻通考又别載貫休寶月集一卷考其門人曇域序是集初不云其别有書馬考蓋誤載也宋蘇轍欒城集焦竑經籍志又别出黃門集七十卷諸家並未著録蓋本欒城集而誤分為二也今校正宋黃裳演山集焦竑經籍志誤作兼山集今據宋志校正宋周行已浮沚集書録解題作浮沚先生集宋志既載行已集又别出周博士集未免抵牾今校正宋黃彥平三餘集蓋義取三餘讀書見於原序宋志誤作玉餘今校正宋洪邁野處類稿為詩集文獻通考既以别集詩集分類又收是書入别集中則亦未見其本而誤載也宋徐照芳蘭軒集照嘗自號山民故又名山民集書録解題誤作天民今校正宋周弼汶陽端平詩雋考弼本汶陽人書首菏澤李龏序紀述甚詳千頃堂書目既誤題新建又稱為明洪武間人尤屬訛謬今校正宋鄧牧伯牙琴蓋其詩集義取知音難遇也錢曽讀書敏求記誤入小説家今校正入别集類元蕭㪺勤齋集焦竑經籍志作勤齋貞敏集諡法齋名並稱未免煩復今據永樂大典本校正明王翰梁園寓稿焦竑經籍志止稱寓稿脫去梁園之名寓字無著今校正唐李善文選注六十卷李善注自南宋以來皆與五臣注合刻此本為毛晉所刻雖稱從宋槧單行本校正今考書內尚有向曰濟曰各條刋除不盡則晉亦因六臣本削去五臣獨留善注耳六臣注文選崇文總目以五臣注誤列於李善注本之前今校正陳徐陵玉臺新咏大唐新語元和姓纂均稱玉臺集今據本書校正唐元結篋中集詩凡二十四首館閣書目皆稱元結作今校正作者凡七人沈千連王季友于逖孟雲卿張彪趙微明元季川宋謝枋得文章軌範讀書敏求記誤入詩文評今校正入總集類唐孟棨本事詩諸家稱引並作棨字唐志誤作孟啓今校正宋張戒嵗寒堂詩話讀書敏求記誤作趙戒今據宋志校正宋嚴羽滄浪詩話舊本列於詩集之首題曰滄浪吟卷今校正析入詩話類宋王灼碧雞漫志詳述曲調源流讀書敏求記誤入子部今校正入詞曲類皇朝通志卷一百十二
