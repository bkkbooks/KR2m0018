body:
  text: 欽定四庫全書皇朝通志卷一百十五金石略一臣等謹按通志列金石一門實鄭氏創例臣等續編五朝通志其自五代以迄前明既已纂輯成帙伏惟本朝列聖天章睿藻垂範墨池固與琬琰圖球永為珍祕而聖謨神算駿烈豐功昭示萬世之意無不隱寓乎其間至我皇上聖以繼聖用集大成巨幅鴻篇備賅衆妙貞珉偶勒具有精深則即金石一略而我朝授受之宏規於是可仰窺萬一固非漢勒鴻都之篇唐著屏風之帖所可比擬又豈徒如鄭氏所稱承音旨見風猷而已哉臣等謹次金刻總一卷御書處刻石一卷自大內暨宫苑京師以及各直省恭刻列聖及我皇上宸翰凡五卷準宛平于奕正天下金石志例各以地相屬至於臣工之書其有經欽定奉敕刻石者亦附載焉金臣等謹按五帝以來皆鑄金以垂久逺禹鑄九鼎湯勒盤銘尚矣外此鐘鼎尊彛刀幣泉貨之屬見於圖譜者鄭志咸甄録之三代以後刻石多而笵金少鄭氏所收者亦僅矣我朝代有制器煌煌巨製照耀古今摩挲法物不啻商周以上之盛軌也謹編次登於卷首並登欵識一二字為金刻總一卷至前代所流傳者具有成書概不復載云敕內務府嚴禁中官鐵牌順治十二年國書正書右世祖章皇帝御敕御製金龍炮欵識康熙二十年國書正書御製簡平儀欵識康熙二十年正書御製三辰簡平地平合璧儀欵識康熙三十二年正書御製制勝將軍炮欵識康熙三十四年正書御製星晷儀欵識康熙五十三年柄鐫康熙御製四字正書御製四逰表半圓儀欵識中鐫康熙正書御製四字御製矩度象限儀欵識面鐫康熙正書御製四字御製方矩象限儀欵識面鐫康熙正書御製四字右聖祖仁皇帝御製欵識御製黃淮諸河龍神廟銅碑雍正二年行書河南武陟縣右世宗憲皇帝御製金刻御製嘉量銘乾隆十年國書正書御製刻漏銘乾隆十年正書御製虎神鎗記近斗處飾銀花文中鐫金乾隆書左右鐫御製虎神鎗記國御用四字正書正書欵鐫乾隆壬申秋九月又安莽御製詩一首欵鐫乾隆丙午季秋月上浣永喀殪虎作亦國書正書牀末飾以玉上鐫虎神鎗三字下鐫重十二斤五兩長四尺八寸藥二錢五分子重七錢正書御製金牛銘乾隆二十年篆書昆明湖御製鎛鐘銘乾隆二十六年篆書太和殿夾室臣等謹按乾隆二十四年江西臨江府得古鎛鐘撫臣以獻適西師告捷上既釐定其名復詔樂部仿鑄之凡鐘十二銘詞同御製古鑑銘七言篆書臣等謹按古鑑未詳何時物鏡面青緑周遍中有二寸許圓光御製銘文鐫刻鏡面青緑上御製竒準神鎗欵識大清乾隆年製六字正書御製準正神鎗欵識大清乾隆年製六字正書御製純正神鎗欵識大清乾隆年製六字正書御製連中鎗欵識大清乾隆年製六字正書御製應手鎗欵識大清乾隆年製六字正書御製威赫鎗欵識大清乾隆年製六字正書御製威捷鎗欵識大清乾隆年製六字正書御製刀欵識近銎處橫編某字若干號依千文列次刃右縱為刀名刃左橫為乾隆年製皆𨽻書其名曰鍊精曰叩鳴曰孔純曰月刃曰風熛曰飛鵲曰宿鋌曰超阿曰配威曰飛蛇曰星行曰含英曰舒空曰膽曰育芝曰揮霆曰德興曰秋霜曰秋水曰切玉曰湧泉曰振逺曰曜威曰吐芒曰彩鍔曰瑩鋩曰柔通曰章威曰霜明曰寒鋒曰出雲曰剸犀曰剪水曰掩虹曰致祥曰衛國曰象功曰輔德曰燭微曰霜鍔曰流光曰躍星曰霞彩曰繼輔曰鯉腹曰蒼精曰凝氷曰搖電曰逐指曰應心曰醴石曰衝斗曰映月曰鳴龍曰刜鐘曰決雲曰轉電曰息兵曰躍虹曰貫霄曰鎮方曰佩德曰寶騰曰善勝曰昆銛曰越礪曰瑩濤曰淬鵜曰博鏡曰鋪練凡七十皇朝通志卷一百十五
