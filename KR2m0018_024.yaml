body:
  text: 地理畧一疆域一臣等謹按鄭樵通志地理畧首列水道一門次載歴代封畛葢以水道係鄭樵所創撰歴代封畛則悉仍通典原文而唐以後不與焉故其先後之序如此竊惟疆域建置為一代之定制宜列於卷首水道亘古不易其所由殊者實因州縣之異名是府州縣應列為經水道應附為緯今纂皇朝疆域四卷叙於地理畧之首而水道次之恭惟我聖朝輿圖式廓疆理無外自國初定制以來省㑹之建設府州㕔縣之創置裁併因時立法宏綱鉅維逹於海宇兹謹條載現在經制凡為國初所釐定至今不改者不復加注其自康熙年間以來增建移屬之蹟逐一詳注於各州縣之下以資叅考至若聖蹟龍飛興京鼎建俄朶里城為發祥重地吉林黑龍江為統轄要區則謹遵皇輿表成式載於盛京篇中各䝉古藩屬翊戴天家世守勿替自國初附屬之内扎薩克為舊藩康熈間撫順之喀爾喀雍正間底定之青海厄魯特為新藩既已建官分屬久𨽻職司我皇上聖武丕昭蕩平伊犂回部二萬餘里平定兩金川革心歸化若巴勒庫勒烏魯木齊已設鎮西府迪化州𨽻於甘肅省金川亦設美諾㕔阿爾古㕔𨽻於四川省其天山南北伊犂諸路回部諸城分土開屯授職制貢不異赤縣黄圖是用稽考冊籍列於直省之後並遵欽定一統志條例依次甄載大矣哉東踰瀛海西越流沙北超絶漠南迄南荒版圖燦而職守彰碁布星陳羣汪翔乎徳化越考黄帝方制萬國虞夏迭建州域成周列服職方未有若我朝之中外一家廣輪四逹者至於鄭志所述漢十三部唐十五道又豈可提衡而並論也歟京師順天府領京縣二州五縣十有七大興京縣宛平京縣通州昌平州涿州霸州薊州良鄉固安永清東安香河三河武清寳坻順義宻雲懐柔房山文安大城保定平谷寧河雍正元年設盛京奉天府順治十四年設領州二縣六承徳附郭康熙三年設遼陽州天命九年建都於此號曰設東京十年由此徙都盛京又於此遼海衛順治十年改遼陽府附府為遼陽縣十四年罷府以縣屬奉天府康熙三年升為州復州雍正十二年設海城天命十年設海州順治十年改海城縣葢平天命十年設葢州康熙三年改葢平縣寧海天命十年設金州雍正十二年改寧海縣開原康熙三年設鐵嶺天命十年設鐵嶺衛康熙三年設縣錦州府康熙四年設領州二縣二錦縣附郭天命十年設錦州康熙元年改錦縣屬奉天府四年於縣設錦州府以縣為附郭治寧逺州康熙三年設屬廣寧府四年屬錦州府義州雍正十二年設廣寧康熙三年設廣寧府廣寧縣四年罷府以縣屬錦州府興京在以盛京東南三百里皇國初興於此肇祖築城居太祖髙帝龍崇徳八年升為興京俄朶里城在逺興京東一千三百里世本朝重地祖建都於此實萬萬發祥寧古塔將軍境駐吉林烏喇城在八盛京東北八百一十里黒龍江將軍境駐齊齊哈爾城在餘盛京東北一千七百里直𨽻省兼管順天府所屬府十直𨽻州六保定府省㑹領州二縣十五清苑附郭祁州安州滿城安肅定興新城唐博野望都初名慶都乾隆十一年改容城完蠡雄束鹿髙陽新安永平府領州一縣六盧龍附郭灤州遷安撫寧昌黎樂亭臨榆初為山海衛乾隆二年置縣河間府領州一縣十河間附郭景州獻阜城肅寧任邱交河寧津吳橋故城東光天津府初為天津衛雍正二年改直𨽻州九年升府領州一縣六天津附郭雍正九年設滄州初屬河間府雍正三年升直𨽻州領南皮鹽山慶雲三縣九年改屬府青靜海二縣初屬河間府雍正二年屬州九年屬府南皮鹽山慶雲三縣初屬河間府雍正三年𨽻滄州九年屬府正定府領州一縣十三正定附郭晉州雍正二年升直𨽻州領無極藁城二縣十二年仍為屬州與二縣均屬府獲鹿井陘阜平欒城行唐靈夀平山元氏贊皇無極藁城二縣雍正二年屬晉州十二年仍屬府新樂順徳府領縣九邢臺附郭沙河南和平鄉廣宗鉅鹿唐山内邱任廣平府領州一縣九永年附郭磁州初屬河南省雍正三年改屬府曲周肥鄉雞澤廣平邯鄲成安威清河大名府領州一縣六大名元城附郭二縣開州南樂清豐東明長垣宣化府舊為宣化鎮𨽻山西省康熙三十二年改府來屬領州三縣七宣化附郭蔚州初屬山西省雍正四年屬府延慶州保安州赤城萬全龍門懐來西寧懐安以上三州七縣並康熙三十二年由衛改設承徳府雍正元年設熱河㕔十一年改為承徳州乾隆七年罷州仍設㕔四十三年改設承徳府領州一縣五平泉州雍正八年設八溝㕔乾隆四十三年設州灤平乾隆七年設喀喇河屯㕔四十三年設縣豐寧乾隆元年設四旗㕔四十三年設縣赤峯乾隆三十九年設烏蘭哈逹㕔四十三年設縣建昌乾隆三年設塔子溝㕔四十三年設縣朝陽乾隆三十九年設三座塔㕔四十三年設縣遵化州初為遵化縣屬順天府康熙十五年升為州乾隆八年改直𨽻州領縣二玉田豐潤二縣初屬順天府雍正四年改屬永平府乾隆八年屬州易州初屬保定府雍正十一年升直𨽻州領縣二淶水初属保定府雍正十一年屬州廣昌初屬山西大同府雍正十一年改屬州冀州初屬正定府雍正二年升直𨽻州領縣五南宫新河棗強武邑衡水五縣初屬正定府雍正二年屬州趙州建設與冀州同領縣五柏鄉隆平髙邑臨城寧晉五縣初屬正定府雍正二年屬州深州建設與冀州同領縣三武強饒陽安平三縣初屬正定府雍正二年屬州定州建設與冀州同領縣二曲陽初屬正定府雍正二年屬州深澤初屬保定府雍正十二年屬州山東省所屬府十州二濟南府省㑹領州一縣十五歴城附郭徳州章邱鄒平淄川長山新城齊河齊東濟陽徳平禹城臨邑平原陵長清初屬府雍正二年屬東平州十三年仍屬府泰安府初為州屬濟南府雍正二年升直𨽻州領長清新泰萊蕪三縣十三