front:
  text: 欽定四庫全書皇朝通志卷九十九
  hash: sha256:0fc0ded17cc14ff30eb743fe7d8ef36abf0b9c2cdade7ebdb38b991112c48a0a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_099-1a, image: WYG0645/WYG0645-0378c.png}
body:
  text: 藝文略三史類第五上正史别史編年雜史詔令載記紀事本末官史評職政書臣等謹案鄭志史類各門多分細目未免繁瑣今從欽定續通志之例酌歸總類自正史至目録凡分十五門亦於舊例稍為變通焉正史欽定明史三百三十六卷康熙十八年始修雍正二年奉詔纂敕續編至乾隆四年告成後又之本命加刋正今四庫全書以新定著録欽定遼史語解十卷乾隆五十年奉敕撰欽定金史語解十二卷乾隆五十年奉敕撰欽定元史語解二十四卷乾隆五十年奉敕撰史記疑問一卷邵泰衢撰三國志補注六卷附諸史然疑一卷杭世駿撰遼史拾遺二十四卷厲鶚撰臣等謹案注釋諸史之書皆與正史相符謹從欽定四庫全書之例附録於後以上見文淵閣著録五代史志疑四卷楊陸榮撰以上見四庫全書存目正史類凡八部編年御批通鑑輯覽一百十六卷附明唐桂二王本末三卷乾隆三十二年奉敕撰御定通鑑綱目三編四十卷乾隆四十年奉敕撰皇清開國方略三十二卷乾隆三十八年奉敕撰資治通鑑後編一百八十四卷徐乾學撰竹書統箋十二卷徐文靖撰通鑑胡注舉正一卷陳景雲撰綱目訂誤四卷陳景雲撰綱目分注拾遺四卷芮長恤撰臣等謹案竹書統箋以下諸書均為注釋本書而作亦如正史之例附載於編年類中以上見文淵閣著録考定竹書十三卷孫之騄撰通鑑綱目釋地糾繆六卷補注六卷張庚撰皇王史訂四卷李學孔撰此木軒紀年略五卷焦袁熹撰讀史綱要一卷王植撰以上見四庫全書存目編年類凡十三部詔令臣等謹案鄭志以制誥入文類蓋歷代制誥多出代言諸臣之手尚可列於文類然考唐志史類即有詔令一門今欽定四庫全書載詔令於史部從古義也欽惟我朝列聖相承煌煌謨訓皆由親御丹毫昭垂典䇿有非前代王言所能幾及於萬一者謹從四庫全書之例於史類增入詔令一門太祖髙皇帝聖訓四卷康熙二十五年年帝編次乾隆四聖祖仁皇皇上御製序文刋布太宗文皇帝聖訓六卷順治中熙二十世祖章皇帝編次未竟康六年聖祖仁皇帝續成乾隆四年皇上御製序文刋布世祖章皇帝聖訓六卷康熙二十六年年帝編次乾隆四聖祖仁皇皇上御製序文刋布聖祖仁皇帝聖訓六十卷雍正九年六年編次乾隆世宗憲皇帝皇上御製序文刋布世宗憲皇帝聖訓三十六卷乾隆五年御製皇上編次成帙序文刋布上諭內閣一百五十九卷自雍正元年至七年為莊親王允祿奉敕校刻自雍正八年至十三年為和親王𢎞畫奉敕校刻上諭八旗十三卷上諭旗務議覆十二卷諭行旗務奏議十三卷雍正九年奉共為一敕編以上三書部世宗憲皇帝硃批諭旨三百六十卷雍正十年奉三年告敕校刋至乾隆成以上見文淵閣著録詔令類凡八部紀事本末臣等謹案我朝聖聖相承功烈顯鑠方略諸篇皆奉敕撰紀以著其事之始末威德遠揚洵書契以來所未有謹依欽定四庫全書之例增列紀事本末一門以補鄭志之所不及又如谷應泰明史紀事本末之類蓋仿宋袁樞通鑑紀事本末而作實於正史編年之外别為一體亦應採入其他體例相同者並從附見云平定三逆方略六十卷康熙二十一年奉案是編未奉刋布皇敕撰謹上特命繕入四庫全書親征平定朔漠方略四十八卷康熙四十七年奉敕撰欽定平定金川方略三十二卷乾隆十三年奉敕撰御定平定準噶爾方略前編五十四卷正編八十五卷續編三十三卷乾隆三十七年奉敕撰欽定平定兩金川方略一百三十六卷乾隆四十六年奉敕撰欽定臨清紀略十六卷乾隆四十二年奉敕撰欽定蘭州紀略二十一卷乾隆四十六年奉敕撰欽定石峯堡紀略二十卷乾隆五十年奉敕撰綏寇紀略十二卷吳偉業撰明史紀事本末八十卷谷應泰撰滇考二卷馮蘇撰左傳紀事本末五十三卷髙士竒撰平臺紀略一卷附東征集六卷藍鼎元撰以上見文淵閣著録三藩紀事本末四卷楊陸榮撰以上見四庫全書存目紀事本末類凡十四部别史史鈔附臣等謹案鄭志有通史而無别史凡古史統史之類俱入通史其各家别史則仍分見於雜史正史二門今從欽定續通志之例改通史為别史而史鈔亦附見焉欽定續通志六百四十卷乾隆三十二年奉敕撰繹史一百六十卷馬驌撰後漢書補逸二十一卷姚之駰撰春秋戰國異詞五十四卷通表一卷托遺一卷陳厚耀撰右别史南史識小録八卷北史識小録八卷沈名蓀朱昆田同編右史鈔附以上見文淵閣著録明書一百七十一卷傅維鱗撰草二史紀事提要八卷吳綏撰春秋紀傳五十一卷李鳯雛撰讀史津逮四卷潘永國撰季漢五志十二卷王復禮撰半窗史略四十二卷龍體剛撰尚史七十二卷李鍇撰晉紀六十八卷郭倫撰右别史左傳經世十卷魏禧撰讀史蒙拾一卷王士祿撰史緯三百三十卷陳允錫撰兩晉南北集珍六卷陳維嵩撰左傳分國纂要十六卷盧元昌撰右史鈔附以上見四庫全書存目别史類凡十八部雜史欽定蒙古源流八卷蒙古小徹辰薩囊台吉撰乾隆四十二年奉敕譯進以上見文淵閣著録見聞隨筆二卷馮蘇撰安南使事記一卷李仙根撰平叛記二卷毛霦撰平寇志十二卷李確撰交山平寇本末三卷附詩一卷詳文一卷書牘一卷夏駰撰平閩紀十三卷楊捷撰師中紀績一卷王得一撰武宗外紀一卷毛竒齡撰後鑒録七卷毛竒齡撰封長白山記一卷方象瑛撰辦苗紀略八卷俞一謨撰遜代陽秋二十八卷余美英撰二申野録八卷孫之騄撰衡湘稽古五卷王萬澍撰以上見四庫全書存目雜史類凡十五部載記臣等謹案鄭志有霸史一門以十六國十國之書入之今從欽定續通志之例改為載記一門十國春秋一百十四卷吳任臣撰以上見文淵閣著録南唐拾遺記一卷毛先舒撰中山沿革志二卷汪楫撰以上見四庫全書存目載記類凡三部史評臣等謹案鄭志以史評入正史今從欽定續通志之例分列史評一門御批通鑑綱目五十九卷通鑑綱目前編十八卷外紀一卷舉要三卷通鑑綱目續編二十七卷康熙四十七年聖祖仁皇帝御撰御製評鑑闡要十二卷乾隆三十六年大學士劉統勳等恭録史通通釋二十卷浦起龍撰以上見文淵閣著録史通訓故補二十卷黃叔琳撰綱鑑附評二卷舊本題劉善撰漢史億二卷孫廷銓撰論世八編十二卷華慶逺撰歷代甲子考一卷黃宗羲撰鑑語經世編二十七卷魏裔介撰讀史吟評一卷黃鵬揚撰史評辨正四卷黃鵬揚撰讀史矕疑十卷張彥士撰史折三卷續一卷賀裳撰澄景堂史測十四卷施鴻撰垂世芳型十三卷金維寧撰資治通鑑述無卷數陳銑撰通鑑大感應録二卷秦鏡撰讀史辨惑無卷數王建衡撰史論初集無卷數朱直撰詩史十二卷葛震撰四言史徴十二卷葛震撰班范肪截四卷五代史肪截四卷張篤慶撰增定史韻四卷附讀史小論一卷仲宏道撰十七史論九卷年表一卷夏敦仁撰芝壇史案五卷張鵬翼撰史學正藏五卷宋士宗撰讀史評論六卷費宏灝撰十七朝史論一得一卷郭倫撰石溪史話八卷劉鳯起撰唐鑑偶評四卷周池撰以上見四庫全書存目史評類凡三十部職官官制官針附臣等謹案鄭志職官一門有與刑法相混遂致互收者今遵欽定續通志職官類先以官制敘於前而官針則附見焉欽定國子監志六十二卷乾隆四十三年奉敕撰詞林典故八卷鄂爾泰等撰右官制御定人臣警心録一卷順治十二年奉敕撰右官針附以上見文淵閣著録歷代銓選志一卷袁定逺撰歷代宰輔彚考八卷萬斯同撰銓政論略一卷蔡方炳撰文武金鏡律例指南十六卷凌銘麟撰南臺舊聞十六卷黃叔璥撰四譯館考十卷江蘩撰太常紀要十五卷江蘩撰右官制政學録五卷鄭端撰為政第一編八卷孫鋐撰百僚金鑑十二卷牛天宿撰右官針附以上見四庫全書存目職官類凡十三部政書通制法令儀制考工邦計制軍政雜典臣等謹案鄭志刑法門兼及貢舉法守之類於標目不符欽定續通志惟以斷獄入刑法餘皆列於故事今從欽定四庫全書例以法令入正書其刑法一門謹從刪去欽定大清會典一百卷乾隆二十九年奉敕撰欽定大清會典則例一百八十卷乾隆二十九年奉敕撰欽定續文獻通考二百五十卷乾隆十二年奉敕撰欽定皇朝文獻通考二百八十卷乾隆十二年奉敕撰欽定續通典一百五十卷乾隆三十二年奉敕撰欽定皇朝通典一百卷乾隆三十二年奉敕撰元朝典故編年考十卷孫承澤撰以上見文淵閣著録右通制國朝宫史三十六卷乾隆七年奉增修敇撰二十四年以上見文淵閣著録臣等謹案典禮諸書已見禮類儀注門惟國朝宫史一編凡禁闈制度並皆分門臚列典禮特其一也謹録於史類儀制門內右儀制御定康濟録四卷謹案是編原名救飢譜吏科給事中倪國璉於乾隆四年恭進命內廷諸臣刪訂刋行因賜今名捕蝗考一卷陳芳生撰荒政叢書十卷俞森編以上見文淵閣著録淮鹺本論二卷胡文學撰歷代茶𣙜志一卷蔡方炳撰歷代山澤征稅記一卷彭寧求撰左司筆記二十卷吳璟撰蘇松歷代財賦考一卷不著撰人名氏以上見四庫全書存目右邦計八旗通志初集二百五十卷雍正五年奉敕撰以上見文淵閣著録歷代馬政志一卷蔡方炳撰歷代武舉考一卷談吉璁撰以上見四庫全書存目右軍政大清律例四十七卷乾隆五年奉敕撰以上見文淵閣著録右法令武英殿聚珍板程式一卷乾隆三十八年刋布詔甄擇四庫全書善本侍郎金簡請以活字印行法編賜名曰聚珍版金簡因綜述其此書奏進以上見文淵閣著録浮梁陶政志一卷吳允嘉撰以上見四庫全書存目右考工歷代建元考十卷鍾淵映撰以上見文淵閣著録紀元彚考三十五卷黃琳撰紀元要略一卷補遺一卷陳景雲撰歷代帝系年號二十卷劉宗魏撰以上見四庫全書存目右雜典制政書類凡二十六部皇朝通志卷九十九
