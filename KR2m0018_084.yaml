  text: 欽定四庫全書皇朝通志卷八十四
  hash: sha256:9daed31e0cb73bf69638f8ffa6685fd3757b66e60d740758905ce0e8684156cf
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_084-1a, image: WYG0645/WYG0645-0225c.png}
body:
  text: 食貨略四賦稅下乾隆元年詔蠲除天下新淤舊坍沙脊鹻鹵及揑報開荒浮糧按乾隆初年蠲正賦額銀前後約計六十餘萬詳見蠲賑門是時各處關稅遍豎木榜商賈一目了然惟甘肅遼逺並無部頒新例司事者各執腐爛舊本因而浮減不一布政司徐祀經心察核有府與府異縣與縣異一稅而數處各别因言甘省稅課除牙帖外有商畜二稅內有過稅坐稅之分過稅者係販往别地應納過路之稅坐稅者係販别地貨物集市發賣輕重各别必須逐條刋刻大張曉示方免濫收脫漏又兩江總督趙宏恩奏稱龍江西新關舊有衙規茶果驗票諸項在加一火耗之外應請革除如織造府承辦差役及養廉不敷準在盈餘內支存一萬兩動用俱從之又於九江贛口二關鈔課令商人自行投匱收銀之後發三聯單一給商人一交巡撫一存稅署以杜侵隱之弊是年以江南水災停征該地關津米麥稅二年以畿輔雨澤愆期停征天津臨清二關米麥稅又以挑濬淮揚運河停經過該地米麥稅時廷臣多以各省稅務統歸旗員經理為請上以設關原為查察姦宄利益商民並非為收稅之員身家計若以旗員貧乏而差遣之是教之貪矣乃不允所請又原任江西巡撫俞兆嶽奏報九江贛口兩關稅課盈餘較前共減九萬有餘上命部臣及新任巡撫查核旋諭之曰前因各省關稅每多無名之徵是以屢經釐剔減除今就江西一省少收十萬兩推之各省約計不下百有餘萬如果商民得沾實惠即更逾此數亦所樂聞但關稅與物直原相表裏稅輕而物價不減是商民猶未沾實澤徒飽胥吏之槖耳督撫大吏宜督率司𣙜之員潔己奉公以副加惠商民之意若錯會其意又欲多報贏餘以致商民受困罪更無可逭時又以淮安監督唐英具陳各項經費及書役飯食不敷狀奏請動支盈餘上以淮南等關必因書吏添設過多以致工食不足又關差養廉之數亦覺太豐著總督慶復酌量裁減以免日久濫征尋定滸墅關酌減人役工食養亷八千一百餘兩淮關酌減人役工食養廉四千九百七十餘兩定為額三年詔州縣征收錢糧有私增火耗者該督撫嚴參治罪如督撫失察如例議處先是四川火耗較他省獨重自雍正年間陸續裁減有司不得中飽因有暗加戥頭每兩重至一錢有餘而收糧之書吏傾銷之銀匠又從而侵漁之上聞傳諭直省督撫轉飭布政司製成畫一之戥飭各州縣確實遵行該上司不時密察如有絲毫溢取者罪是年停臨清天津及江南各關米糧稅四年以江南髙淳縣舊有草場田五千六百餘頃係前明分給馬户以供芻牧後照民田起科徵銀五百餘兩一半攤入民户一半馬户承納而此項田地久非馬户承種民間既輸正賦又納場租特令除之時有滸墅關監督海保於離關數百里之常熟無錫江陰等縣私立柵座濫設巡船經御史舒赫德參奏上密令兩江總督及江蘇巡撫查核題報督臣那蘇圖因言滸墅關所轄湖河海道支港紛繁易於透漏從前祇設崇福等三橋望海等七港守巡歷任監督恐稽查難周添設蠡口港等十三處船柵以佐三橋七港之不及後又添設板橋等二十九處雍正八年將續增之二十九處盡行裁撤另設王莊等十處顧二房廊下等五處巡攔今查見在口岸三十八處有原報部之轉水柏瀆二港既於毛塘九里二處設立柵巡則二港可無復設其南北角各裁巡船一隻各處口岸暫為存留如有應行納稅之船俱令直赴大關報稅不許各口擅立稅房亦不許混指透漏至於本地土貨非捆載行逺者不稅船載米麥不及十石者不稅農民交辦租糧米麥無論多寡不稅得旨照所請行是年以瓜洲由閘稅務交兩淮鹽政經管以蕪湖鳳陽兩關専差監督管理五年裁磚板閘工部關歸併臨清關征收從山東巡撫嶽濬請也時江南嵗額地丁漕白蘆課雜稅之外有名雜辦者不在地丁項下編徵仍入地丁彚作分數奏銷欵目甚多沿自前明本朝賦役全書止編應解之款並未開出雜辦原委亦未編定如何徴收於是有缺額纍官者有征收纍民者有纍在官而因以及民者至是諭該督撫查核除有欵可徵無纍官民之項照舊征解其實在缺額有纍官民者即請旨豁免六年諭外省關𣙜口岸惟報部有案者照舊設立其有私行增添之處著該督撫詳查題報清釐之後再有違例苛索者罪督撫失察如例時兩江總督楊超曽上言設關之意不在取盈是以歷來但有征商之令而不及於官物況米糧係民之所生發帑採買原為接濟民食與逐末不同今既征船料又完稅銀取之司庫以輸關庫於國課毫無增益於是定各屬採買賑濟及糶三補倉米榖過關時止納船料毋稅又湖廣總督那蘇圖言武昌厰關正額盈餘之外所收口岸銀兩除支銷外嵗得八千兩應將此項辦理地方利濟軍民之事至各關口岸銀兩因非正項既不收耗則宗關同一口岸不應獨收耗羡從之時以各關正額儘收儘解盈餘多寡本難每年畫一而關差報滿之時缺減上年之數部臣往往駁查上恐司𣙜者慮干部駁必致逐嵗加增後將無所底止乃諭部臣關稅盈縮本不懸殊若乙年所報盈餘之數稍不及甲可無駁查若過於短少亦祇令督撫確查實在情形自難逃乎公論顧查核過嚴則額數日增害在衆庶查核稍寬則司𣙜侵蝕損於國帑此中輕重權衡著大學士會同該部詳議具奏尋以部臣議定嗣後各關盈餘數目與上年相仿者即行考核具奏如大相懸殊令該督撫查核有無隱漏等弊聲明覆奏倘該督撫查奏不實扶同徇隱亦並議處七年免直省各關米豆麥稅先是天津臨清滸墅蕪湖各關以地方嵗歉遞年停免至是上以特恩間舉未能普及且以養民之物而𣙜之非以厚民乃令直省各關概行豁免其各關徵收則例不一有按梁頭丈尺納料者有收納船户空船料銀及無論有載無載按年抽單納課者又有計在征稅不收納船料者船料一項部臣持論未定得旨向征船料者應照例征收向不征船料者豈可因免米豆稅而轉加征料時以山東臨清關向征銅鋪商鋪相沿已久報部則統名船料至是以既蠲米稅概行豁除後又奏定各關不得借免米糧有虧正額其有借端闕額者令其賠補是年定外洋夷商運米至閩粵俱海關自萬石以上者免船貨稅十分之五五千石以上者免船貨稅十分之三嗣於十一年因暹羅商人皆不足五千石之數所載多蘇木鉛錫等貨更定免船貨稅十之二十年復開雲南馬白口稅蠲福建浦城關缺額銀二千七百餘兩時直省丁銀俱於雍正年間攤於地糧惟山西以各州縣貧富參差未行至是亦按則攤入其陽曲等二十州縣或以貿易民多或以田多沙鹻或以多徵本色仍地丁分徵十一年江蘇布政司安寧請復米稅略言自免米糧稅後弊竇叢生國課日少而米價之貴更增於前上以商賈乃無知愚人宜先化導不遽允十二年以福建臺灣府丁銀勻入官莊田園內徵收其畨民祇納丁銀所種田畝概不征賦又移詔安縣溪雅稅館於懸鐘以防偷漏十三年廣東巡撫嶽濬酌定太平關稅務向無定則者九十五條照粵贛兩關權其輕重量增者四十一條量減者四十九條照舊征收者二十五條均刋入條例豎榜太平遇仙橋浛光厰三處畫一抽分是年復各關米糧稅時以滸墅關監督圖拉言自豁免米稅後商賈惟知圖利致市價反昻乃令如舊征收嗣後遇地方歉收之年仍停免又以廣西潯梧二府關稅及桂南平慶等府富川懷集等縣雜稅歸該分守道查察以杜府州縣隱漏是年東省嵗歉特開海運免其稅十四年户部言關𣙜盈餘遞年短少應較上屆短至一分以上者按數定以處分上諭盈餘本有而嵗減一嵗其弊自在漏巵但所稱與上屆比較不無流弊有如甲盈一萬下屆之乙必思盈及萬有五千再下屆之丙又將增加二萬似此相競不已將何所止非理財之正道嗣後各關解交當以雍正十三年數目為額短少者該部按所定分數議處十七年以貴州畢節縣稅羡不敷令雲南鎮雄州運銅馬匹回空時承運官嵗辦川鹽百萬斤帶至鎮雄行銷以所收稅銀補畢節之不足是時盈餘章程既定各關奏報較上屆短數者部議交該督撫查明而督撫奉行故事不過轉交監督自報取結聲明終未有察出侵蝕情節據實參劾者十八年乃諭嗣後各關奏報盈餘數目該部覆核時無庸復交督撫查奏致滋案牘十九年御史胡定上言州縣徵收錢糧有自顧考成恐錢糧拖欠勒令富户包都圖等弊應令該督撫即行參處經部議準并定貢監生員包攬錢糧罪例先是外洋畨船俱由粵東收口偶然一至寧波是以粵海稅則較重閩海稅則較輕嗣後姦牙市舶狃於稅額輕微彼此串勾舍粵就浙嵗至定海轉運寧波二十二年浙江總督喀爾吉善會同兩廣總督楊應琚將閩海科則較粵海課額按時地價直稍稍加重奏請定為章程上意不在增稅但恐將來畨舶雲集又成一粵省澳門於海疆重地均有關係遂如所議以示限制自章程既定後外洋皆知違例紆道之無所利亦不復收泊寧波矣二十三年户科給事中黃登賢言州縣錢糧應隨征隨解勿令久貯庫內致有那移之弊并令各布政司於奏銷册內將各屬批解日月逐一開載以便稽核下部議行尋又以黃登賢言令各省錢糧奏銷册去折徵顔料一切雜項欵目二十五年準兩廣總督李侍堯奏刪除粵海關一切官吏家人通事巡役人等規禮名色悉作歸公造報二十七年江蘇巡撫陳宏謀清釐滸墅關積弊四條一鋪户代客完稅包攬居竒請將包攬鋪户列榜禁革仍令商人按簿親填一各處船貨抵關簽驗納稅給票之後始準過關以杜偷漏一坐關之員遴選佐雜照例半年更替不得任其戀缺致啓弊竇一督撫與監督原相助為理每月所征數目應令監督按月知會督撫仍於年滿奏報時統咨知會從之二十八年以天津監督達色言令天津苑口十三口岸悉照大關部頒則例畫一征收三十二年御史成德請將關稅盈餘歸入正額上以盈餘一項節經議定監督按數交部如實係侵漁自有罪例必定為正額轉似於稅外加額嗣於三十七年湖廣總督陳輝祖又請於新墾民屯將丁銀遞年攤派至四十一年貴州巡撫裴宗錫言鎮逺關稅羡不敷請於栁夀添設稅口皆奉旨斥不準行尤足徵曠典也其田賦科則遞年輕減至於西陲底定入我版籍皇上經營措置則壤成賦列市開㕓自二十四年參贊大臣奏定本地回民往外回帶貨物者牲畜則抽稅二十分之一緞布皮張則十分抽一外畨商人販來貨物牲畜三十分抽一緞布皮張二十分抽一若不及抽分之數馬一匹抽一騰格回部所用之普兒錢五十為一騰格大牛一頭稅五十五普兒小牛半之大羊一牽稅十二普兒小羊半之雜項物件視其值之貴賤折收普兒騰格二十七年總督楊應琚經理屯政事宜酌定回民納賦則例凡回民自種地畝視嵗收納十分之一承種官地平分入官其間有祇納田賦者亦有帶征地租者有徵本色者亦有折徵普兒騰格者有以官石征收者亦有就該地帕特瑪折算者回部一帕特瑪合官斗五石三斗厥後屯田益闢土益膏沃而賦糧科則如其舊二十八年又定伊犂哈爾沙爾鋪面量大小作三等收稅後又增定闢展烏魯木齊阿克蘇各屬貿易照內地給票每銀一兩止稅三分普兒一百收稅三文皇朝通志卷八十四
