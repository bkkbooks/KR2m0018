body:
  text: 欽定四庫全書皇朝通志卷三十三都邑略二暢春園在京城西直門外十二里地名海淀聖祖仁皇帝以萬幾之暇駐蹕於此酌泉而甘因明武清侯李偉故園址改建周方十餘里築宫設籞賜名暢春園時奉孝莊文皇后孝惠章皇后憩焉政事幾務即裁決其中皇上御極後葺新園宇每逢駐蹕圓明園敬奉聖母皇太后安憩於此宫門內中為九經三事殿後為春暉堂其後為寢殿曰夀萱春永其後為雲涯館館後踰橋循山而北有河池南北立坊二為玉澗金流門內為瑞景軒軒後為林香山翠又後為延爽樓樓左為式古齋齋後為綺榭園內築東西二隄各數百步東曰丁香隄西曰蘭芝隄皆通瑞景軒西隄外别作一隄曰桃花隄東西兩隄之外河流數道環繞苑內出西北門閘注於垣外雲涯館東南角門外轉北為劍山南為淡寧居前殿為康熙年間聖祖御門聽政引見之所後殿為皇上舊時讀書處由大東門土山北循河岸西行為淵鑑齋後臨河為雲容水態左廊後為佩文齋齋後西為葆光齋東為蘭藻齋淵鑑齋之前為藏輝閣佩文齋之東為養愚堂相對為藏拙齋小東門東垣內溪北為清溪書屋後為𨗳和堂西為藻思樓後為竹軒春暉堂之西出如意門為玩芳齋山後為韻松軒二層宫門外船塢之西為無逸齋皇上詣園問聖母皇太后安每傳膳視事於此凝春堂在淵鑑齋之西其東室為純約堂其右為迎旭堂純約堂東為迎涼精舍迎旭堂後為曉煙榭河岸以西為松柏室其左為樂善堂河上有閣曰蘂珠院其北為觀瀾榭蘂珠院西踰橋而北為集鳳軒軒後度河橋而西為俯鏡清流又循河而南即苑之大西門延樓列亘其外即西花園之馬厰也暢春園西南垣為西花園正宇為討源書屋皇上問安之便率詣是園聽政中有閲武樓為肄武之所恭載聖祖仁皇帝御製暢春園記都城西直門外十二里曰海淀淀有南有北自萬泉莊平池湧泉奔流㶁㶁滙於丹稜沜沜之大以百頃沃野平疇澄波逺岫綺合繡錯蓋神臯之勝區也朕臨御以來日夕萬幾罔自暇逸久積辛劬漸以滋疾偶緣暇時於兹遊憩酌泉水而甘顧而賞焉清風徐引煩疴乍除爰稽前朝戚畹武清侯李偉因兹形勝構為别墅當時韋曲之壯麗歷歷可考圯廢之餘遺址周環十里雖嵗逺零落故迹堪尋瞰飛樓之鬱律循水檻之逶迤古樹蒼藤往往而在爰詔內司少加規度依髙為阜即卑成池相體勢之自然取石甓夫固有計庸畀值不役一夫宫館苑籞足為寧神怡性之所永惟儉德捐泰去雕視昔亭臺邱壑林木泉石之勝潔其廣袤十僅存夫六七惟彌望漣漪水勢加勝耳當夫重巒極浦朝煙夕霏芳萼發於四序珍禽喧於百族禾稼豐稔滿野鋪芬寓景無方會心斯逺其或穱稌未實暘雨非時臨陌以憫胼胝開軒而察溝澮占離畢則殷然望詠雲漢則悄然憂宛若禹甸周原在我户牖也每以春秋佳日天宇澄鮮之時或盛夏鬱蒸炎景鑠金之候幾務少暇則祗奉頥養遊息于兹足以迓清和而滌煩暑寄逺矚而康慈顔扶輿後先承歡愛日有天倫之樂焉其軒墀爽塏以聽政事曲房邃宇以貯簡編茅屋塗茨略無藻飾于焉架以橋梁濟以舟楫間以籬落周以繚垣如是焉而已矣既成而以暢春為名非必其特宜于春日也夫三統之迭建以子為天之春丑為地之春寅為人之春而易文言稱乾元統天則四德皆元四時皆春也先王體之以對時育物使圓頂方趾之衆各得其所跂行喙息之屬咸若其生光天之下熙熙焉皥皥焉八風罔或弗宣六氣罔或弗達此其所以為暢春者也若乃秦有阿房漢有上林唐有繡嶺宋有艮嶽金釭璧帶之飾包山跨谷之廣朕固不能為亦意所弗取朕匪敢希蹤古人嫓美曩軌安土階之陋惜露臺之費亦惟是順時宣滯承顔致養期萬類之乂和思大化之周浹一民一物念兹在兹朕之心豈有已哉於是為之記而系以詩詩曰昔在夏姒克儉卑宫亦越姬文勿亟庶攻若稽古訓是欽是崇針銘户牖夙夜朕躬棟宇之興因基前代巖宿丹霞簷棲翠靄營之度之以治蕪廢有沸泉源汪濊斯在駕言西郊聊駐綵斿甘彼挹酌工築斯謀瑩徹明鏡縈帶芳流川上徘徊以泳以遊因山成峻就谷斯卑咨彼將作毋曰改為松軒茅殿實惟豫宜亦有朴斫豫尚念兹撰辰經始不日落成豈曰遊豫燕喜是營展事慈闈那居髙明遐矚俯瞰聊用娛情粵有圖史藏之延閣惟此大廡會彼朱襮鬱鬱溝塍依然耕鑿無假人工渺彌雲壑有鷁其舟有虹其梁可帆可涉於焉徜徉文武之道一弛一張退省庶政其罔弗臧嘗聞君德莫大於仁體元出治於時為春願言物阜還使俗醇暢春之義以告臣鄰圓明園在暢春園北康熙四十八年建世宗憲皇帝潛邸時聖祖賜園也御極後稍加修葺具朝署之規大宫門內為出入賢良門中為正大光明殿東為勤政殿為常時聽政之所皇上御極後每嵗初春即駐蹕於此咨度機務引見百官皆日以為常為門凡十有八園中之水發源玉泉山由西馬厰入進水閘支流派衍至園內由出水閘一在明春門北一在蘂珠宫北達苑牆經長春園東入清河園內四十景各有御製詩詞紀之首曰正大光明即園中正殿也後為夀山口東為洞明堂一曰勤政親賢為勤政殿中世宗御書額後楹額曰為君難東為飛雲軒為靜鑑閣閣後殿宇為保合太和後為富春樓一曰九州清晏前層恭懸聖祖御書圓明園額次層殿為奉三無私後殿為九州清晏東為天地一家春西為樂安和又西為清暉閣閣左右有松雲樓露香齋涵德書屋茹古堂諸勝别為清暉閣四景一曰鏤月開雲在富春樓之後舊名牡丹臺康熙壬寅春皇上覲聖祖於斯堂之內承奉恩旨養育宫中乾隆三十一年御題額為紀恩堂後宇為御蘭芬一曰天然圖畫北為朗吟閣又北為竹薖樓東為五福堂迤北宇為竹深荷淨其東渡河為蘇隄春曉一曰碧桐書院其西巖有雲岑亭一曰慈雲普護樓中奉觀音大士前殿南臨後湖為歡喜佛場一曰上下天光為臨湖樓宇其後為平安院一曰杏花春館西北為春雨軒軒西為杏花村軒後東為鏡水齋西北室為抑齋又西為翠微室一曰坦坦蕩蕩前宇為素心堂後宇為光風霽月東北為知魚亭又東北為萃景齋西北為雙佳齋一曰茹古涵今其後方宇為韶景軒軒前東為茂育齋西為竹香齋又北為靜通齋一曰長春仙館為皇上舊時賜居之所登極後復加修飾其後恭值佳辰令節迎奉聖母皇太后為膳寢之所後宇為緑蔭軒正宇西廊後為麗景軒仙館之西為含碧堂堂後為林虛桂靜左為古香齋東楹有閣為抑齋堂稍東為隨安室由仙館西南門迤西為藻園內為曠然堂堂後為貯清書屋堂東池上為夕佳書屋稍北為鏡瀾榭東南為凝眺樓為懷新館西北為湛碧軒一曰萬方安和建宇池中形如卍字南面正室為萬方安和餘為佳氣迎人為四方寧靜為碧溪一帶為山水清音為神洲三島為髙山流水為枕流潄石為洞天深處得景凡九一曰武陵春色舊名桃花塢雍正四年皇上讀書於此顔曰樂善堂旋移居長春仙館池北軒為壺中日月長東為天然佳妙武陵春色之西為全璧堂堂後由山口入桃花塢東為綰春軒軒東北為品詩堂一曰山髙水長重樓亘峙地勢寬敞為外藩朝正錫宴陳設火戲及平時宿衛士較射之所一曰月地雲居為梵宇最勝處東為法源樓一曰鴻慈永祜即安佑宫坊座額也為供奉聖祖世宗神御之所東南為致孚殿宫之後垣西北為紫碧山房前宇為橫雲堂東南為豐樂軒北為霽華樓迤東為景暉樓橫雲堂西池上為澄素樓一曰彚芳書院內宇為抒藻軒後為涵逺齋齋之前西垣內為翠照樓東垣內為倬雲樓又東為睂月軒倬雲樓南稍東為隨安室又東逾溪橋為斷橋殘雪一曰日天琳宇有中前樓中後樓西前樓西後樓東别院為瑞應宫凡樓宇上下皆供佛像及諸神位一曰淡泊寧靜殿為田字式凡四門東北面皆有樓樓下稻田彌望東為曙光樓殿之東門外為翠扶樓西門外别垣內為多稼軒左右有靜香書屋互妙樓諸勝别為多稼軒十景一曰映水蘭香東南為釣魚磯北為印月池池北為知耕織又北稍東為濯鱗沼西南為貴織山堂中祀蠶神一曰水木明瑟其北稍西為文源閣藏貯四庫全書閣西為栁浪聞鶯一曰濓溪樂處後宇為雲香清勝東垣為芰荷深處折而東北為香雪廊其東有樓為雲霞舒卷其南為彚萬總春之廟中祀花神東北有樓為香逺益清其西為樂天和為味真書屋一曰多稼如雲前宇為芰荷香一曰魚躍鳶飛四面為門東廂為暢觀軒西南為鋪翠環流樓南為傳妙室一曰北逺山村北岸為繪雨精舍其西南為水村圖又西有樓前後相屬前為皆春閣後為稻涼樓又西為涉趣樓右為湛虛書屋東北踰橋而西為湛虛翠軒又西為耕雲堂又西為若帆之閣一曰西峯秀色其東為含韻齋東南為自得軒後垣之西為花港觀魚一曰四宜書屋即安瀾園之正宇也皇上幸海寧陳氏園賜名安瀾兹略仿其意因以命名東南為葄經館西南為無邉風月之閣又西南為涵秋堂北為煙月清真樓樓西稍南為逺秀山房其北踰橋為染霞樓大共為安瀾園十景一曰方壺勝境樓宇臨池南建坊座其北樓宇為噦鸞殿又北為瓊華樓噦鸞殿東為蘂珠宫方壺勝境之西北為三潭印月又西北為天宇空明其後為澄景堂堂東為清曠樓西為華照樓一曰澡身浴德在福海西南隅即澄虛榭正宇也西為靜香館又西為解愠書屋西南為曠然閣其北度橋為望瀛洲又北為深栁讀書堂堂北為溪月松風一曰平湖秋月在福海西北隅東南度橋為兩峯插雲又東南為山水樂其北為君子軒為藏密樓一曰蓬島瑶臺在福海中央舊名蓬萊洲殿前東為暢襟樓西為神洲三島東偏為隨安室東南度橋為東島西北度橋為北島一曰接秀山房在福海東其後稍東為琴趣軒其北為尋雲樓東南為澄練樓樓後為怡然書屋山房之南為攬翠亭一曰别有洞天西為納翠樓西南為水木清華之閣閣西稍北為時賞齋一曰夾鏡鳴琴南為聚逺樓東為廣育宫中奉君碧霞元前建坊座後為凝祥殿宫之東為南屏晚鐘又東度橋為西山入畫為山容水態夾鏡鳴琴之西為湖山在望為洞裏長春一曰涵虛朗鑑在福海東即雷峯夕照正宇也有尋雲榭貽蘭庭諸勝一曰廓然大公在福海西北隅有雙鶴齋峭蒨居影山樓綺吟堂諸勝别為廓然大公八景一曰坐石臨流溪水周環其下一曰麴院風荷其西佛樓為洛伽勝境其南跨池為橋立坊楔西為金鼇東為玉蝀金鼇西南宇為四圍佳麗玉蝀東亭為飲練長虹又東南度橋折而北設城關為寧和鎮麴院風荷之北為同樂園其前為清音閣東為永日堂中有南北長街街西為抱朴草堂街北為舍衛城城南面為多寶閣正殿為夀國夀民後為仁慈殿又後為普福宫城北為最勝閣一曰洞天深處在如意館西稍南前宇四所乃諸皇子所居西為諸皇子肄業之所前為前垂天貺中為中天景物東宇為斯文在兹中奉師至聖先後為後天不老圓明園之東曰長春園本園東垣外隙地就添殿宇數所依長春仙館賜號即以名園園門內正宇為淡懷堂後為衆樂亭其後河北敞宇為雲容水態南北為含經堂後為淳化軒又後為藴真齋含經堂之東為味腴書屋亦名霞翥樓為淵映齋堂之西為梵香樓為涵光室自淡懷堂迤西濱河為蒨園有朗潤齋湛景樓諸勝别為蒨園八景蒨園後河北岸為思永齋齋東别室曰小有天園齋西稍南河外為得全閣南為寶雲樓北為逺風樓齋北河流滙處為樓宇三層曰海嶽開襟樓之東為法慧寺又東為寶相寺由寶相寺度城關而東迤南為翠交軒北為愛山樓又北為澤蘭堂愛山樓東北宇為平疇交逺風其東為叢芳榭後為琴清齋叢芳榭之東為獅子林有納景堂清閟閣諸勝别為獅子林八景又有清淑齋探真書屋諸勝為獅子林續八景其南為玉玲瓏館北為林光淡碧東為鶴安齋西南為蹈和堂玊玲瓏館之東南為映清齋齋東為鑑園北為潄瓊齋其東為師善堂鑑園之西南為如園內為敦素堂堂北稍東為冠霞閣又東為明漪樓由如園山徑西行即淡懷堂之東垣門恭載世宗憲皇帝御製園明園記圓明園在暢春園之北朕藩邸所居賜園也在昔皇考聖祖仁皇帝聽政餘暇遊憩於丹稜沜之涘飲泉水而甘爰就明戚廢墅節縮其址築暢春園熙春盛暑時臨幸焉朕以扈蹕拜賜一區林臯清淑波淀渟泓因高就深傍山依水相度地冝構結亭榭取天然之趣省工役之煩檻花堤樹不灌溉而滋榮巢鳥池魚樂飛潛而自集蓋以其地形爽塏土壤豐嘉百彚易以蕃昌宅居於兹安吉也園既成仰荷慈恩錫以園額曰圓明朕嘗恭迓鑾輿欣承色笑慶天倫之樂申愛日之誠花木林泉咸增榮寵及朕纘承大統夙夜孜孜齋居治事雖炎景鬱蒸不為避暑迎涼之計時踰三載僉謂大禮告成百務具舉宜寧神受福少屏煩喧而風土清佳惟園居為勝始命所司酌量修葺亭臺邱壑悉仍舊觀惟建設軒墀分列朝署俾侍直諸臣有視事之所構殿於園之南御以聽政晨曦初麗夏晷方長召對咨詢頻移晝漏與諸臣相接見之時為多園之中或闢田廬或營蔬圃平原膴膴嘉頴穰穰偶一眺覽則遐思區夏普祝有秋至若慿欄觀稼臨陌占雲望好雨之知時冀良苖之應候則農夫勤瘁穡事艱難其景象又恍然在苑囿間也若乃林光晴霽池影澄清淨練不波遙峯入鏡朝暉夕月映碧涵虛道妙自生天懷頓朗乘幾務之少暇研經史以陶情拈韻揮毫用資典學凡兹起居之有節悉由聖範之昭垂隨地恪遵罔敢越軼其采椽栝柱素甓版扉不斫不枅不施丹艧則法皇考之節儉也晝接臣僚宵披章奏校文於墀觀射於圃燕間齋肅動作有恆則法皇考之勤勞也春秋佳日景物芳鮮禽奏和聲花凝湛露偶召諸王大臣從容遊賞濟以舟楫餉以果蔬一體宣情抒寫暢洽仰觀俯察遊泳適宜萬象畢呈心神怡曠此則法皇考之親賢禮下對時育物也至若嘉名之錫以圓明意旨深逺殊未易窺嘗稽古籍之言體認圓明之德夫圓而入神君子之時中也明而普照達人之睿智也若舉斯義以銘户牖以朂身心虔體天意永懷聖誨含煦品彚長養元和不求自安而期萬方之寧謐不圖自逸而冀百族之恬熙庶幾世躋春臺人遊樂國廓鴻基於孔固綏福履於方來以上答皇考垂祐之深恩而朕之心至是或可以少慰也夫爰宣示豫懷而為之記恭載皇上御製圓明園後記昔我皇考因皇祖之賜園修而葺之略具朝署之規以乘時行令布政親賢而軒墀亭榭凸山凹池之紛列於後者不尚其華尚其朴不稱其富稱其幽樂蕃植則有灌木叢花怒生笑迎也驗農桑則有田廬蔬圃量雨較晴也松風水月入襟懷而妙道自生也細旃廣厦時接儒臣研經史以淑情也或怡悅於斯或歌詠於斯或惕息於斯我皇考之先憂後樂一皇祖之先憂後樂周宇物而圓明也圓明之義蓋君子之時中也皇祖以是名賜皇考皇考敬受之而身心以朂户牖以銘也不求自安而期萬方之寧謐不圖自逸而冀百族之恬熙則又我皇考綏履垂裕於無窮也豫小子敬奉先帝宫室苑囿常恐貽羞敢有所增益是以踐阼後所司以建園請郤之既釋服爰仍皇考之舊園而居焉夫帝王臨朝視政之暇必有遊觀曠覽之地然得其宜適以養性而陶情失其宜適以玩物而喪志宫室服御竒技玩好之念切則親賢納諫勤政愛民之念踈矣其害可勝言哉我皇考未就暢春園而居者以有此圓明園也而不斫不雕一皇祖淳朴之心然規模之宏敞邱壑之幽深風土草木之清佳高樓邃室之具備亦可稱觀止實天寶地靈之區帝王豫遊之地無以踰此後世子孫必不舍此而重費民力以創建苑囿斯則深契朕法皇考勤儉之心以為心矣藉曰祖考所居不忍居也則宫禁又當何如晉張老之善頌甚可味也若夫建園之始末聖人對時育物修文崇武煦萬彚保太和期躋斯世於春臺遊斯人於樂國之意則已具皇考之前記豫小子何能贊一辭焉靜明園在圓明園西玉泉山麓康熙十九年建初名澄心三十一年易名靜明我皇上幾餘臨憩略加修葺園為門凡六園內有十六景首曰廓然大公宫門內正殿也為臨幸時聽政之所北臨後湖一曰芙蓉晴照西為虛受堂一曰玉泉趵突為天下第一泉一曰竹罏山房仿惠山聽松庵製得名南為開錦齋後為觀音洞其上為賞遇樓南為吕祖洞一曰聖因綜繪仿西湖行宫景得名其西為寫流軒軒後為層明宇又西為福地幽居後為冠峯亭一曰繡壁詩態北為水月庵其北為聖緣寺又北為仁育宫中祀齊東嶽天聖帝一曰溪田課耕又西為迸珠泉一曰清涼禪窟後為嘉蔭堂堂東為霞起樓西為犁雲亭清涼禪窟之北為涵漪齋西為飛淙閣東為練影堂稍南為挂瀑簷涵漪齋之西為妙喜寺一曰采香雲徑其南有樓為靜怡書屋采香雲徑稍北折而東為招鶴庭一曰峽雪琴音額為麗矚軒一曰玊峯塔影仿金山妙高峯為之前為香嚴寺右為妙高室北峯上為妙高寺殿後為妙高塔又後為該妙齋峯之西為崇靄軒其東為含醇室後為詠素堂妙高寺東山麓為含經堂東北臨溪為書畫舫一曰風篁清聽東為如如室西為近清閣又西稍南為飛雲崴風篁清聽之西逾橋而南池東為延緑廳池西為試墨泉一曰鏡影涵虛南為分鑑曲又南為寫琴廊迤南為含暉堂後為清音齋齋西山麓為碧雲深處東為心逺閣一曰裂帛湖光當玊峯東麓臨裂帛湖由心逺閣折而北為羅漢洞又上為水月洞一曰雲外鐘聲在古華嚴寺之後一曰翠雲嘉蔭即華滋館也後為翠雲堂東為甄心齋其東即小南門稍南為東宫門靜宜園在圓明園西香山即香山寺故址聖祖仁皇帝於此置行宫乾隆十年重加修葺賜名靜宜園園有二十八景宫門內首曰勤政殿園中正殿也為臨幸時聽政之所殿前為月河殿後北為致逺齋西為韻琴齋為聽雪軒東有樓為正直和平殿後西為橫秀館由山南折而東為清寄軒一曰麗曯樓一曰緑雲舫一曰虛朗齋南為畫禪室後為學古堂東為郁蘭堂西為佇芳樓其外東西南北各設四面宫門東為帶水屏山其西為對瀑北為懷風樓其左為琢情之閣東南為得一書屋西為山陽一曲精廬一曰瓔珞巖其上為緑筠深處一曰翠微亭一曰青未了亦亭名一曰馴虎坡一曰蟾蜍峯其北稍東為松塢雲莊又東有樓為憑虛致爽一曰栖雲樓一曰知樂濠一曰香山寺舊名永安寺亦曰甘露寺皇上易今名一曰聽法松即香山寺殿門外松也北為海棠院一曰來青軒西為妙高堂軒之西南為歡喜園一曰唳霜臯亦亭名由香山寺西北由盤道上為洪光寺一曰香嵓室即洪光寺中殿宇一曰霞標磴一曰玉乳泉一曰絢秋林一曰雨香館其後為灑蘭書屋南為林天石海自勤政殿以迄雨香館是為內垣為景凡二十一曰晞陽阿其西為朝陽洞一曰芙蓉坪其東宇為靜如太古一曰香霧窟即靜室也東南宇為竹罏精舍其北巖間碣為西山晴雪一曰栖月崖其西宇為得趣書屋一曰重翠崦東南為玉華寺一曰玊華岫有泉名玊華泉其東為臯塗精舍一曰森玉笏東北為超然堂堂南為曠覽臺後為碧峯館一曰隔雲鐘亦亭名自晞陽阿以迄隔雲鐘是為外垣為景凡八恭載皇上御製靜宜園記乾隆乙丑秋七月始廓香山之郛剃榛莽剔瓦礫即舊行宫之基葺垣築室佛殿琳宫參錯相望而峯頭嶺腹凡可以占山川之秀供攬結之竒者為亭為軒為廬為廣為舫室為蝸寮自四柱以至數楹添置若干區越明年丙寅春三月而園成非創也蓋因也昔我皇祖於西山名勝古剎無不曠覽遊觀興至則吟賞託懷草木為之含輝巖谷因而增色恐僕役侍從之臣或有所勞也率建行宫數宇於佛殿側無丹艧之飾質明而往信宿而歸牧圉不煩如岫雲皇姑香山者皆是而惟香山去圓明園十餘里而近乾隆癸亥余始往遊而樂之自是之後或值幾暇輒命駕焉蓋山水之樂不能忘於懷而左右侍御者之揮雨汗而冒風塵亦可厪也於是乎就皇祖之行宫式葺式營肯堂肯構朴儉是崇志則先也動靜有養體智仁也名曰靜宜本周子之意或有合於先天也殿曰勤政朝夕是臨與羣臣咨政要而籌民瘼如圓明園也有憩息之樂省往來之勞以恤下人也山居望逺村平疇耕者耘者饁者穫者斂者歷歷在目杏花菖葉足以驗時令而備農經也若夫巖巒之怪特林薄之華滋足天成而鮮人力信乎造物靈奧而有待於靜者之自得耶凡為景二十有八各見於小記而系之詩清漪園在圓明園西萬壽山之麓本名甕山乾隆十六年恭逢聖母皇太后六旬萬夀建大報恩延夀寺於山之陽命名萬夀山並疏導玉泉諸派滙於西湖易名曰昆明湖中設戰船仿福建廣東巡洋之制香山健鋭營辨兵於湖內按期水操就昆明湖隄岸為園賜名清漪宫門內正殿亦曰勤政為臨幸時聽政之所殿後北達怡春堂西為玉瀾堂北為宜藝館館之西為樂夀堂堂前為青芝岫堂後折而西方池之北為樂安和又西北為養雲軒軒後為餐秀亭西為無盡意軒又西稍北為圓朗齋無盡意軒之西為慈福樓西即大報恩延夀寺寺西為羅漢堂堂後為寶雲閣閣西為邵窩為雲松巢又西為澄輝閣閣東南有樓曰山色湖光共一樓樓西為聽鸝館館西為石文亭為石舫其北有樓為延清賞西為曠觀齋又西為水周堂自怡春堂後城關迤北為惠山園仿惠山寄暢園規制為之有載時堂墨妙軒就雲樓淡碧齋水樂亭知魚橋尋詩徑涵光洞諸勝别為惠山園八景園之西為雲繪軒軒東為延緑軒後廊有樓為隨安室雲繪軒又西為花承閣閣之左為多寶琉璃塔閣西北度城關樓又西折而北即園之北樓門恭載皇上御製萬夀山昆明湖記嵗己巳考通惠河之源而勒碑於麥莊橋元史所載引白浮甕山諸泉云者時皆湮沒不可詳夫河渠國家之大事也浮漕利涉灌田使漲有受而旱無虞其在導泄有方而瀦蓄不匱乎是不宜聽其淤閼泛濫而不治因命就甕山前芟葦茭之叢雜浚沙泥之隘塞匯西湖之水都為一區經始之時司事者咸以為新湖之廓與深兩倍於舊踟蹰慮水之不足及湖成而水通則汪洋漭沆較舊倍盛於是又慮夏秋汛漲或有疏虞甚哉集事之難可與樂成者以因循為得計而古人良法美意利足及民而中止不究者皆是也今之為閘為壩為涵洞非所以待汛漲乎非所以濟溝塍乎非所以啓閉以時使東南順軌以浮漕而利涉乎昔之城河水不盈尺今則三尺矣昔之海甸無水田今則水田日闢矣顧豫不以此矜其能而滋以懼蓋天下事必待一人積思勞慮親細務有弗辭致衆議有弗恤而為之以僥幸有成焉則其所得者必少而所失者亦多矣此豫所重慨夫集事之難也湖既成因賜名萬夀山昆明湖景仰放勳之迹兼寓習武之意得泉甕山而易之曰萬夀云者則以今年恭逢皇太后六旬大慶建延夀寺於山之陽故爾寺别有記兹特記湖之成並元史所載泉源始末廢興所由云恭載皇上御製萬夀山清漪園記萬夀山昆明湖記作於辛未記治水之由與山之更名及湖之始成也萬夀山清漪園成於辛巳而今始作記者以建置題額間或緩待而亦有所難於措辭也夫既建園矣既題額矣何所難而措辭以與我初言有所背則不能不愧於心有所言乃若誦吾過而終不能不言者所謂君子之過豫雖不言能免天下之言之乎蓋湖之成以治水山之名以臨湖既具湖山之勝槩能無亭臺之點綴事有相因文緣質起而出內帑給雇直敦朴素祛藻飾一如圓明園舊制無敢或踰焉雖然圓明園後記有云不肯舍此重費民力建園囿矣今之清漪園非重建乎非食言乎以臨湖而易山名以近山而創園囿雖云治水誰其信之然而暢春以奉東朝圓明以恆蒞政清漪靜明一水可通以為敕幾清暇散志澄懷之所蕭何所謂無令後世有以加者意在斯乎意在斯乎及憶司馬光之言則又爽然自失園雖成過辰而往逮午而返未嘗度宵猶初志也或亦有以諒豫矣長河樂善園在西直門外長河之上其水發源於玊泉由昆明湖之秀漪橋東流注於此謂之長河自西直門外高梁橋之北為倚虹堂乾隆十六年聖母皇太后六旬萬夀自長河至高梁橋易輦進宫因建是堂其西二里許為樂善園舊為康邸園亭頽廢已久乾隆十二年重加修葺有含清齋藴真堂鸞舉軒諸勝為皇上幸圓明園進舸所必經之路南苑在永定門外二十里元為下馬飛放泊明永樂中增廣其地中有海子大小凡五以禁城北之積水潭亦名海子故此别名南海子本朝設總尉防禦等官守之周垣百二十里為門凡九蕃育禽獸其中為行圍講武之地南紅門及舊衙門新衙門團河等處俱設有行宫臣等謹案禹貢首列冀州以其為帝都所在第考其時堯都平陽舜都蒲坂禹都安邑皆居河東之界雖在冀州境內非即燕薊之地也鄭氏都邑略謂中原無事則居河之南中原多事則居江之南以汴梁為戒而特取南陽可以建都蓋其時燕薊之境久入於金故置而不論其所稱依河為固依江為固者猶是偏安之見豈議都之定論哉自漢桓寬鹽鐡論謂燕之涿薊富冠海內為天下名都宋朱子亦謂古今建都之地莫過於冀自為不易之論遼之南京金之中都元之大都明之北京歷代相因未之或改我朝誕膺景命都邑由舊而政教維新列聖相承治隆化洽我皇上握健行廣運之模厪保泰持盈之計建中立極久道化成用奠我國家億萬世丕丕基猗歟盛哉皇朝通志卷三十三
