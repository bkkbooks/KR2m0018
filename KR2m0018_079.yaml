front:
  text: 欽定四庫全書皇朝通志卷七十九
  hash: sha256:0b513bbb4988ccc7e941ef328c5a43a21ad3d60e53f32f5ec5bbf6ac465c1e8a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_079-1a, image: WYG0645/WYG0645-0173a.png}
body:
  text: 刑法略五刑制欽恤凡恭遇慶賀穿朝服及祭享齋戒封印之期上元端午中秋重陽等節四月初八日每月初一初二日並穿素服日期俱不理刑名又每年四月初一日起至七月三十日止時正農忙一切民詞除謀反叛逆盜賊人命及貪贓壞法等重情并姦牙鋪户騙劫客貨確有證據者俱照常受理外其户婚田土等細事一概不凖受理違者督撫題參州縣詞訟凡遇隆冬嵗暮俱隨時審理不得照農忙之例停訟展限其在農忙期內若查勘水利界址等事現涉爭訟清理稍遲必致有妨農務者即令各州縣親赴該處審斷速結不得票拘至城或至守候病農每年於小滿後十日起至立秋前一日止如立秋在六月則以七月初一日為止枷責等輕罪皆減等發落笞罪寬免監禁重犯量加寬恤杖罪遞行八折枷號以五日為一等惟盜及傷人并旗人原犯軍流徒罪折枷者俱不凖減免並於秋涼補枷凡軍流及外遣人犯十月至正月終停其發遣人犯已至中途者初冬十月照常接遞至十一月初一日方凖停遣俟次年春融時轉解六月閏六月同其軍犯在配脫逃被獲應發原配并調發及發遣新疆人犯雖遇隆冬盛暑不凖停遣雲南省並無酷暑嚴寒不在停遣之例軍遣犯內發往東南家口有情願赴配所者取具確供起解其不願者聽凡滿洲蒙古漢軍緑旗官員軍民人等有犯死罪除十惡各項重罪外其餘察其祖父及子孫陳亡者隨本聲明於秋審時恭候欽定但於優免一次之後俱不凖再行聲請又犯罪未發而自首者免罪猶徴正贓其輕罪雖發因首重罪者免其重罪若因問被告之事而别言餘罪者亦如之其遣人代首若於法得相容隱者為之首及相告言各聽如罪人身自首法若自首不實及不盡者以不實不盡之罪罪之至死者聽減一等其知人欲告及逃叛而自首者減罪二等損傷於人於物不可賠償事發在逃私越度關及姦並不在自首之律強竊盜詐欺取人財物而於事主處首服及受人枉法不枉法贓悔過回付還主者與經官司自首同皆得免罪若知人欲告而自首亦得減罪二等其強竊盜能捕獲同伴解官者亦得免罪依常人一例給賞凡年七十以上十五以下及廢疾犯流罪以下收贖例應枷號一體放免其犯死罪及謀反叛逆緣坐應流若造畜蠱毒採生折割人殺一家三人家口會赦猶流者不用此律如年八十以上十嵗以下及篤疾犯盜及傷人罪不至死者收贖餘皆勿論八十以上十嵗以下犯謀故鬬殺及應死者篤疾犯鬭殺及應死者議擬奏聞取自上裁篤疾謀故殺人仍依律擬罪不凖奏請其十嵗以下鬬毆殺人必死者長四嵗以上方凖聲請如止三嵗以下仍擬絞抵九十以上七嵗以下雖有死罪不加刑有人教令坐其教令者有贓應償受贓者償之七十以上十五以下及廢疾犯流罪以下者凖其收贖一次若收贖之後復行犯罪除因人連纍過誤入罪者仍凖收贖如係有心再犯即各照應得罪名按律充配其犯罪時未老疾事發時老疾者依老疾論若在徒年限內老疾亦如之犯罪時幼小事發時長大依幼小論犯反逆者均不用此律凡犯死罪非常赦不原而祖父母父母老疾家無以次成丁及孀婦守節已逾二十年而又年逾五十者如實繫獨子所犯戲殺誤殺等案該督撫將應侍緣由題本聲請法司隨案核覆奏請上裁即照免死流犯例枷號兩個月折責四十板勒追埋葬銀兩給與死者家屬養贍其鬬殺之案止將應侍緣由隨案聲敘俟秋審時查明取結報部核擬另册進呈恭候欽定若犯軍徒流者決杖一百餘罪折枷凖其留養兄弟共犯死罪者存留一人養親仍照律具奏請旨如審繫遊蕩他鄉忤逆犯案及素習匪類為父母擯逐若犯姦拐強盜行凶有關倫理擾害地方並被殺之人亦繫獨子本有兄弟並姪出繼可以歸宗身為人後所後之家可以另繼及誣告人謀故殺及為強盜等罪以致被誣良民久淹獄底身受刑訊蕩産破家逮審明反坐者概不凖留養又夫毆妻至死之案無故殺别情果繫父母已故家無承祀之人該督撫將應行承祀之處聲明照留養例取結辦理又凡搶竊及三犯竊盜等犯凖其留養一次有復犯者不凖留養旗人例合留養承祀者視民人之例天命六年諭凡應死笞罰諸罪必追論其功有功則當死者贖當罰者免當笞者戒飭而釋之功罪宜令相凖其由武功授職者必行間獲罪乃革其官他罪皆贖若不由武功授職者視罪之輕重為斷著為令順治元年諭人命至重豈容一概誅戮以後在京重大獄情詳審明確奏請正法在外仍明律斷罪如有恣意輕重等弊指參重處又定恤刑官五年一差慎選亷明者往八年諭方今天時向熱宜行熱審之例令刑部通察刑獄五城司坊順天府京縣察監犯有無干牽連者即日釋放笞杖徒流次第減免死罪情可矜疑者奏請定奪十二年諭朕日覽三法司章奏議決重囚一日必五六人或十餘人念兹愚民兵戈災祲之後復罹法網深可憫惻稽古有虞之世民不犯於有司漢文帝唐太宗亦幾致刑措今犯法者衆豈果風俗日偷民盡愍不畏死歟抑朝廷德教未敷故百姓從化無路歟或讞獄諸臣膠執爰書輕於失入歟又或所在有司不肯留心化導以致扞網紛紛歟干和召戾皆朕之責今後爾等問刑衙門遵奉此諭即將見在未結獄案悉心清理原情凖法務求平允但不得故縱市恩仍傳諭各直省督撫申戒所屬慎重刑獄不得羅織刻核郡邑長吏亟倡明教化使小民明於親遜之誼各愛身家毋輕抵罪自然獄案漸減囹圄可空以仰符天心漸至太平未必不由於此若奉行不力負朕好生之意必不輕貸康熙十一年諭刑獄重地人命攸關天氣炎熱亟宜清理雖熱審見有定例但已結大案見在監禁各犯久淹羈禁朕心惻然其令詳加審鞫有情可矜疑者即與察明事由開列具奏十八年因旱遣官恤刑諭朕因久旱軫懷誠恐外省罪犯中或多寃抑特選爾等體朕矜恤庶獄之意凡事務推勘確實從公審斷勿徇私見顛倒是非仍宜兼程遄往作速清結倘遲延時日恐無賴之徒藉端生事揑詞妄訐反纍貧民至所審案件或當或否朕無不洞悉爾等慎之又諭遣閣臣會同三法司將已結大案在監者詳加審理無使寃滯直省監候重犯選賢能司官會同該撫將大小刑名事件不論已結未結逐一詳審其重罪內情可矜疑者奏請定奪小罪即行完結造册報部二十三年諭軍流人犯甫離刑獄一線僅存盛暑嚴寒必致危亡今皆停遣二十五年諭獄訟重情關繫民命今天氣炎熱恐有情可末減者淹斃囹圄朕心不忍特遣大臣會同三法司詳審具奏直省督撫一體遵行五十年停止熱審諭為政惟以真誠為尚徒博矜憫之虗名遇熱而審遇寒而審不時遣官恤刑將督撫審讞案牘頻飭駮改則貽纍滋多互訐之端何所底止夫有司簡清辭訟速結案件即為良吏雖不熱審亦無所害著通行問刑衙門知之雍正元年仍復熱審諭熱審減等舊有成例逮日久弊生罪人妄希巧脫胥吏因緣為姦故延日期致逃法網是以停止我聖祖仁皇帝如天好生每嵗夏月必特沛恩綸監候者免其刑具枷責者緩至秋涼雖停熱審之例仍寓減等之心澤至渥也朕仰體聖慈時深欽恤仍復熱審減等舊例其監禁重犯亦量加寬恤至情罪可疑及牽連待質人等暫豫保釋俟秋後再行拘禁凡內外一體詳慎遵行其有故意遲延希圖漏網者本犯不凖減等官吏嚴加議罪二年諭刑名重務未能清理下傷民命即足上干天和朕於讞獄再三詳慎法外從寬者不可勝數並未寃抑一人此亦可自信者爾等執法之官固宜外示嚴明亦須中存仁恕凡案件易結者毋執定限速行審理使輕罪早脫囹圄無辜亦免牽連倘任意耽延雖所告得伸亦多含怨即訊鞫罪人亦不可輕用重刑若云非夾訊不能定案此尤爾部之大謬矣録囚之際但求平允不可過當爾等訊獄動刑習為常事當思無負重任亦須自念子孫豈可疏忽致有後悔乎尚其同寅協恭速為辦理毋恃才偏執毋推諉瞻徇以體朕心以恤民命五年諭刑名關係民命死者不可復生朕於刑名更加慎重書曰天討有罪五刑五用哉必輕重悉當天理乃為欽承天道若應嚴而寬便是逆天寬且不可而况嚴乎朕為人君尚不可稍失其平况人臣居法司之任乎蓋鴟梟不除無以致鸞鳳稂莠不剪無以植嘉禾姑息養姦則小人無懲戒必不能改惡以從善故刑者使人遷善逺罪所以輔教化者也居法司之任者務操至平至公之心時凛天監在兹之懼使寬嚴悉當輕重允孚則不愧明允之司而成無刑之治矣九年諭清理刑獄除重罪候決人犯外凡牽連待質及候審輕罪著刑部覆明速行完結或暫豫保釋八旗髙墻拘禁人犯亦照此辦理枷示人犯除永逺枷示者不宥外其有限期未滿者照例保釋於處暑後補枷外省已經到部之案有擬徒杖凖折贖者悉寬免之十年諭凡疑獄監候待質人犯除強盜案件外如人命等案有正犯未獲將牽連餘犯監候已過三年者著取的保釋放有私自逃匿者將本犯重治其罪令直省一例遵行乾隆二年諭小民之犯杖責者其罪本輕而盛暑之中量減其敲朴之數乃國家寬恤之仁八折之例由來已久不當輕為改易八年諭今嵗天氣炎熱甚於往年省刑之典允宜舉行著刑部於在京徒杖以下輕罪查明減釋其重犯雖法無可寬際此炎天著添蓋席棚給與冰湯藥餌無致病暍十五年諭國家欽恤民命德協好生至於鰥寡孤獨尤所矜憫是以定有獨子留養之例凡屬情輕皆已霑恩減等惟是愚民無知往往輕身鬬狠不知留養為格外施仁或轉恃此為幸免之路以致羅於法網因其案情稍重或理曲尋釁金刃重傷雖經督撫聲請仍以原罪定擬不凖留養固屬該犯罪所應得但聲請之案不過尋常鬬毆等類斷不至入於情實徒使淹禁囹圄不得侍養而窮老孤孀無所倚賴深可軫惻朕思此等罪犯本非有謀故重情為常赦所不原既經定擬本罪拘繫逾時已足馴其桀驁之氣應量為末減俾得自新上年秋審此等案犯經九卿定擬矜減者止有二起餘仍監候著該部察明各犯祖父母父母見存果無次丁侍養概可以矜減等請旨發落嗣後獨子犯罪未邀寬減者該督撫於秋審朝審册內聲明九卿覆核時照此辦理以昭軫雪無告之至意著為令十七年諭朕命刑部察奏命盜等案因贓迹未明監候待質者共五十四案內康熙年間一案雍正年間十一案而自乾隆元年至十七年統計己未入秋審者積至四十二案雖年逺之案漸消漸少近者則積而見多然使於辦理之初即能詳慎研究務在得情則監候之案何至如此即此亦可見近來辦事諸臣不如從前之實心振作矣此非使無辜之人久繫囹圄即使應辟重犯久羈顯戮而犴狴之中淹禁多人亦非所宜皆因承審各官不能實力辦理又或刑部司員以有遵駁改正議敘之例多尋罅漏外省無以登答轉成疑案一經題明監候待質即束之髙閣而接任之員又以非本任之事率多因循殊非明慎用刑而不留獄之意著刑部將此沈案速行清理嗣後內外問刑衙門於一切命盜重案各宜留心迅逺辦理應緝拏者上緊緝拏應定擬者即行定擬勿致塵案日積若本非難結之案承審各官不能審出實情惟以監候待質為遷延時日之計且藉得邀免處分希冀録敘該堂官督撫察出即嚴行參處此亦清理庶獄之一法可通行曉諭知之是年以天氣炎蒸命熱審減等展至處暑日為止越旬日雨澤尚未霑足復諭刑部仍行減等俟雨足後照舊辦理十九年諭將乾隆十五年以前親老丁單之犯原題未經聲敘者傳諭各該督撫據實核明一例入册量豫末減以示矜恤三十八年諭例載獨子養親一條必先查核死者並非獨子而凶犯實在家無次丁方凖聲請亦須核其情節本輕又毫無别故者始可照例援請至其中案情稍重雖經聲請不凖留養者前經朕以此等尚非謀故重情常赦不原曽降旨俟其拘繫經年量為末減亦不必於定案時將命案正犯遽行開釋是於明慎用刑之中更寓法外施仁之意苐恐愚民無知恃有留養之例凡係獨子動輒輕身鬬狠易罹法網是隨案辦理留養非為無益而且害之與其急於縱釋而民輕犯何如稍加慎重之轉得矜全乎嗣後內外問刑衙門遇此項案情務須確核罪由審酌至當妥協辦理毋得意存姑息將此通諭中外知之皇朝通志卷七十九
