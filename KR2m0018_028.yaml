body:
  text: 地理略五水道一臣等謹案鄭樵志地理首列水道一門其説以為州縣之設有時而更山川之形千古不易所以禹貢分州必以山川定經界使兗州可移而濟河之兗不能移梁州可遷而華陽黑水之梁不能遷其説當矣顧所述止於四瀆未足以包括域內水道之全勢又其言四瀆也諸水參用舊名州縣間循舊號如褒文旬淯諸水止列水名而不疏證其所經之地江源河源僅仍舊説而不能加以斷制之詞是尚未足以稱綜核也恭惟聖朝輿圖廣博建置精詳東瀛西濛均入版圖疆理之盛固非前代所可幾及而紀地之圖書則有欽定輿地全圖欽定大清一統志凡域內之一山一水無不斟綜辨析瞭如指掌至如灤河熱河之原委塔思哈河之對音黃河之真源濟淮之故迹前人所靡能定説者我皇上御製詩文洞悉源流炳耀千古猗歟盛已兹謹稟承纂載用鄭氏例而增益其所未備首列京畿諸水尊宸極也次敘盛京及黑龍江諸水重肇基也次河水及入河諸水而西域回部青海甘肅陜西山西河南江南山東之水凡涉於河者以次載焉次淮水及入淮諸水次大清河諸水而河南江南山東之入淮入濟及自入海者以次載焉次運河自山東之汶水而北至京師南至江淮復踰江而迄於浙重漕渠也次大江及入江諸水而西藏四川陜西湖南湖北雲南貴州江西安徽江蘇之水以次載焉次太湖浙江閩江粵江滇江諸水而水之在南紀者皆悉著矣次新疆伊犂諸水著偉績也於是域內之經流巨川詳晰臚載府縣盡循今名疆域悉遵新制無敢循舊説以為假借傅會之文志慎重也謹釐為四卷列於地理疆域之後京畿諸水玉河源出宛平縣玉泉山滙為昆明湖東南經長春麥莊二橋過廣源閘至髙梁橋分流經德勝門入西水關滙為積水潭入皇城為太液池環繞紫禁經金水橋出玉河橋達正陽門東水關至東便門東水關下注大通河東南流設五閘瀦水濟運至通州髙麗莊入白河自大通河以下亦名通惠河白河即古沽水源出赤城縣東邊外西南流入邊城有獨石水自赤城縣南龍門水自龍門縣南來會又東出邊外又東南入邊南流經密雲縣西有潮河來會潮河見後西南流經懷柔縣南又經順義縣東又南至通州東北有沙河來會沙河出昌平州之居庸關即溼餘水亦曰榆河經大興縣北合清河水又東南入於白河稍南玉河水來會玉河見前南經張家灣東有涼水河來會涼水河出右安門西南鳳泉東流經萬泉寺分為二支一自南經草橋一自北經廣恩寺皆曲折東注至永勝橋復合東南流循南苑繚垣而東至小紅門西入苑牆東南流經沙底橋折而南厯頭閘至二閘一畝泉之水自西來會又南而東至鹿圈村三海子以上之水自西南來會又東南流至五空橋出苑牆經馬駒橋迤東至張家灣來入白河經舊漷縣北折東北經香河縣東又東南經武清縣東南又東南至天津府西北之西沽永定河永定河見後合拒馬易水及子牙河皆會拒馬河易水子牙河並見後又東南運河合漳水漳水見後滹沱河滹沱河見後來會乂東南至大沽北入於海潮河即古鮑邱水源出古北口外西北御馬厰地東南入邊在古北口之西經南臺西南至密雲縣東北又西南經縣城東又西會白河永定河即桑乾河古曰溼水亦曰渾河康熙三十七年賜名永定河源出山西朔平府馬邑縣西北東南流有灰河自朔州來會東北流經山隂縣北又東北經應州北有渾河自渾源州經應州來會又東北經大同府南有武州川自左衛西南衛河自大同北邊合而來會又東北經渾源州陽髙天鎮廣靈蔚州境入直𨽻界經懷安縣南又東北經保安州南又東北有東洋河合西洋河清水河經宣化府西南保安州東北來會經懷來縣有媯河自延慶州來會東南流入邉城經昌平州及宛平縣西境出盧溝橋下又東南經良鄉縣東固安縣北又東南經永清縣北霸州東北東安縣南玉帶河自西南來會玉帶河見後東流過三角淀經武清縣東子牙河自南來會又東至西沽南白河自北來會又東南運河自西南來會所謂丁字沽也東流經天津府北至大沽北入于海玉帶河即清水河亦曰會同河西南自任邱趙北口泊東北流至保定縣北霸州南由苑家口東北經永清東安之南會永定河以入海即拒馬易水滱水諸川之委滙也拒馬河即淶水古名桃水源出山西代州及易州廣昌縣北山經長城北東流至紫荆關入長城東北經易州山中折東南經淶水縣東北又東南經涿州城有胡良河自房山縣來會琉璃河即古聖水自良鄉縣來會又南經固安縣西南新城縣東南又南有北易水亦名白溝河有中易水並自易州合窮獨山所出之濡水來會濡水為三易上源之一乾隆二十六年特加疏濬賜名安河東南流經定興縣南境又經雄縣西南至趙北口入泊長流河即古南易水一名雹水一名鮑河源出易州西南山東南流經安肅縣北容城縣西至新安縣西南有徐河自易州西南經滿城縣北清苑縣北安州西北來會東入於泊豬龍河即唐河古名滱水源出山西渾源州南會溫泉水嘔夷水經靈邱縣城南又東南經廣昌縣境入直𨽻界又東南經唐縣及曲陽縣北又經定州北祁州南有沙河滋河來會沙河即古恆水亦名派河源出山西繁峙縣東入長城經阜平縣東南曲陽縣西南又南經行唐縣東北新樂縣南又東經定州南無極縣北深澤縣北又東至祁州東南會滋河入於唐河滋河即古資水源出山西五臺縣東穿長城入直𨽻平山縣西北經靈夀縣北行唐縣南又經真定府北無極縣南東北流經晉州西北深澤縣北又東北至祁州東南合沙河會唐河為豬龍河經博野縣蠡縣南又經肅寧縣北髙陽縣南至安州東南入泊滹沱河源出山西繁峙縣東北曰青龍泉經代州東南崞縣城東又南經欣縣經定襄縣西北有雲中河牧馬河來會又經五臺縣南有清水河自五臺山來會又經盂縣東北入長城至直𨽻界有冶河即古綿蔓水自井陘縣來會又經靈夀縣南獲鹿縣北真定府城南又經藁城縣北晉州南又東南至束鹿縣入大陸澤自澤東南流經冀州北衡水縣西北武邑縣北武強縣南又經交河縣西至獻縣南分為二派一經滄州西與漳河合一經河間府東至天津府青縣境又北經子牙汛曰子牙河又北經靜海縣會清水河北泊即大陸澤亦曰巨鹿曰廣阿西受槐河西南受滏陽南泊水南受漳水支津北受滹沱河至冀州北東北流經衡水武強北又至獻縣南分二派以會於直沽洵巨澤也槐河即古泜水亦名沮水源出贊皇縣西南東經元氏縣南髙邑縣北欒城縣南趙州南柏鄉縣北又東南經寧晉縣南入泊滏陽河即滏水源出磁州西東北流經邯鄲縣東南又經廣平府城東肥鄉縣北曲周縣東南雞澤縣東平鄉縣東又北至巨鹿縣西南有南泊水自順德府城邢臺縣來會又經巨鹿縣西隆平縣東入北泊漳河有二源曰清漳曰濁漳清漳源出山西樂平縣西經和順縣至遼州南有長城鎮水來會又東南入河南涉縣界又西南至林縣之交漳口會濁漳水濁漳源出山西長子縣東北流至潞安府北境又經屯留縣東潞城縣西有絳河潞河來會又北至襄垣縣南有沁州水合銅鞮水來會至黎城縣東北有榆社水合武鄉水來會又東入河南林縣西北界又東會清漳水東經彰德府安陽縣北入直𨽻廣平府磁州界經成安縣南仍與河南臨漳縣分界又經廣平縣西南分二派一東流經魏縣元城縣又東北入山東冠縣界合衛河至臨清州入運河一東北流經廣平縣肥鄉縣入山東邱縣南又分二派一東北流入直𨽻威縣南境經清河故城棗強縣東又經景州武邑阜城交河縣境又至滄州西會滹沱河一西北流至直𨽻界龍堂鄉經廣宗巨鹿新河縣北流入北泊會滹沱河至天津入海衛河源出山西潞安府南經澤州東南入河南懷慶府北入於沁水其分一支經溫縣北武陟縣北修武縣東南又東北經獲嘉縣北有五峪水自山西陵川縣東南入河南輝縣西來會又東北有百泉水來會又經新鄉縣北衛輝府西南至淇縣東南有淇水來會淇水源出山西平順縣南陵川縣東有浙水壅水盈盈水來會入河南林縣南境經淇縣西北有淇泉來注又東南與衛河會東流經滑縣西南濬縣西又經湯隂縣東有湯河來會又東北經安陽縣東南內黃縣北入大名縣南南樂縣北又經元城縣東北境入山東冠縣西界有漳河支流來會又經館陶縣臨清州入運河北至天津會白河諸水入海灤河即古濡水一名難河源出獨石口外東北一百餘里名都爾本諾爾西北流入多倫諾爾廳界又北經上都河屯名上都河又東南至大河口又南經鴈北灘入承德府豐寧縣界又南經西屯庫有奇勒河亦名小灤河自北來會自此名灤河至郭家屯入承德府本境東南經灤平縣界繞喀喇河屯行宫有伊遜河發源木蘭圍場自北來會東南流經承德府東南境鳳凰嶺下熱河自東北來會熱河見後折南流有白河老牛河栁河車河皆來會又東南經喜峯口之西入邊經遷安縣界有龍井關河自遵化州邊外來會又東南至永平府西北盧龍縣界有青龍河即古瀘水自邊外來會經灤州城東樂亭縣城西分二港一東南入海一南經齊家莊入海熱河即古武列水源出承德府北境之察罕陀羅海經固都爾呼嶺名固都爾呼河西南至中關東茅溝河水自玳瑁溝西南流來會又南賽音河自霍爾霍克嶺曲折流來會沿避暑山莊行宫東北厯錘峯下行宫內有溫泉流出滙之遂名熱河南流折東南入於灤河臣等謹案灤河熱河發源邊逺紀載多舛在今為秋巡駐蹕重地恭讀皇上御製熱河考灤河濡水源考證指示酈道元水經注及諸志之是非離合至詳且悉如濡水正源為都爾本諾爾道元誤以三道河當之白檀要陽為今密雲縣地道元誤云灤水經白檀北歐陽修言灤水出炭山為今邊外之黑老山明統志誤指為萬全縣之炭山金蓮川在今上都河屯為灤水所經元史誤以為灤水出金蓮川熱河三源西源先合中源次合東源道元則互紊東藏川中藏川會合之序良由未克親履其地晰其支派故未免舛誤相踵伏承聖製昭陳燦如指掌始得稟承紀載無誤無惑云薊運河即古泃水亦曰沽河源出遵化州東北有沙河出州北邊城外合馬蘭河來會西流有淋河自邊外來會又西經薊州南有盤山東水來會又西南有平谷縣水玉田縣水來會又東南經豐潤縣西有還鄉河即古巨梁水來會又東南入海盛京諸水鴨緑江一名益州江亦名靉江即古馬訾水源出長白山南麓有小白山水來注南流左受朝鮮北境諸水折西北凡長白以西諸水自十二道溝至頭道溝皆來注折東南屈曲流納諸小水佟家江自西北來會佟家江見後又屈曲流有愛哈河亦名阿布河出愛哈邊門外合諸水自鳳凰城來會又南流分三派而合經義州西又西有哈連河來會又西南為鴨緑口入於海佟家江亦名通吉雅江即古鹽難水源出衣爾雅哈範山之南西南流有哈爾敏河來會又西南有甲爾圖庫河來會又西南有王清河自王清邊門外來會又西南有拉哈河源出興京南栁邊外山東南流來會又東南會大沽小沽二水又東南會唐石河入鴨緑江大遼河一名句驪河亦名巨流河即潢河古稱饒樂水濫真水托紇臣水吐護真水有二源西源出古北口外克什克騰部界內今蒙古稱曰西喇木倫東北流經巴林南有黑水河自巴林境來會經阿嚕科爾沁翁牛特境有白狼河來會白狼河亦曰狼水曰土河曰老河源出喀拉沁右翼南東北流經敖漢部西會翁牛特之英金河經翁牛特左翼南入潢河又東北至札嚕特界奈曼界又經喀爾喀左翼界經科爾沁左翼境有東源來會東源名黑爾蘇河源出吉