body:
  text: 欽定四庫全書皇朝通志卷六十三樂畧二祀饗正聲臣等謹按鄭樵於祀饗正聲自漢郊祀十九章東都五詩外僅列梁之十二雅唐之十二和然猶謂其雅頌不分神人互用後若漢之十二成周之十二順宋之十二安金之十二寧皆依仿梁制而之顧自宋以來更多舛戻如髙安為祀天神之樂而移祭帝鼐理安為享宗廟之樂而奏送天神迨乎有明雜用宫商遂無統紀我朝禮隆樂備世祖章皇帝御宇之初即定郊廟朝廷之樂錫名曰平聖祖仁皇帝兩加増定樂章備焉皇上折衷古制按律分宫因事異宜秩然不紊制作明備莫可比隆兹所編輯一遵律吕正義後編所定先郊廟次朝㑹燕饗即鄭樵所云有天地之樂有宗廟之樂有君臣之樂不同禮不同聲之義也至燕饗樂内如學庠舉行鄉飲酒禮暨部宴衍聖公文武進士皆嘉惠臣下與親臨錫宴之典不同今謹載入祀饗别聲以備鄭志之一體考原志别聲一門祀饗並列我朝䖍恪祀事特昭鄭重兹别聲所列均屬燕饗之樂仰見盛時規制迥非前代所可比符云圜丘樂九成黄鍾為宫始平迎神景平奠玉帛咸平進爼夀平初獻嘉平亞獻永平終獻熈平徹饌清平送神太平望燎臣等謹按每嵗冬至大祀天於圜丘用樂九成以黄鍾為宫考順治元年定終獻之樂名雍平送神名太平望燎名安平乾隆七年重定今名又按順治十七年定大享殿合祀樂定迎神奏元和奠玉帛景和進爼肅和初獻夀和亞獻安和終獻永和徹饌協和送神泰和望燎瘞清和樂章用和字後未經復行至乾隆十六年改大享殿為祈年殿每嵗於此行祈穀之禮焉祈穀樂章見後臣等又按周禮圜鍾為宫奏之圜丘函鍾為宫奏之方澤乃又曰奏黄鍾以祀天神奏太蔟以祭地祇經文互異若漢奏黄鍾以祀天地是圜丘方澤同一宫調隋則奏黄鍾以祀天奏太蔟以祭地至祖孝孫作唐大樂乃定圜丘以黄鍾為宫方澤以林鍾為宫最為近古然唐制登歌奠玉帛天神大吕為宫地祗應鍾為宫俎入天神黄鍾為宫地祗太蔟為宫未免錯雜宋時冬至祀圜丘以黄鍾為宫孟春祀感生帝以太蔟為宫孟夏雩上帝以仲吕為宫夏至祀皇地祇以𬎼賔為宫孟冬祭神州地祇以應鍾為宫是葢隨月用律亦未允協我皇上博考前規貫通三極以黄鍾位子為天統天壇樂章以黄鍾為宫林鍾位未為地統地壇樂章以林鍾為宫定論昭垂永為法守記曰大人舉禮樂則天地為昭其斯之謂歟方澤樂八成林鍾為宫中平迎神廣平奠玉帛含平進俎太平初獻安平亞獻時平終獻貞平徹饌寧平送神臣等謹按每嵗夏至大祀地於方澤用樂八成以林鍾為宫考順治元年定進俎之樂名咸平初獻名夀平乾隆七年重定今名臣等又按黄鍾子為天統林鍾未之衝丑為地統太蔟寅為人統其説本於班固夫天秉陽一陽初復律中黄鍾是為天統宜矣至於夏至一隂生律中𬎼賔地秉隂而不以𬎼賔為地統者陽律而隂吕也陽性剛其長也勃焉故一陽初復即為天統隂性柔其長也以漸故積至二隂方能受任於太陽以生長萬物此未之所以為中央土而為地統也况林鍾之律六寸適合地之成數乎祈穀壇樂九成黄鍾為宫祈平迎神綏平奠玉帛萬平進俎寳平初獻穰平亞獻瑞平終獻渥平徹饌滋平送神穀平望燎臣等謹按每嵗正月上辛祭上帝於祈年殿祈穀用樂九成以黄鍾為宫考順治元年定迎神之樂名中平奠玉帛名肅平進俎名咸平初獻名夀平亞獻名景平終獻名永平徹饌名凝平送神名清平望燎名太平乾隆七年重定今名雩祭樂九成黄鍾為宫靄平迎神雲平奠玉帛需平進俎霖平初獻露平亞獻霑平終獻靈平徹饌霮平送神霈平望燎臣等謹按每嵗孟夏龍見欽天監擇日行常雩禮用樂九成以黄鍾為宫乾隆七年定御製雲漢詩臣等謹按乾隆七年定大雩典禮皇上倣雲漢詩體御製詩歌八章於大雩致祭終獻之後用舞童十六人執羽翳歌此詩聖念懇誠宸章剴切勤求民瘼之意於斯可仰見云太廟時享樂六成太蔟為宫貽平迎神敉平奠帛初獻敷平亞獻紹平終獻光平徹饌乂平送神還宫臣等謹按毎嵗孟春初旬孟夏孟秋孟冬朔日行時享禮於太廟用樂六成以太蔟為宫毎月朔望及三大節奉先殿致祭同考順治元年定迎神之樂名開平奠帛初獻名夀平亞獻名嘉平終獻名雍平徹饌名熈平送神還宫名成平乾隆七年重定今名臣等又按圜丘方澤宗廟所謂三大祭也顧周禮既曰黄鍾為宫奏之宗廟乃又有奏無射享先祖奏夷則享先妣之文不無疑義漢奏㽔賔以祀宗廟惟唐祖孝孫定宗廟以太蔟為宫未㡬而張文收復改用黄鍾且俎入則用無射殊為未協我皇上折衷羣議以太蔟寅位人之統也乃定太蔟為宫與圜丘黄鍾方澤林鍾相生之序適合洵可為萬世法矣太廟祫祭樂六成太蔟為宫開平迎神肅平奠帛初獻協平亞獻裕平終獻諴平徹饌成平送神還宫臣等謹按每嵗十二月大建以二十九日小建以二十八日行袷祭禮於太廟用樂六成以太蔟為宫考順治十六年定迎神之樂名貞平奠帛初獻名夀平亞獻名嘉平終獻名雍平徹饌名熙平送神還宫名清平乾隆七年重定今名臣等又按朝㑹之樂隨月用律而太廟不用月律者葢太廟若與朝㑹相同則大祫于建丑之月于法當用大吕時享以四孟之月于法當用太蔟仲吕夷則應鍾是十二律吕闕其七故惟太蔟一宫寅為人統人本乎祖用之太廟至為精當也社稷壇樂七成春夾鍾為宫秋南吕為宫登平迎神茂平奠玉帛初獻育平亞獻敦平終獻博平徹饌一樂平送神徵平望瘞臣等謹按毎嵗春秋仲月戊日祭太社太稷於社稷壇用樂七成春以夾鍾為宫秋以南吕為宫考順治元年定迎神樂名廣平奠玉帛初獻名夀平亞獻名嘉平終獻名雍平徹饌名熈平送神名咸平乾隆七年重定今名社稷壇祈雨報祀樂七成祈夾鍾為宫報南吕為宫延豐迎神介豐奠玉帛初獻滋豐亞獻霈豐終獻綏豐徹饌貽豐送神溥豐望瘞臣等謹按社稷壇祈雨報祀樂章用豐字祈用夾鍾為宫報用南吕為宫係乾隆十八年定朝日壇樂七成太蔟為宫寅曦迎神明曦奠玉帛清曦初獻咸曦亞獻純曦終獻延曦徹饌歸曦送神臣等謹按每嵗春分日夘時祭大明之神於朝日壇用樂七成以太蔟為宫日生於東春分建夘之月乃不用夾鍾而用太蔟者夾鍾隂而日為陽也夕月壇樂六成南吕為宫迎光迎神升光奠玉帛初獻瑤光亞獻瑞光終獻涵光徹饌保光送神臣等謹按每嵗秋分日酉時祭夜明之神於夕月壇用樂六成以南吕為宫月生於西秋分為建酉之月故用南吕又按以上兩壇樂制章名順治八年定樂章則乾隆七年重加訂正先農壇樂七成姑洗為宫永豐迎神時豐奠帛初獻咸豐亞獻大豐終獻屢豐徹饌報豐送神慶豐望瘞臣等謹按毎嵗二月若三月吉亥皇帝舉耕耤禮祭先農壇用樂七成以姑洗為宫考耕耤之禮舊用夘月亥日未時取亥夘未木徳之盛今用三月者以燕地氣寒二月上亥尚未解凍故用下亥而每入於三月然日躔仍是夘月之次也今樂不用夾鍾而用姑洗者姑洗為角角為木既有取於木徳之盛而姑洗又有萬物去枯就鮮之義故特異於他祀而不用月律之制凡以重農事云爾又按樂制章名順治十一年定樂章則乾隆七年訂正臣等又按耕耤之禮古來罕見舉行我朝列聖相承敬天勤民嵗舉大典䖍祀先農皇上遵述鴻猷紹承㒺斁敦本重農先後洵同一轍也先蠶壇樂六成仲吕為宫庥平迎神承平奠帛初獻均平亞獻齊平終獻柔平徹饌洽平送神臣等謹按每嵗季春吉已皇后親祭先蠶壇用樂六成以仲吕為宫乾隆七年定歴代帝王廟樂六成春夾鍾為宫秋南吕為宫肇平迎神興平奠帛初獻崇平亞獻恬平終獻淳平徹饌匡平送神臣等謹按毎嵗春二月秋八月祭歴代帝王廟用樂六成春以夾鍾為宫秋以南吕為宫考順治二年定樂六奏迎神雍平奠帛初獻安平亞獻中平終獻肅平徹饌凝平送神望燎夀平乾隆七年重定今名臣等又按有時在三月九月致祭者其樂不用姑洗無射仍用夾鍾南吕葢以二月八月祭事孔殷故諏日或在三月九月然清明後霜降前以日躔言之猶是二月八月也文廟樂六成眷夾鍾為宫秋南吕為宫昭平迎神宣平奠帛初獻秩平亞獻叙平終獻懿平徹饌徳平送神臣等謹按每嵗春秋仲月上丁祭先師孔子廟用樂六成春以夾鍾為宫秋以南吕為宫考順治元年定迎神之樂名咸平奠帛初獻名寧平亞獻名安平終獻名景平徹饌送神亦均名咸平乾隆七年重定今名直省文廟樂名並同惟樂章從異又按順治九年聖駕臨雍講學行釋奠禮迎神奏咸平奠獻奏寧平送神奏咸平凡三奏嗣後恭遇臨雍釋奠行禮用樂並同乾隆五十年二月辟雍肇建皇上臨雍講學時在仲春釋奠之日奏樂仍用六成又車駕省方釋奠闕里用樂與春秋丁祭同神祇壇樂六成宫天神黄鍾為宫地祇林鍾為祈豐迎神華豐奠帛初獻興豐亞獻儀豐終獻和豐徹饌錫豐送神臣等謹按天神從祀圜丘地祇從祀方澤又别建一壇遇水旱則有司特祀獲應則報焉用樂六成天神以黄鍾為宫地祇以林鍾為宫乾隆七年定臣等又按皇帝時巡致祭山川並製樂章乾隆十三年皇上東巡増製岱廟樂章十五年巡幸中州増製嵩廟樂章十九年再謁祖陵増製長白山樂章樂名並同惟辭各異太嵗壇樂六成太蔟為宫保平迎神定平奠帛初獻嘏平亞獻富平終獻盈平徹饌豐平送神臣等謹按每嵗孟春嵗暮遣官致祭太嵗壇用樂六成以太蔟為宫考順治元年定奠帛初獻之樂名安平亞獻中平終獻肅平徹饌雍平送神寧平乾隆七年重定今名又按太嵗壇即前代之五郊也分為五氣則曰勾芒祝融后土蓐收元㝠合為一嵗則曰太嵗以人神異制故不得随月用律為宫至不用首律而用嵗首之律者所以讓尊於天且以嵗首之月統十二月也太嵗壇祈雨報祀樂六成太蔟為宫需豐迎神宜豐奠帛初獻晉豐亞獻協豐終獻應豐徹饌洽豐送神臣等謹按太嵗壇祈報樂章用豐字以太蔟為宫乾隆十八年定羣祀奏慶神歡樂臣等謹按毎嵗祭先醫於景惠殿火神廟顯佑宫闗帝廟城隍廟東嶽廟黒龍潭龍神祠玉泉龍神祠興工祭后土司工之神迎吻祭窑神門神皆奏慶神歡曲三獻三奏辭譜皆同乾隆七年定皇帝元旦慶賀樂黄鍾為宫元平和平臣等謹按皇帝元旦慶賀陞座奏元平還宫奏和平康熈八年定乾隆七年重定樂章以黄鍾為宫筵宴同臣等又按鄭略所列梁十二雅内如俊雅寅雅介雅需雅皆朝㑹燕享所用唐宋以來並沿其制明則朝賀别奏雅樂取名曰安與祭祀樂名和者不同古法乃變我朝定制皇帝出入奏中和樂臣工行禮奏丹陛樂三大節常朝樂章朝賀宴饗得以同用酌古斟今洵允當不易之制也皇帝萬夀慶賀樂黄鍾為宫乾平泰平臣等謹按皇帝萬夀慶賀暨筵宴陞座奏乾平還宫奏泰平康熈八年定乾隆七年重定樂章以黄鍾為宫皇帝冬至慶賀樂黄鍾為宫遂平允平臣等謹按皇上冬至慶賀暨筵宴陞座奏遂平還宫奏允平康熈八年定乾隆七年重定樂章以黄鍾為宫又按乾隆二十四年十一月平定囘部冬至慶賀頒詔増撰武成慶語以誌膚功大響聿宣足光千古已皇帝常朝樂月律為宫隆平顯平臣等謹按毎月初五十五二十五日各官午門外齊集分班列坐皇帝陞殿則謝恩王公大臣官員行禮皇帝陞座奏隆平還宫奏顯平順治九年定乾隆七年重定樂章各用其月之律為宫閏月則視時憲書所載交節之前用上月宫調交節之後用下月宫調凡文武進士傳臚及命將出師凱旋謝恩並同又按筵宴所奏康熈二十二年定陞座奏協平還宫奏興平乾隆七年定制同用隆平顯平如盛京朝㑹及九年幸翰林院筵宴四十一年平定兩金川班師凱宴並増製樂章樂名則同臣等又按朝㑹燕饗宜隨月用律為宫咸以為始於唐祖孝孫考漢鮑鄴言天子有食舉之樂所以順天地養神明求福應也宜作十二月均以迎和氣隋音樂志亦言古者人君皆用當月之調以取時律之聲而宋政和七年詔大晟府樂律隨月用律右旋明大政記洪武三年定朝㑹燕饗樂舞之數凡奏樂曲皆按月律則其説不始於祖孝孫其制亦不止於唐也又考月令天子所居所服典禮之大政事之繁無不與月律相符故能召天地之和協五行之序隋鄭譯蘇夔請用十二律旋相為宫而和妥阻壊之遂止用黄鍾一宫後儒多以為非由是言之按月用律洵古今不可易之成法也皇帝上元筵宴樂太蔟為宫怡平安平臣等謹按皇帝上元筵宴陞座奏怡平還宫奏安平乾隆七年定以正月律太蔟為宫皇上賜宴宗室賜宴千叟樂太蔟為宫隆平慶平臣等謹按乾隆四十八年正月乾清宫普宴宗室五十年正月乾清宫賜宴千叟並製樂章皇帝陞座奏隆平還宫奏慶平以正月律太蔟為宫皇帝臨雍樂夾鍾為宫盛平道平臣等謹按乾隆五十年二月以辟雍肇建皇上詣學釋奠涖辟雍殿講學陞座奏盛平還宫奏道平以二月律夾鍾為宫臣等又按鄭樵略例凡非常用之樂概入别聲一門兹賜宴宗室賜宴千叟臨雍講學皆屬特行慶典具見熈朝明備之模不當拘泥鄭例載入别聲故列於此行禮丹陛樂慶平治平臣等謹按皇帝三大節常朝諸王百官行禮奏慶平外藩行禮奏治平順治九年定乾隆七年奏定作樂之節於贊禮排班聲止之後樂作贊退之後廷臣趨至仗末樂止凡五節以一節為趨進三節為三跪九叩頭一節為趨退如有進表宣表禮儀則於第一節樂闋廷臣已跪之後進表宣表畢樂冄作又按文武進士行禮亦奏慶平駕幸盛京行禮亦用慶平治平惟樂辭各異内廷行禮丹陛樂雝平臣等謹按皇帝三大節慶賀皇后率貴妃妃嬪等行禮丹陛大樂奏雝平乾隆七年定太皇太后三大節慶賀樂升平恒平臣等謹按康熈十六年増設太皇太后宫中和韶樂陞座奏升平還宫奏恒平皇太后三大節慶賀樂南吕為宫豫平履平臣等謹按皇太后三大節慶賀暨筵宴陞座奏豫平還宫奏履平順治初年定用丹陛大樂康熈二十五年増設中和韶樂乾隆七年重定樂章以南吕為宫册尊典禮同臣等又按皇太后樂唐以前不概見至宋而有聖安乾安之名葢善則尊親至大禮也我皇上聖孝光昭乾隆七年議定皇太后樂廷臣請以大吕為宫皇上以皇后樂用南吕大吕之序在南吕後於義未協乃定亦用南吕為宫既不至與郊廟有並尊之嫌又與朝廷之樂旋相為宫者兩無妨碍也内廷行禮樂益平雝平臣等謹按皇太后三大節慶賀暨筵宴皇帝率王公百官行禮丹陛大樂奏益平皇后率貴妃妃嬪公主王妃命婦等行禮丹陛大樂奏雝平册尊典禮同康熈八年定乾隆七年重定樂章皇后三大節慶賀樂南吕為宫淑平順平臣等謹按皇后三大節慶賀陞座奏淑平還宫奏順平康熈八年定用丹陛大樂乾隆七年改用中和韶樂重定樂章以南吕為宫内廷行禮樂正平臣等謹按皇后三大節慶賀貴妃妃嬪公主王妃命婦等行禮丹陛大樂奏正平康熈八年定乾隆七年重定樂章海上蟠桃臣等謹按皇太后册尊典禮及上徽號慶典並有皇帝閲册寳之禮於陞殿時殿廷清樂奏此辭鉅典光昭隆古罕有非宋玉芝夀星等曲所能仿彿也乾隆七年定火樹星橋臣等謹按乾清宫除夕元宵上燈殿廷清樂奏此詞乾隆七年定海宇昇平日玉殿雲開萬象清寧臣等謹按皇帝三大節及上元除夕筵宴進果丹陛清樂奏海宇昇平日進酒丹陛清樂奏玉殿雲開進饌殿廷清樂奏萬象清寜皇太后宫筵宴所奏同乾隆七年定喜春光雲和迭奏風和日麗臣等謹按國初所用耕耤筵宴散樂葢仍明代之舊雍正二年始改用清樂進果奏雨暘時若進酒奏五榖豐登進饌奏家給人足乾隆七年以雨暘時若三章但照古樂府體為之不能施於宴樂因更撰此詞進果丹陛清樂奏喜春光進酒丹陛清樂奏雲和迭奏進饌殿廷清樂奏風和日麗文物京華盛延閣雲濃玉署延英臣等謹按乾隆九年皇上以翰林為儲材之所特命冬官重修院署十月告成遂蠲吉日駕幸翰林院爰集翰林出身諸臣錫宴賦詩以示慈惠以勵泰交甚盛典也進果丹陛清樂奏文物京華盛進酒丹陛清樂奏延閣雲濃進饌殿廷清樂奏玉署延英景運乾坤泰聖徳誕敷日耀中天臣等謹按乾隆十四年平定金川大師凱旋皇帝幸豐樂園筵宴進米丹陛清樂奏景運乾坤泰進酒丹陛清樂奏聖徳誕敷進饌殿廷清樂奏日耀中天聖武光昭世禹甸遐通聖治遐昌臣等謹按乾隆二十五年平西凱旋皇帝錫宴豐樂園進果丹陛清樂奏聖武光昭世進酒丹陛清樂奏禹甸遐通進饌殿廷清樂奏聖治遐昌徳威逺播飲至䇿勛周宣江漢不足言已瑞旭中天麗珠斗杓迴景麗仙瀛臣等謹按乾隆四十八年普宴宗室進茶丹陛清樂奏瑞旭中天麗進酒丹陛清樂奏珠斗杓迴進饌殿廷清樂奏景麗仙瀛篤叙展親典文賅洽準之周雅行葦之章恩禮尤為隆備矣夀愷昇平瑞紫禁春開夀宇同登臣等謹按乾隆五十年賜宴千叟進茶丹陛清樂奏夀愷昇平瑞進酒丹陛清樂奏紫禁春開進饌殿廷清樂奏夀宇同登我皇上道隆福備恭紹前謨普錫夀祺九垓徧被昇平瑞典於斯為極已仰君師臣等謹按五十年皇上親涖辟雍殿講學製仰君師樂章於賜茶時奏之宏規筆建文治光昭周雅靈臺之章方斯蔑矣祀饗别聲御製補笙詩臣等謹按順治元年定鄉飲酒禮京省及直省府州縣並於每嵗正月十月舉行乾隆七年御製補笙詩六篇於舉行鄉飲時奏之正月太蔟為宫十月應鍾為宫初舉觴工歌鹿鳴四牡皇皇者華再舉觴笙入樂南陔白華華黍三舉觴間歌魚麗笙由庚歌南有嘉魚笙崇邱歌南山有臺笙由儀供湯乃合樂周南闗睢葛覃卷耳召南鵲巢采蘩采蘋工告樂備乃降考鄉飲酒禮詳著禮經誠重典也我國家於成教安國之本鄭重詳明乾隆五十年復命嵗時遵例舉行毋曠大典元音宣播鄉國同風歌奏之餘不啻親聆聖人之至教已洙泗發源長臣等謹按衍聖公來朝在部筵燕一次恭遇皇帝視學禮成後亦如之樂奏洙泗發源長之章乾隆七年定我朝重道隆儒優崇聖裔洵有超越千古者矣啟天門和氣洽臣等謹按文進士恩榮宴樂奏啟天門之章武進士鷹揚宴樂奏和氣洽之章乾隆七年定我皇上觀文成化政教光昭乾隆五十一年定鄉試鹿鳴宴歌鹿鳴之詩㑹試恩榮宴歌棫樸之詩鷹揚宴歌罝之詩凡以折衷古制宣鬯雅音與經筵禮成筵宴臣工命歌抑戒之詩並足焜耀史書輝煌鉅典因是書編纂之例以五十年為斷故謹於按内聲明樂舞臣等謹按鄭樵所載樂舞僅列文武二舞餘皆不錄我朝舞制斟酌盡善損益得中壇廟之舞為佾舞宴饗之舞為隊舞凡所以象功昭徳者無不備諸形容至於瓦爾喀囘部諸舞尤見聲教覃敷蹈徳詠仁無逺弗届謹詳錄之不惟備周官六舞之盛且想見兩階干羽之化焉武功之舞文徳之舞臣等謹按順治元年定制用八佾六十四人初獻奏武功之舞亞獻終獻奏文徳之舞諸祀並同惟文廟用六佾三十六人初獻亞獻終獻均奏文舞大雩童子舞臣等謹按乾隆七年定大雩童子舞制祭日用舞童十六人衣元衣各執羽翳於終獻畢文舞生退後司樂引舞童進舞童八列按舞歌御製雲漢詩八章歌畢乃望燎其羽翳俱染五采葢本周禮皇舞之式云慶隆舞臣等謹按隊舞總名為慶隆舞介胄騎射為揚烈舞大臣對舞為喜起舞皇帝筵宴中和樂止後奏之先揚烈後喜起盛徳之形容祖宗之令緒洋洋乎備見於斯已世徳舞臣等謹按乾隆八年皇上恭謁祖陵親譔世徳舞十章於謁陵禮成御崇政殿筵宴時用此舞著為定制又按乾隆四十八年普宴宗室亦製世徳舞樂章奏之揚祖烈篤宗支周漢以來未有如此盛典也徳勝舞臣等謹按乾隆十四年平定金川二十五年平定西域凱旋賜宴並製樂章奏此舞喜起舞臣等謹按乾隆四十一年平定兩金川四十五年皇上七旬萬夀並製喜起舞樂章於筵宴時奏之武功震疊聖祉延洪登奏之餘洵足嫓簫韶而軼濩武矣蒙古樂曲舞臣等謹按綽爾多密什幫總名為蒙古樂曲綽爾多密為笳吹什幫為番部合奏跳擺索為繩技皇帝三大節上元除夕等筵宴於慶隆舞畢後奏之瓦爾喀部樂舞臣等謹按皇帝三大節上元除夕筵宴慶隆舞畢笳吹進後掌儀司引瓦爾喀部進司舞八人以兩為隊按隊進舞朝鮮國俳舞臣等謹按朝鮮國俳舞俳長一人戴面具從右翼上擲倒技十四人從左翼上自東向西各呈其伎皇帝筵宴時瓦爾喀部樂舞畢後用此舞囘部樂舞臣等謹按乾隆二十四年平定西陲回部敬獻樂舞皇帝筵宴時於瓦爾喀部樂後以次奏樂陳伎司舞二人舞盤二人先作樂司舞二人起舞舞盤人上以次舞畢退五魁舞臣等謹按部宴衍聖公及文武鄉㑹試筵宴用歌童五人衣五魁衣進舞皇朝通志卷六十三
