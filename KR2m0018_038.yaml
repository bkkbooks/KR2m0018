body:
  text: 欽定四庫全書皇朝通志卷三十八禮畧吉禮三太廟臣等謹案鄭志列宗廟一門具詳歴代建廟之制度其祭享儀節則分見於時享祫禘諸門我朝列祖以來洪模景爍逺軼前代謹詳盛京太廟之始冠於篇首至京師太廟並詳稽列聖以來尊崇升祔之典備著篇中即倣鄭志宗廟一門之體例云天聰十年四月太宗文皇帝受尊號建國大清改元崇徳即盛京立太廟於撫近門東崇徳元年四月奉安列祖太祖神位於太廟追尊始祖為澤王高祖為慶王曾祖為昌王祖為福王恭上太祖尊諡曰承天廣運聖徳神功肇紀立極仁孝武皇帝廟號太祖皇太后尊諡曰孝慈昭憲純徳貞順成天育聖武皇后前殿安奉太祖太后神位後殿正中安奉始祖神位左安奉高祖神位右安奉曾祖神位次左安奉祖神位皆南面是日親行大饗之禮五月薦櫻桃於太廟時有以新櫻桃獻者太宗文皇帝命薦於太廟嗣後凡新進果品五穀先薦太廟然後進御著為令順治元年九月世祖章皇帝定鼎燕京立太廟於端門之左恭奉太祖武皇帝神主孝慈武皇后神主大行皇帝神主奉安太廟十月恭上大行皇帝尊諡曰應天興國𢎞徳彰武寛温仁聖睿孝文皇帝廟號太宗二年七月恭進太祖武皇帝孝慈武皇后太宗文皇帝玉册玉寶奉安太廟五年四月以重修太廟遣官祗告恭奉神牌暫安後殿六月以太廟工成遣官祗告奉安神位於正殿十一月冬至追尊列祖太祖以上四世始祖澤王為肇祖原皇帝始祖妣為原皇后慶王為興祖直皇帝妣為直皇后昌王為景祖翼皇帝妣為翼皇后福王為顯祖宣皇帝妣為宣皇后是日世祖章皇帝親詣後殿奉安神位致祭如時享儀七年二月恭上大行皇太后尊諡曰孝端正敬仁懿莊敏輔天協聖文皇后八年正月恭奉孝端文皇后神主升祔太廟前一日遣官祗告是日世祖章皇帝親詣行禮先奉神主祗見太祖武皇帝孝慈武皇后太宗文皇帝世祖章皇帝恭代行三跪九拜禮興恭奉神主奉安於太宗文皇帝之次行一跪三拜禮畢行大饗禮如儀九年二月恭進四祖考皇帝四祖妣皇后孝端文皇后玉册玉寶奉安太廟十年定太廟懸慶成燈嵗元宵自正月初七日起至十七日止十八年正月聖祖仁皇帝登極三月恭上大行皇帝尊諡曰體天隆運英睿欽文大徳𢎞功至仁純孝章皇帝廟號世祖十月新建太廟神厨門成十一月恭奉世祖章皇帝神主升祔太廟前一日遣官祗告是日聖祖仁皇帝親奉神主恭代行祗見禮奉安神座行禮大饗如儀後殿遣官行禮是年恭進世祖章皇帝玉册玉寶奉安太廟康熈元年四月恭改上太祖武皇帝尊諡曰太祖承天廣運聖徳神功肇紀立極仁孝睿武𢎞文定業高皇帝孝慈武皇后尊諡曰孝慈昭憲敬順慶顯承天輔聖高皇后恭加上太宗文皇帝尊諡曰太宗應天興國𢎞徳彰武寛温仁聖睿孝隆道顯功文皇帝奉安神位於太廟二年五月恭上大行慈和皇太后尊諡曰孝康慈和莊懿恭惠崇天育聖皇后九年閏二月諸王大臣等遵㫖議奏慈和皇太后配祀世祖章皇帝宜加上尊諡為章皇后五月恭奉孝康章皇后神主奉安太廟十三年恭進孝康章皇后玉册玉寶奉安太廟二十七年十月恭上大行太皇太后尊諡曰孝莊仁宣誠憲恭懿翊天啟聖文皇后是月恭奉孝莊文皇后神主升祔太廟大臣二人恭奉世祖章皇帝孝康章皇后神主避立于旁聖祖仁皇帝恭奉神主奉安於拜位恭代行祗見禮三跪九拜興恭奉神主奉安於孝端文皇后神位之次行一跪三拜禮興大臣二人恭請世祖章皇帝孝康章皇后神主奉安於拜位聖祖仁皇帝恭代行祗見禮三跪九拜興大臣二人奉安世祖章皇帝孝康章皇后神主於寳座一跪三叩退行大饗禮如儀三十三年恭進孝莊文皇后玉册玉寶奉安太廟五十七年三月恭上大行皇太后尊諡曰孝惠仁憲端懿純徳順天翊聖章皇后十二月恭奉孝惠章皇后神主升祔太廟先是奉諭㫖皇太后係朕嫡母神牌升祔太廟奉先殿應安奉於慈和皇太后神牌之上王大臣等遵㫖議奏得㫖是太廟前殿致祭孝惠章皇后寳座設於世祖章皇帝寶座之次孝康章皇后寶座設於孝惠章皇后寶座之次至中殿安奉世祖章皇帝神位居中孝惠章皇后神位居左孝康章皇后神位居右均南嚮五十九年恭進孝惠章皇后玉册玉寶奉安太廟六十一年十一月世宗憲皇帝登極雍正元年二月恭上大行皇帝尊諡曰合天𢎞運文武睿哲恭儉寛裕孝敬誠信功徳大成仁皇帝廟號聖祖八月恭加上太祖承天廣運聖徳神功肇紀立極仁孝睿武端毅𢎞文定業高皇帝孝慈昭憲敬順仁徽慶顯承天輔聖高皇后太宗應天興國𢎞徳彰武寛温仁聖睿孝敬敏隆道顯功文皇帝孝端正敬仁懿哲順莊敏輔天協聖文皇后孝莊仁宣誠憲恭懿至徳翊天啓聖文皇后世祖體天隆運定統建極英睿欽文大徳𢎞功至仁純孝章皇帝孝惠仁憲端懿慈淑純徳順天翊聖章皇后孝康慈和莊懿恭惠温穆崇天育聖章皇后尊諡於太廟恭上仁孝皇后尊諡曰仁孝恭肅正惠安和儷天襄聖皇后孝昭皇后尊諡曰孝昭静淑明惠正和欽天順聖皇后孝懿皇后尊諡曰孝懿温誠端仁憲穆奉天佐聖皇后恭上大行皇太后尊諡曰孝恭宣惠温肅定裕贊天承聖仁皇后九月恭奉聖祖仁皇帝神主孝誠仁皇后神主孝昭仁皇后神主孝懿仁皇后神主孝恭仁皇后神主升祔太廟先是王大臣等議奏恭請四后同祔聖祖廟尊諡並加仁字得㫖是又禮部等奏恭上仁孝仁皇后尊諡仁字重複謹請改易恭上尊諡曰孝誠恭肅正惠安和儷天襄聖仁皇后得㫖是奉諭曰朕惟母后升祔太廟大典攸闗欲伸臣子之孝思必準前代之成憲務得情理允協乃可昭示萬年諸王大臣等奏請四后同祔太廟引據宋朝太宗真宗四后祔廟之禮朱子及有宋諸儒皆以為允當覽奏既得展朕孝敬無窮之心復合前代斟酌盡善之典不覺悲慰交集恭惟孝誠仁皇后元配宸極孝昭仁皇后孝懿仁皇后繼位中宫孝恭仁皇后誕育朕躬母儀天下案先儒祔廟之議一元后一繼后一本生以次並列今母后升祔位次當首奉孝誠仁皇后次奉孝昭仁皇后次奉孝懿仁皇后次奉孝恭仁皇后如此庶於古禮符合而朕心亦安矣至期世宗憲皇帝恭奉聖祖仁皇帝神主親王四人恭奉孝誠仁皇后孝昭仁皇后孝懿仁皇后孝恭仁皇后神主升祔太廟世宗憲皇帝恭代行祗見列祖列后禮奉安神座行大饗禮如儀三年五月恭修飾太廟神牌六年十二月恭進太祖高皇帝孝慈高皇后太宗文皇帝孝端文皇后孝莊文皇后世祖章皇帝孝惠章皇后孝康章皇后聖祖仁皇帝孝誠仁皇后孝昭仁皇后孝懿仁皇后孝恭仁皇后玉册玉寶奉安太廟先是大學士等遵㫖議列祖列后玉寶修平舊篆敬鐫加上尊諡新造玉册並舊進玉册一同珍奉至是行禮如儀雍正十三年九月皇上登極十一月恭上大行皇帝尊諡曰敬天昌運建中表正文武英明寛仁信毅大孝至誠憲皇帝廟號世宗恭上孝敬皇后尊諡曰孝敬恭和懿順昭惠佐天翊聖憲皇后乾隆元年正月命修太廟三月以加上列祖列后尊諡恭修飾太廟神牌遣官祗告是月恭加上太祖承天廣運聖徳神功肇紀立極仁孝睿武端毅欽安𢎞文定業高皇帝孝慈昭憲敬順仁徽懿徳慶顯承天輔聖高皇后太宗應天興國𢎞徳彰武寛温仁聖睿孝敬敏昭定隆道顯功文皇帝孝端正敬仁懿哲順慈僖莊敏輔天協聖文皇后孝莊仁宣誠憲恭懿至徳純徽翊天啟聖文皇后世祖體天隆運定統建極英睿欽文顯武大徳𢎞功至仁純孝章皇帝孝惠仁憲端懿慈淑恭安純徳順天翊聖章皇后孝康慈和莊懿恭惠温穆端靖崇天育聖章皇后聖祖合天𢎞運文武睿哲恭儉寛裕孝敬誠信中和功徳大成仁皇帝孝誠恭肅正惠安和淑懿儷天襄聖仁皇后孝昭静淑明惠正和安裕欽天順聖仁皇后孝懿温誠端仁憲穆和恪奉天佐聖仁皇后孝恭宣惠温肅定裕慈純贊天承聖仁皇后尊諡於太廟二年三月恭奉世宗憲皇帝神主孝敬憲皇后神主升祔太廟皇上親詣行禮恭代祗見奉安神座行大饗禮如儀三年二月興工修太廟先期親詣祗告恭奉後殿四祖四后神牌中殿列祖列后神牌暫安前殿六月後殿工竣恭奉四祖四后神牌還御前一日親詣祗告九月中殿工竣恭奉列祖列后神牌還御前一日親詣祗告四年九月前殿工竣親詣敬瞻御齋宫致齋三日行大饗禮是月恭進太祖高皇帝孝慈高皇后太宗文皇帝孝端文皇后孝莊文皇后世祖章皇帝孝惠章皇后孝康章皇后聖祖仁皇帝孝誠仁皇后孝昭仁皇后孝懿仁皇后孝恭仁皇后世宗憲皇帝孝敬憲皇后玉册玉寶奉安太廟四十二年三月恭上大行皇太后尊諡曰孝聖慈宣康惠敦和敬天光聖憲皇后恭奉神位升祔太廟皇上親詣行禮恭代祗見奉安神座行大饗禮如儀恭奉孝聖憲皇后玉册玉寶奉安太廟四十七年十月時享恭奉新造五朝玉册玉寶尊藏太廟先是列祖列后册寶皆隨時敬造玉色尺寸不相符合乾隆二十四年回部底定和闐職貢嵗致精璆皇上命擇玉質之最良者一律䖍造五朝册寶至是告成以時享大祭敬奉尊藏並命敬徹舊藏册寶於四十八年七月命皇子親王恭送盛京太廟尊藏是年八月皇上躬詣盛京展饗如儀皇朝通志卷三十八
