body:
  text: 欽定四庫全書皇朝通志卷一百一藝文畧五諸子類第六儒家農家遒家家釋家家法家小説兵雜家臣等謹按鄭志諸子類共十一門今無名家墨家縱横家之書則謹從其闕餘各依類編次凡八家云儒家儒術數學臣等謹按鄭志儒家本自為一門今從欽定續通志之例以儒術數學分列焉御定資政要覽三卷後序一卷順治十二年奉敕撰聖諭廣訓一卷六條雍聖祖仁皇帝正二年世宗親製聖諭十憲皇帝繹為廣訓下學宫頒示天庭訓格言一卷雍正八年帝御纂世宗憲皇御製日知薈説四卷乾隆元年文勒皇上取舊製各體成是編御定内則衍義十六卷順治十三年奉敕撰御定孝經衍義一百卷順治十三年奉成熙二十一年告敕修至康聖祖仁皇帝御製序文頒行御纂性理精義十二卷康熙五十六年奉敕編御纂未子全書六十六卷康熙五十二年奉敕編御定執中成憲八卷雍正六年奉敕撰御覽經史講義三十一卷乾隆十四年奉敕編正學隅見述一卷王宏撰撰思辨録輯要三十五卷陸世儀撰雙橋隨筆十二卷周召撰讀朱隨筆四卷陸隴其撰三魚堂賸言十二卷陸隴其撰松陽抄存二卷陸隴其撰注解正䝉二卷李光地撰榕村語録三十卷李光地撰正蒙初義十七卷王植撰近思録集註十四卷茅星來撰近思録集註十四卷江永撰讀書偶記三卷雷鋐撰以上見文淵閣著録家語正義十卷姜兆錫撰孔叢子正義五卷姜兆錫撰太極集注一卷孫子昶撰太極解拾遺一卷通書解拾遺一卷後録一卷西銘解拾遺一卷後録一卷李文炤撰正蒙集解九卷李文炤撰近思録集解十四卷李文炤撰周子疏解四卷王明弼撰濓闗三書無卷數王植撰程書五十一卷程湛編小學集解六卷黄澄撰小學分節二卷髙熊徴撰小學集解六卷蔣永修撰小學纂註六卷髙愈撰小學句讀記六卷王建常撰朱子語類纂十三卷王鉞撰藤隂劄記無卷數孫承澤撰學約續編十四卷孫承澤撰考正晩年定論二卷孫承澤撰明辨録二卷孫承澤撰紫陽通志録四卷髙世泰編聖學入門書無卷數陳瑚撰學言三卷白允謙撰此庵語録十卷胡統虞撰理學傳心纂要八卷孫竒逢撰嵗寒居答問二卷附録一卷孫竒逢撰潛室劄記二卷刁包撰張界軒集八卷張時為撰學案一卷王甡撰存性編二卷顔元撰存學編四卷顔元撰存治編一卷顔元撰存人編一卷顔元撰教民恒言一卷魏裔介撰致知格物解二卷魏裔介撰周程張朱正脉無卷數魏裔介撰論性書二卷魏裔介撰約言録二卷魏裔介撰續近思録二十八卷鄭光羲撰朱子聖學考畧十卷朱澤澐撰廣祀典議一卷吳肅公撰二程學案二卷黄宗羲撰讀書質疑二卷王錟撰欲從録十卷王錟撰臆言四卷朱顯祖撰儒宗理要二十九卷張能鱗編理學辨一卷王庭撰常語筆存一卷湯斌撰理學要㫖無卷數耿介撰朱子學歸二十三卷鄭端編溯流史學鈔二十卷張沐撰閑道録三卷熊賜履撰下學堂劄記三卷熊賜履撰大儒粹語二十八卷顧楝南編紫陽大指八卷秦雲爽撰㑹語支言四卷陸鳴鼇撰性理大中二十八卷應撝謙撰憤助編二卷蔡方炳編體獨私鈔四卷黄百家撰王劉異同五卷黄百家撰學術辨一卷陸隴其撰問學録四卷陸隴其撰信陽子卓録八卷張鵬翮撰王學質疑一卷附録一卷張烈撰教習堂條約一卷徐乾學撰萬世玊衡録四卷蔣伊撰儒門法語無卷數彭定求編三子定論五卷王復禮撰正修録三卷齊治録三卷于凖撰二程語録十八卷張伯行編小學集解六卷張伯行撰續近思録十四卷張伯行編學規類編二十七卷張伯行編性理正宗四十卷張伯行編廣近思録十四卷張伯行編濓洛闗閩書十九卷張伯行編困學録集粹八卷張伯行編理學正宗十五卷實克勤編大學辨業四卷聖經學規纂二卷論學二卷李塨撰小學稽業五卷李塨撰性理纂要八卷冉覲祖撰程功録五卷楊名時撰嵩陽學凡六卷景日昣撰續小學六卷葉鉁編心印正説三十四卷吳台碩撰尊道集四卷朱搴撰近思續録四卷劉源渌撰冷語三卷劉源淥撰讀書日記六卷劉源渌撰性理辨義二十卷王建衡撰静用堂偶編十卷涂天相撰廣字義三卷黄叔璥撰朱子晩年全論八卷李紱編學舫無卷數吳雲撰白鹿洞規條目二十卷王㴻撰集程朱格物法一卷集朱子讀書法一卷王㴻撰經書性理類輯精要録六卷王士陵撰謀道續録二卷譚旭撰讀周子劄記無卷數崔紀撰知非録一卷鄧鍾岳撰餘山遺書十卷勞史撰虛谷遺書三卷何國材撰筆記二卷程大純撰日省編一卷馮昌臨撰聖學輯要一卷潘繼善撰載道集六十卷許焞編大學衍義輯要六卷大學衍義補輯要十二卷陳宏謀撰吕子節録四卷補道二卷陳宏謀編恥亭遺書十卷周宗濓撰棉陽學凖五卷藍鼎元撰女學六卷藍鼎元撰張子淵源録十卷張鏐編女教經傳通纂二卷任啟運撰躬行實踐録十五卷桑調元撰朱子為學考三卷童能靈撰理學疑問四卷童能靈撰讀書小記三十卷范爾梅撰南阿集二卷康吕賜撰淑艾録十四卷祝洤撰下學編十四卷祝洤撰東莞學案無卷數吳鼎撰逸語十卷曹廷楝撰困勉齋私記四卷閻循觀撰思通集二卷隨意吟一卷秦望撰叙天齋講義四卷竇文炳撰明儒講學考一卷程嗣章撰業儒臆説一卷陶圻撰砭身集六卷劉鳴珂撰愚齋反經録十六卷謝王寵撰講學二卷陳祖銘撰三立編十二卷王梓編性理析疑十五卷蔡洛撰童子問一卷黄文㴻撰敬義録一卷黄文㴻撰理解體要二卷黄為鶚撰讀白鹿洞規大義五卷任徳成撰朱子書要無卷數不著編輯名氏以上見四庫全書存目右儒術皇極經世解八卷王植撰以見上文淵閣著録皇極經世考三卷徐文靖撰皇極數鈔二卷陶成撰衍範二卷顧昌祚撰洪範皇極補六卷劉世衢撰易範同宗録無卷數李灝撰太元别訓五卷劉斯組撰洪範補註五卷潘士權撰畫前易衍無卷數徐燦撰濬元十六卷張必國撰以上見四庫全書存目右數學儒家類凡一百六十九部道家臣等謹按鄭志諸子類儒家及法家雜家農家小説家俱自為一門不分細目惟道家釋家兵家分目太多殊嫌複瑣今從欽定續通志之例俱彚為總類不復别標細目云御定道徳經注二卷順治十三年奉敕撰老子説略二卷張爾岐撰道徳經註二卷附隂符經註一卷徐大椿撰以上見文淵閣著録隂符經註一卷李光地撰㕘同契章句一卷李光地撰道徳經編註二卷胡與髙撰讀道徳經私記二卷汪縉撰道徳經懸解二卷黄元御撰列子辨二卷不著撰人名氏南華評註無卷數張坦撰莊子解三卷吳世尚撰南華通七卷孫嘉淦撰南華本義二卷林仲懿南華簡鈔四卷徐廷槐撰南華模象記八卷張世犖撰㕘同契註二卷陳兆成撰古文周易㕘同契註八卷袁仁林撰古㕘同契集註六卷劉吳龍撰列仙通紀六十卷薛大訓撰果山修道居誌二卷葉鉁撰得一㕘五七卷姜仲貞撰萬夀仙書四卷曹無極撰以上見四庫全書存目道家類凡二十二部釋家正宏集一卷釋本果撰南宋元明僧寶傳十五卷釋自融撰現果隨録一卷僧戒顯撰以上見四庫全書存目釋家類凡三部法家折獄巵言一卷陳士鑛撰巡城條約一卷魏裔介撰風憲禁約一卷魏裔介撰讀律佩觿八卷王明徳撰續刑法叙畧一卷譚瑄撰疑獄箋四卷陳芳生撰以上見四庫全書存目法家類凡六部雜家雜學雜品雜考雜纂雜説雜編臣等謹按雜家之稱所包甚廣欽定續通志於雜家類凡分雜學雜考雜説雜品雜纂雜編六門最為賅備謹從其例分門編次惟雜學著録無書僅登存目至雜考以下並詳列焉息齋藏書十二卷裴希度撰衡書三卷唐大陶撰格物問答三卷毛先舒撰螺峯説録一卷毛先舒撰聖學真語二卷毛先舒撰潛齋處語一卷楊慶撰蒙訓一卷楊慶撰理學就正言十卷祝文彦撰聖學大成無卷數孫鍾瑞撰拳拳録二卷李衷燦撰顔巷録一卷李衷燦撰晚聞篇一卷李衷燦撰栢鄉魏氏傳家録二卷附家約一卷魏裔介撰勸世恒言一卷魏裔介編萬世太平書十卷勞大輿撰龍巖子集十二卷李丕則撰唾居隨録四卷張貞生撰圖書秘典一隅解一卷張沐撰潛書四卷唐甄撰五倫懿範八卷舊本題天台鹿門子撰不著名氏天方典禮擇要解二十卷劉智撰進善集無卷數張天柱撰懿言目録一卷二録一卷續録一卷别録一卷附禮闈分校日記一卷七規一卷王喆生撰方齋補莊無卷數方正瑗撰公餘筆記二卷張文炳撰容膝居集雜録六卷葛芝撰苕西問答一卷吳學孔撰續箋山房集畧十八卷鄭遒明撰頤菴心言一卷喬大凱撰聖學逢源録十八卷金維嘉撰以上見四庫全書存目右雜學日知録三十二卷顧炎武撰義府二卷黄生撰藝林彚考二十四卷沈自南撰潛邱劄記六卷閻若璩撰湛園札記二卷姜宸英撰白田雜著八卷王懋竤撰義門讀書記五十八卷何焯撰蔣維鈞編樵香小記二卷何琇撰管城碩記三十卷徐文靖撰訂譌雜録十卷胡鳴玉撰識小編二卷董豐垣撰以上見文淵閣著録菰中隨筆三卷顧炎武撰救文格論一卷雜録一卷顧炎武撰别本潛邱劄記六卷閻若璩撰修潔齋閒筆四卷劉堅撰天香樓偶得十卷虞兆漋撰言鯖二卷吕種玉撰事物考辨六十二卷周象明撰天禄識餘二卷髙士竒撰畏壘筆記四卷徐昻發撰古今釋疑八卷方履中撰螺江雜記八卷張文檒撰知新録三十二卷王棠撰西圃叢辨三十二卷田同之撰經史問五卷郭值撰掌録二卷陳祖范撰以上見四庫全書存目右雜考春明夢餘録七十卷孫承澤撰居易録三十四卷王士正撰池北偶談二十六卷王士正撰香祖筆記十二卷王士正撰古夫于亭雜録六卷王士正撰分甘餘話四卷王士正撰以上見文淵閣著録棗林雜爼無卷數談遷撰讀書偶然録十二卷程正揆撰見聞記憶録五卷徐國楨撰餘菴雜録三卷陳恂撰冬夜箋記一卷王崇簡撰樗林三筆五卷魏裔介撰雕邱雜録十八卷梁清逺撰蔣説二卷蔣超撰雲谷卧餘二十卷張習孔撰蒿菴閒話二卷張爾岐撰暑牕臆説二卷王鉞撰聴潮居存業十卷原良撰匡林二卷毛先舒撰庸言録無卷數姚際恒撰筠廊偶筆二卷二筆二卷宋犖撰二樓紀畧四卷佟賦偉撰介軒遺筆二卷史既濟撰復堂雜説一卷史白撰竹村雜記二卷史白撰山志六卷王宏撰撰尚論持平二卷析疑待正二卷事文標異一卷陸次雲撰在園雜志四卷劉廷璣撰妙貫堂餘談六卷裘君宏撰東山草堂邇言六卷邱嘉穂撰蓉槎蠡説十二卷程哲撰道驛集四卷張祖年撰讀書隨記一卷續記一卷剰語一卷不著撰人名氏巵壇對問六卷江徳中撰經史慧解六卷蔡舍生撰任菴語畧無卷數王建衡撰嶺西雜録二卷王孝詠撰後海堂雜録二卷王孝詠撰南村隨筆六卷陸廷燦撰枝語二卷孫之騄撰諤崖脞説五卷章盈撰書𨼆叢説十九卷袁棟撰然疑録六卷顧奎光撰瀟湘聴雨録八卷江昱撰經史筆記無卷數潘繼善撰毛氏殘書三種無卷數毛羽宸撰榴園管測五卷王復撰數馬堂答問二十卷黄名甌撰鈍根雜著四卷周池撰以上見四庫全書存目右雜説韻石齋筆談二卷姜紹書撰七頌堂識小録一卷劉體仁撰研山齋雜記四卷不著撰人名氏以上見文淵閣著録研山齋珍玩集覽無卷數孫炯撰老老恒言無卷數曹廷棟撰初學藝引二十三卷李仕學撰以上見四庫全書存目右雜品元明事類鈔四十卷姚之駰撰以上見文淵閣著録豐暇觀頤四卷不著撰人名氏懿行編八卷李瀅撰無事編二卷項真撰葉書一卷黄生撰倫史五十卷成克鞏撰多識集十二卷魏裔介撰雅説集十九卷魏裔介撰佳言玉屑一卷魏裔介撰牛戒續抄三卷魏裔介撰希賢録十