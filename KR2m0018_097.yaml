body:
  text: 欽定四庫全書皇朝通志卷九十七藝文略一臣等謹案鄭志藝文略分十二類於每類之中又各自分門搜羅亦云廣矣我朝文治光昭載籍明備列聖御纂皇上欽定諸書流播藝林嘉惠來學至海內操觚之家著作成書可資甄録者亦復不少近奉詔發天府之藏並搜訪天下經籍勒成四庫全書為右文之極盛今纂藝文略亦就經史子集分為十二總類以符鄭志原例至原書所分各子目則隨宜酌併無庸復仍其舊又如圖譜既别為専門而鄭志藝文略內復多互載今俱歸入圖譜略內以省繁復其雖屬畫圖系譜而為附見之書則仍列於本書之下若經類周易一門有辨論圖書名為圖説而實未嘗作圖者亦仍列此略以從其實焉經類第一易書書爾詩四雅春秋經解孝經臣等謹案鄭志藝文略經類論語自為一門而以大學中庸入禮記孟子入子類今從欽定續通志之例改為四書一門其每門細目如傳注集注義疏義訓之類皆強為區别概從刪併云易御定易經通注四卷順治十三年奉敕撰日講易經解義十八卷康熙二十二年奉敕撰御纂周易折中二十二卷康熙五十四年奉敕撰御纂周易述義十卷乾隆二十年奉敕撰讀易大旨五卷孫竒逢撰周易稗疏四卷附考異一卷王夫之撰易酌十四卷刁包撰田間易學十二卷錢澄之撰易學象數論六卷黃宗羲撰周易象辭二十一卷附尋門餘論二卷圖學辨惑一卷黃宗炎撰周易筮述八卷王宏撰撰仲氏易三十卷毛竒齡撰推易始末四卷毛竒齡撰春秋占筮書三卷毛竒齡撰謹案是書托春秋傳所載占筮以明古人之易學實為易作非為春秋作也易小帖五卷毛竒齡撰喬氏易俟十八卷喬萊撰讀易日鈔六卷張烈撰周易通論四卷李光地撰周易觀彖十二卷李光地撰周易淺述八卷陳夢雷撰易原就正十二卷包儀撰大易通解十七卷魏荔彤撰易經衷論二卷張英撰易圖明辨十卷胡渭撰合訂刪補大易集義粹言八十卷納喇性德編周易傳注七卷附周易筮考一卷李塨撰周易劄記二卷楊名時撰周易傳義合訂十二卷朱軾撰周易玩辭集解十卷查慎行撰易説六卷惠士竒撰周易函書約存二十四卷約注十八卷别集十六卷胡煦撰易箋八卷陳法撰楚蒙山房易經解十六卷晏斯盛撰周易孔義集説二十卷沈起元撰易翼述信十二卷王又朴撰周易淺説四卷潘思矩撰周易洗心九卷任啓運撰豐川易説十卷王心敬撰增補周易鄭注一卷惠棟編周易述二十三卷惠棟撰易漢學八卷惠棟撰易例二卷惠棟撰易象大意存解一卷任陳晉撰大易擇言三十六卷程廷祚撰周易辨畫四十卷連斗山撰周易章句證異十一卷翟均亷撰以上見文淵閣著録臣等謹案四庫全書於每類之中各分著録存目二種凡去取瑕瑜釐訂真偽悉經欽定至為精當續通志藝文略因之謹從其例亦以著録存目分列為二焉讀易搜十二卷鄭賡唐撰周易感義無卷數嶽虞巒撰易學筮貞四卷趙世對撰周易明善録二卷徐繼發撰麗竒軒易經講義無卷數紀克揚撰羲畫憤參二十五卷陸位時撰周易辨疑無卷數李開先撰易存無卷數蕭雲從撰周易説略四卷張爾岐撰周易纂解正宗六卷謝復茪撰周易麈談無卷數不著撰人名氏謹案朱彛尊經義考有孫應龍周易麈談十二卷疑即是此本也周易纂注無卷數朱竒頴撰易史參録二卷葉矯然撰大易疏義五卷王芝藻撰周易滴露集無卷數張完臣撰周易疏略四卷張沐撰加年堂講易十二卷周漁撰讀易近解二卷湯秀琦撰周易郁溪記十四卷郁文初撰周易起元十八卷陳圖撰易贅二卷王艮撰易大象説録二卷吳舒鳬撰周易惜陰録四十六卷徐世沐撰周易存義録十二卷徐世沐撰周易惜隂詩集三卷徐世沐撰易經述無卷數陳詵撰周易廣義六卷潘元懋撰大易蓄疑七卷劉蔭樞撰易論無卷數徐善撰周易應氏集解十三卷應撝謙撰易原無卷數趙振芳撰易或十卷徐在漢撰易經辨疑七卷張問達撰周易通十卷浦龍淵撰周易辨二十四卷浦龍淵撰周易義參六卷于琳撰身易實義五卷沈廷勱撰易宗集注十二卷孫宗彛撰周易清解無卷數江見龍撰周易本義述藴四卷薑兆錫撰硯北易鈔十二卷黃叔琳撰宋元周易解提要附易解别録無卷數不著撰人名氏今考為黃叔琳所録有宋無元未成之本周易淺解四卷張步瀛撰易經詳説無卷數冉覲祖撰易學參説二卷馮昌臨撰易象二卷王明弼撰易宫三十八卷吳隆元撰讀易管窺五卷吳隆元撰讀易約編四卷朱江撰孔門易緒十六卷張德純撰易韋二卷朱襄撰周易闡理四卷戴虞臯撰易蕩二卷方鯤撰易説要旨二卷李寅撰周易象義合參十二卷吳德信撰周易通義十四卷方葇如撰周易本義晰無卷數胡良顯撰易説十卷田嘉榖撰先天易貫五卷劉元龍撰易經纂言無卷數王士陵撰周易本義拾遺六卷李文照撰易經釋義四卷沈昌基撰易鏡無卷數戴天章撰心易一卷戴天恩撰易經粹言三卷應麟撰易互六卷楊陸榮撰成均課講周易無卷數崔紀撰索易臆説二卷吳起昆撰陸堂易學十卷陸奎勳撰周易録疑無卷數陳綽撰易義隨記八卷夏宗瀾撰易卦劄記四卷夏宗瀾撰程氏易通十四卷程廷祚撰易説辨正四卷程廷祚撰學易闡微四卷羅登標撰讀易質疑二十卷汪璲撰周易會輯無卷數吳映撰大易闡微録十二卷劉琯撰周易詳説十九卷劉紹攽撰周易原始六卷范咸撰易經理解一卷郜煜撰周易撥易堂解二十卷劉斯組撰周易摘鈔五卷顧昺撰學易大象要參四卷林贊龍撰經義管見一卷饒一辛撰周易解翼十卷上官章撰東易問八卷魏樞撰易貫十四卷張敘撰周易緯史無卷數錢偲撰空山易解四卷牛運震撰周易剩義二卷童能靈撰周易輯説存正十二卷附易説通旨略一卷楊方達撰周易蛾述七十四卷倪濤撰易説一卷吳汝惺撰易經一説無卷數王俶撰周易彚解𠂻翼十五卷許體元撰易象援古無卷數申爾宣撰大易合參講義十卷朱用行撰周易粹義五卷薛雪撰易蓍圖説十卷潘咸撰讀易自識無卷數金綎撰易觀十二卷凌去盈撰周易小疏十四卷虞楷撰易經貫一二十二卷金誠撰易象約言無卷數吳鼐撰易經提要録六卷徐鐸撰易讀無卷數宋邦綏撰大易理數觀察二卷朱如日撰來易增刪八卷張祖武撰周易輯要五卷朱瓚撰周易讀翼揆方十卷孫夢逵撰易深八卷許伯政撰易經講義八卷萇仕周撰周易析疑十五卷張蘭臯撰易説存悔二卷汪憲撰易義便覽三卷向德星撰周易集解增釋八十卷張仁浹撰周易曉義九卷唐一麟撰易例舉要二卷吳鼎撰十家易象集説九十卷吳鼎撰周易井觀十二卷周大樞撰大易近取録無卷數邰晉之撰周易觀瀾無卷數喬大凱撰易經觀玩篇無卷數朱宗洛撰易解拾遺七卷附周易句讀讀本二卷周世金撰周易集注十一卷圖説一卷王琰撰易圖疏義四卷劉鳴珂撰易見九卷貢渭濵撰易經輯疏四卷黃家杰撰易經會意解無卷數王芝蘭撰河洛先天圖説二卷劉天真撰周易象訓十二卷姚球撰易經辨疑四卷鄭國器撰周易剩義四卷黃磷撰易經告蒙四卷圖注三卷趙世逈撰周易懸象八卷王元御撰易經本義翼十二卷舊題吳敬菴撰不著其名讀易隨鈔無卷數不著撰人名氏卦爻遺稿演一卷不著撰人名氏周易觀彖疑問二卷大傳章指二卷不著撰人名氏以上見四庫全書存目易類凡一百八十六部臣等謹案鄭志原例於每門之後合計卷數今考諸書中有本未分卷者無從核計謹從欽定續通志之例但紀部數於後書日講書經解義十三卷康熙十九年奉敕編欽定書經傳説彚纂二十四卷康熙六十年奉敕撰書經稗疏四卷王夫之撰古文尚書疏證八卷閻若璩撰古文尚書寃詞八卷毛竒齡撰尚書廣聽録五卷毛竒齡撰尚書稗傳十七卷朱鶴齡撰禹貢長箋十二卷朱鶴齡撰禹貢錐指二十卷胡渭撰洪範正論五卷胡渭撰尚書解義一卷李光地撰書經衷論四卷張英撰尚書地理今釋一卷蔣廷錫撰禹貢會箋十二卷徐文靖撰以上見文淵閣著録尚書集解二十卷孫承澤撰九州山水考三卷孫承澤撰尚書近指六卷孫竒逢撰尚書引義六卷王夫之撰尚書體要六卷錢肅潤撰書經疏略六卷張沐撰古文尚書考一卷陸隴其撰尚書惜陰録六卷徐世沐撰尚書口義六卷劉懷志撰禹貢正義三卷曹爾成撰舜典補亡一卷毛竒齡撰尚書義疏無卷數蔣家駒撰書經詳説無卷數冉覲祖撰禹貢臆參無卷數楊陸榮撰禹貢解八卷晏斯盛撰今文尚書説三卷陸奎勳撰尚書通義十四卷方葉如撰尚書舉隅六卷徐志遴撰書經劄記無卷數顧昺撰禹貢方域考一卷湯奕瑞撰尚書約旨六卷楊方達撰尚書通典略二卷楊方達撰禹貢約義無卷數華玉淳撰尚書質疑八卷王心敬撰書經參義六卷薑兆錫撰尚書質疑二卷顧楝高撰書經提要十卷徐鐸撰尚書小疏一卷沈彤撰心園書經知新八卷郭兆奎撰尚書讀記一卷閻循觀撰尚書私學四卷江昱撰尚書注解纂要六卷吳連撰尚書剩義四卷黃磷撰附録别本尚書大傳三卷補遺一卷孫之騄編以上見四庫全書存目書類凡四十八部詩欽定詩經傳説彚纂二十一卷序二卷康熙六十年奉敕撰欽定詩義折中二十卷乾隆二十年奉敕撰田間詩學十二卷錢澄之撰詩經稗疏四卷王夫之撰詩經通義十二卷朱鶴齡撰毛詩稽古編三十卷陳啓源撰詩所八卷李光地撰毛詩寫官記四卷毛竒齡撰詩札二卷毛竒齡撰詩傳詩説駁義五卷毛竒齡撰續詩傳鳥名三卷毛竒齡撰詩説名解十五卷姚炳撰詩傳名物集覽十二卷陳大章撰詩説三卷惠周惕撰詩經劄記一卷楊名時撰讀詩質疑三十一卷附録十五卷嚴虞惇撰毛詩類釋二十一卷續編三卷顧棟高撰詩疑辨證六卷黃中松撰三家詩拾遺十卷范家相撰詩瀋二十卷范家相撰詩序補義二十四卷薑炳璋撰虞東學詩十二卷顧鎮撰以上見文淵閣著録詩經朱傳翼三十卷孫承澤撰詩説簡正録十卷提橋撰詩問一卷吳肅公撰詩經傳説取裁十二卷張能鱗撰毛詩日箋六卷秦松齡撰詩經疏略八卷張沭撰詩經比興全義一卷王鍾毅撰詩經惜陰録二十卷徐世沐撰白鷺洲主客説詩一卷毛竒齡撰國風省篇一卷毛竒齡撰詩藴四卷薑兆錫撰詩經集成三十卷趙燦英撰詩經詳説無卷數冉覲祖撰詩統説三十二卷黃叔琳撰毛詩通義十四卷方葇如撰詩經測義四卷李鍾僑撰詩經旁參二卷應麟撰陸堂詩學十二卷陸奎勳撰詩經廣大全二十卷王夢白陳曽同撰復菴詩説六卷王承烈撰毛朱詩説一卷閻若璩撰詩經序傳合參無卷數顧昺撰毛詩説二卷諸錦撰學詩闕疑二卷劉青芝撰詩貫十八卷張敘撰毛詩訂韻五卷謝起龍撰詩義記講四卷夏宗瀾撰詩經提要録三十一卷徐鐸撰豐川詩説二十卷王心敬撰詩經拾遺十三卷葉酉撰風雅遺音四卷史榮撰詩深二十六卷許伯政撰毛詩廣義無卷數紀昭撰詩經彚詁二十四卷范芳撰詩經正解三十卷薑文燦撰以上見四庫全書存目詩類凡五十七部春秋日講春秋解義六十四卷謹按是編為帝講筵舊本聖祖仁皇世宗憲皇帝重加考定排纂成書欽定春秋傳説彚纂四十卷康熙三十八年奉敕撰御纂春秋直解十六卷乾隆二十三年奉敕撰左傳杜解補正三卷顧炎武撰春秋稗疏二卷王夫之撰春秋平義十二卷俞汝言撰春秋四傳糾正一卷俞汝言撰讀左日鈔十二卷補二卷朱鶴齡撰左傳事緯十二卷附録八卷馬肅撰春秋毛氏傳三十六卷毛竒齡撰春秋簡書刋誤八卷毛竒齡撰春秋屬辭比事記四卷毛竒齡撰春秋地名考略十四卷高士竒撰春秋管窺