body:
  text: 欽定四庫全書皇朝通志卷八十五食貨略五户口丁中皇朝户口初亦有賦役其制率仍前代有分三等九則者有一條鞭徵者有丁隨地派者有丁隨丁派者立編審之法五年一舉丁增而賦隨之自康熙五十年聖祖特頒恩詔嗣後滋生人丁永不加賦雍正間將額徵丁糧改地徴派俾無業之民永免催科實萬世不易之良法也順治元年百户危列宿上言天津避亂民萬有一千餘户宜諭有司綏撫安插而兵部侍郎金之俊亦請諭各道臣所招冦衆悉令州縣編置牌甲於是制編審户口之法其法州縣城鄉十户立一牌頭十牌立一甲頭十甲立一保長户給印牌書其姓名丁口出則注其所往入則稽其所來其寺觀一體頒給以稽僧道之出入其客店令各立一簿書寓客姓名行李牲口及往來何處以備稽察三年詔天下編審人丁凡年老殘疾及逃亡故絶者免入始定三年編審一次繼定五年編審一次後又定於次年八月各省彚齊到部其編審事宜責成州縣官以百有十户為里推丁多者十人為長餘百户為十甲城中曰坊近城曰廂在鄉曰里各有長凡造册本户記丁口之數授之甲長甲長授之坊廂里長坊廂里長上之州縣州縣合而上之府府别造總册上之布政司民年六十以上者開除十六以上增注凡籍有四曰軍曰民曰匠曰竈各分上中下三等丁有民丁有站丁有土軍丁衛丁屯丁總其丁之數而登黃册督撫據布政司所上達之户部户部受直省之册彚疏以聞以周知天下生民之數十四年定州縣官增丁二千名以上各豫紀録至十七年令以户口消長課州縣吏殿最十八年總計直省人丁二千二百六萬八千六百有九口康熙二十四年天下人丁二千三百四十一萬七千四百四十有八口二十五年以原定編審限期太寬民人等候無期胥役得以任意作弊乃更定一年嵗底彚報明年又令編審缺額人丁該撫臣陸續招徠於下次查編補足五十年直省人丁二千四百六十二萬一千三百二十四口於前未甚加增上以承平已久滋生日繁而有司編審時不將所生實數開明具報者特恐加增錢糧是以匿隱乃諭大學士等曰民之生齒日繁朕故欲知人丁之實數不在加徵錢糧也嗣後祗將見今錢糧册內有名丁數弗增弗減永為定額以後所生人丁免其加增錢糧但將所增實數另造清册具報尋定自康熙五十年額定丁册數外新增者補足舊額開除缺數其餘謂之盛世滋生人丁永不加賦至六十年直省人丁二千五百三十八萬六千二百有九口內滋生人丁不加賦者四十六萬七千八百五十口雍正元年直𨽻巡撫李維鈞言請將直𨽻丁銀攤入地糧內徵收嗣是各省計人派丁者以次照例更改不獨無業之民無纍即有業民户亦甚便之二年天下人丁共二千四百八十五萬四千八百一十八口時山西省有曰樂籍浙江紹興府有曰惰民江南徽州府有曰伴儅寧國府有曰世僕蘇州之常熟昭文二縣有曰丐户廣東省有曰蛋户者該地方視為卑賤之流不得與齊民同列甲户上甚憫之俱令削除其籍與編氓同列而江西浙江福建又有所謂棚民廣東有所謂寮民者亦令照保甲之法案户編查臣等謹案樂籍因明永樂時不附靖難兵遂編為樂籍世世不得為良伴儅世僕本地呼為細民惰民丐籍形情相同蛋户捕魚為業粵民輕賤不許登岸居住蛋民亦不敢與民抗衡棚民乃民人搭棚山曠居住或種麻種箐開爐煽鐵造紙作菰為業寮民係近地窮民入山搭寮炊薪燒炭舂粉取香木為業者乾隆五年令直省督撫於每嵗仲冬將户口增減實數繕册具奏其畨疆苗界不入編審者不在此例十四年天下户三千六百二十六萬一千六百二十有三丁萬有七千七百四十九萬五千三十有九二十二年更定保甲之法自順天府五城所屬村莊暨直省州縣鄉村每户嵗給門牌書家長姓名生業附注丁男名數不及婦女十户為牌立牌長十牌為甲立甲長十甲為保立保長凡甲內有盜竊邪教賭博賭具窩逃姦拐私鑄私銷私鹽跴麴販硝斂財聚會等事及形迹詭祕之徒責令専司查報無論紳襟之家與齊民一體聽保甲稽查其客民在內地貿易者與土著一例順編其商賈來往無定者責成客長鹽埸井竈另編排甲責成埸員礦厰丁户責成厰員各處煤窯責成雇主山居棚民責成地主其濵海商漁船隻與內洋採捕小艇取具澳甲族鄰保結河內船隻責成埠頭漁船網户及水次搭棚趁食之民歸就近保甲管束其邊外種地民人亦設牌頭總甲家長查察其甘省畨子土民責成土司其寺觀僧道責成僧綱道紀其外來流丐保正督率丐頭查察其旗民雜處村莊苗疆寄籍內地外省入川民人與雲南夷民雜處者同土著一體編入保甲是年總計天下人丁共一萬九千三十四萬八千三百二十八口至二十九年天下人丁共二萬五百五十九萬一千一十七口三十七年上以户口實數已按年登册報部則五年編審之例似屬虛文且滋紛擾著令停止四十年詔諭直省督撫整飭所屬於仲冬户口册核實登記以驗阜成之概不得視為具文迄於今萬億及秭付之史館者更無數可稽而八旗之繁庶以及外藩之歸赴回疆之濡育又别有版圖也八旗户口國初定制各旗人丁三年編審一次凡編審各旗壯丁令各佐領稽查已成丁者增入丁册其老弱幼丁不應入册有隱匿者罪誤入别佐領者退回初定壯丁三百名為一佐領後改定為二百名凡八旗新添壯丁每旗佐領三十員其逃亡缺少者將諸王貝勒貝子等府壯丁撥補又定家下壯丁首先登城者準其開户順治元年令凡旗下漢人有父母兄弟妻子願入旗者地方官給文咨部入册不準帶田地九年選內府及諸王府官員有勞績者數員令其出府佐領各歸所屬佐領十七年定官員子弟有職任者不拘嵗數準其分户康熙四年令佐領內丁多至百名以上願分兩佐領者聽十三年八旗每佐領編壯丁一百三十名餘丁彚集另編佐領或所餘丁僅百名以上不足額者該旗王貝勒貝子公等併都統副都統佐領酌驗無誤披甲當差者出結移送到部亦準編入佐領雍正五年定編審丁册每户書另户某人某官無官者則曰間散某上書父兄官職名氏旁書子弟及兄弟之子及户下若干人或在籍或他往皆備書之其各省駐防旗員兵丁以及外任文武各官子弟家屬俱行文各該將軍督撫查明造册咨送該旗附入佐領册內其後又定八旗正身壯丁年十五以上該管官查無假冒方準入册其或流落鄉屯向未入丁册者令補入册內乾隆三年定旗人開户例凡旗下奴僕原係滿洲蒙古直省本無籍貫帶地投充人等雖有籍貫年逺難考均準其開户六年復定八旗造丁册之例凡各佐領下已成丁及未成丁食餉之人皆造入丁册分别正身開户户下於各名下開寫三代履歷其至外省駐防暨外任文武官子弟家口先期行文該管大員照式造册二本咨部一留部一付該旗覆核附入各佐領册內又定八旗開户養子因出兵陳亡及列軍功一二等改為另户者别記檔案國初投充俘獲入旗及旗人抱養為嗣或民人因親入旗或良民隨母改嫁入於他人户下或旗奴開户與旗奴過繼與另户為嗣已入另户檔內後經自行首明者亦别記檔案不得與宗室聨姻七年詔八旗漢軍自從龍故舊之子孫外有願出籍者準其與該地民人一例編入保甲二十五年復定清釐旗檔之例一另户旗人不許撫民人及家人之子為嗣一民人幼子隨母改嫁旗人者該旗詳記檔案俟成丁後報部令歸民籍一另記檔案養子開户人等業經出籍為民不許復行冒旗籍一旗下家人之子隨母改嫁另户與民人之子隨母改嫁旗下家人或家人撫養民人之子均以户下造報一八旗投充户口旗檔有名者造丁册一分送部一分發該地方官備案如有事故頂充於比丁册內聲明報部轉行該地方官注册備查至伊等親族不在旗檔者地方官清查編入里甲以免混淆又定跟役軍功出户之例凡官兵跟役有殺敵致果者本身及父母妻子俱準出佐領為另户二十六年定漢軍為民之例凡八旗漢軍現任外省文職自同知以上武職自守備以上京員自主事以上旗員五品以上俱不準改籍其父在旗而子願為民或子在旗而父願為民亦不準改籍其餘願出籍者在京報明該旗在外呈明督撫咨送編入民籍準一體考試二十八年定八旗逃人之例二十九年又定凡八旗另記檔案及養子開户內未經出旗之人或因軍營著績或因技藝出衆賞為另户者其父母弟兄子姪俱準作另户三十一年又定凡八旗迷失幼丁在十五嵗以下者該管官咨部知會各旗及步軍統領衙門轉飭所屬一體查緝獲日咨旗認領如在十五嵗以上者照逃人例辦理其十五嵗以前迷失十五嵗以後投回者如實係蒙稚本無遊蕩惡習者奏明請旨皇朝通志卷八十五
