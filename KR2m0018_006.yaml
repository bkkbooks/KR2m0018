  - {type: page-break, offset: 0, content: '', id: KR2m0018_WYG_006-1a, image: WYG0644/WYG0644-0067a.png}
body:
  text: 氏族畧六䝉古八旗姓博爾濟吉特氏散處錫喇穆楞烏嚕特扎嚕特克嚕倫察哈爾呼倫貝爾克什克騰阿巴噶巴岳特等地方恩格徳爾正黄旗人世居錫喇穆楞地方國初率部屬來歸授三等子尚公主封為額駙諡端順其長子囊努克任内大臣授二等輕車都尉四子額爾克戴青係公主所出襲三等子任内大臣晉一等侯累封至二等公諡勤良其子費揚古襲三等公任内大臣其子拉爾泰襲三等公任散秩大臣其姪噶爾薩襲一等侯晉三等公加封號為奉義公任散秩大臣兼佐領又恩格徳爾曾孫扎克丹由三等輕車都尉征準噶爾有功任都統内大臣諡敏恪又恩格徳爾之弟莽果爾岱授三等子以破流賊功晉一等伯其姪巴特瑪襲任内大臣古爾布什鑲黄旗人恩格徳爾同族封為額駙國初率部屬來歸授三等子尚公主賜清卓哩克圖號後圍錦州有功累授一等子任兵部尚書諡襄敏其子鄂齊爾任内大臣副都統巴拜鑲白旗人恩格徳爾同族玉國初率部屬來歸授三等子諡僖順其次子阿什襲加二等子明安正黄旗人世居烏嚕特地方其國初率族衆來歸授三等子晉二等伯諡忠順孫巴圖襲任内大臣其姪博倫岱襲一等侯任散秩大臣又明安長子帛坤由三等輕車都尉從征囊努克及扎嚕特有功又擊敗大凌河兵叙功授三等男授一等賜達爾漢和碩齊號其子鄂濟理襲職累男明安次子多爾濟由騎都尉從征扎嚕特及克什克騰屢敗賊兵取大凌河首先破賊入錦州境先薄城下斬二十二人城内賊兵悉出拒戰大敗之叙功授一等男加至三等子其弟綽爾濟襲任内大臣明安第五子納穆僧格由頭等侍衛從征福建撃海冦鄭成功陣亡贈騎都尉加三等子諡直勇祀昭忠祠索諾木正藍旗人明安同族瑪國初率部屬來歸授二等子諡順良其子噶爾僧格襲加至三等伯巴朗正藍旗人明安同族由二等輕車都尉從征山東撃敗檯頭營馬步兵破流賊滅福王平定河南江南屢著戰功征福建招撫一府三縣又攻南安縣首先奪門克其城累授二等男任都察院副都御史其子拉普齊襲職從征雲南屢敗何繼祖胡國秉等叙功授一等男任䕶軍㕘領其子旒相襲一等男任刑部侍郎拜音岱正紅旗人明安同族濟國初率部屬來歸授二等輕車都尉其子綽爾襲累加至三等男其弟色辰扣襲從征江西陣亡贈一等男祀昭忠祠又拜音岱之姪諤勒哲由三等輕車都尉入山海闗敗流賊兵二十萬衆又平定河南江南屢著戰功加至三等男其子巴拜襲從征雲南敗何繼祖胡國秉等加二等男布彦岱鑲紅旗人明安同族國初來歸授一等輕車都尉從征寧逺有功授二等男任都統定鼎時撃敗流賊二十萬衆加一雲騎尉禮部尚書其子鄂穆布襲加一等男又布彦岱曽孫伊倫竒係和碩額駙任副都統達賴鑲藍旗人明安同族國初率部屬來歸授二等輕車都尉其孫巴莽襲職加至三等男任䕶軍㕘領其子諸神保襲職從征厄魯特噶爾丹陣亡贈雲騎尉祀昭忠祠布當正藍旗人明安同族國初率部屬來歸授二等輕車都尉從征遵化州撃敗賊兵授三等男任刑部侍郎其子和爾渾襲職加至一等男又布當之弟塞凌由三等輕車都尉圍錦州撃敗松山杏山兵破流賊滅福王平定河南江南屢著戰功追騰吉斯連敗土謝圖汗碩羅汗等兵叙功加至三等男其子嘉穆揚任杭州將軍諡敏恪又塞凌之孫宗扎普任西安將軍巴克貝勒鑲黄旗人世居扎嚕特地方國初率部屬來歸授其子鄂齊里桑徳赫馬為騎都尉擢内大臣征董夔有功授三等男其子楚輅襲加授二等男又巴克貝勒長子多爾濟第三子滿齊漢俱任内大臣哈喇巴拜鑲黄旗人巴克貝勒同族國初來歸授其長子拉什喜布為頭等大臣孫阿爾善任都統刑部尚書曽孫阿爾鼐任都統理藩院尚書元孫阿齊圖任内大臣步軍統領古穆鑲黄旗人巴克貝勒同族任都統噶爾瑪葉爾登正黄旗人世居克嚕倫地方國初率衆來歸授三等子其從弟竒塔特衛徵贈國初率部屬來歸從征大凌河撃錦州兵陣亡三等男祀昭忠祠其孫諾木齊襲職加至一等男乂竒塔特衛徵之姪錫喇布由一等輕車都尉從征廣東擊敗李定國兵五萬餘衆叙功授三等男特穆登從征錦州陣亡贈騎都尉祀昭忠祠又喀蘭圖竒塔特衛徴之弟由頭等侍衛授一等輕車都尉擢理藩院尚書内大臣諡敏壯其子察渾襲職加授三等男後從征江西陣亡贈二等男祀昭忠祠寨桑鑲藍旗人噶爾瑪葉爾登同族國初率族衆來歸喜襲以賜達爾漢和碩齊號授三等男其子博什破流賊功授一等男寨桑之姪巴特瑪授三等輕車都尉圍錦州敗松山兵又撃敗流賊二十萬衆追至慶都縣又大敗之授一等輕車都尉兼一雲騎尉其子班達爾沙襲職併授為一等子塞凌正白旗人噶爾瑪葉爾登同族國初率衆來歸授三等輕車都尉其子富爾丹襲職加至三等男其子巴扎爾襲從征湖廣陣亡贈二等男祀昭忠祠又塞凌之弟諾爾布由二等輕車都尉從征雲南擊敗馬秉忠等後征江西陣亡贈三等男祀昭忠祠納木鑲白旗人噶爾瑪葉爾登同族國初率部屬來歸定鼎時䕶隨和碩肅親王有功授二等輕車都尉其子扎木蘇襲職加至三等男其從弟錫達襲從征厄魯特噶爾丹有功授二等男拜思瑚朗正白旗人世居巴岳特地方由二等侍衛從征浙江福建連敗楊禄等兵二萬餘衆後在烏龍江撃海冦鄭錦陣亡贈騎都尉其弟薩圖由䕶軍㕘領從征湖廣陣亡贈雲騎尉並祀昭忠祠圖爾濟葉爾登鑲白旗人世居察哈爾地方國初率部屬來歸授三等男其子古禄襲圍錦州撃敗松山兵又敗流賊二十萬衆叙功累加至三等子巴爾巴圖魯圖爾濟葉爾登同族一國初來歸授三等男其次子諾們達賴襲加至等男第三子邁蘭由䕶軍㕘領從征江西陣亡贈雲騎尉祀昭忠祠昂坤都稜正黄旗人國初來歸授三等男寨桑正藍旗人世居呼倫貝爾地方一國初率部屬來歸授三等男其子扎住襲加至等男烏巴什鑲藍旗人世居克什克騰地方等國初來歸授二等男其從弟阿納達襲加至一子從征江西陣亡贈一雲騎尉祀昭忠祠科爾沁貝勒莽古思為父科爾沁貝勒寨桑為孝孝端文皇后之莊文皇后之父科爾沁多羅貝勒綽爾濟為科爾沁孝惠章皇后之父阿禄哈鑲黄旗人世居地方國初來歸任領侍衛内大臣授一等男諡勤僖鄂克綽特巴正藍旗人世居察哈爾地方由一等輕車都尉從征湖南陣亡贈三等男祀昭忠祠噶爾瑪索諾木正黄旗人世居阿巴噶地方國初來歸尚公主封為額駙其子寨桑授三等子任散秩大臣武納格正白旗人授三等公必里克圖正藍旗人任都統加太子少師諡恪僖沙里布任都統從征陣亡任騎都尉諡襄壯祀昭忠祠巴扎爾授三等男從征陣亡祀昭忠祠滿韜授三等男舒木布鑲藍旗人世居烏葉爾拜柴地方任江南江西總督其從孫碩瞻係和碩額駙安泰正白旗人任都統色克慎正白旗人任直𨽻總督荆州將軍臣等謹按博爾濟吉特氏為元太祖之裔其見於八旗蒙古者皆編入滿洲旗分之姓至科爾沁貝勒莽古思寨桑綽爾濟乃孝端孝莊孝惠三后之所鍾祥為我朝戚畹貴族謹録其官爵名號於氏内若内扎薩克之扎賚特都爾伯特郭爾羅斯喀喇沁土黙特敖漢奈曼巴林扎嚕特阿嚕科爾沁翁牛特克什克騰喀爾喀左翼喀爾喀右翼烏珠穆沁浩齊特蘇尼特阿巴噶阿巴哈納爾四子部落茂明安烏喇特鄂爾多斯外扎薩克之喀爾喀土謝圖汗部車臣汗部扎薩克圖汗部賽音諾顔部阿拉善厄魯特部青海之和碩特諸部同為元裔而分族别氏皆八旗氏族通譜所未載以非編入旗分故從畧也今遵通譜例闕之而附著其畧於此薩爾圖氏世居葉赫及扎嚕特地方噶賴正紅旗人世居扎嚕特地方由三等䕶衛從征福建陣亡贈雲騎尉其從孫兆住由驍騎校從征凖噶爾陣亡贈雲騎尉並祀昭忠祠又噶賴叔祖禇庫年十七從出跴陣太宗文皇帝圍大凌河賊驍將車濟格突禇庫獨迎戰生擒之續征大同攻左衛城先登擊賊賊傷其後頸猶扶額力戰遂克其城賜巴圖魯號授騎都尉任副都統後征四川擊賊張獻忠大敗之征福建在烏龍江擊敗賊艘二百餘隻叙功授一等輕車都尉諡襄壯祀賢良祠鼐竒特氏世居克什克騰地方郭爾羅特氏世居察哈爾地方布顔塔布囊正黄旗人國初來歸授騎都尉從征董夔及錦州松山屢著戰功授一等輕車都尉加授三等男其姪茂竒塔特襲職從征厄魯特噶爾丹有功授二等男和爾氏世居塔布諾特地方楝阿賴鑲白旗人吳國初來歸由䕶軍㕘領從征山東擊敗三桂兵圍錦州屢敗塔山松山寧逺兵征黑龍江圍博和理城扼其汲道四日降之招服哈爾塔遜等四村後圍中前所乗夜奪門克之授雲騎尉隻定鼎時破流賊二十萬衆征湖廣敗賊一虎於荆州府征福建屢敗傅國用等兵攻克建寧府及同安等十五縣又招服一州七縣授一等輕車都尉任副都統兼都察院副都御史實寶禪氏世居哈喇烏蘇齊巴漢台地方塔塔爾氏世居察哈爾地方索寧正黄旗人由閒散從征黒龍江斬獲甚衆征山東攻萊蕪縣首先登城克之三等輕賜巴圖魯號授騎都尉後征大同陣亡贈車都尉其子巴圖襲從征湖廣陣亡贈二等輕車都尉並祀昭忠祠唐喀禄正藍旗人任理藩院侍郎副都統征西路陣亡祀昭忠祠舒嚕氏世居科爾沁地方金柱鑲藍旗人由三等輕車都尉從征福建陣亡贈二等輕車都尉祀昭忠祠岳諾特氏世居扎嚕特地方赫嚕克氏世居察哈爾地方彰扎爾氏世居科爾沁地方郭爾羅斯氏世居察哈爾地方臣等謹按今内扎薩克有郭爾羅斯部以部為氏翁阿哩氏世居阿巴噶地方公吉喇特氏散處阿喇克綽特等地方烏新氏世居錫喇穆楞地方巴岳特氏散處阿巴噶巴岳特等地方永國正黄旗人世居阿巴噶地方任禮部侍郎征凖噶爾陣亡贈騎都尉祀昭忠祠巴爾宻特鑲黄旗人世居巴岳特地方任都統衆佛保鑲藍旗人任都統臣等謹按巴岳特係地名以地為氏科本氏世居厄魯特地方巴朗正黄旗人功國初來歸由䕶軍校從征山東四川有後在蟠龍山遇王屏藩等率衆水陸來戰奮勇進撃陣亡贈騎都尉祀昭忠祠佟尼果特氏世居喀喇沁地方圖爾噶圖鑲藍旗人國初來歸由閒散從征山東攻登州首先登城陣亡贈騎都尉祀昭忠祠阿穆尼布塔斯氏世居蓀尼喀扎哩地方阿海正黄旗人國初來歸由閒散從征遵化州首先登城陣亡贈騎都尉祀昭忠祠布嚕特氏世居喀爾喀地方烏濟吉特氏世居巴顔喀喇及克什克騰地方烏巴什正藍旗人世居巴顔喀喇地方由䕶軍校從征四川陣亡贈雲騎尉其孫扎穆素襲從征雲南屢敗何繼祖胡國秉等兵後在武磨山擊馬寳等陣亡贈一等輕車都尉兼一雲騎尉並祀昭忠祠翁科特氏世居錫喇穆楞及烏嚕特地方烏齊喜特氏世居烏嚕特地方博囉達漢鑲紅旗人由驍騎校從征雲南陣亡贈雲騎尉祀昭忠祠烏嚕特氏散處巴岳特及錫喇穆楞等地方臣等謹按烏嚕特係地名以地為氏庫布特氏世居錫喇穆楞地方碩色鑲白旗人由章京從征雲南陣亡贈雲騎尉祀昭忠祠公吉爾氏散處烏嚕特察哈爾等地方巴特瑪鑲黄旗人世居烏嚕特地方由佐領從征江西有功在洞庭橋等處連敗賊耿精忠等四萬五千餘衆又在饒州府等處屢敗賊水陸三萬餘衆後在韶州府遵花山陣亡贈雲騎尉祀昭忠祠布勒哈齊氏世居烏嚕特地方阿岱鑲黄旗人由防禦從征雲南貴州屢撃敗李定國等兵二萬餘衆後征湖廣陣亡贈雲騎尉祀昭忠祠伊圖黙氏世居科爾沁地方諾穆渾鑲黄旗人由䕶軍校從征湖廣陣亡贈雲騎尉祀昭忠祠鄂