body:
  text: 禮略吉禮六釋奠太學臣等謹按鄭志列釋奠及孔氏廟二門今循其例以太學祭典及闕里祭典分為二篇我皇上親臨丁祭特頒諭旨肇建辟雍駕臨講學禮隆樂備萬古維昭應恭載入嘉禮門兹惟舉祭儀成式著於篇中至鄭志以釋奠列歷代帝王廟前次以老氏廟太公廟今遵大清會典成例敘釋奠於帝王廟之後老氏廟本不載於祀典太公以配享帝王廟中不設專祠此二條今並從刪凡釋奠於先師之禮為廟於城東北隅太學之東殿曰大成以四配十二哲侑饗殿中以先賢先儒從祀兩廡先師孔子正位南嚮四配復聖顔子述聖子思子東位西嚮宗聖曾子亞聖孟子西位東嚮東序先賢閔子損冉子雍端木子賜仲子由卜子商有子若西序先賢冉子耕宰子子冉子求言子偃顓孫子師朱子熹位均東西嚮東廡先賢蘧瑗淡臺滅明原憲南宫適商瞿漆雕開司馬耕梁鱣冉孺伯虔冉季漆雕徒父漆雕哆公西赤任不齊公良孺公肩定鄡單罕父黑榮旗左人郢鄭國原亢亷潔叔仲會公西輿如邽巽陳亢琴張步叔乘秦非顔噲顔何縣亶樂正克萬章周敦頤程皓邵雍位西嚮西廡先賢林放宓不齊公冶長公晳哀髙柴樊須商澤巫馬施顔辛曹恤公孫龍秦商顔髙壤駟赤石作蜀公夏首后處奚容蒧顔祖句井疆秦祖縣成公祖句兹燕伋樂咳狄黑孔忠公西蒧顔之僕施之常申棖左邱明秦冉牧皮公都子公孫丑張載程頤位東嚮東廡先儒公羊髙伏勝董仲舒后蒼杜子春諸葛亮王通范仲淹歐陽修楊時羅從彥李侗吕祖謙蔡沈陳淳魏了翁王柏趙復許謙吳澄胡居仁王守仁羅欽順西廡先儒榖梁赤髙堂生孔安國毛萇鄭康成范寧韓愈胡瑗司馬光尹焞胡安國張栻陸九淵黃幹真德秀何基陳澔金履祥許衡薛瑄陳獻章蔡清陸隴其位均東西嚮廟後建祠曰崇聖中設肇聖王木金父左裕聖王祈父右詒聖王防叔左次昌聖王伯夏右次啓聖王叔梁紇位皆南嚮祠內配饗先賢顔無繇孔鯉東位西嚮曾點孟孫氏西位東嚮兩廡從祀先儒東廡周輔成程珦蔡元定西廡張迪朱松位均東西嚮嵗以春秋仲月上丁遣官釋奠皇帝特舉崇典臨雍講學則親詣行禮每月朔國子監祭酒率師生行釋菜禮望日司業行禮崇德元年定遣官致祭先師孔子以顔子曾子子思子孟子配享五年定每年二月八月上丁日行釋奠禮順治九年世祖章皇帝視學釋奠先師孔子前期於大內致齋四配十哲兩廡各遣官分獻先是由部遣官行取衍聖公率孔顔曾孟仲五氏世襲五經博士乘傳赴京及五氏子孫現任京官者咸與祭十四年議凖祭先師祝文稱至聖先師孔子通行直省各學十七年以修葺太學告成世祖章皇帝視學釋奠與九年禮同康熙八年聖祖仁皇帝視學釋奠與順治九年同二十三年御書萬世師表匾額恭懸大成殿並頒發直省學宫二十八年御書孔子贊並顔曾思孟四子贊勒石摹拓頒發直省三十五年以平定朔漠遣官釋奠於先師勒石太學與致祭闕里禮並行五十一年奉諭朱子發明聖道軌於至正特加優崇升配大成殿十哲卜子商之次前期祇告行禮五十四年題凖范仲淹從祀位列西廡先儒韓愈之次雍正元年奉諭至聖先師孔子以上五代並追封為王爵部臣議奏擬追封木金父公為肇聖王祈父公為裕聖王防叔公為詒聖王伯夏公為昌聖王叔梁公為啓聖王其啓聖祠向繫專祀叔梁公故以啓聖為名今合祀五代應更名為崇聖祠春秋丁祭一體行禮並通行直省府州縣衛畫一遵行二年世宗憲皇帝視學行釋奠禮與康熙八年同是年奉旨議定祔饗廟庭諸賢九卿等議奏明洪武間以來遞有升黜今議得林放蘧瑗秦冉顔何鄭康成范寧六人允宜復祀孔子弟子縣亶牧皮孟子弟子樂正子公都子萬章公孫丑漢諸葛亮宋尹焞魏了翁黃幹陳淳何基王柏趙復元金履祥許謙陳澔明羅欽順蔡清本朝陸隴其二十人允宜增祀又宋橫渠張子之父迪宜增入崇聖祠從祀從之是年以平定青海遣官釋奠於先師勒石太學與康熙三十五年同四年仲秋丁祭世宗憲皇帝親詣行禮七年十二月以重修闕里聖廟慶雲見於曲阜世宗憲皇帝親詣太學祭告十一年仲春丁祭世宗憲皇帝親詣行禮畢諭禮部嗣後親詣行禮於香案前行三上香禮乾隆二年遵旨議凖大成殿及大成門易蓋黃瓦崇聖祠易蓋緑瓦是年御書與天地參匾額恭懸大成殿並命頒發直省懸於學宫又覆凖元儒吳澄仍應從祀於太學在西廡先儒趙復之次三年仲春丁祭皇上親詣行禮三月皇上視學行釋奠禮與雍正二年同是年覆凖先賢有子若升配大成殿為十二哲在先賢卜子商之次東位西嚮移朱子神位於西在先賢顓孫子師之次前期祇告行禮五年仲秋丁祭皇上親詣行禮九年仲春丁祭皇上親詣行禮十四年以平定金川遣官釋奠於先師勒石太學與雍正二年同二十年以平定凖噶爾遣官釋奠勒石太學與十四年同二十一年仲春丁祭皇上親詣行禮二十五年以平定回部遣官釋奠勒石太學與二十年同三十四年仲春丁祭時以重修國學皇上親詣行禮先期諭出內府所藏周笵鼎尊卣罍壺簠簋觚爵洗各一供大成殿中用備禮器四十一年以平定兩金川遣官釋奠勒石太學與二十五年同四十八年仲春丁祭皇上親詣行禮畢命於太學彞倫堂前稽考古制肇建辟雍以光大典五十年二月皇上親詣釋奠於先師禮成御新建辟雍行講學禮儀節恭載嘉禮篇闕里祀典順治八年世祖章皇帝遣官致祭先師闕里親閲祭文香帛遣行康熙六年聖祖仁皇帝遣官致祭與順治八年同二十年以滇南蕩平遣官祭告二十三年東巡躬詣闕里致祭如視學釋奠之禮先期奉諭尊禮先師應行三跪九拜禮所用樂章令太常寺酌派司樂及樂舞生先期馳驛前往指示肄習以光盛典是年御製祭先師文親詣行禮畢周視廟庭車服禮器是日御詩禮堂講書畢復命駕至孔林祭酒三爵扈從王公大臣暨衍聖公皆隨行禮又特命以御前曲柄黃蓋留設廟庭嗣後聖駕巡幸至闕里皆致祭如儀並互見門巡幸二十六年御書聖廟碑文遣官齎送闕里恭摹勒石於大成門外金聲門之右二十八年奉旨發內帑興修聖廟三十二年重修聖廟落成詔遣皇子詣闕里告祭三十六年以平定朔漠遣官致祭先師闕里與二十年同四十二年聖祖仁皇帝五十萬夀遣官致祭先師闕里嗣後恭遇萬夀慶典皆遣官致祭如儀六十一年十一月世宗憲皇帝登極遣官祭先師闕里如儀雍正八年諭以聖廟執事之員向來未有爵秩特設聖廟執事官三品者二人四品者四人五品者六人七品者八人八品九品者各十人咸按品級給與章服著衍聖公於孔氏子孫內選擇人品端方威儀嫻雅者報部充補彚奏以聞是年重修聖廟工竣遣皇子及郡王一人往祭崇聖祠亦同行禮頒發祭器於闕里凡登鉶簠簋籩豆尊爵均依照經圖舊式笵銅為器俾藏諸聖廟永為世守九年御書聖廟碑文遣官齎送闕里敬謹鐫刻十三年九月皇上登極遣官詣先師闕里致祭乾隆十三年聖駕東巡至曲阜先詣先師廟上香翼日駕詣先師廟行釋奠禮御詩禮堂講書禮成更常服詣孔林祭酒禮儀與康熙二十三年同十四年以平定金川遣官致祭先師闕里與康熙二十年同十六年聖駕南巡江浙過山東遣官致祭先師嗣後巡幸皆致祭如儀二十一年聖駕東巡致祭先師孔子以平定凖噶爾告如康熙二十三年之儀二十二年聖駕南巡過山東親詣致祭如十三年東巡之儀二十七年四十九年並同二十五年以平定回部遣官致告如儀三十六年聖駕東巡親詣致祭先師孔子如儀是年頒發內府周笵銅器十事交衍聖公敬陳闕里廟庭四十一年駕幸山左親祭先師孔子以平定兩金川告如二十一年之儀巡幸凡巡幸之禮皇帝省方觀民特舉時巡盛典先期一日遣官祇告奉先殿至日鑾儀衛陳騎駕鹵簿於鑾輿所出禁門外皇帝乘輿出宫扈蹕諸臣以次隨發王公百官咸采服跪送內閣學士率中書奉御寶以從部院有執事者攜行在印備用鑾輅所經直省將軍督撫提鎮及所屬文武官辨咸朝服恭迎道左紳士耆老隨逺近跪迎既駐蹕督撫提鎮率屬朝於行營正門之外至巡省之方翼日望秩於方嶽及祭古昔帝王功德隆重者先聖先師皆親詣行禮境內山川先賢名臣忠烈祠墓並遣官致祭駐蹕行營日覲封疆大吏監司郡縣咨詢風土人情臨視河防海塘指授方略召試陳詩獻賦之士拔其尤者量授以官親閲方鎮重兵經過州縣賜復蠲租存問髙年賞賚各有差皇帝回鑾守土官於所治境外跪送在京王公大臣咸采服出郊跪迎次日遣官祇告奉先殿如初禮順治八年四月世祖章皇帝啓蹕巡幸塞外五月駐蹕上都河及喀喇河屯是月入古北口上回宫康熙十年九月聖祖仁皇帝東巡恭謁福陵昭陵行告成禮啓行前一日恭謁太廟祇告至盛京謁陵禮畢設騎駕鹵簿於大清門前聖祖御門升座作樂賜宴頒賞回鑾恭謁太廟行祇告禮十六年九月聖祖仁皇帝啓蹕恭謁孝陵禮成巡幸塞外出喜峯口駐蹕和爾和克必喇次駐蹕喀喇河屯賜來朝喀拉沁諸部郡王鎮國公等弓矢銀幣各有差是月入喜峯口十月上回宫臣等謹按聖朝聲教廣訖邊關以外與中土郡邑無異嵗時臨蒞習武功於徼塞盛王會於遙藩典莫隆焉自世祖章皇帝清蹕肇臨聖祖仁皇帝六飛時御創垂典則昭示來兹康熙四十二年肇建避暑山莊於熱河嵗為巡幸聽政之所皇上闡迪前光以乾隆六年親蒞行圍嗣乃間嵗一至後遂定為每嵗秋巡令典關門士庶瞻就光華藩部名王嵗時來辟施惠行慶朝覲宴賚之禮嵗舉為常有紀載不能盡述者兹謹載肇事之嵗月著於篇中以昭秋巡大典之原起焉二十一年二月上以雲南底定東巡盛京恭謁永陵福陵昭陵告祭行禮如十年之儀二十二年二月上幸五臺山九月上奉太皇太后幸五臺山二十三年九月聖祖仁皇帝東巡前期頒詔天下凡經過地方各有加恩至山東泰安州躬祭岱嶽渡黃河遣官祭河神至江南江寧府親祭明太祖陵諭江南督撫江南風俗奢華務令潔已愛民敦本尚實勒石於江寧蘇州安慶三府回鑾至山東躬詣闕里致祭先師孔子遣親王致祭元聖周公駕還京師王以下文武百官朝服跪迎如常儀二十八年正月聖祖南巡命部院本章仍日送內閣內閣彚齊三日一次驛送行在辦理至山東望祭岱宗蠲山東二十九年租賦入江南境閲視河工至浙江會稽山躬祭禹陵至江寧府躬詣明太祖陵致祭回鑾至淮安府閲視髙家堰一帶隄岸指授河臣方略駕還京師餘如二十三年之禮三十七年二月上幸五臺山路經房山命皇子等至金太祖陵世宗陵奠酒七月上以親征平定噶爾丹恭奉皇太后詣盛京謁陵告祭如二十一年之儀三十八年聖祖南巡奉仁憲皇太后由水路行至清河臨閲髙家堰歸仁隄等隄防畢回至清口臨視隄防命截留漕糧減直發糶蠲江南浙江纍嵗逋賦回鑾仍由水路奉仁憲皇太后還京師餘如二十八年之禮四十一年正月上幸五臺山四十二年正月聖祖南巡閲河入江南境沿途閲視河防至浙江駐蹕杭州回鑾以河工告成頒詔天下餘如三十八年之禮是年十月聖祖西巡至潼關遣官祭華嶽至西安府命凡帝王陵寢及已過勳臣墳墓在百里內者咸祭之蠲陜西纍年逋賦駕由河南還京師四十四年二月聖祖南巡閲河駕發京師至通州張家灣登舟由山東入江南境臨視河工至浙江杭州府蠲免租賦至清河復臨髙家堰遍閲河隄回鑾餘如四十二年之禮四十六年正月聖祖南巡至江寧幸演武場閲射至蘇州百姓萬餘人進表叩祝萬夀至杭州普行慶惠如前禮回鑾餘如四十二年之禮四十九年二月上幸五臺山乾隆六年七月皇上奉皇太后啓蹕巡幸塞外出古北口八月駐蹕喀喇河屯上行圍木蘭奉皇太后自喀喇河屯啓行蒙古諸王公等恭迎聖駕是日上萬夀聖節御行殿扈從王公大臣及蒙古王公台吉等行慶賀禮賜宴賞賚有差九月駕回至熱河行宫回鑾入古北口上奉皇太后回圓明園八年皇上奉皇太后駕往盛京恭謁祖陵啓行前一日躬詣奉先殿祇告九月駕至興京恭謁永陵如儀駕至盛京恭謁福陵昭陵如儀遣官致祭長白山北鎮醫巫閭山遼太祖陵如儀回鑾親詣奉先殿告祭十一年九月上奉皇太后巡幸五臺回鑾閲滹沱河隄工改慶都縣曰望都十三年二月皇上奉皇太后駕幸山東疊沛恩綸普行優恤駕至曲阜親詣先師孔子廟元聖周公廟上香翼日親詣先師廟行釋奠禮御詩禮堂講書詣孔林祭酒並親詣少昊金天氏陵致祭遣官祭先聖先賢墓躬詣岱嶽致祭至濟南府閲兵復躬詣舜廟行禮十五年二月上奉皇太后巡幸五臺八月上奉皇太后駕幸中州親詣嵩嶽遣官致祭河瀆衛水周文王廟漢光武廟周世宗陵鑾輿所經蠲免錢糧十分之三十六年正月上奉皇太后南巡江浙過山東遣官致祭岱宗先師孔子元聖周公至宿遷登舟遣官祭河瀆淮瀆江瀆之神踰淮揚抵浙江遣官致祭南鎮會稽山躬詣禹陵明太祖陵致祭凡河工海塘咸指授機宜諭以修防之道閲視八旗駐防及水陸標營騎射是年疊頒諭旨截留漕糧蠲免積欠普行慶惠十九年八月皇上東巡盛京恭謁三陵如八年之儀二十一年二月以平定凖噶爾駕幸山左親詣先師孔子廟行釋奠禮遣官致祭先聖先賢普行慶典如十三年之儀二十二年正月上奉皇太后南巡江浙臨視河工海塘指授機宜所至遣官祭告普行慶典如十六年之儀二十六年二月上奉皇太后西巡五臺二十七年正月上奉皇太后南巡江浙閲河至清江浦相度水勢指授河臣定髙家堰五壩水志水髙一尺清口即開放十丈為凖俟秋汛後洪湖水勢既定仍如常接鑲口門嗣是河臣恪守此法下河永免水患萬世永賴至浙江閲視海塘行慶如二十二年儀三十年正月上奉皇太后南巡江浙閲視河海行慶如儀三十六年四月上奉皇太后巡幸山左登岱嶽詣闕里行禮如二十一年之儀四十一年二月以兩金川平定上奉皇太后巡幸山左告祭闕里如二十一年之儀四十三年七月皇上東詣盛京恭謁三陵如十九年之儀四十五年正月皇上南巡江浙閲視陶莊新開引河命以髙家堰三堡六堡等處磚工一律改建石工以資永逺鞏固徐州並山石隄加髙十七層接築四百五十丈直連山腳俾濵河永保安瀾至浙江命自老鹽倉一帶改建魚鱗石塘三千九百四十丈以為重門保障餘並行慶施惠如三十年之儀四十六年二月皇上西巡五臺四十八年八月皇上以和闐瑞玉新造列朝册寶告成命敬送舊册舊寶尊藏盛京太廟至是由熱河啓鑾親往瞻禮致祭駕至興京盛京恭謁三陵命重修盛京壇廟由山海關回鑾躬詣北海神廟拈香餘如四十三年之儀四十九年正月皇上南巡江浙以浙江海塘老鹽倉一帶石隄既已全竣而章家菴以西惟賴范公塘土隄一道衛護形勢單薄親臨指示特諭督撫採石鳩工一律接築石塘不惜數百萬帑金俾瀕海黔黎永資樂利餘並行慶施惠如儀羣祀臣等謹按鄭志吉禮有封禪歷代所尚享司寒禜葦茭桃梗髙禖祓禊諸門考封禪之儀古不經見所謂七十二代者大約起於秦漢之際依託附會之言我國家重熙纍洽列聖相承郊壇嶽鎮之祀典文該洽誠無事侈陳封禪也至歷代所尚之説五德相勝紛錯不一恭讀御製題大金德運圖説詩序云五德之運説本無稽商尚白周尚赤其見於經者亦祇白牡騂剛之類各從其色至於上衣下裳元纁相稱則三代同之而德運之説固未之前聞也自漢儒始言五德迭王遂推三王五帝各有所尚後更流為讖緯抑又惑之甚矣夫一代之興皆由積德纍仁豈在五行之生尅而服御所尚自當以黃為正餘非所宜元明制度尚黃不侈陳五德之王其義甚正本朝因之足破漢魏以後之陋説煌煌聖言所以折衷前古之疑者昭然如發矇矣至於司寒之享我朝備藏冰開冰之制而不列於專祠禜以禱旱則已見於雩祭禱水旱門無容復述葦茭桃梗髙禖祓禊之祀自唐以後已不復舉行今謹將封禪以下諸門並行刪去鄭志又有諸雜祠一門載周之夀星秦之陳寶漢之梁巫晉巫神君等祠皆多不經之祭我朝釐定祀典正大光明凡臚於春秋祭祀者皆有功於國有德於民報以饗祀唯宜唯稱謹依會典通禮所載考其由來述羣祀一篇順治元年定祭先醫神之禮每年春冬仲月上甲遣官祭先醫於景惠殿在太醫院署內之左正殿內太昊伏羲氏位居中炎帝神農氏位居左黃帝軒轅氏位居右南向配位勾芒風后東位西面祝融力牧西位東面東廡僦貸季天師岐伯伯髙少師雷公伊尹淳于意王叔和皇甫謐葛洪韋慈藏錢乙劉完素李杲皆西向西廡鬼臾區俞跗少俞桐君馬師皇扁鵲張機華陀巢元方孫思邈王冰朱肱張元素朱彥修皆東向正殿以禮部尚書一人主祭兩廡以太醫院堂官二人主祭先期由禮部題請今由太常寺雍正十二年命太醫院御醫吏目等官咸齋戒陪祀其儀節具大清通禮右先醫廟順治元年定祭關帝之禮初定制致祭於地安門外之西白馬關帝廟嵗以五月十三日致祭由太常寺先期題請即遣本寺堂官行禮九年敇封忠義神武關聖大帝雍正三年敇封關帝三代公爵定春秋祭禮置五經博士以奉祀事禮臣議請封關帝曾祖為光昭公祖為裕昌公父為成忠公牌位止書追封爵號不著名氏於京師白馬關帝廟後殿供奉遣官告祭其山西解州河南洛陽縣塜廟并各省府州縣擇廟宇之大者置主供奉後殿春秋二次致祭從之五年以關帝廟重修告成定春秋致祭之儀前殿牲用太牢遣大臣將事行三跪九叩禮後殿牲用少牢遣太常寺堂官將事行二跪六叩禮餘儀皆同五月十三日致祭用牲牢果實七年定直省祭關帝廟嵗三祭皆用太牢乾隆二十五年山東按察使沈廷芳奏關帝封號雖尊諡法未協請議更易以光典册詔是之因易原諡為神勇三十三年詔加封號為忠義神武靈佑關聖大帝右關帝廟順治二年八月致祭都城隍之神是年以八月二十七日遣太常寺堂官致祭行禮自後嵗以為常廟在都城宣武門內八年定萬夀聖節致祭之禮是嵗禮部會議祀典請於萬夀聖節遣官致祭東嶽真武城隍之神先期由太常寺奏請遣官雍正三年令太常寺開列大臣職名請旨欽點致祭右都城隍廟雍正四年建禁城城隍神之廟九年建皇城城隍神之廟一在禁城之西北隅一在西安門內曰永佑宫嵗以萬夀聖節及季秋遣內務府總管各一人致祭如祭都城隍廟之禮右禁城皇城城隍廟順治八年定致祭真武東嶽神之禮每年恭遇萬夀聖節遣官致祭北極佑聖真君於顯佑宫在地安門外日中坊橋東南向致祭東嶽泰山之神廟在朝陽門外南向由禮部題請今由太常寺遣堂官一人行禮右真武廟東嶽廟順治初年定致祭紅衣發貢神之禮每嵗以九月初一日致祭於盧溝橋北沙鍋村由太常寺奏請遣八旗漢軍都統將事八旗各為一壇按旗排設炮位陳設畢具承祭都統於鑲黃旗炮位前行禮七旗都統各於本旗炮位前隨承祭官上香行禮副都統以下咸陪祀康熙三十五年聖祖仁皇帝親征噶爾丹遣官致祭火炮之神讀祝行禮如儀先是遣官致祭各樣火炮有神威將軍鐵心沖天子母各名又有新製銅炮龍炮鐵心銅炮皆分案致祭三十六年凱旋致祭如初雍正三年定每三年一次遣官致祭乾隆十八年定凡致祭八旗各遣一人承祭又定火器營祭八旗子母炮神每年請旨舉行以火器營總統一人承祭三十年七月定致祭炮神用祝版并製祭器右炮神康熙二年定致祭司火神之禮廟在日中坊橋西嵗以六月二十三日遣行雍正八年定祭禮牲用太牢乾隆二十三年十一月二十四年十一月皇上親詣拈香右火神廟康熙二十年重建黑龍潭龍神廟嵗以春秋仲月諏吉遣官致祭潭在金山之麓互見雩祭門聖祖仁皇帝數以禱雨至其地乃鼎新廟宇御製碑文以紀之雍正二年世宗憲皇帝親詣致祭澍雨立應重修工竣御製碑文親製宸翰勒石廟庭乾隆五年五月加封黑龍潭龍神為昭靈沛澤龍王之神二十五年二月奉諭嵗祭黑龍潭龍神改遣內務府圓明園大臣行禮三十九年四月皇上親詣致祭甘雨立應四十二年六月四十三年四月四十八年五月並親詣致祭如儀右黑龍潭龍神乾隆九年封玉泉山龍神為惠濟慈佑龍神遣官致祭廟在京西玉泉山之麓十六年奉諭旨京師玉泉靈源濬發為水德之樞紐畿甸衆流環滙皆從此瀠注朕歷品名泉實為天下第一其澤流潤廣惠濟者博而逺矣上有龍神祠已命所司鳩工崇飾宜列之祀典其品式一視黑龍潭該部具議以聞尋議奏遣禮部堂官一人往祭從之二十五年二月奉諭嵗祭玉泉山龍神改遣內務府圓明園大臣行禮右玉泉山龍神順治初年定制致祭后土之神司工之神凡大興作諏吉遣官各一人將事豫日工部官於營建所在因其方設左右二壇祭日承祭官朝服行禮儀節與都城隍廟同凡盛京各直省有奉旨興修工作之處亦先期照例致祭右祭后土司工順治初年定制凡大工迎吻致祭琉璃窯神並經由一路門神各遣官一人將事豫日工部官設壇於琉璃窯及迎吻所經之各門祭日承祭官朝服將事與祭司工神儀同祭畢導迎樂作鑾儀衛校舁吻禮部太常寺官前導承祭官從所經諸門承祭官迎於門前及工所管工官列班恭迎以入安吻事竣各退右祭窯神門神順治十六年以織造局設機致祭司機之神遣禮部堂官行禮一應禮儀均與祭司工之神同右祭機神雍正七年敇封各倉司倉之神國家漕運之制逺軼前代積貯盈溢分建各倉以貯之倉中或舊有神祠未列祀典司事者以請下禮部議通州三倉惟西倉舊有倉神祠在京城內七倉惟右翼興平倉舊有大倉神祠俱應重加修葺左翼擇於海運倉城外五倉擇於新建之儲濟倉各建廟宇設司倉神位每嵗春秋致祭敇加封號封通州倉為均調顯佑司倉之神左翼倉為豐儲裕餉司倉之神右翼倉為佑農廣惠司倉之神新建二倉為凝禧阜衆司倉之神各賜御書匾額載入祀典右倉神皇朝通志卷四十一
