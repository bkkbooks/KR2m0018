body:
  text: 欽定四庫全書皇朝通志卷十八天文略一臣等謹按易曰仰以觀乎天文日月星辰之麗乎上天之文也聖人觀之察之欽若敬授以前民用三代以前尚已漢晉而還觀象者言徵應推步者失實測史家分天文律書為二門司馬遷天官書僅載垣宫列宿吳太史令陳卓引巫咸甘石之書增益其數後之言天者咸奉以為標準焉鄭樵著天文略屏去誕妄之言祗録隋丹元子步天歌取其句中有圖言下見象使人仰觀焉而即得其論卓矣然不言推步而仍涉禨祥休咎則未免自相矛盾夫觀象體也推步用也體用不偏廢斯聖人欽若敬授之本旨洪惟聖祖仁皇帝亶聰作后學貫天人考驗西法最善俾専司時憲時監官南懷仁等畢智竭能創制儀器最稱精密我皇上敬天勤民事惟法祖申命監臣釐正璣衡以期吻合於是恆星增減較舊測而加詳參宿後先改距星而順序凡兹垂象訂自宸謨休乎哉聖代之新規直協虞廷之遺意也間考西法之善理竒而正者數事一曰天圓而地亦圓如卵裹黃與渾天之説合一曰天有九重最逺則恆星天次土次木次火次金水次日最近者為月天其外則宗動天與楚詞之説合一曰惟宗動天行有常度恆星天亦右行此即歷代嵗差之説一曰日月五星各有天行皆有輪如珠逐盤所以有盈縮遲疾一曰月與五星有本輪以從天有次輪以法日蓋日尊天月五星尊天又尊日也一曰金水與日同天其兩輪包日故不與日相距一曰月有倍離五星一合日而遲疾一周月一合日而遲疾再周五星之小輪跨本輪之內外月之小輪切本輪之邊其法皆以實測而得至於南極之紀星座天漢之周尾宫為中國所未見者西人皆於浮海測之此其事初若創見然或符於古經或軌於自然之理洵乎確實而不可易有非唐一行郭守敬之所能企及耳今據欽定考成協紀諸書纂述天文約分十目曰兩儀曰恆星曰天漢其經也曰日月曰五星曰月五星凌犯曰中星曰北極髙度其緯也曰儀象曰弧線其器與法也為書凡六卷於鄭志之外補所闕遺廣所未及溯觀象之端倪賅推步之體要世之學者有以知聖朝憲天立政察紀明時昭昭乎有目之能窺無微而不顯又豈步天歌之句圖言象所可同日語耶若夫測算細微至詳且密具有成書兹撮其大略俾言天者毋涉空詮云爾兩儀臣等謹按西法謂地居天中其體渾圓與天度相應即渾天家卵黃之説人居其中各隨所在皆戴天而履地居赤道北者北極見南極隱居赤道南者南極見北極隱近極則見極髙逺極則見極低東方日中西方夜半南方日中北方夜半周天三百六十度日月星辰旋繞其間而人目力所極適與地平止一百八十度昔人局於地平測算而不知地如卵圓故多疏舛今首列兩儀以為恆星七曜運行之準而西法之與前代逈殊於斯具見天象虞書堯典曰欽若昊天厯象日月星辰楚詞天問曰圜則九重孰營度之後世専家謂天有十二重非天實有如許重數蓋言日月星辰運轉於天各有所行之道即楚詞所謂圜也欲明諸圜之理必詳諸圜之動欲考諸圜之動必以至靜不動者準之然後得其盈縮蓋天道靜専者也天行動直者也至靜者自有一天與地相為表裏故羣動者運於其間而不息若無至靜者以驗至動則聖人亦無所成其能矣人恆在地面測天而七政之行無不可得者正為以靜驗動故也十二重天最外者為至靜不動次為宗動南北極赤道所由分也次為南北嵗差次為東西嵗差此二重天其動甚微専家姑置之而不論焉次為三垣二十八宿經星行焉次為填星所行次為嵗星所行次為熒惑所行次則太陽所行黃道是也次為太白所行次為辰星所行最內者則太隂所行白道是也要以去地之逺近而為諸天之內外然所以知去地之逺近者則又從諸曜之掩食及行度之遲疾而得之蓋凡為所掩食者必在上而掩之食之者必在下月體能蔽日光而日為之食是日逺月近之徵也月能掩食五星而月與五星又能掩食恆星是五星髙於月而卑於恆星也五星又能互相掩食是五星各有逺近也又宗動天以渾灝之氣挈諸天左旋其行甚速故近宗動天者左旋速而右移之度遲漸逺宗動天則左旋較遲而右移之度轉速今右移之度惟恆星最遲土木次之火又次之日金水較速而月最速是又以次而近之徵也是故恆星與宗動相較而嵗差生焉太陽與恆星相會而嵗實生焉黃道與赤道出入而節氣生焉太陽與太隂循環而朔望盈虛生焉黃道與白道交錯而薄蝕生焉五星與太陽離合而遲疾順逆生焉地心與諸圜心之不同而盈縮生焉歷代専家多方測量立法布算積久愈詳已得其大體其間或有毫芒之差諸説不無同異者蓋因儀器仰側穹蒼失之纎微年久則著雖有聖人莫能預定惟立窮源竟委之法隨時實測取其精密附近之數折中用之每數十年而一修正斯為治厯之通術而古聖欽若之道庶可復於今日矣地體欲明天道之流行先達地球之圓體日月星辰每日出入地平一次而天下大地必非同時出入居東方者先見居西方者後見東西相距萬八千里則東方人見日為午正者西方人見日為邜正也周天三百六十度每度當地上二百里是故推驗大地經緯度分皆與天應測緯度者用午正日晷或測南北二極測經度則必於月蝕取之蓋月蝕與日蝕異日之食限分數隨地不同月之食限分數天下皆同但入限有晝夜人有見不見耳此處食甚於子者處其東三十度必食甚於丑處其西三十度必食甚於亥是故相去九十度則此見食於子而彼見食於酉相去百八十度則此見食於子而彼當食於午雖食而不可見矣黃道赤道天包地外圜轉不息南北兩極為運行之樞紐地居天中體圓而靜人環地面以居隨其所至適見天體之半中華之地面近北故北極常現南極常隱平分兩極之中橫帶天腰者為赤道赤道距天頂之度即北極出地之度也赤道以北為內為隂以南為外為陽斜交赤道而半出其南半出其北者為黃道乃太陽一嵗所躔之軌迹也黃赤道相交之兩界為春秋分距赤道南二十三度半為冬至距赤道北二十三度半為夏至七政所行之道紛然不齊惟將黃赤二道以為推測之本蓋太陽循黃道東行而出入於赤道之南北太隂與五星各循本道東行而又出入於黃道之南北故黃赤二道之位定則晝夜永短寒暑進退以及晦朔弦望薄蝕朏朒皆從此可稽矣經緯度恆星七政各有經緯度蓋天周弧線縱橫交加即如布帛之經緯然以東西為經南北為緯然有在天之經緯有隨地之經緯在天則為赤道為黃道隨地則為地平赤道均分三百六十度平分之為半周各一百八十度四分之為象限各九十度六分之為紀限各六十度十二分之為宫為時各三十度是為赤經從經度出弧線與赤道十字相交各引長之會於南北極皆成全圜亦分為三百六十度兩極相距各一百八十度兩極距赤道俱九十度是為赤緯依緯度作圜與赤道平行名距等圜此圜大小不一距赤道近則大距赤道逺則小其度亦三百六十俱與赤道之度相應也赤道之用有動有靜動者隨天左旋與黃道相交日躔之南北於是乎限靜者太虛之位亘古不移晝夜之時刻於是乎紀焉黃道之宫度並如赤道其與赤道相交之兩點為春秋分相距皆半周平分兩交之中為冬夏至距兩交各一象限六分象限為節氣各十五度是為黃經從經度出弧線與黃道十字相交各引長之周於天體即成全圜其各圜相湊之處不在赤道之南北兩極而别有其樞心是為黃極黃極之距赤極即兩道相距之度其距黃道亦皆九十度是為黃緯而月與五星出入黃道之南北者悉於是而辨焉故凡南北圜過赤道極者必與赤道成直角而不能與黃道成直角其過黃道極者必與黃道成直角而不能與赤道成直角惟過黃赤兩極之圜其過黃赤道也必當冬夏二至之度所以並成直角名為極至交圜又若赤道度為主而以黃道度準之則互形大小何也渾圓之體當腰之度最寬漸近兩端則漸狹距等圜之度也二至時黃道以腰度當赤道距等圜之度故黃道一度當赤道一度有餘二分時兩道雖皆腰度然赤道平而黃道斜故黃道一度當赤道一度不足也此所謂同升之差而七政升降之斜正伏見之先後皆由是而推焉至於地平經緯則以各人所居之天頂為極蓋人所居之地不同故天頂各異而經緯從而變焉地在天中體圓而小隨人所立凡目力所極適得大圓之一半則地雖圓而與平體無異故謂之地平乃諸曜出沒之界晝夜晦明之交也地平亦分三百六十度四分之為四方子午卯酉各相距九十度二十四分之為二十四向各十五度是為地平經從經度出弧線上會於天頂並皆九十度從地平下至天頂之衝亦九十度是為地平緯又名髙弧髙弧從地平正午上會天頂者其全圜必過赤道南北兩極名為子午圜乃諸曜出入地平適中之界而北極之髙下晷影之長短中星之推移皆由是而測焉是故經緯相求黃赤互變因黃赤而求地平或因地平而求黃赤乃専家之要務推測之所準也臣等謹按天文之有黃赤經緯由宗動天而分為恆星七曜之所轉旋因列於天象地體之後又古法以日行命天周為三百六十五度四分度之一然為畸零之度而不能合於日行西法與回回同以周天為整度就三百六十為起數之宗經緯通為一法賅括萬殊斜側縱橫周通環應得以整御零為法倍易可謂最善者矣恆星恆星總紀恆星即經星也以其有常不易故名經星史記天官書紫宫房心權衡咸池虛危列宿部星此天之五宫坐位也為經不移徙大小有差濶狹有常經星又各有經緯度故别之曰恆星其星官名數古今不同漢書天文志經星常宿中外官凡百一十八名積數七百八十三星晉志載吳太史令陳卓始列甘石巫咸三家星官著於圖録凡二百八十三官一千四百六十四星今皆不見原本隋丹元子步天歌與陳卓數合後此言天官者皆以步天歌為準康熙十三年監臣南懷仁修儀象志星名與古同者總二百五十九座一千一百二十九星比步天歌少二十四座三百三十五星又於有名常數之外增五百九十七星又多近南極星二十三座一百五十星近年以來纍加測驗星官度數儀象志尚多未合又星之次第多不順序亦宜釐正於是逐星測量推其度數觀其形象序其次第著之於圖計三垣二十八宿星名與古同者總二百七十七座一千三百一十九星比儀象志多十八座一百九十星與步天歌為近其尤與古合者二十八宿次舍自古皆觜宿在前參宿在後其以何星作距古無明文唐書云古以參右肩為距失之太逺文獻通考載宋兩朝天文志云觜三星距西南星參十星距中星西第一星西法觜宿距中上星參宿亦距中西一星今按觜宿中上星在西南星前僅六分餘而西南星小中上星大則以中上星作距可也若參宿以中西一星作距星則觜宿之黃道度巳在參宿後一度餘即赤道度亦在參宿後三十一分餘今依次順序以參宿中三星之東一星作距星則觜宿黃道度恆在參前一度弱與觜前參後之序合其餘諸座之星皆以次順序無凌躐顛倒之弊又於有名常數之外增一千六百一十四星近某座者即名某座增星依次分注方位以備稽考其近南極星二十三座一百五十星中國所不見仍依西測之舊共計恆星三百座三千八十三星編為總紀一卷庶星官名數古今不同及黃道赤道所屬宫次皆展卷瞭然矣臣等謹按丹元子步天歌先二十八宿後三垣蓋箕風畢雨織女牽牛見於詩書者皆列宿星座而宋兩朝天文志所載垣星俱入列宿度分是列宿星名最古也三垣多取周秦之國與官名知始於甘石之徒