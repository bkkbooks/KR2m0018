body:
  text: 氏族畧五滿洲八旗姓精吉氏世居吉林烏拉地方薩爾都氏世居哈達地方和岳囉氏世居呼爾哈地方舍顔氏世居費雅郎阿地方必魯哷氏世居蘇完地方瑚克錫哷氏世居伊蘭費爾塔哈地方順布嚕氏世居哈爾敏地方舒發察氏世居綏芬地方音佳氏世居嘉穆呼地方圖爾敦氏世居墨爾根城地方慶格哩氏世居黒龍江地方蘇拉喇氏世居黒龍江地方阿爾拉氏世居黑龍江地方臣等謹按阿爾拉本元部名見元史以部為氏墨哷氏世居葉赫地方巴爾拉氏世居遼河地方敖拉托欣氏世居黑龍江地方拜英格哩氏世居墨爾根城地方穆雅氏世居齊齊哈爾地方攸囉庫氏世居黑龍江地方鄂囉氏世居長白山地方嘉布塔喇氏世居輝發地方富森氏世居開原地方瑚遜氏世居五姓莊地方佟啓氏世居佛阿拉地方格爾克氏世居格爾欽地方圖佳氏世居松花江地方古爾吉氏世居廣寧正安堡地方傅錫哩氏世居特依芬地方墨佳氏世居遼陽地方伊拉齊氏世居阿庫哩地方額爾格濟氏世居廣寧正安堡地方倭赫氏世居界凡地方烏聶齊氏世居黑龍江地方都克達氏世居留福村地方臣等謹按都克達本金姓見金史以姓為氏赫爾濟氏世居長白山地方錫爾弼氏世居葉赫地方拜佳氏世居佛阿拉地方臣等謹按拜佳氏考八旗氏族通譜滿洲蒙古兩見今列於滿洲姓内其䝉古拜佳氏併入又考䝉古拜佳氏世居烏嚕特及察哈爾地方塔喇氏世居訥殷江地方宏義氏世居洪揚子溝地方温屯氏世居烏拉地方富色哷氏世居屯昂阿地方倭徹庫氏世居葉赫地方凱隆氏世居齊齊哈爾城地方玉克墨氏世居尼雅滿地方伊喇氏世居三姓地方臣等謹按伊喇本遼部名入金為姓見金史以部為氏克依克哷氏世居三姓地方甘佳氏世居吉陽地方齊達哷氏世居葉赫地方泰瑚特氏世居吉林烏拉地方墨爾迪氏世居黑龍江地方貴岳哩氏世居伯都訥地方公吉哩氏世居費達木村地方珠赫哷氏世居烏拉地方博爾衮氏世居那木都魯地方阿嚕氏世居索倫地方敖佳氏世居瑪察地方瑚錫喀氏世居黒龍江地方珠錫哩氏世居蜚悠城地方珠雅拉氏世居烏拉地方阿爾布氏世居烏拉地方齊克騰氏世居烏拉地方烏濟佳喇氏世居長白山地方文達氏世居葉赫地方楞布爾勤氏世居索倫地方都克塔哩氏世居努克特勒地方阿拉邊遷氏世居索倫地方圖爾塔拉氏世居黒龍江地方錫克徳氏世居卦勒察地方羅察氏世居索倫地方伊穆氏世居紅雲堡地方墨克廷氏世居黒龍江地方瑪爾丹氏世居扎庫木地方額爾格圖氏世居黑龍江地方色哷哩氏世居琿春地方烏庫登吉氏世居齊齊哈爾地方章齊氏世居那木都魯地方嘉佳氏世居烏拉地方都雅爾氏世居琿湖理努克特勒地方亨竒勒氏世居吉林烏拉地方格晉氏世居佛阿拉地方希薩爾氏世居輝發地方鄂通氏世居鄂通地方公鄂哩氏世居松花江地方穆魯氏世居索倫地方扎哈瑪氏世居尼瑪察地方墨克勒氏世居葉赫地方謨勒齊哩氏世居噶哈地方伊勒爾濟氏世居吉陽地方都爾勒氏世居黑龍江庫魯穆圖村地方罕楚哈氏世居綏芬地方舒爾都氏世居葉赫地方臣等謹按舒爾都本金姓見金史以姓為氏叙察氏世居葢州城鄂爾多地方福塔氏世居長白山地方竒徳哩氏世居葉赫地方瑚呼氏世居呼爾哈烏拉地方宗佳氏世居輝和地方訥迪氏世居黑龍江地方瓦勒佳氏世居長白山地方尼格勒氏世居黑龍江富爾呼村地方準齊氏世居黑龍江地方翁尼哩氏世居烏拉地方珠爾克氏世居索倫地方通阿拉氏世居倭濟地方穆勒徳氏世居大凌河地方烏扎勒瑚氏世居琿春地方特濟氏世居扎庫塔地方塔坦氏世居長白山地方臣等謹按塔坦舊係蒙古姓見元史以姓為氏猷格哩氏世居葉赫地方哈爾吉氏世居哈達地方穆齊氏世居額木赫索囉地方恰喇氏世居寧古塔地方姜佳氏世居寧古塔地方博和羅氏世居薩哈禄地方唐尼氏世居十方寺地方烏拉氏世居鄭家堡地方洪達哩氏世居嘉拉庫地方瑪爾屯氏世居長白山地方兆壘氏世居瑪察地方臣等謹按兆壘本元部名見元史以部為氏玉爾庫氏世居尼瑪察地方陳佳氏世居張當地方莽吉綽氏世居葉赫地方墨爾吉氏世居葉赫地方穆色辰氏世居佛阿拉地方塞楞吉氏世居塞楞吉石赫寨地方尼瑪哈氏世居遼陽地方臣等謹按尼瑪哈本金部名見金史以部為氏茂儀氏世居英額地方安佳氏世居普塞屯村地方羅岳氏世居葉赫地方鄂濟哩氏世居卦勒察地方翁果特氏世居翁科地方康錫哩氏世居伊巴丹地方蘇克察氏世居葉赫地方扎穆秦氏世居黑龍江地方都瓦爾佳氏世居章集堡地方諾羅氏世居舍楞阿河地方田佳氏世居瀋陽地方林佳氏世居蜚悠城地方秋佳氏世居杏山地方多錦氏世居黒龍江索多理村地方努爾漢氏世居努爾漢地方錫勒爾吉氏世居吉林烏拉地方嘉哈瑪氏世居黒深堡地方瑚錫氏世居輝發地方瓦爾吉氏世居色欽地方達瑚哩氏世居烏呼哩地方屈佳氏世居輝發地方普佳氏世居杏山地方蔣佳氏世居葢州地方龎佳氏世居清城子地方䝉果資氏世居綏芬地方舒克都哩氏世居綏芬地方費佳氏世居訥殷江地方阿塔穆氏世居葉赫地方西法齊氏世居綏芬地方孔尼喇氏世居黑龍江地方宻扎氏世居尼瑪察地方倭徹埓氏世居葉赫地方多興氏世居訥殷地方博都哩氏世居索倫地方赫齊拉氏世居雅蘭地方雅佳氏世居輝發地方桓泰氏世居雅蘭地方喀爾庫氏世居烏拉地方福錫氏世居福山地方莽果氏世居烏拉地方臣等謹按莽果本元部名見元史以部為氏崆果囉氏世居黑龍江地方葉禄氏世居葉赫地方飄佳氏世居薩穆占地方扎克塔氏世居黑龍