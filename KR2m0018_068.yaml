body:
  text: 職官略五領侍衛府三旗領侍衛內大臣六人掌統領侍衛親軍內大臣六人散秩大臣無定員俱掌先後士平宸御左右翊衛國初以八旗將定海內鑲黃正黃正白三旗皆侍宿直天子自將爰掄其子弟命曰侍衛用備隨而宗室之秀外藩之侍子亦得預選統以勳戚大臣以重環衛之職馬侍衛等侍御前侍衛十乾清門侍衛俱無定員一衛三旗六人宗室九人二等侍衛三旗一百五十人宗室十八人三等侍衛三旗二百七十人宗室六十三人藍翎侍衛三旗九十人漢人侍衛無定員掌宿衛扈從更畨輪直几六班班分兩翼行幸駐蹕宿衛如宫禁之制扈從則前導隨行其分司職守者有粘杆處侍衛三十四人上駟院侍衛二十四人養鷹狗處侍衛九人善朴處武備院鑾儀衛及諳達侍衛無定員皆統於三旗員額順治初以漢廕生簡選侍衛尋罷康熙二十九年以武進士之嫻騎射者擢置侍衛附於三旗三十七年設宗室侍衛雍正三年於藍翎侍衛中選其材技為四等侍衛後仍為藍翎侍衛五年定制武進士一甲一名授一等侍衛二名三名授二等侍衛二甲得選三等侍衛三甲選藍翎侍衛七年以宗室侍衛併入三旗舊設三旗印務班領十二人班領十二人乾隆三十六年改印務班領為一等侍衛班領為二等侍衛凡侍衛十人則設之長三旗侍衛什長六十人宗室侍衛什長九人親軍校鑲黃旗二十五人正黃旗二十六人正白旗二十五人又有五旗附入三旗之親軍校鑲黃十人正黃十有一人正白九人掌率其屬隨侍衛以執事主事一人署主事二人筆帖式三旗各四人貼寫筆帖式三旗各九人掌章奏文移臣等謹按自古周廬千列設戟百重環衛之官其職彌重周禮宫正宫伯實後世郎衛所由始其時皆以勳親入侍休戚一心法制盡善漢代三署郎多選經明行修者充之猶為不失遺意厥後或權移宦豎或委寄非人代多流弊我朝侍衛之職訓習有道稽核有方出則當折衝之任入則備翊衛之班所以上應勾陳環拱宸極者其規模實為閎逺矣鑾儀衛掌衛事大臣一人以王公大臣管理掌供奉班列乘輿秩序鹵簿辨其名數與其凡祭祀朝會司而時巡之大閲則帥所供鑾儀使三人內二人以滿洲蒙古兼授一人以漢人漢軍兼授職任與掌衛事同順治几年置錦衣衛指揮使等官二年改為鑾儀衛四年罷指揮使置鑾儀使及副使等官五年罷鑾儀副使定鑾儀使滿洲漢人員額各二康熙三十年省漢人一人所𨽻有軍尉旗尉民尉奉輦旗尉百六十八人民尉六十人各執事旗尉二百四十六人民尉一千八百五十六人皆分隸各所三旗蒙古布勒器三十人漢軍更夫四十人左所掌所印冠軍使滿洲一人掌鑾輿司馴馬司司卬雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍二人治儀正滿洲四人漢軍五人整儀尉滿洲二人漢軍八人掌輿乘輦輅之事右所掌所印冠軍使滿洲一人掌擎蓋司弓矢司司印雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍一人治儀正滿洲三人漢軍二人整儀尉滿洲二人掌繖蓋儀刀弓矢槍戟之事中所掌所印冠軍使滿洲一人掌旌節司幡幢司司印雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍一人治儀正滿洲三人漢軍二人整儀尉滿洲二人漢軍一人掌麾􅌁幡幢纛幟節鉞仗馬之事前所掌所印冠軍使滿洲一人掌班劔司戈戟司司印雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍一人治儀正滿洲三人漢軍三人整儀尉滿洲二人掌旗幟立瓜卧瓜吾使之事後所掌所印冠軍使滿洲一人掌班劔司戈戟司司印雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍一人治儀正滿洲三人漢軍三人整儀尉滿洲二人掌旗幟立瓜卧瓜吾仗之事馴象所掌所印冠軍使滿洲一人掌東司西司印雲麾使滿洲二人間散雲麾使滿洲一人雲麾使漢軍一人治儀正滿洲二人漢軍二人整儀尉滿洲二人掌儀象騎駕鹵簿鐃歌前部大樂旗手衛掌衛印冠軍使滿洲一人掌衛事冠軍使漢軍一人掌左司右司印雲麾使滿洲二人治儀正滿洲二人漢軍二人整儀尉滿洲三人掌金鉦鼓角鐃歌大樂及午門司鐘神武門鐘鼓樓直更之事乾隆七年以鼓手旗尉八十人並頭尉八人隸樂部改名署史學習音律又民尉六十人亦改用旗人並隸樂部焉陪祀冠軍使等官冠軍使漢軍二人駕儀管理雲麾使漢軍一人治儀正漢軍三人駕庫管理整儀尉漢軍二人各以其事隸屬於衛無專領職掌主事經歷筆帖式主事滿洲一人經歷漢人一人掌章奏文移筆帖式滿洲七人漢軍三人鳴贊四人掌贊鳴鞕八旗官制八旗都統副都統滿洲蒙古漢軍旗各一人分掌滿洲蒙古漢軍二十四旗之政令以宣布教養整詰戎兵釐治土田稽核户口凡八旗次序以鑲黃正黃正白為上三旗正紅鑲白鑲紅正藍鑲藍為下五旗我部以次削平歸附日衆朝自肇興東土諸太祖髙皇帝辛丑年始編三百人為一牛録每牛録設額真一先是我國出兵校獵不論人數多寡各隨旗黨屯寨而行每人各取一矢十人設長一領之其長稱為牛録額真至是遂以名官尋復定户籍分為四旗曰黃曰白曰紅曰藍以純色為辨乙邜年以初設四旗為正增設鑲黃鑲白鑲紅鑲藍四旗黃白藍均鑲以紅紅鑲以白合為八旗每三百人設一牛録額真五牛録設一甲喇額真五甲喇設一固山額真每固山額真設梅勒額真二人以佐之天聰八年改梅勒額真以下為章京惟固山額真如故其隨固山額真行營馬兵定為阿禮哈超哈此為驍騎營之始九年分設蒙古八旗旗色官制與滿洲八旗同崇德二年始立漢軍二旗四年以漢軍二旗分為四旗七年定設漢軍八旗旗色官制與滿洲蒙古皆同順治十七年定制固山額真漢字稱為都統梅勒章京漢字稱為副都統驍騎參領滿洲旗各五人蒙古旗各二人漢軍旗各五人副驍騎參領各如參領之數掌受都統副都統之政令以頒於佐領而行之天聰八年制管甲喇者即為甲喇章京順治八年定甲喇章京漢字稱為參領滿字如舊康熙三十四年每甲喇增置委署參領各一人於世爵佐領等員內選用雍正元年改為副參領佐領滿洲六百四十人蒙古二百有四人漢軍二百六十六人驍騎校每佐領下一人掌稽所治人户田宅兵籍以時頒其職掌初天命元年始編置滿洲牛録八年增編蒙古牛録天聰四年增編漢軍牛録八年制管牛録者即為牛録章京順治十七年定牛録章京漢字稱為佐領分得撥什庫漢字稱為驍騎校滿文如舊佐領所治以三百人為率丁口滋生則遞有增設佐領之制有世襲有公中世襲佐領有四等衆國初各部落長率其屬來歸授之佐領以統其爰及苖裔曰勳舊佐領其率衆歸誠功在旗常得里來賜户口者曰優異世管佐領其僅同弟兄族歸因授之以職奕葉相承者曰世管佐領其户少丁稀合編佐領兩姓三姓迭為是官者曰互管佐領皆以應襲者引熙十見除授公中佐領則因八旗户口蕃衍於康三年以各佐領撥出餘丁增編佐領使旗員統之有缺則以不兼部務之大臣世爵及五品以上文武官內簡選除授焉印務官印務參領滿洲旗各二人蒙古旗各一人漢軍旗各二人印務章京滿洲旗各八人蒙古旗各四人漢軍旗各六人印務筆帖式滿洲旗各八人蒙古旗各四人漢軍旗各六人隨印外郎漢軍旗各一人蒙古旗各一人掌章疏文移案牘及翻譯行遣之事臣等謹按八旗之制為前古所未有我國家神武開基龍興之初建旗辨色用飭戎行厥後歸附既衆即按行軍旗色以定户籍先立四旗尋增為八旗逮後户口日繁乃次第編置蒙古漢軍八旗合為二十四旗制度詳備及定鼎京師分田授宅辨方正位在內則有親軍前鋒護軍驍騎步軍之分在外則有各省駐防之制而悉統之以八旗設官分職教養生成蓋以旗統人即以旗統兵凡隸乎旗者皆可以為兵非如前代有僉派召募之煩而後收兵之用故居則環衛周防出則折衝禦侮臂指之使磐石之固洵可超越百代垂治億年者矣前鋒護軍統領前鋒統領左右翼各一人或以王公大臣兼領掌本翼四旗前鋒之政令前鋒參領前鋒侍衛左右翼各八人委署前鋒侍衛左右翼各四人前鋒校左右翼各四十八人掌督率前鋒警蹕宿衛凡立前行幸止頓於户列御營一二里外安設卡倫鋒旗以為門帳守衛隨印協理事務前鋒參領侍衛左右翼各一人隨卬前鋒校左右翼各二人隨印筆帖式左右翼各二人掌案牘文移護軍統領每旗各一人掌護軍之政令護軍參領每旗滿洲十人蒙古四人內司鑰長署司鑰長每旗各一人副護軍參領每旗滿洲十人蒙古四人委署護軍參領每旗各七人護軍校滿洲蒙古每佐領各一人掌董率護軍守衛門户及紫禁城外環列周廬畨上宿直宫殿車駕行幸則宿衛制以御營專司網城堆鋪及清道警蹕之政令初上三旗護軍參領等守衛禁門下五旗各守王公府門雍正七年始定八旗護軍均司禁衛焉隨印協理事務護軍參領副護軍參領每旗各一人隨印護軍校每旗各二人隨印筆帖式每旗各二人門筆帖式鑲黃正黃正白三旗各十人掌案牘文移圓明園八旗護軍營總統以王公大臣兼任無定員掌圓明園翊衛之政令營總護軍參領每旗各一人副護軍參領每旗各二人署副護軍參領每旗各四人護軍校每旗各八人副護軍校每旗各八人掌守衛各御園畨直巡警隨印協理事務營總護軍參領二人隨印護軍校四人隨印筆帖式八人掌案牘文移御營嚮導總統無定員嚮導處參領侍衛各四人前鋒校護軍校各六人凡遇時巡以總統一人先期率官詣程入車駕經行之地周覽山川通橋梁夷險隘計告駕行則佩櫜前𨗳臣等謹按歷代衛尉監門諸職雖規制具存而積久廢弛不加訓練每致軍多隱占尺籍常虛至明代流風愈下諸門管鑰甚且付諸寺人之手禁衛之事益不可問矣我朝建旗分職碁布星羅以前鋒護軍所轄專掌宿衛清蹕制度詳明規條嚴密復以時訓習操練黜陟懲勸無不感勵奮興精心簡練環衛之制洵非前代所能比擬也步軍統領提督九門巡捕五營步軍統領滿洲一人掌京城內外門禁鎖鑰統帥八旗步軍五營將備以徼巡京師初制皆領於兵部職方司以漢主事一員專司政令康熙十三年始改設提督九門步軍統領一員營併特簡八旗大臣綜理其事三十年以巡捕三隸之乾隆四十六年增為五營舊設有協理刑名事務部臣一人乾隆四十三年省如步軍統領有以都統副都統任者仍用部臣一人協理左右翼步軍翼尉每翼各一人八旗步軍協尉每旗各三人步軍副尉每旗各三人捕盜校每旗滿洲三人蒙古漢軍各一人步軍校每旗滿洲二十有一人蒙古漢軍各八人委署步軍校每旗滿洲五人蒙古漢軍各二人翼尉協尉副尉掌董率守衛捕盜步軍掌緝捕盜賊步軍校掌分泛警夜翼尉本名總尉協尉本名副尉副尉本名參尉乾隆十九年改今名所屬領催二千二十八人步軍一萬八千七百二十六人捕盜步軍三百二十人又增步軍二千二十六人步軍統領衙門司員員外郎滿洲二人主事滿洲二人掌句檢旗營簿書司務滿洲一人筆帖式滿洲十有二人掌簿籍文移城門官城門領滿洲十八人漢軍七人城門吏滿洲十八人漢軍七人門千總漢軍三十二人掌內城九門外城七門晨昏啓閉之節以嚴出入稽許偽城門領初名城門尉城門吏初名城門校乾隆十九年改今名其員額內城每門各二人外城每門各一人門千總初為指揮千户順治四年改置內外城每門各二人所屬門甲三百二十人門軍六百四十人又炮手每門各二人信炮官總管滿洲一人司信炮官漢軍旗各一人掌守白塔信炮順治十年設乾隆八年定歸於步軍統領管轄又十紫禁城內西筒子河舊置步軍校二人步軍四人以偹緊急差傳乾隆四十八年增置協尉一員步軍六十名移駐造辦處外圍地方焉巡捕五營中營副將一人遊擊一人都司一人守備四人千總十人把總二十人南營參將一人遊擊一人都司一人守偹五人千總十二人把總二十四人北營參將一人遊擊一人都司一人守備三人千總八人把總十六人左營參將一人都司一人守備三人千總八人把總十六人右營參將一人遊擊一人都司一人守備三人千總八人把總十六人掌分泛防守譏察巡邏初設三營乾隆四十六年增左右二營共置官一百七十一人增兵四千九百名合為一萬仍撥兵二千依健鋭營制以時操演各營置有外委千總把總以司協防差操之事臣等謹按都城為四方會極民物殷繁故董正之司自古特加慎重我朝置步軍統領之職掌管門禁提督京營特簡親信重臣以膺斯任綱維整飭法令謹嚴近復增廣二營添設兵辨星羅碁布規條整肅立法至為詳善焉火器健鋭虎鎗各營火器營總統六人以王公或領侍衛內大臣都統前鋒統領護軍統領兼任掌教演火器之政令康熙三十年置左右翼長各一人八旗掌關防營總每旗各一人委署翼長二人在內鳥鎗護軍參領每旗各一人副鳥鎗護軍參領每旗各二人兼管炮信每旗各一人委署鳥鎗護軍參領每旗各四人又五品頂帶花翎委署鳥鎗參領十人由鳥鎗護軍校內放仍食原餉護軍校每旗二十八人筆帖式每旗各二人掌訓練火器較試以時初制有鳥鎗驍騎參領鳥鎗驍騎校乾隆三十五年省驍騎參領以驍騎校額併入護軍校內即以副護軍參領兼管炮信委署護軍參領如今制又有鳥鎗藍翎長每旗二十八人八旗滿洲蒙古每佐領下鳥鎗護軍六人驍騎校一人健鋭營總督無定員以公侯大臣兼任掌督率所屬以時訓練乾隆十四年於八旗前鋒護軍內簡雲梯精卒千人從征金川功成凱旋寺旁命以其衆特立為健鋭雲梯營於香山實勝建屋以居之左右翼翼長各一人八旗前鋒參領每旗各一人副前鋒參領每旗各一人委署前鋒參領每旗各二人前鋒校共五十人副前鋒校共四十人筆帖式四人前鋒演習水戰漢人侍衛十人把總十人掌帥領營卒習雲梯馬步射鳥鎗馳馬躍馬舞鞭舞刀之技又於昆明湖教水戰駕船駛風咸精於其藝馬又藍翎長共五十人前鋒千人委署前鋒千人養育兵百人水手七十二人三旗虎槍營總統一人以公侯領侍衛內大臣都統簡任三旗總領各二人以內大臣前鋒護軍統領副都統侍衛七人簡用虎鎗長每旗各七人虎鎗副長每旗各筆帖式三人掌以虎鎗扈從凡遇虎豹車駕搜狩總統等日以十人前導安營後偵出入備伏弩箭康熙二十三年黑龍江將軍進精騎射善殺虎新滿洲四十人至京分𨽻上三旗始置虎鎗營設官以領之臣等謹按我朝法制周密軍威逺振康熙中特置火器營以練習鎗炮虎鎗營以格殪猛獸政一令專技精藝熟我皇上聖武維揚萬方震疊自嵗己巳復以雲梯勝兵創置健鋭營於香山嵗時親臨簡閲號令嚴明節制有方屹為干城腹心之選仰見睿謨廣運條畫精詳儲材豫而收效逺實為前古所未有也皇朝通志卷六十八
