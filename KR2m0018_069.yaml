body:
  text: 職官畧六奉天府府尹一人又令兼特簡奉天侍郎一人兼管掌一府之政轄錦州府屬初名遼陽府順治十四年改今名其首領經歴一人奉天府縣各官向俱滿漢兼用乾隆十六年定制專用旗員府丞一人掌府屬之學校治中一人通判一人臣等謹按奉天所屬錦州各官亦分載直省各門故不復敘直省文職總督直隸一人江南江西一人福建浙江一人湖北湖南一人四川一人陜西甘肅一人廣東廣西一人雲南貴州一人掌綜治軍民統轄文武考覈官吏修飭封疆直隸初設巡撫後加總督銜後又改為直隸總督仍管巡撫事又有三省總督兼轄山東河南又有宣大總督後俱省兩江總督初兼轄河南後改如今制湖廣總督初為川湖總督後定為湖廣總督四川初設巡撫後裁設總督陜甘總督初兼轄四川改轄山西後定為陜甘總督雲貴總督初兼轄廣西後定為雲貴總督又河南初設河東總督轄河南山東後省凡總督例兼右都御史銜其應否兼兵部尚書銜由吏部請定㫖奪巡撫直隸一人總督兼山東一人山西一人河南一人江蘇一人安徽一人江西一人福建一人浙江一人湖北一人湖南一人陜西一人甘肅一人總督兼廣東一人廣西一人雲南一人貴州一人掌宣布設順徳意撫安齊民修明政刑興革利弊直隸初天巡撫正保巡撫宣府巡撫後併定為直隸巡撫以總督兼管江南初設廬鳯巡撫後定為安徽巡撫江西初設南贛巡撫湖北初設鄖陽巡撫後俱省湖南初設偏沅巡撫後改為湖南巡撫陜西初設延綏巡撫寧夏巡撫後俱省凡巡撫例兼右副都御史銜其應否兼兵部侍郎銜由吏部請㫖定奪臣等謹按督撫之設雖沿有明舊制而損益得中措置咸當封疆大吏職任崇而掄擇慎我皇上勵精圖治宵旰勤求無時不以吏治民生為念慶讓予奪至正大公無不凛肅朝章交相感勵洵為郅隆之極軌矣漕運各官總督漕運一人掌督理漕輓以足國儲凡收糧起運過淮抵通皆以時稽核催儹而綜其政令巡漕御史淮安一人濟寧一人天津一人通州一人掌稽察所巡之地以肅漕政以科道道分簡充一年而代順治七年裁巡漕御史以糧押雍正七年復分遣御史稽察乾隆二年定制如今額督糧道江南二人山東河南江西浙江湖南湖北各一人掌監察克糧督押運船而治其政令臣等謹按福建陜西廣東雲南貴州皆有糧道甘肅有巴里坤糧道皆非總漕所轄故别載司道篇中同知通判管糧同知山東武定一人江南江寧蘇州松江鳯陽各一人浙江湖州一人通判山東濟南兖州東昌泰安曹州各一人河南歸徳衛輝懷慶各一人江南蘇州安慶寧國池州太平廬州揚州松江鎮江徐州淮安各一人浙江杭州嘉興各一人江西南昌吉安臨江各一人湖北武昌漢陽黄州安陸徳安荆州各一人湖南長沙衡州岳州各一人押運同知通判山東一人河南一人江南七人浙江三人江西二人湖北一人湖南一人其名有管糧押運之别而所司事則一也漕運武職漕標副將一人遊擊一人都司二人守備二人管理塘務一人千總四人把總十人掌催䕶糧艘領運守備五人衛守備九人守禦所千總十三人千總一百八十六人隨營効力武舉每幫一人掌領運漕糧臣等謹按明初行支運之法軍民並任其事其後變為兑運又變為長運民雖免於輸將失業而軍民交兑不免需索之弊我朝改為官收官兑酌定贈貼官為支給軍民兩便實為良法列聖軫念民食湛恩特霈皇上恩及運丁曲加體恤運軍挂欠有寛免之條黎庶豐盈有倉箱之積洵前古所莫能及也河道各官河道總督江南一人山東河南一人直隸以總督兼管南河總督掌黄淮㑹流入海洪澤湖汕黄濟運南北運河洩水行漕及爪洲江工支河湖港疏濬隄防之事東河總督掌黄河南下汶水分流運河蓄洩及支河湖港疏濬隄防之事順治初止設總河一人雍正二年河南設副總河一人七年分設如今額初俱兼兵部尚書右都御史銜乾隆四十八年改給兵部侍郎右副都御史銜各道江南河庫道一人江蘇淮揚道一人直隸永定道一人專司河務直隸清河道霸昌道通永道天津道大名道各一人江南淮徐海道一人河南開歸陳許道河北道各一人以巡道兼司河務併見下文管河各員同知二十七人通判二十五人州同十人州判二十人縣丞七十三人主簿六十九人巡檢二十五人吏目二人典史四人兼管河務知縣十八人各掌沿河隄堰壩牐嵗修搶修及挑濬淤淺導引泉流并江防海防各工程同知以下為專司知縣為兼職牐官四十三人掌司牐之啟閉以時蓄洩河道武職江南河標副將二人遊擊一人都司三人守備二人管理塘務一人千總八人把總十有六人河東河標副將一人遊擊二人都司一人守備二人管理塘務一人千總六人把總十有二人掌催䕶工程巡查差操之事江南河營㕘將一人遊擊二人守備二十人千總十有七人把總三十人葦蕩營㕘將一人守備二人千總二人把總二人山東黄河運河營守備一人千總五人把總二人東昌徳州二衛管河守備各一人徳州運河南北兩岸管河千總各一人河南豫河懷河二營守備各一人協辦守備各一人千總四人把總三人直隸永定河河營守備一人千總九人把總十有五人皆掌河工調遣及守汛防險之事臣等謹按我聖祖仁皇帝軫念河防親臨相度如以清敵黄之法浚張福口引河築歸仁隄疏人字芒稻諸河改中河運道而移仲莊閘於楊家莊凡所指畫悉為治河典則世宗憲皇帝命發帑金數百萬增築髙家堰利賴貽諸奕世我皇上法祖勤民於河工重務尤為厪念六舉南巡之典閲視河隄睿裁指授如堅閉髙郵三壩髙堰五壩定清口水誌以時拆築開陶莊引河導黄使北加甃髙堰甎工接築徐州石隄諸大興作無不條畫周詳是以弊革利興安瀾永慶自古平成之績固未有盛於今日者也鹽政鹽政長蘆兩淮各一人由兼理特㫖簡用福建甘肅四川兩廣以總督兩浙雲貴均以巡撫管理河東以山西巡撫管理掌弊羣吏糾其徵收督催之不如法者以時審其價而酌劑之國初承明制各省置巡鹽御史後定為鹽政其首領經厯長蘆山東河東兩淮兩浙兩廣各一人知事長蘆河東兩淮兩廣各一人巡檢兩淮二人都轉鹽運使司運使長蘆山東河東兩淮兩廣各一人鹽道兩浙福建陜西四川雲南各一人其餘各直省行銷地方鹽法多由駐劄省城守巡道兼理掌督察塲民之生計與商之行息而平其鹽價初定兩浙福建運使各一人後改為道員分司運同長蘆山東河東兩廣各一人運副兩浙一人運判長蘆二人山東兩浙各一人兩淮三人掌佐運使鹽道之事監掣同知兩淮二人掌掣鹽之政令提舉司提舉雲南三人分轄鹽井之政大使鹽課司大使長蘆山東各十人河東三人兩淮二十三人兩浙三十二人福建十五人陜西一人廣東十三人四川七人雲南九人掌鹽場及池井之務鹽引批驗所大使長蘆山東兩淮各二人兩浙四人兩廣一人掌批驗鹽引之出入庫大使長蘆山東河南兩淮兩浙福建兩廣四川雲南各一人掌鹽課之出納臣等謹按我朝正定鹽法特簡部院及内務府官員兼充或定制以督撫兼理以重其任因地制宜綱維整肅復以時㑹計其奏課酌劑其價值之輕重與夫鹽法之更革者奏聞裁定所以制海場池井之宜以資生計於編氓者規制靡不詳備焉學政提督學政順天山東山西河南江蘇安徽江西福建浙江湖北湖南四川廣東廣西雲南貴州各一人陜西甘肅一人以侍郎京堂翰詹科道部屬等官充奉天府一人以府丞充福建臺灣府一人以臺灣道充掌學校之事三年而代簡國初各省設督學道康熙二十三年改以京員用雍正四年定制各省學道皆改為學院其以部屬簡任者加翰林院編修檢討銜儒學各府㕔等儒學教授奉天二人直隸十人山東十人山西十人河南九人江蘇八人安徽八人江西十有三人福建十人浙江十有一人湖北九人湖南九人陜甘十有六人四川十有二人廣東十人廣西十有一人雲南十有五人貴州十有三人各州儒學學正奉天四人直隸二十有二人山東十有一人山西十有六人河南十人江蘇六人安徽九人江西二人福建二人浙江一人湖北七人湖南七人陜甘二十三人四川十有八人廣東十人廣西十有二人雲南三十人貴州十有四人各㕔縣儒學教諭奉天一人直隸一百十有五人山東九十有一人山西六十有一人河南九十有八人江蘇四十有六人安徽四十有八人江西七十有五人福建五十有八人浙江七十有六人湖北五十有四人湖南五十有七人陜甘六十有四人四川八十有六人廣東七十有三人廣西四十有二人雲南三十有二人貴州三十有三人各府㕔州縣儒學訓導奉天四人直隸一百四十人山東一百十人山西九十有五人河南一百五人江蘇五十有九人安徽六十有四人江西九十有一人福建七十有二人浙江八十有八人湖北七十人湖南七十有七人陜西一百三十有四人四川一百二十人廣東九十有四人廣西六十有三人雲南七十有三人貴州六十人掌訓迪之事臣等謹按我朝右文重道郅治光昌各省學政俱以京員掄用我皇上復加意整飭凡學政受事必訓諭諄至期以端士習而正文體夀考作人洵超越前古云闗税各差闗税監督京師崇文門正監督一人以大臣左翼簡充副監督一人由内務府奏充右翼各一人以大臣人以簡充直隸天津闗一人以鹽政兼管通州二坐糧㕔兼管山海闗一人以四五品京堂及部院内務府司員差充張家口殺虎口各一人以部院司員差充潘桃口一人以多倫諾爾同知管理龍泉紫荆竒峯五虎固闗白石倒馬茨溝插箭嶺馬水口各一人以提督兼管委㕘將以下監收三座塔八溝烏蘭哈達各一人以理藩院司員充奉天牛馬税一人以部院司員差充中江一人以元盛京將軍衙門章京及五部司員差充山西武城一人以巡撫兼管委交城縣知縣監收歸化城一人以巡撫兼管委道員監收山東臨清闗一人以巡撫兼管委臨清州知州監收江南海闗一人以江南巡撫管理委松太道監收滸墅闗一人以織造兼管淮安宿遷闗一人以内務府司員充揚闗一人以巡撫管理委巡道監收龍江西新闗一人以織造兼管鳯陽闗一人以道員管理蕪湖闗一人以安徽巡撫管理委巡道監收江西九江闗一人以道員管理贛闗一人以巡撫管理委巡道監收福建海闗一人以將軍兼收閩安闗一人以巡撫兼管委福州府同知監收浙江海闗一人以巡撫兼管委道員監收南北新闗一人以織造兼管湖北武昌厰一人荆闗一人以巡撫兼管委員監收湖南辰闗一人以巡撫兼管委辰州府監收四川夔闗一人以總督兼管委夔州府監收打箭鑪一人以同知兼管廣東海闗一人以内務府司員簡充太平闗一人以巡撫兼管委道員監收廣西梧厰潯厰各一人以巡撫管委梧州潯州各知府監收掌頒其禁令以安行旅通財賄爰繫之税以便詗㡬以佐船國家經費凡𣙜百貨者為户部分司𣙜竹木及鈔者為工部分司臣等謹按我朝釐正闗𣙜寛政頻施前代無名之繁賦芟除殆盡而督以重臣涖以封疆大吏闗津則有親填循環稽考之簿海舶則有貿易外洋之照内口内河之經歴遼逺者皆給之照以辨姦良所以體恤商賈杜絶姦欺者規制至為詳悉葢利用通財盡革往代無藝之征而垂億萬年永久之制也司道承宣布政使司布政使直隸山東山西河南江寧蘇州安徽江西福建浙江湖北湖南陜西甘肅四川廣東廣西雲南貴州各一人掌一省之政司錢穀之出納初置左右布政使各一人康熙六年去左右銜每省止設一人初以直隸近在㡬甸不設