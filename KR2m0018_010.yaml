body:
  text: 氏族略十總論賜氏覺羅氏吳拜官內大臣兼佐領封二等伯諡果壯本姓瓜爾佳氏納木泰官兵部尚書封三等男本姓舒穆祿氏扈爾漢官一等大臣封三等子本姓佟佳氏卓納任牛録本姓納喇氏滿平阿本姓兆佳氏皆大學士太祖髙皇帝賜姓覺羅氏車克官祕書院加少師兼太子太師諡文端本姓瓜爾佳氏帶翰本姓劉氏皆太宗文皇帝賜姓覺羅氏赫舍哩氏額爾德尼授副將世職因編輯宗國書諡文成本姓納喇氏太文皇帝賜姓赫舍哩氏翁金官翰林院侍讀學士係員外郎渾金養子原籍江西本姓無考聖祖仁皇帝命編入滿洲賜姓赫舍哩氏烏嚕氏布恕庫官副都統本姓溫徹亨氏太宗文皇帝賜姓烏嚕氏納喇氏準泰官廣東巡撫本高麗那姓奉旨賜姓滿洲之納喇氏勵氏勵杜納官禮部尚書諡文恪本姓厲氏聖祖仁皇帝賜姓勵氏改氏蒙鄂囉氏本姓伊爾根覺羅氏族其繁分居東西二寨西寨改為蒙鄂囉氏巴雅喇氏本姓伊爾根覺羅氏東寨改為巴雅喇氏瑚什布本姓無考為莽愛養子承襲雲騎尉改姓巴雅喇氏納喇氏星根達爾漢蒙古人本姓土默特因滅納喇姓部據其地改姓納喇氏昂古里星古里輝發人本姓伊克達哩後依呼蘭人噶揚噶土墨圖姓納喇氏遂改姓納喇氏赫舍哩氏富明阿任雲騎尉本姓薩克達氏丹世世祖章皇帝命承襲伊舅烏爾職因改姓赫舍哩氏富察氏烏魯理本姓烏蘇氏大學士世宗憲皇帝命繼其舅武英殿一等公富寧安為嗣因改姓富察氏庫雅拉氏敏森本姓那木都魯氏祖糾納世祖章皇帝命承襲其妻之外世職雲騎尉因改姓庫雅拉氏博爾濟吉特氏顔達色為輕車都尉班濟養子本姓無考班濟無嗣世宗憲皇帝命其承襲因改姓博爾濟吉特氏伊拉哩氏額禮懇本姓納喇氏其祖圖魯倫遷居伊罕阿林城改姓伊拉哩氏烏爾達氏嘉渾本姓烏靈阿氏後移居觀音屯改姓烏爾達氏烏蘇氏額爾登布本姓無考為穆成額養子奉氏特恩命其承襲雲騎尉因改姓烏蘇塔塔爾氏伊常阿本姓實寶禪氏其舅祖寨楞無嗣奉特思命其承襲雲騎尉因改姓塔塔爾氏伊爾根覺羅氏騰起本姓兆佳氏改姓伊爾根覺羅氏邱氏雍正元年聖諱同世宗憲皇帝特旨命漢人姓與至者俱加邑旁改為邱氏敬氏敬華南官翰林院編修本姓茍氏改姓敬氏臣等謹按茍氏文氏皆本敬姓宋時以避翼祖諱改為二氏今華南之改敬亦可云復姓也以部為氏瓜爾佳氏見八旗氏族通譜鈕鈷祿氏見八旗氏族通譜赫舍哩氏見八旗氏族通譜納喇氏見八旗氏族通譜科爾沁氏見八旗氏族通譜察哈爾氏見八旗氏族通譜輝和氏見八旗氏族通譜葉赫氏見八旗氏族通譜土默特氏見元史國語解巴顔氏見遼史國語解完顔氏見金史國語解富察氏見八旗氏族通譜烏蘇氏見遼史國語解克哷氏見元史國語解溫特赫氏見金史國語解尼瑪察氏見金史國語解溫都氏見金史國語解烏梁海氏見元史國語解哈蘇特氏見元史國語解阿克占氏見金史國語解阿爾拉氏見元史國語解圖克坦氏見金史國語解珠格氏見金史國語解圖們氏見元史國語解拜格氏見金史國語解珠佳氏見元史國語解珠嚕氏見金史國語解卓津氏見遼史國語解伊喇氏見元史國語解喀喇氏見元史國語解兆壘氏見元史國語解尼瑪哈氏見元史國語解莽果氏見元史國語解郭爾羅斯氏見薩國史內扎克傳翁牛特氏見薩國史內扎克傳烏喇特氏見薩國史內扎克傳扎拉氏見元史國語解巴林氏見元史國語解奈曼氏見元史國語解蒙古氏見金史國語解臣等謹按鄭志以國為氏以部為氏分列為二今考滿洲蒙古如葉赫科爾沁土默特察哈爾等姓自我國家肇興東土聖德逺敷凡屬外藩咸歸部落統列以部為氏以昭景從之盛云以地為氏馬佳氏見八旗氏族通譜棟鄂氏見八旗氏族通譜郭囉羅氏見八旗氏族通譜兆佳氏見八旗氏族通譜章佳氏見八旗氏族通譜薩克達氏見八旗氏族通譜瓦爾喀氏見八旗氏族通譜寧古塔氏見八旗氏族通譜瑚錫哈哩氏見八旗氏族通譜佟佳氏見八旗氏族通譜性佳氏見八旗氏族通譜齊佳氏見八旗氏族通譜索綽囉氏見八旗氏族通譜裕瑚嚕氏見八旗氏族通譜呼爾哈氏見八旗氏族通譜噶努氏見八旗氏族通譜卦勒察氏見八旗氏族通譜洪鄂氏見八旗氏族通譜烏蘇哩氏見八旗氏族通譜徐吉氏見八旗氏族通譜愷顔氏見八旗氏族通譜愛琿氏見八旗氏族通譜巴爾達氏見八旗氏族通譜喀喇沁氏見八旗氏族通譜賢達禪氏見八旗氏族通譜德都勒氏見八旗氏族通譜綽克秦氏見八旗氏族通譜海拉蘇氏見八旗氏族通譜禇庫爾氏見八旗氏族通譜崇果嚕氏見八旗氏族通譜穆和林氏見八旗氏族通譜蒙古楚氏見八旗氏族通譜扎嚕特氏見八旗氏族通譜巴嶽特氏見八旗氏族通譜烏嚕特氏見八旗氏族通譜覺爾察氏見八旗通志列傳老溝氏見八旗通志列傳席魯特氏見八旗通志列傳阿蘇克氏見八旗通志列傳克什克騰氏見八旗通志列傳以姓為氏鈕鈷祿氏本金姓見金史舒穆祿氏本金姓見金史那木都魯氏本金姓見金史賽密勒氏本金姓見金史尼沙氏本金姓見金史博和哩氏本金姓見金史輝羅氏本金姓見金史烏蘇占氏本金姓見金史圖們氏本金部名又金姓見金史薩察氏本金姓見金史珠爾根氏本金姓見金史額蘇哩氏本金姓見金史廣佳喇氏本金姓見金史赫書氏本金姓見金史納塔氏本金姓見金史都克達氏本金姓見金史伊喇氏本遼部名金時為姓見金史舒爾都氏本金姓見金史塔坦氏本元姓見元史沙達喇氏本元姓見元史納哈塔氏本金姓見金史富珠哩氏本金姓見金史錫爾馨氏本元姓見元史布薩氏本金姓見金史烏什拉氏本金姓見金史哈薩喇氏本金姓