body:
  text: 欽定四庫全書皇朝通志卷三十九禮畧吉禮四時享臣等謹按我朝太廟時享之制肇於建國之初粤自天聰六年二月太宗文皇帝率貝勒諸臣詣太祖高皇帝陵行時享禮八年除夕十年清明節皆親祭太祖山陵盖當未崇建宗廟之先皆親舉典禮於陵寢至天聰十年建立太廟于是大饗薦新元旦清明節中元節除夕萬夀節之禮以次舉行仰見聖朝創制鴻圖垂模奕禩禮意之精胥肇於此謹録紀篇首以昭盛軌而列聖循行之禮詳見於後我皇上覲揚繼述孝治光昭嵗舉精禋寅恭對越五十年來非舉春廵秋獮之典必躬親將事孝思肫至垂示萬年洵立隆之極則已崇徳元年七月中元節太宗文皇帝親饗太廟十二月遣官祭太廟時先期齋戒一日三年正月朔遣官祭太廟自後元旦皆遣官祭七月中元節親祭太廟時先期齋戒三日十月萬夀節遣官祭太廟自後恭遇聖節皆遣官祭五年二月清明節遣官祭太廟八月以太祖武皇帝忌辰遣官祭太廟十二月除夕遣官祭太廟時先期齋戒三日自後嵗暮皆遣官祭八年二月清明節遣官祭太廟七月中元節遣官祭太廟並告征明山東之捷順治元年九月定制時享恭奉後殿列祖列后神位于殿中寳座皆南嚮奉中殿列聖列后神位于前殿寳座太祖位南嚮列聖以昭穆序東西嚮帝后同案前殿皇帝恭詣行禮後殿遣官將事二年正月定萬夀節祭太廟儀奉㫖祭太廟禮儀讀祝致祭福陵昭陵四祖廟上香燭供酒果不必讀祝臣等謹按是時于盛京太廟崇稱為四祖廟云二月禮部言凡遇清明等節致祭太廟之期應令駐防盛京總管分率城守章京徃祭福陵昭陵兩京祖陵令城守官奠祭盛京四祖廟令守廟總管官獻酒果従之閏六月定秋祭太廟盛京四祖廟皆以七月朔用牛羊是月禮部請壇廟讀祝停讀漢文止讀滿文仍増設滿讀祝官八員一切典禮俱照本朝舊制行從之七月時享太廟世祖章皇帝親詣行禮嗣後皆親詣如儀三年正月定盛京祖廟牲禮于嵗除清明及慶賀祭如京師例牲用生四年三月定薦熟牛停止進胙肉八年二月定親祭太廟進胙肉福酒如祀圜丘儀三月定齋戒規凡祀太廟齋戒三日六月定太廟祀典嵗暮祭大月于二十九日小月于二十八日其清明節祭各官不必陪祀祭肉用生十三年六月定祭太廟日駕于黎明出宫臣等謹按順治年太廟祭祀禮制嵗以正月之孟春與萬夀節二三月之清明節四月朔七月朔十月朔十二月之嵗暮維時定制凡七上親詣或遣官致祭皆時享也自十六年七月定舉行祫祭于嵗暮見後祫祭門是為太廟祫祭之始前此十二月之祭實皆用時享之儀矣至聖祖仁皇帝時始定四時之祭專以正月孟春諏吉四月朔七月朔十月朔有事于太廟與十二月嵗暮大祫而五其每嵗遇慶辰令節皆于奉先殿行禮此則迄今恭行垂則于萬年者也康熙元年正月時享太廟親詣行禮自後每嵗時享皆親詣如常儀十一年正月飭太常寺習禮樂十二年十二月諭禮部太常寺壇廟禋祀理宜嚴肅今觀祭祀執事之人過多殊為煩雜應酌量裁减務令肅清㝷議覆祭廟執事之人及樂舞生今已遵㫖酌量裁减再考㑹典祭時祗有監察御史侍立之例其禮部漢堂官應按班行禮停其侍立得㫖是十八年五月以改營奉先殿恭奉列祖列后神牌暫安太廟遣官祗告二十年二月以奉先殿工竣遣官祗告太廟恭奉列祖列后神牌還御二十四年正月時享禮畢聖祖顧諭内閣學士太常寺卿等曰往見贊禮郎宣讀祝版至朕名聲輒不揚父前子名前經所載朕對越之次惟懼誠敬稍有未至無以昭格神靈為子孫者通名于祖父豈可涉于慢易嗣後俱應高聲朗讀無庸顧忌是月又諭内閣學士太常寺卿等曰前見太廟致祭時執事官奉福胙由兩神位間趨走于尊祖敬宗之意未協且亞獻禮俱唱為次獻亦與漢文不符爾等㑹同内閣禮部察例奏聞㝷議奏執事各官應從外旁趨走唱次獻應改為亞獻得㫖是二十五年十二月定陪祭官員不照加級有失儀者監察御史禮部官員即指名題㕘如壇例行五十三年正月命重修樂器雍正元年正月時享世宗憲皇帝親詣行禮自後並親詣如儀命廟祭派王二人散秩大臣御史各二員部屬侍衛各四員稽察失儀及扈從人等任意行走著為例十年二月命齋戒日陪祀官懸齋戒牌十一年正月命増定上香儀奉諭享祀太廟向無上香之儀朕意應確議増添至奠帛獻爵時恭立拜位無跪獻之儀大學士㑹同禮部酌古準今敬謹定議㝷議覆唐以前典制尚用三代焫蕭之禮至宋代始有上香之儀並于每位前跪三上香其奠帛獻爵亦如之爵以三獻明洪武間定制無上香奠帛之儀爵兩獻亦不跪至嘉靖改從宋制本朝㑹典因明洪武所定而酌増之有奠帛有三獻爵而無上香之儀臣等敬謹詳議大祀莫重于郊壇而孝享莫尊于配天至宗廟之禮宜與社稷壇同若同于郊壇則逾于社稷矣查祭社稷壇時皇上親詣太社太稷前跪上香則宗廟上香自應一例至奠帛獻爵太廟社稷俱不親獻是以皇上于拜位前恭立所以亞于郊壇也似應仍照舊儀疏入從之十二年五月定供列祖忌辰牌禮部遵㫖議奏嗣後恭逢列祖忌辰請製龍邊粉油木牌敬謹書寫倣齋戒牌例設案安奉于禮部大門前令司員看䕶其九門各設於潔淨寺院提督令員看䕶次日將牌繳禮部敬謹收貯其直省大小文武衙門照在京例書牌安設從之十月飭禁止擅入太廟雍正十三年九月皇上登極定三年内享太廟儀皇上親詣或遣官恭代俱用禮服作樂先期齋戒用素服冠綴纓緯視祝版用禮服時上定行持服三年之禮乾隆元年正月時享皇上親詣行禮自後並親詣如儀二年七月以營修奉先殿恭奉列祖列后神牌暫安太廟遣官祗告十月以奉先殿工竣恭奉列祖列后神牌還御遣官祗告太廟五年七月勅禮部太常寺稽載祭器六年十一月命審定太廟樂章字譜十二年十月命享廟派宗人府王公一人監視執事宗室人員奉諭向來祭享太廟獻爵獻帛例用侍衛及太常寺官朕御極後俱令用宗室人員盖因宗支繁衍實惟祖徳所貽一氣感孚昭格尤為親切且使駿奔走執豆籩有事為榮亦得服習禮儀陶鎔氣質意盖有在但演習禮節奉常實所專司宗室既非所屬未必聴其指授嗣後每逢祭祀之期著派宗人府王公一人前徃監視俾進退優嫻執事有恪以昭誠敬十三年正月命敬造太廟祭器倣古範銅十四年正月命禮部尚書侍郎敬典祀事十七年正月奏凖太廟後殿奠帛獻爵一倣前殿用宗室官之制均用覺羅官行禮又奏凖饗太廟日遇雨雪分獻官陪祀王公於兩廡廊下㦸門行禮其陪祀百官于左右門行禮三十七年大學士等遵㫖議奏太廟時享祫祭皇帝入廟之路舊制由太廟街門左門至神路右降輦贊引官恭𨗳至太廟南門入左門詣㦸門幄次今請改由廟堧北門循墻而東至㦸門前降輿少節步趨之勞從之自乾隆元年以來時享太廟皆皇上親詣行禮惟恭遇廵幸行圍之期遣官致祭儀節並見大清通禮祫祭臣等謹按鄭志祫禘一門厯叙前代五年一祫一禘之制其為典禮未能合一而祫大禘小之説紛紜不定國家定制行祫祭而未嘗行禘祭聖祖仁皇帝時禮臣議曰夏商以前有禘之祭而其制未詳漢唐以後有禘之名而與祫無别惟周以后稷為始祖以帝嚳為所自出之帝太廟中原無帝嚳之位故祫祭不及帝嚳至禘祭時乃特設帝嚳之位以稷配焉行于後代不能盡合故宋神宗時議罷禘禮明洪武初亦議罷之至嘉靖中乃立虚位祀皇初祖帝而以太祖配享事屬不經禮亦旋罷洪惟我國家受天顯命追上四祖尊稱立廟崇祀自肇祖原皇帝始盖我太祖高皇帝為太廟萬世之祖上而推所自出則締造之業以肇祖為最著今太廟祭祀四孟分祭于前殿後殿以各伸其尊嵗暮祫祭於前殿以同將其敬一嵗之中自肇祖以下屢伸祼獻仁孝誠敬已無不極五年一禘之祭不必舉行從之自世祖章皇帝肇舉祫祭嵗一舉行盖推本太宗文皇帝除夕享廟之精意以垂則于萬年煌煌乎典章明備超越萬古矣謹考祫祭之典著於篇順治十六年七月定太廟祫祭禮先是嵗暮時享前殿躬詣行禮後殿遣官致祭至是御史奏請飭典禮諸臣廣稽舊典復嵗暮祫祭之禮以彰孝治之隆疏入命禮部詳察典例以聞㝷議覆請照㑹典舉行得㫖是嵗除前一日奉後殿中殿列聖列后神牌合食前殿先期一日遣官各一人分詣後殿中殿以大祫告是日太常寺卿率屬潔蠲前殿恭設列聖列后神座於殿内肇祖原皇帝居中原皇后配興祖直皇帝左直皇后配景祖翼皇帝右翼皇后配顯祖宣皇帝次左宣皇后配太祖高皇帝次右孝慈高皇后配均南向太宗文皇帝東位西向孝端文皇后配展兩廡配享位如時享儀祭日恭奉列聖列后神位奉安于各寳座上行禮如時享儀嗣後列聖列后各以次東位西向西位東向恭奉如儀十七年三月飭工部修造祫祭神位器皿十八年十二月祫祭聖祖仁皇帝親詣行禮如儀康熙元年十二月祫祭親詣行禮如儀自後每嵗暮皆親詣行禮或遣官致祭如儀雍正元年十二月祫祭世宗憲皇帝親詣行禮如儀三年二月以聖祖仁皇帝大喪三年禮終祫祭太廟釋服即吉自後嵗暮祫祭皆親詣行禮如儀十三年十二月祫祭皇上親詣行禮如儀乾隆元年十二月祫祭親詣行禮自後嵗暮祫祭皆親詣如儀二年十一月以世宗憲皇帝三年喪終祫祭太廟釋服即吉三十七年大學士等議奏祫祭太廟皇上入廟之路改由廟堧北門循墻而東至㦸門前降輿少省步趨之勞又議奏祫祭九廟合享舊制皇上恭詣中位上香畢迭至列祖列宗神位前上香往返凡有八次今謹議肇祖原皇帝神位前皇上恭詣上香列祖列宗神位請派親王皇子八人分列隨詣上香行禮以昭敬簡從之臣等謹按我皇上䖍恭廟祀孝思純篤每嵗大祫儼恪將事禮節攸隆乾隆三十七年聖夀已逾六旬始命廷臣議定恭祀入廟之路改由廟堧北門行禮之日皇上詣中位上香遣親王皇子分列隨詣上香葢省步履之繁以致敬誠之實恭讀三十九年諭㫖有云壇廟大祀必親詣行禮朕年逾六十稍减步履之小節所以益矢誠敬也萬世子孫其敬識朕意設非年至六旬一切典章不可稍减倘䝉上天眷祐年逾六旬方可遵朕現在所行舉行訓諭煌煌昭示萬世所以祗承天祖釐定典章者無過不及垂裕萬年至深且逺矣凡嵗暮祫祭太廟禮儀詳見大清通禮奉先殿臣等謹按鄭志時享一門旁注薦新二字類叙列代薦新之儀錯見于篇中我朝自順治間定制日獻食月薦新朔望朝謁時節展拜出入啓告恭遇列祖聖誕列聖列后忌辰及諸令節慶典皆于奉先殿後殿行禮恭遇皇帝萬夀元旦冬至及國有大慶則恭奉列聖列后神位于前殿祭饗禮儀宏重典制周詳謹恭述奉先殿之禮次于太廟之後仰見聖朝盡誠盡敬追孝隆儀非前代所可幾及已順治十三年十二月世祖章皇帝命建奉先殿于景運門之東立前殿後殿均九間南嚮如太廟寢制十四年正月初安奉先殿神位祭儀禮部奏奉先殿初安神位皇上親詣致祭内大臣侍衛内府官隨行禮太常寺贊禮官贊禮樂舞生作樂各司其事以後親詣致祭俱行家人禮内府官贊禮作樂致祭之先上親請神位奉安祀殿祭畢上仍親奉安後殿行禮其元旦冬至嵗暮皇上萬夀係大節諸冊封係大禮及月朔望俱應親詣致祭内府官贊禮作樂其供獻與太廟大祀儀同立春上元四月初八端陽重陽係尋常節親詣致祭不贊禮作樂忌辰清明霜降十月朔係哀慕日期親詣致祭不贊禮作樂七夕不致祭止如常供獻中元中秋係望日常祭日期不必重行每月隨時薦新上躬詣供獻即于後殿行禮上享太廟及祭畢俱應上香燭于奉先殿行躬告禮得㫖奉先殿初次行禮宜用祝文餘俱如議十一月奉先殿告成世祖章皇帝親詣奉安神位大饗如儀十七年三月定奉先殿祫祭禮祭日遣官八員恭請四祖暨后神牌自太廟迎入奉先殿合享祭畢仍恭送神牌還太廟後殿五月改建奉先殿諭工部奉先殿享祀九廟稽考往制應除東西夾室行廊中建敞殿九間斯合制度前興工時該衙門未加詳察連兩夾室止共造九間殊為不合今宜于夾室行廊外中仍通為敞殿九間以合舊制爾部即㑹同宣徽院詳議擇日興工十八年正月聖祖仁皇帝登極十一月恭奉世祖章皇帝神主升祔奉先殿行大饗禮如儀是後遇列聖列后升祔太廟禮成即于是日恭奉神牌奉安奉先殿豫期祗告屆日行大饗禮禮成升祔奉安如儀康熙十三年定奉先殿早晚上香燭停止每日供獻九月奉仁孝皇后神位升祔奉先殿行大饗禮如儀臣等謹案雍正元年八月改上仁孝皇后尊諡其禮儀敬于太廟一門詳叙十七年閏三月奉孝昭皇后神位升祔奉先殿行大饗禮如儀臣等謹按雍正元年八月恭加孝昭皇后尊諡其禮儀俱詳叙于太廟一門十八年五月以改營奉先殿遣官祗告恭奉列祖列后神牌暫安太廟二十年二月以奉先殿工竣遣官祗告太廟恭奉列祖列后神牌還御聖祖仁皇帝親詣行禮二十八年九月奉孝懿皇后神位升祔奉先殿行大饗禮如儀臣等謹按雍正元年八月恭加孝懿皇后尊諡其禮儀俱詳叙于太廟一門三十八年十二月重定奉先殿祫祭禮奉諭元旦諸臣俱齊人衆煩擾從太廟請捧四祖神牌往來朕心不安内閣㑹同内務府禮部太常寺考典禮議奏㝷議覆嗣後請遇元旦聖節奉先殿行禮時恭迎太廟後殿四祖神牌至奉先殿行禮之處停止即于太廟後殿照奉先殿典禮供帛酒籩豆讀祝文遣官致祭從之雍正元年七月以加上列祖列后尊諡恭修飾奉先殿神牌遣官行禮三年八月以孝恭仁皇后大喪三年禮終享奉先殿釋服即吉十三年命増定上香儀如太廟禮乾隆元年三月以加上列祖列后尊諡恭修飾奉先殿神牌遣官行禮二年七月以修飾奉先殿興工恭奉列祖列后神牌暫安太廟是日皇上親詣祗告十月以奉先殿工竣恭奉列祖列后神牌還御是日皇上出景運門外跪迎神牌隨至奉先殿致祭行禮十七年十月升祔孝賢皇后神主于奉先殿王大臣等奏伏查康熙十三年孝誠仁皇后山陵禮畢升祔奉先殿未祔太廟我朝既建奉先殿與太廟同尊是以孝誠仁皇后大禮酌定升祔奉先殿以安神爽臣等原議孝賢皇后神牌升祔太廟祗係據依戴禮今敬謹詳考具奏伏候訓示奉諭㫖孝賢皇后神主遵照孝誠仁皇后之例奉安奉先殿前一日皇上親詣奉先殿祗告凡遇恭上徽號冊立冊封御經筵耕耤謁陵廵狩回鑾及諸慶典均祗告于奉先殿後殿列聖神御臣等謹案我朝列聖以來誠孝隆篤既崇建奉先殿與太廟同申孝享儀文詳備照耀簡冊至如景山之夀皇殿暢春園之恩佑寺圓明園之安佑宫避暑山莊之永佑寺等處恭奉御容之禮及移奉之嵗月謹述鉅典著于篇中以昭仁孝誠敬之極制焉夀皇殿在景山東北聖祖仁皇帝常視射較士于此雍正元年四月恭奉聖祖仁皇帝御容于中殿親詣行禮嵗時奠獻敬以為常乾隆元年十月供奉世宗憲皇帝御容于夀皇殿東室皇上親詣行禮自後香燈供獻敬以為常與中殿儀同十四年三月諭内務府移建夀皇殿于景山正中甎城㦸門明堂九室仿太廟之制而約之冬月告成十五年五月恭奉太祖太宗世祖御容列后御容于夀皇殿並定行禮供獻儀注自後並嵗時躬親展禮如儀恩佑寺在暢春園雍正三年建四年三月世宗憲皇帝恭奉聖祖仁皇帝御容嵗時展享安佑宫在圓明園乾隆三年二月皇上敬奉世宗憲皇帝御容五年四月命重建安佑宫大殿九室如太廟規制八年十一月告成敬自暢春園之恩佑寺移奉聖祖仁皇帝御容于中室奉世宗憲皇帝御容于東室定供享禮儀凡遇皇上駐蹕圓明園皆詣安佑宫行禮永佑寺在避暑山莊乾隆十五年建十六年告成恭奉聖祖仁皇帝御容于中室秋獮駐蹕時申展禮二十七年八月恭奉世宗憲皇帝御容于寺樓之東室同申展事躬詣獻享一如安佑宫之禮臣等謹案雍正四年世宗憲皇帝恭奉聖祖仁皇帝御容于恩佑寺嗣復于養心殿及圓明園之東佛堂恭奉孝恭仁皇后神位皇上祗遵前典酌禮定制無踰于節乾隆八年既移奉聖祖仁皇帝御容于安佑宫而恩佑寺則惟奉佛像自丁酉嵗冬敬建恩慕寺於暢春園仰誌慈恩亦惟供奉佛像以申瞻禮之忱恭遇孝聖憲皇后聖誕令辰及除夕上元節日大内則詣夀康宫寳座前行禮至暢春園之長春仙館避暑山莊之松鶴齋為孝聖憲皇后舊御寢宫恩慕寺為薦福重地亦惟恭詣寳座前行禮不復供奉神御伏讀戊戌年御製正月十四日作詩注云禮縁義起予惟恪奉前規不敢稍有過不及如夀皇殿向奉皇祖皇考御容而皇祖妣皇妣御容惟于除夕元旦同列祖列后神御敬奉瞻拜至圓明園之安佑宫則祇奉皇祖皇考御容未及列后惟養心殿及圓明園之東佛堂皇考時曽恭奉孝恭仁皇后神位因亦遵奉聖母神位至夀康宫雖尊奉慈闈頤慶年久但其地宜留為萬萬年奉養東朝所居奕禩所當敬守于此安奉聖母御容神位何以示垂貽久逺之圖是以不敢輕率議加以協舊典又讀御製恩慕寺瞻禮詩注云暢春園與壽康宫相同均宜留為萬萬年尊養東朝之所若於此恭奉聖母神位御容何以垂貽乆逺且皇祖神御今移奉於御園之安佑宫而恩佑寺則惟奉佛像兹恩慕寺亦遵此以報慈恩仰見聖人定制酌中立極誠孝之隆禮文之節無或過無或不及洵垂示萬年之盛軌矣功臣配享崇徳元年四月追封禮敦巴圖魯為武功郡王配享廟庭王妃並配同日追封費英東為直義公額亦都為宏毅公並入配享順治元年以武勲王揚古利配享九年六月追諡功臣圖爾格為忠義公圖賴為昭勲公配享廟庭十一年三月以多羅慧哲郡王額爾衮多羅宣獻郡王界堪多羅通達郡王雅爾哈齊配享廟庭王妃並配雍正二年正月以大學士一等公諡文襄圖海配享廟庭八年五月以和碩怡賢親王𦙍祥配享臣等謹按是月奉諭㫖凡告廟典禮所關有書王名之處仍用原名今于王配食列祖之鉅典遵書原名九年追加武勲王揚古利為英誠公直義公費英東為信勇公忠義公圖爾格為果毅公昭勲公圖賴為雄勇公文襄公圖海為忠達公神牌増書追封之號惟武勲王揚古利仍書王爵乾隆十年以大學士鄂爾泰配享廟庭十五年以定邉左副将軍固倫額駙喀爾喀扎薩克和碩超勇襄親王䇿凌配享廟庭二十年以致仕大學士張廷玉配享廟庭時饗太廟展前殿兩廡配享神座東通達郡王次武功郡王武功郡王妃次慧哲郡王慧哲郡王妃次宣獻郡王宣獻郡王妃次怡賢親王均西向西信勇公費英東次宏毅公額亦都次武勲王揚古利次果毅公圖爾格次雄勇公圖賴次忠達公大學士圖海次超勇襄親王䇿凌次襄勤伯鄂爾泰次大學士張廷玉均東向以北為上四十三年正月奉㫖禮親王代善睿親王多爾衮鄭親王濟爾哈朗豫親王多鐸克勤郡王岳託各還勲號配享廟庭㝷議定東廡叙次禮親王在宣獻郡王之下睿親王等以次叙列是年奉㫖超勇襄親王額駙䇿凌移於東廡怡賢親王之次皇朝通志卷三十九
